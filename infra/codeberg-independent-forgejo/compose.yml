services:
  engine:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    volumes:
      - engine-data:/var/lib/docker
    networks: [isolated-runner]
  runner:
    image: data.forgejo.org/forgejo/runner:13.1.0
    user: "1001:1001"
    restart: unless-stopped
    depends_on: [engine]
    command: forgejo-runner daemon -c /data/runner-config.yml
    environment:
      DOCKER_HOST: tcp://engine:2375
    volumes:
      - ./data:/data
    networks: [isolated-runner]
    security_opt:
      - no-new-privileges:true
networks:
  isolated-runner: {}
volumes:
  engine-data: {}
