#cloud-config
# Anthares: first boot for a future OCI A1 or compatible external VPS Linux host.
# No account tokens, no APK install, no social publishing or public ADB.
write_files:
  - path: /usr/local/sbin/anthares-redroid-firstboot
    owner: root:root
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      exec > >(tee -a /var/log/anthares-redroid-firstboot.log) 2>&1
      echo 'ANTHARES_REDR0ID_BOOT_BEGIN'
      # Digests verified against official Docker Hub tag API on 2026-11-13.
      # OCI A1 uses aarch64; external KVM/VPS hosts may use x86_64.
      case "$(uname -m)" in
        aarch64|arm64)
          IMAGE='redroid/redroid@sha256:3c7f9450188226bf8042c0159b9b38abe2106f1ceb0dfa45fae1cbc6409cd9bb'
          PLATFORM='linux/arm64'
          ;;
        x86_64|amd64)
          IMAGE='redroid/redroid@sha256:e6f799d56b9a9a2bbc6224b5b7a6dc744c9b4d878ac856f27f0c4ec793ef55d3'
          PLATFORM='linux/amd64'
          ;;
        *)
          echo 'ANTHARES_REDR0ID_BOOT_ARCH_UNSUPPORTED'; exit 71
          ;;
      esac
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y --no-install-recommends ca-certificates docker.io kmod adb
      if ! modprobe binder_linux devices=binder,hwbinder,vndbinder; then
        echo 'ANTHARES_REDR0ID_BINDER_MODULE_LOAD_FAILED'
        apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || exit 72
        modprobe binder_linux devices=binder,hwbinder,vndbinder || exit 73
      fi
      for dev in binder hwbinder vndbinder; do
        if [ ! -e "/dev/$dev" ]; then
          echo "ANTHARES_REDR0ID_MISSING_BINDER_$dev"
          exit 74
        fi
      done
      install -d -m 0700 /var/lib/anthares-redroid/android-data
      systemctl enable --now docker
      if docker container inspect anthares-redroid >/dev/null 2>&1; then
        echo 'ANTHARES_REDR0ID_CONTAINER_ALREADY_DEFINED'
        if [ "$(docker inspect -f '{{.State.Running}}' anthares-redroid)" != 'true' ]; then
          docker start anthares-redroid
          sleep 10
        fi
        [ "$(docker inspect -f '{{.State.Running}}' anthares-redroid)" = 'true' ] || exit 75
        echo 'ANTHARES_REDR0ID_CONTAINER_RECOVERED_OR_RUNNING'
        exit 0
      fi
      docker pull --platform "$PLATFORM" "$IMAGE"
      docker run -d --name anthares-redroid --restart unless-stopped \
        --privileged --platform "$PLATFORM" \
        -p 127.0.0.1:5555:5555 \
        -v /var/lib/anthares-redroid/android-data:/data \
        "$IMAGE"
      sleep 10
      [ "$(docker inspect -f '{{.State.Running}}' anthares-redroid)" = 'true' ] || exit 75
      echo 'ANTHARES_REDR0ID_CONTAINER_RUNNING_LOCALHOST_ONLY'
  # Local-only, credentials-free Android readiness probe. Runs on first boot
  # and later from a systemd timer; success requires Android boot completed.
  - path: /usr/local/sbin/anthares-redroid-readiness-check
    owner: root:root
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      umask 077
      install -d -m 0700 /var/lib/anthares-redroid
      STATE=/var/lib/anthares-redroid/readiness-state
      printf '%s\n' 'NOT_READY' > "$STATE"
      if [ "$(docker inspect -f '{{.State.Running}}' anthares-redroid 2>/dev/null || true)" != 'true' ]; then
        echo 'ANTHARES_REDR0ID_HEALTH_CONTAINER_NOT_RUNNING'
        exit 81
      fi
      PORT="$(docker port anthares-redroid 5555/tcp 2>/dev/null || true)"
      if [ "$PORT" != "127.0.0.1:5555" ]; then
        echo 'ANTHARES_REDR0ID_HEALTH_ADB_BIND_INVALID'
        exit 82
      fi
      # Bounded to ~7 minutes; never expose ADB beyond localhost.
      for attempt in $(seq 1 30); do
        timeout 8 adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
        RESULT="$(timeout 8 adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n' || true)"
        if [ "$RESULT" = '1' ]; then
          printf '%s\n' 'ANDROID_BOOT_READY_ADB_LOCAL' > "$STATE"
          echo 'ANTHARES_REDR0ID_HEALTH_ANDROID_BOOT_READY'
          exit 0
        fi
        sleep 5
      done
      echo 'ANTHARES_REDR0ID_HEALTH_ANDROID_NOT_READY'
      exit 83
  - path: /etc/systemd/system/anthares-redroid-health.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Anthares ReDroid Android boot and local ADB readiness check
      After=docker.service
      Wants=docker.service
      [Service]
      Type=oneshot
      TimeoutStartSec=8min
      ExecStart=/usr/local/sbin/anthares-redroid-readiness-check
  - path: /etc/systemd/system/anthares-redroid-health.timer
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Anthares ReDroid local readiness recheck after reboot
      [Timer]
      OnBootSec=10min
      OnUnitInactiveSec=15min
      Unit=anthares-redroid-health.service
      [Install]
      WantedBy=timers.target
  # Persist binder module selection across host reboot, before Docker starts.
  - path: /etc/modules-load.d/anthares-redroid.conf
    owner: root:root
    permissions: '0644'
    content: |
      binder_linux
  - path: /etc/modprobe.d/anthares-redroid.conf
    owner: root:root
    permissions: '0644'
    content: |
      options binder_linux devices=binder,hwbinder,vndbinder
runcmd:
  - [ bash, /usr/local/sbin/anthares-redroid-firstboot ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, anthares-redroid-health.timer ]
  - [ systemctl, start, anthares-redroid-health.service ]
final_message: 'Anthares first-boot attempted; inspect /var/log/anthares-redroid-firstboot.log and /var/lib/anthares-redroid/readiness-state. Android readiness is not Kwai/MacroDroid authentication.'
