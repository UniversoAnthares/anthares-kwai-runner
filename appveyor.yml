version: 1.0.{build}

image:
  - Visual Studio 2022
  - Ubuntu

platform: x64
clone_depth: 1

branches:
  only:
    - main
    - /feature\/.*/
    - /qa-.*/

skip_commits:
  files:
    - '**/*.md'
    - 'test-hub/**'

environment:
  GOPATH: C:\gopath

for:
-
  matrix:
    only:
      - image: Visual Studio 2022

  install:
    - ps: |
        $ErrorActionPreference = 'Stop'
        $go = Get-Command go -ErrorAction SilentlyContinue
        if (-not $go) { throw 'Go is unavailable on the AppVeyor Windows image' }
        go version

  build_script:
    - ps: |
        $ErrorActionPreference = 'Stop'
        Set-Location (Join-Path $env:APPVEYOR_BUILD_FOLDER 'anthares-remote-agent')
        $bad = gofmt -l .
        if ($bad) { Write-Host 'Existing files needing gofmt:'; $bad | Write-Host }
        go vet ./...
        if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
        go build -o agent.exe ./cmd/agent
        if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
        if (-not (Test-Path agent.exe)) { throw 'Windows executable missing' }

  test_script:
    - ps: |
        $ErrorActionPreference = 'Stop'
        Set-Location (Join-Path $env:APPVEYOR_BUILD_FOLDER 'anthares-remote-agent')
        go test ./... -count=1
        if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

  artifacts:
    - path: anthares-remote-agent\agent.exe
      name: anthares-remote-agent-windows

-
  matrix:
    only:
      - image: Ubuntu

  install:
    - sh: |
        set -euo pipefail
        docker version
        test -x /usr/bin/docker || command -v docker
        chmod +x ci/shared/anthares-browser-runtime-qa.sh

  build_script:
    - sh: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        p=Path('ci/shared/anthares-browser-runtime-qa.sh')
        s=p.read_text()
        old='  docker rm -f "$NAME" >/dev/null\n  start_container\n'
        new='  docker stop -t 10 "$NAME" >/dev/null\n  docker rm "$NAME" >/dev/null 2>&1 || true\n  sleep 0.5\n  start_container\n'
        if old not in s:
            raise SystemExit('QA_GRACEFUL_RESTART_PATCH_TARGET_MISSING')
        p.write_text(s.replace(old,new,1))
        PY
        export CI_PROVIDER=appveyor
        export CI_RUN_ID="${APPVEYOR_BUILD_ID:-unknown}"
        export CI_COMMIT_SHA="${APPVEYOR_REPO_COMMIT:-unknown}"
        ANTHARES_BROWSER_QA_CASES=3 bash ci/shared/anthares-browser-runtime-qa.sh

  test: off
