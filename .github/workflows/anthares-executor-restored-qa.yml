name: Anthares Executor Restored Profile QA

on:
  push:
    branches: [feature/anthares-executor-failover]
    paths:
      - 'anthares-executor/**'
      - '.github/workflows/anthares-executor-restored-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: anthares-executor-restored-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restored-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_STATE_KEY: ${{ secrets.GITLAB_STATE_KEY }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret availability without revealing values
        id: prerequisites
        shell: bash
        run: |
          key=0; token=0
          if test -n "${GITLAB_STATE_KEY:-}" || test -n "${CONTROL_TOKEN:-}"; then key=1; fi
          if test -n "${GITLAB_TOKEN:-}"; then token=1; fi
          echo "state_key_available=$key" >> "$GITHUB_OUTPUT"
          echo "gitlab_token_available=$token" >> "$GITHUB_OUTPUT"
          echo "STATE_KEY_AVAILABLE=$key"
          echo "GITLAB_TOKEN_AVAILABLE=$token"
      - name: Record blocked restore when provider secrets are unavailable
        if: steps.prerequisites.outputs.state_key_available != '1' || steps.prerequisites.outputs.gitlab_token_available != '1'
        run: |
          echo 'ANTHARES_RESTORED_PROFILE_QA=BLOCKED_SECRET_MIGRATION'
          echo 'No secret value was read or printed.'
      - name: Build executor
        if: steps.prerequisites.outputs.state_key_available == '1' && steps.prerequisites.outputs.gitlab_token_available == '1'
        run: docker build -f anthares-executor/Dockerfile -t anthares-executor:restored .
      - name: Restore encrypted profile and start Chromium
        if: steps.prerequisites.outputs.state_key_available == '1' && steps.prerequisites.outputs.gitlab_token_available == '1'
        run: |
          docker run -d --name anthares-executor-restored \
            --memory=2g --shm-size=256m \
            -e ANTHARES_EXECUTOR_TOKEN=qa-local-token \
            -e KWAI_EXPECTED_ACCOUNT=lucasrosalem \
            -e GITLAB_STATE_ENABLED=1 \
            -e GITLAB_STATE_PROJECT=87307279 \
            -e GITLAB_STATE_BRANCH=browser-state \
            -e GITLAB_STATE_SLOT=runtime \
            -e GITLAB_TOKEN="$GITLAB_TOKEN" \
            -e GITLAB_STATE_KEY="${GITLAB_STATE_KEY:-${CONTROL_TOKEN:-}}" \
            -p 18080:8080 anthares-executor:restored
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/ready >/tmp/ready.json; then break; fi
            if ! docker inspect -f '{{.State.Running}}' anthares-executor-restored 2>/dev/null | grep -q true; then
              docker logs --tail 80 anthares-executor-restored
              exit 3
            fi
            sleep 1
          done
          cat /tmp/ready.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ready.json'))
          assert d['ok'] is True and d['chromium'] is True
          state=d.get('state') or {}
          assert state.get('ok') is True and state.get('generation'), state
          print('ANTHARES_ENCRYPTED_PROFILE_RESTORE=PASS')
          PY
      - name: Verify restored Kwai identity and upload surface read-only
        if: steps.prerequisites.outputs.state_key_available == '1' && steps.prerequisites.outputs.gitlab_token_available == '1'
        run: |
          curl --fail-with-body --max-time 55 -sS \
            -H 'Authorization: Bearer qa-local-token' \
            -H 'Content-Type: application/json' \
            -d '{"job_id":"restored-${{ github.run_id }}","generation":1,"handle":"lucasrosalem"}' \
            http://127.0.0.1:18080/v1/probe | tee /tmp/probe.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/probe.json'))
          summary={k:d.get(k) for k in ('ok','identity_verified','upload_surface_verified','session_state','read_only')}
          print('ANTHARES_RESTORED_KWAI_PROBE='+json.dumps(summary,separators=(',',':')))
          assert d.get('ok') is True
          PY
      - name: Logs on failure
        if: failure() && steps.prerequisites.outputs.state_key_available == '1' && steps.prerequisites.outputs.gitlab_token_available == '1'
        run: docker logs --tail 120 anthares-executor-restored || true
      - name: Stop executor
        if: always()
        run: docker rm -f anthares-executor-restored >/dev/null 2>&1 || true

  oidc-source-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Create ephemeral recipient key
        run: |
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/recipient.pem >/dev/null 2>&1
          openssl pkey -in /tmp/recipient.pem -pubout -out /tmp/recipient.pub.pem >/dev/null 2>&1
      - name: Request repository-bound GitHub OIDC token
        run: |
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=anthares-session-migration"
          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" -o /tmp/oidc.json
          python - <<'PY'
          import json, pathlib
          token=json.load(open('/tmp/oidc.json'))['value']
          assert token.count('.') == 2 and len(token) > 100
          pathlib.Path('/tmp/oidc.token').write_text(token)
          pathlib.Path('/tmp/oidc.json').unlink()
          print('GITHUB_OIDC_TOKEN=ACQUIRED_NOT_EXPOSED')
          PY
      - name: Request encrypted Kwai handoff capsule from Render
        run: |
          python - <<'PY'
          import json
          request={'id_token':open('/tmp/oidc.token').read(),'public_key_pem':open('/tmp/recipient.pub.pem').read()}
          open('/tmp/request.json','w').write(json.dumps(request,separators=(',',':')))
          PY
          code=$(curl --silent --show-error --max-time 90 -o /tmp/capsule.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/request.json \
            https://anthares-browser-qa-render-v2.onrender.com/migration/github-oidc-capsule)
          rm -f /tmp/request.json /tmp/oidc.token
          echo "HANDOFF_HTTP=$code"
          if test "$code" != 200; then
            python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/capsule.json'))
              print('HANDOFF_REJECTED='+json.dumps(d,separators=(',',':'))[:1000])
          except Exception:
              print('HANDOFF_REJECTED_NON_JSON')
          PY
            exit 3
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/capsule.json'))
          assert d.get('version') == 3 and d.get('alg') == 'RSA-OAEP-256+A256GCM'
          assert d.get('source_identity_verified') is True and int(d.get('cookie_count',0)) > 0
          for key in ('wrapped_key','nonce','ciphertext','aad'):
              assert isinstance(d.get(key),str) and len(d[key]) > 8
          print('ANTHARES_OIDC_SOURCE_HANDOFF=PASS')
          print('SOURCE_IDENTITY_VERIFIED=true')
          print('COOKIE_COUNT='+str(d['cookie_count']))
          print('LOCAL_STORAGE_COUNT='+str(d.get('local_storage_count',0)))
          PY
      - name: Destroy ephemeral handoff material
        if: always()
        run: rm -f /tmp/recipient.pem /tmp/recipient.pub.pem /tmp/capsule.json /tmp/oidc.token /tmp/oidc.json /tmp/request.json
