name: Anthares Studio G5 ACF Read Path Canary
on:
  push:
    branches: [coord/studio-g4-g5-20261116]
    paths:
      - .github/workflows/studio-g5-runtime-canary.yml
      - tools/studio-g5-runtime-canary.py
permissions:
  contents: read
concurrency:
  group: anthares-studio-g5-runtime-read-canary-20261117
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile source and remote procedure
        run: |
          python3 - <<'PY'
          import ast,pathlib,re
          s=pathlib.Path('tools/studio-g5-runtime-canary.py').read_text(encoding='utf8')
          ast.parse(s)
          m=re.search(r'REMOTE=r"""(.*?)"""',s,re.S)
          assert m
          compile(m.group(1),'g5_canary_remote.py','exec')
          print('G5_CANARY_SYNTAX=PASS')
          PY
      - name: Compare legacy and ACF mode in same read-only WP-CLI process
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python3 tools/studio-g5-runtime-canary.py
