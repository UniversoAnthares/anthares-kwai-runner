name: Kwai Codespaces Chrome Desktop Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kwai-codespaces-browser-smoke.yml'
      - '.kwai-codespaces-smoke-trigger'
permissions:
  contents: read
jobs:
  debian-desktop-smoke:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install cloud desktop in Codespaces-equivalent container
        run: bash .devcontainer/kwai-install.sh
      - name: Launch private noVNC and Chrome (no Android)
        run: bash .devcontainer/kwai-start.sh
      - name: Verify actual cloud desktop, Chrome CDP and private guard
        run: |
          python3 - <<'PY'
          import json,socket,time,urllib.request
          targets={
            'novnc':'http://127.0.0.1:6080/vnc.html',
            'guard':'http://127.0.0.1:8765/health',
            'chrome_cdp':'http://127.0.0.1:9222/json/version',
          }
          results={}
          for name,url in targets.items():
            for attempt in range(35):
              try:
                with urllib.request.urlopen(url,timeout=3) as r:
                  body=r.read(4096)
                  assert r.status==200
                  if name=='novnc': assert b'noVNC' in body or b'vnc' in body.lower()
                  if name=='guard': assert json.loads(body)['identity_verified'] is False
                  if name=='chrome_cdp': assert 'Browser' in json.loads(body)
                  results[name]='ok'
                  break
              except Exception as exc:
                if attempt==34: raise RuntimeError(name+' failed: '+type(exc).__name__) from exc
                time.sleep(1)
          for port in (5900,):
            with socket.create_connection(('127.0.0.1',port),timeout=4): pass
          assert len(results)==3
          print('KWAI_CODESPACE_DESKTOP_SMOKE='+json.dumps({
            'novnc':True,'guard':True,'chrome_cdp':True,'vnc_loopback':True,
            'identity_verified':False,'android_used':False,
            'credentials_used':False,'synthetic_only':True
          }))
          PY
      - name: Verify real Chrome inspector stays fail-closed without login
        run: |
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8765/',timeout=4) as r:
            page=r.read().decode()
          match=re.search(r'name="csrf" value="([^"]+)"',page)
          assert match, 'private CSRF field missing'
          data=urllib.parse.urlencode({'csrf':match.group(1)}).encode()
          req=urllib.request.Request(
            'http://127.0.0.1:8765/check',
            data=data,method='POST',
            headers={'Accept':'application/json','Content-Type':'application/x-www-form-urlencoded'}
          )
          with urllib.request.urlopen(req,timeout=48) as r:
            evidence=json.load(r)
          assert evidence['chrome_connected'] is True, evidence
          assert evidence['identity_verified'] is False, evidence
          assert evidence['persistence_permitted'] is False, evidence
          assert evidence['server_identity_verified'] is False, evidence
          with urllib.request.urlopen('http://127.0.0.1:9222/json/version',timeout=4) as r:
            assert 'Browser' in json.load(r), 'Chrome stopped after identity inspection'
          print('KWAI_CODESPACE_IDENTITY_SMOKE='+json.dumps({
            'inspector_connected':True,'identity_verified':False,
            'persistence_permitted':False,'chrome_survived':True,
            'credentials_used':False
          }))
          PY
      - name: Verify remote Chrome can load Kwai login site (no credentials)
        run: |
          timeout 55s bash -c '"$HOME/.kwai-remote-private/venv/bin/python" - <<'"'"'PY'"'"'
          import asyncio,json
          from urllib.parse import urlsplit
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser=await asyncio.wait_for(
                      p.chromium.connect_over_cdp("http://127.0.0.1:9222"),timeout=8)
                  page=await browser.contexts[0].new_page()
                  try:
                      response=await page.goto(
                          "https://www.kwai.com/",wait_until="domcontentloaded",timeout=25000)
                      await page.wait_for_timeout(1000)
                      url=urlsplit(page.url)
                      result={
                          "origin": url.scheme+"://"+(url.hostname or ""),
                          "http_status": response.status if response else None,
                          "page_title": (await page.title())[:80],
                          "login_controls_found": (
                              await page.get_by_text("Fazer login",exact=True).count()
                              +await page.get_by_text("Log in",exact=True).count()
                          )>0,
                          "authenticated":False,
                          "credentials_used":False,
                      }
                      print("KWAI_CODESPACE_WEB_REACH="+json.dumps(result,ensure_ascii=False))
                      assert url.scheme=="https" and url.hostname=="www.kwai.com",result
                      assert response and response.status<400,result
                  finally:
                      await page.close()
                      await browser.close()
          asyncio.run(main())
          PY'
      - name: Exercise actual Chrome DOM account menu without credentials
        run: |
          timeout 45s "$HOME/.kwai-remote-private/venv/bin/python" - <<'PY'
          import asyncio,json,runpy
          from playwright.async_api import async_playwright
          mod=runpy.run_path(".devcontainer/kwai-identity-guard.py",run_name="kwai_menu_test")
          inspect=mod["inspect_open_account_menu"]
          open_menu=mod["open_account_menu_in_probe_page"]

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.connect_over_cdp("http://127.0.0.1:9222")
                  page=await browser.contexts[0].new_page()
                  await page.route("https://www.kwai.com/qa-account-menu",
                                   lambda route: route.fulfill(status=200,content_type="text/html",
                                       body="<html><body>synthetic fixture</body></html>"))
                  try:
                      await page.goto("https://www.kwai.com/qa-account-menu")
                      await page.set_content('<div role="menu"><span>Lucas Rosalem</span><button>Log out</button></div>')
                      display_name_only=await inspect(browser.contexts[0])
                      assert display_name_only["account_menu_logout_visible"] is True,display_name_only
                      assert display_name_only["account_menu_profile_link_matches"] is False,display_name_only

                      await page.set_content('<div role="menu"><a href="/@wrong.account">Lucas Rosalem</a><button>Log out</button></div>')
                      wrong_account=await inspect(browser.contexts[0])
                      assert wrong_account["account_menu_logout_visible"] is True,wrong_account
                      assert wrong_account["account_menu_profile_link_matches"] is False,wrong_account

                      await page.set_content('<div role="menu"><a href="/@universo.anthares">Lucas Rosalem</a><button>Log out</button></div>')
                      correct_account=await inspect(browser.contexts[0])
                      assert correct_account["account_menu_logout_visible"] is True,correct_account
                      assert correct_account["account_menu_profile_link_matches"] is True,correct_account

                      await page.set_content('<div role="menu"><a href="/@universo.anthares">Lucas Rosalem</a><button>Log in</button></div>')
                      logged_out=await inspect(browser.contexts[0])
                      assert logged_out["account_menu_logout_visible"] is False,logged_out
                      assert logged_out["account_menu_profile_link_matches"] is False,logged_out
                      await page.set_content(
                          '<img id="avatar" alt="account avatar" '
                          'style="position:fixed;top:8px;right:10px;width:32px;height:32px" '
                          'src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" '
                          'onclick="document.getElementById(\'dropdown\').style.display=\'block\'">'
                          '<div id="dropdown" role="menu" style="display:none">'
                          '<a href="/@wrong.account">Lucas Rosalem</a><button>Log out</button></div>'
                      )
                      before=await inspect(browser.contexts[0])
                      assert before["account_menu_logout_visible"] is False,before
                      assert await open_menu(page) is True
                      after=await inspect(browser.contexts[0])
                      assert after["account_menu_logout_visible"] is True,after
                      assert after["account_menu_profile_link_matches"] is False,after
                      await page.set_content('<div role="menu"><button>Log in</button></div>')
                      assert await open_menu(page) is False
                      print("KWAI_CODESPACE_ACCOUNT_MENU_DOM="+json.dumps({
                          "display_name_only_detected":True,"wrong_account_rejected":True,
                          "exact_menu_profile_accepted":True,"signed_out_rejected":True,
                          "closed_menu_auto_opened":True,"no_avatar_fails_closed":True,
                          "credentials_used":False,"synthetic_only":True
                      }))
                  finally:
                      await page.close()
                      await browser.close()
          asyncio.run(main())
          PY
