name: Kwai Codespaces Chrome Desktop Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kwai-codespaces-browser-smoke.yml'
      - '.kwai-codespaces-smoke-trigger'
permissions:
  contents: read
jobs:
  debian-desktop-smoke:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install cloud desktop in Codespaces-equivalent container
        run: bash .devcontainer/kwai-install.sh
      - name: Launch private noVNC and Chrome (no Android)
        run: bash .devcontainer/kwai-start.sh
      - name: Verify actual cloud desktop, Chrome CDP and private guard
        run: |
          python3 - <<'PY'
          import json,socket,time,urllib.request
          targets={
            'novnc':'http://127.0.0.1:6080/vnc.html',
            'guard':'http://127.0.0.1:8765/health',
            'chrome_cdp':'http://127.0.0.1:9222/json/version',
          }
          results={}
          for name,url in targets.items():
            for attempt in range(35):
              try:
                with urllib.request.urlopen(url,timeout=3) as r:
                  body=r.read(4096)
                  assert r.status==200
                  if name=='novnc': assert b'noVNC' in body or b'vnc' in body.lower()
                  if name=='guard': assert json.loads(body)['identity_verified'] is False
                  if name=='chrome_cdp': assert 'Browser' in json.loads(body)
                  results[name]='ok'
                  break
              except Exception as exc:
                if attempt==34: raise RuntimeError(name+' failed: '+type(exc).__name__) from exc
                time.sleep(1)
          for port in (5900,):
            with socket.create_connection(('127.0.0.1',port),timeout=4): pass
          assert len(results)==3
          print('KWAI_CODESPACE_DESKTOP_SMOKE='+json.dumps({
            'novnc':True,'guard':True,'chrome_cdp':True,'vnc_loopback':True,
            'identity_verified':False,'android_used':False,
            'credentials_used':False,'synthetic_only':True
          }))
          PY
      - name: Verify real Chrome inspector stays fail-closed without login
        run: |
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8765/',timeout=4) as r:
            page=r.read().decode()
          match=re.search(r'name="csrf" value="([^"]+)"',page)
          assert match, 'private CSRF field missing'
          data=urllib.parse.urlencode({'csrf':match.group(1)}).encode()
          req=urllib.request.Request(
            'http://127.0.0.1:8765/check',
            data=data,method='POST',
            headers={'Accept':'application/json','Content-Type':'application/x-www-form-urlencoded'}
          )
          with urllib.request.urlopen(req,timeout=48) as r:
            evidence=json.load(r)
          assert evidence['chrome_connected'] is True, evidence
          assert evidence['identity_verified'] is False, evidence
          assert evidence['persistence_permitted'] is False, evidence
          assert evidence['server_identity_verified'] is False, evidence
          with urllib.request.urlopen('http://127.0.0.1:9222/json/version',timeout=4) as r:
            assert 'Browser' in json.load(r), 'Chrome stopped after identity inspection'
          print('KWAI_CODESPACE_IDENTITY_SMOKE='+json.dumps({
            'inspector_connected':True,'identity_verified':False,
            'persistence_permitted':False,'chrome_survived':True,
            'credentials_used':False
          }))
          PY
      - name: Verify remote Chrome can load Kwai login site (no credentials)
        run: |
          timeout 55s bash -c '"$HOME/.kwai-remote-private/venv/bin/python" - <<'"'"'PY'"'"'
          import asyncio,json
          from urllib.parse import urlsplit
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser=await asyncio.wait_for(
                      p.chromium.connect_over_cdp("http://127.0.0.1:9222"),timeout=8)
                  page=await browser.contexts[0].new_page()
                  try:
                      response=await page.goto(
                          "https://www.kwai.com/",wait_until="domcontentloaded",timeout=25000)
                      await page.wait_for_timeout(1000)
                      url=urlsplit(page.url)
                      result={
                          "origin": url.scheme+"://"+(url.hostname or ""),
                          "http_status": response.status if response else None,
                          "page_title": (await page.title())[:80],
                          "login_controls_found": (
                              await page.get_by_text("Fazer login",exact=True).count()
                              +await page.get_by_text("Log in",exact=True).count()
                          )>0,
                          "authenticated":False,
                          "credentials_used":False,
                      }
                      print("KWAI_CODESPACE_WEB_REACH="+json.dumps(result,ensure_ascii=False))
                      assert url.scheme=="https" and url.hostname=="www.kwai.com",result
                      assert response and response.status<400,result
                  finally:
                      await page.close()
                      await browser.close()
          asyncio.run(main())
          PY'
