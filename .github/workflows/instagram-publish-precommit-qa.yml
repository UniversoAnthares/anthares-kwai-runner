name: CORTES Instagram final submit-slot gate QA
on:
  push:
    branches: [fix/instagram-irreversible-submit-deadline-20261112]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install --quiet imageio-ffmpeg pillow
          python -m py_compile tools/cortes_instagram_direct_cloud.py
          python -m unittest discover -s tests -p 'test_instagram_direct_cloud.py' -v
          node --check infra/neon-cortes-queue/index.mjs
          node --test tests/test_instagram_deadline_pacing.mjs
