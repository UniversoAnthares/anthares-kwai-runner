name: CORTES TikTok universo.anthares Windows last-resort
on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Read-only browser/session probe; never post
        type: boolean
        default: true
      proof_publish_one:
        description: Owner-authorized manual takeover only after source frozen and Neon reconciliation
        type: boolean
        default: false
# No automatic failover on a workflow failure: remote TikTok effects may be UNCERTAIN.
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-tiktok-primary-windows-last-resort
  cancel-in-progress: false
jobs:
  windows_backup:
    # Manual takeover is disarmed until the frozen primary, NOT_APPLIED evidence and
    # Neon account generation have been independently reconciled and approved.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.diagnostic_only == false && inputs.proof_publish_one == true && vars.TIKTOK_UNIVERSO_WINDOWS_TAKEOVER_APPROVED == 'true' && vars.TIKTOK_FORGEJO_PRIMARY != 'true' && vars.TIKTOK_CODEBERG_PRIMARY != 'true' }}
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      EXPECTED_TIKTOK_USERNAME: universo.anthares
      TIKTOK_PUBLISH_NOT_BEFORE_UTC: '2026-10-20T10:00:00Z'
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated hidden browser and vault dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q playwright requests cryptography
          if ($LASTEXITCODE -ne 0) { throw 'PRIMARY_WINDOWS_BROWSER_PIP_FAILED' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'PRIMARY_WINDOWS_CHROMIUM_INSTALL_FAILED' }
      - name: Confirm canonical primary TikTok browser session in Windows
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0,'tools');sys.path.insert(0,'direct-tiktok-publisher'); from cortes_tiktok_hosted_publish import preflight_vault; preflight_vault()"
          if ($LASTEXITCODE -ne 0) { throw 'PRIMARY_WINDOWS_OWNER_SESSION_UNVERIFIED' }
      - name: Publish one fenced short only after hosted failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == false && inputs.proof_publish_one == true && vars.TIKTOK_UNIVERSO_WINDOWS_TAKEOVER_APPROVED == 'true' }}
        shell: pwsh
        run: |
          python -u tools/cortes_tiktok_hosted_publish.py
          if ($LASTEXITCODE -ne 0) { throw 'PRIMARY_WINDOWS_LAST_RESORT_FAILED' }
