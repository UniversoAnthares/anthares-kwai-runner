name: CORTES TikTok universo.anthares Windows last-resort
on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Read-only browser/session probe; never post
        type: boolean
        default: true
  workflow_run:
    workflows: ['CORTES TikTok hosted canonical Neon publisher']
    types: [completed]
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-tiktok-primary-windows-last-resort
  cancel-in-progress: false
jobs:
  windows_backup:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      EXPECTED_TIKTOK_USERNAME: universo.anthares
      TIKTOK_PUBLISH_NOT_BEFORE_UTC: '2026-10-20T10:00:00Z'
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated hidden browser and vault dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q playwright requests cryptography
          if ($LASTEXITCODE -ne 0) { throw 'PRIMARY_WINDOWS_BROWSER_PIP_FAILED' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'PRIMARY_WINDOWS_CHROMIUM_INSTALL_FAILED' }
      - name: Confirm canonical primary TikTok browser session in Windows
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0,'tools');sys.path.insert(0,'direct-tiktok-publisher'); from cortes_tiktok_hosted_publish import preflight_vault; preflight_vault()"
          if ($LASTEXITCODE -ne 0) { throw 'PRIMARY_WINDOWS_OWNER_SESSION_UNVERIFIED' }
      - name: Publish one fenced short only after hosted failure
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
        shell: pwsh
        run: |
          python -u tools/cortes_tiktok_hosted_publish.py
          if ($LASTEXITCODE -ne 0) { throw 'PRIMARY_WINDOWS_LAST_RESORT_FAILED' }
