name: X Browser Hub Identity Contract
on:
  push:
    branches: [main]
    paths:
      - tools/x_local_browser_consumer.py
      - tests/test_x_browser_hub_contract.py
      - .github/workflows/x-browser-hub-contract.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate no cookie mixing, account proof, timeline cleanup, ledger
        run: python -m unittest discover -s tests -p test_x_browser_hub_contract.py -v
