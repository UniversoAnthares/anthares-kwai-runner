name: Kwai Mobile Auth Acceptance - KW02 isolated
on:
  workflow_dispatch:
  push:
    branches: [kwai-kw02-auth-ui-20261107]
    paths: ['.github/workflows/kwai-mobile-auth-acceptance.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: kwai-kw02-auth-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kw02-authenticated-creator:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Recover previously authorized encrypted native Kwai session
        shell: bash
        run: |
          set -Eeuo pipefail
          rc=0
          python3 tools/kwai_session_vault_client.py pull --path /tmp/kw02-native-session.enc || rc=$?
          if [ "${rc}" -eq 0 ] && [ -s /tmp/kw02-native-session.enc ]; then
            echo KW02_EXISTING_ENCRYPTED_SESSION_AVAILABLE=YES
          elif [ "${rc}" -eq 3 ]; then
            echo KW02_EXISTING_ENCRYPTED_SESSION_AVAILABLE=NO
          else
            echo KW02_SESSION_VAULT_UNAVAILABLE_OR_NOT_AUTHORIZED=YES
          fi
          # A failed pull is not permission to write, guess credentials or bypass OIDC.
      - name: Validate official Kwai app and remote runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/kwai_kw02_auth_creator_only.py
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 180 -o /tmp/kw02-auth-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo '96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  /tmp/kw02-auth-vault.zip' | sha256sum -c -
          mkdir -p /tmp/kw02-auth-vault
          unzip -q /tmp/kw02-auth-vault.zip -d /tmp/kw02-auth-vault
          test -s /tmp/kw02-auth-vault/MANIFEST.tsv
          ln -s /tmp/kw02-auth-vault kwai-vault
          test -s kwai-vault/MANIFEST.tsv
      - name: Prepare credential-safe native Android script
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/kw02-auth-creator.sh <<'KW02_AUTH_BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mapfile -t apks < <(find /tmp/kw02-auth-vault -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -ge 4
          timeout 150 adb install-multiple -r "${apks[@]}"
          adb shell pm path com.kwai.video | grep -q 'package:'
          adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell monkey -p com.kwai.video -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 12
          python3 kwai_state_driver.py | tee /tmp/kw02-fsm.log
          grep -q 'FSM_MAIN_REACHED' /tmp/kw02-fsm.log
          export KWAI_KW02_SKIP_REINSTALL=1
          export KWAI_KW02_PRESERVE_FOREGROUND=1
          export KWAI_KW02_LOGIN_CONTROL_PROBE=1
          export KWAI_KW02_SUPPRESS_EXTERNAL_AUTH=1
          export KWAI_KW02_MAIN_LOGIN_PROVEN=1
          export KWAI_KW02_EMAIL_NESTED=1
          if [ -s /tmp/kw02-native-session.enc ]; then
            export KWAI_SESSION_FILE=/tmp/kw02-native-session.enc
            if bash kwai_session_state.sh restore >/tmp/kw02-native-restore.log 2>&1; then
              adb shell monkey -p com.kwai.video -c android.intent.category.LAUNCHER 1 >/dev/null
              sleep 8
              if KWAI_EXPECTED_ACCOUNT=lucasrosalem python3 kwai_auth_probe.py >/tmp/kw02-native-account-proof.log 2>&1; then
                echo KW02_NATIVE_AUTHORIZED_SESSION_RESTORED=YES
                python3 tools/kwai_kw02_auth_creator_only.py
                exit $?
              fi
              echo KW02_NATIVE_SESSION_IDENTITY_NOT_CONFIRMED=YES
            else
              echo KW02_NATIVE_SESSION_RESTORE_UNAVAILABLE=YES
            fi
          fi
          # The server explicitly refuses email login ("mail registration is not
          # supported"); avoid repeating the same rejected credential path.
          echo KW02_AUTH_METHOD_PHONE_OR_EXISTING_SESSION_REQUIRED=YES
          exit 67
          KW02_AUTH_BASH
          chmod 700 /tmp/kw02-auth-creator.sh
      - name: Authenticate authorized Kwai account and open creator without publishing
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
          KWAI_EXPECTED_ACCOUNT: lucasrosalem
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 480
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -accel on -memory 4096 -cores 4
          script: bash /tmp/kw02-auth-creator.sh
