name: X Durable Queue Consumer

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - tools/x_issue_publisher.py
      - tools/x_publication_safety.py
      - .github/workflows/x-durable-consumer.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: anthares-x-account-publish-serial
  cancel-in-progress: false

jobs:
  publish:
    # The independent GH Anthares Browser is primary when armed. Do not run
    # this legacy Northflank Chromium path concurrently by accident.
    if: ${{ vars.ANTHARES_X_LEGACY_FALLBACK_ARM == '1' && vars.ANTHARES_X_AUTOPUBLISH == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ github.token }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      X_PUBLISH_ARM: ${{ vars.ANTHARES_X_AUTOPUBLISH }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exactly one X issue and attempt with durable evidence
        run: python -m tools.x_issue_publisher

      - name: Alert QA on X publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          X_QA_PHASE: x-durable-consumer
        run: python tools/x_notify_qa.py
