name: CORTES Clipper hosted migration preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-clipper-hosted-readiness.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cortes-clipper-hosted-readiness
  cancel-in-progress: false

jobs:
  readonly-proof:
    if: github.repository == 'UniversoAnthares/anthares-kwai-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve authorized private source credential
        if: ${{ vars.ANTHARES_SECRETS_GITLAB_TOKEN_ID != '' }}
        continue-on-error: true
        uses: bitwarden/sm-action@f1de238fc00c738c56140796018be9084c2b5d21
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            ${{ vars.ANTHARES_SECRETS_GITLAB_TOKEN_ID }} > ANTHARES_GITLAB_TOKEN_FROM_BW

      - name: Clone canonical private GitHub Clipper source read-only
        shell: bash
        env:
          GL_AUTH: ${{ env.ANTHARES_GITLAB_TOKEN_FROM_BW || secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GL_AUTH" ]; then
            echo "::error::CORTES_GITLAB_BRIDGE_CREDENTIAL_UNAVAILABLE"
            exit 1
          fi
          # The GitLab mirror is missing the current CORTES producer files.
          # Obtain the pre-existing canonical GitHub mirror credential from the
          # authorized GitLab project variables, never from a public artifact.
          token="$(python3 - <<'PY'
          import json, os, sys, urllib.request
          req=urllib.request.Request(
              "https://gitlab.com/api/v4/projects/87361776/variables/GITHUB_MIRROR_TOKEN",
              headers={"PRIVATE-TOKEN":os.environ["GL_AUTH"],"Accept":"application/json"},
          )
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  token=str(json.load(response).get("value") or "").strip()
          except Exception:
              print("::error::CORTES_CANONICAL_SOURCE_CREDENTIAL_UNAVAILABLE",file=sys.stderr)
              sys.exit(1)
          if not token:
              print("::error::CORTES_CANONICAL_SOURCE_CREDENTIAL_EMPTY",file=sys.stderr)
              sys.exit(1)
          print(token)
          PY
          )" || exit 1
          echo "::add-mask::$token"
          auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          unset token
          if ! git -c "http.extraheader=AUTHORIZATION: Basic $auth" clone --quiet --depth 1 --branch main \
            https://github.com/UniversoAnthares/anthares-clipper.git source >/dev/null 2>&1; then
            unset auth
            echo "::error::CORTES_GITHUB_CANONICAL_CLONE_DENIED"
            exit 1
          fi
          unset auth
          git -C source remote set-url origin https://github.com/UniversoAnthares/anthares-clipper.git
          echo "CORTES_HOSTED_CANONICAL_SOURCE=PASS"
          echo "CORTES_HOSTED_SOURCE_SHA=$(git -C source rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate cloud media runtime for both existing workflows
        working-directory: source
        shell: bash
        env:
          PIP_NO_CACHE_DIR: '1'
          CORTES_DUO_LAYOUT_FROM: '2026-10-20T06:00:00-04:00'
        run: |
          set -euo pipefail
          for f in cortes_discover.py cortes_source_adapter.py cortes_method12_long.py cortes_short_batch.py qa/cortes_short_resume_guard.py qa/cortes_06am_preflight.py; do
            test -s "$f" || { echo "::error::CORTES_HOSTED_SOURCE_FILE_MISSING"; exit 1; }
          done
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "::error::CORTES_HOSTED_FFMPEG_UNAVAILABLE"; exit 1
          fi
          if ! python -m pip install --quiet --disable-pip-version-check --no-cache-dir \
              requests pillow 'yt-dlp[default]' yt-dlp-ejs imageio-ffmpeg tzdata >/dev/null 2>&1; then
            echo "::error::CORTES_HOSTED_PYTHON_DEPENDENCIES_FAILED"; exit 1
          fi
          if ! python -m py_compile \
              cortes_discover.py cortes_source_adapter.py cortes_method12_long.py \
              cortes_short_batch.py qa/cortes_short_resume_guard.py qa/cortes_06am_preflight.py >/dev/null 2>&1; then
            echo "::error::CORTES_HOSTED_COMPILE_FAILED"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cortes-media"
          if ! CORTES_RUNNER_MEDIA_ROOT="$RUNNER_TEMP/cortes-media" \
               python -u qa/cortes_06am_preflight.py >/dev/null 2>&1; then
            echo "::error::CORTES_HOSTED_MEDIA_PREFLIGHT_FAILED"; exit 1
          fi
          echo "CORTES_HOSTED_READONLY_GATE=PASS"
          echo "CORTES_CLOUD_STATE_BACKEND=REQUIRED_BEFORE_PRODUCTION"
          echo "CORTES_PRODUCTION_CUTOVER=NOT_AUTHORIZED_BY_READONLY_GATE"
