name: YouTube acquisition path 1 - PO token

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Full YouTube video/live URL to acquire
        required: false
        default: https://www.youtube.com/watch?v=HtRVqkQ5Opo
        type: string
  push:
    paths:
      - .github/workflows/youtube-acquisition-path1.yml

jobs:
  full-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VIDEO_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.video_url || 'https://www.youtube.com/watch?v=HtRVqkQ5Opo' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install acquisition stack
        run: |
          python -m pip install --disable-pip-version-check -U yt-dlp bgutil-ytdlp-pot-provider
          yt-dlp --version
          ffmpeg -version | head -n 1
          docker version --format '{{.Server.Version}}'

      - name: Start BgUtils PO token provider
        run: |
          docker pull brainicism/bgutil-ytdlp-pot-provider:latest
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ >/tmp/bgutil-health 2>/dev/null; then break; fi
            sleep 1
          done
          docker ps --filter name=bgutil-provider

      - name: Download entire source with mweb and generated PO token
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/anthares-acquisition
          yt-dlp -v \
            --no-playlist \
            --remote-components ejs:github \
            --extractor-args 'youtube:player_client=mweb' \
            --extractor-args 'youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' \
            -f 'bv*[height<=720]+ba/b[height<=720]' \
            --merge-output-format mp4 \
            -o '/tmp/anthares-acquisition/source.%(ext)s' \
            "$VIDEO_URL"

      - name: Verify full source and delete immediately after test
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find /tmp/anthares-acquisition -maxdepth 1 -type f -name 'source.*' | head -n 1)"
          test -n "$FILE" && test -s "$FILE"
          SIZE="$(stat -c %s "$FILE")"
          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FILE")"
          python - "$SIZE" "$DUR" <<'PY'
          import sys
          size=int(sys.argv[1]); dur=float(sys.argv[2])
          assert size > 5_000_000, f'file too small: {size}'
          assert dur > 300, f'duration too short for full source: {dur}'
          print(f'PATH1_FULL_ACQUISITION=PROVEN size_bytes={size} duration_seconds={dur:.3f}')
          PY
          rm -f "$FILE"
          test ! -e "$FILE"
          echo 'PATH1_SOURCE_DELETED_AFTER_VERIFICATION=PROVEN'

      - name: Provider diagnostics
        if: always()
        run: docker logs --tail 200 bgutil-provider || true
