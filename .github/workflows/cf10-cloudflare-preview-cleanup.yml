name: CF-10 Remove Obsolete Cloudflare Worker Previews
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Inventory or delete only obsolete Anthares Reserva Browser previews"
        required: true
        type: choice
        default: inventory
        options: [inventory, cleanup]
permissions:
  contents: read
jobs:
  preview_cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
      CF10_OPERATION: ${{ inputs.operation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Discover only the exact preview resources and purge archived previews when requested
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,time,datetime,collections,concurrent.futures
          BASE='https://api.cloudflare.com/client/v4'
          A=os.environ['CLOUDFLARE_ACCOUNT_ID']
          W='anthares-reserva-browser'
          token=os.getenv('CLOUDFLARE_API_TOKEN','')
          mode=os.getenv('CF10_OPERATION','inventory')
          if mode not in ('inventory','cleanup') or len(token)<15:
            raise SystemExit('CF10_UNAPPROVED_MODE_OR_TOKEN')
          def req(method,path,body=None):
            u=BASE+path
            request=urllib.request.Request(u,method=method,
              headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json','User-Agent':'Anthares-CF10/1'},
              data=json.dumps(body).encode() if body is not None else None)
            try:
              with urllib.request.urlopen(request,timeout=25) as response:
                raw=response.read()
                data=json.loads(raw) if raw else {'success':True,'result':None}
              return data,None
            except urllib.error.HTTPError as e:
              return None,'HTTP_'+str(e.code)
            except Exception as e:
              return None,type(e).__name__
          def allpages(path,limit=12):
            rows=[]
            for page in range(1,limit+1):
              j,e=req('GET',path+('?' if '?' not in path else '&')+'page='+str(page)+'&per_page=100')
              if e or not j.get('success',False):
                return rows,e or 'API_RESULT_NOT_SUCCESS'
              result=j.get('result')
              data=result if isinstance(result,list) else next((v for v in result.values() if isinstance(v,list)),[]) if isinstance(result,dict) else []
              rows.extend(data)
              info=j.get('result_info') or {}
              totalpages=info.get('total_pages')
              if (totalpages is not None and page>=int(totalpages)) or (totalpages is None and len(data)<100):break
            return rows,None
          def printrow(label,obj):print('CF10_'+label,json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':')))
          prepath=f'/accounts/{A}/workers/workers/{W}/previews'
          previews,perr=allpages(prepath)
          namespaces,nerr=allpages(f'/accounts/{A}/workers/durable_objects/namespaces')
          scripts,serr=allpages(f'/accounts/{A}/workers/scripts')
          if perr:printrow('PREVIEW_API_ERROR',{'error':perr})
          if nerr:printrow('NAMESPACE_API_ERROR',{'error':nerr})
          if serr:printrow('SCRIPT_API_ERROR',{'error':serr})
          if nerr or serr:raise SystemExit('CF10_INVENTORY_INCOMPLETE')
          live_scripts={s.get('id') for s in scripts}
          target=[x for x in namespaces if x.get('script')==W]
          prod=[x for x in target if x.get('name')==W+'_BrowserState']
          legacy=[x for x in target if x.get('name')!=W+'_BrowserState']
          printrow('BASELINE',{'mode':mode,'scripts':len(live_scripts),'all_namespaces':len(namespaces),
            'reserva_namespaces':len(target),'production_namespace':len(prod),
            'historical_preview_namespaces':len(legacy),'preview_api_count':len(previews),'preview_api_error':perr})
          if len(prod)!=1 or W not in live_scripts:
            raise SystemExit('CF10_PRODUCTION_RESOURCE_INVARIANT')
          printrow('PREVIEW_NAMES',[{k:v.get(k) for k in ('name','id','created_on','updated_on','modified_on','slug') if v.get(k) is not None} for v in previews[:130]])
          printrow('ORPHAN_NAMESPACE_EXAMPLES',[{'name':x.get('name'),'class':x.get('class')} for x in legacy[:12]])
          if mode=='inventory':
            printrow('FINAL',{'mode':'inventory','candidate_previews':len(previews),'deleted':0,'namespaces_before':len(namespaces)})
            raise SystemExit(0)
          if perr:raise SystemExit('CF10_NO_PREVIEW_LIST_NO_DELETION')
          if not previews:raise SystemExit('CF10_NO_PREVIEW_RECORDS')
          # Only historical previews whose source branch is no longer live
          # are eligible. Read branch names with the standard GitHub token;
          # abort on inability to enumerate, instead of guessing.
          github_token=os.environ.get('GH_TOKEN','')
          if not github_token:raise SystemExit('CF10_GITHUB_BRANCH_AUTH_MISSING')
          active=set()
          for page in range(1,51):
            url=f'https://api.github.com/repos/UniversoAnthares/anthares-kwai-runner/branches?per_page=100&page={page}'
            request=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+github_token,
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'Anthares-CF10-BranchGuard/1'})
            with urllib.request.urlopen(request,timeout=25) as response:
              listed=json.load(response)
            if not isinstance(listed,list):raise SystemExit('CF10_BRANCH_LIST_INVALID')
            active.update(x['name'] for x in listed if isinstance(x,dict) and x.get('name'))
            if len(listed)<100:break
          else:raise SystemExit('CF10_TOO_MANY_BRANCH_PAGES')
          printrow('BRANCH_GUARD',{'active_branches':len(active)})
          blocked={'main','master','prod','production','stable','release','staging','develop','dev'}
          cutoff=datetime.datetime(2026,11,1,tzinfo=datetime.timezone.utc)
          candidates=[]
          skipped_active=[]
          for p in previews:
            name=p.get('name')
            slug=p.get('slug')
            stamp=p.get('updated_on') or p.get('created_on')
            if not isinstance(name,str) or not isinstance(slug,str):continue
            if not name or len(name)>150 or len(slug)>90:continue
            if slug.lower() in blocked or name.lower() in blocked:continue
            if not stamp:continue
            try:modified=datetime.datetime.fromisoformat(stamp.replace('Z','+00:00'))
            except:continue
            if modified>=cutoff:continue
            if name in active or slug in active:
              skipped_active.append(name)
              continue
            # Preview slug is returned by the Cloudflare control plane.
            # Never infer it from a namespace's truncated display name.
            candidates.append({'name':name,'slug':slug})
          printrow('CANDIDATES',{'count':len(candidates),'skipped_active':skipped_active,
            'names':[x['name'] for x in candidates[:100]]})
          deleted=[]
          errors=[]
          for idx,target in enumerate(candidates):
            name,slug=target['name'],target['slug']
            path=prepath+'/'+urllib.parse.quote(slug,safe='')
            result,err=req('DELETE',path)
            if err or (isinstance(result,dict) and result.get('success') is False):
              errors.append({'name':name,'slug':slug,'error':err or 'CF_RESULT_NOT_SUCCESS'})
              printrow('DELETE_ERROR',errors[-1])
              # Stop on the first failure instead of racing ahead with
              # uncertain deletion state.
              break
            else:
              deleted.append(name)
              printrow('DELETED',{'name':name,'index':idx+1})
            if (idx+1)%15==0:time.sleep(1)
          latest,posterr=allpages(f'/accounts/{A}/workers/durable_objects/namespaces')
          if posterr:raise SystemExit('CF10_POST_DELETE_INVENTORY_FAILED')
          pns=[x for x in latest if x.get('script')==W and x.get('name')==W+'_BrowserState']
          printrow('FINAL',{'attempted':len(candidates),'deleted_records':len(deleted),'errors':errors,
            'namespaces_before':len(namespaces),'namespaces_after':len(latest),
            'reserva_namespaces_after':sum(1 for x in latest if x.get('script')==W),
            'production_namespace_preserved':len(pns)==1,'other_worker_namespaces_preserved':sum(1 for x in latest if x.get('script')!=W)==sum(1 for x in namespaces if x.get('script')!=W)})
          if errors or len(pns)!=1 or sum(1 for x in latest if x.get('script')!=W)!=sum(1 for x in namespaces if x.get('script')!=W):
            raise SystemExit('CF10_INCOMPLETE_OR_PRODUCTION_INVARIANT_FAIL')
          PY
