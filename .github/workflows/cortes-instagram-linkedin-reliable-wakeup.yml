name: CORTES Instagram LinkedIn reliable cloud wakeup

# GitHub routinely drops high-frequency schedule events on busy repositories.
# Independent canonical workflow completions, including failures, provide a cloud heartbeat.
# Only the existing authenticated publisher workflows may make API writes.
on:
  workflow_run:
    workflows:
      - "CORTES TikTok hosted canonical Neon publisher"
      - "CORTES 3 independent networks - all shorts cloud fanout"
      - "CORTES Pinterest - direct invisible browser publisher"
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-instagram-linkedin-reliable-wakeup.yml'
  schedule:
    # Five-minute fallback; TikTok completion triggers Graph independently.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: cortes-instagram-linkedin-reliable-wakeup
  cancel-in-progress: false

jobs:
  trusted-dispatch:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'UniversoAnthares/anthares-kwai-runner' && contains(fromJSON('["CORTES TikTok hosted canonical Neon publisher","CORTES 3 independent networks - all shorts cloud fanout","CORTES Pinterest - direct invisible browser publisher"]'), github.event.workflow_run.name)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Wake fenced official cloud publishers with bounded cadence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number || '0' }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'none' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$GH_REPO" != 'UniversoAnthares/anthares-kwai-runner' ]]; then
            echo CORTES_WAKEUP_UNTRUSTED_REF
            exit 1
          fi
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            if [[ ! "$SOURCE_RUN_NUMBER" =~ ^[0-9]+$ ]]; then
              echo CORTES_WAKEUP_INVALID_SOURCE_RUN
              exit 1
            fi
            # A failed TikTok or Pinterest publishing job is still an
            # authenticated main-branch heartbeat. No cross-network state is
            # trusted: Instagram uses its OWN Neon proportional slot gate.
            # Bound TikTok to every other completion (~6min under normal cron)
            # to avoid extra GitHub runner load. Fanout/Pinterest add fallback.
            if [[ "$SOURCE_WORKFLOW" == 'CORTES TikTok hosted canonical Neon publisher' ]]; then
              instagram_due=$((SOURCE_RUN_NUMBER % 2 == 0))
              linkedin_due=$((SOURCE_RUN_NUMBER % 8 == 0))
            else
              instagram_due=1
              linkedin_due=0
            fi
            echo "CORTES_WAKEUP_HEARTBEAT=$SOURCE_WORKFLOW:$SOURCE_CONCLUSION"
          else
            # Independently fired five-minute scheduled/manual recovery.
            instagram_due=1
            linkedin_due=1
          fi
          if (( instagram_due )); then
            gh workflow run cortes-instagram-direct-cloud.yml --repo "$GH_REPO" --ref main
            echo CORTES_INSTAGRAM_CANONICAL_WAKEUP_DISPATCHED=1
          else
            echo CORTES_INSTAGRAM_CANONICAL_WAKEUP_NOT_DUE=1
          fi
          if (( linkedin_due )); then
            gh workflow run cortes-linkedin-personal-fallback-cloud.yml --repo "$GH_REPO" --ref main -f reconcile_only=false
            echo CORTES_LINKEDIN_CANONICAL_WAKEUP_DISPATCHED=1
          else
            echo CORTES_LINKEDIN_CANONICAL_WAKEUP_NOT_DUE=1
          fi
