name: CORTES LinkedIn personal - primary hosted cloud publisher
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-linkedin-personal-fallback-cloud.yml'
      - 'tools/cortes_linkedin_personal_cloud.py'
permissions:
  contents: read
  id-token: write
# Exactly the same lock as primary; no two hosted publishers operate the
# same personal account concurrently. Neon lease+generation remains authority.
concurrency:
  # GitHub Actions retains at most one PENDING execution in each group;
  # sharing the primary group canceled every backup run before it had a job.
  # The Neon owner+lease_generation CAS and publication-start marker prevent
  # two active runners from publishing the same cut.
  group: cortes-linkedin-personal-primary-hosted
  cancel-in-progress: false
jobs:
  recover-personal:
    if: ${{ vars.CORTES_LINKEDIN_PERSONAL_PAUSED != 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch member OAuth credential securely via Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            bd261e5e-11bf-49fb-9baf-b4ea014ec5b7 > LINKEDIN_PERSONAL_ACCESS_TOKEN
      - name: Retry only distinct Neon jobs; never blindly repost uncertain media
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
        run: |
          set -euo pipefail
          python -u -m tools.cortes_linkedin_personal_cloud
