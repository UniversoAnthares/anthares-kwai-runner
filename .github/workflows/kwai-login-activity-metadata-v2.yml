name: Kwai Login Activity Metadata Corrected
on:
  workflow_dispatch:
  push:
    paths: ['.login-activity-metadata-v2-trigger']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated vault
        run: |
          curl -fL --retry 3 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip" | sha256sum -c -
          rm -rf kwai-vault && mkdir kwai-vault && unzip -q kwai-vault.zip -d kwai-vault
      - name: Validate and inspect manifest login components
        run: bash kwai_login_activity_metadata_v2.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-activity-metadata-v2-${{ github.run_id }}
          path: |
            manifest-tree.txt
            login-activity-metadata.txt
          if-no-files-found: warn
          retention-days: 1
