name: CORTES Threads night cloud batch launch once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/threads-night-batch-dispatch-once.yml']
permissions:
  actions: write
  contents: read
jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Dispatch authorized exception batch only before 05:00 MS
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const deadline = Date.parse('2026-10-22T08:40:00Z');
            if(Date.now() >= deadline) {
              core.info('THREADS_NIGHT_EXCEPTION_ALREADY_ENDED');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cortes-threads-cloud-handoff.yml',
              ref: 'main',
              inputs: { publish: 'true', batch: 'true' }
            });
            core.info('THREADS_AUTHORIZED_NIGHT_CLOUD_BATCH_DISPATCHED');
