name: Buffer - Cloud Channel Identity Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
permissions:
  contents: read
concurrency:
  group: cortes-buffer-cloud-identity-audit
  cancel-in-progress: false
jobs:
  buffer-channels:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read Buffer key from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            0ec34434-3b81-4cc6-93af-b4ea00d11733 > BUFFER_API_KEY
      - name: Verify all three pinned identities (read-only, cloud-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from social_adapters.buffer_three_channels import channels, validate_channel, PINNED_CHANNELS, BufferBlocked
          if not os.environ.get("BUFFER_API_KEY"):
              raise SystemExit("BUFFER_CREDENTIAL_NOT_LOADED")
          try:
              live=channels()
              for service,(channel_id,_,_) in PINNED_CHANNELS.items():
                  validate_channel(service,channel_id,live)
                  print("BUFFER_CHANNEL_VERIFIED="+service+" "+channel_id)
              print("BUFFER_CLOUD_IDENTITY_AUDIT=PASS")
          except BufferBlocked as exc:
              print("::error::BUFFER_CHANNEL_AUDIT_FAILED "+str(exc))
              raise SystemExit(2)
          PY
