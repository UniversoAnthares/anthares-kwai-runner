name: Kwai real Android cross-API startup diagnosis
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kwai-cross-api-real-startup.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-android:
    name: Real Kwai Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        api: [30, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and privacy
        run: |
          set -euo pipefail
          bash -n kwai_native_email_smoke.sh kwai_vault_install.sh
          python3 -m py_compile tools/kwai_android_startup_fingerprint.py tools/kwai_android_causal_probe.py
      - name: Download validated Kwai APK split vault
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 55 -o /tmp/kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo '96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  /tmp/kwai-vault.zip' | sha256sum -c -
          mkdir -p kwai-vault
          unzip -q /tmp/kwai-vault.zip -d kwai-vault
          test -s kwai-vault/MANIFEST.tsv
      - name: Enable remote KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Diagnose actual Kwai app and login on hosted Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 180
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 3072
          script: bash kwai_native_email_smoke.sh
      - name: Preserve only privacy-safe diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-cross-api-${{ matrix.api }}-${{ github.run_id }}
          path: kwai-native-email-status.txt
          if-no-files-found: ignore
          retention-days: 3
