name: CORTES Instagram - direct Graph primary cloud publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-instagram-direct-cloud.yml'
      - 'tools/cortes_instagram_direct_cloud.py'
      - 'tools/cortes_instagram_vertical_asset.py'
      - 'tools/cortes_instagram_public_reconcile.py'
      - 'tools/cortes_queue_ha.py'
      - 'infra/neon-cortes-queue/index.mjs'
      - 'tests/test_instagram_public_reconcile.py'
  workflow_dispatch: {}
  schedule:
    # Independent reconciliation at 06:19, 12:19 and 18:19 Campo Grande.
    - cron: '19 10,16,22 * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  publish-direct-reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    if: ${{ vars.CORTES_INSTAGRAM_DIRECT_PAUSED != 'true' }}
    # The five-minute follow-up must not hold the Graph publication mutex.
    # Serialize only the media job; Neon fencing remains the final authority.
    concurrency:
      # A scheduled run cannot cancel a user-initiated rescue; Neon fences both.
      group: cortes-instagram-direct-neon-primary
      cancel-in-progress: false
    outputs:
      confirmed: ${{ steps.publish.outputs.confirmed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify direct publisher syntax and source
        run: |
          python -m pip install --quiet --disable-pip-version-check imageio-ffmpeg
          python -m py_compile tools/cortes_instagram_direct_cloud.py tools/cortes_instagram_vertical_asset.py scripts/instagram_publish.py tools/cortes_queue_ha.py
          python -m unittest discover -s tests -p 'test_instagram_direct_cloud.py' -v
          python -m unittest discover -s tests -p 'test_instagram_vertical_asset.py' -v
          python -m unittest discover -s tests -p 'test_instagram_public_reconcile.py' -v
          python -c 'from tools.cortes_instagram_vertical_asset import _ffmpeg_exe; assert _ffmpeg_exe()'
      - name: Publish up to two separately confirmed Reels through official Instagram Graph
        id: publish
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
          INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST || 'graph.instagram.com' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WP_SITE_URL: ${{ secrets.WP_QA_SITE_URL || secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_QA_USERNAME || secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_QA_APP_PASSWORD || secrets.WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          receipt_file="$RUNNER_TEMP/instagram-graph-${GITHUB_RUN_ID}.jsonl"
          python -u tools/cortes_instagram_direct_cloud.py | tee "$receipt_file"
          if grep -Fq '"direct_cloud": "INSTAGRAM_REEL_CONFIRMED"' "$receipt_file"; then
            echo 'confirmed=true' >> "$GITHUB_OUTPUT"
          fi

  # A confirmed Reel starts one bounded continuation, independent of cron.
  # A later confirmation supersedes the previous sleeper to avoid parallel bursts.
  continue-confirmed-queue:
    needs: [publish-direct-reel]
    if: ${{ needs['publish-direct-reel'].result == 'success' && needs['publish-direct-reel'].outputs.confirmed == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    concurrency:
      group: cortes-instagram-graph-confirmed-continuation
      cancel-in-progress: true
    steps:
      - name: Continue verified Instagram queue after five-minute spacing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'UniversoAnthares/anthares-kwai-runner'
          sleep 300
          gh workflow run cortes-instagram-direct-cloud.yml --repo "$GH_REPO" --ref main
          echo CORTES_INSTAGRAM_DIRECT_CONFIRMED_SUCCESSOR_DISPATCHED=1

  # Independent proof route: public profile listing + Graph readback.
  # It never triggers a publish/retry and never changes a queued item.
  reconcile-public-profile:
    if: ${{ github.event_name == 'push' || github.event.schedule == '19 10,16,22 * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    concurrency:
      group: cortes-instagram-public-reconcile-only
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded read-only browser
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python -m py_compile tools/cortes_instagram_public_reconcile.py
          python -m unittest discover -s tests -p 'test_instagram_public_reconcile.py' -v
      - name: Inspect public account timeline; keep inaccessible clips uncertain
        env:
          GITHUB_ACTIONS: 'true'
          RUNNER_ENVIRONMENT: github-hosted
          RUNNER_OS: Linux
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
          INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST || 'graph.instagram.com' }}
        run: |
          set -euo pipefail
          python -u tools/cortes_instagram_public_reconcile.py
