name: CORTES Instagram - direct Graph primary cloud publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-instagram-direct-cloud.yml'
      - 'tools/cortes_instagram_direct_cloud.py'
      - 'tools/cortes_instagram_vertical_asset.py'
      - 'tools/cortes_instagram_layout_standard.py'
      - 'tools/cortes_instagram_public_reconcile.py'
      - 'tools/cortes_queue_ha.py'
      - 'infra/neon-cortes-queue/index.mjs'
      - 'tests/test_instagram_public_reconcile.py'
      - 'tests/test_instagram_public_neon.mjs'
      - 'tests/test_instagram_layout_standard.py'
      - 'tests/test_instagram_deadline_pacing.mjs'
  workflow_dispatch: {}
  schedule:
    # Polling triggers only; Neon decides every proportional publication slot.
    # Independent reconciliation at 06:19, 12:19 and 18:19 Campo Grande.
    - cron: '19 10,16,22 * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  publish-direct-reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    if: ${{ vars.CORTES_INSTAGRAM_DIRECT_PAUSED != 'true' }}
    # Five-minute cron is polling only; each Neon due time authorizes one Reel.
    # Serialize only the media job; Neon fencing remains the final authority.
    concurrency:
      # A scheduled run cannot cancel a user-initiated rescue; Neon fences both.
      group: cortes-instagram-direct-neon-primary
      cancel-in-progress: false
    outputs:
      confirmed: ${{ steps.publish.outputs.confirmed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify direct publisher syntax and source
        run: |
          python -m pip install --quiet --disable-pip-version-check imageio-ffmpeg pillow opencv-python-headless
          python -m py_compile tools/cortes_instagram_direct_cloud.py tools/cortes_instagram_vertical_asset.py tools/cortes_instagram_layout_standard.py scripts/instagram_publish.py tools/cortes_queue_ha.py
          python -m unittest discover -s tests -p 'test_instagram_direct_cloud.py' -v
          python -m unittest discover -s tests -p 'test_instagram_vertical_asset.py' -v
          python -m unittest discover -s tests -p 'test_instagram_layout_standard.py' -v
          python -m unittest discover -s tests -p 'test_instagram_public_reconcile.py' -v
          node --check infra/neon-cortes-queue/index.mjs
          node --test tests/test_instagram_public_neon.mjs
          node --test tests/test_instagram_deadline_pacing.mjs
          python -c 'from tools.cortes_instagram_vertical_asset import _ffmpeg_exe; assert _ffmpeg_exe()'
      - name: Publish at most one Neon-scheduled Reel through official Instagram Graph
        id: publish
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
          INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST || 'graph.instagram.com' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WP_SITE_URL: ${{ secrets.WP_QA_SITE_URL || secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_QA_USERNAME || secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_QA_APP_PASSWORD || secrets.WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          receipt_file="$RUNNER_TEMP/instagram-graph-${GITHUB_RUN_ID}.jsonl"
          python -u tools/cortes_instagram_direct_cloud.py | tee "$receipt_file"
          if grep -Fq '"direct_cloud": "INSTAGRAM_REEL_CONFIRMED"' "$receipt_file"; then
            echo 'confirmed=true' >> "$GITHUB_OUTPUT"
          fi

  # Independent proof route: authenticated Windows profile snapshot + Graph readback.
  # It never triggers a publish/retry and never changes a queued item.
  reconcile-public-profile:
    if: ${{ github.event_name == 'push' || github.event.schedule == '19 10,16,22 * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    concurrency:
      group: cortes-instagram-public-reconcile-only
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate OIDC Graph readback of previously authenticated profile snapshot
        run: |
          set -euo pipefail
          # Profile access runs only in the authorized Windows scanner workflow.
          # The hosted reconciler reads its signed, timestamped snapshot in Neon.
          python -m py_compile tools/cortes_instagram_public_reconcile.py
          python -m unittest discover -s tests -p 'test_instagram_public_reconcile.py' -v
      - name: Inspect public account timeline; keep inaccessible clips uncertain
        env:
          GITHUB_ACTIONS: 'true'
          RUNNER_ENVIRONMENT: github-hosted
          RUNNER_OS: Linux
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
          INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST || 'graph.instagram.com' }}
        run: |
          set -euo pipefail
          python -u tools/cortes_instagram_public_reconcile.py

  # Run exactly one audited reconciliation on the merge introducing this job.
  # Exact target, media ID and original audio proof are checked in Neon CAS.
  reconcile-one-audio-proven:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm only independently audio-proven October Reel in canonical ledger
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
          INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST || 'graph.instagram.com' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from tools.cortes_instagram_direct_cloud import require_cloud,neon
          require_cloud()
          result=neon("audio-confirm-one",{
             "id":"cortes-fanout-instagram-2ecd394d6d76b9c1a89a4b66a3e5d3b4",
             "remote_id":"18121626946995788",
             "proof_workflow_run":"43266870818",
             "authenticated_inventory_run":"43266099213",
             "confirmation_audio_correlation":0.977
          })
          print("INSTAGRAM_ONE_PROVEN_RECONCILED="+json.dumps(result,ensure_ascii=False))
          PY
