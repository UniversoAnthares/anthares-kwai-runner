name: Anthares quota cancellation controlled smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/anthares-quota-cancel-controlled-smoke.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  exercise-cancel-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Emit synthetic quota event for this safe job only
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          payload={"event_type":"anthares-quota-exhausted",
                   "client_payload":{"mode":"synthetic_smoke",
                   "provider":"github_actions","repo":repo,
                   "run_id":os.environ['GITHUB_RUN_ID'],
                   "code":"ci_quota_exceeded"}}
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/dispatches",
              data=json.dumps(payload).encode(),
              headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "X-GitHub-Api-Version":"2022-11-28"},
              method="POST")
          with urllib.request.urlopen(req,timeout=20) as response:
              if response.status!=204:raise RuntimeError("DISPATCH_NOT_ACCEPTED")
          print("QUOTA_SYNTHETIC_EVENT_ACCEPTED")
          PY
      - name: Remain active only for independent cancel listener test
        shell: bash
        run: |
          echo "QUOTA_SMOKE_NO_REAL_WORK"
          sleep 180
          echo "::error::QUOTA_SMOKE_NOT_CANCELLED"
          exit 2
