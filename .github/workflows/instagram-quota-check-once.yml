name: One-time Instagram publishing quota readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/instagram-quota-check-once.yml']
permissions:
  contents: read
jobs:
  read-only-quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact per-account publishing quota without exposing credentials
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
          INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST || 'graph.instagram.com' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from scripts.instagram_publish import InstagramClient
          client=InstagramClient(os.environ['INSTAGRAM_USER_ID'],os.environ['INSTAGRAM_ACCESS_TOKEN'],
             os.environ.get('INSTAGRAM_API_VERSION','v26.0'),
             os.environ.get('INSTAGRAM_GRAPH_HOST','graph.instagram.com'))
          result=client._request('GET',f"{client.user_id}/content_publishing_limit",
             query={'fields':'quota_usage,config'})
          clean=[]
          for row in result.get('data',[]):
            cfg=row.get('config') or {}
            clean.append({'quota_usage':row.get('quota_usage'),
              'quota_total':cfg.get('quota_total'),'quota_duration':cfg.get('quota_duration')})
          print("INSTAGRAM_ACCOUNT_CONTENT_PUBLISHING_LIMIT="+json.dumps(clean))
          PY
