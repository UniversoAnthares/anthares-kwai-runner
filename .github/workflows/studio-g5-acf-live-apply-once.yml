name: Anthares Studio G5 ACF Transactional Live Apply
on:
  push:
    branches:
      - coord/studio-g4-g5-20261116
    paths:
      - .github/workflows/studio-g5-acf-live-apply-once.yml
permissions:
  contents: read
concurrency:
  group: anthares-studio-g5-live-apply-20261116
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'UniversoAnthares/anthares-kwai-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate migration client and guarded remote Python
        run: |
          python3 - <<'PY'
          import ast,pathlib,re
          src=pathlib.Path('tools/studio-g5-acf-live-cli.py').read_text(encoding='utf8')
          ast.parse(src)
          m=re.search(r'REMOTE=r"""(.*?)"""',src,re.S)
          assert m
          compile(m.group(1),'remote_acf_migrate.py','exec')
          print('STUDIO_G5_MIGRATION_SYNTAX=PASS')
          PY
      - name: Repeat read-only baseline and backup verification
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          STUDIO_G5_MODE: dryrun
        run: python3 tools/studio-g5-acf-live-cli.py
      - name: Migrate 414 ACF values transactionally and verify second pass writes zero
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          STUDIO_G5_MODE: apply
        run: python3 tools/studio-g5-acf-live-cli.py
      - name: Verify final ACF metadata in read-only mode
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          STUDIO_G5_MODE: verify
        run: python3 tools/studio-g5-acf-live-cli.py
