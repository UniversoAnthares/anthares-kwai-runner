name: Anthares Secrets read-only inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/anthares-secrets-inventory.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve pinned official Bitwarden SDK without exposing secrets
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v2 https://github.com/bitwarden/sm-action.git /tmp/anthares-sm-action
          test "$(git -C /tmp/anthares-sm-action rev-parse HEAD)" = "f1de238fc00c738c56140796018be9084c2b5d21"
      - name: Inspect only secret identifier metadata
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BWS_ACCESS_TOKEN"
          node - <<'NODE'
          const sdk = require('/tmp/anthares-sm-action/dist/node_modules/@bitwarden/sdk-napi');
          const org = '78a2d0d1-e41e-4250-a95c-b4e800e1d783';
          (async () => {
            const client = new sdk.BitwardenClient({
              apiUrl:'https://api.bitwarden.com',
              identityUrl:'https://identity.bitwarden.com',
              userAgent:'anthares-ci-inventory',
              deviceType:sdk.DeviceType.SDK
            },sdk.LogLevel.Error);
            const auth = await client.loginWithAccessToken(process.env.BWS_ACCESS_TOKEN);
            if (!auth.success) throw Error('BWS_AUTH');
            const response=await client.secrets().list(org);
            if (!response.success || !response.data) throw Error('BWS_LIST');
            const items=response.data.data || [];
            const matches=items.filter(x => /^(?:GITLAB_TOKEN|ANTHARES_GITLAB_TOKEN|GITLAB_API_TOKEN)$/i.test(x.key||''));
            console.log('BWS_ACCESSIBLE_IDENTIFIER_COUNT='+items.length);
            console.log('BWS_GITLAB_API_TOKEN_PRESENT='+(matches.length===1?'YES':matches.length===0?'NO':'AMBIGUOUS'));
            console.log('BWS_INVENTORY_NO_VALUES_READ=PASS');
          })().catch(e=>{console.error('BWS_INVENTORY_ERROR='+String(e.message).replace(/[^A-Z_]/g,''));process.exit(1)});
          NODE
# Only reads identifier metadata; no values or IDs written to logs or artifacts.
