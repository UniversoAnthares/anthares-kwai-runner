name: Agent3 log auth artifact 20261012-1839

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent3-log-auth-artifact-20261012-1839.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append coordination entry safely
        shell: bash
        run: |
          set -euo pipefail
          path='test-hub/legacy-pc-uploader-rebuild/SHARED-LOG.md'
          marker='Agent 3 — encrypted native-session fallback added'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            grep -Fq "$marker" "$path" && exit 0
            cat >> "$path" <<'EOF'

## 2026-10-12 18:39 -04:00 — Agent 3 — encrypted native-session fallback added

ACTION:
Re-read canonical SHARED-LOG, inspected the failed focused auth run, then hardened the current mobile-auth workflow so a successful authenticated native session cannot be lost if the Cloudflare vault is temporarily unavailable.

FOUND:
- Focused run `38309117775` had valid repository credentials present and reached a booted Android emulator.
- Its actual fatal error was `/usr/bin/sh: set: Illegal option -o pipefail`; native credential login never executed in that run.
- Current workflow already uses portable `set -eu` inside the emulator script, so that historical shell blocker is fixed.

CHANGED:
- Commit `af5a85aa20ae67bc2a2f015c046ebe5df01507c8` adds a 1-day `actions/upload-artifact` fallback containing only encrypted `kwai-session.enc`.
- Identity gates remain unchanged: artifact can only exist after the workflow has run the native auth path and `kwai_session_state.sh save` has accepted the exact authenticated identity.
- No plaintext credential, raw Android data directory, UI dump, or screenshot is added to the artifact.

NEXT:
Let the workflow triggered by `af5a85aa...` run. If it proves `lucasrosalem`, capture the encrypted session artifact even if Cloudflare persistence fails, then restore that state into VM3 before `probe`/`prepare`.

PUBLICATION:
No social publication occurred.
EOF
            git add "$path"
            git commit -m 'legacy rebuild: record encrypted auth-session fallback'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
