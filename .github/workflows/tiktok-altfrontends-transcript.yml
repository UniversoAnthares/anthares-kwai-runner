name: TikTok Alternative Frontends Transcript

on:
  push:
    branches: [main]
    paths:
      - '.tiktok-altfrontends-transcript-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcript:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact Invidious Portuguese caption/transcript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary-subs
          python3 - <<'PY'
          import html,json,re,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          base='https://inv.nadeko.net'; vid='uohL105_5bg'
          headers={'User-Agent':'Mozilla/5.0 AntharesOwnedMediaProbe/2.0','Accept':'application/json,text/vtt;q=0.9,*/*;q=0.5'}
          out=Path('/tmp/canary-subs/alt.vtt')
          def get(url,accept=None):
              h=dict(headers)
              if accept: h['Accept']=accept
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=35) as r: return int(getattr(r,'status',200)),r.headers,r.read()
              except urllib.error.HTTPError as e: return int(e.code),e.headers,e.read()
              except Exception as e: return 0,{},str(e).encode()

          code,h,body=get(base+'/api/v1/captions/'+vid)
          print(json.dumps({'CAPTION_LIST_HTTP':code,'bytes':len(body)},sort_keys=True))
          if code!=200: raise SystemExit('CAPTION_LIST_FAILED')
          data=json.loads(body); caps=data.get('captions') or []
          print(json.dumps({'CAPTION_LIST':[{'label':c.get('label'),'languageCode':c.get('languageCode'),'url':c.get('url')} for c in caps if isinstance(c,dict)]},ensure_ascii=False,sort_keys=True))
          pt=[c for c in caps if isinstance(c,dict) and str(c.get('languageCode') or '').lower().startswith('pt')]
          if not pt: raise SystemExit('NO_PT_CAPTION')
          cap=pt[0]
          urls=[]
          exact=str(cap.get('url') or '')
          if exact:
              urls.append(exact if exact.startswith('http') else base+exact)
          label=str(cap.get('label') or '')
          lang=str(cap.get('languageCode') or 'pt')
          urls += [
              base+'/api/v1/captions/'+vid+'?'+urllib.parse.urlencode({'label':label}),
              base+'/api/v1/captions/'+vid+'?'+urllib.parse.urlencode({'lang':lang}),
              base+'/api/v1/transcripts/'+vid+'?'+urllib.parse.urlencode({'lang':lang})+'&autogen',
              base+'/api/v1/transcripts/'+vid+'?'+urllib.parse.urlencode({'label':label}),
          ]
          seen=set()
          for u in urls:
              if u in seen: continue
              seen.add(u)
              c,hh,b=get(u,'application/json,text/vtt;q=0.9,*/*;q=0.5')
              tx=b.decode('utf-8','replace')
              ct=hh.get('content-type') if hasattr(hh,'get') else None
              print(json.dumps({'PROBE_URL':u.replace(base,''),'http':c,'bytes':len(b),'content_type':ct,'vtt':tx.startswith('WEBVTT'),'jsonish':tx.lstrip().startswith(('{','['))},ensure_ascii=False,sort_keys=True))
              if c==200 and tx.startswith('WEBVTT') and len(tx)>200:
                  out.write_text(tx,encoding='utf-8'); print('INVIDIOUS_EXACT_VTT=OK'); raise SystemExit(0)
              if c==200 and len(tx)>200 and tx.lstrip().startswith(('{','[')):
                  try: obj=json.loads(tx)
                  except Exception: continue
                  Path('/tmp/canary-subs/transcript.json').write_text(json.dumps(obj,ensure_ascii=False),encoding='utf-8')
                  if isinstance(obj,dict):
                      safe={'top_keys':list(obj.keys())[:20]}
                      for k,v in obj.items():
                          if isinstance(v,list) and v:
                              safe['list_key']=k; safe['list_len']=len(v); safe['first_type']=type(v[0]).__name__
                              if isinstance(v[0],dict): safe['first_keys']=list(v[0].keys())[:20]
                              break
                      print(json.dumps({'TRANSCRIPT_JSON_SHAPE':safe},ensure_ascii=False,sort_keys=True))
                  elif isinstance(obj,list):
                      safe={'list_len':len(obj),'first_type':type(obj[0]).__name__ if obj else None,'first_keys':list(obj[0].keys())[:20] if obj and isinstance(obj[0],dict) else []}
                      print(json.dumps({'TRANSCRIPT_JSON_SHAPE':safe},ensure_ascii=False,sort_keys=True))
                  print('INVIDIOUS_TRANSCRIPT_JSON=AVAILABLE')
                  raise SystemExit(4)
          raise SystemExit('NO_EXACT_CAPTION_OR_TRANSCRIPT')
          PY
      - name: Rank subtitle candidates
        run: python3 tools/tiktok_rank_vtt.py /tmp/canary-subs
