name: TikTok Alternative Frontends Transcript

on:
  push:
    branches: [main]
    paths:
      - '.tiktok-altfrontends-transcript-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcript:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe official-listed Piped and Invidious instances
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary-subs
          python3 - <<'PY'
          import json,os,re,urllib.error,urllib.parse,urllib.request
          from pathlib import Path

          vid='uohL105_5bg'
          ua='Mozilla/5.0 AntharesOwnedMediaProbe/1.0'
          headers={'User-Agent':ua,'Accept':'application/json,text/vtt;q=0.9,*/*;q=0.5'}
          out=Path('/tmp/canary-subs/alt.vtt')
          audio_candidates=[]

          def get(url,timeout=30,accept=None):
              h=dict(headers)
              if accept: h['Accept']=accept
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return int(getattr(r,'status',200)),r.headers, r.read()
              except urllib.error.HTTPError as e:
                  return int(e.code),e.headers,e.read()
              except Exception as e:
                  return 0,{},str(e).encode()

          piped=[
            'https://pipedapi.kavin.rocks',
            'https://pipedapi.leptons.xyz',
            'https://pipedapi.nosebs.ru',
            'https://api-piped.mha.fi',
            'https://piped-api.garudalinux.org',
            'https://pipedapi.rivo.lol',
          ]
          for base in piped:
              code,h,body=get(base+'/streams/'+vid,35)
              safe={'kind':'piped','base':base,'http':code,'bytes':len(body)}
              if code!=200:
                  print(json.dumps(safe,sort_keys=True)); continue
              try: data=json.loads(body)
              except Exception:
                  safe['json']=False; print(json.dumps(safe,sort_keys=True)); continue
              subs=data.get('subtitles') or []
              aud=data.get('audioStreams') or []
              safe.update({'subtitle_count':len(subs) if isinstance(subs,list) else -1,'audio_count':len(aud) if isinstance(aud,list) else -1,'title':str(data.get('title') or '')[:120]})
              print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
              if isinstance(subs,list):
                  ranked=sorted([s for s in subs if isinstance(s,dict) and s.get('url')],key=lambda s:(0 if str(s.get('code') or '').lower().startswith('pt') else 1,0 if s.get('autoGenerated') else 1))
                  for s in ranked:
                      u=str(s.get('url') or '')
                      if u.startswith('/'): u=base+u
                      c,hh,b=get(u,30,'text/vtt,*/*;q=0.5')
                      text=b.decode('utf-8','replace')
                      print(json.dumps({'kind':'piped-subtitle','base':base,'code':s.get('code'),'name':s.get('name'),'http':c,'bytes':len(b),'vtt':text.startswith('WEBVTT')},ensure_ascii=False,sort_keys=True))
                      if c==200 and text.startswith('WEBVTT') and len(text)>200:
                          out.write_text(text,encoding='utf-8'); print('ALT_CAPTION=OK provider=piped base='+base); raise SystemExit(0)
              if isinstance(aud,list):
                  for a in aud:
                      if isinstance(a,dict) and a.get('url'):
                          audio_candidates.append({'provider':'piped','base':base,'url':str(a['url']),'bitrate':int(a.get('bitrate') or 0),'mime':str(a.get('mimeType') or a.get('format') or '')})

          inv=[
            'https://inv.nadeko.net',
            'https://invidious.nerdvpn.de',
            'https://yt.chocolatemoo53.com',
            'https://invidious.tiekoetter.com',
          ]
          for base in inv:
              code,h,body=get(base+'/api/v1/captions/'+vid,35)
              safe={'kind':'invidious-captions','base':base,'http':code,'bytes':len(body)}
              if code==200:
                  try:
                      data=json.loads(body); caps=data.get('captions') or []
                  except Exception: caps=[]
                  safe['caption_count']=len(caps) if isinstance(caps,list) else -1
                  print(json.dumps(safe,sort_keys=True))
                  if isinstance(caps,list):
                      ranked=sorted([c for c in caps if isinstance(c,dict)],key=lambda c:0 if str(c.get('languageCode') or '').lower().startswith('pt') else 1)
                      for cap in ranked:
                          lang=str(cap.get('languageCode') or '')
                          label=str(cap.get('label') or '')
                          q='lang='+urllib.parse.quote(lang) if lang else 'label='+urllib.parse.quote(label)
                          c2,h2,b2=get(base+'/api/v1/captions/'+vid+'?'+q,35,'text/vtt,*/*;q=0.5')
                          tx=b2.decode('utf-8','replace')
                          print(json.dumps({'kind':'invidious-caption','base':base,'lang':lang,'label':label,'http':c2,'bytes':len(b2),'vtt':tx.startswith('WEBVTT')},ensure_ascii=False,sort_keys=True))
                          if c2==200 and tx.startswith('WEBVTT') and len(tx)>200:
                              out.write_text(tx,encoding='utf-8'); print('ALT_CAPTION=OK provider=invidious base='+base); raise SystemExit(0)
              else:
                  print(json.dumps(safe,sort_keys=True))
              cv,hv,bv=get(base+'/api/v1/videos/'+vid,35)
              if cv==200:
                  try: v=json.loads(bv)
                  except Exception: v={}
                  af=v.get('adaptiveFormats') or []
                  aa=[a for a in af if isinstance(a,dict) and str(a.get('type') or a.get('mimeType') or '').startswith('audio/') and a.get('url')]
                  print(json.dumps({'kind':'invidious-video','base':base,'http':cv,'audio_direct_count':len(aa),'title':str(v.get('title') or '')[:120]},ensure_ascii=False,sort_keys=True))
                  for a in aa:
                      audio_candidates.append({'provider':'invidious','base':base,'url':str(a['url']),'bitrate':int(a.get('bitrate') or 0),'mime':str(a.get('type') or a.get('mimeType') or '')})

          if audio_candidates:
              audio_candidates.sort(key=lambda a:-a['bitrate'])
              best=audio_candidates[0]
              req=urllib.request.Request(best['url'],headers={'User-Agent':ua,'Range':'bytes=0-4095'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      chunk=r.read(4096); http=int(getattr(r,'status',200)); ct=r.headers.get('content-type')
              except Exception as e:
                  chunk=b''; http=0; ct=type(e).__name__
              print(json.dumps({'ALT_AUDIO':{'provider':best['provider'],'base':best['base'],'bitrate':best['bitrate'],'mime':best['mime'],'range_http':http,'range_bytes':len(chunk),'content_type':ct}},sort_keys=True))
              if chunk:
                  Path('/tmp/alt-audio-source.json').write_text(json.dumps(best),encoding='utf-8')
                  print('ALT_AUDIO_STREAM=AVAILABLE')
                  raise SystemExit(3)
          raise SystemExit('NO_ALT_CAPTION_OR_AUDIO')
          PY
      - name: Rank subtitle candidates
        if: success()
        run: python3 tools/tiktok_rank_vtt.py /tmp/canary-subs
