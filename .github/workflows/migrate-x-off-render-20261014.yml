name: One-time migrate X off Render and suspend final Render worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-x-off-render-20261014.yml

permissions:
  contents: read

concurrency:
  group: one-time-x-render-retirement-20261014
  cancel-in-progress: false

jobs:
  migrate-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      X_WORKER_TOKEN: ${{ secrets.X_WORKER_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Wait for consolidated Northflank X, prove real publication, suspend last Render service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          nf=os.getenv('NORTHFLANK_API_TOKEN','')
          xt=os.getenv('X_WORKER_TOKEN','')
          rt=os.getenv('RENDER_API_KEY','')
          if not nf: sys.exit('NORTHFLANK_API_TOKEN_NOT_CONFIGURED')
          if not xt: sys.exit('X_WORKER_TOKEN_NOT_CONFIGURED')
          if not rt: sys.exit('RENDER_API_KEY_NOT_CONFIGURED')
          for v in (nf,xt,rt): print('::add-mask::'+v)

          nfbase='https://api.northflank.com/v1'
          nfh={'Authorization':'Bearer '+nf,'Content-Type':'application/json'}
          def nfapi(method,path,data=None):
              req=urllib.request.Request(nfbase+path,method=method,headers=nfh,data=(json.dumps(data).encode() if data is not None else None))
              with urllib.request.urlopen(req,timeout=45) as r:
                  raw=r.read().decode('utf-8','replace'); return json.loads(raw) if raw else {}

          projects=nfapi('GET','/projects').get('data',{}).get('projects',[])
          if isinstance(projects,dict): projects=list(projects.values())
          project=next((p.get('id') for p in projects if p.get('name')=='Default'),None)
          if not project: sys.exit('NORTHFLANK_DEFAULT_PROJECT_NOT_FOUND')
          services=nfapi('GET',f'/projects/{project}/services').get('data',{}).get('services',[])
          if isinstance(services,dict): services=list(services.values())
          svc=next((s for s in services if s.get('name')=='anthares-ara-northflank'),None)
          if not svc: sys.exit('CONSOLIDATED_NORTHFLANK_SERVICE_NOT_FOUND')
          sid=svc.get('id') or 'anthares-ara-northflank'
          ports=nfapi('GET',f'/projects/{project}/services/{sid}/ports').get('data',{}).get('ports',[])
          pub=next((p for p in ports if p.get('public') and p.get('dns')),None)
          if not pub: sys.exit('CONSOLIDATED_NORTHFLANK_PUBLIC_DNS_NOT_FOUND')
          base='https://'+pub['dns']
          print('CONSOLIDATED_SERVICE_URL='+base)

          def request_json(url,method='GET',payload=None,auth=None,timeout=150):
              h={'User-Agent':'anthares-render-retirement-proof/1'}
              if auth: h['Authorization']='Bearer '+auth
              data=None
              if payload is not None:
                  h['Content-Type']='application/json'; data=json.dumps(payload).encode()
              req=urllib.request.Request(url,method=method,headers=h,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode('utf-8','replace')
                      return r.status,(json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw) if raw else {}
                  except Exception: body={'raw':raw[:300]}
                  return e.code,body

          verified=None
          last='not-ready'
          for _ in range(180):
              hc,h=request_json(base+'/x/health',timeout=30)
              if hc==200 and h.get('ok') is True and h.get('vault_ready') is True:
                  vc,v=request_json(base+'/x/verify',auth=xt,timeout=120)
                  if vc==200 and v.get('ok') is True and v.get('durable') is True:
                      verified=v; break
                  last='verify '+str(vc)+' '+str(v.get('error') or v)[:220]
              else:
                  last='health '+str(hc)+' '+str(h)[:220]
              time.sleep(10)
          if not verified:
              sys.exit('NORTHFLANK_X_VERIFY_FAILED '+last)
          handle=str(verified.get('handle') or '').lower()
          if handle!='lucasyahn': sys.exit('X_IDENTITY_MISMATCH '+handle)
          print('X_IDENTITY_VERIFIED='+handle)

          payload={
              'text':'Teste técnico — migração da infraestrutura do Universo Anthares para fora do Render concluída.',
              'media_url':'https://samplelib.com/lib/preview/mp4/sample-5s.mp4'
          }
          pc,p=request_json(base+'/x/post',method='POST',payload=payload,auth=xt,timeout=210)
          if pc!=200 or p.get('ok') is not True or p.get('video_verified') is not True:
              sys.exit('REAL_X_PUBLICATION_FAILED HTTP '+str(pc)+' '+str(p)[:500])
          post_url=str(p.get('post_url') or '')
          if '/lucasyahn/status/' not in post_url:
              sys.exit('REAL_X_PUBLICATION_WRONG_IDENTITY '+post_url)
          print('REAL_X_PUBLICATION_PROVEN='+post_url)

          render_base='https://api.render.com/v1'
          rh={'Authorization':'Bearer '+rt,'Accept':'application/json','Content-Type':'application/json','User-Agent':'anthares-final-render-retirement/1'}
          def render(method,path,payload=None):
              for attempt in range(8):
                  req=urllib.request.Request(render_base+path,method=method,headers=rh,data=(json.dumps(payload).encode() if payload is not None else None))
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:
                          raw=r.read().decode('utf-8','replace'); return r.status,(json.loads(raw) if raw else {})
                  except urllib.error.HTTPError as e:
                      if e.code==429:
                          time.sleep(min(75,15*(attempt+1))); continue
                      raw=e.read().decode('utf-8','replace')
                      raise RuntimeError(f'RENDER_HTTP_{e.code} {path} {raw[:250]}')
              raise RuntimeError('RENDER_RATE_LIMIT_EXHAUSTED '+path)

          rid='srv-db6gcoad0e5s73alefn0'
          _,info=render('GET','/services/'+rid)
          if info.get('ownerId')!='tea-d9hnkbt8nd3s73f0876g' or info.get('name')!='anthares-x-render-worker-v3':
              sys.exit('RENDER_X_SERVICE_IDENTITY_MISMATCH')
          if info.get('autoDeployTrigger')!='off':
              render('PATCH','/services/'+rid,{'autoDeployTrigger':'off'})
          if info.get('suspended')!='suspended':
              code,_=render('POST','/services/'+rid+'/suspend')
              if code!=202: sys.exit('RENDER_X_SUSPEND_UNEXPECTED_STATUS '+str(code))
          final=None
          for _ in range(18):
              _,final=render('GET','/services/'+rid)
              if final.get('suspended')=='suspended' and final.get('autoDeployTrigger')=='off': break
              time.sleep(5)
          if not final or final.get('suspended')!='suspended' or final.get('autoDeployTrigger')!='off':
              sys.exit('RENDER_X_NOT_FULLY_RETIRED')
          print('FINAL_RENDER_X_SUSPENDED=1')
          print(json.dumps({'ok':True,'northflank_service':sid,'x_handle':handle,'real_post_url':post_url,'render_x_suspended':True,'render_dependency':False},sort_keys=True))
          PY
