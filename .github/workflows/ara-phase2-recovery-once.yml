name: ARA Phase2 Recovery Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ara-phase2-recovery-once.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Restore temporary admin bridge
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ProgramData\AntharesRemoteAgent'
          $live=Join-Path $root 'anthares-remote-agent.exe'
          $bak=Join-Path $root 'anthares-remote-agent.phase2-disabled.bak.exe'
          if((-not (Test-Path $live)) -and (Test-Path $bak)){ Copy-Item $bak $live -Force }
          if(-not (Test-Path $live)){ throw 'legacy recovery binary unavailable' }
          $existing=@(Get-Process 'anthares-remote-agent' -ErrorAction SilentlyContinue)
          if($existing.Count -eq 0){
            Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
            $env:RUNNER_TRACKING_ID=''
            Start-Process powershell.exe -WindowStyle Hidden -ArgumentList '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-WindowStyle','Hidden','-File',(Join-Path $root 'run-agent.ps1')
            Start-Sleep -Seconds 8
          }
          $p=@(Get-Process 'anthares-remote-agent' -ErrorAction SilentlyContinue)
          [pscustomobject]@{utc=(Get-Date).ToUniversalTime().ToString('o');restored=(Test-Path $live);process_count=$p.Count;pids=@($p.Id)} | ConvertTo-Json -Compress | Set-Content (Join-Path $root 'phase2-recovery-runner.json') -Encoding UTF8
          if($p.Count -eq 0){ throw 'temporary admin bridge did not start' }
