name: Kwai credential safety static gate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kwai-credential-safety-static.yml
      - tests/test_kwai_credential_safety.py
      - tools/kwai_credential_login.py
      - kwai_android_autologin.py
      - kwai_headless_login.sh
      - kwai_remote_android_login.sh
      - kwai_queue_state.sh
      - .github/workflows/kwai-queue-publisher.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential_safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify no public login artifacts or unsafe password fallback
        run: |
          set -euo pipefail
          python3 -m py_compile tools/kwai_credential_login.py kwai_android_autologin.py
          bash -n kwai_headless_login.sh kwai_remote_android_login.sh kwai_queue_state.sh
          python3 -m unittest discover -s tests -p test_kwai_credential_safety.py -q
