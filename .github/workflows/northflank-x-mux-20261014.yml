name: Consolidate X browser into existing Northflank ARA service

on:
  push:
    branches: [main]
    paths:
      - infra/northflank-mux/Dockerfile
      - infra/northflank_mux.py
      - .github/workflows/northflank-x-mux-20261014.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northflank-ara-x-mux
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Deploy fixed X mux without adding a Northflank service
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$NORTHFLANK_API_TOKEN"
          echo "::add-mask::$ARA_SHARED"
          python3 - <<'PY'
          import json,os,time,urllib.error,urllib.request
          token=os.environ['NORTHFLANK_API_TOKEN']; shared=os.environ['ARA_SHARED']
          if not token or not shared: raise SystemExit('REQUIRED_SECRET_MISSING')
          api_base='https://api.northflank.com/v1'; headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def api(method,path,data=None,allow=()):
              req=urllib.request.Request(api_base+path,method=method,headers=headers,data=(json.dumps(data).encode() if data is not None else None))
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace'); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  if e.code in allow:return {'_status':e.code,'_body':raw}
                  raise RuntimeError(f'NORTHFLANK_HTTP_{e.code} {path} {raw[:300]}')
          def get_json(url,auth=False,timeout=150):
              h={'Authorization':'Bearer '+shared} if auth else {}
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw) if raw else {}
                  except Exception: body={'raw':raw[:250]}
                  return e.code,body
              except Exception as e:
                  return 0,{'error':type(e).__name__}
          projects=api('GET','/projects').get('data',{}).get('projects',[])
          if isinstance(projects,dict):projects=list(projects.values())
          project=next((p.get('id') for p in projects if p.get('name')=='Default'),None)
          if not project:raise SystemExit('NORTHFLANK_DEFAULT_PROJECT_NOT_FOUND')
          services=api('GET',f'/projects/{project}/services').get('data',{}).get('services',[])
          if isinstance(services,dict):services=list(services.values())
          svc=next((s for s in services if s.get('name')=='anthares-ara-northflank'),None)
          if not svc:raise SystemExit('EXISTING_ARA_SERVICE_NOT_FOUND')
          sid=svc.get('id') or 'anthares-ara-northflank'
          ports=api('GET',f'/projects/{project}/services/{sid}/ports').get('data',{}).get('ports',[])
          public=next((p for p in ports if p.get('public') and p.get('dns')),None)
          if not public:raise SystemExit('PUBLIC_DNS_NOT_FOUND')
          base='https://'+public['dns']
          hc,h=get_json(base+'/healthz',timeout=30)
          if hc!=200 or not h.get('ok') or h.get('backend')!='postgres':raise SystemExit('ARA_BASELINE_NOT_HEALTHY')
          mux='/infra/northflank-mux/Dockerfile'; fallback='/infra/northflank/Dockerfile'
          def patch(path):
              return api('PATCH',f'/projects/{project}/services/combined/{sid}',{'buildSettings':{'dockerfile':{'buildEngine':'buildkit','dockerFilePath':path,'dockerWorkDir':'/'}}})
          try:
              patch(mux)
              api('POST',f'/projects/{project}/services/{sid}/build',{},allow=(409,))
              print('NORTHFLANK_FIXED_MUX_BUILD_REQUESTED=1',flush=True)
              deadline=time.time()+780; last={}
              while time.time()<deadline:
                  hc,h=get_json(base+'/healthz',timeout=30)
                  xc,x=get_json(base+'/x/health',timeout=30)
                  vc,v=get_json(base+'/x/verify',auth=True,timeout=180)
                  last={'ara_http':hc,'ara_ok':h.get('ok'),'x_http':xc,'x_ok':x.get('ok'),'verify_http':vc,'verify_ok':v.get('ok'),'handle':v.get('handle'),'error':v.get('error')}
                  if hc==200 and h.get('ok') and h.get('backend')=='postgres' and xc==200 and x.get('ok') and vc==200 and v.get('ok') and v.get('durable') and str(v.get('handle','')).lower()=='lucasyahn':
                      print('MUX_DEPLOYMENT_PROVEN='+json.dumps({'ara_postgres':True,'x_worker':True,'handle':'lucasyahn','durable':True,'render_dependency':False},sort_keys=True)); raise SystemExit(0)
                  time.sleep(10)
              raise RuntimeError('MUX_NOT_PROVEN '+json.dumps(last,sort_keys=True)[:700])
          except Exception:
              patch(fallback)
              api('POST',f'/projects/{project}/services/{sid}/build',{},allow=(409,))
              print('ROLLBACK_TO_ARA_BASELINE_REQUESTED=1')
              raise
          PY
