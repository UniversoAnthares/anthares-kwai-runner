name: TikTok Render Central Rehydrate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tiktok-render-central-rehydrate.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  rehydrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONTROL_URL: https://anthares-control.anthares1.workers.dev
      RENDER_URL: https://anthares-tiktok-render-rootless.onrender.com
    steps:
      - name: Rehydrate and validate without publishing
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          control=os.environ['CONTROL_URL'].rstrip('/')
          render=os.environ['RENDER_URL'].rstrip('/')

          def oidc(audience):
              base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              sep='&' if '?' in base else '?'
              url=base+sep+urllib.parse.urlencode({'audience':audience})
              req=urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'],
                  'Accept':'application/json',
              })
              with urllib.request.urlopen(req,timeout=20) as r:
                  token=str(json.load(r).get('value') or '')
              if not token:
                  raise RuntimeError('OIDC token absent')
              return token

          def request_json(url, token, method='GET', payload=None, timeout=180):
              headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'AntharesPublicRehydrate/1'}
              body=None
              if payload is not None:
                  headers['Content-Type']='application/json'
                  body=json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(url,data=body,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return int(getattr(r,'status',200)), json.load(r)
              except urllib.error.HTTPError as e:
                  detail=e.read().decode('utf-8','replace')[:800]
                  raise RuntimeError(f'HTTP {e.code} on {url.split("/")[-1]}: {detail}') from e

          control_token=oidc(control)
          code, central=request_json(control+'/tiktok/session-state',control_token)
          state=central.get('state') if isinstance(central,dict) else None
          cookies=state.get('cookies') if isinstance(state,dict) else None
          if code != 200 or central.get('available') is not True or not isinstance(cookies,list) or not cookies:
              raise RuntimeError('central TikTok session unavailable')
          if len(cookies) > 256:
              raise RuntimeError('central TikTok session exceeds cookie limit')
          print(json.dumps({'CENTRAL_SESSION_LOAD':'OK','cookie_count':len(cookies),'updated_at':central.get('updated_at')},sort_keys=True))

          render_token=oidc('anthares-render-worker')
          code, boot=request_json(render+'/bootstrap-session',render_token,'POST',state,60)
          if code != 200 or boot.get('ok') is not True:
              raise RuntimeError('Render bootstrap failed')
          print(json.dumps({'RENDER_OIDC_BOOTSTRAP':'OK','cookie_count':boot.get('cookies')},sort_keys=True))

          code, status=request_json(render+'/session-status',render_token,timeout=45)
          if code != 200 or status.get('bootstrapped') is not True:
              raise RuntimeError('Render session-status did not confirm bootstrap')
          print(json.dumps({
              'RENDER_SESSION_STATUS':'OK',
              'bootstrapped':status.get('bootstrapped'),
              'identity_verified_before_test':status.get('identity_verified'),
              'central_restore_reason':status.get('central_restore_reason'),
              'central_restore_http':status.get('central_restore_http'),
          },sort_keys=True))

          code, tested=request_json(render+'/session-test',render_token,'POST',{},300)
          safe_test={
              'code':tested.get('code'),
              'identity_verified':tested.get('identity_verified'),
              'central_persisted_from_worker':tested.get('central_persisted'),
              'ok':tested.get('ok'),
              'error':tested.get('error'),
          }
          print(json.dumps({'RENDER_SESSION_TEST':safe_test},sort_keys=True))
          if code != 200 or tested.get('ok') is not True or tested.get('identity_verified') is not True:
              raise RuntimeError('Render session-test/identity verification failed')

          refreshed=tested.get('refreshed_state')
          fresh_cookies=refreshed.get('cookies') if isinstance(refreshed,dict) else None
          if not isinstance(fresh_cookies,list) or not fresh_cookies:
              raise RuntimeError('refreshed TikTok state absent')
          code, persisted=request_json(control+'/tiktok/session-state',control_token,'POST',{
              'cookies':fresh_cookies,
              'origins':refreshed.get('origins') if isinstance(refreshed.get('origins'),list) else [],
          },45)
          if code != 200 or persisted.get('ok') is not True:
              raise RuntimeError('central session persist failed')
          print(json.dumps({'CENTRAL_SESSION_PERSIST':'OK','cookie_count':len(fresh_cookies)},sort_keys=True))

          code, cfg=request_json(render+'/config-status',render_token,timeout=45)
          safe_cfg={'ok':cfg.get('ok'),'configured':cfg.get('configured'),'session_bootstrapped':cfg.get('session_bootstrapped')}
          print(json.dumps({'RENDER_CONFIG_STATUS':safe_cfg},sort_keys=True))
          if code != 200 or cfg.get('ok') is not True:
              raise RuntimeError('Render TikTok configuration incomplete')

          print('TIKTOK_RENDER_REHYDRATE=PRODUCTION_PROVEN')
          PY
