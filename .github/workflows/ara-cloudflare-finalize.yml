name: Finalize ARA Cloudflare-only runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ara-cloudflare-finalize.yml'
      - 'tools/finalize_ara_cloudflare.py'

permissions:
  contents: write

concurrency:
  group: ara-cloudflare-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic ARA finalizer
        run: python3 tools/finalize_ara_cloudflare.py

      - name: Validate source and agent tests
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-ara-backup/src/index.js
          node --check cloudflare-ara-reserva/src/index.js
          ! grep -q 'onrender.com' cloudflare-ara-backup/src/index.js
          ! grep -q 'floot.app' cloudflare-ara-backup/src/index.js
          grep -q 'cloudflare-single-authority-v1' cloudflare-ara-backup/src/index.js
          grep -q '/v1/device/status' cloudflare-ara-backup/src/index.js
          grep -q 'anthares-ara-reserva.anthares1.workers.dev' anthares-remote-agent/windows/run-agent-system-supervisor.ps1
          grep -q 'AntharesRemoteSystemSupervisorV4' anthares-remote-agent/windows/run-agent-system-supervisor.ps1
          grep -q 'os.Exit(23)' anthares-remote-agent/cmd/agent/main.go
          cd anthares-remote-agent
          go test ./...

      - name: Dry-run Cloudflare Workers
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          (cd cloudflare-ara-backup && npx --yes wrangler@4.43.0 deploy --dry-run --outdir /tmp/ara-primary)
          (cd cloudflare-ara-reserva && npx --yes wrangler@4.43.0 deploy --dry-run --outdir /tmp/ara-reserve)

      - name: Deploy canonical controller and reserve proxy
        shell: bash
        run: |
          set -euo pipefail
          (cd cloudflare-ara-backup && npx --yes wrangler@4.43.0 deploy)
          (cd cloudflare-ara-reserva && npx --yes wrangler@4.43.0 deploy)

      - name: Verify Cloudflare-only persistence and reserve path
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://anthares-ara-backup.anthares1.workers.dev https://anthares-ara-reserva.anthares1.workers.dev; do
            h="$(curl -fsS "$origin/healthz")"
            echo "$h"
            echo "$h" | grep -q '"ok":true'
            echo "$h" | grep -q 'cloudflare-durable-object-sqlite'
            echo "$h" | grep -q '"shared_fencing":"cloudflare-single-authority-v1"'
            s="$(curl -fsS "$origin/_selftest")"
            echo "$s" | grep -q '"ok":true'
            code="$(curl -sS -o /tmp/ara-auth.json -w '%{http_code}' -H 'X-Anthares-Device: DESKTOP-FTDK0HP' "$origin/v1/device/auth-check")"
            test "$code" = 401
          done
          echo 'ARA_CLOUDFLARE_ONLY_FINALIZED=1'

      - name: Commit finalized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UniversoAnthares'
          git config user.email '81930373+UniversoAnthares@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(ara): finalize Cloudflare-only control and self-healing Windows agent'
          git push origin HEAD:main
