name: Anthares Recovery Bootstrap

# Recovery is verification-only. The canonical deployment pipeline is
# anthares-reserva-browser-deploy.yml and Cloudflare Git Builds.
# Do not deploy a second entrypoint or mutate authentication/session state.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-bootstrap.yml'
      - 'anthares-reserva-browser/**'

permissions:
  contents: read

concurrency:
  group: anthares-recovery-verification
  cancel-in-progress: true

jobs:
  verify-recovery-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical Worker source
        working-directory: anthares-reserva-browser
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          node --check src/tiktok-owner-entry.js
          grep -Eq '^main = "src/tiktok-owner-entry.js"$' wrangler.toml
          echo 'RECOVERY_SOURCE_VALIDATION_OK=1'
      - name: Verify active Worker health without deployment
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 15 \
            https://anthares-reserva-browser.anthares1.workers.dev/health \
            -o /tmp/anthares-worker-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/anthares-worker-health.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d.get('ok') is True, 'worker health not OK'
          assert d.get('service') == 'anthares-reserva-browser', 'unexpected service'
          assert d.get('provider') == 'cloudflare', 'unexpected provider'
          assert d.get('browser_binding') is True, 'browser binding unavailable'
          assert d.get('durable_state_binding') is True, 'durable state binding unavailable'
          assert d.get('render_required') is False, 'unexpected Render dependency'
          print('RECOVERY_WORKER_READINESS_OK=1')
          PY
      - name: Verify unauthenticated protection boundary
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/recovery-unauth.json -w '%{http_code}' --max-time 15 \
            -X POST https://anthares-reserva-browser.anthares1.workers.dev/tiktok/import \
            -H 'content-type: application/json' \
            --data '{}')"
          test "$code" = "401"
          echo 'RECOVERY_AUTH_BOUNDARY_OK=1'
