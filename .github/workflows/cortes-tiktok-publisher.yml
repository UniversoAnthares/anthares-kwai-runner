name: CORTES TikTok - authenticated readiness
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-tiktok-publisher.yml'
      - 'tools/cortes_tiktok_publish.py'
      - 'tests/test_cortes_tiktok_publish.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-tiktok-canonical-publisher
  cancel-in-progress: false
jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      ANTHARES_TIKTOK_WORKER_URL: https://anthares-tiktok-worker.anthares1.workers.dev
      CORTES_TIKTOK_PREFLIGHT: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify offline TikTok safety contracts
        run: |
          python3 -m py_compile tools/cortes_tiktok_publish.py
          python3 -m unittest discover -s tests -p 'test_cortes_tiktok_publish.py' -v
      - name: Verify existing remote secret bindings by presence only
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json
          names=('ARA_SHARED','WP_SITE_URL','WP_USERNAME','WP_APP_PASSWORD')
          print(json.dumps({'required_secrets_present':{k:bool(os.environ.get(k)) for k in names}},sort_keys=True))
          if not all(os.environ.get(k) for k in names):
              raise SystemExit('TIKTOK_CORTES_REQUIRED_SECRET_MISSING')
          PY
      - name: Verify Northflank TikTok identity and WordPress stored short readiness
        run: python3 -u tools/cortes_tiktok_publish.py
