name: CORTES TikTok hosted canonical Neon publisher

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/cortes-tiktok-publisher.yml'
      - 'tools/cortes_tiktok_queue_consumer.py'
      - 'infra/neon-cortes-tiktok/**'
      - 'infra/cloudflare-cortes-tiktok-ha/**'
      - 'tests/test_cortes_tiktok_neon_ha.mjs'
      - 'direct-tiktok-publisher/tiktok_creator_inventory.py'
      - 'direct-tiktok-publisher/tiktok_cloud_publish.py'
      - 'tools/cortes_tiktok_hosted_publish.py'
      - 'tests/test_tiktok_creator_inventory.py'
      - 'tests/test_tiktok_cloud_event_guard.py'
      - 'tests/test_cortes_tiktok_queue_consumer.py'
      - 'tools/tiktok_upload_readonly_diagnostic.py'
      - 'tools/cortes_tiktok_uncertain_batch_audit.py'
      - 'vercel-ara-primary/api/cortes-tiktok.mjs'
      - 'vercel-ara-primary/api/router-entry.mjs'
      - 'vercel-ara-primary/vercel.json'
  schedule:
    - cron: '*/3 * * * *'
    - cron: '17 11 * * *' # independent daily forensic readback, no publication
  workflow_run:
    workflows: ['Anthares Core Supervisor']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-tiktok-publisher.yml'
      - 'tools/cortes_tiktok_queue_consumer.py'
      - 'infra/neon-cortes-tiktok/**'
      - 'infra/cloudflare-cortes-tiktok-ha/**'
      - 'tests/test_cortes_tiktok_neon_ha.mjs'
      - 'direct-tiktok-publisher/tiktok_creator_inventory.py'
      - 'direct-tiktok-publisher/tiktok_cloud_publish.py'
      - 'tools/cortes_tiktok_hosted_publish.py'
      - 'tests/test_tiktok_creator_inventory.py'
      - 'tests/test_tiktok_cloud_event_guard.py'
      - 'tests/test_cortes_tiktok_queue_consumer.py'
      - 'tools/cortes_tiktok_uncertain_batch_audit.py'

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: cortes-tiktok-canonical-publisher
  cancel-in-progress: false

jobs:
  tiktok:
    if: github.event_name == 'pull_request' || (github.event_name != 'workflow_run' && (vars.TIKTOK_CODEBERG_PRIMARY != 'true' && vars.TIKTOK_FORGEJO_PRIMARY != 'true'))
    runs-on: ubuntu-24.04
    outputs:
      queue_followup: ${{ steps.publish.outputs.queue_followup }}
    timeout-minutes: 15
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate queue consumer and TikTok safety contracts
        run: |
          python3 -m py_compile tools/cortes_tiktok_queue_consumer.py tools/cortes_tiktok_hosted_publish.py tools/tiktok_uncertain_post_audit.py tools/cortes_tiktok_uncertain_batch_audit.py tools/cortes_tiktok_pacing_receipt_watch.py
          node --check vercel-ara-primary/api/cortes-tiktok.mjs
          node --check infra/neon-cortes-tiktok/index.mjs
          node --check infra/cloudflare-cortes-tiktok-ha/src/index.js
          node --test tests/test_cortes_tiktok_neon_ha.mjs
          CORTES_TIKTOK_HOSTED_DRY_RUN=1 python3 -u tools/cortes_tiktok_hosted_publish.py
          python3 -m unittest discover -s tests -p 'test_cortes_tiktok*.py' -v
          python3 -m unittest discover -s tests -p 'test_tiktok_creator_inventory.py' -v
          python3 -m unittest discover -s tests -p 'test_tiktok_cloud_event_guard.py' -v
      - name: Check TikTok worker credential binding (presence only)
        run: |
          python3 - <<'PY'
          import os
          print('TIKTOK_WORKER_SECRET_BOUND=' + str(bool(os.getenv('ARA_SHARED'))))
          PY
      - name: Verify GitHub OIDC against Neon, Cloudflare and TikTok worker (read-only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request
          import urllib.parse
          sys.path.insert(0, 'tools')
          import cortes_tiktok_queue_consumer as q

          def probe(url, credentials=None):
              headers={'Accept':'application/json', 'User-Agent':'Anthares-CortesTikTok-AuthorizedWorker/1.0', **(credentials or {})}
              req=urllib.request.Request(url, headers=headers, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=10 if 'northflank' in url else 25) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as exc:
                  route=str(exc.headers.get('X-Anthares-TikTok-Route') or 'none')
                  ctype=str(exc.headers.get('Content-Type') or '')
                  detail='non_json'
                  if 'application/json' in ctype:
                      try:
                          obj=json.loads(exc.read(1024))
                          detail=str(obj.get('error') or 'none')[:64]
                      except (ValueError,AttributeError):
                          detail='invalid_json'
                  detail=''.join(c for c in detail if c.isalnum() or c in '_-')
                  ray=str(exc.headers.get('CF-Ray') or 'none')[:90]
                  srv=str(exc.headers.get('Server') or 'none')[:40]
                  print('TIKTOK_OIDC_DENIAL http='+str(exc.code)+' host='+str(urllib.parse.urlparse(url).hostname)+' route='+route+' server='+srv+' ray='+ray+' error='+detail,flush=True)
                  return exc.code, {}
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  print('TIKTOK_OIDC_TRANSPORT '+str(urllib.parse.urlparse(url).hostname)+' '+type(exc).__name__,flush=True)
                  return 0, {}

          queue_token=q.oidc(q.AUDIENCE)
          worker_token=q.worker_auth()
          errors=[]
          warnings=[]
          for name,base in (('NEON_DIRECT',q.BACKENDS[0]),('CLOUDFLARE_HA',q.BACKENDS[1])):
              url=base.rstrip('/')+'?action=status'
              code,result=probe(url,queue_token)
              if code!=200 or result.get('ok') is not True or not isinstance(result.get('count'),dict):
                  (errors if name=='NEON_DIRECT' else warnings).append('TIKTOK_OIDC_'+name+'_AUTHORIZED_READ_FAILED_'+str(code))
              else:
                  print('TIKTOK_OIDC_'+name+'_AUTHORIZED_STATUS=PASS',flush=True)
              code,_=probe(url)
              if code!=401:
                  (errors if code==200 or name=='NEON_DIRECT' else warnings).append('TIKTOK_OIDC_'+name+'_ANONYMOUS_NOT_REJECTED_'+str(code))
              else:
                  print('TIKTOK_OIDC_'+name+'_DENIES_ANONYMOUS=PASS',flush=True)
              code,_=probe(url,worker_token)
              if code!=401:
                  (errors if code==200 or name=='NEON_DIRECT' else warnings).append('TIKTOK_OIDC_'+name+'_WRONG_AUDIENCE_ACCEPTED_'+str(code))
              else:
                  print('TIKTOK_OIDC_'+name+'_DENIES_WRONG_AUDIENCE=PASS',flush=True)

          endpoint=q.WORKER+'/session-status'
          code,result=probe(endpoint,worker_token)
          if code!=200 or result.get('ok') is not True:
              warnings.append('TIKTOK_OIDC_WORKER_AUTH_UNVERIFIED_'+str(code))
          else:
              print('TIKTOK_OIDC_WORKER_AUTHORIZED_READ=PASS',flush=True)
              print('TIKTOK_WORKER_SESSION_READY='+str(bool(result.get('ready_for_tiktok'))),flush=True)
          code,_=probe(endpoint)
          if code not in (401,403):
              (errors if code==200 else warnings).append('TIKTOK_OIDC_WORKER_ANONYMOUS_NOT_REJECTED_'+str(code))
          else:
              print('TIKTOK_OIDC_WORKER_DENIES_ANONYMOUS=PASS',flush=True)
          for entry in warnings:
              print('TIKTOK_OIDC_OPTIONAL_UNVERIFIED='+entry,flush=True)
          if errors:
              raise RuntimeError(';'.join(errors))
          PY
      - name: Install GitHub-hosted TikTok browser and vault dependencies
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q playwright requests cryptography
          # Survive transient Playwright CDN / DNS outages.
          installed=0
          for attempt in 1 2 3; do
            if PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=120000 python3 -m playwright install chromium; then
              installed=1
              break
            fi
            echo "CORTES_TIKTOK_PLAYWRIGHT_INSTALL_RETRY=$attempt"
            sleep $((attempt * 8))
          done
          if [ "$installed" -ne 1 ]; then
            echo CORTES_TIKTOK_PLAYWRIGHT_ALT_CDN_FALLBACK=1
            PLAYWRIGHT_DOWNLOAD_HOST=https://playwright.azureedge.net PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=120000 python3 -m playwright install chromium
          fi
      - name: Read-only TikTok upload page diagnostic (once on push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 -u tools/tiktok_upload_readonly_diagnostic.py
      - name: Read-only TikTok upload probe in virtual graphical Chromium
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            TIKTOK_PROBE_HEADFUL=1 xvfb-run -a python3 -u tools/tiktok_upload_readonly_diagnostic.py
          else
            echo CORTES_TIKTOK_HEADFUL_PROBE_SKIPPED_NO_XVFB
          fi
      - name: Independently audit Neon and Cloudflare start receipts, hard window and live due (read-only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        timeout-minutes: 3
        run: python3 -u tools/cortes_tiktok_pacing_receipt_watch.py
      - name: Reconcile ten historic uncertain TikTok segments using signed-in Studio (read-only)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *'))
        continue-on-error: true
        timeout-minutes: 8
        run: python3 -u tools/cortes_tiktok_uncertain_batch_audit.py
      - name: Audit original uncertain TikTok clip on owned account without upload
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CORTES_TIKTOK_FORENSIC_SEGMENT_ID: 'g1:9CIk-I_3VhM:252:337'
        run: python3 -u tools/tiktok_uncertain_post_audit.py
      - name: Verify the known TikTok Studio marker via production inventory (read-only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          sys.path.insert(0,'direct-tiktok-publisher')
          import cortes_tiktok_queue_consumer as q
          from tiktok_creator_inventory import inventory_studio
          records=inventory_studio('universo.anthares')
          evidence=q.found({'ok':True,'account':'universo.anthares','items':records},
                           'g1:9CIk-I_3VhM:252:337')
          if evidence!='7698574965993458964':
              print('CORTES_TIKTOK_LEGACY_STUDIO_MARKER_UNVERIFIED_NONBLOCKING')
          else:
              print('CORTES_TIKTOK_STUDIO_RECONCILIATION_READY=1')
          PY
      - name: Publish or reconcile at most one queued TikTok short (main only)
        id: publish
        if: github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' && github.event.schedule != '17 11 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'UniversoAnthares/anthares-kwai-runner' && github.event.workflow_run.name == 'Anthares Core Supervisor'))
        env:
          EXPECTED_TIKTOK_USERNAME: universo.anthares
          TIKTOK_PUBLISH_NOT_BEFORE_UTC: '2026-10-20T10:00:00Z'
        run: python3 -u tools/cortes_tiktok_hosted_publish.py

  # The Neon endpoint only authorizes OIDC events from its canonical
  # workflow_dispatch/schedule caller. For a Core Supervisor workflow_run,
  # dispatch that canonical entrypoint instead of calling Neon directly.
  relay:
    if: (vars.TIKTOK_CODEBERG_PRIMARY != 'true' && vars.TIKTOK_FORGEJO_PRIMARY != 'true') && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'UniversoAnthares/anthares-kwai-runner' && github.event.workflow_run.name == 'Anthares Core Supervisor'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Activate the allowlisted canonical TikTok publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/cortes-tiktok-publisher.yml/dispatches" -f ref=main
          echo CORTES_TIKTOK_CANONICAL_DISPATCH_ACK=1


  # Delayed continuation is a second, event-driven trigger alongside cron.
  # The canonical Neon lease and STARTED fence serialize every upload.
  followup:
    needs: [tiktok]
    if: ${{ (vars.TIKTOK_CODEBERG_PRIMARY != 'true' && vars.TIKTOK_FORGEJO_PRIMARY != 'true') && github.ref == 'refs/heads/main' && needs.tiktok.result == 'success' && needs.tiktok.outputs.queue_followup == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
    steps:
      - name: Continue verified queue after the minimum safe cadence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 180
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/cortes-tiktok-publisher.yml/dispatches" -f ref=main
          echo CORTES_TIKTOK_DELAYED_FOLLOWUP_DISPATCH_ACK=1
      - name: Independently wake Instagram and LinkedIn cloud publishers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Independent redundancy for dropped workflow_run/schedule events.
          # Separate phases avoid simultaneous relay wakeups for one tick.
          if (( GITHUB_RUN_NUMBER % 8 == 4 )); then
            gh workflow run cortes-instagram-direct-cloud.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo CORTES_INSTAGRAM_DIRECT_FOLLOWUP_WAKEUP=1
          fi
          if (( GITHUB_RUN_NUMBER % 16 == 8 )); then
            gh workflow run cortes-linkedin-personal-fallback-cloud.yml --repo "$GITHUB_REPOSITORY" --ref main -f reconcile_only=false
            echo CORTES_LINKEDIN_DIRECT_FOLLOWUP_WAKEUP=1
          fi

  # Event-driven P0 QA. The ordinary 12-hour QA cadence is unchanged.
  qa_tiktok_p0:
    needs: [tiktok, relay, followup]
    if: ${{ always() && (needs.tiktok.result == 'failure' || needs.relay.result == 'failure' || needs.followup.result == 'failure') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Alert central QA immediately, once per failed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker="CORTES_QA_P0_TIKTOK_RUN_$GITHUB_RUN_ID"
          if gh api "repos/$GITHUB_REPOSITORY/issues/283/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$marker"; then
            echo CORTES_QA_P0_DUPLICATE_SKIPPED=1
            exit 0
          fi
          body="$(printf '%s\n' \
            '**[QA P0][TikTok] Falha na publicação CORTES — correção imediata.**' \
            '' \
            "Evidência: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "Marcador deduplicado: $marker" \
            '' \
            'Verificar MP4, WordPress, Playwright, OIDC e lease Neon. Retry apenas antes de STARTED; depois reconciliar por prova remota. Limite: 100 inícios/dia por conta; preservar excedentes na fila.')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/283/comments" -f "body=$body" >/dev/null
          echo CORTES_QA_P0_NOTIFIED=1
