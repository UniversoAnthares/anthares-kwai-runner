name: CORTES TikTok remote Neon consumer
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'tools/cortes_tiktok_neon_consumer.py'
      - '.github/workflows/cortes-tiktok-publisher.yml'
  push:
    branches: [main]
    paths:
      - 'tools/cortes_tiktok_neon_consumer.py'
      - '.github/workflows/cortes-tiktok-publisher.yml'
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-tiktok-canonical-publisher
  cancel-in-progress: false
jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      ANTHARES_TIKTOK_WORKER_URL: https://anthares-tiktok-worker.anthares1.workers.dev
      CORTES_TIKTOK_PREFLIGHT: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify TikTok contract and queue consumer syntax
        run: |
          python3 -m py_compile tools/cortes_tiktok_neon_consumer.py tools/cortes_tiktok_publish.py
          python3 -m unittest discover -s tests -p 'test_cortes_tiktok_publish.py' -v
      - name: Verify existing worker credential presence without exposing it
        if: github.event_name != 'pull_request'
        run: |
          test -n "$ARA_SHARED" || { echo ARA_SHARED_MISSING; exit 2; }
      - name: Verify authenticated TikTok remote queue and identity
        if: github.event_name != 'pull_request'
        run: python3 -u tools/cortes_tiktok_neon_consumer.py
