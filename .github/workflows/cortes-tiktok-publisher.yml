name: CORTES TikTok remote Neon consumer

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/cortes-tiktok-publisher.yml'
      - 'tools/cortes_tiktok_queue_consumer.py'
      - 'tests/test_cortes_tiktok_queue_consumer.py'
      - 'vercel-ara-primary/api/cortes-tiktok.mjs'
      - 'vercel-ara-primary/api/router-entry.mjs'
      - 'vercel-ara-primary/vercel.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-tiktok-publisher.yml'
      - 'tools/cortes_tiktok_queue_consumer.py'
      - 'tests/test_cortes_tiktok_queue_consumer.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cortes-tiktok-canonical-publisher
  cancel-in-progress: false

jobs:
  tiktok:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate queue consumer and TikTok safety contracts
        run: |
          python3 -m py_compile tools/cortes_tiktok_queue_consumer.py tools/cortes_tiktok_hosted_publish.py
          CORTES_TIKTOK_HOSTED_DRY_RUN=1 python3 -u tools/cortes_tiktok_hosted_publish.py
          python3 -m unittest discover -s tests -p 'test_cortes_tiktok_queue_consumer.py' -v
      - name: Check TikTok worker credential binding (presence only)
        run: |
          python3 - <<'PY'
          import os
          print('TIKTOK_WORKER_SECRET_BOUND=' + str(bool(os.getenv('ARA_SHARED'))))
          PY
      - name: Publish or reconcile one queued TikTok clip (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 -u tools/cortes_tiktok_queue_consumer.py
