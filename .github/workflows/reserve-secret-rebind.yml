name: Rebind Anthares reserve secrets
on:
  push:
    paths:
      - .github/workflows/reserve-secret-rebind.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      ANTHARES_RESERVA_TOKEN: ${{ secrets.ANTHARES_RESERVA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebind machine and Northflank secrets after deployment
        working-directory: anthares-reserva-browser
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$ARA_SHARED"
          if [ -n "${ANTHARES_RESERVA_TOKEN:-}" ]; then
            reserve="$ANTHARES_RESERVA_TOKEN"
          else
            reserve="$(python3 - <<'PY'
          import hashlib,os
          print(hashlib.sha256(('anthares-reserva-browser-v1:'+os.environ['ARA_SHARED']).encode()).hexdigest())
          PY
          )"
          fi
          echo "::add-mask::$reserve"
          echo "::add-mask::$ARA_SHARED"
          printf '%s' "$reserve" | npx --yes wrangler@4.151.0 secret put ANTHARES_RESERVA_TOKEN
          printf '%s' "$ARA_SHARED" | npx --yes wrangler@4.151.0 secret put NORTHFLANK_BROWSER_TOKEN
          printf 'RESERVE_TOKEN=%s\n' "$reserve" >> "$GITHUB_ENV"
      - name: Audit secret bindings by name only
        working-directory: anthares-reserva-browser
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 secret list > /tmp/secrets.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/secrets.json'))
          names={x.get('name') for x in d if isinstance(x,dict)}
          for required in ('ANTHARES_RESERVA_TOKEN','NORTHFLANK_BROWSER_TOKEN'):
              assert required in names,(required,sorted(names))
          print('MACHINE_SECRETS_PRESENT=1')
          print('OWNER_APPROVAL_HASH_PRESENT='+('1' if 'OWNER_APPROVAL_HASH' in names else '0'))
          PY
      - name: Verify Northflank bridge through reserve worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --max-time 20 -H "Authorization: Bearer $RESERVE_TOKEN" https://anthares-reserva-browser.anthares1.workers.dev/tiktok/northflank/status -o /tmp/status.json
          cat /tmp/status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          assert d.get('ok') is True,d
          assert d.get('backend')=='northflank_chromium_cdp',d
          print('RESERVE_TO_NORTHFLANK_BRIDGE_OK=1')
          PY
