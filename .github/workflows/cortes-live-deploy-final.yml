name: CORTES live deploy final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-live-deploy-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_PROJECT_ID: '87361776'
      EXPECTED_WP_COMMIT: '2761fda6c894fb4e0aa83baf1a5e4e1b98d85ca5'
    steps:
      - name: Fetch protected deployment credentials from GitLab
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITLAB_TOKEN:-}" || { echo '::error::GITLAB_TOKEN is not configured'; exit 2; }
          python3 - <<'PY'
          import json, os, sys, urllib.request
          token=os.environ['GITLAB_TOKEN']
          project=os.environ['GITLAB_PROJECT_ID']
          req=urllib.request.Request(
              f'https://gitlab.com/api/v4/projects/{project}/variables?per_page=100',
              headers={'PRIVATE-TOKEN':token,'User-Agent':'anthares-cortes-deploy'}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              rows=json.load(r)
          vals={str(x.get('key')):str(x.get('value') or '') for x in rows}
          required=['ANTHARES_QA_SSH_KEY','ANTHARES_QA_SSH_HOST','ANTHARES_QA_SSH_USER','GITHUB_MIRROR_TOKEN']
          missing=[k for k in required if not vals.get(k)]
          if missing:
              print('::error::Missing GitLab deployment variables: '+','.join(missing))
              sys.exit(3)
          port=vals.get('ANTHARES_QA_SSH_PORT') or '65002'
          selected={k:vals[k] for k in required}
          selected['ANTHARES_QA_SSH_PORT']=port
          for value in selected.values():
              if value:
                  print('::add-mask::'+value.replace('\r','').replace('\n','%0A'))
          with open('/tmp/cortes-vars.json','w',encoding='utf-8') as f:
              json.dump(selected,f)
          PY

      - name: Prepare private WordPress source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/cortes-vars.json'))
          open('/tmp/github-token','w').write(v['GITHUB_MIRROR_TOKEN'])
          PY
          chmod 600 /tmp/github-token
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$(cat /tmp/github-token)" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git clone --quiet --no-checkout https://github.com/UniversoAnthares/anthares-wordpress.git /tmp/anthares-wordpress
          cd /tmp/anthares-wordpress
          git checkout --quiet "$EXPECTED_WP_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_WP_COMMIT"
          test -f anthares-clipper/anthares-clipper.php
          test -f anthares-clipper/cortes-control.php
          test -f anthares-clipper/cortes-migrations.php
          grep -q 'Version: 2.7.3' anthares-clipper/anthares-clipper.php
          rm -f ~/.git-credentials /tmp/github-token

      - name: Deploy plugin atomically and validate live WordPress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/cortes-vars.json'))
          open('/tmp/anthares_qa','w').write(v['ANTHARES_QA_SSH_KEY'])
          open('/tmp/ssh_host','w').write(v['ANTHARES_QA_SSH_HOST'])
          open('/tmp/ssh_user','w').write(v['ANTHARES_QA_SSH_USER'])
          open('/tmp/ssh_port','w').write(v['ANTHARES_QA_SSH_PORT'])
          PY
          chmod 600 /tmp/anthares_qa
          host="$(cat /tmp/ssh_host)"
          user="$(cat /tmp/ssh_user)"
          port="$(cat /tmp/ssh_port)"
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "$port" "$host" >> ~/.ssh/known_hosts 2>/dev/null
          remote_tmp="/tmp/anthares-clipper-cortes-${GITHUB_RUN_ID}"
          ssh -p "$port" -i /tmp/anthares_qa -o IdentitiesOnly=yes "$user@$host" "rm -rf '$remote_tmp'"
          scp -r -P "$port" -i /tmp/anthares_qa -o IdentitiesOnly=yes /tmp/anthares-wordpress/anthares-clipper "$user@$host:$remote_tmp"
          ssh -p "$port" -i /tmp/anthares_qa -o IdentitiesOnly=yes "$user@$host" "REMOTE_SRC='$remote_tmp' EXPECTED_WP_COMMIT='$EXPECTED_WP_COMMIT' bash -se" <<'REMOTE'
          set -euo pipefail
          SITE="$HOME/domains/anthares.us/public_html"
          LIVE="$SITE/wp-content/plugins/anthares-clipper"
          SRC="$REMOTE_SRC"
          PHP=/opt/alt/php85/usr/bin/php
          WP=/usr/local/bin/wp
          test -d "$SITE"
          test -d "$SRC"
          test -f "$SRC/cortes-control.php"
          find "$SRC" -type f -name '*.php' -print0 | xargs -0 -n1 "$PHP" -l >/tmp/cortes-live-php-lint.txt
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          staged="$SITE/wp-content/plugins/anthares-clipper.deploying-$stamp"
          backup="$SITE/wp-content/plugins/anthares-clipper.backup-$stamp"
          rm -rf "$staged"
          mv "$SRC" "$staged"
          if [ -d "$LIVE" ]; then mv "$LIVE" "$backup"; fi
          mv "$staged" "$LIVE"
          cd "$SITE"
          "$PHP" "$WP" plugin activate anthares-clipper --quiet || true
          "$PHP" "$WP" eval '
            if (function_exists("anthares_cortes_maybe_migrate")) { anthares_cortes_maybe_migrate(); }
            if (function_exists("anthares_cortes_ensure_page")) { anthares_cortes_ensure_page(); }
            $pid=(int)get_option("anthares_cortes_page_id",0);
            $p=$pid?get_post($pid):null;
            $n=function_exists("anthares_cortes_networks_get")?anthares_cortes_networks_get():[];
            $r=rest_get_server()->get_routes();
            $o=[
              "plugin_version"=>defined("ANTHARES_CLIPPER_VERSION")?ANTHARES_CLIPPER_VERSION:"missing",
              "cortes_function"=>function_exists("anthares_cortes_render"),
              "page_id"=>$pid,
              "page_title"=>$p?$p->post_title:null,
              "page_slug"=>$p?$p->post_name:null,
              "page_status"=>$p?$p->post_status:null,
              "schema"=>(int)get_option("anthares_cortes_schema_version",0),
              "networks"=>$n,
              "route_state"=>isset($r["/anthares/v1/cortes/state"]),
              "route_network"=>isset($r["/anthares/v1/cortes/network"]),
              "legacy_cutoff"=>defined("ANTHARES_CORTES_LEGACY_CUTOFF")?ANTHARES_CORTES_LEGACY_CUTOFF:null,
              "short_max"=>defined("ANTHARES_CORTES_SHORT_MAX")?ANTHARES_CORTES_SHORT_MAX:null
            ];
            if ($o["plugin_version"]!=="2.7.3" || !$o["cortes_function"] || $o["page_title"]!=="CORTES" || $o["page_slug"]!=="cortes" || $o["page_status"]!=="publish" || $o["schema"]<2 || !$o["route_state"] || !$o["route_network"] || $o["legacy_cutoff"]!==137 || $o["short_max"]!==100) { fwrite(STDERR,"CORTES_VALIDATION_FAILED ".wp_json_encode($o)."\n"); exit(7); }
            echo "CORTES_STATE=".wp_json_encode($o,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          '
          grep -q 'Version: 2.7.3' "$LIVE/anthares-clipper.php"
          echo -n 'CORTES_CONTROL_SHA='; sha256sum "$LIVE/cortes-control.php" | awk '{print $1}'
          echo -n 'CORTES_MIGRATIONS_SHA='; sha256sum "$LIVE/cortes-migrations.php" | awk '{print $1}'
          echo "CORTES_LIVE_DEPLOY=PROVEN"
          REMOTE
          rm -f /tmp/anthares_qa /tmp/ssh_host /tmp/ssh_user /tmp/ssh_port /tmp/cortes-vars.json

      - name: Public smoke
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cortes.html -w '%{http_code}' https://anthares.us/cortes/)
          echo "CORTES_PUBLIC_HTTP=$code"
          test "$code" = 200
