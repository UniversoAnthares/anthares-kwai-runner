name: One-time Studio Posts inventory pagination
on:
  push:
    branches: [main]
    paths: ['.github/workflows/studio-content-pagination-once.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Read current Studio Posts lists and pagination with no interaction
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN;if(!token||token.length<20)throw Error('TOKEN_MISSING');
          const get=async path=>{const r=await fetch('https://api.northflank.com/v1'+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('NORTHFLANK_HTTP_'+r.status);return r.json()};
          const found=[];for(const p of (await get('/projects')).data?.projects||[])for(const s of (await get('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[])if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);
          if(found.length!==1)throw Error('SERVICE_NOT_UNIQUE');
          const ctx=new ApiClientInMemoryContextProvider();await ctx.addContext({name:'read',token});
          const cli=new ApiClient(ctx),[projectId,serviceId]=found[0];
          const script=String.raw`
          import sys,json
          sys.path.insert(0,"/app/render-tiktok-worker")
          from browser_executor import _cdp
          expr = r"""(()=>{
           const text=(document.body?.innerText||'');
           const links=[...document.querySelectorAll('a[href*="/video/"]')].map(a=>({url:a.href,text:(a.innerText||a.getAttribute('title')||a.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,250)}));
           const controls=[...document.querySelectorAll('button,[role=button],input,select')].map(el=>({text:(el.innerText||el.getAttribute('aria-label')||el.getAttribute('placeholder')||'').trim().replace(/\s+/g,' ').slice(0,90),disabled:!!el.disabled,ariaDisabled:el.getAttribute('aria-disabled'),title:el.getAttribute('title')||'',type:el.tagName})).filter(x=>x.text||x.title).slice(0,80);
           return {path:location.pathname,textLength:text.length,text:text.slice(0,2800),videoCount:links.length,links:links.slice(0,35),controls,
           hasNext:[...document.querySelectorAll('[aria-label],[title]')].filter(el=>/next|próxim|mais|load more/i.test((el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||''))).map(el=>({t:el.outerHTML.slice(0,200)})).slice(0,8)};
          })()"""
          v=_cdp("Runtime.evaluate",{"expression":expr,"returnByValue":True},timeout=20)
          d=(v.get("result") or {}).get("value") or {}
          if not d:raise RuntimeError("EMPTY_STUDIO_DOM")
          for k,x in d.items():
           print(k.upper()+"="+json.dumps(x,ensure_ascii=False)[:4800],flush=True)
          `;
          const r=await cli.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',script]});
          console.log('INSPECT_EXIT='+String(r.commandResult?.exitCode));
          console.log('INSPECT_RESULT='+String(r.stdOut||'').slice(0,12000).replace(/[\r\n]+/g,' | '));
          if(r.commandResult?.exitCode!==0)throw Error('READ_FAILED');
          NODE
