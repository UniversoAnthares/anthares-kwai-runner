name: Canonical Executor Dynamic QA
on:
  push:
    branches: [main]
    paths: ['.canonical-executor-dynamic-trigger']
permissions: {contents: read}
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        case: [confirmed,uncertain-reconciled,uncertain-remains,publish-fails-before-boundary,claim-fails]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          t="$(mktemp -d)"; cp kwai_run_next_job.sh "$t/"; cd "$t"; : >calls
          cat > kwai_claim_job.sh <<'SH'
          [ "${CASE}" = claim-fails ] && exit 44
          printf '%s\n' 'KWAI_QUEUE_JOB_ID=j' 'KWAI_LEASE_GENERATION=3' 'KWAI_SOURCE_ID=s' 'KWAI_SOURCE_START=1' 'KWAI_SOURCE_END=2' 'KWAI_VIDEO_URL=u' 'KWAI_VIDEO_TITLE=t' 'KWAI_EXPECTED_ACCOUNT=a' >>"$GITHUB_ENV"
          SH
          cat > kwai_real_publish_promotion_gate.py <<'PY'
          pass
          PY
          cat > kwai_publish.sh <<'SH'
          echo publish >>calls
          case "$CASE" in
            confirmed) echo STATE=CONFIRMED >kwai-publish-status.txt; exit 0;;
            uncertain-reconciled|uncertain-remains) echo MEDIA_SHA256=abc >kwai-publish-status.txt; exit 90;;
            publish-fails-before-boundary) exit 82;;
          esac
          SH
          cat > kwai_reconcile_uncertain.sh <<'SH'
          echo reconcile >>calls
          if [ "$CASE" = uncertain-reconciled ]; then echo 'STATE=CONFIRMED SOURCE=RECONCILIATION' >kwai-reconcile-status.txt; exit 0; fi
          exit 90
          SH
          chmod +x *.sh
          export CASE='${{ matrix.case }}'
          set +e; bash kwai_run_next_job.sh >out 2>&1; rc=$?; set -e
          case "$CASE" in
            confirmed) test "$rc" = 0; test "$(grep -c '^publish$' calls)" = 1; ! grep -q reconcile calls ;;
            uncertain-reconciled) test "$rc" = 0; test "$(grep -c '^publish$' calls)" = 1; test "$(grep -c '^reconcile$' calls)" = 1 ;;
            uncertain-remains) test "$rc" = 90; test "$(grep -c '^publish$' calls)" = 1; test "$(grep -c '^reconcile$' calls)" = 1 ;;
            publish-fails-before-boundary) test "$rc" = 82; test "$(grep -c '^publish$' calls)" = 1; ! grep -q reconcile calls ;;
            claim-fails) test "$rc" = 44; test ! -s calls ;;
          esac
          echo "DYNAMIC_${CASE}_OK"
