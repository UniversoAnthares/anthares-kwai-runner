name: CORTES Pinterest - automatic Buffer cloud publisher
# Buffer board outages are P0 failures (never green/idling with queued media).
on:
  push:
    branches: [main]
    paths:
      - social_adapters/buffer_three_channels.py
      - tools/cortes_buffer_pinterest_cloud.py
      - tools/pinterest_today_slot_gate.py
      - tests/test_pinterest_today_slot_gate.py
      - tests/test_pinterest_editorial_preflight_isolation.py
      - tests/test_pinterest_reconcile_quota.py
      - tests/test_pinterest_backpressure_evidence.py
      - tests/test_pinterest_batch_receipts.py
      - tests/test_pinterest_stale_pending_audit.py
      - tests/test_pinterest_terminal_error_reconcile.py
      - tests/test_pinterest_terminal_error_backend.mjs
      - infra/neon-cortes-queue/index.mjs
      - tools/pinterest_qa_cooldown_loop.py
      - tests/test_pinterest_qa_cooldown_loop.py
      - .github/workflows/cortes-buffer-pinterest-cloud.yml
  schedule:
    # Best effort: first 5-minute run after the Neon cooldown expires.
    # Hourly during 09:00-22:59 local weekdays; admission prevents tomorrow rollover.
    - cron: '8 13-23 * * 1-5'
    # 00-02 UTC on Tue-Sat belongs to the previous local weekday (20-22h).
    - cron: '8 0-2 * * 2-6'
  workflow_dispatch:
    inputs:
      reconcile_only:
        description: 'Only reconcile previously scheduled posts; never create a new post'
        type: boolean
        required: false
        default: false
      terminal_error_only:
        description: 'Quarantine only verified 24h-old Buffer error receipts, never create a post'
        type: boolean
        required: false
        default: false
      audit_pending_only:
        description: 'Read exact Buffer post status and dueAt for all eight uncertain reservations (no mutations)'
        type: boolean
        required: false
        default: false
  # Automatically recover when the independent Buffer probe completes.
  # Both triggers share one concurrency group and the same Neon fencing.
  workflow_run:
    workflows:
      - "CORTES Pinterest - Buffer board resolver probe"
    types: [completed]
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: cortes-pinterest-buffer-cloud-producer
  cancel-in-progress: false
jobs:
  publish-and-reconcile:
    # Safe destination is verified by the worker on each attempt.
    if: ${{ vars.CORTES_PINTEREST_BUFFER_PAUSED != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Pinterest editorial isolation and safe queue continuation
        run: |
          python -m unittest discover -s tests -p 'test_pinterest_editorial_preflight_isolation.py' -v
          python -m unittest discover -s tests -p 'test_pinterest_reconcile_quota.py' -v
          python -m unittest discover -s tests -p 'test_pinterest_backpressure_evidence.py' -v
          python -m unittest discover -s tests -p 'test_pinterest_batch_receipts.py' -v
          python -m unittest discover -s tests -p 'test_pinterest_stale_pending_audit.py' -v
          python -m unittest discover -s tests -p 'test_pinterest_terminal_error_reconcile.py' -v
          python -m unittest discover -s tests -p 'test_pinterest_qa_cooldown_loop.py' -v
          python -m unittest discover -s tests -p 'test_pinterest_today_slot_gate.py' -v
          python -m py_compile tools/cortes_buffer_pinterest_cloud.py anthares_publisher/editorial.py
      - name: Read Buffer key from Anthares Secrets without logging it
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            0ec34434-3b81-4cc6-93af-b4ea00d11733 > BUFFER_API_KEY
      - name: Publish one verified Pinterest cut and reconcile queued Pins
        id: publisher
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_RECONCILE_ONLY: ${{ inputs.reconcile_only && '1' || '0' }}
          CORTES_AUDIT_PENDING_ONLY: ${{ inputs.audit_pending_only && '1' || '0' }}
          CORTES_RECONCILE_TERMINAL_ERROR_ONLY: ${{ inputs.terminal_error_only && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORTES_QUEUE_PRIMARY: neon
          BUFFER_PINTEREST_BOARD_ID: '819514532133906920'
        run: |
          set -euo pipefail
          python -u tools/cortes_buffer_pinterest_cloud.py | tee /tmp/pinterest-run.log
      - name: Produce strict machine-readable publication evidence
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.audit_pending_only != true && inputs.terminal_error_only != true)) }}
        env:
          CORTES_WORKER_CONCLUSION: ${{ steps.publisher.outcome }}
        run: |
          python tools/pinterest_operational_evidence.py /tmp/pinterest-run.log
      - name: Archive publication evidence
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.audit_pending_only != true && inputs.terminal_error_only != true)) }}
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-evidence-${{ github.run_id }}
          path: /tmp/pinterest-evidence/
          retention-days: 7
      - name: Verify cooldown recovery and update existing Pinterest QA P0
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.audit_pending_only != true && inputs.terminal_error_only != true)) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORTES_QUEUE_PRIMARY: neon
        run: |
          python -u -m tools.pinterest_qa_cooldown_loop
