name: Git provider redundancy
on:
  workflow_dispatch:
  # Automatic runs paused until authenticated GitLab and Codeberg destinations
  # are configured and verified. Trigger manually after prerequisites are ready.
permissions:
  contents: read
concurrency:
  group: git-provider-redundancy
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [gitlab, codeberg]
    steps:
      - uses: actions/checkout@v4
      - name: Mirror independently
        env:
          ANTHARES_GITLAB_PUSH_URL: ${{ secrets.ANTHARES_GITLAB_PUSH_URL }}
          ANTHARES_CODEBERG_PUSH_URL: ${{ secrets.ANTHARES_CODEBERG_PUSH_URL }}
        run: bash tools/git-provider-sync.sh "${{ matrix.provider }}"
  verify:
    needs: mirror
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare provider SHAs
        env:
          ANTHARES_GITLAB_READ_URL: ${{ secrets.ANTHARES_GITLAB_READ_URL }}
          ANTHARES_CODEBERG_READ_URL: ${{ secrets.ANTHARES_CODEBERG_READ_URL }}
        run: python3 tools/cross-provider-sha-check.py
