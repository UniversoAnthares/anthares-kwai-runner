name: Mirror to Codeberg

on:
  push:
    branches: [main]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Latest main SHA supersedes older requests. No ref is ever force-pushed.
concurrency:
  group: codeberg-safe-main-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and mirror primary branch and tags without force
        env:
          CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CODEBERG_PUSH_URL:-}" ]; then
            echo "::error::CODEBERG_PUSH_URL_MISSING"
            exit 2
          fi
          git remote add codeberg "$CODEBERG_PUSH_URL"
          git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
          source_sha="$(git rev-parse refs/remotes/origin/main)"
          git fetch --quiet codeberg refs/heads/main:refs/remotes/codeberg/main || true
          if git rev-parse -q --verify refs/remotes/codeberg/main >/dev/null; then
            if ! git merge-base --is-ancestor refs/remotes/codeberg/main refs/remotes/origin/main; then
              echo "::error::CODEBERG_DIVERGED_NON_FAST_FORWARD_STOP"
              exit 3
            fi
          fi
          git push codeberg refs/remotes/origin/main:refs/heads/main
          git push codeberg 'refs/tags/*:refs/tags/*'
          destination_sha="$(git ls-remote codeberg refs/heads/main | awk '{print $1}')"
          if [ "$source_sha" != "$destination_sha" ]; then
            echo "::error::CODEBERG_MAIN_SHA_MISMATCH"
            exit 4
          fi
          echo "CODEBERG_MAIN_SYNC_PROVEN=$source_sha"

      - name: Repair Codeberg default branch and enable Actions
        # Missing repository-admin API scope must not invalidate a proven Git mirror.
        # Keep the independent Actions capability alarm in the readback report.
        continue-on-error: true
        shell: bash
        env:
          CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
          CODEBERG_API_TOKEN: ${{ secrets.CODEBERG_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/codeberg_admin_reconcile.py

      - name: Prove repository settings and exact commit parity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin refs/heads/main:refs/remotes/origin/main
          EXPECTED_GITHUB_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)" python3 tools/codeberg_mirror_health.py
