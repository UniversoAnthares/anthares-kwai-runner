name: Mirror to Codeberg

on:
  push:
    branches: [main]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Latest main SHA supersedes older requests. No ref is ever force-pushed.
concurrency:
  group: codeberg-safe-main-mirror
  # Keep the running SHA sync alive; replace only the pending run on new commits.
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and mirror main without force
        shell: pwsh
        env:
          CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
        run: |
          $ErrorActionPreference='Stop'
          $env:GIT_TERMINAL_PROMPT='0'
          if (-not $env:CODEBERG_PUSH_URL) { throw 'CODEBERG_PUSH_URL_MISSING' }
          $existing=@(git remote)
          if ($existing -contains 'codeberg') {
            git remote set-url codeberg $env:CODEBERG_PUSH_URL
          } else {
            git remote add codeberg $env:CODEBERG_PUSH_URL
          }
          if ($LASTEXITCODE -ne 0) { throw 'CODEBERG_REMOTE_CONFIG_FAILED' }
          # The repository receives frequent commits and another authorized mirror
          # may advance Codeberg between fetch and push. Reconcile that race
          # with bounded, fast-forward-only retries; never force a ref.
          $synced=$false
          for($attempt=1; $attempt -le 5; $attempt++){
            git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main'
            if($LASTEXITCODE -ne 0){ throw 'GITHUB_MAIN_FETCH_FAILED' }
            git fetch --quiet codeberg '+refs/heads/main:refs/remotes/codeberg/main'
            if($LASTEXITCODE -ne 0){ throw 'CODEBERG_MAIN_FETCH_FAILED' }
            $expected=(git rev-parse refs/remotes/origin/main).Trim()
            $before=(git rev-parse refs/remotes/codeberg/main).Trim()
            if($expected -notmatch '^[a-f0-9]{40}$' -or $before -notmatch '^[a-f0-9]{40}$'){ throw 'MIRROR_SHA_INVALID' }
            if($expected -ne $before){
              git merge-base --is-ancestor $before $expected
              if($LASTEXITCODE -ne 0){ throw 'CODEBERG_DIVERGED_NON_FAST_FORWARD_STOP' }
              git -c credential.interactive=never push --quiet codeberg refs/remotes/origin/main:refs/heads/main
              if($LASTEXITCODE -ne 0){
                Write-Output "CODEBERG_MAIN_CONCURRENT_UPDATE_RETRY=$attempt"
                if($attempt -lt 5){ Start-Sleep -Seconds 2; continue }
                throw 'CODEBERG_PUSH_RETRIES_EXHAUSTED'
              }
            }
            $ghLine=(git ls-remote https://github.com/UniversoAnthares/anthares-kwai-runner.git refs/heads/main)
            if($LASTEXITCODE -ne 0){ throw 'GITHUB_PUBLIC_READBACK_FAILED' }
            $cbLine=(git ls-remote https://codeberg.org/UniversoAnthares/anthares-kwai-runner.git refs/heads/main)
            if($LASTEXITCODE -ne 0){ throw 'CODEBERG_PUBLIC_READBACK_FAILED' }
            $latestGh=([string]$ghLine -split '\s+')[0]
            $latestCb=([string]$cbLine -split '\s+')[0]
            if($latestGh -eq $latestCb -and $latestGh -match '^[a-f0-9]{40}$'){
              $synced=$true
              $expected=$latestGh
              Write-Output "CODEBERG_MAIN_SYNC_PROVEN=$expected"
              break
            }
            Write-Output "CODEBERG_MAIN_ADVANCED_DURING_SYNC_RETRY=$attempt"
            if($attempt -lt 5){ Start-Sleep -Seconds 2 }
          }
          if(!$synced){ throw 'CODEBERG_PARITY_RETRIES_EXHAUSTED' }

      - name: Repair Codeberg default branch and enable Actions
        # Missing repository-admin API scope must not invalidate a proven Git mirror.
        # Keep the independent Actions capability alarm in the readback report.
        continue-on-error: true
        shell: pwsh
        env:
          CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
          CODEBERG_API_TOKEN: ${{ secrets.CODEBERG_API_TOKEN }}
        run: |
          python3 -u tools/codeberg_admin_reconcile.py

      - name: Prove repository settings and exact commit parity
        shell: pwsh
        run: |
          $env:EXPECTED_GITHUB_MAIN_SHA = (git rev-parse refs/remotes/origin/main)
          python3 -u tools/codeberg_mirror_health.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
