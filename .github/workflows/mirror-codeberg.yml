name: Mirror GitHub main to Codeberg (verified fast-forward)
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read

# Coalesce push storms: only the newest queued main-branch snapshot should
# consume a hosted runner. Older pending mirrors must not starve publication.
concurrency:
  group: codeberg-main-verified-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify target and enforce no-force, fast-forward-only update
        shell: bash
        env:
          CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if [ -z "${CODEBERG_PUSH_URL:-}" ]; then
            echo "::error::CODEBERG_MIRROR_AUTH_REQUIRED"
            exit 78
          fi
          public="https://codeberg.org/UniversoAnthares/anthares-kwai-runner.git"
          git fetch --no-tags origin 'refs/heads/main:refs/remotes/origin/main'
          latest="$(git rev-parse refs/remotes/origin/main)"
          current="$(git ls-remote "$public" 'refs/heads/main' | cut -f1)"
          if [ -z "$current" ]; then
            echo "::error::CODEBERG_MAIN_NOT_FOUND"
            exit 2
          fi
          git fetch --no-tags "$public" 'refs/heads/main:refs/remotes/codeberg-audit/main'
          if ! git merge-base --is-ancestor "$current" "$latest"; then
            echo "::error::CODEBERG_DIVERGED_NO_PUSH"
            exit 3
          fi
          git -c core.askPass= push --quiet "$CODEBERG_PUSH_URL" "$latest:refs/heads/main"
          mirrored="$(git ls-remote "$public" 'refs/heads/main' | cut -f1)"
          if [ "$latest" != "$mirrored" ]; then
            echo "::error::CODEBERG_POST_PUSH_SHA_MISMATCH"
            exit 4
          fi
          echo "CODEBERG_MAIN_FAST_FORWARD_VERIFIED=PASS"
          echo "CODEBERG_MAIN_SHA=$mirrored"
