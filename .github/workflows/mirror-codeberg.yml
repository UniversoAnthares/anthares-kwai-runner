name: Mirror to Codeberg

on:
  push:
    branches: [main]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Latest main SHA supersedes older requests. No ref is ever force-pushed.
concurrency:
  group: codeberg-safe-main-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and mirror main without force
        shell: powershell
        env:
          CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
        run: |
          $ErrorActionPreference='Stop'
          $env:GIT_TERMINAL_PROMPT='0'
          if (-not $env:CODEBERG_PUSH_URL) { throw 'CODEBERG_PUSH_URL_MISSING' }
          # A self-hosted Windows runner may reuse a checkout with this remote.
          # Never fail or reuse stale credentials because a remote already exists.
          git remote get-url codeberg 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            git remote set-url codeberg $env:CODEBERG_PUSH_URL
            if ($LASTEXITCODE -ne 0) { throw 'CODEBERG_REMOTE_UPDATE_FAILED' }
          } else {
            git remote add codeberg $env:CODEBERG_PUSH_URL
            if ($LASTEXITCODE -ne 0) { throw 'CODEBERG_REMOTE_ADD_FAILED' }
          }
          git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'GITHUB_MAIN_FETCH_FAILED' }
          $expected=(git rev-parse refs/remotes/origin/main).Trim()
          if ($expected -notmatch '^[a-f0-9]{40}$') { throw 'GITHUB_SHA_INVALID' }
          git fetch --quiet codeberg '+refs/heads/main:refs/remotes/codeberg/main'
          if ($LASTEXITCODE -ne 0) { throw 'CODEBERG_MAIN_FETCH_FAILED' }
          git merge-base --is-ancestor refs/remotes/codeberg/main refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'CODEBERG_DIVERGED_NON_FAST_FORWARD_STOP' }
          git -c credential.interactive=never push --quiet codeberg refs/remotes/origin/main:refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'CODEBERG_PUSH_FAILED' }
          $actualLine=(git ls-remote https://codeberg.org/UniversoAnthares/anthares-kwai-runner.git refs/heads/main)
          if ($LASTEXITCODE -ne 0) { throw 'CODEBERG_PUBLIC_READBACK_FAILED' }
          $actual=([string]$actualLine -split '\s+')[0]
          if ($actual -ne $expected) { throw 'CODEBERG_MAIN_SHA_MISMATCH' }
          Write-Output "CODEBERG_MAIN_SYNC_PROVEN=$expected"

      - name: Repair Codeberg default branch and enable Actions
        # Missing repository-admin API scope must not invalidate a proven Git mirror.
        # Keep the independent Actions capability alarm in the readback report.
        continue-on-error: true
        shell: powershell
        env:
          CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
          CODEBERG_API_TOKEN: ${{ secrets.CODEBERG_API_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          & 'C:\Users\Lucas\AppData\Local\Programs\Python\Python311\python.exe' -u tools/codeberg_admin_reconcile.py
          if ($LASTEXITCODE -ne 0) { throw 'CODEBERG_ADMIN_REPAIR_PENDING' }

      - name: Prove repository settings and exact commit parity
        shell: powershell
        run: |
          $env:EXPECTED_GITHUB_MAIN_SHA = (git rev-parse refs/remotes/origin/main)
          & 'C:\Users\Lucas\AppData\Local\Programs\Python\Python311\python.exe' -u tools/codeberg_mirror_health.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
