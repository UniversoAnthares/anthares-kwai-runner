name: Legacy PC Canonical Log Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legacy-pc-canonical-log-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append canonical executor proof once
