name: Legacy PC Canonical Log Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legacy-pc-canonical-log-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append canonical executor proof once
        shell: bash
        run: |
          set -euo pipefail
          path='test-hub/legacy-pc-uploader-rebuild/SHARED-LOG.md'
          marker='Anthares Local Executor v2 PROVEN end-to-end'
          if grep -Fq "$marker" "$path"; then
            echo 'CANONICAL_ENTRY_ALREADY_PRESENT=1'
            exit 0
          fi
          ENTRY_B64=''
          printf '%s' "$ENTRY_B64" | base64 -d >> "$path"
          git config user.name 'Anthares Coordination'
          git config user.email 'coordination@anthares.local'
          git add "$path"
          git commit -m 'Record proven persistent Anthares Local Executor transport'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'CANONICAL_LOG_APPENDED=True'
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo 'CANONICAL_LOG_APPEND_FAILED=1' >&2
          exit 1
