        run: |
          set -euo pipefail
          path='test-hub/legacy-pc-uploader-rebuild/SHARED-LOG.md'
          marker='Anthares Local Executor v2 PROVEN end-to-end'
          if grep -Fq "$marker" "$path"; then
            echo 'CANONICAL_ENTRY_ALREADY_PRESENT=1'
            exit 0
          fi
          cat >> "$path" <<'EOF'

