name: CORTES method 1+2 authenticated semantic media once

on:
  workflow_dispatch:
    inputs:
      min_source_start:
        description: Earliest source second eligible for semantic selection (intro guard)
        required: false
        default: '240'

permissions:
  contents: read

jobs:
  method12:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_ID: 9CIk-I_3VhM
      SOURCE_URL: https://www.youtube.com/watch?v=9CIk-I_3VhM
      MIN_SOURCE_START: ${{ github.event.inputs.min_source_start || '240' }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Require authenticated YouTube session secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${YOUTUBE_COOKIES:-}" && -z "${YOUTUBE_COOKIES_B64:-}" ]]; then
            echo 'METHOD12_AUTH_SECRET=ABSENT'
            exit 20
          fi
          echo 'METHOD12_AUTH_SECRET=PRESENT'

      - name: Install media and transcript stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --disable-pip-version-check -q -U 'yt-dlp[default]' yt-dlp-ejs bgutil-ytdlp-pot-provider faster-whisper
          node --version
          yt-dlp --version
          mkdir -p /tmp/method12

      - name: Materialize private cookie file without logging it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          raw=os.environ.get('YOUTUBE_COOKIES','')
          b64=os.environ.get('YOUTUBE_COOKIES_B64','').strip()
          if b64:
              raw=base64.b64decode(b64).decode('utf-8')
          if not raw.strip(): raise SystemExit('empty cookie secret')
          p=pathlib.Path('/tmp/method12/youtube-cookies.txt')
          p.write_text(raw,encoding='utf-8'); p.chmod(0o600)
          print('METHOD12_COOKIE_FILE=READY')
          PY

      - name: Prove authenticated metadata
        shell: bash
        run: |
          set -euo pipefail
          yt-dlp --cookies /tmp/method12/youtube-cookies.txt --no-playlist --skip-download \
            --js-runtimes node --remote-components ejs:npm \
            --print '%(id)s|%(duration)s|%(title)s' "$SOURCE_URL" > /tmp/method12/metadata.txt
          python3 - <<'PY'
          s=open('/tmp/method12/metadata.txt',encoding='utf-8').read().strip()
          assert s.startswith('9CIk-I_3VhM|'), s[:80]
          print('METHOD12_AUTH_METADATA=PROVEN')
          print('METHOD12_METADATA='+s)
          PY

      - name: Fetch transcript only and select a meaningful self-contained excerpt
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/method12/source*.json3
          yt-dlp --cookies /tmp/method12/youtube-cookies.txt --no-playlist --skip-download \
            --js-runtimes node --remote-components ejs:npm \
            --write-subs --write-auto-subs --sub-langs 'pt.*,pt' --sub-format json3 \
            -o '/tmp/method12/source.%(ext)s' "$SOURCE_URL"
          transcript="$(find /tmp/method12 -maxdepth 1 -type f -name 'source*.json3' | head -n1)"
          test -n "$transcript" && test -s "$transcript"
          python3 tools/cortes_semantic_microcut.py select \
            --transcript "$transcript" --output /tmp/method12/semantic-plan.json \
            --min-start "$MIN_SOURCE_START" --target 90 --min-len 70 --max-len 110
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          p=json.load(open('/tmp/method12/semantic-plan.json',encoding='utf-8'))
          print('SOURCE_START='+str(p['source_start']))
          print('SOURCE_END='+str(p['source_end']))
          PY

      - name: Method 1 - acquire only the transcript-selected bounded segment
        shell: bash
        run: |
          set -euo pipefail
          yt-dlp \
            --cookies /tmp/method12/youtube-cookies.txt \
            --no-playlist \
            --js-runtimes node \
            --remote-components ejs:npm \
            --download-sections "*${SOURCE_START}-${SOURCE_END}" \
            --force-keyframes-at-cuts \
            -f 'bv*[height<=720]+ba/b[height<=720]/b' \
            --merge-output-format mp4 \
            -o '/tmp/method12/partial.%(ext)s' \
            "$SOURCE_URL" 2>&1 | tee /tmp/method12/yt-dlp.log
          test -s /tmp/method12/partial.mp4
          dur="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/method12/partial.mp4)"
          DUR="$dur" python3 - <<'PY'
          import os
          d=float(os.environ['DUR']); assert 60 <= d <= 118, d
          print('METHOD1_PARTIAL_DURATION='+str(round(d,3)))
          print('METHOD1_PARTIAL_EXTRACTION=PROVEN')
          PY

      - name: Method 2A - mandatory transcript-driven microcuts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/cortes_semantic_microcut.py microcut \
            --input /tmp/method12/partial.mp4 \
            --output /tmp/method12/microcut.mp4 \
            --report /tmp/method12/microcut.json \
            --model small
          test -s /tmp/method12/microcut.mp4

      - name: Method 2B - vertical social master
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i /tmp/method12/microcut.mp4 \
            -vf 'scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920' \
            -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart \
            /tmp/method12/final.mp4
          test -s /tmp/method12/final.mp4
          dur="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/method12/final.mp4)"
          sha="$(sha256sum /tmp/method12/final.mp4 | awk '{print $1}')"
          bytes="$(stat -c%s /tmp/method12/final.mp4)"
          DUR="$dur" BYTES="$bytes" SHA="$sha" python3 - <<'PY'
          import json,os
          plan=json.load(open('/tmp/method12/semantic-plan.json',encoding='utf-8'))
          micro=json.load(open('/tmp/method12/microcut.json',encoding='utf-8'))
          assert micro['intervals'] >= 1 and micro['removed_seconds'] >= 0.20, micro
          d={
            'source_id':'9CIk-I_3VhM','source_start':plan['source_start'],'source_end':plan['source_end'],
            'semantic_score':plan['semantic_score'],'semantic_metrics':plan['metrics'],
            'selected_transcript':plan['selected_transcript'],
            'method1':'authenticated_transcript_semantic_bounded_transfer',
            'method2':'whisper_microcuts_then_remote_ffmpeg_vertical_normalize',
            'microcut':micro,'full_source_download_requested':False,'method3_fallback':'NOT_USED',
            'final_duration_seconds':float(os.environ['DUR']),'final_bytes':int(os.environ['BYTES']),
            'final_sha256':os.environ['SHA'],'social_publish':False
          }
          json.dump(d,open('/tmp/method12/result.json','w'),ensure_ascii=False,indent=2)
          print('METHOD2_FINAL_DURATION='+str(round(d['final_duration_seconds'],3)))
          print('METHOD2_FINAL_SHA256='+d['final_sha256'])
          print('METHOD12_SEMANTIC_SELECTION=PROVEN')
          print('METHOD12_MICROCUTS=PROVEN')
          print('METHOD2_REMOTE_EDIT=PROVEN')
          PY

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortes-method12-semantic-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/method12/result.json
            /tmp/method12/semantic-plan.json
            /tmp/method12/microcut.json
            /tmp/method12/final.mp4
            /tmp/method12/yt-dlp.log

      - name: Remove authentication material
        if: always()
        shell: bash
        run: rm -f /tmp/method12/youtube-cookies.txt
