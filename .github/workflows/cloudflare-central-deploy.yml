name: Cloudflare Central Deploy Public Runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.cloudflare-central-deploy-trigger'
      - 'cloudflare-worker/**'
      - 'tests/test_kwai_session_vault.mjs'
      - '.github/workflows/cloudflare-central-deploy.yml'
concurrency:
  group: anthares-cloudflare-controller-deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical publisher target migration
        shell: bash
        run: |
          set -euo pipefail
          python3 cloudflare-worker/patches/apply-publisher-target-v17.py
          grep -q '2026-10-15-publisher-target-v17' cloudflare-worker/src/index.js
          grep -q 'idx_jobs_target_dedupe' cloudflare-worker/src/index.js
          ! grep -q 'CREATE INDEX IF NOT EXISTS idx_jobs_target_status_created' cloudflare-worker/src/index.js
          grep -q 'account_id' cloudflare-worker/src/index.js
      - name: Apply proven physical Android Kwai executor migration
        shell: bash
        run: |
          set -euo pipefail
          python3 cloudflare-worker/patches/apply-physical-android-v18.py
          grep -q '2026-10-17-physical-android-v18' cloudflare-worker/src/index.js
          grep -q '2026-10-17-physical-android-r1' cloudflare-worker/src/index.js
          grep -q 'kwai:\["physical_android","github"\]' cloudflare-worker/src/index.js
          grep -q 'X-Anthares-Executor-Signature' cloudflare-worker/src/index.js
          grep -q 'X-Anthares-Executor-Timestamp' cloudflare-worker/src/index.js
          grep -q 'kwai_physical_primary' cloudflare-worker/src/index.js
          grep -q 'kwai_github_failover' cloudflare-worker/src/index.js
      - name: Authorize dedicated TikTok verifier and reconciliation workflows deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/src/index.js')
          s=p.read_text(encoding='utf-8-sig')
          anchor='"tiktok-central-session-read.yml"'
          required=[
              'tiktok-anthares-browser-session-verify.yml',
              'tiktok-reconcile-uncertain.yml',
          ]
          for name in required:
              marker='"'+name+'"'
              if marker in s:
                  continue
              if anchor not in s:
                  raise SystemExit('OIDC allowlist anchor missing for '+name)
              s=s.replace(anchor, anchor+','+marker, 1)
          p.write_text(s, encoding='utf-8')
          print('TIKTOK_OIDC_ALLOWLIST_OK=1')
          PY
      - name: Validate deploy snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s cloudflare-worker/src/index.js
          test -s cloudflare-worker/wrangler.toml
          grep -q 'tiktok-central-session-read.yml' cloudflare-worker/src/index.js
          grep -q 'tiktok-anthares-browser-session-verify.yml' cloudflare-worker/src/index.js
          grep -q 'tiktok-reconcile-uncertain.yml' cloudflare-worker/src/index.js
          grep -q '2026-10-17-physical-android-v18' cloudflare-worker/src/index.js
          grep -q '2026-10-17-physical-android-r1' cloudflare-worker/src/index.js
          ! grep -q 'onrender.com' cloudflare-worker/src/index.js
          node --experimental-default-type=module --check cloudflare-worker/src/index.js
          echo 'SNAPSHOT_VALID=physical-android-v18-render-retired'
      - name: Validate private Kwai session vault before deploy
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check cloudflare-worker/src/index.js
          node --experimental-default-type=module --test tests/test_kwai_session_vault.mjs
      - name: Deploy exact controller to Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cd cloudflare-worker
          npx --yes wrangler@4.43.0 deploy
          echo 'WRANGLER_DEPLOY_OK=1'
      - name: Verify public health and physical Android routing
        shell: bash
        run: |
          set -euo pipefail
          out="$(curl -fsS https://anthares-control.anthares1.workers.dev/health)"
          strategy="$(curl -fsS https://anthares-control.anthares1.workers.dev/strategy)"
          failover="$(curl -fsS https://anthares-control.anthares1.workers.dev/failover-self-test)"
          echo "$out"; echo "$strategy"; echo "$failover"
          echo "$out" | grep -q '"service":"anthares-control"'
          echo "$out" | grep -q '"version":"2026-10-17-physical-android-v18"'
          echo "$out" | grep -q '"pc_fallback":false'
          echo "$out" | grep -q '"routing_revision":"2026-10-17-physical-android-r1"'
          ! echo "$strategy" | grep -q '"render"'
          echo "$strategy" | grep -q '"kwai":\["physical_android","github"\]'
          echo "$failover" | grep -q '"primary":"github"'
          echo "$failover" | grep -q '"kwai_physical_primary":true'
          echo "$failover" | grep -q '"kwai_github_failover":true'
          echo "$failover" | grep -q '"render_retired":true'
          echo 'CONTROL_HEALTH_OK=1'
      - name: Verify protected TikTok session endpoint remains closed to unauthenticated callers
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/tiktok-session-unauth.json -w '%{http_code}' --max-time 20 https://anthares-control.anthares1.workers.dev/tiktok/session-state)"
          test "$code" = "401"
          echo 'TIKTOK_SESSION_UNAUTH_BOUNDARY_OK=1'
