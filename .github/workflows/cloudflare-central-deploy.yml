name: Cloudflare Central Deploy Public Runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.cloudflare-central-deploy-trigger'
      - 'cloudflare-worker/**'
      - 'tests/test_kwai_session_vault.mjs'
      - '.github/workflows/cloudflare-central-deploy.yml'
concurrency:
  group: anthares-cloudflare-controller-deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authorize dedicated TikTok session verifier deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/src/index.js')
          s=p.read_text(encoding='utf-8-sig')
          target='"tiktok-central-session-read.yml"'
          addition='"tiktok-central-session-read.yml","tiktok-anthares-browser-session-verify.yml"'
          if '"tiktok-anthares-browser-session-verify.yml"' not in s:
              if target not in s:
                  raise SystemExit('OIDC allowlist anchor missing')
              s=s.replace(target, addition, 1)
              p.write_text(s, encoding='utf-8')
          print('TIKTOK_SESSION_VERIFIER_OIDC_ALLOWLIST_OK=1')
          PY
      - name: Validate deploy snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s cloudflare-worker/src/index.js
          test -s cloudflare-worker/wrangler.toml
          grep -q 'tiktok-central-session-read.yml' cloudflare-worker/src/index.js
          grep -q 'tiktok-anthares-browser-session-verify.yml' cloudflare-worker/src/index.js
          grep -q '2026-10-05-queue-fencing-v16' cloudflare-worker/src/index.js
          grep -q '2026-10-14-render-retired-r2' cloudflare-worker/src/index.js
          ! grep -q 'onrender.com' cloudflare-worker/src/index.js
          echo 'SNAPSHOT_VALID=queue-fencing-v16-render-retired-r2-session-verifier-authorized'
      - name: Validate private Kwai session vault before deploy
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check cloudflare-worker/src/index.js
          node --experimental-default-type=module --test tests/test_kwai_session_vault.mjs
      - name: Deploy exact controller to Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cd cloudflare-worker
          npx --yes wrangler@4.43.0 deploy
          echo 'WRANGLER_DEPLOY_OK=1'
      - name: Verify public health and retired Render routing
        shell: bash
        run: |
          set -euo pipefail
          out="$(curl -fsS https://anthares-control.anthares1.workers.dev/health)"
          strategy="$(curl -fsS https://anthares-control.anthares1.workers.dev/strategy)"
          failover="$(curl -fsS https://anthares-control.anthares1.workers.dev/failover-self-test)"
          echo "$out"; echo "$strategy"; echo "$failover"
          echo "$out" | grep -q '"service":"anthares-control"'
          echo "$out" | grep -q '"version":"2026-10-05-queue-fencing-v16"'
          echo "$out" | grep -q '"pc_fallback":false'
          echo "$out" | grep -q '"routing_revision":"2026-10-14-render-retired-r2"'
          ! echo "$strategy" | grep -q '"render"'
          echo "$failover" | grep -q '"primary":"github"'
          echo "$failover" | grep -q '"render_retired":true'
          echo 'CONTROL_HEALTH_OK=1'
      - name: Verify protected TikTok session endpoint remains closed to unauthenticated callers
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/tiktok-session-unauth.json -w '%{http_code}' --max-time 20 https://anthares-control.anthares1.workers.dev/tiktok/session-state)"
          test "$code" = "401"
          echo 'TIKTOK_SESSION_UNAUTH_BOUNDARY_OK=1'
