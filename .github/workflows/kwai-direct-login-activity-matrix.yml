name: Kwai Direct Login Activity Matrix
on:
  push:
    paths: ['.direct-login-activity-trigger']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        target:
          - com.yxcorp.gifshow.tiny.login.activity.TinyLoginActivity
          - com.yxcorp.gifshow.tiny.login.activity.TinyUserInfoActivity
          - com.yxcorp.gifshow.tiny.login.activity.TinyGoogleSSOActivity
          - com.yxcorp.login.userlogin.activity.AutoLoginActivity
          - com.yxcorp.gifshow.authorization.KwaiAuthActivity
          - com.yxcorp.gifshow.auth.LivePartnerAuthActivity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TARGET_ACTIVITY: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL --retry 3 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip" | sha256sum -c -
          rm -rf kwai-vault && mkdir kwai-vault && unzip -q kwai-vault.zip -d kwai-vault
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 240
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: bash kwai_direct_login_activity_probe.sh
