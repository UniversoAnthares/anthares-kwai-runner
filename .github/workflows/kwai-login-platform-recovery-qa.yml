name: Kwai native login platform expansion QA
on:
  push:
    paths:
      - "tools/kwai_login_surface_recovery.py"
      - "tests/test_kwai_login_platform_expansion.py"
      - ".github/workflows/kwai-login-platform-recovery-qa.yml"
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p test_kwai_login_platform_expansion.py -v
      - run: python3 -m py_compile tools/kwai_login_surface_recovery.py kwai_auth_probe.py
