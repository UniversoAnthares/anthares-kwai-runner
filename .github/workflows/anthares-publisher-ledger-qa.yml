name: Anthares Publisher Ledger QA
on:
  pull_request:
    paths:
      - 'anthares_publisher/**'
      - 'tests/test_anthares_publisher_*.py'
      - '.github/workflows/anthares-publisher-ledger-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate publisher dedupe, durable state and identity contract
        run: python3 -m unittest discover -s tests -p 'test_anthares_publisher_*.py' -v
      - name: Verify Python compilation
        run: python3 -m compileall -q anthares_publisher tests/test_anthares_publisher_ledger.py tests/test_anthares_publisher_contract.py
