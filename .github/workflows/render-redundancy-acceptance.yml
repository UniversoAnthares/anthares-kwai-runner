name: Anthares Render Retirement Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/src/index.js'
      - '.github/workflows/render-redundancy-acceptance.yml'

concurrency:
  group: anthares-render-retirement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove source routing excludes Render
        shell: bash
        run: |
          set -euo pipefail
          F=cloudflare-worker/src/index.js
          test -s "$F"
          ! grep -q 'onrender.com' "$F"
          python - <<'PY'
          import re
          p=open('cloudflare-worker/src/index.js',encoding='utf-8-sig').read()
          m=re.search(r'function priorities\(\)\{return (\{.*?\});\}',p)
          assert m
          assert '"render"' not in m.group(1)
          assert 'cuts:["github"]' in m.group(1)
          assert 'tiktok:["github"]' in m.group(1)
          assert 'control:["cloudflare","github"]' in m.group(1)
          print('RENDER_SOURCE_ROUTING_RETIRED=1')
          PY
      - name: Prove deployed control plane excludes Render
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --retry 3 --max-time 15 https://anthares-control.anthares1.workers.dev/health)"
          strategy="$(curl -fsS --retry 3 --max-time 15 https://anthares-control.anthares1.workers.dev/strategy)"
          failover="$(curl -fsS --retry 3 --max-time 15 https://anthares-control.anthares1.workers.dev/failover-self-test)"
          printf '%s\n%s\n%s\n' "$health" "$strategy" "$failover"
          echo "$health" | grep -q '"routing_revision":"2026-10-14-render-retired-r2"'
          echo "$strategy" | grep -q '"execution_priority"'
          ! echo "$strategy" | grep -q '"render"'
          echo "$failover" | grep -q '"ok":true'
          echo "$failover" | grep -q '"primary":"github"'
          echo "$failover" | grep -q '"render_retired":true'
          echo 'RENDER_RUNTIME_ROUTING_RETIRED=1'
