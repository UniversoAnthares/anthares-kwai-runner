name: Anthares Render Redundancy Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main, anthares-render-redundancy]
    paths:
      - 'tools/render_redundancy_acceptance.py'
      - 'tools/provider_router.py'
      - '.github/workflows/render-redundancy-acceptance.yml'
      - 'tools/RENDER_REDUNDANCY.md'
  pull_request:
    branches: [main]
    paths:
      - 'tools/render_redundancy_acceptance.py'
      - 'tools/provider_router.py'
      - '.github/workflows/render-redundancy-acceptance.yml'
      - 'tools/RENDER_REDUNDANCY.md'

concurrency:
  group: anthares-render-redundancy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Existing provider-router tests
        run: python3 tools/test_provider_router.py
      - name: Render failover acceptance
        run: python3 tools/render_redundancy_acceptance.py

  control-plane-live:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Cloudflare control plane health
        run: |
          set -euo pipefail
          out="$(curl -fsS --retry 3 --max-time 15 https://anthares-control.anthares1.workers.dev/health)"
          echo "$out"
          echo "$out" | grep -q '"ok":true'
          echo "$out" | grep -q '"service":"anthares-control"'
          echo "$out" | grep -q '"provider":"cloudflare"'
          echo "$out" | grep -q '"persistent_state":true'
          echo "$out" | grep -q '"queue_bound":true'
          echo "$out" | grep -q '"pc_fallback":false'
      - name: Cloudflare failover self-test
        run: |
          set -euo pipefail
          out="$(curl -fsS --retry 3 --max-time 15 https://anthares-control.anthares1.workers.dev/failover-self-test)"
          echo "$out"
          echo "$out" | grep -q '"ok":true'
          echo "$out" | grep -q '"primary":"render"'
          echo "$out" | grep -q '"after_render_failure":"github"'
          echo "$out" | grep -q '"local_retired":true'

  render-independence:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Probe Render as an execution provider
        run: |
          set +e
          code=$(curl -sS -o /tmp/render-health.json -w '%{http_code}' --max-time 15 https://anthares-remote-control.onrender.com/health)
          echo "RENDER_HTTP=$code"
          cat /tmp/render-health.json 2>/dev/null || true
          exit 0
      - name: Prove control authority remains outside Render
        run: |
          set -euo pipefail
          out="$(curl -fsS --retry 3 --max-time 15 https://anthares-control.anthares1.workers.dev/health)"
          echo "$out" | grep -q '"provider":"cloudflare"'
          echo "$out" | grep -q '"persistent_state":true'
          echo "$out" | grep -q '"queue_bound":true'
          echo 'RENDER_INDEPENDENCE_OK=1'
