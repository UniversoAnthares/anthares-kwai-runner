name: ARA PR102 hygiene cleanup

on:
  push:
    branches:
      - feature/anthares-remote-agent
    paths:
      - '.github/workflows/ara-pr102-hygiene.yml'

permissions:
  contents: write

jobs:
  clean-vendored-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove vendored Node dependencies from the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! grep -qxF 'anthares-remote-mcp/node_modules/' .gitignore; then
            printf '\nanthares-remote-mcp/node_modules/\n' >> .gitignore
          fi
          git rm -r --cached --ignore-unmatch anthares-remote-mcp/node_modules
          git add .gitignore
          if git diff --cached --quiet; then
            echo 'PR102_HYGIENE=ALREADY_CLEAN'
            exit 0
          fi
          git commit -m 'chore(mcp): remove vendored node_modules from PR102'
          git push origin HEAD:feature/anthares-remote-agent
          echo 'PR102_HYGIENE=PASS'
