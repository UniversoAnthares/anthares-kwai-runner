name: Cloudflare Legacy Remote Control Standby Deploy
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact reviewed Git SHA (40 lowercase hex characters)'
        required: true
        type: string
      mode:
        description: 'Approved release or incident recovery'
        required: true
        default: release
        type: choice
        options:
          - release
          - emergency
      incident_ref:
        description: 'Mandatory incident reference for emergency recovery'
        required: false
        type: string
concurrency:
  group: anthares-cloudflare-legacy-remote-control-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require approved SHA and incident-scoped emergency recovery
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'RELEASE_SHA_INVALID'; exit 1; }
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA" || { echo 'RELEASE_SHA_MISMATCH'; exit 1; }
          main_sha="$(curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$RELEASE_MODE" == release ]]; then
            test "$APPROVED_SHA" = "$main_sha" || { echo 'RELEASE_MAIN_MOVED'; exit 1; }
          elif [[ "$RELEASE_MODE" == emergency ]]; then
            test -n "$INCIDENT_REF" || { echo 'EMERGENCY_INCIDENT_REQUIRED'; exit 1; }
            git merge-base --is-ancestor "$APPROVED_SHA" "$main_sha" || { echo 'EMERGENCY_SHA_OUTSIDE_MAIN'; exit 1; }
          else
            echo 'RELEASE_MODE_INVALID'; exit 1
          fi
          echo "RELEASE_APPROVED_SHA=$APPROVED_SHA mode=$RELEASE_MODE"
      - name: Validate standby write-quota policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ANTHARES_REMOTE_CONTROL_MODE = "standby"' anthares-remote-agent/worker/wrangler.toml
          grep -q "mode !== 'active'" anthares-remote-agent/worker/src/index.ts
          grep -q "persisted: false" anthares-remote-agent/worker/src/index.ts
          grep -q "storage.list<Job>({ prefix: 'job:' })" anthares-remote-agent/worker/src/index.ts
          cd anthares-remote-agent/worker
          npx --yes wrangler@4.43.0 deploy --dry-run
      - name: Deploy standby worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cd anthares-remote-agent/worker
          npx --yes wrangler@4.43.0 deploy
      - name: Verify stateless standby health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            out="$(curl -fsS --max-time 15 https://anthares-remote-control.anthares1.workers.dev/health 2>/dev/null || true)"
            if echo "$out" | grep -q '"version":"0.2.0-write-quota"' && echo "$out" | grep -q '"mode":"standby"'; then
              echo "$out"
              echo 'REMOTE_CONTROL_STANDBY_OK=1'
              exit 0
            fi
            sleep 2
          done
          echo 'standby health verification failed' >&2
          exit 1
