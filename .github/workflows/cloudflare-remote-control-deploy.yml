name: Cloudflare Legacy Remote Control Standby Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'anthares-remote-agent/worker/**'
      - '.github/workflows/cloudflare-remote-control-deploy.yml'
concurrency:
  group: anthares-cloudflare-legacy-remote-control-deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate standby write-quota policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ANTHARES_REMOTE_CONTROL_MODE = "standby"' anthares-remote-agent/worker/wrangler.toml
          grep -q "mode !== 'active'" anthares-remote-agent/worker/src/index.ts
          grep -q "persisted: false" anthares-remote-agent/worker/src/index.ts
          grep -q "storage.list<Job>({ prefix: 'job:' })" anthares-remote-agent/worker/src/index.ts
          cd anthares-remote-agent/worker
          npx --yes wrangler@4.43.0 deploy --dry-run
      - name: Deploy standby worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cd anthares-remote-agent/worker
          npx --yes wrangler@4.43.0 deploy
      - name: Verify stateless standby health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            out="$(curl -fsS --max-time 15 https://anthares-remote-control.anthares1.workers.dev/health 2>/dev/null || true)"
            if echo "$out" | grep -q '"version":"0.2.0-write-quota"' && echo "$out" | grep -q '"mode":"standby"'; then
              echo "$out"
              echo 'REMOTE_CONTROL_STANDBY_OK=1'
              exit 0
            fi
            sleep 2
          done
          echo 'standby health verification failed' >&2
          exit 1
