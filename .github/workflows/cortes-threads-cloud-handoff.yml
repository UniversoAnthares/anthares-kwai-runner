name: CORTES Threads Cloud Handoff (fenced)
on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish exactly one Neon-reserved clip after local device acknowledged pause'
        required: true
        type: boolean
        default: false
      batch:
        description: 'Authorized 22 Oct overnight cloud queue pump; ends before 05:00 MS'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'tools/cortes_threads_cloud_handoff.mjs'
      - 'tools/cortes_threads_cloud_feed.mjs'
      - 'tools/cortes_threads_cloud_captions.mjs'
      - 'infra/neon-cortes-threads-execution/**'
      - '.github/workflows/cortes-threads-cloud-handoff.yml'
permissions:
  contents: read
  id-token: write
  issues: write
  actions: write
concurrency:
  group: cortes-threads-cloud-single-writer
  cancel-in-progress: false
jobs:
  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      THREADS_ALLOW_PUBLISH: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && '1' || '0' }}
      GITHUB_TOKEN: ${{ github.token }}
      THREADS_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.batch && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify scripts and fail-closed fencing without side effects
        run: |
          node --check tools/cortes_threads_cloud_handoff.mjs
          node --check tools/threads_cloud_batch_pump.mjs
          node --check tools/cortes_threads_cloud_feed.mjs
          node --check tools/cortes_threads_cloud_captions.mjs
          node --check infra/neon-cortes-threads-execution/index.mjs
      - name: Run cloud and local fencing contract tests
        run: node --test tests/threads_cloud_handoff.test.mjs
      - name: One-time read-only proof of MP4 reachability from GitHub-hosted network
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 1
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://anthares.us/wp-content/uploads/anthares-clips/2026/10/short_fOmihuHUT1M_g1_7868_7908.mp4';
          try {
            const r = await fetch(url, {
              headers: { Range: 'bytes=0-1023', Accept: 'video/mp4' },
              redirect: 'manual',
              signal: AbortSignal.timeout(15000)
            });
            console.log('THREADS_GH_HTTP403_ORIGIN_STATUS=' + r.status);
            console.log('THREADS_GH_HTTP403_EDGE_SERVER=' + (r.headers.get('server') || 'missing').slice(0,80));
            console.log('THREADS_GH_HTTP403_REQUEST_ID=' + (r.headers.get('x-hcdn-request-id') || 'missing').slice(0,150));
            console.log('THREADS_GH_HTTP403_MEDIA_TYPE=' + (r.headers.get('content-type') || 'missing').slice(0,80));
            if (r.body) await r.body.cancel();
          } catch (e) {
            console.log('THREADS_GH_HTTP403_ORIGIN_ERROR=' + e.constructor.name);
          }
          NODE
      - name: Read account token directly from existing Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            4ef756b1-f948-4780-af26-b4ea014637bf > THREADS_ACCESS_TOKEN
      - name: Verify Threads account and execute dry run or authorized single publish
        if: env.THREADS_BATCH != '1'
        run: node tools/cortes_threads_cloud_handoff.mjs
      - name: One-off overnight cloud queue publisher with Neon fencing
        if: env.THREADS_BATCH == '1'
        run: node tools/threads_cloud_batch_pump.mjs
      - name: Independent QA P0 report after any cloud failure
        if: failure()
        run: node tools/cortes_threads_failure_reporter.mjs
