name: CORTES Threads Cloud Handoff (fenced)
on:
  schedule:
    - cron: '3,9,15,21,27,33,39,45,51,57 * * * *'
  # Independent wake-up if GitHub drops a six-minute scheduled event.
  # Reuse successful existing cloud publishers, never a desktop runner.
  workflow_run:
    workflows:
      - "CORTES Pinterest - automatic Buffer cloud publisher"
      - "CORTES Instagram - automatic Buffer cloud publisher"
      - "CORTES LinkedIn personal - primary hosted cloud publisher"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish exactly one Neon-reserved clip after local device acknowledged pause'
        required: true
        type: boolean
        default: false
      batch:
        description: 'Authorized 22 Oct overnight cloud queue pump; ends before 05:00 MS'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'tools/cortes_threads_cloud_handoff.mjs'
      - 'tools/cortes_threads_cloud_feed.mjs'
      - 'tools/cortes_threads_cloud_captions.mjs'
      - 'infra/neon-cortes-threads-execution/**'
      - '.github/workflows/cortes-threads-cloud-handoff.yml'
permissions:
  contents: read
  id-token: write
  issues: write
  actions: write
concurrency:
  group: cortes-threads-cloud-single-writer
  cancel-in-progress: false
jobs:
  wake-from-existing-publisher:
    # The upstream completed event is untrusted data. Never use its checkout,
    # workflow artifact, input, code or token. The fixed internal dispatch
    # still executes all existing Bitwarden, OIDC, Neon and cooldown gates.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the fenced publisher on trusted main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run cortes-threads-cloud-handoff.yml --repo "$GH_REPO" --ref main -f publish=true -f batch=false
  cloud:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      THREADS_ALLOW_PUBLISH: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && '1' || '0' }}
      GITHUB_TOKEN: ${{ github.token }}
      THREADS_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.batch && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify scripts and fail-closed fencing without side effects
        run: |
          node --check tools/cortes_threads_cloud_handoff.mjs
          node --check tools/cortes_threads_cloud_media_delivery.mjs
          node --check tools/threads_cloud_batch_pump.mjs
          node --check tools/cortes_threads_cloud_feed.mjs
          node --check tools/cortes_threads_cloud_captions.mjs
          node --check infra/neon-cortes-threads-execution/index.mjs
      - name: Run cloud and local fencing contract tests
        run: node --test tests/threads_cloud_handoff.test.mjs
      - name: Read account token directly from existing Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            4ef756b1-f948-4780-af26-b4ea014637bf > THREADS_ACCESS_TOKEN
      - name: Verify Threads account and execute dry run or authorized single publish
        if: env.THREADS_BATCH != '1'
        run: node tools/cortes_threads_cloud_handoff.mjs
      - name: One-off overnight cloud queue publisher with Neon fencing
        if: env.THREADS_BATCH == '1'
        run: node tools/threads_cloud_batch_pump.mjs
      - name: Independent QA P0 report after any cloud failure
        if: failure()
        run: node tools/cortes_threads_failure_reporter.mjs
