name: CORTES Instagram official token preflight (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-instagram-graph-auth-preflight.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cortes-instagram-graph-token-preflight
  cancel-in-progress: false
jobs:
  inspect-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Instagram Graph profile credentials without mutation
        shell: bash
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
          INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST || 'graph.instagram.com' }}
        run: |
          python - <<'PY'
          import os
          import sys
          from scripts.instagram_publish import client_from_env, InstagramAPIError
          user = os.environ.get("INSTAGRAM_USER_ID", "")
          token = os.environ.get("INSTAGRAM_ACCESS_TOKEN", "")
          print("INSTAGRAM_TOKEN_CONFIG_PRESENT=" + str(bool(user and token)))
          exit_code = 2
          try:
              profile = client_from_env()._request("GET", user, query={"fields": "id,username"})
              exit_code = 0 if profile.get("id") == user and str(profile.get("username", "")).lower() == "universoanthares" else 3
          except Exception as exc:
              exit_code = 4 if isinstance(exc, InstagramAPIError) else 5
          print("INSTAGRAM_GRAPH_PROFILE_CHECK=" + str(exit_code))
          sys.exit(exit_code)
          PY
