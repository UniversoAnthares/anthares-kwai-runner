name: TikTok UNCERTAIN Observation Reconcile
on:
  push:
    paths: ['.tiktok-reconcile-observe']
permissions:
  contents: read
  id-token: write
jobs:
  observe:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Wait for observation revision
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            REV=$(curl -fsS https://anthares-tiktok-render-rootless.onrender.com/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('revision',''))" || true)
            echo "revision=$REV"
            [ "$REV" = "68a069acf137a2cb8d59190b2bbdd3855f31ef82" ] && exit 0
            sleep 8
          done
          exit 2
      - name: Observe profile and reconcile only on exact positive evidence
        run: |
          set -euo pipefail
          RENDER_TOKEN="$(python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          u=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&'+urllib.parse.urlencode({'audience':'anthares-render-worker'})
          with urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}),timeout=20) as r: print(json.load(r)['value'])
          PY
          )"
          CONTROL_TOKEN="$(python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          u=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&'+urllib.parse.urlencode({'audience':'https://anthares-control.anthares1.workers.dev'})
          with urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}),timeout=20) as r: print(json.load(r)['value'])
          PY
          )"
          echo "::add-mask::$RENDER_TOKEN"; echo "::add-mask::$CONTROL_TOKEN"
          code="$(curl -sS -o /tmp/central-session.json -w '%{http_code}' https://anthares-control.anthares1.workers.dev/tiktok/session-state -H "Authorization: Bearer $CONTROL_TOKEN" -H 'Accept: application/json')"
          python3 - "$code" <<'PY'
          import json,sys
          d=json.load(open('/tmp/central-session.json')); state=d.get('state') if isinstance(d,dict) else None
          cookies=state.get('cookies') if isinstance(state,dict) else None
          print('CENTRAL_SESSION_META',{'http':int(sys.argv[1]),'available':d.get('available'),'cookie_count':len(cookies or [])})
          if int(sys.argv[1])!=200 or not isinstance(cookies,list) or not cookies: raise SystemExit('CENTRAL_SESSION_UNAVAILABLE')
          json.dump(state,open('/tmp/state-only.json','w'),separators=(',',':'))
          PY
          curl --fail-with-body -sS -X POST https://anthares-tiktok-render-rootless.onrender.com/bootstrap-session -H "Authorization: Bearer $RENDER_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/state-only.json > /tmp/bootstrap.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/bootstrap.json')); print('OBSERVE_BOOTSTRAP',{'ok':d.get('ok'),'cookies':d.get('cookies')})
          if not d.get('ok'): raise SystemExit('OBSERVE_BOOTSTRAP_FAILED')
          PY
          curl --fail-with-body -sS https://anthares-tiktok-render-rootless.onrender.com/session-status -H "Authorization: Bearer $RENDER_TOKEN" -H "X-Anthares-Control-OIDC: $CONTROL_TOKEN" > /tmp/status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          print('OBSERVE_SESSION', {k:d.get(k) for k in ('bootstrapped','identity_verified','ready_for_tiktok')})
          if not d.get('bootstrapped'): raise SystemExit('OBSERVE_SESSION_RESTORE_INVALID')
          PY
          curl --fail-with-body -sS --max-time 180 https://anthares-tiktok-render-rootless.onrender.com/profile-inventory -H "Authorization: Bearer $RENDER_TOKEN" > /tmp/inventory.json
          cat /tmp/inventory.json
          REMOTE_ID="$(python3 - <<'PY'
          import json,re,unicodedata,sys
          d=json.load(open('/tmp/inventory.json'))
          if not d.get('ok'): raise SystemExit(3)
          def norm(s):
            s=unicodedata.normalize('NFKD',str(s)).encode('ascii','ignore').decode().casefold()
            return re.sub(r'[^a-z0-9]+',' ',s).strip()
          hits=[]
          for x in d.get('items') or []:
            t=norm(x.get('text',''))
            if 'universo anthares' in t and 'teste tecnico de publicacao' in t:
              hits.append(str(x.get('id') or ''))
          print('MATCH_COUNT='+str(len(hits)),file=sys.stderr)
          if len(hits)!=1: raise SystemExit(4)
          print(hits[0])
          PY
          )" || { echo "TIKTOK_RECONCILE_OBSERVATION=NO_UNIQUE_POSITIVE_MATCH"; exit 4; }
          test -n "$REMOTE_ID"
          curl --fail-with-body -sS -X POST https://anthares-control.anthares1.workers.dev/job/reconcile -H "Authorization: Bearer $CONTROL_TOKEN" -H 'Content-Type: application/json' --data "{\"id\":\"tiktok-canary-20261006-synthetic-v2\",\"executor\":\"github\",\"confirmed\":true,\"remote_id\":\"$REMOTE_ID\",\"confirmation_evidence\":\"profile_exact_caption:$REMOTE_ID\"}" > /tmp/reconcile.json
          cat /tmp/reconcile.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/reconcile.json')); j=d.get('job') or {}
          if not d.get('ok') or j.get('status')!='published' or not j.get('confirmed'): raise SystemExit('RECONCILE_NOT_CONFIRMED')
          print('TIKTOK_REAL_REMOTE_POST=PROVEN remote_id='+str(j.get('remote_id')))
          PY
