name: TikTok Central Session Read Probe
on:
  push:
    paths:
      - '.tiktok-central-session-read-trigger'
      - '.tiktok-reconcile-observe-allowed'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  central-session-read:
    if: ${{ !contains(github.event.head_commit.message, '[uncertain-observe]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC for anthares-control
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fanthares-control.anthares1.workers.dev" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Read central TikTok session metadata
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/session.json -w '%{http_code}' -H "Authorization: Bearer $OIDC_TOKEN" -H 'Accept: application/json' https://anthares-control.anthares1.workers.dev/tiktok/session-state)"
          python3 - "$code" <<'PY'
          import json,sys
          code=int(sys.argv[1])
          try: d=json.load(open('/tmp/session.json'))
          except Exception: d={}
          safe={"http":code,"ok":d.get("ok"),"available":d.get("available"),"updated_at":d.get("updated_at")}
          state=d.get("state") if isinstance(d,dict) else None
          if isinstance(state,dict):
              safe["cookie_count"]=len(state.get("cookies") or [])
              safe["origin_count"]=len(state.get("origins") or [])
          print(json.dumps(safe,sort_keys=True))
          if code==200 and d.get("available") is True and isinstance(state,dict) and isinstance(state.get("cookies"),list) and state.get("cookies"):
              if len(state.get("cookies") or [])>256:
                  print("CENTRAL_SESSION_COOKIE_LIMIT_INVALID")
                  raise SystemExit(5)
              print("CENTRAL_SESSION_AVAILABLE")
              raise SystemExit(0)
          if code==404 and d.get("available") is False:
              print("CENTRAL_SESSION_ABSENT")
              raise SystemExit(2)
          if code in (401,403):
              print("PROBE_AUTH_INVALID")
              raise SystemExit(3)
          print("PROBE_RESPONSE_INVALID")
          raise SystemExit(4)
          PY
      - name: Request GitHub OIDC for Render TikTok worker
        id: render_oidc
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=anthares-render-worker" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Rehydrate Render and verify direct TikTok readiness
        env:
          CONTROL_TOKEN: ${{ steps.oidc.outputs.token }}
          RENDER_TOKEN: ${{ steps.render_oidc.outputs.token }}
          CONTROL_URL: https://anthares-control.anthares1.workers.dev
          RENDER_URL: https://anthares-tiktok-render-rootless.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          control=os.environ['CONTROL_URL'].rstrip('/')
          render=os.environ['RENDER_URL'].rstrip('/')
          control_token=os.environ['CONTROL_TOKEN']
          render_token=os.environ['RENDER_TOKEN']

          def call(url, token, method='GET', payload=None, timeout=180):
              headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'AntharesApprovedTikTokSession/2'}
              body=None
              if payload is not None:
                  headers['Content-Type']='application/json'
                  body=json.dumps(payload,separators=(',',':')).encode('utf-8')
              req=urllib.request.Request(url,data=body,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode('utf-8','replace')
                      data=json.loads(raw) if raw else {}
                      return int(getattr(r,'status',200)), data
              except urllib.error.HTTPError as exc:
                  raw=exc.read().decode('utf-8','replace')
                  try: data=json.loads(raw) if raw else {}
                  except Exception: data={}
                  return int(exc.code), data

          envelope=json.load(open('/tmp/session.json',encoding='utf-8'))
          state=envelope.get('state') if isinstance(envelope,dict) else None
          cookies=state.get('cookies') if isinstance(state,dict) else None
          origins=state.get('origins') if isinstance(state,dict) else None
          if not isinstance(cookies,list) or not cookies or len(cookies)>256:
              raise SystemExit('central state failed local validation')
          if origins is not None and not isinstance(origins,list):
              raise SystemExit('central origins failed local validation')

          code,boot=call(render+'/bootstrap-session',render_token,'POST',state,60)
          print(json.dumps({'RENDER_OIDC_BOOTSTRAP':'OK' if code==200 and boot.get('ok') is True else 'FAILED','http':code,'cookie_count':boot.get('cookies')},sort_keys=True))
          if code!=200 or boot.get('ok') is not True:
              raise SystemExit('Render bootstrap failed')

          code,status=call(render+'/session-status',render_token,timeout=45)
          safe_status={
              'RENDER_SESSION_STATUS':'OK' if code==200 and status.get('bootstrapped') is True else 'FAILED',
              'http':code,
              'bootstrapped':status.get('bootstrapped'),
              'identity_verified_before_test':status.get('identity_verified'),
              'central_restore_reason':status.get('central_restore_reason'),
              'central_restore_http':status.get('central_restore_http'),
          }
          print(json.dumps(safe_status,sort_keys=True))
          if code!=200 or status.get('bootstrapped') is not True:
              raise SystemExit('Render session-status failed')

          code,tested=call(render+'/session-test',render_token,'POST',{},180)
          safe_test={
              'RENDER_SESSION_TEST':'OK' if code==200 and tested.get('ok') is True and tested.get('identity_verified') is True else 'FAILED',
              'http':code,
              'worker_code':tested.get('code'),
              'ok':tested.get('ok'),
              'identity_verified':tested.get('identity_verified'),
              'central_persisted_from_worker':tested.get('central_persisted'),
              'error':tested.get('error'),
          }
          print(json.dumps(safe_test,sort_keys=True))
          if code!=200 or tested.get('ok') is not True or tested.get('identity_verified') is not True:
              raise SystemExit('Render session-test identity verification failed')

          refreshed=tested.get('refreshed_state')
          fresh_cookies=refreshed.get('cookies') if isinstance(refreshed,dict) else None
          fresh_origins=refreshed.get('origins') if isinstance(refreshed,dict) else None
          if not isinstance(fresh_cookies,list) or not fresh_cookies or len(fresh_cookies)>256:
              raise SystemExit('refreshed state missing or invalid')
          if not isinstance(fresh_origins,list):
              fresh_origins=[]

          code,persisted=call(control+'/tiktok/session-state',control_token,'POST',{'cookies':fresh_cookies,'origins':fresh_origins},45)
          print(json.dumps({'CENTRAL_SESSION_PERSIST':'OK' if code==200 and persisted.get('ok') is True else 'FAILED','http':code,'cookie_count':len(fresh_cookies)},sort_keys=True))
          if code!=200 or persisted.get('ok') is not True:
              raise SystemExit('central session persist failed')

          code,cfg=call(render+'/config-status',render_token,timeout=45)
          print(json.dumps({
              'RENDER_LEGACY_CONFIG_INFORMATIONAL':True,
              'http':code,
              'legacy_ok':cfg.get('ok'),
              'configured':cfg.get('configured'),
              'session_bootstrapped':cfg.get('session_bootstrapped'),
          },sort_keys=True))

          code,dry=call(render+'/publish-dry-run',render_token,'POST',{'test':'08'},45)
          safe_dry={
              'RENDER_DIRECT_PUBLISHER_DRYRUN':'OK' if code==200 and dry.get('ok') is True and dry.get('identity_verified') is True else 'FAILED',
              'http':code,
              'ok':dry.get('ok'),
              'identity_verified':dry.get('identity_verified'),
              'upload_page_auth':dry.get('upload_page_auth'),
          }
          print(json.dumps(safe_dry,sort_keys=True))
          if code!=200 or dry.get('ok') is not True or dry.get('identity_verified') is not True:
              raise SystemExit('Render direct publisher readiness failed')

          print('TIKTOK_RENDER_REHYDRATE=PRODUCTION_PROVEN')
          print('TIKTOK_RENDER_DIRECT_READY=PRODUCTION_PROVEN')
          PY
      - name: Audit central TikTok planner
        env:
          CONTROL_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://anthares-control.anthares1.workers.dev/queue-health',headers={'Authorization':'Bearer '+os.environ['CONTROL_TOKEN'],'Accept':'application/json','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r: q=json.load(r)
          safe={
              'ok':q.get('ok'),
              'tiktok_confirmed':int((q.get('counts') or {}).get('tiktok',0)),
              'tiktok_remaining':(q.get('remaining') or {}).get('tiktok'),
              'dedupe_healthy':bool((q.get('dedupe') or {}).get('healthy',False)),
          }
          print(json.dumps({'TIKTOK_QUEUE_PREFLIGHT':safe},sort_keys=True))
          if q.get('ok') is not True: raise SystemExit('central queue unavailable')
          if not safe['dedupe_healthy']: raise SystemExit('central dedupe unhealthy')
          if safe['tiktok_confirmed']>=3: raise SystemExit('diagnostic TikTok daily target already reached')
          print('TIKTOK_QUEUE_PREFLIGHT=OK')
          PY
      - name: Discover recent owned streams without downloading media
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q yt-dlp
          yt-dlp --flat-playlist --playlist-end 5 --dump-json 'https://www.youtube.com/@UniversoAnthares/streams' > /tmp/anthares-streams.jsonl
          python3 - <<'PY'
          import json
          rows=[]
          for line in open('/tmp/anthares-streams.jsonl',encoding='utf-8'):
              try: d=json.loads(line)
              except Exception: continue
              rows.append({
                  'id':str(d.get('id') or ''),
                  'title':str(d.get('title') or ''),
                  'duration':d.get('duration'),
                  'live_status':d.get('live_status'),
                  'url':str(d.get('webpage_url') or d.get('url') or ''),
              })
          if not rows: raise SystemExit('no owned stream source discovered')
          print(json.dumps({'ANTHARES_OWNED_STREAM_CANDIDATES':rows},ensure_ascii=False,sort_keys=True))
          print('ANTHARES_OWNED_SOURCE_DISCOVERY=OK')
          PY

  uncertain-observe:
    if: ${{ contains(github.event.head_commit.message, '[uncertain-observe]') }}
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Obtain allowed control and Render OIDC
        run: |
          set -euo pipefail
          CONTROL_TOKEN="$(python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          u=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&'+urllib.parse.urlencode({'audience':'https://anthares-control.anthares1.workers.dev'})
          with urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}),timeout=20) as r: print(json.load(r)['value'])
          PY
          )"
          RENDER_TOKEN="$(python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          u=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&'+urllib.parse.urlencode({'audience':'anthares-render-worker'})
          with urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}),timeout=20) as r: print(json.load(r)['value'])
          PY
          )"
          echo "::add-mask::$CONTROL_TOKEN"; echo "::add-mask::$RENDER_TOKEN"
          echo "CONTROL_TOKEN=$CONTROL_TOKEN" >> "$GITHUB_ENV"
          echo "RENDER_TOKEN=$RENDER_TOKEN" >> "$GITHUB_ENV"
      - name: Bootstrap from central and observe exact canary
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/central.json -w '%{http_code}' https://anthares-control.anthares1.workers.dev/tiktok/session-state -H "Authorization: Bearer $CONTROL_TOKEN")"
          python3 - "$code" <<'PY'
          import json,sys
          d=json.load(open('/tmp/central.json')); st=d.get('state') if isinstance(d,dict) else None; ck=st.get('cookies') if isinstance(st,dict) else None
          print('CENTRAL_SESSION_META',{'http':int(sys.argv[1]),'available':d.get('available'),'cookie_count':len(ck or [])})
          if int(sys.argv[1])!=200 or not ck: raise SystemExit('CENTRAL_SESSION_UNAVAILABLE')
          json.dump(st,open('/tmp/state.json','w'),separators=(',',':'))
          PY
          curl --fail-with-body -sS -X POST https://anthares-tiktok-render-rootless.onrender.com/bootstrap-session -H "Authorization: Bearer $RENDER_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/state.json >/tmp/boot.json
          INV_HTTP="$(curl -sS --max-time 180 -o /tmp/inventory.json -w '%{http_code}' https://anthares-tiktok-render-rootless.onrender.com/profile-inventory -H "Authorization: Bearer $RENDER_TOKEN")"
          python3 - "$INV_HTTP" <<'PY'
          import json,sys
          d=json.load(open('/tmp/inventory.json'))
          print('PROFILE_INVENTORY_META',{'http':int(sys.argv[1]),'ok':d.get('ok'),'error':d.get('error'),'detail':d.get('detail'),'count':d.get('count')})
          if int(sys.argv[1])!=200 or not d.get('ok'): raise SystemExit('PROFILE_INVENTORY_INVALID')
          PY
          REMOTE_ID="$(python3 - <<'PY'
          import json,re,unicodedata,sys
          d=json.load(open('/tmp/inventory.json'))
          def norm(v): return re.sub(r'[^a-z0-9]+',' ',unicodedata.normalize('NFKD',str(v)).encode('ascii','ignore').decode().casefold()).strip()
          hits=[str(x.get('id') or '') for x in d.get('items',[]) if 'universo anthares' in norm(x.get('text','')) and 'teste tecnico de publicacao' in norm(x.get('text',''))]
          print('MATCH_COUNT='+str(len(hits)),file=sys.stderr)
          if len(hits)!=1: raise SystemExit(4)
          print(hits[0])
          PY
          )" || { echo TIKTOK_RECONCILE_OBSERVATION=NO_UNIQUE_POSITIVE_MATCH; exit 4; }
          curl --fail-with-body -sS -X POST https://anthares-control.anthares1.workers.dev/job/reconcile -H "Authorization: Bearer $CONTROL_TOKEN" -H 'Content-Type: application/json' --data "{\"id\":\"tiktok-canary-20261006-synthetic-v2\",\"executor\":\"github\",\"confirmed\":true,\"remote_id\":\"$REMOTE_ID\",\"confirmation_evidence\":\"profile_exact_caption:$REMOTE_ID\"}" >/tmp/reconcile.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/reconcile.json')); j=d.get('job') or {}
          if not d.get('ok') or j.get('status')!='published' or not j.get('confirmed'): raise SystemExit('RECONCILE_NOT_CONFIRMED')
          print('TIKTOK_REAL_REMOTE_POST=PROVEN remote_id='+str(j.get('remote_id')))
          PY
