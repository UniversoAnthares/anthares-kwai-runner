name: TikTok strong session identity verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tiktok-central-session-read.yml
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read protected TikTok session and audit dedupe queue lease fence through approved OIDC
        shell: bash
        run: |
          set -euo pipefail
          sep='&'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] || sep='?'
          aud='https%3A%2F%2Fanthares-control.anthares1.workers.dev'
          jwt="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${aud}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$jwt"
          curl -fsS --max-time 30 -H "Authorization: Bearer $jwt" https://anthares-control.anthares1.workers.dev/tiktok/session-state -o /tmp/session.json
          curl -fsS --max-time 30 -H "Authorization: Bearer $jwt" https://anthares-control.anthares1.workers.dev/queue-health -o /tmp/queue.json
          python3 - <<'PY'
          import json,time
          d=json.load(open('/tmp/session.json')); st=d.get('state') or {}; cookies=st.get('cookies') or []
          assert d.get('available') is True and cookies, 'CENTRAL_TIKTOK_SESSION_UNAVAILABLE'
          json.dump({'cookies':cookies,'origins':st.get('origins') or []},open('/tmp/storage-state.json','w'))
          q=json.load(open('/tmp/queue.json')); raw=q.get('jobs') or []
          jobs=list(raw.values()) if isinstance(raw,dict) else raw if isinstance(raw,list) else []
          jobs=[j for j in jobs if isinstance(j,dict)]
          tjobs=[j for j in jobs if str(j.get('platform') or '').lower()=='tiktok']
          overlaps=[]; published=[]; started_ambiguous=[]; uncertain=[]; orphan_leases=[]
          now=time.time()
          for j in tjobs:
              status=str(j.get('status') or '').lower()
              try: a=float(j.get('source_start')); b=float(j.get('source_end'))
              except Exception: a=b=None
              same_source=str(j.get('source_id') or '')=='9CIk-I_3VhM'
              if same_source and a is not None and max(8,a)<min(98,b):
                  overlaps.append(j)
              if status in {'published','completed','confirmed'} or bool(j.get('confirmed')) or j.get('remote_id'):
                  if same_source and a is not None and max(8,a)<min(98,b): published.append(j)
              if bool(j.get('publication_started')) and not bool(j.get('confirmed')) and not j.get('remote_id'):
                  started_ambiguous.append(j)
              if status in {'uncertain','uncertain_reconcile','reconcile_pending','ambiguous'} or str(j.get('error_class') or '').lower() in {'uncertain','uncertain_reconcile','ambiguous_outcome'}:
                  uncertain.append(j)
              if status in {'leased','processing','running'}:
                  exp=j.get('lease_expires_at') or j.get('lease_expiry') or j.get('lease_until')
                  if exp:
                      try:
                          if isinstance(exp,(int,float)) and float(exp)<now: orphan_leases.append(j)
                      except Exception: pass
          def compact(rows):
              return [{k:j.get(k) for k in ('id','status','source_id','source_start','source_end','media_sha256','publication_started','confirmed','remote_id','lease_expires_at','lease_until','error_class')} for j in rows]
          print('CENTRAL_TIKTOK_SESSION_AVAILABLE=1')
          print('CENTRAL_TIKTOK_COOKIE_COUNT='+str(len(cookies)))
          print('TIKTOK_QUEUE_JOB_COUNT='+str(len(tjobs)))
          print('TARGET_INTERVAL_OVERLAP_COUNT='+str(len(overlaps)))
          print('TARGET_INTERVAL_OVERLAPS='+json.dumps(compact(overlaps),separators=(',',':')))
          print('TARGET_INTERVAL_PUBLISHED_COUNT='+str(len(published)))
          print('PUBLICATION_STARTED_AMBIGUOUS_COUNT='+str(len(started_ambiguous)))
          print('UNCERTAIN_RECONCILE_COUNT='+str(len(uncertain)))
          print('ORPHAN_LEASE_COUNT='+str(len(orphan_leases)))
          hazards=[]
          if published: hazards.append('TARGET_ALREADY_PUBLISHED')
          if started_ambiguous: hazards.append('PUBLICATION_STARTED_AMBIGUOUS')
          if uncertain: hazards.append('UNCERTAIN_RECONCILE_PRESENT')
          if orphan_leases: hazards.append('ORPHAN_LEASE_PRESENT')
          # Any target overlap is relevant to dedupe; a clean prepublish audit requires
          # either no overlap or only a clearly terminal non-published failed/cancelled job.
          unsafe_overlap=[j for j in overlaps if str(j.get('status') or '').lower() not in {'failed','cancelled','canceled','aborted'}]
          if unsafe_overlap: hazards.append('UNSAFE_TARGET_OVERLAP')
          print('PREPUBLISH_HAZARDS='+json.dumps(hazards,separators=(',',':')))
          if hazards: raise SystemExit('TIKTOK_PREPUBLISH_AUDIT_BLOCKED:'+','.join(hazards))
          print('TIKTOK_PREPUBLISH_QUEUE_FENCE_AUDIT=PROVEN_CLEAN')
          PY
      - name: Require strong account identity evidence and capture baseline
        shell: bash
        env:
          TIKTOK_STORAGE_STATE_FILE: /tmp/storage-state.json
          EXPECTED_TIKTOK_USERNAME: universo.anthares
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
          python3 - <<'PY'
          import json,re,time,os,sys
          from playwright.sync_api import sync_playwright
          state=json.load(open('/tmp/storage-state.json'))
          expected='universo.anthares'
          def hydration_user(page):
              try:
                  raw=page.locator('#__UNIVERSAL_DATA_FOR_REHYDRATION__').text_content(timeout=5000)
                  d=json.loads(raw or '{}')
                  u=(d.get('__DEFAULT_SCOPE__',{}).get('webapp.app-context',{}).get('user',{}) or {})
                  return str(u.get('uniqueId') or '').strip().lower()
              except Exception:
                  return ''
          strong=set()
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox','--disable-gpu'])
              ctx=browser.new_context(storage_state=state,viewport={'width':1440,'height':1000},locale='pt-BR')
              page=ctx.new_page()
              for url in ['https://www.tiktok.com/profile','https://www.tiktok.com/tiktokstudio/upload?from=webapp','https://www.tiktok.com/upload?lang=pt-BR']:
                  page.goto(url,wait_until='domcontentloaded',timeout=60000); time.sleep(3)
                  m=re.search(r'tiktok\.com/@([^/?#]+)',page.url,re.I)
                  if m: strong.add(m.group(1).lower())
                  hu=hydration_user(page)
                  if hu: strong.add(hu)
              print('STRONG_ACCOUNT_CANDIDATES='+json.dumps(sorted(strong)))
              if expected not in strong: raise RuntimeError('STRONG_TIKTOK_IDENTITY_NOT_PROVEN')
              print('STRONG_TIKTOK_IDENTITY_PROVEN='+expected)
              ctx.close(); browser.close()
          sys.path.insert(0,os.path.join(os.getcwd(),'direct-tiktok-publisher'))
          import tiktok_worker as tw
          vids=tw.inventory_profile_videos(expected)
          ids=sorted({str(v.get('id') or '') for v in vids if str(v.get('id') or '')})
          print('PROFILE_BASELINE_COUNT='+str(len(ids)))
          print('PROFILE_BASELINE_IDS='+json.dumps(ids))
          PY
