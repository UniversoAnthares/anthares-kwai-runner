name: Suspend final retired Render worker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-retire-x-final-20261014.yml

permissions:
  contents: read

concurrency:
  group: render-retire-x-final-20261014
  cancel-in-progress: false

jobs:
  suspend-final-x:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Suspend the last retired Render service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          token=os.getenv('RENDER_API_KEY','')
          if not token:
              raise SystemExit('RENDER_API_KEY_MISSING')
          sid='srv-db6gcoad0e5s73alefn0'
          base='https://api.render.com/v1'
          headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json','User-Agent':'anthares-retirement-cleanup/1'}
          def call(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read().decode('utf-8','replace')
                  return r.status,(json.loads(raw) if raw else {})
          _,info=call('GET','/services/'+sid)
          if info.get('name')!='anthares-x-render-worker-v3' or info.get('ownerId')!='tea-d9hnkbt8nd3s73f0876g':
              raise SystemExit('RENDER_SERVICE_IDENTITY_MISMATCH')
          if info.get('suspended')!='suspended':
              code,_=call('POST','/services/'+sid+'/suspend')
              if code!=202:
                  raise SystemExit('RENDER_SUSPEND_UNEXPECTED_'+str(code))
          for _ in range(30):
              _,cur=call('GET','/services/'+sid)
              if cur.get('suspended')=='suspended':
                  print('FINAL_RENDER_SERVICE_SUSPENDED=1')
                  break
              time.sleep(3)
          else:
              raise SystemExit('RENDER_SUSPEND_NOT_CONFIRMED')
          PY
