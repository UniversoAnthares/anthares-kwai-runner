name: Anthares Secrets - Remote Smoke Test
on:
  workflow_dispatch:
    inputs:
      secret_id:
        description: "Bitwarden UUID of nonproduction Anthares Automation secret"
        type: string
        required: false
        default: "6edd06b7-ce2e-4519-905f-b4e800e4fe1a"
  push:
    branches: [main]
    paths: ['.github/workflows/anthares-secrets-smoke.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download integrity-verified Bitwarden Secrets CLI
        shell: bash
        run: |
          set -euo pipefail
          version=2.1.0
          archive="bws-x86_64-unknown-linux-gnu-${version}.zip"
          curl -fsSL --retry 2 "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${version}/${archive}" -o "/tmp/${archive}"
          echo "ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  /tmp/${archive}" | sha256sum -c - >/dev/null
          mkdir -p /tmp/anthares-bws
          unzip -q "/tmp/${archive}" -d /tmp/anthares-bws
          /tmp/anthares-bws/bws --version
      - name: Verify remotely authorized nonproduction secret read
        shell: bash
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          TEST_SECRET_ID: ${{ inputs.secret_id || '6edd06b7-ce2e-4519-905f-b4e800e4fe1a' }}
        run: |
          set -euo pipefail
          test -n "$BWS_ACCESS_TOKEN" || { echo "::error::BWS_BOOTSTRAP_MISSING"; exit 1; }
          if /tmp/anthares-bws/bws secret get "$TEST_SECRET_ID" >/dev/null 2>&1; then
            echo "ANTHARES_BWS_2_1=PASS"
            exit 0
          fi
          echo "ANTHARES_BWS_2_1=INCOMPATIBLE_WITH_CURRENT_TOKEN"
          version=1.0.0
          archive="bws-x86_64-unknown-linux-gnu-${version}.zip"
          curl -fsSL --retry 2 "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${version}/${archive}" -o "/tmp/${archive}"
          curl -fsSL --retry 2 "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${version}/bws-sha256-checksums-${version}.txt" -o "/tmp/bws-checksums"
          grep -F "${archive}" /tmp/bws-checksums | sed "s#  ${archive}#  /tmp/${archive}#" | sha256sum -c - >/dev/null
          mkdir -p /tmp/anthares-bws-v1
          unzip -q "/tmp/${archive}" -d /tmp/anthares-bws-v1
          if /tmp/anthares-bws-v1/bws secret get "$TEST_SECRET_ID" >/dev/null 2>&1; then
            echo "ANTHARES_BWS_1_0=PASS"
          else
            echo "::error::BWS_1_0_AND_2_1_TOKEN_REJECTED"
            exit 1
          fi
