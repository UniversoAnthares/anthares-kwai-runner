name: Anthares Secrets - Remote Smoke Test
on:
  workflow_dispatch:
    inputs:
      secret_id:
        description: "UUID of a nonproduction Bitwarden secret in Anthares Automation; never enter secret value"
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check bootstrap token is configured without revealing it
        env:
          BOOTSTRAP: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          if [ -z "$BOOTSTRAP" ]; then
            echo "::error::BWS_ACCESS_TOKEN not configured"
            exit 1
          fi
          echo "Anthares Secrets bootstrap available"
      - name: Retrieve isolated test secret from Bitwarden
        uses: bitwarden/sm-action@v3
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            ${{ inputs.secret_id }} > ANTHARES_SECRETS_SMOKE
      - name: Verify that retrieval returned a value without logging it
        shell: bash
        run: |
          if [ -z "${ANTHARES_SECRETS_SMOKE:-}" ]; then
            echo "::error::Bitwarden secret was not loaded"
            exit 1
          fi
          echo "ANTHARES_SECRETS_REMOTE_READ=PASS"
