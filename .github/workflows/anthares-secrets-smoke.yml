name: Anthares Secrets - Remote Smoke Test
on:
  workflow_dispatch:
    inputs:
      secret_id:
        description: "Nonproduction Bitwarden secret UUID"
        type: string
        required: false
        default: "6edd06b7-ce2e-4519-905f-b4e800e4fe1a"
  push:
    branches: [main]
    paths: ['.github/workflows/anthares-secrets-smoke.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check machine bootstrap exists without revealing it
        env:
          BWS_BOOTSTRAP: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          test -n "$BWS_BOOTSTRAP" || { echo "::error::BWS_BOOTSTRAP_MISSING"; exit 1; }
      - name: Retrieve authorized nonproduction secret using proven Bitwarden integration
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            ${{ inputs.secret_id || '6edd06b7-ce2e-4519-905f-b4e800e4fe1a' }} > ANTHARES_SECRETS_SMOKE
      - name: Verify remote read without printing the secret
        shell: bash
        run: |
          test -n "${ANTHARES_SECRETS_SMOKE:-}" || { echo "::error::SECRET_READ_FAILED"; exit 1; }
          echo "ANTHARES_SECRETS_REMOTE_READ=PASS"
# Bitwarden action v2 remains the proven token adapter. CLI 1.0.0/2.1.0 were
# rejected for this existing bootstrap token and must not replace a proven path.
