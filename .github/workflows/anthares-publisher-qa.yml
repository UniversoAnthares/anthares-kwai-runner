name: Anthares Publisher QA
on:
  push:
    branches: [main]
    paths:
      - 'anthares_publisher/**'
      - 'kwai_queue_state.sh'
      - 'tests/test_anthares_publisher_*.py'
      - '.github/workflows/anthares-publisher-qa.yml'
  pull_request:
    paths:
      - 'anthares_publisher/**'
      - 'kwai_queue_state.sh'
      - 'tests/test_anthares_publisher_*.py'
      - '.github/workflows/anthares-publisher-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Anthares Publisher contracts
        run: |
          bash -n kwai_queue_state.sh
          python3 -m unittest discover -s tests -p 'test_anthares_publisher_*.py' -v
