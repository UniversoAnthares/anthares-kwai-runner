name: Kwai Deeplink + Exported Activity Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - kwai_login_deeplink_probe.py

jobs:
  probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 180
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            bash kwai_vault_install.sh
            sleep 8
            python3 kwai_login_deeplink_probe.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kwai-deeplink-probe
          path: kwai-login-probe-artifacts/
          retention-days: 3
