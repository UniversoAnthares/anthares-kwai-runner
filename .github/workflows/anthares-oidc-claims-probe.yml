name: Anthares OIDC Claims Probe

on:
  push:
    branches: [feature/anthares-executor-failover]
    paths:
      - '.github/workflows/anthares-oidc-claims-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Acquire token and print only allow-list identity claims
        run: |
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=anthares-session-migration"
          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" -o /tmp/oidc.json
          python - <<'PY'
          import base64, json
          token=json.load(open('/tmp/oidc.json'))['value']
          payload=token.split('.')[1]
          payload += '=' * (-len(payload)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          allowed=('iss','aud','sub','repository','ref','workflow_ref','job_workflow_ref','event_name')
          print('OIDC_SAFE_CLAIMS='+json.dumps({k:claims.get(k) for k in allowed},separators=(',',':')))
          PY
          rm -f /tmp/oidc.json
