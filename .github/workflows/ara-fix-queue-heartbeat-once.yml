name: ARA one-shot queue heartbeat fix

# One-shot source repair. Delete this workflow after the verified patch lands.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ara-fix-queue-heartbeat-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Keep issue queues alive when all HTTP controls are unavailable
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('anthares-remote-agent/cmd/agent/main.go')
          s=p.read_text(encoding='utf-8')
          old='''\t\t\tif failures >= 4 {\n\t\t\t\tfmt.Fprintln(os.Stderr, "control heartbeat unavailable; exiting for supervisor recovery")\n\t\t\t\tos.Exit(23)\n\t\t\t}\n'''
          new='''\t\t\tif failures >= 4 {\n\t\t\t\tif issueQueueConfigured() {\n\t\t\t\t\t// GitHub/GitLab issue queues are independent transports. Keep the\n\t\t\t\t\t// process alive when HTTP control is unavailable so queue-only\n\t\t\t\t\t// recovery remains continuously reachable.\n\t\t\t\t\tfmt.Fprintln(os.Stderr, "control heartbeat unavailable; issue queue transport remains active")\n\t\t\t\t\tfailures = 4\n\t\t\t\t} else {\n\t\t\t\t\tfmt.Fprintln(os.Stderr, "control heartbeat unavailable; exiting for supervisor recovery")\n\t\t\t\t\tos.Exit(23)\n\t\t\t\t}\n\t\t\t}\n'''
          if new in s:
              print('already patched')
          elif old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          else:
              raise SystemExit('expected heartbeat block not found')
          PY
          gofmt -w anthares-remote-agent/cmd/agent/main.go
          cd anthares-remote-agent
          go test ./... -count=1
      - name: Commit verified fix
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anthares-remote-agent/cmd/agent/main.go
          git commit -m 'fix(ara): keep issue-queue recovery alive without HTTP control'
          git push origin HEAD:main
