name: Northflank runtime status probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/northflank-runtime-status-20261014.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Inspect existing Anthares ARA service without mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse
          token=os.environ.get('NORTHFLANK_API_TOKEN','')
          if not token: raise SystemExit('NORTHFLANK_API_TOKEN_MISSING')
          h={'Authorization':'Bearer '+token}
          def get(path):
              req=urllib.request.Request('https://api.northflank.com/v1'+path,headers=h)
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read() or b'{}')
          projects=get('/projects').get('data',{}).get('projects',[])
          if isinstance(projects,dict):projects=list(projects.values())
          pid=next((p.get('id') for p in projects if p.get('name')=='Default'),None)
          if not pid:raise SystemExit('DEFAULT_PROJECT_NOT_FOUND')
          services=get(f'/projects/{pid}/services').get('data',{}).get('services',[])
          if isinstance(services,dict):services=list(services.values())
          s=next((x for x in services if x.get('name')=='anthares-ara-northflank'),None)
          if not s:raise SystemExit('ARA_SERVICE_NOT_FOUND')
          sid=s.get('id') or 'anthares-ara-northflank'
          detail=get(f'/projects/{pid}/services/{sid}').get('data',{})
          print('SERVICE_ID_PRESENT=1')
          print('SERVICE_STATUS='+json.dumps(detail.get('status') or s.get('status') or {},sort_keys=True))
          for key in ('createdAt','updatedAt','branch','buildSHA','buildId'):
              if key in detail: print(key.upper()+'='+str(detail.get(key)))
          bs=detail.get('buildSettings') or {}
          docker=bs.get('dockerfile') or bs.get('dockerFile') or {}
          print('BUILD_DOCKERFILE='+str(docker.get('dockerFilePath') or docker.get('path') or ''))
          print('BUILD_WORKDIR='+str(docker.get('dockerWorkDir') or ''))
          buildsrc=detail.get('buildSource') or detail.get('source') or {}
          if isinstance(buildsrc,dict):
              for key in ('branch','repo','repository','buildSHA','commit','sha'):
                  if key in buildsrc: print('SOURCE_'+key.upper()+'='+str(buildsrc.get(key)))
          try:
              dep=get(f'/projects/{pid}/services/{sid}/deployment').get('data',{})
              safe={k:dep.get(k) for k in ('region','instances') if k in dep}
              if isinstance(dep.get('internal'),dict):safe['internal']={k:dep['internal'].get(k) for k in ('id','branch','buildSHA','buildId') if k in dep['internal']}
              print('DEPLOYMENT='+json.dumps(safe,sort_keys=True))
          except Exception as e: print('DEPLOYMENT_ERROR='+type(e).__name__)
          ports=get(f'/projects/{pid}/services/{sid}/ports').get('data',{}).get('ports',[])
          for p in ports:
              safe={k:p.get(k) for k in ('name','internalPort','public','protocol','dns') if k in p}
              print('PORT='+json.dumps(safe,sort_keys=True))
          for endpoint,label in ((f'/projects/{pid}/services/{sid}/logs?'+urllib.parse.urlencode({'type':'runtime','queryType':'range','duration':1200,'lineLimit':60,'direction':'backward'}),'RUNTIME'),(f'/projects/{pid}/services/{sid}/build-logs?'+urllib.parse.urlencode({'queryType':'range','duration':1200,'lineLimit':60,'direction':'backward'}),'BUILD')):
              try:
                  rows=get(endpoint).get('data',[])
                  print(label+'_LOG_LINES='+str(len(rows)))
                  for row in rows[-40:]: print(label+'_LOG '+str(row.get('ts') or '')+' '+str(row.get('log') or '').replace('\n',' ')[:1000])
              except Exception as e: print(label+'_LOG_ERROR='+type(e).__name__+':'+str(e)[:160])
          PY
