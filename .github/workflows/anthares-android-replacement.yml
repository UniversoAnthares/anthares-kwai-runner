name: Anthares Android - GitHub hosted (CircleCI replacement)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/anthares-android-replacement.yml'
      - 'ci-hub/executor-routing.json'
      - 'tools/android_executor_router.py'
      - 'tests/test_android_executor_router.py'
      - 'tools/kwai_android_login_entry.py'
      - 'tools/kwai_login_ui_locator.py'
      - 'tools/kwai_semantic_login_route_probe.py'
      - 'tools/kwai_chooser_failure_triage.py'
      - 'tests/test_kwai_chooser_failure_triage.py'

permissions:
  contents: read

concurrency:
  group: anthares-android-replacement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify retired CircleCI is never selected
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p 'test_android_executor_router.py' -v
          python3 -m unittest discover -s tests -p 'test_kwai_chooser_failure_triage.py' -v
          python3 - <<'PY'
          import json
          m=json.load(open('ci-hub/executor-routing.json'))
          assert 'circleci' not in m['android_execution']['priority']
          assert 'circleci' not in m['browser_execution']['priority']
          assert m['providers']['circleci']['active'] is False
          assert m['providers']['gitlab']['active'] is True
          print('CIRCLECI_RETIRED_ROUTING=PASS')
          PY

  android-kwai-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    needs: routing-contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: me_retry
            network: network_wait
            settle: '2'
          - route: me_relaunch
            network: wifi_cycle
            settle: '2'
          - route: me_direct
            network: baseline
            settle: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK command-line tools (no emulator action)
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Start accelerated headless Android 35 and verify real Kwai APK
        shell: bash
        run: |
          set -Eeuo pipefail
          PHASE=KVM
          trap 'code=$?; echo "ANDROID_KWAI_FAILURE_PHASE=$PHASE EXIT_CODE=$code" >&2' ERR
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          test -n "${ANDROID_HOME:-}"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          PHASE=SDK
          export ANDROID_AVD_HOME="$RUNNER_TEMP/anthares-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          IMG='system-images;android-35;google_apis;x86_64'
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'emulator' "$IMG"
          PHASE=KVM_ACCEL
          emulator -accel-check
          echo no | avdmanager create avd --force --name anthares-github-api35 --package "$IMG" --device pixel_2 --path "$ANDROID_AVD_HOME/anthares-github-api35.avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          emulator -list-avds
          emulator -list-avds | grep -Fx anthares-github-api35
          PHASE=BOOT
          nohup emulator -avd anthares-github-api35 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > /tmp/anthares-github-emulator.log 2>&1 &
          adb start-server
          timeout 80 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          echo GITHUB_ANDROID_BOOT=PASS
          PHASE=VAULT
          curl -fL --retry 3 --connect-timeout 10 --max-time 180 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo '96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip' | sha256sum -c -
          mkdir -p kwai-vault
          unzip -q kwai-vault.zip -d kwai-vault
          PHASE=INSTALL
          bash kwai_vault_install.sh
          adb shell pm path com.kwai.video | grep -q '^package:'
          echo GITHUB_KWAI_INSTALL=PASS
          PHASE=CHOOSER
          timeout 240 env KWAI_ROUTE='${{ matrix.route }}' KWAI_NETWORK='${{ matrix.network }}' KWAI_SETTLE='${{ matrix.settle }}' python3 tools/kwai_semantic_login_route_probe.py | tee kwai-route.txt
          grep -Eq 'SEMANTIC_LOGIN_ROUTE=PASS' kwai-route.txt
          echo GITHUB_KWAI_CHOOSER=PASS
          PHASE=FORM
          timeout 120 python3 tools/kwai_android_login_entry.py email | tee kwai-method.txt
          grep -Eq 'KWAI_NATIVE_LOGIN_FORM_(VISIBLE|ALREADY_VISIBLE)' kwai-method.txt
          echo GITHUB_KWAI_FORM=PASS
          echo 'KWAI_AUTHENTICATED=NOT_TESTED KWAI_PUBLISHED=NOT_TESTED'
      - name: Privacy-safe UI triage on failed navigation
        if: failure()
        shell: bash
        run: |
          python3 tools/kwai_chooser_failure_triage.py
          echo 'KWAI_LOGIN_BLOCKED_NO_MANUAL_AUTH_ATTEMPT=1'
      - name: Safe diagnostics - no screenshots or credential XML
        if: always()
        shell: bash
        run: |
          adb devices -l || true
          if [ -f /tmp/anthares-github-emulator.log ]; then
            grep -E 'FATAL|ERROR|emulator:|qemu' /tmp/anthares-github-emulator.log | tail -35 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kwai-android-phase-logs-${{ matrix.route }}-${{ matrix.network }}
          path: |
            kwai-route.txt
            kwai-method.txt
          if-no-files-found: ignore
          retention-days: 3
