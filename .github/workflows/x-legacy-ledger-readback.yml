name: X legacy publication ledger readback for Neon cutover
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/x-legacy-ledger-readback.yml'
permissions:
  contents: read
  issues: read
concurrency:
  group: x-old-ledger-readonly-inventory
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Inspect X issue ledger without writes
        shell: pwsh
        run: |
          @'
          import hashlib,json,os,urllib.parse,urllib.request,re
          from tools.x_issue_publisher import fingerprint
          from tools.x_publication_safety import _issue_payload
          gh=os.getenv("GH_TOKEN","");token=os.getenv("ARA_SHARED","")
          if not gh or not token:raise SystemExit("X_READBACK_SECRET_MISSING")
          root="https://api.github.com/repos/UniversoAnthares/anthares-kwai-runner"
          search="https://api.github.com/search/issues?"+urllib.parse.urlencode(
              {"q":"repo:UniversoAnthares/anthares-kwai-runner in:title X-PUBLISH","per_page":"100"})
          def load(url,auth):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+auth,
                   "User-Agent":"anthares-x-ledger-readback"})
              with urllib.request.urlopen(req,timeout=32) as rsp:return json.load(rsp)
          issues=load(search,gh).get("items",[])
          if not isinstance(issues,list) or len(issues)>100:raise SystemExit("X_ISSUES_SNAPSHOT_TOO_LARGE")
          records=[]
          for item in issues:
              n=int(item["number"])
              if not item.get("title","").startswith("[X-PUBLISH]"):continue
              raw=_issue_payload(item.get("body") or "")
              if raw.get("platform")!="x" or raw.get("account")!="lucasyahn" or raw.get("test_fixture"):continue
              key=fingerprint(raw)
              ident=hashlib.sha256(("x:lucasyahn:"+key).encode()).hexdigest()
              url="https://http--anthares-ara-northflank--6f6pbqmvhpv6.code.run/x/post-status?idempotency_key="+urllib.parse.quote(key,safe="")
              legacy=load(url,token)
              if legacy.get("ok") is not True or legacy.get("status") not in ("NOT_FOUND","UNCERTAIN","CONFIRMED"):
                  raise SystemExit("X_LEGACY_LEDGER_INVALID_RESPONSE")
              comm=load(root+"/issues/"+str(n)+"/comments?per_page=100",gh)
              marks=" ".join(str(c.get("body") or "") for c in comm)
              started=any(tag in marks for tag in ("X_SUBMISSION_STARTED_V1",
                   "X_POST_SUBMISSION_STARTED_V1","X_SUBMISSION_UNCERTAIN_V1",
                   "X_LOCAL_SUBMISSION_STARTED_V1"))
              status=legacy["status"]
              if status=="NOT_FOUND" and started:status="UNCERTAIN"
              post_url=str(legacy.get("post_url") or "")
              if status=="CONFIRMED" and not re.fullmatch(r"https://x.com/lucasyahn/status/\d+",post_url):
                  raise SystemExit("X_CONFIRMED_WITHOUT_POST_URL")
              records.append({"issue":n,"ledger_key":ident,"status":status,
                              "post_url":post_url if status=="CONFIRMED" else None})
          print("X_LEGACY_INVENTORY_COUNT="+str(len(records)))
          print("X_LEGACY_INVENTORY_JSON="+json.dumps(records,separators=(",",":"),sort_keys=True))
          print("X_LEGACY_READBACK_COMPLETE=1")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'X_LEGACY_READBACK_FAILED' }
