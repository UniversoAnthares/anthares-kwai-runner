name: CORTES LinkedIn - automatic Buffer cloud publisher
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cortes-buffer-linkedin-cloud.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-linkedin-buffer-cloud-producer
  cancel-in-progress: false
jobs:
  publish-and-reconcile:
    # Excludes self-hosted machines and keeps a master switch for emergency pause.
    if: ${{ vars.CORTES_LINKEDIN_BUFFER_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Buffer key from Anthares Secrets without logging it
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            0ec34434-3b81-4cc6-93af-b4ea00d11733 > BUFFER_API_KEY
      - name: Publish one LinkedIn cut and reconcile scheduled publications
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
        run: |
          set -euo pipefail
          python -u tools/cortes_buffer_linkedin_cloud.py
