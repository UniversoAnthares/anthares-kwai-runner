name: CORTES LinkedIn - automatic Buffer cloud publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-buffer-linkedin-cloud.yml'
      - 'tools/cortes_buffer_linkedin_cloud.py'
      - 'tests/test_cortes_buffer_linkedin_cloud.py'
  schedule:
    - cron: '53 */3 * * *'
  workflow_dispatch:
    inputs:
      reconcile_only:
        description: 'Only reconcile previously scheduled posts; never create a new post'
        type: boolean
        required: false
        default: false
  # Independent wake-up when the upstream CORTES fanout completes.
  # GitHub scheduled events can be delayed or dropped under load.
  workflow_run:
    workflows: ["CORTES 3 independent networks - all shorts cloud fanout", "CORTES Pinterest - automatic Buffer cloud publisher"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-linkedin-buffer-cloud-producer
  cancel-in-progress: false
jobs:
  publish-and-reconcile:
    # Independently scheduled; never blocks any other network. Same-day drain,
    # hard provider quotas and shared Neon dedupe/fencing still apply.
    # Excludes self-hosted machines and keeps a master switch for emergency pause.
    if: ${{ vars.CORTES_LINKEDIN_BUFFER_PAUSED != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Buffer key from Anthares Secrets without logging it
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            0ec34434-3b81-4cc6-93af-b4ea00d11733 > BUFFER_API_KEY
      - name: Publish one LinkedIn cut and reconcile scheduled publications
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_RECONCILE_ONLY: ${{ inputs.reconcile_only && '1' || '0' }}
        run: |
          set -euo pipefail
          python -u tools/cortes_buffer_linkedin_cloud.py
