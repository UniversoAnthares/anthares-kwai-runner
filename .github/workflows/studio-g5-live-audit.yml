name: Anthares Studio G5 Live Readonly Audit
on:
  push:
    branches: [coord/studio-g4-g5-20261116]
    paths:
      - .github/workflows/studio-g5-live-audit.yml
      - tools/studio-g5-live-audit.py
permissions:
  contents: read
concurrency:
  group: anthares-studio-g5-live-readonly-audit-20261117
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate audit code syntax without SSH
        run: |
          python3 - <<'PY'
          import ast,pathlib,re
          s=pathlib.Path('tools/studio-g5-live-audit.py').read_text()
          ast.parse(s)
          m=re.search(r'REMOTE=r"""(.*?)"""',s,re.S)
          assert m
          compile(m.group(1),'g5_live_readonly.py','exec')
          print('G5_AUDIT_SYNTAX=PASS')
          PY
      - name: Audit live Studio / ACF / private verified backups READ ONLY
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python3 tools/studio-g5-live-audit.py
