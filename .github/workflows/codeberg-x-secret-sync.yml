name: Provision X Codeberg standby secrets without enabling publication
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeberg-x-secret-sync.yml'
permissions:
  contents: read
concurrency:
  group: x-codeberg-secret-provisioning
  cancel-in-progress: false
jobs:
  provision:
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 6
    env:
      CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      CODEBERG_GITHUB_PAT: ${{ secrets.CODEBERG_GITHUB_PAT }}
      PYTHONUTF8: '1'
    steps:
      - name: Replicate authorized encrypted X publishing secrets into Codeberg
        shell: pwsh
        run: |
          @'
          import base64, json, os, sys, urllib.parse, urllib.request, urllib.error
          src=urllib.parse.urlsplit(os.environ.get("CODEBERG_PUSH_URL",""))
          if src.scheme!="https" or src.hostname!="codeberg.org" or not src.username or not src.password:
              raise SystemExit("CODEBERG_SECRET_PROVISION_AUTH_UNAVAILABLE")
          shared=os.getenv("ARA_SHARED","")
          if not shared:raise SystemExit("ARA_SHARED_GITHUB_SOURCE_MISSING")
          auth=base64.b64encode((urllib.parse.unquote(src.username)+":"+
             urllib.parse.unquote(src.password)).encode()).decode()
          prefix="https://codeberg.org/api/v1/repos/UniversoAnthares/anthares-kwai-runner/actions/secrets/"
          h={"Authorization":"Basic "+auth,"Content-Type":"application/json","Accept":"application/json"}
          items={"ARA_SHARED":shared}
          pat=os.getenv("CODEBERG_GITHUB_PAT","")
          if pat:items["GH_TOKEN"]=pat
          for name,value in items.items():
              req=urllib.request.Request(prefix+name,headers=h,
                    data=json.dumps({"data":value}).encode(),method="PUT")
              try:
                  with urllib.request.urlopen(req,timeout=18) as res:
                      if res.status not in (200,201,204):raise RuntimeError("SECRET_WRITE_NOT_ACKNOWLEDGED")
              except urllib.error.HTTPError as e:
                  print("CODEBERG_X_SECRET_PROVISION_FAILED "+name+" HTTP_"+str(e.code))
                  sys.exit(2)
              print("CODEBERG_X_SECRET_CONFIGURED="+name)
          if not pat:
              print("CODEBERG_X_GH_TOKEN_PENDING=1; publication MUST remain disarmed")
          print("CODEBERG_X_ARMED_AUTOMATICALLY=0")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'CODEBERG_X_SECRET_PROVISION_FAILED' }
