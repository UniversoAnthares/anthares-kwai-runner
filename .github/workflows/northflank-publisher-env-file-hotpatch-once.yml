name: One-time Northflank publisher session-file hotpatch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-publisher-env-file-hotpatch-once.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Patch existing Northflank service only after checking auth and source SHA
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN,auth=process.env.ARA_SHARED;
          if(!token||token.length<20||!auth||auth.length<20)throw Error('AUTH_MISSING');
          const api=async(path)=>{const r=await fetch('https://api.northflank.com/v1'+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('NF_HTTP_'+r.status);return r.json();};
          const found=[];for(const p of (await api('/projects')).data?.projects||[])for(const s of (await api('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[])if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);
          if(found.length!==1)throw Error('SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0],ctx=new ApiClientInMemoryContextProvider();await ctx.addContext({name:'maint',token});
          const client=new ApiClient(ctx);
          const source=String.raw`
          import os,sys,hashlib,subprocess,signal,time,json
          from pathlib import Path
          p=Path('/app/render-tiktok-worker/service.py')
          old_blob='4ab1f2ceed97936f45835fc8abb855192af13bc8'
          new_blob='6d5b8f16b7d4900ec65a3f173532a50d452cf6fb'
          before=b'env["TIKTOK_STORAGE_STATE"]=STATE.read_text(encoding="utf-8")'
          after=b'env.pop("TIKTOK_STORAGE_STATE", None); env["TIKTOK_STORAGE_STATE_FILE"]=str(STATE)'
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()
          if not p.is_file():raise SystemExit('SERVICE_SOURCE_MISSING')
          previous=p.read_bytes()
          detected=blob(previous)
          print('SERVICE_EXPECTED_OLD_SHA='+str(detected==old_blob),flush=True)
          print('SERVICE_EXPECTED_NEW_SHA='+str(detected==new_blob),flush=True)
          if detected not in (old_blob,new_blob):raise SystemExit('UNEXPECTED_REMOTE_SERVICE_VERSION')
          if os.getenv('EXPECTED_TIKTOK_USERNAME','').strip().lstrip('@').lower()!='universo.anthares':raise SystemExit('EXPECTED_OWNER_CHANGED')
          state=Path(os.getenv('TIKTOK_STATE_PATH','/tmp/tiktok-storage-state.json'))
          verified=Path(os.getenv('TIKTOK_VERIFIED_PATH','/tmp/tiktok-identity-verified.json'))
          if not state.is_file() or not verified.is_file():raise SystemExit('AUTHENTICATED_STATE_NOT_READY_SAFE_STOP')
          raw=state.read_bytes()
          try:
           d=json.loads(raw)
           count=len(d.get('cookies') or []) if isinstance(d,dict) else 0
          except Exception:raise SystemExit('CURRENT_STATE_NOT_JSON')
          print('CURRENT_STATE_BYTES='+str(len(raw)),flush=True)
          print('CURRENT_STATE_COOKIE_COUNT='+str(count),flush=True)
          if count<20:raise SystemExit('PRESERVED_SESSION_TOO_FEW_COOKIES')
          if detected==old_blob:
           if previous.count(before)!=4:raise SystemExit('PUBLISH_ENV_MARKERS_CHANGED')
           patched=previous.replace(before,after)
           if blob(patched)!=new_blob:raise SystemExit('EXPECTED_PATCH_SHA_MISMATCH')
           compile(patched.decode('utf-8-sig'),str(p),'exec')
           snapshot=Path('/tmp/anthares-service-publish-env-before.py')
           if not snapshot.exists():snapshot.write_bytes(previous);os.chmod(snapshot,0o600)
           if snapshot.read_bytes()!=previous:raise SystemExit('RECOVERY_BACKUP_CONFLICT')
           tmp=p.with_suffix('.py.tmp')
           tmp.write_bytes(patched);os.chmod(tmp,0o644)
           os.replace(tmp,p)
           print('SERVICE_FILE_PATCHED=1',flush=True)
          else:print('SERVICE_PATCH_ALREADY_PRESENT=1',flush=True)
          if blob(p.read_bytes())!=new_blob:raise SystemExit('SERVICE_CHECK_FAILED')
          if detected==old_blob:
           lines=subprocess.check_output(['ps','-eo','pid,ppid,comm,args'],text=True).splitlines()
           records=[]
           for line in lines[1:]:
            x=line.strip().split(None,3)
            if len(x)!=4:continue
            pid,ppid,comm,cmd=x
            if pid.isdigit() and ppid.isdigit() and 'gunicorn' in comm.lower() and 'service_with_browser' in cmd:records.append((int(pid),int(ppid)))
           pids={pid for pid,ppid in records}
           masters=[pid for pid,ppid in records if ppid not in pids]
           if len(masters)!=1:raise SystemExit('GUNICORN_MASTER_NOT_UNIQUE')
           os.kill(masters[0],signal.SIGHUP)
           time.sleep(4)
           print('GUNICORN_RELOADED=1',flush=True)
          print('PUBLISHER_FILE_STATE_PATCH_ACTIVE=1',flush=True)
          `;
          const r=await client.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',source]});
          console.log('PATCH_EXIT='+String(r.commandResult?.exitCode));
          console.log('PATCH_RESULT='+String(r.stdOut||'').replace(/[\r\n]+/g,' | ').slice(0,1600));
          console.log('PATCH_ERROR_CLASS='+String(r.stdErr||'').replace(/[\r\n]+/g,' | ').slice(0,130));
          if(r.commandResult?.exitCode!==0)throw Error('PUBLISHER_PATCH_SAFE_STOP');
          const url='https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run/health';
          const h=await fetch(url,{headers:{Authorization:'Bearer '+auth},signal:AbortSignal.timeout(25000)});
          const d=await h.json().catch(()=>({}));
          console.log('SERVICE_HEALTH_HTTP='+h.status);
          console.log('SERVICE_IDENTITY_VERIFIED='+Boolean(d.identity_verified));
          console.log('SERVICE_READY='+Boolean(d.ready_for_tiktok));
          if(h.status!==200||!d.ok||!d.identity_verified)throw Error('POST_PATCH_HEALTH_UNVERIFIED');
          NODE
