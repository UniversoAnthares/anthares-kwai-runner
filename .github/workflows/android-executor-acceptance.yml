name: Android Executor Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - '.executor-validation-trigger'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated Kwai vault
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 10 --max-time 180 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip" | sha256sum -c -
          rm -rf kwai-vault
          mkdir kwai-vault
          unzip -q kwai-vault.zip -d kwai-vault
          test -s kwai-vault/MANIFEST.tsv
      - name: Check Kwai credentials
        env:
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
        run: |
          test -n "$KWAI_LOGIN"
          test -n "$KWAI_PASSWORD"
      - name: Boot disposable Android executor
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 300
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            set -euo pipefail
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            bash kwai_vault_install.sh
            adb shell pm path com.kwai.video | grep -q package:
            adb shell monkey -p com.kwai.video -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 8
            adb shell pidof com.kwai.video
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null || true
            adb pull /sdcard/ui.xml executor-ui.xml >/dev/null || true
            adb exec-out screencap -p > executor-screen.png
            echo ANDROID_EXECUTOR_ACCEPTED
            python3 kwai_android_autologin.py || rc=$?
            rc=${rc:-0}
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 6 ]; then
              echo "AUTOLOGIN_FAILED_RC=$rc"
              exit "$rc"
            fi
            python3 kwai_auth_probe.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-executor-acceptance-${{ github.run_id }}
          path: |
            kwai-vault-install-status.txt
            executor-ui.xml
            executor-screen.png
          if-no-files-found: warn
          retention-days: 1
