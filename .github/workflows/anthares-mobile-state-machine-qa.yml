name: Anthares Mobile State Machine QA
on:
  pull_request:
    paths:
      - 'anthares_mobile/**'
      - 'tools/kwai_login_ui_locator.py'
      - 'tests/test_anthares_mobile_ui_state.py'
      - 'tests/test_kwai_login_ui_locator_semantic.py'
      - '.github/workflows/anthares-mobile-state-machine-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate semantic Kwai UI state machine
        run: |
          python3 -m unittest discover -s tests -p 'test_anthares_mobile_ui_state.py' -v
          python3 -m unittest discover -s tests -p 'test_kwai_login_ui_locator_semantic.py' -v
