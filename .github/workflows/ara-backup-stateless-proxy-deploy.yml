name: ARA Backup Stateless Proxy Deploy
# One approved release per selected SHA; emergency rollback is independently dispatched.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character Git SHA approved for deployment'
        required: true
        type: string
      mode:
        description: 'Normal release or emergency recovery'
        required: true
        type: choice
        default: release
        options:
          - release
          - emergency
      incident_ref:
        description: 'Required incident reference for emergency recovery'
        required: false
        type: string
permissions:
  contents: read
  actions: read
# The stateful and stateless workflows target the SAME Cloudflare Worker.
concurrency:
  group: anthares-ara-backup-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Approve exact source and emergency intent
        id: gate
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'RELEASE_SHA_INVALID'; exit 1; }
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA" || { echo 'RELEASE_SHA_MISMATCH'; exit 1; }
          git rev-parse --verify refs/remotes/origin/main >/dev/null || { echo 'MAIN_REF_MISSING'; exit 1; }
          if [[ "$RELEASE_MODE" == release ]]; then
            test "$(git rev-parse refs/remotes/origin/main)" = "$APPROVED_SHA" || { echo 'RELEASE_NOT_CURRENT_MAIN'; exit 1; }
          elif [[ "$RELEASE_MODE" == emergency ]]; then
            test -n "$INCIDENT_REF" || { echo 'EMERGENCY_INCIDENT_REQUIRED'; exit 1; }
            git merge-base --is-ancestor "$APPROVED_SHA" refs/remotes/origin/main || { echo 'EMERGENCY_SHA_NOT_APPROVED_HISTORY'; exit 1; }
          else
            echo 'RELEASE_MODE_INVALID'; exit 1
          fi
          # Existing healthy release at the same SHA is a SKIP, not a second deploy.
          if [[ "$RELEASE_MODE" == release ]]; then
            prior="$(curl -fsS --retry 0 --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ara-backup-stateless-proxy-deploy.yml/runs?status=success&per_page=100")"
            already="$(printf '%s' "$prior" | python3 -c 'import json,sys,os; d=json.load(sys.stdin); print(int(any(x.get("head_sha")==os.environ["APPROVED_SHA"] and x.get("id")!=int(os.environ["GITHUB_RUN_ID"]) for x in d.get("workflow_runs",[]))))')"
            if [[ "$already" == 1 ]] &&
               curl -sS -D /tmp/ara-backup-release-headers -o /dev/null --max-time 15 \
                 https://anthares-ara-backup.anthares1.workers.dev/healthz &&
               grep -qi '^x-ara-transport: vercel-neon-stateless-proxy' /tmp/ara-backup-release-headers; then
              echo 'already_deployed=true' >> "$GITHUB_OUTPUT"
              echo 'ARA_RELEASE_SAME_SHA_HEALTHY=SKIP'
              exit 0
            fi
          fi
          echo 'already_deployed=false' >> "$GITHUB_OUTPUT"
          echo "ARA_RELEASE_SHA_APPROVED=$APPROVED_SHA"
      - name: Validate proxy source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-ara-backup/src/stateless-vercel-proxy.js
          grep -q 'anthares-ara-vercel-reserve.vercel.app' cloudflare-ara-backup/src/stateless-vercel-proxy.js
          ! grep -q 'durable_objects' cloudflare-ara-backup/wrangler-stateless-proxy.toml
      - name: Deploy quota-independent proxy
        if: ${{ steps.gate.outputs.already_deployed != 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          cd cloudflare-ara-backup
          npx --yes wrangler@4.43.0 deploy --config wrangler-stateless-proxy.toml
      - name: Verify public proxy ingress
        if: ${{ steps.gate.outputs.already_deployed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          code="$(curl -sS -D /tmp/h -o /tmp/b -w '%{http_code}' --max-time 20 https://anthares-ara-backup.anthares1.workers.dev/healthz || true)"
          echo "HTTP=$code"
          cat /tmp/b || true
          grep -qi '^x-ara-transport: vercel-neon-stateless-proxy' /tmp/h
          test "$code" = "200"
          echo 'ARA_BACKUP_STATELESS_PROXY_OK=1'
# cutover-trigger: 2026-10-15T19:49Z
