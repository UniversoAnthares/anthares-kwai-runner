name: Five Independent Safety Probes
on:
  push:
    branches: [main]
    paths: ['.five-safety-probes-trigger']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        probe: [first-renew, descendant-kill, invalid-config, exit-propagation, control-v16]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run independent probe
        shell: bash
        run: |
          set -euo pipefail
          p='${{ matrix.probe }}'
          if [ "$p" = control-v16 ]; then
            CONTROL='https://anthares-control.anthares1.workers.dev'
            health="$(curl -fsS "$CONTROL/health")"
            python3 - "$health" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); assert d["version"]=="2026-10-05-queue-fencing-v16"; assert d["pc_fallback"] is False
          PY
            sep='&'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] || sep='?'
            jwt="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=https%3A%2F%2Fanthares-control.anthares1.workers.dev" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
            code="$(curl -sS -o /tmp/q.json -w '%{http_code}' -X POST -H "Authorization: Bearer $jwt" "$CONTROL/queue-self-test")"
            echo "CONTROL_HTTP=$code BODY=$(cat /tmp/q.json)"
            test "$code" = 401 -o "$code" = 403
            echo PROBE_CONTROL_UNAUTHORIZED_WORKFLOW_REJECTED_OK
            exit 0
          fi
          tmp="$(mktemp -d)"; cp kwai_queue_heartbeat.sh "$tmp/"; cd "$tmp"
          cat > kwai_queue_state.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "$(date +%s) $*" >> renew.log
          if [ "${FAIL_AFTER_FIRST_RENEW:-0}" = 1 ]; then
            n="$(wc -l < renew.log)"
            [ "$n" -lt 2 ]
          else
            [ "${FORCE_RENEW_FAIL:-0}" != 1 ]
          fi
          SH
          chmod +x *.sh
          export KWAI_QUEUE_JOB_ID=probe KWAI_LEASE_GENERATION=9
          case "$p" in
            first-renew)
              export KWAI_LEASE_RENEW_INTERVAL_SECONDS=15 KWAI_LEASE_RENEW_TTL_SECONDS=60
              start="$(date +%s)"
              ./kwai_queue_heartbeat.sh sleep 2
              test -s renew.log
              first="$(awk 'NR==1{print $1}' renew.log)"
              test $((first-start)) -lt 5
              echo PROBE_FIRST_RENEW_OK
              ;;
            descendant-kill)
              export KWAI_LEASE_RENEW_INTERVAL_SECONDS=15 KWAI_LEASE_RENEW_TTL_SECONDS=60 FAIL_AFTER_FIRST_RENEW=1
              set +e
              ./kwai_queue_heartbeat.sh bash -c 'sleep 120 & echo $! > descendant.pid; wait' >out 2>&1
              rc=$?
              set -e
              test "$rc" = 49
              pid="$(cat descendant.pid)"
              ! kill -0 "$pid" 2>/dev/null
              echo PROBE_DESCENDANT_KILL_OK
              ;;
            invalid-config)
              set +e
              KWAI_LEASE_RENEW_INTERVAL_SECONDS=14 KWAI_LEASE_RENEW_TTL_SECONDS=60 ./kwai_queue_heartbeat.sh true >/tmp/a 2>&1; a=$?
              KWAI_LEASE_RENEW_INTERVAL_SECONDS=15 KWAI_LEASE_RENEW_TTL_SECONDS=15 ./kwai_queue_heartbeat.sh true >/tmp/b 2>&1; b=$?
              set -e
              test "$a" = 46; test "$b" = 47
              echo PROBE_INVALID_CONFIG_OK
              ;;
            exit-propagation)
              export KWAI_LEASE_RENEW_INTERVAL_SECONDS=15 KWAI_LEASE_RENEW_TTL_SECONDS=60
              set +e; ./kwai_queue_heartbeat.sh bash -c 'exit 23'; rc=$?; set -e
              test "$rc" = 23
              echo PROBE_EXIT_PROPAGATION_OK
              ;;
          esac
