name: CORTES universal strategic titles gate
on:
  push:
    branches: [main, feat/cortes-universal-strategic-metadata-20261022]
    paths:
      - 'anthares_publisher/editorial.py'
      - 'social_adapters/buffer_three_channels.py'
      - 'tools/cortes_threads_cloud_captions.mjs'
      - 'tools/cortes_threads_cloud_feed.mjs'
      - 'tools/cortes_threads_cloud_handoff.mjs'
      - 'infra/neon-cortes-threads-execution/index.mjs'
      - 'tests/threads_strategic_editorial.test.mjs'
      - 'tests/test_strategic_publication_metadata.py'
      - '.github/workflows/cortes-strategic-editorial-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all platform adapters
        run: |
          python -m py_compile anthares_publisher/editorial.py social_adapters/buffer_three_channels.py
          node --check tools/cortes_threads_cloud_captions.mjs
          node --check tools/cortes_threads_cloud_feed.mjs
          node --check tools/cortes_threads_cloud_handoff.mjs
          node --check infra/neon-cortes-threads-execution/index.mjs
      - name: Test strategic metadata enforcement on direct and Buffer adapters
        run: PYTHONPATH=. python tests/test_strategic_publication_metadata.py
      - name: Test Threads segment metadata and fail-closed behavior
        run: node --test tests/threads_strategic_editorial.test.mjs
