name: CORTES WordPress deploy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-wordpress-deploy-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_SSH_KEY: ${{ secrets.ANTHARES_QA_SSH_KEY }}
      QA_SSH_HOST: ${{ secrets.ANTHARES_QA_SSH_HOST }}
      QA_SSH_USER: ${{ secrets.ANTHARES_QA_SSH_USER }}
      QA_SSH_PORT: ${{ secrets.ANTHARES_QA_SSH_PORT }}
      EXPECTED_WP_COMMIT: 2761fda6c894fb4e0aa83baf1a5e4e1b98d85ca5
    steps:
      - name: Validate required SSH secrets
        shell: bash
        run: |
          set -eu
          [ -n "$QA_SSH_KEY" ] || { echo 'CORTES_DEPLOY_BLOCKED=missing_ssh_key'; exit 2; }
          [ -n "$QA_SSH_HOST" ] || { echo 'CORTES_DEPLOY_BLOCKED=missing_ssh_host'; exit 2; }
          [ -n "$QA_SSH_USER" ] || { echo 'CORTES_DEPLOY_BLOCKED=missing_ssh_user'; exit 2; }

      - name: Deploy and verify CORTES on anthares.us
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$QA_SSH_KEY" > ~/.ssh/anthares_qa
          chmod 600 ~/.ssh/anthares_qa
          port="${QA_SSH_PORT:-65002}"
          ssh-keyscan -p "$port" "$QA_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$port" -i ~/.ssh/anthares_qa -o IdentitiesOnly=yes "$QA_SSH_USER@$QA_SSH_HOST" \
            "EXPECTED_WP_COMMIT='$EXPECTED_WP_COMMIT' bash -se" <<'REMOTE'
          set -euo pipefail
          REPO="$HOME/anthares-wordpress-bootstrap"
          SITE="$HOME/domains/anthares.us/public_html"
          LIVE="$SITE/wp-content/plugins/anthares-clipper"
          PHP=/opt/alt/php85/usr/bin/php
          WP=/usr/local/bin/wp

          test -d "$REPO/.git"
          cd "$REPO"
          if [ -n "$(git status --porcelain)" ]; then
            echo 'CORTES_DEPLOY_BLOCKED=repo_dirty'
            git status --short
            exit 3
          fi
          git fetch origin main
          git checkout main >/dev/null 2>&1
          git merge --ff-only origin/main
          actual="$(git rev-parse HEAD)"
          echo "WORDPRESS_SOURCE_HEAD=$actual"
          [ "$actual" = "$EXPECTED_WP_COMMIT" ] || { echo "CORTES_DEPLOY_BLOCKED=unexpected_head"; exit 4; }

          SRC="$REPO/anthares-clipper"
          test -f "$SRC/anthares-clipper.php"
          test -f "$SRC/cortes-control.php"
          test -f "$SRC/cortes-migrations.php"
          find "$SRC" -type f -name '*.php' -print0 | xargs -0 -n1 "$PHP" -l >/tmp/cortes-live-php-lint.txt

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          staged="$SITE/wp-content/plugins/anthares-clipper.deploying-$stamp"
          backup="$SITE/wp-content/plugins/anthares-clipper.backup-$stamp"
          rm -rf "$staged"
          cp -a "$SRC" "$staged"
          if [ -d "$LIVE" ]; then mv "$LIVE" "$backup"; fi
          mv "$staged" "$LIVE"

          cd "$SITE"
          "$PHP" "$WP" plugin activate anthares-clipper --quiet || true
          "$PHP" "$WP" eval '
            if (function_exists("anthares_cortes_ensure_page")) { anthares_cortes_ensure_page(); }
            $page_id=(int)get_option("anthares_cortes_page_id",0);
            $page=$page_id?get_post($page_id):null;
            $net=function_exists("anthares_cortes_networks_get")?anthares_cortes_networks_get():[];
            $routes=rest_get_server()->get_routes();
            $out=[
              "plugin_version"=>defined("ANTHARES_CLIPPER_VERSION")?ANTHARES_CLIPPER_VERSION:"missing",
              "cortes_function"=>function_exists("anthares_cortes_render"),
              "page_id"=>$page_id,
              "page_title"=>$page?$page->post_title:null,
              "page_slug"=>$page?$page->post_name:null,
              "page_status"=>$page?$page->post_status:null,
              "schema"=>(int)get_option("anthares_cortes_schema_version",0),
              "networks"=>$net,
              "route_state"=>isset($routes["/anthares/v1/cortes/state"]),
              "route_network"=>isset($routes["/anthares/v1/cortes/network"]),
              "legacy_cutoff"=>defined("ANTHARES_CORTES_LEGACY_CUTOFF")?ANTHARES_CORTES_LEGACY_CUTOFF:null,
              "short_max"=>defined("ANTHARES_CORTES_SHORT_MAX")?ANTHARES_CORTES_SHORT_MAX:null
            ];
            echo wp_json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),"\n";
          '
          grep -q 'Version: 2.7.3' "$LIVE/anthares-clipper.php"
          sha256sum "$LIVE/cortes-control.php" "$LIVE/cortes-migrations.php"
          echo CORTES_LIVE_DEPLOY=PROVEN
          REMOTE
