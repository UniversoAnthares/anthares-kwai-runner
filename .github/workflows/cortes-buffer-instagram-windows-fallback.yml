name: CORTES Instagram - Windows redundancy (Neon OIDC)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-buffer-instagram-windows-fallback.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '4,19,34,49 * * * *'
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: cortes-instagram-buffer-windows-fallback
  cancel-in-progress: false
jobs:
  publish-with-fenced-neon:
    runs-on: [cortes-instagram-fallback-20261021]
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Buffer key from Bitwarden without logging credentials
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            0ec34434-3b81-4cc6-93af-b4ea00d11733 > BUFFER_API_KEY
      - name: Reconcile and process eligible Instagram queue items
        shell: powershell
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          CORTES_INSTAGRAM_ONETIME_SELFHOSTED: '1'
          CORTES_IG_IMMEDIATE_UNTIL_UTC: '2026-10-22T09:00:00Z'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u tools/cortes_buffer_instagram_cloud.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
