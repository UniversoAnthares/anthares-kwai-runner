name: Kwai QCOW internal snapshot prune probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kwai-qcow-snapshot-prune-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Restore proven slim AVD v4
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/kwai-speed.avd
            ~/.android/avd/kwai-speed.ini
          key: kwai-speed-avd-direct-slim-android35-v4
      - name: Restore Android image
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: kwai-speed-android35-google-apis-x86_64-v1
      - name: Restore emulator
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/lib/android/sdk/emulator
          key: kwai-speed-emulator-ubuntu24-v1
      - name: Delete only internal default_boot QCOW snapshots and validate
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          Q="$SDK/emulator/qemu-img"
          ADB="$SDK/platform-tools/adb"
          ROOT="$HOME/.android/avd/kwai-speed.avd"
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          BEFORE=$(du -sb "$ROOT" | awk '{print $1}')
          echo "QCOW_PRUNE_RAW_BEFORE=$BEFORE"
          for f in userdata-qemu.img.qcow2 cache.img.qcow2 encryptionkey.img.qcow2; do
            echo "=== BEFORE $f ==="
            "$Q" snapshot -l "$ROOT/$f" || true
            if "$Q" snapshot -l "$ROOT/$f" | grep -q 'default_boot'; then
              "$Q" snapshot -d default_boot "$ROOT/$f"
            fi
            echo "=== AFTER $f ==="
            "$Q" snapshot -l "$ROOT/$f" || true
          done
          AFTER=$(du -sb "$ROOT" | awk '{print $1}')
          echo "QCOW_PRUNE_RAW_AFTER=$AFTER"
          echo "QCOW_PRUNE_RAW_DELTA=$((BEFORE-AFTER))"
          sudo chmod 666 /dev/kvm
          t=$(date +%s)
          nohup "$SDK/emulator/emulator" -avd kwai-speed -snapshot kwai-ready -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 >/tmp/qcow-prune.log 2>&1 &
          timeout 60 "$ADB" wait-for-device
          timeout 60 bash -c 'until [ "$("$1" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 1; done' _ "$ADB"
          BOOT=$(($(date +%s)-t))
          echo "QCOW_PRUNE_BOOT_SECONDS=$BOOT"
          if grep -q "Successfully loaded snapshot 'kwai-ready'" /tmp/qcow-prune.log && ! grep -Eq "Failed to load snapshot 'kwai-ready'|performing a cold boot" /tmp/qcow-prune.log; then
            echo "QCOW_PRUNE_ACTUAL_LOAD=true"
          else
            echo "QCOW_PRUNE_ACTUAL_LOAD=false"
          fi
          grep -Ei "Loading snapshot 'kwai-ready'|Successfully loaded snapshot 'kwai-ready'|Failed to load snapshot|cold boot|ERROR" /tmp/qcow-prune.log | tail -30 || true
          "$ADB" emu kill >/dev/null 2>&1 || true
          timeout 20 bash -c 'while pgrep -f "[q]emu-system.*kwai-speed" >/dev/null; do sleep 1; done' || true
          sync
          echo "=== POST-BOOT QCOW SIZES ==="
          for f in userdata-qemu.img.qcow2 cache.img.qcow2 encryptionkey.img.qcow2; do stat -c '%s %n' "$ROOT/$f"; done
          tar --zstd -cf /tmp/qcow-pruned-avd.tar.zst -C "$HOME/.android" avd/kwai-speed.avd avd/kwai-speed.ini
          echo "QCOW_PRUNE_COMPRESSED_BYTES=$(stat -c%s /tmp/qcow-pruned-avd.tar.zst)"
