name: TikTok Real Publish
on:
  push:
    paths:
      - '.tiktok-session-restore-probe'
  workflow_dispatch:
    inputs:
      video_url:
        required: true
        type: string
      video_title:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  session-restore-probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Wait for exact Render revision
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            REV=$(curl -fsS https://anthares-tiktok-render-rootless.onrender.com/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('revision',''))" || true)
            echo "render_revision=${REV:0:12}"
            [ "$REV" = "f9ed83d7acc26bc0ce95dbac7074ca258840fdd6" ] && exit 0
            sleep 10
          done
          echo RENDER_REVISION_NOT_READY
          exit 2
      - name: Restore central session and validate exact account
        run: |
          set -euo pipefail
          RENDER_TOKEN=$(python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          u=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+('&' if '?' in os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] else '?')+urllib.parse.urlencode({'audience':'anthares-render-worker'})
          with urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}),timeout=20) as r: print(json.load(r)['value'])
          PY
          )
          CONTROL_TOKEN=$(python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          aud='https://anthares-control.anthares1.workers.dev'
          u=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+('&' if '?' in os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] else '?')+urllib.parse.urlencode({'audience':aud})
          with urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}),timeout=20) as r: print(json.load(r)['value'])
          PY
          )
          echo "::add-mask::$RENDER_TOKEN"
          echo "::add-mask::$CONTROL_TOKEN"
          curl -fsS https://anthares-tiktok-render-rootless.onrender.com/session-status \
            -H "Authorization: Bearer $RENDER_TOKEN" \
            -H "X-Anthares-Control-OIDC: $CONTROL_TOKEN" > /tmp/status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          safe={k:d.get(k) for k in ('ok','bootstrapped','identity_verified','ready_for_tiktok','central_restored')}
          print('SESSION_RESTORE_SAFE='+json.dumps(safe,sort_keys=True))
          if not d.get('bootstrapped') or not d.get('central_restored'): raise SystemExit('SESSION_RESTORE_NOT_PROVEN')
          PY
          code=$(curl -sS -o /tmp/test.json -w '%{http_code}' -X POST https://anthares-tiktok-render-rootless.onrender.com/session-test \
            -H "Authorization: Bearer $RENDER_TOKEN" \
            -H "X-Anthares-Control-OIDC: $CONTROL_TOKEN")
          python3 - "$code" <<'PY'
          import json,sys
          d=json.load(open('/tmp/test.json'))
          safe={'http':int(sys.argv[1]),'ok':d.get('ok'),'code':d.get('code'),'identity_verified':d.get('identity_verified'),'central_persisted':d.get('central_persisted'),'error':d.get('error')}
          print('IDENTITY_TEST_SAFE='+json.dumps(safe,sort_keys=True))
          if int(sys.argv[1])!=200 or not d.get('ok') or not d.get('identity_verified'): raise SystemExit('TIKTOK_IDENTITY_NOT_PROVEN')
          print('TIKTOK_SESSION_AND_IDENTITY_PROVEN')
          PY

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Publish through remote Render executor
        shell: bash
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_TITLE: ${{ inputs.video_title }}
        run: |
          set -euo pipefail
          BASE="https://anthares-tiktok-worker.onrender.com"
          OIDC="$(python - <<'PY'
          import json,os,urllib.parse,urllib.request
          u=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+('&' if '?' in os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] else '?')+urllib.parse.urlencode({'audience':'anthares-render-worker'})
          req=urllib.request.Request(u,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=20) as r: print(json.load(r)['value'])
          PY
          )"
          curl -fL --retry 3 --max-time 180 -o /tmp/publish.mp4 "$VIDEO_URL"
          python - <<'PY'
          import json,os
          json.dump({'segment_id':'public-runner-'+os.environ['GITHUB_RUN_ID'],'title':os.environ['VIDEO_TITLE']},open('/tmp/plan.json','w'))
          PY
          curl --fail-with-body -sS --max-time 420 -X POST "$BASE/publish"             -H "Authorization: Bearer $OIDC"             -F "media=@/tmp/publish.mp4;type=video/mp4"             -F "plan=</tmp/plan.json" > /tmp/result.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/result.json'))
          if not x.get('ok'): raise SystemExit('remote TikTok publication not confirmed')
          print('TIKTOK_REMOTE_PUBLICATION_CONFIRMED')
          PY
