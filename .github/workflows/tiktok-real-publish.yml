name: TikTok one-shot real clip
on:
  push:
    branches: [main]
    paths: ['.tiktok-render-lean-v14-trigger']
permissions:
  contents: read
  id-token: write
concurrency:
  group: tiktok-one-shot-real-9CIk-I_3VhM-8-98
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CONTROL: https://anthares-control.anthares1.workers.dev
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      EXPECTED_TIKTOK_USERNAME: universo.anthares
      SOURCE_ID: 9CIk-I_3VhM
      SOURCE_START: '8'
      SOURCE_END: '98'
      SOURCE_URL: https://www.youtube.com/watch?v=9CIk-I_3VhM
      JOB_ID: tiktok-9CIk-I_3VhM-8-98-real-v1
      TIKTOK_STORAGE_STATE_FILE: /tmp/tiktok-storage-state.json
      TIKTOK_YOUTUBE_PLAN: /tmp/tiktok-plan.json
      TIKTOK_PUBLISH_EVIDENCE: /tmp/tiktok-publish-evidence.json
      TIKTOK_PUBLISHED_KEYS: /tmp/tiktok-published-keys.json
      ATD_ARTIFACT_DIR: /tmp/tiktok-artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Install browser and acquisition stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --disable-pip-version-check -q playwright cryptography requests yt-dlp bgutil-ytdlp-pot-provider faster-whisper
          python3 -m playwright install chromium
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Resolve canonical session, prove identity, dedupe and baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARA_SHARED:-}" || { echo ARA_SHARED_MISSING; exit 12; }
          python3 direct-tiktok-publisher/tiktok_session_authority.py
          test -s "$TIKTOK_STORAGE_STATE_FILE"
          sep='&'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] || sep='?'
          aud='https%3A%2F%2Fanthares-control.anthares1.workers.dev'
          CT="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${aud}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$CT"
          printf '%s' "$CT" >/tmp/control-token
          curl -fsS --max-time 30 -H "Authorization: Bearer $CT" "$CONTROL/queue-health" -o /tmp/queue.json
          python3 - <<'PY'
          import json,os
          st=json.load(open(os.environ['TIKTOK_STORAGE_STATE_FILE'])); cookies=st.get('cookies') or []
          assert cookies, 'CANONICAL_TIKTOK_SESSION_UNAVAILABLE'
          q=json.load(open('/tmp/queue.json')); raw=q.get('jobs') or []
          jobs=list(raw.values()) if isinstance(raw,dict) else raw if isinstance(raw,list) else []
          overlaps=[]
          for j in [x for x in jobs if isinstance(x,dict) and x.get('platform')=='tiktok']:
              try: a=float(j.get('source_start')); b=float(j.get('source_end'))
              except Exception: continue
              if str(j.get('source_id') or '')==os.environ['SOURCE_ID'] and max(float(os.environ['SOURCE_START']),a)<min(float(os.environ['SOURCE_END']),b): overlaps.append(j.get('id'))
          assert not overlaps, 'CENTRAL_TIMELINE_DEDUPE_BLOCK:'+','.join(map(str,overlaps))
          print('CANONICAL_SESSION=PROVEN authority=runtime cookies='+str(len(cookies)))
          print('CENTRAL_INTERVAL_DEDUPE=PROVEN')
          PY
          python3 direct-tiktok-publisher/strong_identity_gate.py

      - name: Acquire exact validated real clip from temporary transfer branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tiktok-media
          MEDIA=/tmp/tiktok-media/final.mp4
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            -o "$MEDIA" \
            'https://raw.githubusercontent.com/UniversoAnthares/anthares-kwai-runner/media-transfer-tiktok-9CIk-I_3VhM-8-98/transfer-media/tiktok_9CIk-I_3VhM_8_98.mp4'
          ACTUAL_SHA="$(sha256sum "$MEDIA" | awk '{print toupper($1)}')"
          EXPECTED_SHA='5A43C90508464C016E3F26F4CF17C04CA9BFA3E9EC9AFB7BD160E7A740B395E9'
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(stat -c%s "$MEDIA")" -eq 11398993
          export MEDIA ACTUAL_SHA
          python3 - <<'PY'
          import json,os,subprocess
          media=os.environ['MEDIA']
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',media],text=True).strip())
          assert 70 <= duration <= 80, duration
          plan={'segment_id':os.environ['SOURCE_ID']+':'+os.environ['SOURCE_START']+':'+os.environ['SOURCE_END'],'source_id':os.environ['SOURCE_ID'],'source_start':float(os.environ['SOURCE_START']),'source_end':float(os.environ['SOURCE_END']),'source_url':os.environ['SOURCE_URL'],'source_title':'A Poetica de Aristoteles - Parte 2 (LIVE)','title':'A Poetica de Aristoteles — trecho','summary':'Trecho sobre a Poetica de Aristoteles.','media_path':media,'media_sha256':os.environ['ACTUAL_SHA'].lower(),'duration_seconds':round(duration,3),'prepared_source':'validated_transfer_branch'}
          json.dump(plan,open(os.environ['TIKTOK_YOUTUBE_PLAN'],'w'),ensure_ascii=False,indent=2)
          print('REAL_MEDIA_PREPARED=1')
          print('REAL_MEDIA_DURATION='+str(round(duration,3)))
          print('REAL_MEDIA_SHA256='+os.environ['ACTUAL_SHA'])
          PY

      - name: Recheck dedupe, reserve exact central job and lease it
        shell: bash
        run: |
          set -euo pipefail
          sep='&'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] || sep='?'
          aud='https%3A%2F%2Fanthares-control.anthares1.workers.dev'
          CT="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${aud}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$CT"; printf '%s' "$CT" >/tmp/control-token
          curl -fsS -H "Authorization: Bearer $CT" "$CONTROL/queue-health" -o /tmp/queue2.json
          python3 - <<'PY'
          import json,os
          q=json.load(open('/tmp/queue2.json')); raw=q.get('jobs') or []; jobs=list(raw.values()) if isinstance(raw,dict) else raw if isinstance(raw,list) else []
          for j in [x for x in jobs if isinstance(x,dict) and x.get('platform')=='tiktok']:
              try:a=float(j.get('source_start'));b=float(j.get('source_end'))
              except Exception:continue
              if str(j.get('source_id') or '')==os.environ['SOURCE_ID'] and max(float(os.environ['SOURCE_START']),a)<min(float(os.environ['SOURCE_END']),b): raise RuntimeError('RACE_DEDUPE_BLOCK:'+str(j.get('id')))
          print('SECOND_DEDUPE_GATE=PROVEN')
          PY
          python3 - <<'PY' >/tmp/enqueue.json
          import json,os
          print(json.dumps({'id':os.environ['JOB_ID'],'platform':'tiktok','executor':'github','dedupe_key':os.environ['EXPECTED_TIKTOK_USERNAME']+'::'+os.environ['SOURCE_ID']+':'+os.environ['SOURCE_START']+':'+os.environ['SOURCE_END'],'source_id':os.environ['SOURCE_ID'],'source_start':float(os.environ['SOURCE_START']),'source_end':float(os.environ['SOURCE_END']),'media_sha256':json.load(open(os.environ['TIKTOK_YOUTUBE_PLAN']))['media_sha256']}))
          PY
          curl -fsS -X POST "$CONTROL/job/enqueue" -H "Authorization: Bearer $CT" -H 'Content-Type: application/json' --data-binary @/tmp/enqueue.json -o /tmp/enqueued.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/enqueued.json')); assert d.get('ok') is True,d; assert not d.get('deduplicated'),d; assert (d.get('job') or {}).get('id')==os.environ['JOB_ID'],d
          print('CENTRAL_JOB_ENQUEUED='+os.environ['JOB_ID'])
          PY
          curl -fsS "$CONTROL/github-queue-get/lease?platform=tiktok&ttl_seconds=3600" -H "Authorization: Bearer $CT" -o /tmp/lease.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/lease.json')); j=d.get('job') or {}; assert j.get('id')==os.environ['JOB_ID'],d; g=int(j.get('lease_generation') or 0); assert g>0,d
          open('/tmp/lease-generation','w').write(str(g)); print('CENTRAL_JOB_LEASED generation='+str(g))
          PY

      - name: Final identity gate immediately before publication boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 direct-tiktok-publisher/strong_identity_gate.py

      - name: Cross publication boundary once and reconcile
        shell: bash
        run: |
          set -euo pipefail
          CT="$(cat /tmp/control-token)"; GEN="$(cat /tmp/lease-generation)"
          python3 - "$JOB_ID" "$GEN" <<'PY' >/tmp/started.json
          import json,sys
          print(json.dumps({'id':sys.argv[1],'executor':'github','lease_generation':int(sys.argv[2])}))
          PY
          curl -fsS -X POST "$CONTROL/github-queue/started" -H "Authorization: Bearer $CT" -H 'Content-Type: application/json' --data-binary @/tmp/started.json -o /tmp/started-response.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/started-response.json')); assert d.get('ok') is True and (d.get('job') or {}).get('publication_started') is True,d
          print('PUBLICATION_STARTED_FENCE=RECORDED')
          PY
          set +e
          (cd direct-tiktok-publisher && python3 tiktok_cloud_publish.py)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            python3 - "$JOB_ID" "$GEN" <<'PY' >/tmp/fail.json
          import json,sys
          print(json.dumps({'id':sys.argv[1],'executor':'github','lease_generation':int(sys.argv[2]),'error_class':'publisher_failed_after_start','error_message':'one-shot publisher failed after publication_started; reconciliation required','published_possible':True}))
          PY
            curl -fsS -X POST "$CONTROL/github-queue/fail" -H "Authorization: Bearer $CT" -H 'Content-Type: application/json' --data-binary @/tmp/fail.json -o /tmp/fail-response.json || true
            echo 'PUBLISH_RESULT=UNCERTAIN_RECONCILIATION_REQUIRED'
            exit "$RC"
          fi
          test -s "$TIKTOK_PUBLISH_EVIDENCE"
          REMOTE_ID="$(python3 -c 'import json,os;d=json.load(open(os.environ["TIKTOK_PUBLISH_EVIDENCE"])); assert d.get("confirmed") is True and d.get("remote_id"); print(d["remote_id"])')"
          REMOTE_URL="$(python3 -c 'import json,os;d=json.load(open(os.environ["TIKTOK_PUBLISH_EVIDENCE"])); print(d.get("remote_url") or "")')"
          python3 - "$JOB_ID" "$GEN" "$REMOTE_ID" "$REMOTE_URL" <<'PY' >/tmp/complete.json
          import json,sys
          print(json.dumps({'id':sys.argv[1],'executor':'github','lease_generation':int(sys.argv[2]),'confirmed':True,'remote_id':sys.argv[3],'confirmation_evidence':sys.argv[4] or ('profile:'+sys.argv[3])}))
          PY
          curl -fsS -X POST "$CONTROL/github-queue/complete" -H "Authorization: Bearer $CT" -H 'Content-Type: application/json' --data-binary @/tmp/complete.json -o /tmp/complete-response.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/complete-response.json')); j=d.get('job') or {}; assert d.get('ok') is True and j.get('status')=='published' and j.get('confirmed') is True and j.get('remote_id'),d
          print('CENTRAL_PUBLICATION_CONFIRMED=1')
          print('REMOTE_ID='+str(j.get('remote_id')))
          PY
          echo "REMOTE_URL=$REMOTE_URL"

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-one-shot-real-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/tiktok-plan.json
            /tmp/tiktok-publish-evidence.json
            /tmp/tiktok-artifacts/**
