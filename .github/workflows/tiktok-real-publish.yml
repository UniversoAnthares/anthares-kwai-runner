name: TikTok Real Publish
on:
  push:
    paths:
      - '.tiktok-render-v13-reconcile'
permissions:
  contents: read
  id-token: write
jobs:
  reconcile-v13:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Independently reconcile uncertain v13
        shell: bash
        run: |
          set -euo pipefail
          CONTROL="https://anthares-control.anthares1.workers.dev"
          RENDER="https://anthares-tiktok-render-rootless.onrender.com"
          CT="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fanthares-control.anthares1.workers.dev" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          RT="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=anthares-render-worker" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$CT"; echo "::add-mask::$RT"
          curl --fail-with-body -sS "$RENDER/session-status" -H "Authorization: Bearer $RT" -H "X-Anthares-Control-OIDC: $CT" > /tmp/status.json
          curl --fail-with-body -sS "$RENDER/profile-inventory" -H "Authorization: Bearer $RT" > /tmp/inventory.json
          python3 - <<'PY' > /tmp/reconcile-meta
          import json
          d=json.load(open('/tmp/inventory.json'))
          items=d.get('items') or []
          hits=[x for x in items if 'teste técnico de publicação' in str(x.get('text','')).casefold() or 'teste tecnico de publicacao' in str(x.get('text','')).casefold()]
          print('INVENTORY_COUNT='+str(len(items)))
          if hits:
              h=hits[0]; print('FOUND=1'); print('REMOTE_ID='+str(h.get('id') or '')); print('URL='+str(h.get('url') or ''))
          else:
              print('FOUND=0'); print('REMOTE_ID='); print('URL=')
          PY
          cat /tmp/reconcile-meta
          FOUND="$(grep '^FOUND=' /tmp/reconcile-meta | cut -d= -f2)"
          RID="$(grep '^REMOTE_ID=' /tmp/reconcile-meta | cut -d= -f2-)"
          if [ "$FOUND" = "1" ] && [ -n "$RID" ]; then
            curl --fail-with-body -sS -X POST "$CONTROL/job/reconcile" -H "Authorization: Bearer $CT" -H 'Content-Type: application/json' --data "{\"executor\":\"github\",\"id\":\"tiktok-canary-20261006-synthetic-v13\",\"confirmed\":true,\"remote_id\":\"$RID\",\"confirmation_evidence\":\"independent_profile_inventory:$RID\"}" > /tmp/reconciled.json
            cat /tmp/reconciled.json
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/reconciled.json')); j=d.get('job') or {}
          if not d.get('ok') or j.get('status')!='published' or not j.get('confirmed'): raise SystemExit('RECONCILE_CONFIRM_FAILED')
          print('TIKTOK_REAL_REMOTE_POST=PROVEN remote_id='+str(j.get('remote_id')))
          PY
          else
            curl --fail-with-body -sS -X POST "$CONTROL/job/reconcile" -H "Authorization: Bearer $CT" -H 'Content-Type: application/json' --data '{"executor":"github","id":"tiktok-canary-20261006-synthetic-v13","confirmed_absent":true}' > /tmp/reconciled.json
            cat /tmp/reconciled.json
            echo TIKTOK_V13_CONFIRMED_ABSENT
          fi
