name: Anthares Reserva Session Migration

on:
  workflow_dispatch:
  push:
    branches: [feature/anthares-reserva-ci]
    paths:
      - '.github/workflows/anthares-reserva-session-migration.yml'

permissions:
  contents: read

concurrency:
  group: anthares-reserva-session-migration
  cancel-in-progress: true

jobs:
  migrate-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch encrypted full-state capsule from temporary Render bridge
        shell: bash
        run: |
          set -euo pipefail
          URL='https://anthares-browser-qa-render-v2.onrender.com/migration/kwai-capsule'
          for i in $(seq 1 36); do
            code=$(curl -sS --max-time 30 -o /tmp/reserva-capsule.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = 200 ]; then break; fi
            echo "MIGRATION_BRIDGE_WAIT=$code"
            test "$i" -lt 36
            sleep 10
          done
          python - <<'PY'
          import json
          d=json.load(open('/tmp/reserva-capsule.json'))
          assert d.get('version')==2 and d.get('alg')=='RSA-OAEP-256+A256GCM', d.get('version')
          assert all(isinstance(d.get(k),str) and d[k] for k in ('wrapped_key','nonce','ciphertext','aad'))
          assert 0 < int(d.get('cookie_count',0)) <= 128
          evidence=d.get('source_evidence') or {}
          safe={k:evidence.get(k) for k in ('host_ok','path_ok','login_gate','owner_edit','logout_visible','body_present')}
          print('ENCRYPTED_FULL_STATE_VALID=1')
          print('COOKIE_COUNT='+str(d.get('cookie_count',0)))
          print('LOCAL_STORAGE_COUNT='+str(d.get('local_storage_count',0)))
          print('RENDER_SOURCE_AUTH_EVIDENCE='+json.dumps(safe,separators=(',',':')))
          raw=open('/tmp/reserva-capsule.json','rb').read()
          size=3000
          parts=[raw[i:i+size] for i in range(0,len(raw),size)]
          assert 1 <= len(parts) <= 8
          for i,p in enumerate(parts): open(f'/tmp/reserva-capsule-{i}','wb').write(p)
          open('/tmp/reserva-capsule-count','w').write(str(len(parts)))
          print('CAPSULE_CHUNKS='+str(len(parts)))
          PY
      - name: Store encrypted capsule chunks only inside Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cd anthares-reserva-browser
          npm install --no-audit --no-fund >/dev/null
          count=$(cat /tmp/reserva-capsule-count)
          for i in $(seq 0 $((count-1))); do
            cat "/tmp/reserva-capsule-$i" | npx wrangler secret put "RESERVA_KWAI_CAPSULE_$i" >/dev/null
          done
          for i in $(seq "$count" 7); do
            printf '' | npx wrangler secret put "RESERVA_KWAI_CAPSULE_$i" >/dev/null || true
          done
          rm -f /tmp/reserva-capsule.json /tmp/reserva-capsule-* /tmp/reserva-capsule-count
          npx wrangler deploy >/dev/null
          echo CAPSULE_STORED=1
      - name: Prove restored Kwai session without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://anthares-reserva-browser.anthares1.workers.dev'
          sleep 35
          code=000
          for i in $(seq 1 6); do
            code=$(curl -sS --max-time 70 -o /tmp/auth-proof.json -w '%{http_code}' "$BASE/_auth_selftest" || true)
            [ "$code" = 200 ] && break
            echo "AUTH_PROBE_RETRY=$code"
            sleep 20
          done
          python - "$code" <<'PY'
          import json,sys
          d=json.load(open('/tmp/auth-proof.json'))
          safe={k:d.get(k) for k in ('ok','capsule_decrypted','cookie_count','local_storage_count','identity_verified','upload_surface_verified','session_state','evidence','studio','error') if k in d}
          print('AUTH_HTTP='+sys.argv[1])
          print('AUTH_PROOF='+json.dumps(safe,separators=(',',':')))
          assert d.get('ok') is True
          assert d.get('capsule_decrypted') is True
          if d.get('identity_verified') is True and d.get('upload_surface_verified') is True:
              print('RESERVA_AUTH_CONTINUITY=PASS')
          else:
              print('RESERVA_AUTH_CONTINUITY=NOT_PROVEN')
          PY
          rm -f /tmp/auth-proof.json
