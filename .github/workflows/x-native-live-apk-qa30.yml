name: X native live Android app QA30

on:
  pull_request:
    paths:
      - "scripts/x_install_apkm_bundle.sh"
      - ".github/workflows/x-native-live-apk-qa30.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x-app:
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        include:
          - {variant: 1, api: 34}
          - {variant: 2, api: 35}
          - {variant: 3, api: 34}
          - {variant: 4, api: 35}
          - {variant: 5, api: 34}
          - {variant: 6, api: 35}
          - {variant: 7, api: 34}
          - {variant: 8, api: 35}
          - {variant: 9, api: 34}
          - {variant: 10, api: 35}
          - {variant: 11, api: 34}
          - {variant: 12, api: 35}
          - {variant: 13, api: 34}
          - {variant: 14, api: 35}
          - {variant: 15, api: 34}
          - {variant: 16, api: 35}
          - {variant: 17, api: 34}
          - {variant: 18, api: 35}
          - {variant: 19, api: 34}
          - {variant: 20, api: 35}
          - {variant: 21, api: 34}
          - {variant: 22, api: 35}
          - {variant: 23, api: 34}
          - {variant: 24, api: 35}
          - {variant: 25, api: 34}
          - {variant: 26, api: 35}
          - {variant: 27, api: 34}
          - {variant: 28, api: 35}
          - {variant: 29, api: 34}
          - {variant: 30, api: 35}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      EVIDENCE_DIR: x-apk-evidence
      MATRIX_VARIANT: ${{ matrix.variant }}

    steps:
      - uses: actions/checkout@v4

      - name: Download latest stable X Android bundle
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: x-corp
          repo: twitter
          bundle: true
          filename: x-current.apkm

      - name: Boot Android, verify signature, install and launch X
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: arm64-v8a
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none
          script: |
            set -Eeuo pipefail
            mkdir -p "$EVIDENCE_DIR"
            chmod +x scripts/x_install_apkm_bundle.sh
            scripts/x_install_apkm_bundle.sh x-current.apkm | tee "$EVIDENCE_DIR/install.txt"
            adb shell monkey -p com.twitter.android 1 | tee "$EVIDENCE_DIR/launch.txt"
            sleep $((3 + MATRIX_VARIANT % 3))
            adb shell uiautomator dump /sdcard/x.xml >/dev/null 2>&1 || true
            adb pull /sdcard/x.xml "$EVIDENCE_DIR/ui.xml" >/dev/null 2>&1 || true
            adb exec-out screencap -p > "$EVIDENCE_DIR/x-launch.png" || true
            adb shell dumpsys package com.twitter.android > "$EVIDENCE_DIR/package.txt"
            adb shell dumpsys activity activities > "$EVIDENCE_DIR/activity.txt"
            grep -q 'com.twitter.android' "$EVIDENCE_DIR/activity.txt"
            echo "X_APP_QA=PASS variant=$MATRIX_VARIANT api=${{ matrix.api }}" | tee "$EVIDENCE_DIR/result.txt"

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-native-live-apk-${{ matrix.variant }}-api${{ matrix.api }}
          path: x-apk-evidence/
          if-no-files-found: ignore
          retention-days: 2
