name: Publish ARA V4 C8 recovery binary

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact approved SHA for recovery binary'
        required: true
        type: string
      mode:
        description: 'Approved release or incident-scoped recovery'
        required: true
        type: choice
        default: release
        options: [release, emergency]
      incident_ref:
        description: 'Required when restoring an older approved binary'
        required: false
        type: string

permissions:
  contents: write
concurrency:
  group: anthares-ara-v4-binary-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize exact binary source and incident rollback
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA" || exit 1
          main_sha="$(curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$RELEASE_MODE" == release ]]; then
            test "$APPROVED_SHA" = "$main_sha" || exit 1
          elif [[ "$RELEASE_MODE" == emergency ]]; then
            test -n "$INCIDENT_REF" || exit 1
            git merge-base --is-ancestor "$APPROVED_SHA" "$main_sha" || exit 1
          else
            exit 1
          fi
          echo "ARA_BINARY_RELEASE_APPROVED=$APPROVED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: anthares-remote-agent/go.mod
      - name: Guard current control invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('anthares-remote-agent/windows')
          phase4 = (root / 'phase4-migrate-task.ps1').read_text(encoding='utf-8')
          installer = (root / 'install-system-v8.ps1').read_text(encoding='utf-8')
          deploy = (root / 'deploy-current-system.ps1').read_text(encoding='utf-8')
          supervisor = (root / 'run-agent-system-supervisor.ps1').read_text(encoding='utf-8')
          http_supervisor = (root / 'run-agent-supervisor.ps1').read_text(encoding='utf-8')
          standard_supervisor = (root / 'run-agent-standard.ps1').read_text(encoding='utf-8')
          watchdog = (root / 'recovery-watchdog.ps1').read_text(encoding='utf-8')
          loop = (root / 'recovery-watchdog-loop.ps1').read_text(encoding='utf-8')
          dual = (root / 'watchdog-dual-supervisor.ps1').read_text(encoding='utf-8')
          bootstrap = Path('infra/anthares_remote_bootstrap.py').read_text(encoding='utf-8')
          legacy_workflow = Path('.github/workflows/anthares-remote-agent-install-selfhosted.yml').read_text(encoding='utf-8')
          forbidden = r'D:\AntharsWork\AntharesRemoteAgent\run-agent-system-supervisor.ps1'
          assert forbidden not in phase4, 'Phase 4 task must never execute supervisor from D:'
          assert r"$root='C:\ProgramData\AntharesRemoteAgent'" in supervisor, 'canonical supervisor root drifted from C:\ProgramData'
          assert "'anthares-remote-agent-v4-c8.exe'" in supervisor, 'canonical supervisor is not pinned to the C8 binary'
          assert "'anthares-remote-agent-v4-c8.exe'" in installer, 'installer is not pinned to the C8 binary'
          assert "'anthares-remote-agent-v4-c8.exe'" in deploy, 'deploy-current is not pinned to the C8 binary'
          assert "'anthares-remote-agent-v4-c8.exe'" in watchdog, 'watchdog is not pinned to the C8 binary'
          assert 'single-process-dual-transport' in supervisor, 'canonical SYSTEM supervisor lost dual-transport mode'
          assert "recovery_transport='gitlab+github-private-issue-queues'" in supervisor, 'private queues are no longer the recovery transport'
          assert "https://anthares-remote-primary.vercel.app" in supervisor, 'Vercel+Neon primary control is no longer wired into canonical V4'
          assert ("$env:ANTHARES_CONTROL_URL=$httpControl" in supervisor or "$env:ANTHARES_CONTROL_URL=$choice.origin" in supervisor), 'canonical V4 has no authenticated HTTP controller selector'
          assert 'single_executor=$true' in supervisor, 'canonical supervisor lost single-executor invariant'
          assert 'existing SYSTEM private queue credential is missing' in installer, 'installer no longer fails closed when SYSTEM credential is absent'
          assert 'queue_credential_validated=$true' in installer, 'installer no longer records credential validation'
          assert 'queue_end_to_end_proof=$true' in installer, 'installer no longer requires a real queue command proof'
          assert "'load-issue-queue-auth.ps1'" in loop and '.lastgood' in loop, 'watchdog loop no longer self-heals queue loader'
          assert 'waiting-for-private-queue-credential' in watchdog, 'watchdog lost explicit credential-wait state'
          assert 'interactive_agent_count' in watchdog, 'watchdog lost single-executor enforcement'
          for name, text in [('HTTP supervisor', http_supervisor), ('standard HTTP supervisor', standard_supervisor)]:
              assert 'allow-http-compat.flag' in text, f'{name} lost explicit break-glass requirement'
              assert 'break-glass-required' in text, f'{name} no longer fails closed by default'
          assert 'Ensure-Supervisor' not in dual, 'retired dual watchdog can still spawn legacy supervisors'
          assert 'return jsonify(**_RETIREMENT), 410' in bootstrap, 'legacy public bootstrap mutation surface is active again'
          assert 'runs-on: self-hosted' not in legacy_workflow, 'retired legacy installer can still execute on the PC'
          assert 'exit 1' in legacy_workflow and 'legacy installer retired' in legacy_workflow.lower(), 'legacy installer is no longer fail-closed'
          print('ARA_CURRENT_CONTROL_INVARIANTS=OK')
          PY
      - name: Test
        working-directory: anthares-remote-agent
        run: go test ./... -count=1
      - name: Build Windows V4 C8
        working-directory: anthares-remote-agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/anthares-remote-agent-v4-c8.exe ./cmd/agent
          sha256sum dist/anthares-remote-agent-v4-c8.exe | tee dist/anthares-remote-agent-v4-c8.exe.sha256
      - name: Publish stable recovery release once per verified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
        run: |
          set -euo pipefail
          notes="approved_sha=$APPROVED_SHA mode=$RELEASE_MODE incident=$INCIDENT_REF"
          if gh release view ara-v4-latest >/dev/null 2>&1; then
            previous="$(gh release view ara-v4-latest --json body --jq '.body')"
            assets="$(gh release view ara-v4-latest --json assets --jq '.assets[].name')"
            if [[ "$previous" == *"approved_sha=$APPROVED_SHA"* ]] &&
               grep -qx 'anthares-remote-agent-v4-c8.exe' <<< "$assets" &&
               grep -qx 'anthares-remote-agent-v4-c8.exe.sha256' <<< "$assets"; then
              echo 'ARA_RECOVERY_BINARY_SAME_SHA=SKIP'
              exit 0
            fi
          else
            gh release create ara-v4-latest --target "$APPROVED_SHA" --title 'ARA V4 C8 latest recovery binary' --notes "$notes"
          fi
          gh release upload ara-v4-latest \
            anthares-remote-agent/dist/anthares-remote-agent-v4-c8.exe \
            anthares-remote-agent/dist/anthares-remote-agent-v4-c8.exe.sha256 \
            --clobber
          gh release edit ara-v4-latest --notes "$notes"
          echo "ARA_RECOVERY_BINARY_PUBLISHED_SHA=$APPROVED_SHA"
