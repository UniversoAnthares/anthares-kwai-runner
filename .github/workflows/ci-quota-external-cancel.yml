name: Anthares external CI quota cancel-first
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-quota-external-cancel.yml
      - anthares-remote-agent/windows/ci-quota-cancel-standby.ps1
      - tools/ci_quota_harness_watcher.py
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
  actions: write
concurrency:
  group: anthares-external-quota-cancel
  cancel-in-progress: false
jobs:
  cancel-confirmed-owned-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Production controller OIDC and Neon read-only acceptance
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          node - <<'NODE'
          async function main() {
            const base='https://anthares-ci-quota-controller.vercel.app/api';
            const health=await fetch(base+'/health',{signal:AbortSignal.timeout(12000)});
            const status=await health.json();
            if(health.status!==200||status.ok!==true||
               status.ledger!=='READY'||status.mode!=='ENABLED')
              throw Error('NEON_LEDGER_NOT_READY');
            console.log('CONTROLLER_NEON_LIMITED_ROLE=VERIFIED');
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience','anthares-ci-quota-controller');
            const identity=await fetch(url,{headers:{
              Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},
              signal:AbortSignal.timeout(12000)});
            if(!identity.ok)throw Error('OIDC_ISSUER_UNAVAILABLE');
            const {value}=await identity.json();
            if(!value)throw Error('OIDC_MISSING');
            const headers={Authorization:'Bearer '+value,'Content-Type':'application/json'};
            // Invalid event fails after valid OIDC, before any Neon mutation.
            const valid=await fetch(base+'/provider-cancel',{method:'POST',headers,
              body:JSON.stringify({phase:'health'}),
              signal:AbortSignal.timeout(12000)});
            const validBody=await valid.json();
            if(valid.status!==400||validBody.code!=='INVALID_EVENT')
              throw Error('PROVIDER_OIDC_SCOPE_UNVERIFIED_'+valid.status);
            console.log('CONTROLLER_PROVIDER_OIDC=VERIFIED');
            // A different workflow must be denied before the successor CAS.
            const foreign=await fetch(base+'/harness-fallback-verify',{
              method:'POST',headers,body:'{}',signal:AbortSignal.timeout(12000)});
            const foreignBody=await foreign.json();
            if(foreign.status!==403||foreignBody.code!=='WRONG_EXECUTOR')
              throw Error('HARNESS_WORKFLOW_FENCING_UNVERIFIED_'+foreign.status);
            console.log('HARNESS_WRONG_WORKFLOW_FENCE=VERIFIED');
          }
          main().catch(e=>{console.error('CONTROLLER_ACCEPTANCE='+e.message);
            process.exitCode=1});
          NODE
      - name: Harness API authenticated read-only identity probe
        continue-on-error: true
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_AUTH_PROBE_ONLY: 'true'
        shell: bash
        run: |
          python3 -m tools.ci_quota_harness_watcher
      - name: Harness cancel-first by structured quota (explicitly gated)
        if: ${{ vars.HARNESS_QUOTA_WATCH_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_QUOTA_WATCH_ENABLED: 'true'
          HARNESS_QUOTA_FALLBACK_ENABLED: ${{ vars.HARNESS_QUOTA_FALLBACK_ENABLED == 'true' }}
        shell: bash
        run: |
          python3 -m tools.ci_quota_harness_watcher
      - name: Retrieve AppVeyor API token securely from Bitwarden when configured
        if: ${{ vars.ANTHARES_SECRETS_APPVEYOR_TOKEN_ID != '' }}
        id: appveyor-bws
        uses: bitwarden/sm-action@f1de238fc00c738c56140796018be9084c2b5d21
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            ${{ vars.ANTHARES_SECRETS_APPVEYOR_TOKEN_ID }} > ANTHARES_APPVEYOR_TOKEN_FROM_BW
      - name: Retrieve Bitrise API token securely from Bitwarden when configured
        if: ${{ vars.ANTHARES_SECRETS_BITRISE_TOKEN_ID != '' }}
        id: bitrise-bws
        uses: bitwarden/sm-action@f1de238fc00c738c56140796018be9084c2b5d21
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            ${{ vars.ANTHARES_SECRETS_BITRISE_TOKEN_ID }} > ANTHARES_BITRISE_TOKEN_FROM_BW
      - name: Verify AppVeyor API credential against exact owned project (read-only)
        env:
          AV_KEY: ${{ env.ANTHARES_APPVEYOR_TOKEN_FROM_BW || secrets.APPVEYOR_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          token=os.getenv("AV_KEY","")
          if not token:
              print("APPVEYOR_AUTH_PROBE=MISSING_SECRET")
              sys.exit(0)
          urls=[
              ("ACCOUNT_V1","https://ci.appveyor.com/api/projects/UniversoAnthares/anthares-kwai-runner"),
              ("USER_V2","https://ci.appveyor.com/api/account/UniversoAnthares/projects/UniversoAnthares/anthares-kwai-runner")]
          for scope,url in urls:
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,
                  "Accept":"application/json","User-Agent":"Anthares-AppVeyor-Credential-Probe"})
              try:
                  with urllib.request.urlopen(req,timeout=12) as resp:
                      doc=json.load(resp)
                  project=doc.get("project",{})
                  if project.get("repositoryName")=="UniversoAnthares/anthares-kwai-runner" and project.get("slug")=="anthares-kwai-runner":
                      print("APPVEYOR_AUTH_PROBE=VERIFIED_SCOPE_"+scope)
                      sys.exit(0)
                  print("APPVEYOR_AUTH_PROBE=OWNERSHIP_MISMATCH")
                  sys.exit(1)
              except urllib.error.HTTPError as exc:
                  print("APPVEYOR_AUTH_PROBE_"+scope+"_HTTP="+str(exc.code))
                  if exc.code in (401,403,404):
                      continue
                  sys.exit(1)
              except (urllib.error.URLError,ValueError,OSError,KeyError):
                  print("APPVEYOR_AUTH_PROBE="+scope+"_REQUEST_ERROR")
                  sys.exit(1)
          print("APPVEYOR_AUTH_PROBE=ALL_SCOPES_REJECTED")
          sys.exit(1)
          PY
      - name: Stage RSA-encrypted AppVeyor credential for authenticated Anthares Remote standby
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          AV_KEY: ${{ env.ANTHARES_APPVEYOR_TOKEN_FROM_BW || secrets.APPVEYOR_API_TOKEN }}
        shell: bash
        run: |
          node - <<'NODE'
          const {createPublicKey,publicEncrypt,constants}=require("node:crypto");
          const key=process.env.AV_KEY;
          if(!key) {console.log("ARA_TOKEN_TRANSFER=NOT_CONFIGURED");process.exit(0)}
          const base="https://anthares-ci-quota-controller.vercel.app/api/credential-bridge";
          async function main(){
            const pubResp=await fetch(base,{signal:AbortSignal.timeout(12000)});
            if(!pubResp.ok)throw Error("PUBLIC_KEY_UNAVAILABLE");
            const pub=await pubResp.json();
            if(pub.code!=="RSA_PUBLIC_KEY"||pub.jwk?.kty!=="RSA")throw Error("INVALID_PUBLIC_KEY");
            const sealed=publicEncrypt({key:createPublicKey({key:pub.jwk,format:"jwk"}),
              padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:"sha1"},
              Buffer.from(key,"utf8")).toString("base64");
            if(Buffer.from(sealed,"base64").length!==384)throw Error("INVALID_RSA_ENVELOPE");
            const tokenUrl=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            tokenUrl.searchParams.set("audience","anthares-ci-quota-controller");
            const oidcResponse=await fetch(tokenUrl,{
              headers:{Authorization:"Bearer "+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},
              signal:AbortSignal.timeout(12000)});
            if(!oidcResponse.ok)throw Error("GITHUB_OIDC_UNAVAILABLE");
            const {value}=await oidcResponse.json();
            if(!value)throw Error("GITHUB_OIDC_MISSING");
            const result=await fetch(base,{method:"POST",headers:{
                Authorization:"Bearer "+value,"Content-Type":"application/json"},
                body:JSON.stringify({phase:"stage",provider:"appveyor",sealed}),
                signal:AbortSignal.timeout(15000)});
            if(result.status!==202)throw Error("STAGE_RESPONSE_"+result.status);
            const receipt=await result.json();
            if(receipt.code!=="SEALED_READY")throw Error("STAGE_RECEIPT_MISMATCH");
            console.log("ARA_TOKEN_TRANSFER=SEALED_READY");
          }
          main().catch(e=>{console.error("ARA_TOKEN_TRANSFER="+e.message);process.exitCode=1});
          NODE
      - name: Verify Bitrise API token and exact owned app (read-only)
        env:
          BITRISE_KEY: ${{ env.ANTHARES_BITRISE_TOKEN_FROM_BW || secrets.BITRISE_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request,urllib.error
          key=os.getenv("BITRISE_KEY","").strip()
          if not key:
              # Bitrise is optional; a missing credential is NOT quota failure.
              # Do not block independent Harness/AppVeyor safety observers.
              print("BITRISE_AUTH_PROBE=NOT_CONFIGURED")
              sys.exit(0)
          url="https://api.bitrise.io/v0.1/apps/ef06f940-ffc7-4e37-b935-93ad06d8faeb"
          req=urllib.request.Request(url,headers={"Authorization":key,
                "Accept":"application/json","User-Agent":"Anthares-Bitrise-Readiness/1"})
          try:
              with urllib.request.urlopen(req,timeout=15) as r:
                  doc=json.load(r)
              app=doc.get("data") or {}
              repo=str(app.get("repo_url") or "")
              owned=repo in ("https://github.com/UniversoAnthares/anthares-kwai-runner",
                  "https://github.com/UniversoAnthares/anthares-kwai-runner.git",
                  "git@github.com:UniversoAnthares/anthares-kwai-runner.git")
              if app.get("slug")=="ef06f940-ffc7-4e37-b935-93ad06d8faeb" and owned:
                  print("BITRISE_AUTH_PROBE=VERIFIED_PROJECT_AND_REPO")
              else:
                  print("BITRISE_AUTH_PROBE=PROJECT_OR_REPOSITORY_MISMATCH")
                  print("BITRISE_PROJECT_SLUG_MATCH="+str(app.get("slug")=="ef06f940-ffc7-4e37-b935-93ad06d8faeb"))
                  print("BITRISE_REPO_OWNER_MATCH="+str(app.get("repo_owner")=="UniversoAnthares"))
                  print("BITRISE_REPO_SLUG_MATCH="+str(app.get("repo_slug")=="anthares-kwai-runner"))
                  sys.exit(1)
          except urllib.error.HTTPError as e:
              print("BITRISE_AUTH_PROBE_HTTP="+str(e.code));sys.exit(1)
          except (urllib.error.URLError,OSError,ValueError,TypeError):
              print("BITRISE_AUTH_PROBE=SOURCE_UNAVAILABLE");sys.exit(1)
          PY
      - name: Stage RSA-encrypted Bitrise credential for authenticated Anthares Remote standby
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          BITRISE_KEY: ${{ env.ANTHARES_BITRISE_TOKEN_FROM_BW || secrets.BITRISE_API_TOKEN }}
        shell: bash
        run: |
          node - <<'NODE'
          const {createPublicKey,publicEncrypt,constants}=require("node:crypto");
          const key=(process.env.BITRISE_KEY||"").trim();
          if(!key) {console.log("ARA_BITRISE_TOKEN_TRANSFER=NOT_CONFIGURED");process.exit(0)}
          const base="https://anthares-ci-quota-controller.vercel.app/api/credential-bridge";
          async function main(){
            const pubResp=await fetch(base,{signal:AbortSignal.timeout(12000)});
            if(!pubResp.ok)throw Error("PUBLIC_KEY_UNAVAILABLE");
            const pub=await pubResp.json();
            if(pub.code!=="RSA_PUBLIC_KEY"||pub.jwk?.kty!=="RSA")throw Error("INVALID_PUBLIC_KEY");
            const sealed=publicEncrypt({key:createPublicKey({key:pub.jwk,format:"jwk"}),
              padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:"sha1"},
              Buffer.from(key,"utf8")).toString("base64");
            if(Buffer.from(sealed,"base64").length!==384)throw Error("INVALID_RSA_ENVELOPE");
            const tokenUrl=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            tokenUrl.searchParams.set("audience","anthares-ci-quota-controller");
            const oidcResponse=await fetch(tokenUrl,{
              headers:{Authorization:"Bearer "+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},
              signal:AbortSignal.timeout(12000)});
            if(!oidcResponse.ok)throw Error("GITHUB_OIDC_UNAVAILABLE");
            const {value}=await oidcResponse.json();
            if(!value)throw Error("GITHUB_OIDC_MISSING");
            const result=await fetch(base,{method:"POST",headers:{
                Authorization:"Bearer "+value,"Content-Type":"application/json"},
                body:JSON.stringify({phase:"stage",provider:"bitrise",sealed}),
                signal:AbortSignal.timeout(15000)});
            if(result.status!==202){
              const error=await result.json().catch(()=>({}));
              const known=new Set(["INVALID_PROVIDER","INVALID_SEALED_CREDENTIAL",
                "SEALED_LEDGER_UNAVAILABLE","WORKFLOW_NOT_AUTHORIZED"]);
              throw Error("STAGE_RESPONSE_"+result.status+"_"+
                (known.has(error?.code)?error.code:"UNCLASSIFIED"));
            }
            const receipt=await result.json();
            if(receipt.code!=="SEALED_READY")throw Error("STAGE_RECEIPT_MISMATCH");
            console.log("ARA_BITRISE_TOKEN_TRANSFER=SEALED_READY");
          }
          main().catch(e=>{console.error("ARA_BITRISE_TOKEN_TRANSFER="+e.message);process.exitCode=1});
          NODE
      - name: Inspect Bitrise actual hosted build history without dispatch
        env:
          BITRISE_TOKEN: ${{ env.ANTHARES_BITRISE_TOKEN_FROM_BW || secrets.BITRISE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.getenv("BITRISE_TOKEN","").strip()
          if not token:
              print("BITRISE_HISTORY=NOT_CONFIGURED")
          else:
              url="https://api.bitrise.io/v0.1/apps/ef06f940-ffc7-4e37-b935-93ad06d8faeb/builds?limit=8"
              try:
                  req=urllib.request.Request(url,headers={"Authorization":token,"Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=15) as res:
                      builds=(json.load(res).get("data") or [])
                  print("BITRISE_HISTORY_COUNT="+str(len(builds)))
                  for i,b in enumerate(builds):
                      print("BITRISE_HISTORY_"+str(i)+"_STATUS="+str(b.get("status")))
                      print("BITRISE_HISTORY_"+str(i)+"_WORKFLOW="+str(b.get("triggered_workflow"))[:48])
                      print("BITRISE_HISTORY_"+str(i)+"_DATE="+str(b.get("triggered_at"))[:40])
                      print("BITRISE_HISTORY_"+str(i)+"_SLUG="+str(b.get("slug"))[:64])
              except urllib.error.HTTPError as e:
                  print("BITRISE_HISTORY_HTTP="+str(e.code))
              except (ValueError,urllib.error.URLError):
                  print("BITRISE_HISTORY=SOURCE_UNAVAILABLE")
          PY
      - name: Inspect Bitrise currently registered workflows read-only
        env:
          BITRISE_TOKEN: ${{ env.ANTHARES_BITRISE_TOKEN_FROM_BW || secrets.BITRISE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          key=os.getenv("BITRISE_TOKEN","").strip()
          if key:
              url="https://api.bitrise.io/v0.1/apps/ef06f940-ffc7-4e37-b935-93ad06d8faeb/build-workflows"
              try:
                  req=urllib.request.Request(url,headers={"Authorization":key,"Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=15) as r: obj=json.load(r)
                  data=obj.get("data") or []
                  if isinstance(data,dict): names=list(data.keys())
                  elif isinstance(data,list):
                      names=[x if isinstance(x,str) else str(x.get("workflow_id") or x.get("id") or x.get("name") or "UNKNOWN") for x in data if isinstance(x,(str,dict))]
                  else:names=[]
                  print("BITRISE_REGISTERED_WORKFLOWS="+",".join(sorted(str(x)[:45] for x in names))[:500])
                  print("BITRISE_SMOKE_WORKFLOW_PRESENT="+str("anthares_ci_smoke" in names))
              except urllib.error.HTTPError as e:
                  print("BITRISE_WORKFLOWS_HTTP="+str(e.code))
              except (urllib.error.URLError,ValueError):
                  print("BITRISE_WORKFLOWS=UNAVAILABLE")
          PY
      - name: Detect provider-structured quota and cancel owned execution only
        env:
          APPVEYOR_ACCOUNT: ${{ vars.APPVEYOR_ACCOUNT || 'UniversoAnthares' }}
          APPVEYOR_PROJECT: ${{ vars.APPVEYOR_PROJECT || 'anthares-kwai-runner' }}
          APPVEYOR_API_TOKEN: ${{ env.ANTHARES_APPVEYOR_TOKEN_FROM_BW || secrets.APPVEYOR_API_TOKEN }}
          BITRISE_APP_SLUG: ${{ vars.BITRISE_APP_SLUG || 'ef06f940-ffc7-4e37-b935-93ad06d8faeb' }}
          BITRISE_API_TOKEN: ${{ env.ANTHARES_BITRISE_TOKEN_FROM_BW || secrets.BITRISE_API_TOKEN }}
        run: |
          python3 tools/ci_quota_external_watcher.py
