name: CORTES TikTok P0 immediate cloud recovery
on:
  issues:
    types: [opened, reopened, labeled]
  workflow_run:
    workflows:
      - CORTES TikTok @lucasrosalem4 cloud publisher
      - CORTES TikTok hosted canonical Neon publisher
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      account:
        description: Account to reconcile through the existing fenced publisher
        type: choice
        options: [lucas4, universo, both]
        default: both
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: cortes-tiktok-qa-cloud-${{ github.event.issue.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate incident and awaken only cloud Neon-fenced publishers
        uses: actions/github-script@v7
        env:
          QA_REQUESTED_ACCOUNT: ${{ inputs.account || '' }}
          QA_CODEBERG_PRIMARY: ${{ vars.TIKTOK_CODEBERG_PRIMARY }}
          QA_FORGEJO_PRIMARY: ${{ vars.TIKTOK_FORGEJO_PRIMARY }}
        with:
          script: |
            const {owner,repo}=context.repo;
            const now=Date.now();
            let issue=null;
            let targets=[];
            if(context.eventName==='issues') {
              issue=context.payload.issue;
              if(!issue || issue.state!=='open' || issue.pull_request ||
                 !/^\[QA[ -]P0\]\[tiktok\]/i.test(issue.title||'') ||
                 !(issue.labels||[]).some(x=>(typeof x==='string'?x:x.name)==='QA-P0')) {
                core.notice('TIKTOK_QA_P0_SKIP_UNTRUSTED_ISSUE');
                return;
              }
              const body=String(issue.body||'');
              if(/lucasrosalem4|lucas4/i.test(body)) targets=['lucas4'];
              else if(/universo[.]anthares/i.test(body)) targets=['universo'];
              else targets=['universo','lucas4'];
            } else if(context.eventName==='workflow_run') {
              const r=context.payload.workflow_run;
              if(!r || r.conclusion!=='failure' ||
                 r.head_repository?.full_name!==owner+'/'+repo || r.head_branch!=='main') {
                core.notice('TIKTOK_QA_P0_SKIP_UNTRUSTED_RUN');
                return;
              }
              if(r.name==='CORTES TikTok @lucasrosalem4 cloud publisher') targets=['lucas4'];
              else if(r.name==='CORTES TikTok hosted canonical Neon publisher') targets=['universo'];
              else return;
            } else if(context.eventName==='schedule') {
              // GITHUB_TOKEN-created incidents do not always emit a recursive issues event.
              // Time-limited polling repairs that event-delivery gap.
              const {data:all}=await github.rest.issues.listForRepo({
                owner,repo,state:'open',labels:'QA-P0',sort:'updated',
                direction:'desc',per_page:50
              });
              const recent=all.filter(x=>!x.pull_request &&
                /^\[QA[ -]P0\]\[tiktok\]/i.test(x.title||'') &&
                now-Date.parse(x.updated_at)<10*60*1000);
              if(recent.length===0){core.notice('TIKTOK_QA_P0_NO_RECENT_INCIDENT');return;}
              const accounts=new Set();
              for(const candidate of recent) {
                const body=String(candidate.body||'');
                if(/lucasrosalem4|lucas4/i.test(body))accounts.add('lucas4');
                else if(/universo[.]anthares/i.test(body))accounts.add('universo');
                else {accounts.add('lucas4');accounts.add('universo');}
              }
              targets=[...accounts];
            } else {
              const choice=String(process.env.QA_REQUESTED_ACCOUNT||'both');
              if(!['lucas4','universo','both'].includes(choice)) throw Error('ACCOUNT_NOT_ALLOWLISTED');
              targets=choice==='both'?['universo','lucas4']:[choice];
            }
            const codeberg=process.env.QA_CODEBERG_PRIMARY==='true';
            const forgejo=process.env.QA_FORGEJO_PRIMARY==='true';
            // Suspended Codeberg cannot dispatch, and Forgejo publishers lack approved
            // two-account identity/ledger homologation. Preserve independent fencing.
            if (codeberg || forgejo) {
              core.warning('TIKTOK_QA_P0_RECOVERY_NOT_DISPATCHED: primary provider requires independent reconciliation');
              return;
            }
            let accepted=0, suppressed=0;
            for(const target of targets) {
              const workflow=codeberg?'cortes-tiktok-codeberg-fenced-canary.yml':
                (target==='lucas4'?'cortes-tiktok-lucasrosalem4-cloud-publisher.yml':
                                      'cortes-tiktok-publisher.yml');
              const {data:prior}=await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id:workflow,per_page:25
              });
              const blockers=prior.workflow_runs.filter(x=>{
                if(x.head_branch!=='main')return false;
                const age=now-Date.parse(x.created_at);
                if(age<0||age>12*60*1000)return false;
                if(['queued','in_progress','pending','waiting','requested'].includes(x.status))return true;
                return age<2*60*1000 && x.conclusion==='success';
              });
              if(blockers.length) {
                core.notice('TIKTOK_QA_P0_BACKPRESSURE account='+target+' count='+blockers.length);
                suppressed++;
                continue;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner,repo,workflow_id:workflow,ref:'main',
                ...(codeberg?{inputs:{account:target}}:{})
              });
              accepted++;
              core.notice('TIKTOK_QA_P0_FENCED_RECOVERY_DISPATCH_ACK account='+target+
                          ' workflow='+workflow);
            }
            if(issue) {
              await github.rest.issues.createComment({
                owner,repo,issue_number:issue.number,
                body:'[QA-P0-TIKTOK-CLOUD] Controller executed: '+'https://github.com/'+owner+'/'+repo+
                  '/actions/runs/'+context.runId+'. Fenced recovery dispatches accepted='+
                  accepted+', rate-limited='+suppressed+
                  '. Success requires TikTok remote ID and Neon confirmation. '+
                  'Started/uncertain/closed_unverified receipts are never reopened or reuploaded.'
              });
            }
            core.summary.addRaw('CORTES_TIKTOK_QA_CLOUD_DISPATCHES='+accepted+
              ' suppressed='+suppressed+' primary='+(codeberg?'Codeberg':'GitHub'),true);
            await core.summary.write();
            if(accepted===0 && suppressed===0)core.warning('TIKTOK_QA_P0_NO_ACTION');
