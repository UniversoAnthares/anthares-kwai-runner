name: Anthares OCI A1 Always Free capacity watch

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  # Trigger a read-only first run when this activation workflow is merged.
  push:
    branches: [main]
    paths:
      - .github/workflows/oci-a1-android-cloud-watch.yml

permissions:
  contents: read

concurrency:
  group: anthares-oci-a1-free-single-allocation
  cancel-in-progress: false

jobs:
  capacity-watch:
    # Owner explicitly approved the read-only monitor on 2026-11-13.
    # No variable-driven job skip; disabling requires workflow change.
    # This can never allocate a machine: OCI_A1_AUTO_PROVISION is forced 0.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OCI_A1_WATCH_AUTH_JSON: ${{ secrets.OCI_A1_WATCH_AUTH_JSON }}
      # Force read-only operation until a separate, reviewed approval.
      OCI_A1_AUTO_PROVISION: '0'
      OCI_A1_LAUNCH_GUARD: 'DISABLED_FOR_MONITORING'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Assert canonical hosted runtime and cost guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'UniversoAnthares/anthares-kwai-runner'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$OCI_A1_AUTO_PROVISION" = '0'
          test "$OCI_A1_LAUNCH_GUARD" = 'DISABLED_FOR_MONITORING'
          test -f tools/oci_a1_capacity_watch.py
      - name: Install pinned Oracle SDK
        run: python -m pip install --disable-pip-version-check 'oci==2.187.1'
      - name: Run fail-closed regression tests
        run: python -m unittest discover -s tests -p 'test_oci_a1_capacity_watch.py' -v
      - name: Read OCI A1 capacity and validate approved subnet/SSH readiness
        shell: bash
        run: |
          set -euo pipefail
          test -f infra/oci-android/approved-admin-ssh.pub
          python tools/oci_a1_capacity_watch.py
      - name: Document execution scope
        if: always()
        run: |
          {
            echo 'The watcher uses GitHub hosted runners only.'
            echo 'Owner approved read-only monitoring; no repository variable gate is used.'
            echo 'Automatic allocation is disabled by forced OCI_A1_AUTO_PROVISION=0 until separately reviewed.'
            echo 'Each capacity poll validates the audited subnet, SSH key fingerprint and locked ingress before enabling future allocation.'
            echo 'It never posts to Kwai or modifies physical Android/MEmu routing.'
            echo 'An allocated Linux VM is not proof of ReDroid, MacroDroid or Kwai operation.'
          } >> "$GITHUB_STEP_SUMMARY"
