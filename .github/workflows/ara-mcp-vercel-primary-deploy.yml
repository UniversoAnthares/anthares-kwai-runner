name: ARA MCP OAuth Continuity Deploy
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [validate, standby, gateway]
        default: validate
      release_sha:
        description: 'Exact reviewed SHA required for standby or gateway release'
        required: false
        type: string
      mode:
        description: 'Regular release or incident recovery'
        required: false
        default: release
        type: choice
        options: [release, emergency]
      incident_ref:
        description: 'Required for emergency recovery'
        required: false
        type: string
  pull_request:
    paths: ['cloudflare-ara-mcp/**', 'cloudflare-ara-neon-standby/**', '.github/workflows/ara-mcp-vercel-primary-deploy.yml']
permissions:
  contents: read
concurrency:
  group: anthares-ara-mcp-reviewed-claude-delegation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.phase != 'validate' && inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify owner identity and sequential failover safety
        run: |
          node --check cloudflare-ara-mcp/src/index.js
          node --check cloudflare-ara-neon-standby/src/worker.mjs
          node --check cloudflare-ara-neon-standby/src/control.generated.mjs
          node --test cloudflare-ara-mcp/src/control-transport.test.mjs cloudflare-ara-mcp/src/owner-github-auth.test.mjs cloudflare-ara-mcp/src/claude-client-policy.test.mjs
          node cloudflare-ara-mcp/capabilities.test.mjs
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.phase != 'validate'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce approved SHA and emergency incident before changing Cloudflare
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA" || exit 1
          main_sha="$(curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$RELEASE_MODE" == release ]]; then
            test "$APPROVED_SHA" = "$main_sha" || exit 1
          elif [[ "$RELEASE_MODE" == emergency ]]; then
            test -n "$INCIDENT_REF" || exit 1
            git merge-base --is-ancestor "$APPROVED_SHA" "$main_sha" || exit 1
          else
            exit 1
          fi
          echo "ARA_MCP_RELEASE_APPROVED_SHA=$APPROVED_SHA mode=$RELEASE_MODE"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and deploy independent compute only
        if: inputs.phase == 'standby'
        working-directory: cloudflare-ara-neon-standby
        run: |
          npm install --no-save --package-lock=false @neondatabase/serverless@1.0.2
          npx --yes wrangler@4.154.0 deploy --keep-vars
          echo ARA_INDEPENDENT_COMPUTE_DEPLOYED=PASS
      - name: Gate gateway activation on provisioned independent standby
        if: inputs.phase == 'gateway'
        run: |
          curl --fail --silent --show-error --max-time 20 https://anthares-ara-neon-standby.anthares1.workers.dev/health -o "$RUNNER_TEMP/standby.json"
          node -e 'const h=require(process.env.RUNNER_TEMP+"/standby.json");if(!h.ok||h.state!=="shared-neon"||!h.vercel_preserved)process.exit(1)'
          cd cloudflare-ara-mcp
          npx --yes wrangler@4.154.0 deploy --keep-vars
          echo ARA_GATEWAY_INDEPENDENT_RESERVE_DEPLOYED=PASS
      - name: Verify fail-closed anonymous access
        if: inputs.phase == 'gateway'
        run: |
          curl --fail --silent --show-error --max-time 30 https://anthares-ara-mcp.anthares1.workers.dev/health -o "$RUNNER_TEMP/gateway.json"
          node -e 'const h=require(process.env.RUNNER_TEMP+"/gateway.json");if(!h.ok||!h.control_ready||h.oauth_owner_code_mode!=="github_owner_identity")process.exit(1)'
          code="$(curl --silent --max-time 15 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://anthares-ara-neon-standby.anthares1.workers.dev/v1/mcp/oauth/consume)"
          test "$code" = 401
          code="$(curl --silent --max-time 15 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://anthares-ara-mcp.anthares1.workers.dev/mcp)"
          test "$code" = 401
          echo ARA_SHARED_LEDGER_FALLBACK_HEALTH_AND_ANON_DENIAL=PASS
