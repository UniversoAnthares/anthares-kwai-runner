name: ARA MCP OAuth Continuity Deploy
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloudflare-ara-mcp/src/**'
      - '.github/workflows/ara-mcp-vercel-primary-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare-ara-mcp/src/**'
      - 'cloudflare-ara-mcp/wrangler.toml'
      - '.github/workflows/ara-mcp-vercel-primary-deploy.yml'
permissions:
  contents: read
concurrency:
  group: anthares-ara-mcp-oauth-continuity
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate OAuth, replay protection and control failover
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-ara-mcp/src/index.js
          node --check cloudflare-ara-mcp/src/owner-github-auth.mjs
          node --test --test-concurrency=1 cloudflare-ara-mcp/src/owner-github-auth.test.mjs
          grep -q 'CONTROL_STANDBY' cloudflare-ara-mcp/src/index.js
          grep -q 'owner_control_unavailable' cloudflare-ara-mcp/src/owner-github-auth.mjs
          echo 'ARA_OAUTH_CONTINUITY_TESTS_PASSED=1'
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy tested Cloudflare Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cd cloudflare-ara-mcp
          npx --yes wrangler@4.43.0 deploy
      - name: Confirm production OAuth control health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 2 \
            https://anthares-ara-mcp.anthares1.workers.dev/ -o /tmp/ara-health.json
          node -e 'const h=require("/tmp/ara-health.json");if(!h.ok||!h.control_ready||!h.oauth||!h.mcp)process.exit(1);'
          echo 'ARA_MCP_OAUTH_PRODUCTION_READY=1'
