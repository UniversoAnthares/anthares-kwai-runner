name: X Durable Session Vault Deploy
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact approved 40-character Git SHA'
        required: true
        type: string
      mode:
        description: 'Normal release or authorized incident recovery'
        required: true
        type: choice
        default: release
        options: [release, emergency]
      incident_ref:
        description: 'Incident reference (required for emergency)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: anthares-x-vault-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: macos-14
    timeout-minutes: 10
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce approved SHA and incident recovery boundary
        env:
          APPROVED_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA" || exit 1
          main_sha="$(curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$RELEASE_MODE" == release ]]; then
            test "$APPROVED_SHA" = "$main_sha" || exit 1
          elif [[ "$RELEASE_MODE" == emergency ]]; then
            test -n "$INCIDENT_REF" || exit 1
            git merge-base --is-ancestor "$APPROVED_SHA" "$main_sha" || exit 1
          else
            exit 1
          fi
          echo "APPROVED_DEPLOY_SHA=$APPROVED_SHA mode=$RELEASE_MODE"
      - name: Validate Render-independent vault source
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check cloudflare-x-vault/src/index.js
          grep -q 'anthares.encrypted-browser-state.v1' cloudflare-x-vault/src/index.js
          grep -q 'BROWSER_CONTROL_JWK_KEY' cloudflare-x-vault/src/index.js
          grep -q 'BROWSER_RUNTIME_JWK_KEY' cloudflare-x-vault/src/index.js
          grep -q 'BROWSER_KEY_ADMIN_TOKEN' cloudflare-x-vault/src/index.js
          ! grep -q 'onrender.com' cloudflare-x-vault/src/index.js
          grep -q 'ANTHARES_STATE' cloudflare-x-vault/wrangler.toml
          grep -q 'BROWSER_TIKTOK_LUCAROSALEM_KEY' cloudflare-x-vault/src/index.js
          test -n "$ARA_SHARED"
      - name: Install key-registration admin secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          cd cloudflare-x-vault
          printf '%s' "$ARA_SHARED" | npx --yes wrangler@4.43.0 secret put BROWSER_KEY_ADMIN_TOKEN
      - name: Deploy durable session vault
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          cd cloudflare-x-vault
          npx --yes wrangler@4.43.0 deploy
      - name: Verify durable vault health without Render
        run: |
          set -euo pipefail
          out="$(curl --fail-with-body -sS https://anthares-x-vault.anthares1.workers.dev/health)"
          echo "$out"
          echo "$out" | grep -q '"service":"anthares-x-vault"'
          echo "$out" | grep -q '"persistent_state":true'
          echo "$out" | grep -q '"render_independent":true'
          echo "$out" | grep -q '"tiktok-lucarosalem"'
          status="$(curl --fail-with-body -sS https://anthares-x-vault.anthares1.workers.dev/browser-key/status)"
          echo "$status"
          echo "$status" | grep -q '"render_dependency":false'
