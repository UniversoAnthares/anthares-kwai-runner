name: X Durable Session Vault Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare-x-vault/**'
      - '.github/workflows/x-vault-deploy.yml'
permissions:
  contents: read
concurrency:
  group: anthares-x-vault-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate vault source
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check cloudflare-x-vault/src/index.js
          grep -q 'anthares.encrypted-browser-state.v1' cloudflare-x-vault/src/index.js
          grep -q 'BROWSER_KEY' cloudflare-x-vault/src/index.js
          grep -q 'ANTHARES_STATE' cloudflare-x-vault/wrangler.toml
      - name: Deploy durable session vault
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cd cloudflare-x-vault
          npx --yes wrangler@4.43.0 deploy
      - name: Verify durable vault health
        run: |
          set -euo pipefail
          out="$(curl --fail-with-body -sS https://anthares-x-vault.anthares1.workers.dev/health)"
          echo "$out"
          echo "$out" | grep -q '"service":"anthares-x-vault"'
          echo "$out" | grep -q '"persistent_state":true'
          echo "$out" | grep -q '"browser_state_slot":true'
