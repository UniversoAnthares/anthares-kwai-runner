name: Kwai-up apply final physical patches

on:
  push:
    branches: [kwai-up]
    paths:
      - '.github/workflows/kwai-up-apply-final-physical-patches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kwai-up
          fetch-depth: 0
      - name: Apply post and overlay patches
        run: python kwai-up/patch_physical_post_variants.py
      - name: Apply exact media selection patch
        run: python kwai-up/patch_exact_media_selection.py
      - name: Validate physical publisher
        run: |
          python -m py_compile kwai-up/kwai_up_physical.py
          python kwai-up/run_30_physical_contracts.py
      - name: Commit final physical publisher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kwai-up/kwai_up_physical.py
          if git diff --cached --quiet; then
            echo KWAI_UP_FINAL_PATCH_COMMIT=NO_CHANGE
          else
            git commit -m 'Finalize physical Kwai-up live publisher'
            git push origin HEAD:kwai-up
          fi
