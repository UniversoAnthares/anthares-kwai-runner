name: Cloudflare ARA Backup Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare-ara-backup/**'
      - '.github/workflows/cloudflare-ara-backup-deploy.yml'
concurrency:
  group: anthares-ara-backup-deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker source
        shell: bash
        run: |
          set -euo pipefail
          test -s cloudflare-ara-backup/src/index.js
          test -s cloudflare-ara-backup/wrangler.toml
          test -s cloudflare-ara-backup/trusted-keys/render-mcp-v2.pem
          test -s cloudflare-ara-backup/trusted-keys/render-mcp.pem
          grep -q 'ARA_TRUSTED_MCP_PUBLIC_KEYS_JSON' cloudflare-ara-backup/src/index.js
          grep -q 'independent_of_render_postgres' cloudflare-ara-backup/src/index.js
          grep -q 'shared-fencing-v1' cloudflare-ara-backup/src/index.js
          grep -q 'floot-postgres-v1' cloudflare-ara-backup/src/index.js
          node --check cloudflare-ara-backup/src/index.js
      - name: Build Render-independent verifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-ara-backup/src/index.js')
          s=p.read_text()
          needle='  // Legacy discovery remains optional during migration and key rotation.\n  for (const url of KEY_URLS) {'
          repl='  if (keys.length) { keyCache = { at: Date.now(), keys }; return keys; }\n  // Emergency legacy discovery is unreachable in the normal pinned-key deployment.\n  for (const url of KEY_URLS) {'
          if needle not in s:
              raise SystemExit('pinned-key patch target missing')
          p.write_text(s.replace(needle,repl,1))
          PY
      - name: Pin static and Cloudflare MCP public keys
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          k1="$(cat cloudflare-ara-backup/trusted-keys/render-mcp-v2.pem)"
          k2="$(cat cloudflare-ara-backup/trusted-keys/render-mcp.pem)"
          k3="$(curl -fsS https://anthares-ara-mcp.anthares1.workers.dev/.well-known/ara-control-key)"
          printf '%s' "$k3" | grep -q 'BEGIN PUBLIC KEY'
          keys="$(jq -cn --arg a "$k1" --arg b "$k2" --arg c "$k3" '[$a,$b,$c]')"
          cd cloudflare-ara-backup
          printf '%s' "$keys" | npx --yes wrangler@4.43.0 secret put ARA_TRUSTED_MCP_PUBLIC_KEYS_JSON
      - name: Deploy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          cd cloudflare-ara-backup
          npx --yes wrangler@4.43.0 deploy
      - name: Verify persistence, fencing and health
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS https://anthares-ara-backup.anthares1.workers.dev/healthz)"
          echo "$health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q 'cloudflare-durable-object-sqlite'
          echo "$health" | grep -q '"independent_of_render_postgres":true'
          echo "$health" | grep -q '"shared_fencing":"floot-postgres-v1"'
          self="$(curl -fsS https://anthares-ara-backup.anthares1.workers.dev/_selftest)"
          echo "$self"
          echo "$self" | grep -q '"ok":true'
          code="$(curl -sS -o /tmp/auth.json -w '%{http_code}' -H 'X-Anthares-Device: DESKTOP-FTDK0HP' https://anthares-ara-backup.anthares1.workers.dev/v1/device/auth-check)"
          cat /tmp/auth.json
          test "$code" = 401
          echo 'ARA_SHARED_FENCING_DEPLOYED=1'
