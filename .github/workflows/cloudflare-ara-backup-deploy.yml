name: Cloudflare ARA Canonical Control Deploy
# The legacy stateful Worker shares its name with the active stateless proxy.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character reviewed SHA from main history'
        required: true
        type: string
      incident_ref:
        description: 'Incident authorizing legacy stateful recovery'
        required: true
        type: string
      acknowledge_override:
        description: 'I authorize replacing the stateless proxy with the stateful Worker'
        required: true
        default: false
        type: boolean
concurrency:
  # Both Cloudflare workflows deploy the same Worker name; never cancel an in-flight deploy.
  group: anthares-ara-backup-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.acknowledge_override == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate explicit incident and reviewed code SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'STATEFUL_SHA_INVALID'; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || { echo 'STATEFUL_SHA_MISMATCH'; exit 1; }
          test -n "$INCIDENT_REF" || { echo 'STATEFUL_INCIDENT_REQUIRED'; exit 1; }
          git rev-parse --verify refs/remotes/origin/main >/dev/null
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main || {
            echo 'STATEFUL_SHA_OUTSIDE_MAIN_HISTORY'; exit 1;
          }
          echo "STATEFUL_EMERGENCY_APPROVED_SHA=$RELEASE_SHA"
      - name: Validate Cloudflare-only source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -s cloudflare-ara-backup/src/index.js
          test -s cloudflare-ara-backup/wrangler.toml
          grep -q 'ARA_TRUSTED_MCP_PUBLIC_KEYS_JSON' cloudflare-ara-backup/src/index.js
          grep -q 'independent_of_render_postgres' cloudflare-ara-backup/src/index.js
          grep -q 'cloudflare-single-authority-v1' cloudflare-ara-backup/src/index.js
          grep -q '/v1/device/status' cloudflare-ara-backup/src/index.js
          ! grep -q 'floot.app' cloudflare-ara-backup/src/index.js
          ! grep -q 'onrender.com' cloudflare-ara-backup/src/index.js
          node --check cloudflare-ara-backup/src/index.js
      - name: Validate bounded Durable Object reads before deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_ara_backup_read_quota.py' -v
          grep -q 'main = "src/quota-guard.js"' cloudflare-ara-backup/wrangler.toml
          node --check cloudflare-ara-backup/src/quota-guard.js
      - name: Pin Cloudflare MCP signing key only
        shell: bash
        run: |
          set -euo pipefail
          gateway_key="$(curl -fsS https://anthares-ara-mcp.anthares1.workers.dev/.well-known/ara-control-key)"
          printf '%s' "$gateway_key" | grep -q 'BEGIN PUBLIC KEY'
          keys="$(jq -cn --arg k "$gateway_key" '[$k]')"
          cd cloudflare-ara-backup
          printf '%s' "$keys" | npx --yes wrangler@4.43.0 secret put ARA_TRUSTED_MCP_PUBLIC_KEYS_JSON
      - name: Deploy canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-ara-backup
          npx --yes wrangler@4.43.0 deploy
      - name: Verify persistence, authority and fail-closed auth
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 20); do
            health="$(curl -fsS https://anthares-ara-backup.anthares1.workers.dev/healthz 2>/dev/null || true)"
            echo "$health"
            if echo "$health" | grep -q '"ok":true' \
              && echo "$health" | grep -q 'cloudflare-durable-object-sqlite' \
              && echo "$health" | grep -q '"shared_fencing":"cloudflare-single-authority-v1"'; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = 1
          echo "$health" | grep -q '"independent_of_render_postgres":true'
          echo "$health" | grep -q '"legacy_mcp_discovery":false'
          self="$(curl -fsS https://anthares-ara-backup.anthares1.workers.dev/_selftest)"
          echo "$self"
          echo "$self" | grep -q '"ok":true'
          code="$(curl -sS -o /tmp/auth.json -w '%{http_code}' -H 'X-Anthares-Device: DESKTOP-FTDK0HP' https://anthares-ara-backup.anthares1.workers.dev/v1/device/auth-check)"
          cat /tmp/auth.json
          test "$code" = 401
          echo 'ARA_CLOUDFLARE_SINGLE_AUTHORITY_DEPLOYED=1'
