name: Anthares Android Agent Runtime
on:
  push:
    paths: ['.github/workflows/android-agent-runtime.yml', 'android-agent/.runtime-trigger']
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Fetch proven Agent APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/agent-apk
          gh api repos/UniversoAnthares/anthares-kwai-runner/actions/artifacts/11384550256/zip > /tmp/agent.zip
          unzip -q /tmp/agent.zip -d /tmp/agent-apk
          test -s /tmp/agent-apk/app-debug.apk
          echo TEST_VALIDITY=PROVEN_AGENT_APK_FETCHED
      - name: Fetch validated Kwai vault
        run: |
          curl -fL --retry 3 -o /tmp/kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  /tmp/kwai-vault.zip" | sha256sum -c -
          mkdir -p /tmp/kwai-vault && unzip -q /tmp/kwai-vault.zip -d /tmp/kwai-vault
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Install emulator image
        run: |
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/emulator" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo no | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager create avd -n anthares -k "system-images;android-35;google_apis;x86_64" --device "pixel_5" --force
      - name: Install emulator runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          ls -la "$ANDROID_AVD_HOME" || true
          /usr/local/lib/android/sdk/emulator/emulator -list-avds || true
      - name: Boot emulator
        run: |
          export ANDROID_SDK_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          nohup /usr/local/lib/android/sdk/emulator/emulator -avd anthares -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 >/tmp/emulator.log 2>&1 &
          if ! timeout 120 adb wait-for-device; then
            echo EMULATOR_WAIT_FOR_DEVICE_FAILED
            cat /tmp/emulator.log || true
            ls -l /dev/kvm || true
            /usr/local/lib/android/sdk/emulator/emulator -version || true
            adb devices -l || true
            exit 124
          fi
          if ! timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 3; done'; then
            echo EMULATOR_BOOT_COMPLETION_FAILED
            cat /tmp/emulator.log || true
            adb devices -l || true
            exit 125
          fi
          adb shell input keyevent 82 || true
          echo TEST_VALIDITY=EMULATOR_BOOTED
      - name: Install Kwai and Agent
        run: |
          cd /tmp/kwai-vault
          echo "KWAIVault_APKS:"
          find . -type f -name '*.apk' -print
          APK_COUNT="$(find . -type f -name '*.apk' | wc -l | tr -d ' ')"
          if [ "$APK_COUNT" = "1" ]; then
            APK="$(find . -type f -name '*.apk' -print -quit)"
            adb install -r "$APK" 2>&1 | tee /tmp/kwai-install.log
          elif [ "$APK_COUNT" -gt 1 ]; then
            mapfile -t APKS < <(find . -type f -name '*.apk' -print)
            adb install-multiple -r "${APKS[@]}" 2>&1 | tee /tmp/kwai-install.log
          else
            echo KWAI_APK_MISSING
            find . -maxdepth 3 -type f -print | head -200
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          if ! adb install -r /tmp/agent-apk/app-debug.apk 2>&1 | tee /tmp/agent-install.log; then
            echo AGENT_INSTALL_FAILED
            cat /tmp/agent-install.log || true
            exit 1
          fi
          adb shell pm list packages | grep -q 'package:us.anthares.agent' || { echo AGENT_PACKAGE_MISSING; adb shell pm list packages | sort; exit 1; }
          adb shell pm list packages | grep -q 'package:com.kwai.video' || { echo KWAI_PACKAGE_MISSING; adb shell pm list packages | sort; exit 1; }
          echo TEST_VALIDITY=APPS_INSTALLED

      - name: Enable AccessibilityService
        run: |
          SVC='us.anthares.agent/us.anthares.agent.AntharesAccessibilityService'
          echo "DECLARED_SERVICES:"
          adb shell dumpsys package us.anthares.agent | grep -i -A8 -B3 'AccessibilityService' || true
          adb shell cmd package query-services --brief -a android.accessibilityservice.AccessibilityService us.anthares.agent 2>/dev/null || true
          adb shell am start -a android.settings.ACCESSIBILITY_SETTINGS >/dev/null 2>&1 || true
          sleep 2
          adb shell settings --user 0 put secure enabled_accessibility_services "$SVC"
          adb shell settings --user 0 put secure accessibility_enabled 1
          adb shell am force-stop us.anthares.agent || true
          adb shell monkey -p us.anthares.agent 1 >/dev/null 2>&1 || true
          sleep 5
          echo "ENABLED_SETTING=$(adb shell settings --user 0 get secure enabled_accessibility_services | tr -d '\r')"
          adb shell dumpsys accessibility > /tmp/accessibility.txt
          cat /tmp/accessibility.txt
          if grep -q 'Enabled services:.*us.anthares.agent' /tmp/accessibility.txt || grep -q 'Bound services:.*us.anthares.agent' /tmp/accessibility.txt; then
            echo AGENT_SERVICE_ENABLED
          else
            echo AGENT_SERVICE_UNAVAILABLE_UIAUTOMATOR_FALLBACK
          fi
      - name: Launch Kwai and normalize to MAIN
        run: |
          adb logcat -c
          adb shell monkey -p com.kwai.video 1
          sleep 7
          python3 kwai_state_driver.py | tee /tmp/fsm.log
          grep -q 'FSM_MAIN_REACHED' /tmp/fsm.log
          echo TEST_VALIDITY=FSM_MAIN_REACHED
          echo MAIN_UI_READY
      - name: Semantic MAIN login control probe
        run: |
          python3 - <<'PY'
          import subprocess,time,re,xml.etree.ElementTree as ET
          def adb(*a):
              return subprocess.run(["adb",*a],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=30).stdout
          def dump(tag):
              adb("shell","uiautomator","dump",f"/sdcard/{tag}.xml")
              adb("pull",f"/sdcard/{tag}.xml",f"/tmp/{tag}.xml")
              return ET.parse(f"/tmp/{tag}.xml").getroot()
          def label(n):
              return (n.attrib.get("text","")+" "+n.attrib.get("content-desc","")).strip().lower()
          root=dump("main-login")
          candidates=[n for n in root.iter("node") if label(n) in ("log in","login","sign in","entrar")]
          print("LOGIN_CONTROL_COUNT="+str(len(candidates)))
          if not candidates:
              raise SystemExit("LOGIN_CONTROL_VISIBLE=0")
          print("LOGIN_CONTROL_VISIBLE=1")
          n=candidates[0]
          m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib.get("bounds",""))
          if not m: raise SystemExit("LOGIN_CONTROL_BOUNDS_INVALID")
          x1,y1,x2,y2=map(int,m.groups())
          adb("shell","input","tap",str((x1+x2)//2),str((y1+y2)//2))
          time.sleep(5)
          after=dump("after-login")
          nodes=list(after.iter("node"))
          edits=[x for x in nodes if x.attrib.get("editable")=="true" or x.attrib.get("class","").endswith("EditText")]
          text=" ".join(label(x) for x in nodes)
          explicit=any(t in text for t in ("phone","email","e-mail","continue","verification code","password","sign in","log in"))
          print("EDITABLE_FIELDS="+str(len(edits)))
          print("AUTH_EXPLICIT_CONTROLS="+("1" if explicit else "0"))
          print("POST_LOGIN_UI="+text[-1800:])
          if edits or explicit:
              print("SUCCESS_SIGNAL=LOGIN_SURFACE_REACHED")
              raise SystemExit(0)
          print("FAILURE_SIGNAL=LOGIN_SURFACE_NOT_REACHED")
          raise SystemExit(42)
          PY
      - name: Probe Phone authentication form
        run: |
          python3 - <<'PY'
          import subprocess,time,re,xml.etree.ElementTree as ET
          def adb(*a):
              return subprocess.run(["adb",*a],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=30).stdout
          def dump(tag):
              adb("shell","uiautomator","dump",f"/sdcard/{tag}.xml")
              adb("pull",f"/sdcard/{tag}.xml",f"/tmp/{tag}.xml")
              return ET.parse(f"/tmp/{tag}.xml").getroot()
          def label(n):
              return (n.attrib.get("text","")+" "+n.attrib.get("content-desc","")).strip().lower()
          def tap(n):
              m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib.get("bounds",""))
              if not m:return False
              x1,y1,x2,y2=map(int,m.groups())
              adb("shell","input","tap",str((x1+x2)//2),str((y1+y2)//2));return True
          root=dump("auth-chooser")
          phone=[n for n in root.iter("node") if label(n) in ("phone","phone number","use phone","telefone","usar telefone")]
          print("PHONE_CONTROL_COUNT="+str(len(phone)))
          if not phone: raise SystemExit("PHONE_CONTROL_VISIBLE=0")
          tap(phone[0]);time.sleep(4)
          after=dump("phone-form")
          nodes=list(after.iter("node"))
          edits=[n for n in nodes if n.attrib.get("editable")=="true" or n.attrib.get("class","").endswith("EditText")]
          txt=" ".join(label(n) for n in nodes)
          print("PHONE_EDITABLE_FIELDS="+str(len(edits)))
          print("PHONE_FORM_UI="+txt[-1800:])
          if edits and any(k in txt for k in ("phone","country","code","continue","next","log in","login")):
              print("SUCCESS_SIGNAL=PHONE_AUTH_FORM_REACHED")
              raise SystemExit(0)
          print("FAILURE_SIGNAL=PHONE_AUTH_FORM_NOT_REACHED")
          raise SystemExit(43)
          PY
