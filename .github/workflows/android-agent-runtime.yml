name: Anthares Android Agent Runtime
on:
  push:
    paths: ['.github/workflows/android-agent-runtime.yml', 'android-agent/.runtime-trigger']
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Fetch proven Agent APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/agent-apk
          gh api repos/UniversoAnthares/anthares-kwai-runner/actions/artifacts/11384550256/zip > /tmp/agent.zip
          unzip -q /tmp/agent.zip -d /tmp/agent-apk
          test -s /tmp/agent-apk/app-debug.apk
          echo TEST_VALIDITY=PROVEN_AGENT_APK_FETCHED
      - name: Fetch validated Kwai vault
        run: |
          curl -fL --retry 3 -o /tmp/kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  /tmp/kwai-vault.zip" | sha256sum -c -
          mkdir -p /tmp/kwai-vault && unzip -q /tmp/kwai-vault.zip -d /tmp/kwai-vault
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Install emulator image
        run: |
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/emulator" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo no | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager create avd -n anthares -k "system-images;android-35;google_apis;x86_64" --device "pixel_5" --force
      - name: Install emulator runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          ls -la "$ANDROID_AVD_HOME" || true
          /usr/local/lib/android/sdk/emulator/emulator -list-avds || true
      - name: Boot emulator
        run: |
          export ANDROID_SDK_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          nohup /usr/local/lib/android/sdk/emulator/emulator -avd anthares -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -accel off -memory 2048 -cores 2 >/tmp/emulator.log 2>&1 &
          if ! timeout 120 adb wait-for-device; then
            echo EMULATOR_WAIT_FOR_DEVICE_FAILED
            cat /tmp/emulator.log || true
            ls -l /dev/kvm || true
            /usr/local/lib/android/sdk/emulator/emulator -version || true
            adb devices -l || true
            exit 124
          fi
          if ! timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 3; done'; then
            echo EMULATOR_BOOT_COMPLETION_FAILED
            cat /tmp/emulator.log || true
            adb devices -l || true
            exit 125
          fi
          adb shell input keyevent 82 || true
          echo TEST_VALIDITY=EMULATOR_BOOTED
      - name: Install Kwai and Agent
        run: |
          cd /tmp/kwai-vault
          SCRIPT="$(find . -name kwai_vault_install.sh -print -quit)"
          test -n "$SCRIPT"
          bash "$SCRIPT"
          cd "$GITHUB_WORKSPACE"
          adb install -r /tmp/agent-apk/app-debug.apk
          adb shell pm list packages | grep -q 'package:us.anthares.agent'
          adb shell pm list packages | grep -q 'package:com.kwai.video'
          echo TEST_VALIDITY=APPS_INSTALLED
      - name: Enable AccessibilityService
        run: |
          SVC='us.anthares.agent/us.anthares.agent.AntharesAccessibilityService'
          adb shell settings put secure enabled_accessibility_services "$SVC"
          adb shell settings put secure accessibility_enabled 1
          sleep 3
          adb shell settings get secure enabled_accessibility_services | grep -q 'us.anthares.agent'
          adb shell dumpsys accessibility > /tmp/accessibility.txt
          grep -E 'us.anthares.agent|AntharesAccessibilityService' /tmp/accessibility.txt
          echo AGENT_SERVICE_ENABLED
      - name: Launch Kwai and normalize to MAIN
        run: |
          adb logcat -c
          adb shell monkey -p com.kwai.video 1
          sleep 7
          python3 kwai_state_driver.py | tee /tmp/fsm.log
          grep -q 'FSM_MAIN_REACHED' /tmp/fsm.log
          echo TEST_VALIDITY=FSM_MAIN_REACHED
          sleep 3
          adb logcat -d -s AntharesAgent:I '*:S' | tee /tmp/agent-main.log
          grep -q 'STATE=MAIN' /tmp/agent-main.log
          echo AGENT_MAIN_OBSERVED
      - name: Semantic Profile action and state proof
        run: |
          python3 - <<'PY'
          import subprocess, time, xml.etree.ElementTree as ET
          def dump():
              subprocess.run(["adb","shell","uiautomator","dump","/sdcard/u.xml"],stdout=subprocess.DEVNULL,check=False)
              subprocess.run(["adb","pull","/sdcard/u.xml","/tmp/u.xml"],stdout=subprocess.DEVNULL,check=True)
              return ET.parse("/tmp/u.xml").getroot()
          root=dump()
          target=None
          for n in root.iter("node"):
              rid=n.attrib.get("resource-id","")
              if rid.endswith("/ll_profile"):
                  target=n; break
          if target is None: raise SystemExit("PROFILE_SEMANTIC_ANCHOR_MISSING")
          b=target.attrib.get("bounds","")
          import re
          m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",b)
          if not m: raise SystemExit("PROFILE_BOUNDS_INVALID")
          x1,y1,x2,y2=map(int,m.groups())
          subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)
          print("SEMANTIC_ANCHOR=ll_profile")
          time.sleep(8)
          PY
          adb logcat -d -s AntharesAgent:I '*:S' | tee /tmp/agent-profile.log
          adb shell uiautomator dump /sdcard/final.xml >/dev/null || true
          adb pull /sdcard/final.xml /tmp/final.xml >/dev/null || true
          if grep -Eq 'STATE=(PROFILE|RESOURCE_LOADING|LOGIN_REQUIRED|AUTHENTICATED)' /tmp/agent-profile.log; then
            echo SUCCESS_SIGNAL=AGENT_PROFILE_STATE_OBSERVED
          elif grep -Eqi 'resource downloading|downloading resources' /tmp/final.xml; then
            echo SUCCESS_SIGNAL=RESOURCE_LOADING_UI_OBSERVED
          else
            echo FAILURE_SIGNAL=AGENT_NO_PROFILE_STATE
            cat /tmp/agent-profile.log
            exit 41
          fi
