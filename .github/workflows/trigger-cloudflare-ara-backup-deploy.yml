name: Trigger Cloudflare ARA deploy

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-ara-backup/**'
      - '.github/workflows/trigger-cloudflare-ara-backup-deploy.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloudflare-ara-backup-deploy.yml --repo UniversoAnthares/anthares-kwai-runner --ref main
