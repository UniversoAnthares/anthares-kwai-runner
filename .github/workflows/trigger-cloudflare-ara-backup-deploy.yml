name: Trigger Cloudflare ARA deploy

# The stateful Worker shares its name with the stateless backup proxy.
# Restrict rollback/redeployment to explicit owner action: a normal push must
# never replace the proxy and silently resume Durable Object SQL consumption.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact reviewed Git SHA from main history'
        required: true
        type: string
      incident_ref:
        description: 'Incident authorizing replacement of stateless proxy'
        required: true
        type: string
      acknowledge_override:
        description: 'Authorize stateful override of the same Cloudflare Worker'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ github.ref == 'refs/heads/main' && inputs.acknowledge_override == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reviewed stateful emergency
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test -n "$INCIDENT_REF" || exit 1
          gh workflow run cloudflare-ara-backup-deploy.yml \
            --repo UniversoAnthares/anthares-kwai-runner --ref main \
            -f release_sha="$RELEASE_SHA" \
            -f incident_ref="$INCIDENT_REF" \
            -f acknowledge_override=true
