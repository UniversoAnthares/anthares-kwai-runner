name: Trigger Cloudflare ARA deploy

# The stateful Worker shares its name with the stateless backup proxy.
# Restrict rollback/redeployment to explicit owner action: a normal push must
# never replace the proxy and silently resume Durable Object SQL consumption.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloudflare-ara-backup-deploy.yml --repo UniversoAnthares/anthares-kwai-runner --ref main
