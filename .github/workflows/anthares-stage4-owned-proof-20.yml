name: Kwai Native ARM64 Executor Feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64-host:
    name: "ARM64 host feasibility"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - name: Verify actual native architecture and virtualization
        run: |
          set -euo pipefail
          echo "HOST_ARCH=$(uname -m)"
          test "$(uname -m)" = "aarch64"
          echo "NATIVE_ARM64_HOST=PASS"
          ls -l /dev/kvm || true
          if test -r /dev/kvm && test -w /dev/kvm; then echo "KVM_AVAILABLE=1"; else echo "KVM_AVAILABLE=0"; fi
          grep -E '^(Features|CPU architecture)' /proc/cpuinfo | head -10 || true
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if command -v sdkmanager >/dev/null; then sdkmanager --list_installed | grep -E 'system-images|emulator' || true; fi
  arm64-image:
    name: "ARM64 Android image feasibility"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Inspect SDK availability without emulator boot
        run: |
          set -euo pipefail
          echo "HOST_ARCH=$(uname -m)"
          test "$(uname -m)" = aarch64
          if command -v sdkmanager >/dev/null; then
            sdkmanager --list | grep -E 'system-images;android-(29|30|31|33|34);(google_apis|default);arm64-v8a' | head -25 || true
          else
            echo SDKMANAGER_NOT_PREINSTALLED=1
          fi
          echo "KVM_DEVICE=$(test -e /dev/kvm && echo yes || echo no)"
          echo "ARM64_IMAGE_DISCOVERY_COMPLETE=1"
