name: Stage 4 ABI Architecture Matrix 30
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/anthares-stage4-owned-proof-20.yml'
      - 'tools/kwai_semantic_ui_explorer.py'
permissions:
  contents: read
jobs:
  identity-evidence:
    name: "Stage4 architecture ${{ matrix.case }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        include:
          - {case: 1, api: 28, arch: x86_64, target: google_apis}
          - {case: 2, api: 29, arch: x86_64, target: google_apis}
          - {case: 3, api: 30, arch: x86_64, target: google_apis}
          - {case: 4, api: 31, arch: x86_64, target: google_apis}
          - {case: 5, api: 32, arch: x86_64, target: google_apis}
          - {case: 6, api: 33, arch: x86_64, target: google_apis}
          - {case: 7, api: 28, arch: x86_64, target: google_apis}
          - {case: 8, api: 29, arch: x86_64, target: google_apis}
          - {case: 9, api: 30, arch: x86_64, target: google_apis}
          - {case: 10, api: 31, arch: x86_64, target: google_apis}
          - {case: 11, api: 32, arch: x86_64, target: google_apis}
          - {case: 12, api: 33, arch: x86_64, target: google_apis}
          - {case: 13, api: 28, arch: x86_64, target: google_apis}
          - {case: 14, api: 29, arch: x86_64, target: google_apis}
          - {case: 15, api: 30, arch: x86_64, target: google_apis}
          - {case: 16, api: 31, arch: x86, target: google_apis}
          - {case: 17, api: 32, arch: x86, target: google_apis}
          - {case: 18, api: 33, arch: x86, target: google_apis}
          - {case: 19, api: 28, arch: x86, target: google_apis}
          - {case: 20, api: 29, arch: x86, target: google_apis}
          - {case: 21, api: 30, arch: x86, target: google_apis}
          - {case: 22, api: 31, arch: x86, target: google_apis}
          - {case: 23, api: 32, arch: x86, target: google_apis}
          - {case: 24, api: 33, arch: x86, target: google_apis}
          - {case: 25, api: 28, arch: x86, target: google_apis}
          - {case: 26, api: 29, arch: x86, target: google_apis}
          - {case: 27, api: 30, arch: x86, target: google_apis}
          - {case: 28, api: 31, arch: x86, target: google_apis}
          - {case: 29, api: 32, arch: x86, target: google_apis}
          - {case: 30, api: 33, arch: x86, target: google_apis}
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo KVM_USABLE=YES
      - name: Download verified Kwai package
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo '96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip' | sha256sum -c -
          mkdir -p kwai-vault && unzip -q kwai-vault.zip -d kwai-vault
      - name: Semantic UI discovery and real identity proof
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
          KWAI_EXPECTED_ACCOUNT: lucasrosalem
          CASE_ID: ${{ matrix.case }}
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -accel on
          script: |
            set -eu
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
            echo ANDROID_BOOT=PASS
            bash kwai_vault_install.sh
            adb shell pm path com.kwai.video | grep -q '^package:'
            echo KWAI_PACKAGE_INSTALLED=PASS
            adb logcat -c
            echo "ABI_CASE=$CASE_ID"
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.dalvik.vm.native.bridge
            adb shell getprop ro.hardware
            adb shell am force-stop com.kwai.video
            adb shell monkey -p com.kwai.video -c android.intent.category.LAUNCHER 1
            sleep $((3 + CASE_ID % 6))
            adb shell input tap $((930 + CASE_ID % 3 * 15)) $((1680 + CASE_ID % 5 * 16))
            sleep $((2 + CASE_ID % 7))
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            adb shell pidof com.kwai.video || true
            adb logcat -d -v brief -t 2500 | grep -Ei 'FATAL EXCEPTION|AndroidRuntime|Process: com.kwai.video|com.kwai.video.*(crash|exception|error)|libndk_translation|UnsatisfiedLinkError|SIGSEGV|SIGABRT|ActivityTaskManager.*com.kwai.video' | tail -100 || true
            adb shell uiautomator dump /sdcard/stage4-diag.xml || true
            adb exec-out cat /sdcard/stage4-diag.xml | grep -Eo 'package="[^"]+"' | sort -u || true
            adb logcat -d -v brief | grep -E "libcpu-info.so|SIGSEGV|Fatal signal" | tail -30 || true
            if adb logcat -d -v brief | grep -q "ndk_translation_program_runner_binfmt_misc_arm64"; then echo "ARM64_TRANSLATION_CRASH=1"; exit 1; fi
            adb shell pidof com.kwai.video >/dev/null
            echo "KWAI_NATIVE_STABILITY=PASS"
