name: Kwai ARM64 Android Runtime Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-arm64-probe:
    name: "Android ARM64 SDK probe"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - name: Install Android commandline tools
        run: |
          set -euo pipefail
          echo "ARCH=$(uname -m)"
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl default-jre-headless >/dev/null
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          curl -fLsS --retry 2 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/android-tools
          cp -a /tmp/android-tools/cmdline-tools/. "$HOME/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Check ARM64 Android image and emulator binaries
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list | grep -E 'system-images;android-(30|33|34|35);(default|google_apis);arm64-v8a' | head -20 || true
          echo "SDK_ARM64_DISCOVERY=PASS"
          echo "KVM=$(test -e /dev/kvm && echo present || echo absent)"
          echo "ANDROID_RUNTIME_READY=UNPROVEN"
  qemu-host-probe:
    name: "ARM64 QEMU host probe"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - name: Detect virtualization capabilities
        run: |
          set -euo pipefail
          echo "ARCH=$(uname -m)"
          test "$(uname -m)" = aarch64
          command -v qemu-system-aarch64 || true
          ls -l /dev/kvm /dev/vhost-vsock /dev/net/tun 2>&1 || true
          grep -E '^(Features|CPU architecture)' /proc/cpuinfo | head -10 || true
          echo "KVM_PRESENT=$(test -e /dev/kvm && echo yes || echo no)"
          echo "QEMU_PROBE_COMPLETE=1"
