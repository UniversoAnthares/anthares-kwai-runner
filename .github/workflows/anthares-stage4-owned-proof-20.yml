name: Kwai Android ARM64 Metadata Boot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/anthares-stage4-owned-proof-20.yml'
permissions:
  contents: read
jobs:
  android-metadata-boot:
    name: "Android ARM64 boot with metadata GPT"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - name: Install QEMU and Android ARM64 image
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm unzip curl default-jre-headless file cpio gdisk e2fsprogs util-linux >/dev/null
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          curl -fLsS --retry 2 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/android-tools
          cp -a /tmp/android-tools/cmdline-tools/. "$HOME/android-sdk/cmdline-tools/latest/"
          export ANDROID_HOME="$HOME/android-sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-30;default;arm64-v8a" >/dev/null
          DIR="$ANDROID_HOME/system-images/android-30/default/arm64-v8a"
          gzip -dc "$DIR/kernel-ranchu" > /tmp/android-Image
          test -s /tmp/android-Image
          echo "ANDROID_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Inspect ramdisk fstab and required early partitions
        run: |
          set -euo pipefail
          rm -rf /tmp/ramdisk && mkdir -p /tmp/ramdisk
          cd /tmp/ramdisk
          gzip -dc "$ANDROID_DIR/ramdisk.img" | cpio -idmu --quiet
          find . -type f \( -name 'fstab*' -o -name '*fstab*' \) -print > /tmp/fstab-files.txt
          : > /tmp/fstab-dump.txt
          while read -r f; do
            echo "===== $f =====" >> /tmp/fstab-dump.txt
            cat "$f" >> /tmp/fstab-dump.txt || true
          done < /tmp/fstab-files.txt
          grep -E 'metadata|system|vendor|userdata|super|product' /tmp/fstab-dump.txt || true
          echo FSTAB_INSPECTION=PASS

      - name: Create GPT metadata partition expected by Android first stage
        run: |
          set -euo pipefail
          truncate -s 128M /tmp/metadata-disk.img
          sgdisk -o /tmp/metadata-disk.img >/dev/null
          sgdisk -n 1:2048:0 -c 1:metadata /tmp/metadata-disk.img >/dev/null
          LOOP=$(sudo losetup --find --show --partscan /tmp/metadata-disk.img)
          trap 'sudo losetup -d "$LOOP" || true' EXIT
          sleep 1
          test -b "${LOOP}p1"
          sudo mkfs.ext4 -F -L metadata "${LOOP}p1" >/dev/null
          sudo blkid "${LOOP}p1" || true
          sudo losetup -d "$LOOP"
          trap - EXIT
          sgdisk -p /tmp/metadata-disk.img
          echo METADATA_GPT_READY=PASS

      - name: Boot Android past missing-metadata checkpoint
        run: |
          set +e
          timeout 210 qemu-system-aarch64 \
            -machine virt \
            -cpu cortex-a72 \
            -m 2048 \
            -smp 2 \
            -accel tcg \
            -nographic \
            -no-reboot \
            -kernel /tmp/android-Image \
            -initrd "$ANDROID_DIR/ramdisk.img" \
            -drive if=none,file="$ANDROID_DIR/system.img",format=raw,readonly=on,id=system \
            -device virtio-blk-device,drive=system \
            -drive if=none,file="$ANDROID_DIR/vendor.img",format=raw,readonly=on,id=vendor \
            -device virtio-blk-device,drive=vendor \
            -drive if=none,file="$ANDROID_DIR/userdata.img",format=raw,id=userdata \
            -device virtio-blk-device,drive=userdata \
            -drive if=none,file=/tmp/metadata-disk.img,format=raw,id=metadata \
            -device virtio-blk-device,drive=metadata \
            -append "console=ttyAMA0 androidboot.console=ttyAMA0 androidboot.hardware=ranchu androidboot.selinux=permissive root=/dev/ram0 rw" \
            > /tmp/android-qemu.log 2>&1
          grep -E 'init first stage|init second stage|metadata|partition\(s\) not found|Failed to mount|required partitions|InitFatalReboot|Android|SELinux|VFS|panic' /tmp/android-qemu.log | tail -120 || true
          if grep -Eq 'partition\(s\) not found.*metadata|partitions not found.*metadata' /tmp/android-qemu.log; then
            echo METADATA_CHECKPOINT=FAIL
            exit 1
          fi
          if grep -Eq 'init second stage started|SecondStageMain|second stage|property_service|servicemanager|zygote|userdata|super|product|Failed to mount required partitions' /tmp/android-qemu.log; then
            echo METADATA_CHECKPOINT=PASS
            echo ANDROID_BOOT_ADVANCED=PASS
          else
            echo METADATA_CHECKPOINT=INCONCLUSIVE
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-metadata-boot-diagnostics
          path: |
            /tmp/android-qemu.log
            /tmp/fstab-dump.txt
            /tmp/fstab-files.txt
          retention-days: 3
