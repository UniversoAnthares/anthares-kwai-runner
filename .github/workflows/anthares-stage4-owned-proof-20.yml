name: Kwai ARM64 QEMU Feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-native:
    name: "QEMU ARM64 binary and accelerators"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Install QEMU and probe native ARM64
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-utils >/dev/null
          command -v qemu-system-aarch64
          file "$(command -v qemu-system-aarch64)"
          qemu-system-aarch64 -machine help | grep -E 'virt|raspi' | head -15
          qemu-system-aarch64 -accel help
          echo "HOST_ARCH=$(uname -m)"
          echo "KVM_AVAILABLE=$(test -e /dev/kvm && echo yes || echo no)"
          echo "QEMU_ARM64_BINARY=PASS"
  android-image:
    name: "ARM64 system image extraction"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 14
    steps:
      - name: Install Android ARM64 system image without Google emulator
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl default-jre-headless >/dev/null
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          curl -fLsS --retry 2 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/android-tools
          cp -a /tmp/android-tools/cmdline-tools/. "$HOME/android-sdk/cmdline-tools/latest/"
          export ANDROID_HOME="$HOME/android-sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-30;default;arm64-v8a"
          find "$ANDROID_HOME/system-images" -maxdepth 5 -type f | head -35
          test -s "$ANDROID_HOME/system-images/android-30/default/arm64-v8a/system.img"
          echo "ARM64_ANDROID_SYSTEM_IMAGE=PASS"
          echo "QEMU_BOOT=NOT_YET_PROVEN"
