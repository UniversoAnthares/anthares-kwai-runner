name: Kwai Android ARM64 Framework Matrix 30
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/anthares-stage4-owned-proof-20.yml'
permissions:
  contents: read
jobs:
  framework-matrix:
    name: "case-${{ matrix.id }} cpu=${{ matrix.cpu }} ram=${{ matrix.ram }} smp=${{ matrix.smp }} mode=${{ matrix.mode }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        include:
          - {id: 1, cpu: cortex-a72, ram: 2048, smp: 2, mode: base}
          - {id: 2, cpu: cortex-a72, ram: 3072, smp: 2, mode: qemu}
          - {id: 3, cpu: cortex-a72, ram: 4096, smp: 2, mode: qemu}
          - {id: 4, cpu: cortex-a72, ram: 2048, smp: 4, mode: qemu}
          - {id: 5, cpu: cortex-a72, ram: 4096, smp: 4, mode: qemu}
          - {id: 6, cpu: max, ram: 2048, smp: 2, mode: qemu}
          - {id: 7, cpu: max, ram: 4096, smp: 4, mode: qemu}
          - {id: 8, cpu: cortex-a72, ram: 2048, smp: 2, mode: noverity}
          - {id: 9, cpu: cortex-a72, ram: 3072, smp: 2, mode: noverity}
          - {id: 10, cpu: cortex-a72, ram: 4096, smp: 4, mode: noverity}
          - {id: 11, cpu: cortex-a72, ram: 2048, smp: 2, mode: slot}
          - {id: 12, cpu: cortex-a72, ram: 3072, smp: 2, mode: slot}
          - {id: 13, cpu: cortex-a72, ram: 4096, smp: 4, mode: slot}
          - {id: 14, cpu: cortex-a72, ram: 2048, smp: 2, mode: freshdata2}
          - {id: 15, cpu: cortex-a72, ram: 3072, smp: 2, mode: freshdata2}
          - {id: 16, cpu: cortex-a72, ram: 4096, smp: 4, mode: freshdata2}
          - {id: 17, cpu: cortex-a72, ram: 2048, smp: 2, mode: freshdata4}
          - {id: 18, cpu: cortex-a72, ram: 4096, smp: 4, mode: freshdata4}
          - {id: 19, cpu: cortex-a72, ram: 2048, smp: 2, mode: gpu}
          - {id: 20, cpu: cortex-a72, ram: 4096, smp: 4, mode: gpu}
          - {id: 21, cpu: cortex-a72, ram: 2048, smp: 2, mode: net}
          - {id: 22, cpu: cortex-a72, ram: 4096, smp: 4, mode: net}
          - {id: 23, cpu: cortex-a72, ram: 2048, smp: 2, mode: rng}
          - {id: 24, cpu: cortex-a72, ram: 4096, smp: 4, mode: rng}
          - {id: 25, cpu: cortex-a72, ram: 3072, smp: 2, mode: fullhw}
          - {id: 26, cpu: cortex-a72, ram: 4096, smp: 4, mode: fullhw}
          - {id: 27, cpu: max, ram: 4096, smp: 4, mode: fullhw}
          - {id: 28, cpu: cortex-a72, ram: 3072, smp: 2, mode: qemu-noverity}
          - {id: 29, cpu: cortex-a72, ram: 4096, smp: 4, mode: qemu-noverity}
          - {id: 30, cpu: max, ram: 4096, smp: 4, mode: qemu-noverity}
    steps:
      - name: Install runtime and Android ARM64 image
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm unzip curl default-jre-headless gdisk e2fsprogs util-linux >/dev/null
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          curl -fLsS --retry 2 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/android-tools
          cp -a /tmp/android-tools/cmdline-tools/. "$HOME/android-sdk/cmdline-tools/latest/"
          export ANDROID_HOME="$HOME/android-sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-30;default;arm64-v8a" >/dev/null
          DIR="$ANDROID_HOME/system-images/android-30/default/arm64-v8a"
          gzip -dc "$DIR/kernel-ranchu" > /tmp/android-Image
          echo "ANDROID_DIR=$DIR" >> "$GITHUB_ENV"
      - name: Build known-good metadata first topology
        run: |
          set -euo pipefail
          truncate -s 192M /tmp/meta.img
          sgdisk -o /tmp/meta.img >/dev/null
          sgdisk -n 1:2048:0 -c 1:metadata /tmp/meta.img >/dev/null
          LOOP=$(sudo losetup --find --show --partscan /tmp/meta.img)
          sleep 1
          sudo mkfs.ext4 -F -L metadata "${LOOP}p1" >/dev/null
          sudo losetup -d "$LOOP"
      - name: Prepare variant and boot Android framework
        run: |
          set +e
          MODE='${{ matrix.mode }}'
          EXTRA=''
          DEVICES=''
          USERIMG="$ANDROID_DIR/userdata.img"
          case "$MODE" in
            qemu) EXTRA='qemu=1 androidboot.qemu=1 androidboot.serialno=EMULATOR30' ;;
            noverity) EXTRA='androidboot.veritymode=disabled androidboot.verifiedbootstate=orange' ;;
            slot) EXTRA='androidboot.slot_suffix=_a androidboot.slot=a' ;;
            freshdata2) truncate -s 2G /tmp/userdata.img; mkfs.ext4 -F -L data /tmp/userdata.img >/dev/null; USERIMG=/tmp/userdata.img ;;
            freshdata4) truncate -s 4G /tmp/userdata.img; mkfs.ext4 -F -L data /tmp/userdata.img >/dev/null; USERIMG=/tmp/userdata.img ;;
            gpu) DEVICES='-device virtio-gpu-pci' ;;
            net) DEVICES='-netdev user,id=n0 -device virtio-net-device,netdev=n0' ;;
            rng) DEVICES='-object rng-random,filename=/dev/urandom,id=r0 -device virtio-rng-device,rng=r0' ;;
            fullhw) DEVICES='-device virtio-gpu-pci -netdev user,id=n0 -device virtio-net-device,netdev=n0 -object rng-random,filename=/dev/urandom,id=r0 -device virtio-rng-device,rng=r0'; EXTRA='qemu=1 androidboot.qemu=1 androidboot.serialno=EMULATOR30 androidboot.veritymode=disabled androidboot.verifiedbootstate=orange' ;;
            qemu-noverity) EXTRA='qemu=1 androidboot.qemu=1 androidboot.serialno=EMULATOR30 androidboot.veritymode=disabled androidboot.verifiedbootstate=orange' ;;
          esac
          timeout 175 qemu-system-aarch64 \
            -machine virt \
            -cpu ${{ matrix.cpu }} \
            -m ${{ matrix.ram }} \
            -smp ${{ matrix.smp }} \
            -accel tcg \
            -nographic -no-reboot \
            -kernel /tmp/android-Image \
            -initrd "$ANDROID_DIR/ramdisk.img" \
            -drive if=none,file=/tmp/meta.img,format=raw,id=metadata -device virtio-blk-device,drive=metadata \
            -drive if=none,file="$ANDROID_DIR/system.img",format=raw,readonly=on,id=system -device virtio-blk-device,drive=system \
            -drive if=none,file="$ANDROID_DIR/vendor.img",format=raw,readonly=on,id=vendor -device virtio-blk-device,drive=vendor \
            -drive if=none,file="$USERIMG",format=raw,id=userdata -device virtio-blk-device,drive=userdata \
            $DEVICES \
            -append "console=ttyAMA0 androidboot.console=ttyAMA0 androidboot.hardware=ranchu androidboot.selinux=permissive root=/dev/ram0 rw $EXTRA" \
            > /tmp/android-qemu.log 2>&1
          grep -E 'init second stage|SystemServer|system_server|ActivityManager|PackageManager|SurfaceFlinger|boot_completed|BOOT_COMPLETED|zygote|Fatal signal|crash_dump|linker|CANNOT LINK|servicemanager|hwservicemanager|apexd|vold|netd' /tmp/android-qemu.log | tail -180 || true
          if grep -Eq 'BOOT_COMPLETED|boot_completed|ActivityManager.*Start proc|SystemServer.*Start|system_server' /tmp/android-qemu.log; then echo RESULT=FRAMEWORK_ADVANCED; exit 0; fi
          if grep -Eq 'starting service .zygote.|Created socket .*/zygote' /tmp/android-qemu.log; then echo RESULT=ZYGOTE_REACHED; exit 1; fi
          if grep -q 'init second stage started' /tmp/android-qemu.log; then echo RESULT=SECOND_STAGE_ONLY; exit 1; fi
          echo RESULT=EARLY_FAIL
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-framework-case-${{ matrix.id }}
          path: /tmp/android-qemu.log
          if-no-files-found: warn
          retention-days: 3
