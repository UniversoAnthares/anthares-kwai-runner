name: TikTok Cloud Secret Presence

on:
  push:
    branches: [main]
    paths:
      - '.tiktok-cloud-secret-presence-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_UPLOADS_ROOT: ${{ secrets.FTP_UPLOADS_ROOT }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_TLS: ${{ secrets.FTP_TLS }}
    steps:
      - name: Report only secret presence booleans
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          keys=['WP_SITE_URL','WP_USERNAME','WP_APP_PASSWORD','YOUTUBE_COOKIES','FTP_HOST','FTP_USERNAME','FTP_PASSWORD','FTP_UPLOADS_ROOT','FTP_PORT','FTP_TLS']
          print(json.dumps({'SECRET_PRESENT':{k:bool(str(os.environ.get(k) or '').strip()) for k in keys}},sort_keys=True))
          PY
