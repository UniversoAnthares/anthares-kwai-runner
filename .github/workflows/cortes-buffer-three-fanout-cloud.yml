name: CORTES 3 independent networks - all shorts cloud fanout
on:
  schedule:
    # 07h23, 13h23, 19h23 America/Campo_Grande; bounded daily fanout.
    - cron: '23 11,17,23 * * *'
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: 'Read source and candidate counts without enqueuing anything'
        type: boolean
        required: false
        default: true
  push:
    branches: [main]
    paths:
      - tools/cortes_buffer_three_fanout.py
      - tests/test_three_network_fanout_daily.py
      - .github/workflows/cortes-buffer-three-fanout-cloud.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-buffer-three-priority-fanout
  cancel-in-progress: false
jobs:
  enqueue:
    # Production Neon Functions and Vercel share one durable destination ledger.
    if: ${{ vars.CORTES_BUFFER_FANOUT_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      RUNNER_ENVIRONMENT: github-hosted
      WP_SITE_URL: ${{ secrets.WP_QA_SITE_URL || secrets.WP_SITE_URL }}
      WP_USERNAME: ${{ secrets.WP_QA_USERNAME || secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_QA_APP_PASSWORD || secrets.WP_APP_PASSWORD }}
      CORTES_FANOUT_DIAGNOSE_ONLY: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.diagnose_only)) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enqueue all eligible short masters independently for Instagram Pinterest LinkedIn
        run: |
          set -euo pipefail
          python -m py_compile tools/cortes_buffer_three_fanout.py anthares_publisher/buffer_distribution.py
          python -m unittest discover -s tests -p 'test_three_network_fanout_daily.py' -v
          python -u tools/cortes_buffer_three_fanout.py
