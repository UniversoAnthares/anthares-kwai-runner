name: ARA infra durability tests

on:
  push:
    branches: [feature/ara-infra]
    paths:
      - 'infra/ara_state_store.py'
      - 'tests/test_ara_state_store.py'
      - '.github/workflows/ara-infra-tests.yml'
  workflow_dispatch:

jobs:
  durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic queue tests
        run: python -m unittest -v tests.test_ara_state_store
      - name: Syntax compile
        run: python -m py_compile infra/ara_state_store.py
