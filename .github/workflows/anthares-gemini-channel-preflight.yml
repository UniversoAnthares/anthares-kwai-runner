name: Anthares Gemini remote secret channel preflight
on:
  push:
    branches: [test/anthares-bws-write-capability-20261019]
    paths: ['.github/workflows/anthares-gemini-channel-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - name: Verify WordPress SSH channel with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITLAB_TOKEN" || { echo "GITLAB_PAT_MISSING"; exit 2; }
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,tempfile,pathlib,subprocess,sys
          stage='GITLAB_VARIABLES'
          try:
              d={}
              for name in ('ANTHARES_QA_SSH_HOST','ANTHARES_QA_SSH_USER','ANTHARES_QA_SSH_PORT','ANTHARES_QA_SSH_KEY'):
                  url='https://gitlab.com/api/v4/projects/87361776/variables/'+name
                  req=urllib.request.Request(url,headers={'PRIVATE-TOKEN':os.environ['GITLAB_TOKEN']})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      v=json.load(r)
                  if not isinstance(v.get('value'),str) or not v['value']: raise ValueError('MISSING_PROTECTED_VAR')
                  d[name]=v['value']
              print('GITLAB_SSH_SECRET_METADATA=PASS',flush=True)
              stage='PIN_HOST'
              with tempfile.TemporaryDirectory(prefix='anthares-qa-ssh-') as tmp:
                  private=pathlib.Path(tmp,'id_ed25519')
                  private.write_text(d['ANTHARES_QA_SSH_KEY'].replace('\r\n','\n').strip()+'\n')
                  private.chmod(0o600)
                  host=d['ANTHARES_QA_SSH_HOST'];port=d['ANTHARES_QA_SSH_PORT']
                  scan=subprocess.run(['ssh-keyscan','-T','12','-p',port,'-t','ed25519',host],capture_output=True,text=True,timeout=20)
                  if scan.returncode!=0 or not scan.stdout.strip():raise RuntimeError('NO_HOST_KEY')
                  known=pathlib.Path(tmp,'known_hosts')
                  known.write_text(scan.stdout)
                  fp=subprocess.run(['ssh-keygen','-lf',str(known),'-E','sha256'],capture_output=True,text=True,timeout=7)
                  expected='SHA256:G82n00KCkTp01cLSOaTFtg1CY9CBNJL5+kwGEEQ3NMM'
                  if fp.returncode!=0 or expected not in fp.stdout:raise RuntimeError('PINNED_HOST_IDENTITY_MISMATCH')
                  print('SSH_HOST_IDENTITY_PIN=PASS',flush=True)
                  stage='AUTHENTICATED_SSH'
                  cmd=['ssh','-p',port,'-i',str(private),'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=10',d['ANTHARES_QA_SSH_USER']+'@'+host,"test -f ~/domains/anthares.us/public_html/wp-config.php && test -x /opt/alt/php82/usr/bin/php && echo SSH_AUTHENTICATED_PRODUCTION=PASS"]
                  probe=subprocess.run(cmd,capture_output=True,text=True,timeout=24)
                  if probe.returncode!=0 or 'SSH_AUTHENTICATED_PRODUCTION=PASS' not in probe.stdout:raise RuntimeError('HOSTING_AUTH_FAILED')
                  print('WORDPRESS_REMOTE_CHANNEL=PASS',flush=True)
          except Exception as exc:
              print('REMOTE_PREFLIGHT_FAILURE_STAGE='+stage,flush=True)
              print('REMOTE_PREFLIGHT_ERROR_TYPE='+type(exc).__name__,flush=True)
              sys.exit(1)
          PY
