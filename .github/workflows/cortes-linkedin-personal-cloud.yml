name: CORTES LinkedIn personal - standby hosted publisher
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      reconcile_only:
        description: "Reconcile existing personal posts by public URL only; never upload"
        type: boolean
        default: false
  workflow_run:
    workflows: ["CORTES LinkedIn personal - primary hosted cloud publisher"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
  actions: read
concurrency:
  # Isolate manual, scheduled and workflow_run pending queues. A successful
  # primary completion cannot cancel an authorized manual redundancy test.
  group: cortes-linkedin-personal-standby-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  publish-one:
    if: ${{ vars.CORTES_LINKEDIN_PERSONAL_PAUSED != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decide whether primary cloud publisher is healthy
        id: primary-health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORTES_STANDBY_EVENT: ${{ github.event_name }}
        run: |
          python -u -m tools.cortes_linkedin_fallback_gate
      - name: Read personal member token from Bitwarden Secrets Manager
        if: steps.primary-health.outputs.run == 'true' || (github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true)
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            bd261e5e-11bf-49fb-9baf-b4ea014ec5b7 > LINKEDIN_PERSONAL_ACCESS_TOKEN
      - name: Reconcile accepted personal post by authenticated public readback only
        if: github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
        run: |
          set -euo pipefail
          python -u -c 'from tools.cortes_linkedin_personal_cloud import reconcile_personal; n = reconcile_personal(); print("PERSONAL_READBACK_ONLY_RECONCILED="+str(n), flush=True); assert n > 0, "PERSONAL_READBACK_PENDING"'
      - name: Execute exactly one personal video publication, fenced and quota-scoped
        if: steps.primary-health.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true)
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
        run: |
          set -euo pipefail
          python -u -m tools.cortes_linkedin_personal_cloud
