name: One-time TikTok @universo.anthares publish preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tiktok-universo-publish-preflight-once.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Preserve active TikTok Chromium state and verify posting requirements without publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse
          root='https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run'
          token=os.getenv('ARA_SHARED','')
          if len(token)<20:raise SystemExit('AUTH_NOT_AVAILABLE')
          h={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'Anthares-TikTok-Preflight/1.0'}
          def call(path,method='GET',data=None,timeout=40):
              headers=dict(h)
              payload=json.dumps(data).encode() if data is not None else None
              if data is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(root+path,method=method,data=payload,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      body=json.loads(r.read(500000))
                      return r.status,body if isinstance(body,dict) else {}
              except urllib.error.HTTPError as ex:
                  try:d=json.loads(ex.read(25000))
                  except:d={}
                  return ex.code,d if isinstance(d,dict) else {}
              except Exception as ex:
                  return 0,{'error':type(ex).__name__}
          for path in ['/health','/config-status','/session-status','/interactive-browser/status']:
              code,d=call(path,timeout=25)
              label=path.strip('/').replace('/','_').replace('-','_').upper()
              print(label+'_HTTP='+str(code))
              print(label+'_OK='+str(bool(d.get('ok'))))
              for key in ('active','responsive','identity_verified','bootstrapped','ready_for_tiktok','drag_backend','provider','expected_tiktok_username','account','session_bootstrapped'):
                  if key in d:
                      val=d.get(key)
                      if isinstance(val,(bool,int,float)) or (key in ('drag_backend','provider','account','expected_tiktok_username') and isinstance(val,str)):
                          print(label+'_'+key.upper()+'='+str(val)[:85])
          code,st=call('/interactive-browser/status')
          if code==200 and st.get('active') and st.get('responsive'):
              code,saved=call('/interactive-browser/save-vault','POST',{},timeout=45)
              print('SAVE_VAULT_HTTP='+str(code))
              print('SAVE_VAULT_PERSISTED='+str(bool(saved.get('persisted'))))
              print('SAVE_VAULT_COOKIES='+str(saved.get('cookie_count',0)))
          else:print('SAVE_VAULT_SKIPPED_INACTIVE=1')
          code,pr=call('/publish-dry-run','POST',{'test':'08'},timeout=20)
          print('PUBLISH_DRY_RUN_HTTP='+str(code))
          print('PUBLISH_DRY_RUN_OK='+str(bool(pr.get('ok'))))
          print('PUBLISH_DRY_RUN_IDENTITY='+str(bool(pr.get('identity_verified'))))
          code,profile=call('/profile-inventory',timeout=100)
          print('PROFILE_INVENTORY_HTTP='+str(code))
          print('PROFILE_INVENTORY_OK='+str(bool(profile.get('ok'))))
          print('PROFILE_INVENTORY_ACCOUNT='+str(profile.get('account',''))[:90])
          print('PROFILE_INVENTORY_COUNT='+str(profile.get('count',0)))
          items=profile.get('items') or []
          title='O Conceito de Comédia para Aristóteles'
          matched=[x for x in items if title.casefold() in str(x.get('text','')).casefold()]
          print('CANDIDATE_TITLE_ALREADY_PUBLISHED='+str(bool(matched)))
          for item in matched[:2]:print('EXISTING_PUBLIC_URL='+str(item.get('url',''))[:190])
          url='https://anthares.us/wp-content/uploads/anthares-clips/2026/10/short_9CIk-I_3VhM_g1_6619_6657.mp4'
          request=urllib.request.Request(url,headers={'Range':'bytes=0-4095','User-Agent':'Anthares-Media-ReadOnly/1.0'})
          try:
              with urllib.request.urlopen(request,timeout=25) as response:
                  chunk=response.read(4096)
                  print('MEDIA_HTTP='+str(response.status))
                  print('MEDIA_TYPE='+str(response.headers.get('Content-Type',''))[:80])
                  print('MEDIA_FIRST_BYTES_MP4='+str(b'ftyp' in chunk[:80]))
                  print('MEDIA_CONTENT_RANGE='+str(response.headers.get('Content-Range',''))[:80])
          except urllib.error.HTTPError as e:print('MEDIA_HTTP='+str(e.code))
          except Exception as e:print('MEDIA_ERROR='+type(e).__name__)
          print('PREFLIGHT_ONLY_NO_PUBLICATION=1')
          PY
