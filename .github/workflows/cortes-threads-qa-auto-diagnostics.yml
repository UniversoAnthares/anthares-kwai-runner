name: CORTES Threads P0 QA automatic diagnostic and safe repair
on:
  workflow_dispatch:
    inputs:
      incident:
        description: 'Sanitized error category'
        required: true
        type: string
      source_run:
        description: 'GitHub Actions run ID'
        required: false
        type: string
  workflow_run:
    workflows:
      - 'CORTES Threads Cloud Handoff (fenced)'
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - tools/cortes_threads_qa_auto_diagnostic.mjs
      - tools/cortes_threads_failure_reporter.mjs
      - .github/workflows/cortes-threads-qa-auto-diagnostics.yml
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: cortes-threads-qa-p0-diagnostics
  cancel-in-progress: false
jobs:
  monitor:
    # Avoid reacting to healthy completed deployments in the workflow_run path.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      THREADS_QA_INCIDENT: ${{ inputs.incident || github.event_name }}
      THREADS_QA_SOURCE_RUN: ${{ inputs.source_run || github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent QA scripts
        run: |
          node --check tools/cortes_threads_qa_auto_diagnostic.mjs
          node --check tools/cortes_threads_failure_reporter.mjs
      - name: Diagnose and perform permitted fail-safe repairs
        run: node tools/cortes_threads_qa_auto_diagnostic.mjs
