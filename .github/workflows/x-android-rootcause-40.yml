name: Android boot root-cause matrix 40
on:
  push:
    branches: [feature/x-native-live-android-bridge]
    paths: [.github/workflows/x-android-rootcause-40.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        include:
          - variant: 1
            api: 30
            target: google_apis
            accel: auto
            gpu: swiftshader_indirect
          - variant: 2
            api: 30
            target: google_apis
            accel: auto
            gpu: off
          - variant: 3
            api: 30
            target: google_apis
            accel: true
            gpu: swiftshader_indirect
          - variant: 4
            api: 30
            target: google_apis
            accel: true
            gpu: off
          - variant: 5
            api: 30
            target: default
            accel: auto
            gpu: swiftshader_indirect
          - variant: 6
            api: 30
            target: default
            accel: auto
            gpu: off
          - variant: 7
            api: 30
            target: default
            accel: true
            gpu: swiftshader_indirect
          - variant: 8
            api: 30
            target: default
            accel: true
            gpu: off
          - variant: 9
            api: 31
            target: google_apis
            accel: auto
            gpu: swiftshader_indirect
          - variant: 10
            api: 31
            target: google_apis
            accel: auto
            gpu: off
          - variant: 11
            api: 31
            target: google_apis
            accel: true
            gpu: swiftshader_indirect
          - variant: 12
            api: 31
            target: google_apis
            accel: true
            gpu: off
          - variant: 13
            api: 31
            target: default
            accel: auto
            gpu: swiftshader_indirect
          - variant: 14
            api: 31
            target: default
            accel: auto
            gpu: off
          - variant: 15
            api: 31
            target: default
            accel: true
            gpu: swiftshader_indirect
          - variant: 16
            api: 31
            target: default
            accel: true
            gpu: off
          - variant: 17
            api: 32
            target: google_apis
            accel: auto
            gpu: swiftshader_indirect
          - variant: 18
            api: 32
            target: google_apis
            accel: auto
            gpu: off
          - variant: 19
            api: 32
            target: google_apis
            accel: true
            gpu: swiftshader_indirect
          - variant: 20
            api: 32
            target: google_apis
            accel: true
            gpu: off
          - variant: 21
            api: 32
            target: default
            accel: auto
            gpu: swiftshader_indirect
          - variant: 22
            api: 32
            target: default
            accel: auto
            gpu: off
