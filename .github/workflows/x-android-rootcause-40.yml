            target: default
            accel: true
            gpu: swiftshader_indirect
          - variant: 40
            api: 34
            target: default
            accel: true
            gpu: off
    steps:
      - uses: actions/checkout@v4
      - name: Capture host KVM and SDK prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          uname -a | tee evidence/host.txt
          ls -l /dev/kvm 2>&1 | tee -a evidence/host.txt || true
          df -h . | tee -a evidence/host.txt
          free -h | tee -a evidence/host.txt
      - name: Enable KVM for GitHub hosted runner
        if: matrix.accel == 'auto'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and prove adb readiness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_5
          disable-linux-hw-accel: ${{ matrix.accel }}
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -Eeuo pipefail
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
            adb shell getprop ro.product.cpu.abi | grep -q 'x86_64'
            adb shell pm path com.android.settings
            adb shell input keyevent KEYCODE_HOME
            echo ANDROID_BOOT_VERIFIED
      - name: Save failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-rootcause-${{ matrix.variant }}-${{ github.run_id }}
          path: evidence/
          retention-days: 2
          if-no-files-found: ignore
