            target: default
            accel: true
            gpu: off
          - variant: 25
            api: 33
            target: google_apis
            accel: auto
            gpu: swiftshader_indirect
          - variant: 26
            api: 33
            target: google_apis
            accel: auto
            gpu: off
          - variant: 27
            api: 33
            target: google_apis
            accel: true
            gpu: swiftshader_indirect
          - variant: 28
            api: 33
            target: google_apis
            accel: true
            gpu: off
          - variant: 29
            api: 33
            target: default
            accel: auto
