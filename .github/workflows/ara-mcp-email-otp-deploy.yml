name: ARA MCP Email OTP Deploy
# Legacy Email OTP authorization is retired in production.
# Recovery-only, deliberately manual. Do not auto-deploy over GitHub owner OAuth.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact reviewed Git SHA from main history'
        required: true
        type: string
      incident_ref:
        description: 'Required incident authorizing legacy Email OTP recovery'
        required: true
        type: string
      acknowledge_legacy_recovery:
        description: 'I authorize replacing the active owner OAuth gateway'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: anthares-ara-mcp-reviewed-claude-delegation
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.acknowledge_legacy_recovery == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce approved legacy recovery intent
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test -n "$INCIDENT_REF" || exit 1
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || exit 1
          main_sha="$(curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$RELEASE_SHA" "$main_sha" || exit 1
          echo "ARA_MCP_LEGACY_EMERGENCY_APPROVED=$RELEASE_SHA"
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-ara-mcp/src/index.js
          grep -q "oauth_owner_code_mode:'email_otp'" cloudflare-ara-mcp/src/index.js
          ! grep -q 'OWNER_APPROVAL_HASH' cloudflare-ara-mcp/src/index.js
          grep -q 'AUTH_EMAIL_SEND' cloudflare-ara-mcp/src/index.js
      - name: Deploy MCP gateway
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cd cloudflare-ara-mcp
          npx --yes wrangler@4.43.0 deploy
      - name: Verify deployed health metadata
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS --max-time 20 https://anthares-ara-mcp.anthares1.workers.dev/health -o /tmp/health.json
          cat /tmp/health.json
          grep -q '"oauth_owner_code_mode":"email_otp"' /tmp/health.json
          echo 'ARA_MCP_EMAIL_OTP_DEPLOY_OK=1'
