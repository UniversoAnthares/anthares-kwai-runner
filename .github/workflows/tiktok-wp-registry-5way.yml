name: TikTok WP Registry 5-Way
on:
  push:
    paths: ['.github/workflows/tiktok-wp-registry-5way.yml']
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [guid, attachment_link, www_host, http_origin, rest_context]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe registry reference
        env:
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          h={'User-Agent':'Mozilla/5.0 AntharesRegistryProbe/1'}
          api='https://anthares.us/wp-json/wp/v2/media?media_type=video&per_page=1&orderby=date&order=desc'
          with urllib.request.urlopen(urllib.request.Request(api,headers=h),timeout=25) as r: x=json.load(r)[0]
          mode=os.environ['MODE']; src=x.get('source_url',''); target=''
          if mode=='guid': target=(x.get('guid') or {}).get('rendered','')
          elif mode=='attachment_link': target=x.get('link','')
          elif mode=='www_host':
            z=urllib.parse.urlsplit(src); target=urllib.parse.urlunsplit((z.scheme,'www.anthares.us',z.path,z.query,z.fragment))
          elif mode=='http_origin':
            z=urllib.parse.urlsplit(src); target=urllib.parse.urlunsplit(('http',z.netloc,z.path,z.query,z.fragment))
          elif mode=='rest_context': target='https://anthares.us/wp-json/wp/v2/media/'+str(x['id'])+'?context=view'
          print('MODE',mode,'MEDIA_ID',x.get('id'),'TARGET',target)
          if not target: print('REGISTRY_TARGET=ABSENT'); raise SystemExit(2)
          try:
            with urllib.request.urlopen(urllib.request.Request(target,headers=h),timeout=30) as r:
              b=r.read(131072); ct=r.headers.get('Content-Type',''); final=r.geturl()
              print('HTTP',r.status,'CT',ct,'BYTES',len(b),'FINAL',final)
              if ('video/' in ct and len(b)>=1024): print('WP_REGISTRY_VIDEO=PROVEN',mode)
              elif mode in ('attachment_link','rest_context') and r.status==200:
                body=b.decode('utf8','ignore')
                refs=[v for v in (src,(x.get('guid') or {}).get('rendered','')) if v and v in body]
                print('REGISTRY_REFERENCE_COUNT',len(refs))
                if refs: print('WP_REGISTRY_REFERENCE=PROVEN',mode)
                else: raise SystemExit(2)
              else: raise SystemExit(2)
          except urllib.error.HTTPError as e:
            print('HTTP_ERROR',e.code); raise
          PY
