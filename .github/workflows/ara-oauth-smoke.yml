name: ARA OAuth Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ara-oauth-smoke.yml'
permissions:
  contents: read
jobs:
  oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify authorization page no longer depends on Windows clipboard
        shell: bash
        run: |
          set -euo pipefail
          challenge='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          code="$(curl -sS -o /tmp/oauth-body -w '%{http_code}' -G 'https://anthares-ara-mcp.anthares1.workers.dev/oauth/authorize' \
            --data-urlencode 'client_id=https://chatgpt.com/oauth/client.json' \
            --data-urlencode 'redirect_uri=https://chatgpt.com/connector_platform_oauth_redirect' \
            --data-urlencode 'response_type=code' \
            --data-urlencode "code_challenge=$challenge" \
            --data-urlencode 'code_challenge_method=S256' \
            --data-urlencode 'resource=https://anthares-ara-mcp.anthares1.workers.dev' \
            --data-urlencode 'scope=ara.read ara.write' \
            --data-urlencode 'state=smoke')"
          echo "HTTP=$code"
          cat /tmp/oauth-body
          echo
          test "$code" = 200
          grep -q 'código de configuração fornecido na conversa' /tmp/oauth-body
          grep -q 'name="approval"' /tmp/oauth-body
          if grep -q 'área de transferência do agente remoto' /tmp/oauth-body; then
            echo 'legacy clipboard flow still present'
            exit 1
          fi
          echo 'ARA_OAUTH_OWNER_CODE_PAGE_OK=1'
