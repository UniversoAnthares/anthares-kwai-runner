name: Kwai ARM64 Known Good Data Zygote Matrix 40
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/anthares-stage4-known-good-data-40.yml'
permissions:
  contents: read
jobs:
  matrix40:
    name: "${{ matrix.family }}-${{ matrix.variant }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        family: [control, seedauto, repair, hardware, props]
        variant: [0,1,2,3,4,5,6,7]
    steps:
      - name: Install ARM64 Android runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm unzip curl default-jre-headless gdisk e2fsprogs util-linux file >/dev/null
          rm -rf /tmp/android-tools "$HOME/android-sdk"
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          curl -fLsS --retry 3 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/android-tools
          cp -a /tmp/android-tools/cmdline-tools/. "$HOME/android-sdk/cmdline-tools/latest/"
          export ANDROID_HOME="$HOME/android-sdk"
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null) || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-30;default;arm64-v8a" >/dev/null
          DIR="$ANDROID_HOME/system-images/android-30/default/arm64-v8a"
          gzip -dc "$DIR/kernel-ranchu" > /tmp/android-Image
          test -s /tmp/android-Image
          echo "ANDROID_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build known-good metadata and inspect original userdata
        run: |
          set -euo pipefail
          truncate -s 192M /tmp/meta.img
          sgdisk -o /tmp/meta.img >/dev/null
          sgdisk -n 1:2048:0 -c 1:metadata /tmp/meta.img >/dev/null
          L=$(sudo losetup --find --show --partscan /tmp/meta.img)
          sleep 1
          sudo mkfs.ext4 -F -L metadata "${L}p1" >/dev/null
          sudo losetup -d "$L"
          cp --reflink=auto "$ANDROID_DIR/userdata.img" /tmp/userdata-work.img
          {
            echo '=== userdata file ==='
            file /tmp/userdata-work.img || true
            echo '=== sgdisk ==='
            sgdisk -p /tmp/userdata-work.img || true
            echo '=== blkid whole ==='
            blkid /tmp/userdata-work.img || true
          } | tee /tmp/userdata-inspect.txt

      - name: Prepare original userdata according to family
        run: |
          set +e
          FAMILY='${{ matrix.family }}'
          V=${{ matrix.variant }}
          TARGET=/tmp/userdata-work.img
          MNT=/tmp/data-mnt
          rm -rf "$MNT"; mkdir -p "$MNT"
          : > /tmp/prepare-data.txt
          echo "FAMILY=$FAMILY V=$V" | tee -a /tmp/prepare-data.txt

          find_fs() {
            if sudo mount -o loop,rw "$TARGET" "$MNT" 2>/tmp/mount-whole.err; then
              echo whole
              return 0
            fi
            LOOP=$(sudo losetup --find --show --partscan "$TARGET")
            echo "LOOP=$LOOP" >> /tmp/prepare-data.txt
            sleep 1
            for p in "${LOOP}"p*; do
              [ -e "$p" ] || continue
              echo "candidate=$p $(blkid "$p" 2>/dev/null)" >> /tmp/prepare-data.txt
              if sudo mount -o rw "$p" "$MNT" 2>/tmp/mount-part.err; then
                echo "$p"
                return 0
              fi
            done
            return 1
          }

          seed_dirs() {
            MODE="$1"
            sudo mkdir -p "$MNT/dalvik-cache/arm64" "$MNT/misc_de" "$MNT/misc_ce"
            if [ "$MODE" -ge 1 ]; then sudo mkdir -p "$MNT/system" "$MNT/system_ce" "$MNT/system_de"; fi
            if [ "$MODE" -ge 2 ]; then sudo mkdir -p "$MNT/user_de" "$MNT/user_ce" "$MNT/misc/profiles" "$MNT/misc/profiles/cur" "$MNT/misc/profiles/ref"; fi
            if [ "$MODE" -ge 3 ]; then sudo mkdir -p "$MNT/property" "$MNT/vendor" "$MNT/local" "$MNT/media"; fi
            PERM=771
            [ $((V % 2)) -eq 1 ] && PERM=711
            sudo chmod "$PERM" "$MNT/dalvik-cache" "$MNT/dalvik-cache/arm64" 2>/dev/null || true
            sudo chown -R 0:0 "$MNT/dalvik-cache" "$MNT/misc_de" "$MNT/misc_ce" 2>/dev/null || true
            sync
          }

          if [ "$FAMILY" = control ]; then
            echo PREP=control >> /tmp/prepare-data.txt
          elif [ "$FAMILY" = seedauto ] || [ "$FAMILY" = hardware ] || [ "$FAMILY" = props ]; then
            FSDEV=$(find_fs)
            RC=$?
            echo "FSDEV=$FSDEV RC=$RC" >> /tmp/prepare-data.txt
            if [ $RC -eq 0 ]; then
              seed_dirs $((V / 2))
              sudo umount "$MNT" || true
              [ -n "${LOOP:-}" ] && sudo losetup -d "$LOOP" || true
              echo PREP=seeded >> /tmp/prepare-data.txt
            else
              [ -n "${LOOP:-}" ] && sudo losetup -d "$LOOP" || true
              echo PREP=seed_failed >> /tmp/prepare-data.txt
            fi
          elif [ "$FAMILY" = repair ]; then
            FSDEV=$(find_fs)
            RC=$?
            echo "FSDEV=$FSDEV RC=$RC" >> /tmp/prepare-data.txt
            if [ $RC -eq 0 ]; then
              sudo umount "$MNT" || true
              if [[ "$FSDEV" == /dev/* ]]; then DEV="$FSDEV"; else DEV="$TARGET"; fi
              sudo e2fsck -fy "$DEV" >> /tmp/prepare-data.txt 2>&1 || true
              case $V in
                0|1) sudo tune2fs -L data "$DEV" >> /tmp/prepare-data.txt 2>&1 || true ;;
                2|3) sudo tune2fs -L userdata "$DEV" >> /tmp/prepare-data.txt 2>&1 || true ;;
                4|5) sudo tune2fs -O ^64bit,^metadata_csum "$DEV" >> /tmp/prepare-data.txt 2>&1 || true ;;
                6|7) sudo resize2fs "$DEV" >> /tmp/prepare-data.txt 2>&1 || true ;;
              esac
              sudo mount "$DEV" "$MNT" 2>/dev/null || sudo mount -o loop "$TARGET" "$MNT" 2>/dev/null || true
              mountpoint -q "$MNT" && seed_dirs 3
              mountpoint -q "$MNT" && sudo umount "$MNT" || true
              [ -n "${LOOP:-}" ] && sudo losetup -d "$LOOP" || true
              echo PREP=repaired >> /tmp/prepare-data.txt
            else
              [ -n "${LOOP:-}" ] && sudo losetup -d "$LOOP" || true
              echo PREP=repair_failed >> /tmp/prepare-data.txt
            fi
          fi
          cat /tmp/prepare-data.txt
          exit 0

      - name: Boot exact proven topology and classify
        run: |
          set +e
          FAMILY='${{ matrix.family }}'
          V=${{ matrix.variant }}
          if [ "$FAMILY" = control ]; then USERIMG="$ANDROID_DIR/userdata.img"; else USERIMG=/tmp/userdata-work.img; fi

          if [ $((V % 2)) -eq 0 ]; then MEM=3072; SMP=2; else MEM=4096; SMP=4; fi
          Q=(qemu-system-aarch64 -machine virt -cpu cortex-a72 -m "$MEM" -smp "$SMP" -accel tcg -nographic -no-reboot -kernel /tmp/android-Image -initrd "$ANDROID_DIR/ramdisk.img")
          add_mmio() { Q+=( -drive "if=none,file=$1,format=raw,id=$2${3:-}" -device "virtio-blk-device,drive=$2" ); }
          add_mmio /tmp/meta.img metadata ''
          add_mmio "$ANDROID_DIR/system.img" system ',readonly=on'
          add_mmio "$ANDROID_DIR/vendor.img" vendor ',readonly=on'
          add_mmio "$USERIMG" userdata ''

          CMD='console=ttyAMA0 androidboot.console=ttyAMA0 androidboot.hardware=ranchu androidboot.selinux=permissive root=/dev/ram0 rw'
          EXTRA=()
          if [ "$FAMILY" = control ]; then
            case $V in
              0|1) CMD="$CMD qemu=1 androidboot.qemu=1 androidboot.serialno=EMULATOR30" ;;
              2|3) EXTRA+=( -netdev user,id=n0 -device virtio-net-device,netdev=n0 ) ;;
              4) EXTRA+=( -device virtio-gpu-device ) ;;
              5) EXTRA+=( -object rng-random,filename=/dev/urandom,id=r0 -device virtio-rng-device,rng=r0 ) ;;
              6) CMD="$CMD qemu=1 androidboot.qemu=1"; EXTRA+=( -netdev user,id=n0 -device virtio-net-device,netdev=n0 ) ;;
              7) CMD="$CMD qemu=1 androidboot.qemu=1 androidboot.veritymode=disabled androidboot.verifiedbootstate=orange" ;;
            esac
          elif [ "$FAMILY" = hardware ]; then
            case $V in
              0) : ;;
              1) EXTRA+=( -device virtio-gpu-device ) ;;
              2) EXTRA+=( -device ramfb ) ;;
              3) EXTRA+=( -netdev user,id=n0 -device virtio-net-device,netdev=n0 ) ;;
              4) EXTRA+=( -object rng-random,filename=/dev/urandom,id=r0 -device virtio-rng-device,rng=r0 ) ;;
              5) EXTRA+=( -device virtio-gpu-device -netdev user,id=n0 -device virtio-net-device,netdev=n0 ) ;;
              6) EXTRA+=( -device ramfb -netdev user,id=n0 -device virtio-net-device,netdev=n0 ) ;;
              7) EXTRA+=( -device virtio-gpu-device -netdev user,id=n0 -device virtio-net-device,netdev=n0 -object rng-random,filename=/dev/urandom,id=r0 -device virtio-rng-device,rng=r0 ) ;;
            esac
          elif [ "$FAMILY" = props ]; then
            case $V in
              0) CMD="$CMD qemu=1 androidboot.qemu=1" ;;
              1) CMD="$CMD qemu=1 androidboot.qemu=1 androidboot.veritymode=disabled androidboot.verifiedbootstate=orange" ;;
              2) CMD="$CMD androidboot.force_normal_boot=1" ;;
              3) CMD="$CMD androidboot.slot_suffix=_a androidboot.slot=a" ;;
              4) CMD="$CMD qemu=1 androidboot.qemu=1 androidboot.force_normal_boot=1" ;;
              5) CMD="$CMD qemu=1 androidboot.qemu=1 androidboot.debuggable=1" ;;
              6) CMD="$CMD qemu=1 androidboot.qemu=1 androidboot.adb=1" ;;
              7) CMD="$CMD qemu=1 androidboot.qemu=1 androidboot.veritymode=disabled androidboot.force_normal_boot=1" ;;
            esac
          else
            CMD="$CMD qemu=1 androidboot.qemu=1 androidboot.serialno=EMULATOR30"
          fi
          Q+=( "${EXTRA[@]}" -append "$CMD" )
          printf 'QEMU_ARG=%q\n' "${Q[@]}" > /tmp/qemu-argv.txt
          timeout 175 "${Q[@]}" > /tmp/android-qemu.log 2>&1
          RC=$?

          ZSIG=$(grep -c "Service 'zygote'.*received signal" /tmp/android-qemu.log || true)
          SFCRASH=$(grep -c 'SurfaceFlinger::init\|surfaceflinger.*received signal\|Service .surfaceflinger.*received signal' /tmp/android-qemu.log || true)
          echo "QEMU_RC=$RC FAMILY=$FAMILY V=$V ZYGOTE_SIGNALS=$ZSIG SURFACE_CRASHES=$SFCRASH"
          grep -E 'init second stage|/data/misc_de|dalvik-cache|zygote|system_server|SystemServer|ActivityManager|PackageManager|SurfaceFlinger|surfaceflinger|BOOT_COMPLETED|boot_completed|Fatal signal|received signal|apexd-snapshotde' /tmp/android-qemu.log | tail -420 || true

          if grep -Eq 'sys.boot_completed.*1|BOOT_COMPLETED|PackageManagerService|ActivityManager.*system_server' /tmp/android-qemu.log; then echo RESULT=FRAMEWORK_READY; exit 0; fi
          if grep -q 'init second stage started' /tmp/android-qemu.log && [ "$ZSIG" -eq 0 ] && ! grep -q "Can't open /data/misc_de" /tmp/android-qemu.log; then echo RESULT=ZYGOTE_DATA_STABLE; exit 0; fi
          if grep -q 'init second stage started' /tmp/android-qemu.log && ! grep -q "Can't open /data/misc_de" /tmp/android-qemu.log; then echo RESULT=DATA_FIXED_NEXT_GATE; exit 0; fi
          if grep -q 'init second stage started' /tmp/android-qemu.log; then echo RESULT=SECOND_STAGE_DATA_BLOCKER; exit 1; fi
          echo RESULT=REGRESSION_BEFORE_SECOND_STAGE
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowngood40-${{ matrix.family }}-${{ matrix.variant }}
          path: |
            /tmp/android-qemu.log
            /tmp/qemu-argv.txt
            /tmp/userdata-inspect.txt
            /tmp/prepare-data.txt
            /tmp/mount-whole.err
            /tmp/mount-part.err
          if-no-files-found: warn
          retention-days: 3
