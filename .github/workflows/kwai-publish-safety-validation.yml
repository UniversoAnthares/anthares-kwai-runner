name: Kwai Publish Safety Validation
on:
  push:
    paths:
      - '.kwai-publish-safety-trigger'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and fail-closed invariants
        shell: bash
        run: |
          set -euo pipefail
          bash -n kwai_publish.sh kwai_queue_state.sh kwai_reconcile_uncertain.sh
          python3 -m py_compile kwai_publish_video.py kwai_verify_publication.py
          python3 - <<'PY'
          import os,sys,xml.etree.ElementTree as ET
          os.environ.update({
              "KWAI_VIDEO_TITLE":"fixture",
              "KWAI_MEDIA_NAME":"anthares-job12345-abcdef123456.mp4",
              "KWAI_ANDROID_VIDEO":"/sdcard/Movies/AntharesPublish/anthares-job12345-abcdef123456.mp4",
              "KWAI_QUEUE_JOB_ID":"job12345",
              "KWAI_MEDIA_SHA256":"abcdef1234567890",
          })
          sys.argv=["matcher-test","prepare"]
          import kwai_publish_video as k
          def root(*labels):
              nodes="".join(f'<node text="{x}" content-desc="" clickable="true" bounds="[0,200][100,300]" />' for x in labels)
              return ET.fromstring("<hierarchy>"+nodes+"</hierarchy>")
          assert len(k.gallery_identity_matches(root("camera","anthares-job12345-abcdef123456.mp4"),k.MEDIA_NAME,k.MEDIA_SHA,k.JOB_ID))==1
          assert len(k.gallery_identity_matches(root("camera","recent video"),k.MEDIA_NAME,k.MEDIA_SHA,k.JOB_ID))==0
          assert len(k.gallery_identity_matches(root("anthares-job12345-abcdef123456.mp4","abcdef123456"),k.MEDIA_NAME,k.MEDIA_SHA,k.JOB_ID))==2
          print("KWAI_GALLERY_MATCHER_BEHAVIOR_OK")
          PY
          grep -q 'KWAI_MEDIA_SHA256=' kwai_publish.sh
          grep -q '/sdcard/Movies/AntharesPublish/' kwai_publish.sh
          grep -q 'MEDIASTORE_MATCHES=1' kwai_publish.sh
          grep -q 'STATE=READY_TO_PUBLISH' kwai_publish_video.py
          grep -q 'STATE=GALLERY_MEDIA_IDENTITY_VERIFIED' kwai_publish_video.py
          grep -q 'gallery-media-identity-not-unique' kwai_publish_video.py
          ! grep -q 'candidates\[0\]' kwai_publish_video.py
          grep -q 'STATE=PUBLISH_REQUESTED' kwai_publish_video.py
          grep -q 'explicit-publish-phase-required' kwai_publish_video.py
          grep -q 'kwai_queue_state.sh started' kwai_publish.sh
          grep -q 'kwai_publish_video.py commit' kwai_publish.sh
          grep -q '/github-queue/$endpoint' kwai_queue_state.sh
          grep -q 'CONTROL_VERSION_MISMATCH' kwai_queue_state.sh
          grep -q 'reconcile)' kwai_queue_state.sh
          grep -q 'RECONCILIATION_EVIDENCE_MISSING' kwai_queue_state.sh
          grep -q 'QUEUE_RECONCILE_NOT_CONFIRMED' kwai_queue_state.sh
          grep -q 'kwai_verify_publication.py' kwai_reconcile_uncertain.sh
          grep -q 'kwai_queue_state.sh reconcile' kwai_reconcile_uncertain.sh
          ! grep -q 'kwai_publish_video.py' kwai_reconcile_uncertain.sh
          ! grep -qi 'input.*publish' kwai_reconcile_uncertain.sh
          grep -q 'STATE=UNCERTAIN' kwai_reconcile_uncertain.sh
          grep -q 'STATE=CONFIRMED SOURCE=RECONCILIATION' kwai_reconcile_uncertain.sh
          echo 'KWAI_UNCERTAIN_RECONCILE_STATIC_OK'
          grep -q '2026-10-05-queue-fencing-v16' kwai_queue_state.sh
          ! grep -q '2026-10-05-no-pc-confirmation-v12' kwai_queue_state.sh
          ! grep -q '2026-10-05-queue-lease-renew-v14' kwai_queue_state.sh
          grep -q 'QUEUE_STARTED_FLAG_MISSING' kwai_queue_state.sh
          grep -q 'KWAI_LEASE_GENERATION' kwai_queue_state.sh
          grep -q 'lease_generation' kwai_queue_state.sh
          grep -q "endpoint='renew'" kwai_queue_state.sh
          grep -q 'QUEUE_RENEW_GENERATION_MISSING' kwai_queue_state.sh
          ! grep -q '2026-10-05-queue-heartbeat-renew-v15' kwai_queue_state.sh
          echo 'KWAI_V16_FENCING_ADAPTER_STATIC_OK'
          grep -q 'KWAI_EXPECTED_ACCOUNT' kwai_verify_publication.py
          grep -q 'STATE=PROFILE_LOADING' kwai_verify_publication.py
          grep -q 'KWAI_PUBLICATION_SPECIFICALLY_VERIFIED' kwai_verify_publication.py
          grep -q 'KWAI_CONFIRMATION_EVIDENCE=' kwai_verify_publication.py
          grep -q 'kwai_queue_state.sh complete' kwai_publish.sh
          grep -q 'STATE=CONFIRMED' kwai_publish.sh
          ! grep -q 'KWAI_PUBLICATION_MARKER_VERIFIED' kwai_verify_publication.py
          ! grep -q 'just now.*sys.exit(0)' kwai_verify_publication.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('kwai_publish.sh').read_text()
          required=[
              'kwai_publish_video.py prepare',
              'kwai_queue_state.sh started',
              'kwai_publish_video.py commit',
              'kwai_verify_publication.py',
              'kwai_queue_state.sh complete',
              'STATE=CONFIRMED',
          ]
          pos=[s.index(x) for x in required]
          assert pos==sorted(pos), (required,pos)
          v=Path('kwai_publish_video.py').read_text()
          assert v.index('STATE=READY_TO_PUBLISH') < v.index('STATE=PUBLISH_REQUESTED')
          print('KWAI_STARTED_BEFORE_COMMIT_STATIC_OK')
          PY
          echo 'KWAI_PUBLISH_SAFETY_STATIC_OK'
