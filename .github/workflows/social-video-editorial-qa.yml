name: CORTES social video metadata and adapter QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'anthares_publisher/editorial.py'
      - 'anthares_publisher/media_model.py'
      - 'social_adapters/**'
      - 'scripts/instagram_autopublish.py'
      - 'tools/kwai_physical_queue_daemon.py'
      - 'direct-tiktok-publisher/tiktok_cloud_publish.py'
      - 'tests/test_social_video_editorial.py'
      - 'tests/test_media_model.py'
      - 'cloudflare-worker/patches/apply-publisher-target-v17.py'
      - 'vercel-ara-primary/api/cortes-queue.mjs'
      - 'tools/cortes_social_queue_consumer.py'
      - 'tools/cortes_buffer_linkedin_cloud.py'
      - 'tests/test_cortes_buffer_linkedin_cloud.py'
      - '.github/workflows/cortes-buffer-linkedin-cloud.yml'
      - 'tests/test_cortes_oidc_social_fanout.mjs'
      - '.github/workflows/social-video-editorial-qa.yml'

permissions:
  contents: read

jobs:
  read-only-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed publishers without running them
        run: |
          python -m py_compile social_adapters/buffer_three_channels.py anthares_publisher/editorial.py anthares_publisher/media_model.py social_adapters/direct_social.py social_adapters/video_social.py scripts/instagram_autopublish.py tools/kwai_physical_queue_daemon.py tools/cortes_social_queue_consumer.py direct-tiktok-publisher/tiktok_cloud_publish.py
      - name: Run idempotence, account and quota contracts without network calls
        run: |
          python -m unittest discover -s tests -p test_social_video_editorial.py -v
          python -m unittest discover -s tests -p test_buffer_three_channels.py -v
          python -m unittest discover -s tests -p test_cortes_buffer_linkedin_cloud.py -v
          python -m unittest discover -s tests -p test_media_model.py -v
          python tests/test_direct_social_adapters.py
      - name: Validate Cloudflare queue patch in disposable checkout only
        run: |
          python cloudflare-worker/patches/apply-publisher-target-v17.py
          node --experimental-default-type=module --check cloudflare-worker/src/index.js
          grep -q 'instagram:Number.MAX_SAFE_INTEGER,pinterest:Number.MAX_SAFE_INTEGER,linkedin:Number.MAX_SAFE_INTEGER' cloudflare-worker/src/index.js
          echo 'PINTEREST_ROUND_QUOTA_UNCAPPED=PASS'
      - name: Validate production Neon LinkedIn daily quota guard
        run: |
          node --check vercel-ara-primary/api/cortes-queue.mjs
          node tests/test_cortes_oidc_social_fanout.mjs
          grep -q 'cortes:linkedin-daily:' vercel-ara-primary/api/cortes-queue.mjs
          grep -q 'used>=50' vercel-ara-primary/api/cortes-queue.mjs
          echo 'NEON_LINKEDIN_DAILY_LIMIT_GUARDED=PASS'
