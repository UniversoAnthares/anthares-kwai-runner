name: ARA GitHub control diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ara-github-control-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ara-github-control-diagnostic
  cancel-in-progress: false

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe independent Windows administration channel
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ProgramData\AntharesRemoteAgent'
          $envFile = Join-Path $root 'agent-env.ps1'
          $report = [ordered]@{
            ok = $true
            device = $env:COMPUTERNAME
            windows = ($env:OS -eq 'Windows_NT')
            root_exists = (Test-Path $root)
            agent_exists = (Test-Path (Join-Path $root 'anthares-remote-agent.exe'))
            env_file_exists = (Test-Path $envFile)
            github_private_queue_credential = $false
            github_private_queue_access = $false
            source = 'none'
            render_required = $false
            cloudflare_required = $false
          }

          $token = $null
          if (Test-Path $envFile) {
            try {
              . $envFile
              if (-not [string]::IsNullOrWhiteSpace($env:ANTHARES_GITHUB_QUEUE_TOKEN)) {
                $token = $env:ANTHARES_GITHUB_QUEUE_TOKEN
                $report.source = 'agent-env'
              }
            } catch {}
          }

          if (-not $token) {
            try {
              $gh = Get-Command gh -ErrorAction Stop
              $candidate = (& $gh.Source auth token 2>$null | Select-Object -First 1)
              if (-not [string]::IsNullOrWhiteSpace($candidate)) {
                $token = [string]$candidate
                $report.source = 'gh-credential-store'
              }
            } catch {}
          }

          if (-not $token) {
            try {
              $env:GCM_INTERACTIVE = 'Never'
              $raw = "protocol=https`nhost=github.com`n`n" | git credential fill 2>$null
              $password = @($raw | Where-Object { $_ -like 'password=*' } | Select-Object -First 1)
              if ($password.Count -gt 0) {
                $token = ([string]$password[0]).Substring(9)
                $report.source = 'git-credential-store'
              }
            } catch {}
          }

          if ($token) {
            $report.github_private_queue_credential = $true
            try {
              $headers = @{
                Authorization = ('Bearer ' + $token)
                Accept = 'application/vnd.github+json'
                'X-GitHub-Api-Version' = '2022-11-28'
              }
              $repo = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/UniversoAnthares/anthares-ara-queue' -TimeoutSec 12
              $report.github_private_queue_access = ($repo.private -eq $true -and $repo.full_name -eq 'UniversoAnthares/anthares-ara-queue')
            } catch {}
          }
          $token = $null
          Remove-Item Env:ANTHARES_GITHUB_QUEUE_TOKEN -ErrorAction SilentlyContinue

          $report | ConvertTo-Json -Compress | Write-Output
          if (-not $report.windows -or -not $report.root_exists) { exit 21 }
          if (-not $report.github_private_queue_access) { exit 22 }
