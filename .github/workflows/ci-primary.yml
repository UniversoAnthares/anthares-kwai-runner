name: Anthares CI Primary

on:
  push:
    branches: [main]
    paths:
      - 'anthares-remote-agent/**'
      - 'tests/test_control_publisher_integration_final.py'
      - '.harness/**'
      - '.github/workflows/ci-primary.yml'
      - 'appveyor.yml'
      - 'azure-pipelines.yml'
      - 'cloudflare-ci/**'
  pull_request:
    branches: [main]
    paths:
      - 'anthares-remote-agent/**'
      - 'tests/test_control_publisher_integration_final.py'
      - '.harness/**'
      - '.github/workflows/ci-primary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anthares-ci-primary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-agent:
    name: Go agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: anthares-remote-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: anthares-remote-agent/go.mod
          cache: false
      - name: Report legacy formatting drift
        run: |
          bad="$(gofmt -l .)"
          if [ -n "$bad" ]; then
            echo 'Existing files needing gofmt:'
            printf '%s\n' "$bad"
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build Linux amd64
        run: go build -o agent-linux-amd64 ./cmd/agent
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: anthares-remote-agent-linux-amd64
          path: anthares-remote-agent/agent-linux-amd64
          if-no-files-found: error
          retention-days: 7

  control-publisher:
    name: Control publisher acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax check
        run: python -m compileall -q tests
      - name: Acceptance matrix
        shell: bash
        run: |
          set -euo pipefail
          for case in \
            happy \
            renew-then-publish \
            stale-start \
            stale-renew \
            stale-complete \
            crash-before-start \
            uncertain-no-republish \
            confirmed-idempotent \
            generation-rotates \
            duplicate-publisher-boundary
          do
            python tests/test_control_publisher_integration_final.py "$case"
          done
          echo GITHUB_CONTROL_PUBLISHER_OK
