name: Firebase Test Lab secondary proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prove Firebase Test Lab Android catalog
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project universo-anthares --quiet
          gcloud services describe testing.googleapis.com --format='value(state)'
          gcloud firebase test android models list --format='value(id)' --limit=10 | tee /tmp/models.txt
          test -s /tmp/models.txt
          echo "FIREBASE_TESTLAB_CATALOG_PROVEN=1"
