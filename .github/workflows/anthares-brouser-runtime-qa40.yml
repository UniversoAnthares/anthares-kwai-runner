name: Anthares-browser - 40 Runtime QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'anthares-brouser/**'
      - 'ci/shared/anthares-browser-runtime-qa.sh'
      - '.github/workflows/anthares-brouser-runtime-qa40.yml'

permissions:
  contents: read

concurrency:
  group: anthares-browser-runtime-qa40-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Make persistence restart graceful
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ci/shared/anthares-browser-runtime-qa.sh')
          s=p.read_text()
          old='  docker rm -f "$NAME" >/dev/null\n  start_container\n'
          new='  docker stop -t 10 "$NAME" >/dev/null\n  docker rm "$NAME" >/dev/null 2>&1 || true\n  sleep 0.5\n  start_container\n'
          if old not in s:
              raise SystemExit('QA_GRACEFUL_RESTART_PATCH_TARGET_MISSING')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Prove canonical Anthares Browser runtime
        shell: bash
        run: |
          set -euo pipefail
          export CI_PROVIDER=github_actions_public
          export CI_RUN_ID="${GITHUB_RUN_ID}"
          export CI_COMMIT_SHA="${GITHUB_SHA}"
          ANTHARES_BROWSER_QA_CASES=40 bash ci/shared/anthares-browser-runtime-qa.sh
