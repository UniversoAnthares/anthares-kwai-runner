name: Anthares-browser - 40 Runtime QA (GitHub fallback)

on:
  push:
    branches:
      - qa/anthares-browser-github-fallback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anthares_browser_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Anthares-browser canonical 40-case runtime proof
        env:
          CI_PROVIDER: github-fallback
          ANTHARES_BROWSER_QA_CASES: "40"
        run: |
          set -Eeuo pipefail
          bash ci/shared/anthares-browser-runtime-qa.sh
