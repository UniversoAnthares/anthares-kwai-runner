name: Anthares Executor QA

on:
  push:
    branches: [feature/anthares-executor-failover]
    paths:
      - 'anthares-executor/**'
      - 'anthares-reserva/**'
      - '.github/workflows/anthares-executor-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anthares-executor-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build portable executor
        run: docker build -f anthares-executor/Dockerfile -t anthares-executor:test .
      - name: Start executor without persistent credentials
        run: |
          docker run -d --name anthares-executor \
            --memory=1g --shm-size=256m \
            -e ANTHARES_EXECUTOR_TOKEN=qa-token-not-secret \
            -e KWAI_EXPECTED_ACCOUNT=lucasrosalem \
            -p 18080:8080 anthares-executor:test
          for i in $(seq 1 80); do
            curl -fsS http://127.0.0.1:18080/ready && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ready
      - name: Verify fail-closed authentication
        run: |
          test "$(curl -sS -o /tmp/noauth -w '%{http_code}' http://127.0.0.1:18080/v1/capabilities)" = 401
          curl -fsS -H 'Authorization: Bearer qa-token-not-secret' http://127.0.0.1:18080/v1/capabilities | tee /tmp/capabilities.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/capabilities.json'))
          assert d['ok'] is True and d['publishing_enabled'] is False and d['max_concurrency']==1
          PY
      - name: Real remote Kwai read-only probe
        run: |
          curl --fail-with-body --max-time 55 -sS \
            -H 'Authorization: Bearer qa-token-not-secret' \
            -H 'Content-Type: application/json' \
            -d '{"job_id":"github-qa-${{ github.run_id }}","generation":1,"handle":"lucasrosalem"}' \
            http://127.0.0.1:18080/v1/probe | tee /tmp/probe.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/probe.json'))
          assert d['ok'] is True
          assert d['read_only'] is True
          assert d['job_id'].startswith('github-qa-')
          assert 'identity_verified' in d and 'upload_surface_verified' in d
          print(json.dumps({k:d[k] for k in ('ok','identity_verified','upload_surface_verified','session_state','read_only')},separators=(',',':')))
          PY
      - name: Logs on failure
        if: failure()
        run: docker logs --tail 120 anthares-executor || true
      - name: Stop executor
        if: always()
        run: docker rm -f anthares-executor >/dev/null 2>&1 || true

  router:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build router
        run: docker build -f anthares-reserva/Dockerfile -t anthares-reserva:test .
      - name: Verify router authentication and empty-provider fail closed
        run: |
          docker run -d --name anthares-reserva -e ANTHARES_RESERVA_TOKEN=qa-router-token -e ANTHARES_PROVIDER_CONFIG='[]' -p 18081:8080 anthares-reserva:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18081/health && break; sleep 1; done
          test "$(curl -sS -o /tmp/noauth -w '%{http_code}' http://127.0.0.1:18081/v1/providers)" = 401
          curl --fail-with-body -sS -H 'Authorization: Bearer qa-router-token' -H 'Content-Type: application/json' \
            -d '{"job_id":"router-qa-${{ github.run_id }}","generation":1,"account":"lucasrosalem","operation":"kwai.readonly_probe"}' \
            http://127.0.0.1:18081/v1/dispatch | tee /tmp/router.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/router.json'))
          assert d['ok'] is False and d['status']=='failed'
          assert d['result']['error']=='no_healthy_provider'
          PY
      - name: Logs on failure
        if: failure()
        run: docker logs --tail 100 anthares-reserva || true
      - name: Stop router
        if: always()
        run: docker rm -f anthares-reserva >/dev/null 2>&1 || true

  restored-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_STATE_KEY: ${{ secrets.GITLAB_STATE_KEY }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check restore prerequisites without exposing secrets
        id: state
        run: |
          key=0; token=0
          if test -n "${GITLAB_STATE_KEY:-}" || test -n "${CONTROL_TOKEN:-}"; then key=1; fi
          if test -n "${GITLAB_TOKEN:-}"; then token=1; fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "STATE_KEY_AVAILABLE=$key"
          echo "GITLAB_TOKEN_AVAILABLE=$token"
      - name: Report safe migration gate
        if: steps.state.outputs.key != '1' || steps.state.outputs.token != '1'
        run: echo 'ANTHARES_RESTORE_GATE=BLOCKED_SECRET_MIGRATION'
      - name: Build restored executor
        if: steps.state.outputs.key == '1' && steps.state.outputs.token == '1'
        run: docker build -f anthares-executor/Dockerfile -t anthares-executor:restored .
      - name: Start with encrypted GitLab profile
        if: steps.state.outputs.key == '1' && steps.state.outputs.token == '1'
        run: |
          docker run -d --name anthares-executor-restored \
            --memory=2g --shm-size=256m \
            -e ANTHARES_EXECUTOR_TOKEN=qa-local-token \
            -e KWAI_EXPECTED_ACCOUNT=lucasrosalem \
            -e GITLAB_STATE_ENABLED=1 \
            -e GITLAB_STATE_PROJECT=87307279 \
            -e GITLAB_STATE_BRANCH=browser-state \
            -e GITLAB_STATE_SLOT=runtime \
            -e GITLAB_TOKEN="$GITLAB_TOKEN" \
            -e GITLAB_STATE_KEY="${GITLAB_STATE_KEY:-${CONTROL_TOKEN:-}}" \
            -p 18082:8080 anthares-executor:restored
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18082/ready >/tmp/ready.json; then break; fi
            if ! docker inspect -f '{{.State.Running}}' anthares-executor-restored 2>/dev/null | grep -q true; then docker logs --tail 80 anthares-executor-restored; exit 3; fi
            sleep 1
          done
          cat /tmp/ready.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ready.json')); s=d.get('state') or {}
          assert d.get('ok') is True and d.get('chromium') is True and s.get('ok') is True and s.get('generation'), (d,s)
          print('ANTHARES_ENCRYPTED_PROFILE_RESTORE=PASS')
          PY
      - name: Probe restored Kwai session read-only
        if: steps.state.outputs.key == '1' && steps.state.outputs.token == '1'
        run: |
          curl --fail-with-body --max-time 55 -sS -H 'Authorization: Bearer qa-local-token' -H 'Content-Type: application/json' \
            -d '{"job_id":"restored-${{ github.run_id }}","generation":1,"handle":"lucasrosalem"}' http://127.0.0.1:18082/v1/probe | tee /tmp/restored.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/restored.json'))
          print('ANTHARES_RESTORED_KWAI_PROBE='+json.dumps({k:d.get(k) for k in ('ok','identity_verified','upload_surface_verified','session_state','read_only')},separators=(',',':')))
          assert d.get('ok') is True
          PY
      - name: Logs on failure
        if: failure() && steps.state.outputs.key == '1' && steps.state.outputs.token == '1'
        run: docker logs --tail 120 anthares-executor-restored || true
      - name: Stop restored executor
        if: always()
        run: docker rm -f anthares-executor-restored >/dev/null 2>&1 || true
