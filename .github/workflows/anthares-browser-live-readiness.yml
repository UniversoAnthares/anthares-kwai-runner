name: Anthares Browser Cloudflare live readiness
# Validate internal TikTok service binding after Cloudflare deployment.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/anthares-browser-live-readiness.yml']
permissions:
  contents: read
concurrency:
  group: anthares-browser-live-readiness
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ANTHARES_RESERVA_TOKEN: ${{ secrets.ANTHARES_RESERVA_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Verify actual Anthares Browser Cloudflare bindings and protected session status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,urllib.request,urllib.error,subprocess
          base='https://anthares-reserva-browser.anthares1.workers.dev'
          def req(path,token=None,method='GET'):
              args=['curl','-sS','--max-time','20','-A','AntharesBrowserHealth/1.0','-o','/tmp/anthares-probe.json','-w','%{http_code}']
              if token: args+=['-H','Authorization: Bearer '+token]
              if method!='GET': args+=['-X',method]
              p=subprocess.run(args+[base+path],capture_output=True,text=True)
              code=int(p.stdout) if p.stdout.isdigit() else 0
              try: body=json.load(open('/tmp/anthares-probe.json'))
              except: body={}
              return code,body
          code,health=req('/health')
          print('HEALTH_HTTP='+str(code))
          if code!=200: print('HEALTH_DENIAL='+json.dumps(health))
          print('HEALTH_OK='+str(health.get('ok')))
          print('BROWSER_BINDING='+str(health.get('browser_binding')))
          print('DURABLE_STATE_BINDING='+str(health.get('durable_state_binding')))
          print('RENDER_REQUIRED='+str(health.get('render_required')))
          if code!=200 or health.get('ok') is not True or health.get('browser_binding') is not True:
              raise SystemExit('ANTHARES_BROWSER_LIVE_HEALTH_NOT_PROVEN')
          token=os.environ.get('ANTHARES_RESERVA_TOKEN','')
          if not token and os.environ.get('ARA_SHARED'):
              token=hashlib.sha256(('anthares-reserva-browser-v1:'+os.environ['ARA_SHARED']).encode()).hexdigest()
          if not token:
              print('RESERVE_AUTH_SECRET_MISSING=1')
              raise SystemExit(11)
          code,status=req('/tiktok/northflank/status',token)
          print('TIKTOK_STATUS_HTTP='+str(code))
          print('TIKTOK_STATUS_FIELDS='+','.join(sorted(status.keys())))
          print('TIKTOK_BACKEND_OK='+str(status.get('ok')))
          print('TIKTOK_BACKEND_ERROR='+str(status.get('error',''))[:100])
          if code!=200 or status.get('ok') is not True:
              direct=subprocess.run(['curl','-sS','--max-time','15','-A','AntharesBrowserHealth/1.0','-o','/tmp/northflank-direct.json','-w','%{http_code}','-H','Authorization: Bearer '+os.environ.get('ARA_SHARED',''),'https://anthares-tiktok-worker.anthares1.workers.dev/interactive-browser/status'],capture_output=True,text=True)
              print('DIRECT_NORTHFLANK_HTTP='+direct.stdout)
              raw=open('/tmp/northflank-direct.json',errors='replace').read(400)
              try:
                  d=json.loads(raw)
                  print('DIRECT_NORTHFLANK_OK='+str(d.get('ok')))
                  print('DIRECT_NORTHFLANK_ERROR='+str(d.get('error',''))[:120])
              except: print('DIRECT_NORTHFLANK_RESPONSE_PREFIX='+raw[:180].replace('\\n',' '))
              raise SystemExit('TIKTOK_BACKEND_UNAVAILABLE')
          print('ANTHARES_BROWSER_CLOUDFLARE_READINESS=PROVEN')
          PY
