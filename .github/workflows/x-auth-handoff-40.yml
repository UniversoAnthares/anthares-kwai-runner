name: X Auth Handoff 40

on:
  push:
    branches:
      - test/x-auth-handoff-40-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fanout:
    name: auth-handoff-40-concurrent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run 40 probes concurrently
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .auth-handoff-results
          mkdir .auth-handoff-results
          seq 1 40 | xargs -n1 -P40 -I{} bash -c 'CASE={} python tests/x_auth_handoff_matrix.py > .auth-handoff-results/{}.json'
          python - <<'PY'
          import json, pathlib
          files=sorted(pathlib.Path('.auth-handoff-results').glob('*.json'), key=lambda p:int(p.stem))
          assert len(files)==40, len(files)
          rows=[json.loads(p.read_text()) for p in files]
          bad=[r for r in rows if not r.get('ok')]
          print(json.dumps({'total':len(rows),'passed':len(rows)-len(bad),'failed':len(bad),'failed_cases':[r.get('case') for r in bad]}, separators=(',',':')))
          if bad:
              raise SystemExit(1)
          PY
