name: Provider router unit tests

on:
  push:
    paths:
      - 'tools/provider_router.py'
      - 'tools/test_provider_router.py'
      - 'tools/DUAL_PROVIDER_ARCHITECTURE.md'
      - '.github/workflows/provider-router-unit.yml'
  pull_request:
    paths:
      - 'tools/provider_router.py'
      - 'tools/test_provider_router.py'
      - 'tools/DUAL_PROVIDER_ARCHITECTURE.md'
      - '.github/workflows/provider-router-unit.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run provider router tests
        run: python tools/test_provider_router.py -v
