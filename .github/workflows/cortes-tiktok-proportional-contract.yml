name: CORTES TikTok per-account proportional pacing contract
on:
  push:
    branches: [main, fix/cortes-tiktok-neon-proportional-23h-20261112, fix/tiktok-100-by-0938-proportional-db-gate-20261112, fix/tiktok-disable-stale-vercel-fallback-20261112]
    paths:
      - 'infra/neon-cortes-tiktok/index.mjs'
      - 'tools/cortes_tiktok_queue_consumer.py'
      - 'tests/test_cortes_tiktok_hard_window_ingress.py'
      - 'infra/neon-cortes-lucasrosalem4/index.mjs'
      - 'tests/test_cortes_tiktok_proportional_due.mjs'
      - 'tests/test_cortes_tiktok_hard_window_guard.mjs'
      - 'db/migrations/20261112_tiktok_hard_window_proportional_guard.sql'
      - 'vercel-ara-primary/api/cortes-tiktok.mjs'
      - '.github/workflows/cortes-tiktok-proportional-contract.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cortes-tiktok-proportional-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only deadline and per-account confirmation tests; no posts
        shell: bash
        run: |
          set -euo pipefail
          node --check infra/neon-cortes-tiktok/index.mjs
          node --check infra/neon-cortes-lucasrosalem4/index.mjs
          node --check vercel-ara-primary/api/cortes-tiktok.mjs
          node --test tests/test_cortes_tiktok_proportional_due.mjs tests/test_cortes_tiktok_hard_window_guard.mjs
          python3 -m unittest discover -s tests -p 'test_cortes_tiktok_hard_window_ingress.py' -v
          echo TIKTOK_DEADLINE_PROPORTIONAL_CONTRACT=PASS
