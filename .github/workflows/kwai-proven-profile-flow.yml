name: Kwai Proven Profile Flow
on:
  workflow_dispatch:
  push:
    paths: ['.proven-profile-trigger']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL --retry 3 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          mkdir -p kwai-vault && unzip -q kwai-vault.zip -d kwai-vault
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 300
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            bash kwai_vault_install.sh
            adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            sleep 8
            python3 kwai_proven_profile_flow.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proven-profile-${{ github.run_id }}
          path: |
            flow-*.xml
            stable-feed.xml
            profile-page.xml
            profile-page.png
            kwai-vault-install-status.txt
          retention-days: 1
