name: CORTES LinkedIn - cloud-only WordPress to Neon fanout
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/cortes-linkedin-neon-fanout.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-linkedin-neon-cloud-fanout
  cancel-in-progress: false
jobs:
  enqueue:
    if: ${{ vars.CORTES_LINKEDIN_PUBLIC_FANOUT_READY == 'true' && vars.CORTES_LINKEDIN_FANOUT_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Enqueue only LinkedIn CORTES shorts in Neon from cloud
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/cortes_linkedin_neon_fanout.py
