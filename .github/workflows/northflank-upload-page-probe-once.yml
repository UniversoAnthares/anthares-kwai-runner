name: One-time Northflank TikTok upload page read-only probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-upload-page-probe-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Diagnose TikTok upload page without selecting any media or posting
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const secret=process.env.NF_TOKEN,auth=process.env.ARA_SHARED;
          if(!secret||secret.length<20||!auth||auth.length<20)throw Error('MISSING_AUTH');
          const root='https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run';
          const h=await fetch(root+'/health',{headers:{Authorization:'Bearer '+auth},signal:AbortSignal.timeout(23000)});
          const d=await h.json().catch(()=>({}));
          console.log('PRE_HEALTH_HTTP='+h.status);
          console.log('PRE_OWNER_VERIFIED='+Boolean(d.identity_verified));
          console.log('PRE_READY='+Boolean(d.ready_for_tiktok));
          if(h.status!==200||!d.identity_verified||!d.ready_for_tiktok)throw Error('OWNER_IDENTITY_NOT_READY');
          const api=async path=>{const r=await fetch('https://api.northflank.com/v1'+path,{headers:{Authorization:'Bearer '+secret}});if(!r.ok)throw Error('NF_HTTP_'+r.status);return r.json();};
          const found=[];for(const p of (await api('/projects')).data?.projects||[])for(const s of (await api('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[])if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);
          if(found.length!==1)throw Error('NORTHFLANK_SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0],cp=new ApiClientInMemoryContextProvider();await cp.addContext({name:'probe',token:secret});const cli=new ApiClient(cp);
          const script=String.raw`
          import sys,time,json,os,urllib.parse
          sys.path.insert(0,'/app')
          import tiktok_worker as tw
          from playwright.sync_api import sync_playwright
          def log(k,v):print(str(k)+'='+str(v),flush=True)
          state=tw.storage_state()
          cookies=state.get('cookies') or []
          auth=tw.auth_cookie_names(state)
          log('AUTH_COOKIES',len(cookies))
          log('AUTH_COOKIE_NAMES_PRESENT',bool(auth))
          if len(cookies)<20 or not auth or os.getenv('EXPECTED_TIKTOK_USERNAME','').strip().lstrip('@').lower()!='universo.anthares':raise SystemExit('SAFE_STOP_OWNER_NOT_VERIFIED')
          try:log('MEMORY_BEFORE_MB',round(int(open('/sys/fs/cgroup/memory.current').read())/1048576,1))
          except Exception:pass
          args=['--disable-dev-shm-usage','--no-sandbox','--disable-gpu','--disable-extensions','--disable-background-networking','--disable-component-update','--disable-default-apps','--disable-sync','--metrics-recording-only','--no-first-run','--no-zygote','--renderer-process-limit=1','--disable-software-rasterizer','--disable-site-isolation-trials']
          log('STAGE','start_playwright')
          with sync_playwright() as p:
           log('STAGE','launch_chromium')
           b=p.chromium.launch(headless=True,args=args,timeout=35000)
           try:
            log('STAGE','new_context')
            ctx=b.new_context(storage_state=state,viewport={'width':800,'height':600},locale='pt-BR')
            try:
             page=ctx.new_page()
             page.route('**/*',lambda route:(route.abort() if route.request.resource_type in ('image','font','media') else route.continue_()))
             urls=['https://www.tiktok.com/tiktokstudio/upload?from=webapp','https://www.tiktok.com/upload?lang=pt-BR']
             for i,url in enumerate(urls):
              log('NAV_ATTEMPT',i+1)
              start=time.monotonic()
              try:
               r=page.goto(url,wait_until='commit',timeout=28000)
               log('NAV_RESULT','commit')
               log('NAV_STATUS',r.status if r else 'none')
              except Exception as exc:
               log('NAV_ERROR_CLASS',type(exc).__name__)
              log('NAV_DURATION_S',round(time.monotonic()-start,2))
              log('CURRENT_URL_PATH',urllib.parse.urlsplit(page.url).path[:95])
              try:
               loc=page.locator('input[type=file]')
               loc.first.wait_for(state='attached',timeout=28000)
               log('UPLOAD_FILE_INPUT_ATTACHED',True)
               log('CURRENT_URL_HOST',urllib.parse.urlsplit(page.url).hostname)
               break
              except Exception as exc:
               log('UPLOAD_INPUT_ERROR_CLASS',type(exc).__name__)
               try:
                d=page.evaluate("()=>({body:document.body?.innerText?.length||0,html:document.documentElement?.outerHTML?.length||0,ready:document.readyState,inputs:document.querySelectorAll('input[type=file]').length})",timeout=2500)
                log('DOM_METRICS',json.dumps(d,separators=(',',':')))
               except Exception as err:log('DOM_QUERY_ERROR_CLASS',type(err).__name__)
             log('PROBE_NO_PUBLICATION',True)
            finally:ctx.close()
           finally:b.close()
          `;
          const result=await cli.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',script]});
          console.log('READONLY_PROBE_EXIT='+String(result.commandResult?.exitCode));
          console.log('READONLY_PROBE_STDOUT='+String(result.stdOut||'').replace(/[\r\n]+/g,' | ').slice(0,4500));
          console.log('READONLY_PROBE_STDERR_CLASS='+String(result.stdErr||'').replace(/[\r\n]+/g,' | ').slice(0,180));
          if(result.commandResult?.exitCode!==0)throw Error('READONLY_UPLOAD_PROBE_FAILED');
          NODE
