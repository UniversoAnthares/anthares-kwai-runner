name: Anthares ARM64 Kernel Module Inventory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/anthares-arm64-kernel-module-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - name: Inspect SDK kernel and packaged ramdisk modules
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl default-jre-headless cpio gzip e2fsprogs >/dev/null
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest" /tmp/android-tools /tmp/sdk-ramdisk
          curl -fLsS --retry 4 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/android-tools
          cp -a /tmp/android-tools/cmdline-tools/. "$HOME/android-sdk/cmdline-tools/latest/"
          export ANDROID_HOME="$HOME/android-sdk"
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null) || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-30;default;arm64-v8a' >/dev/null
          DIR="$ANDROID_HOME/system-images/android-30/default/arm64-v8a"
          echo '=== SDK ROOT INVENTORY ==='
          ls -lh "$DIR" | head -45
          echo '=== RAMDISK FORMAT ==='
          file "$DIR/ramdisk.img"
          (cd /tmp/sdk-ramdisk && (gzip -dc "$DIR/ramdisk.img" 2>/dev/null || cat "$DIR/ramdisk.img") | cpio -id --no-absolute-filenames --quiet) || true
          echo '=== RAMDISK MODULES ==='
          find /tmp/sdk-ramdisk -type f | grep -E '(modules|\.ko($|\.))' | head -120 || true
          echo '=== VENDOR PARTITION FILE TYPE ==='
          file "$DIR/vendor.img" "$DIR/system.img"
          echo '=== VENDOR MODULES IF EXT4 ==='
          sudo debugfs -R 'ls -l /lib/modules' "$DIR/vendor.img" 2>&1 | head -50 || true
          echo '=== HOST KERNEL INVENTORY ==='
          uname -a
          ls -lh /boot/vmlinuz* /lib/modules/*/kernel/drivers/block/virtio_blk.ko* 2>/dev/null || true
          echo '=== INVENTORY COMPLETE ==='
