name: Kwai Profile Login Probe
on:
  workflow_dispatch:
  push:
    paths: ['.profile-probe-trigger']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [profile-text, profile-coordinate, me-coordinate, back-then-profile, profile-twice, profile-deeplink, login-deeplink, inbox, discover, inspect-profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROFILE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated Kwai vault
        run: |
          curl -fL --retry 3 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          mkdir -p kwai-vault && unzip -q kwai-vault.zip -d kwai-vault
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run profile probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 300
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            bash kwai_vault_install.sh
            adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            sleep 8
            python3 kwai_profile_probe.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-probe-${{ matrix.mode }}-${{ github.run_id }}
          path: |
            stage-*.xml
            before-profile.xml
            after-*.xml
            profile-*.png
            kwai-vault-install-status.txt
          if-no-files-found: warn
          retention-days: 1
