name: Release existing TikTok Northflank browser (no provisioning)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northflank-tiktok-worker
  cancel-in-progress: false

jobs:
  deploy-existing:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Verify credentials without disclosing values
        run: |
          set -euo pipefail
          test -n "$ARA_SHARED"
          echo NF_RUNTIME_AUTH_PRESENT=1
      - name: Build only the known existing Northflank service and verify v12
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          token=os.getenv("NORTHFLANK_API_TOKEN","")
          shared=os.environ["ARA_SHARED"]
          api_root="https://api.northflank.com/v1"
          service_name="anthares-tiktok-northflank"
          existing_base="https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run"
          expected_revision="2026-11-10-cdp-fast-status-v12"
          def request_json(url,method="GET",token=None,payload=None,timeout=30):
              headers={"Accept":"application/json","User-Agent":"Anthares-Northflank-Existing-Release/1.0"}
              if token:headers["Authorization"]="Bearer "+token
              if payload is not None:headers["Content-Type"]="application/json"
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,headers=headers,method=method,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as resp:
                      body=resp.read(250000)
                      return resp.status,json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  return exc.code,{}
              except Exception:
                  return 0,{}
          # Check the authenticated current runtime before requiring admin credentials.
          code,revision=request_json(existing_base+"/interactive-browser/revision",token=shared,timeout=20)
          print("NF_RUNTIME_REVISION_HTTP="+str(code))
          if code in (401,403):raise SystemExit("NORTHFLANK_RUNTIME_AUTH_REQUIRED")
          if code==200 and revision.get("revision")==expected_revision:
              print("NF_RELEASE_ALREADY_CURRENT=1")
          else:
              # Build only the known existing service when a real upgrade is required.
              if len(token)<20:raise SystemExit("NORTHFLANK_ADMIN_AUTH_REQUIRED")
              code,projects=request_json(api_root+"/projects",token=token)
              print("NF_PROJECTS_HTTP="+str(code))
              if code!=200:raise SystemExit("NORTHFLANK_ADMIN_AUTH_REQUIRED")
              entries=(projects.get("data") or {}).get("projects") or []
              if isinstance(entries,dict):entries=list(entries.values())
              found=[]
              for project in entries:
                  project_id=project.get("id")
                  if not project_id:continue
                  status,body=request_json(api_root+"/projects/"+project_id+"/services",token=token)
                  if status!=200:continue
                  services=(body.get("data") or {}).get("services") or []
                  if isinstance(services,dict):services=list(services.values())
                  for service in services:
                      if service.get("name")==service_name:
                          found.append((project_id,service.get("id") or service_name))
              if len(found)!=1:raise SystemExit("NORTHFLANK_EXISTING_SERVICE_MISSING_OR_AMBIGUOUS")
              project_id,service_id=found[0]
              # Never modify runtime vars, compute plan, scaling, credentials or router.
              status,_=request_json(api_root+"/projects/"+project_id+"/services/"+service_id+"/build",method="POST",token=token,payload={},timeout=40)
              print("NF_EXISTING_BUILD_HTTP="+str(status))
              if status not in (200,201,202):raise SystemExit("NORTHFLANK_BUILD_UNCONFIRMED_OR_REJECTED")
              for attempt in range(72):
                  time.sleep(10)
                  code,revision=request_json(existing_base+"/interactive-browser/revision",token=shared,timeout=18)
                  if code==200 and revision.get("revision")==expected_revision:break
              else:raise SystemExit("NORTHFLANK_V12_ROLLOUT_UNCONFIRMED")
          code,status=request_json(existing_base+"/interactive-browser/status",token=shared,timeout=20)
          print("NF_BROWSER_STATUS_HTTP="+str(code))
          if code!=200 or status.get("ok") is not True or status.get("backend")!="northflank_chromium_cdp":
              raise SystemExit("NORTHFLANK_STATUS_NOT_READY")
          print("NORTHFLANK_EXISTING_BROWSER_V12_VERIFIED=1")
          PY
