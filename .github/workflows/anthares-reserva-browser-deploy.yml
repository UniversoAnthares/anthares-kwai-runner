name: Anthares Reserva Browser Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'anthares-reserva-browser/**'
      - '.github/workflows/anthares-reserva-browser-deploy.yml'

permissions:
  contents: read

concurrency:
  group: anthares-reserva-browser-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare deployment credential
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 10; }
      - name: Install dependencies
        working-directory: anthares-reserva-browser
        run: npm install --ignore-scripts
      - name: Static validation
        working-directory: anthares-reserva-browser
        run: npm run check
      - name: Refresh Worker access secret when provisioned in Actions
        working-directory: anthares-reserva-browser
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHARES_RESERVA_TOKEN: ${{ secrets.ANTHARES_RESERVA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHARES_RESERVA_TOKEN:-}" ]; then
            printf '%s' "$ANTHARES_RESERVA_TOKEN" | npx wrangler secret put ANTHARES_RESERVA_TOKEN
          else
            echo 'ANTHARES_RESERVA_TOKEN remains Cloudflare-only.'
          fi
      - name: Deploy reserve browser
        working-directory: anthares-reserva-browser
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Verify deployed public contract
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 https://anthares-reserva-browser.anthares1.workers.dev/health -o /tmp/reserva-health.json; then
              if python3 - <<'PY'
          import json
          d=json.load(open('/tmp/reserva-health.json', encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('service') == 'anthares-reserva-browser', d
          assert d.get('provider') == 'cloudflare', d
          assert d.get('browser_binding') is True, d
          assert d.get('durable_state_binding') is True, d
          assert d.get('render_required') is False, d
          assert d.get('tiktok_session_recovery') is True, d
          assert d.get('tiktok_browser_version') == '2026-10-14-tiktok-browser-v1', d
          print('RESERVA_TIKTOK_RECOVERY_PUBLIC_HEALTH_OK=1')
          PY
              then break; fi
            fi
            test "$attempt" -lt 12 || exit 21
            sleep 5
          done
          unauth="$(curl -sS -o /tmp/import-unauth.json -w '%{http_code}' --max-time 10 -X POST https://anthares-reserva-browser.anthares1.workers.dev/tiktok/import -H 'content-type: application/json' --data '{}')"
          test "$unauth" = "401"
          echo 'RESERVA_TIKTOK_AUTH_PROTECTION_OK=1'
      - name: Verify authenticated status when Actions owns the secret
        env:
          ANTHARES_RESERVA_TOKEN: ${{ secrets.ANTHARES_RESERVA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHARES_RESERVA_TOKEN:-}" ]; then
            echo 'Authenticated status check skipped: token remains Cloudflare-only.'
            exit 0
          fi
          curl -fsS --max-time 10 -H "Authorization: Bearer $ANTHARES_RESERVA_TOKEN" https://anthares-reserva-browser.anthares1.workers.dev/status -o /tmp/reserva-status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/reserva-status.json', encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('browser_binding') is True, d
          assert d.get('durable_state_binding') is True, d
          assert d.get('render_required') is False, d
          print('RESERVA_AUTHENTICATED_STATUS_OK=1')
          PY
