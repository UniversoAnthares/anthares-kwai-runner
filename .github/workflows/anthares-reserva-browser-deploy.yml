name: Anthares Reserva Browser Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact approved 40-character Git SHA'
        required: true
        type: string
      mode:
        description: 'Normal release or authorized incident recovery'
        required: true
        type: choice
        default: release
        options: [release, emergency]
      incident_ref:
        description: 'Incident reference (required for emergency)'
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: anthares-reserva-browser-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce approved SHA and incident recovery boundary
        env:
          APPROVED_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA" || exit 1
          main_sha="$(curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$RELEASE_MODE" == release ]]; then
            test "$APPROVED_SHA" = "$main_sha" || exit 1
          elif [[ "$RELEASE_MODE" == emergency ]]; then
            test -n "$INCIDENT_REF" || exit 1
            git merge-base --is-ancestor "$APPROVED_SHA" "$main_sha" || exit 1
          else
            exit 1
          fi
          echo "APPROVED_DEPLOY_SHA=$APPROVED_SHA mode=$RELEASE_MODE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 10; }
      - name: Install dependencies
        working-directory: anthares-reserva-browser
        run: npm install --ignore-scripts
      - name: Static validation
        working-directory: anthares-reserva-browser
        run: |
          npm run check
          node --check src/tiktok-entry.js
          node --check src/tiktok-owner-entry.js
          node --check src/northflank-owner-entry.js
      - name: Deploy reserve browser
        working-directory: anthares-reserva-browser
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Confirm deployed bindings are kept untouched
        run: |
          echo 'Cloudflare Wrangler keep_vars=true; no secret put, reset, or key rotation'
          echo 'OWNER_APPROVAL_HASH_ANHARES_RESERVA_TOKEN_NORTHFLANK_BROWSER_TOKEN_PRESERVED_BY_DEPLOY=1'
      - name: Verify deployed public contract
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 https://anthares-reserva-browser.anthares1.workers.dev/health -o /tmp/reserva-health.json; then
              if python3 - <<'PY'
          import json
          d=json.load(open('/tmp/reserva-health.json', encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('service') == 'anthares-reserva-browser', d
          assert d.get('provider') == 'cloudflare', d
          assert d.get('durable_state_binding') is True, d
          assert d.get('render_required') is False, d
          assert d.get('tiktok_session_recovery') is True, d
          assert d.get('tiktok_browser_version') == '2026-10-14-tiktok-browser-v1', d
          print('RESERVA_TIKTOK_RECOVERY_PUBLIC_HEALTH_OK=1')
          PY
              then break; fi
            fi
            test "$attempt" -lt 12 || exit 21
            sleep 5
          done
          unauth="$(curl -sS -o /tmp/import-unauth.json -w '%{http_code}' --max-time 10 -X POST https://anthares-reserva-browser.anthares1.workers.dev/tiktok/import -H 'content-type: application/json' --data '{}')"
          test "$unauth" = "401"
          echo 'RESERVA_TIKTOK_AUTH_PROTECTION_OK=1'
      - name: Verify owner/TikTok routes are protected
        shell: bash
        run: |
          set -euo pipefail
          root='https://anthares-reserva-browser.anthares1.workers.dev'
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$root/owner")"
          test "$status" = '200'
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$root/owner/tiktok")"
          test "$status" = '303'
          echo 'OWNER_AND_TIKTOK_UNAUTHENTICATED_ROUTES_PASS=1'
