name: Northflank browser vault and Playwright read-only diagnostic once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-vault-playwright-diag-once.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Read-only vault CDP and Playwright runtime checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN,shared=process.env.ARA_SHARED;
          if(!token||token.length<20)throw Error('NF_ACCESS_REQUIRED');
          const api=async(path)=>{const r=await fetch('https://api.northflank.com/v1'+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('NF_HTTP_'+r.status);return r.json();};
          const found=[];for(const p of (await api('/projects')).data?.projects||[]){for(const s of (await api('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[]){if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);}}
          if(found.length!==1)throw Error('SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0];
          const ctx=new ApiClientInMemoryContextProvider();await ctx.addContext({name:'diag',token});const cli=new ApiClient(ctx);
          const script=String.raw`
          import os,sys,time,json,subprocess,importlib.util
          sys.path.insert(0,"/app/render-tiktok-worker")
          from browser_state_vault import load_runtime_state
          import browser_executor as b
          def show(k,v): print(k+"="+str(v),flush=True)
          loaded=load_runtime_state(timeout=10)
          original=loaded.get("cookies",[]) if isinstance(loaded,dict) else []
          show("VAULT_READ_COOKIES",len(original))
          show("CDP_ACTIVE",b._quick_running())
          show("BROWSER_PROFILE_PRESENT",os.path.isdir("/tmp/anthares-interactive-profile"))
          for name in ["memory.current","memory.max"]:
           try:show("CGROUP_"+name.replace(".","_"),open("/sys/fs/cgroup/"+name).read().strip())
           except Exception:pass
          for method in ["Network.getAllCookies","Storage.getCookies"]:
           ts=time.monotonic()
           try:
            res=b._cdp(method,timeout=12)
            show(method.replace(".","_")+"_OK",True)
            show(method.replace(".","_")+"_COUNT",len(res.get("cookies") or []))
           except Exception as e:
            show(method.replace(".","_")+"_ERROR_CLASS",type(e).__name__)
            if "wasn't found" in str(e) or "was not found" in str(e):show(method.replace(".","_")+"_METHOD_MISSING",True)
            if "timed out" in str(e).lower():show(method.replace(".","_")+"_TIMEOUT",True)
           finally:show(method.replace(".","_")+"_DURATION",round(time.monotonic()-ts,2))
          try:
           exported=b._export_state()
           cookies=exported.get("cookies") or []
           show("EXPORT_OK",True)
           show("EXPORT_COOKIE_COUNT",len(cookies))
           from collections import Counter
           names={str(x.get("name","")).lower() for x in cookies}
           show("EXPORT_HAS_AUTH_COOKIE",bool(names&{"sessionid","sessionid_ss","sid_tt","sid_guard","uid_tt","uid_tt_ss"}))
           show("EXPORT_LOCAL_COUNT",len(exported.get("origins",[{}])[0].get("localStorage") or []))
          except Exception as e:
           show("EXPORT_ERROR_CLASS",type(e).__name__)
           show("EXPORT_ERROR_METHOD_MISSING",("wasn't found" in str(e) or "was not found" in str(e)))
          def testcmd(command,label,timeout):
           try:
            p=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=timeout)
            show(label+"_EXIT",p.returncode)
            show(label+"_RESULT",p.stdout.strip().replace("\n","|")[:200])
           except subprocess.TimeoutExpired:
            show(label+"_TIMEOUT",True)
          testcmd(["python3","-c","from playwright.sync_api import sync_playwright; print('IMPORT_OK',flush=True); p=sync_playwright().start(); print('ENGINE_STARTED',flush=True); p.stop(); print('STOPPED',flush=True)"],"PLAYWRIGHT_BOOTSTRAP",22)
          `;
          const result=await cli.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',script]});
          console.log('CONTAINER_INSPECTION_EXIT='+String(result.commandResult?.exitCode));
          console.log('CONTAINER_INSPECTION_OUTPUT='+String(result.stdOut||'').slice(0,4000).replace(/[\r\n]+/g,' | '));
          console.log('CONTAINER_INSPECTION_STDERR_CLASS='+String(result.stdErr||'').slice(0,150).replace(/[\r\n]+/g,' | '));
          if(result.commandResult?.exitCode!==0)throw Error('INSPECTION_FAILED');
          NODE
