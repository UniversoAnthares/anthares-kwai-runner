name: Northflank browser vault and Playwright read-only diagnostic once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-vault-playwright-diag-once.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Read-only vault CDP and Playwright runtime checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN,shared=process.env.ARA_SHARED;
          if(!token||token.length<20)throw Error('NF_ACCESS_REQUIRED');
          const api=async(path)=>{const r=await fetch('https://api.northflank.com/v1'+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('NF_HTTP_'+r.status);return r.json();};
          const found=[];for(const p of (await api('/projects')).data?.projects||[]){for(const s of (await api('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[]){if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);}}
          if(found.length!==1)throw Error('SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0];
          const ctx=new ApiClientInMemoryContextProvider();await ctx.addContext({name:'diag',token});const cli=new ApiClient(ctx);
          const script=String.raw`
          import os,sys,json,hashlib,base64,requests
          sys.path.insert(0,"/app/render-tiktok-worker")
          import browser_executor as browser
          from browser_state_vault import (
           load_runtime_state,_secret,VAULT_URL,SCHEMA,AAD,_signed_headers,_b64url
          )
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from collections import Counter
          old=load_runtime_state(timeout=12)
          new=browser._export_state()
          oldc=old.get("cookies",[]) if isinstance(old,dict) else []
          newc=new.get("cookies",[])
          def key(c): return (str(c.get("name","")),str(c.get("domain","")),str(c.get("value","")))
          auth={"sessionid","sessionid_ss","sid_tt","sid_guard","uid_tt","uid_tt_ss"}
          oldauth={key(c) for c in oldc if c.get("name","").lower() in auth}
          newauth={key(c) for c in newc if c.get("name","").lower() in auth}
          print("EXISTING_COOKIE_COUNT="+str(len(oldc)),flush=True)
          print("CURRENT_COOKIE_COUNT="+str(len(newc)),flush=True)
          print("AUTH_COOKIE_VALUES_PRESERVED="+str(bool(oldauth) and oldauth.issubset(newauth)),flush=True)
          if not(oldauth and oldauth.issubset(newauth)):
           raise SystemExit("SAFE_STOP_AUTH_COOKIE_VALUES_DIFFER")
          raw=json.dumps(new,separators=(",",":")).encode()
          enc_estimate=(len(raw)+28)*4//3+150
          print("CURRENT_STATE_PLAINTEXT_BYTES="+str(len(raw)),flush=True)
          print("EXPECTED_ENVELOPE_BYTES="+str(enc_estimate),flush=True)
          print("LOCAL_STORAGE_ITEMS="+str(len(new.get("origins",[{}])[0].get("localStorage") or [])),flush=True)
          if enc_estimate>490000:
           print("VAULT_SAVE_SKIPPED_OVERSIZE=1",flush=True)
           raise SystemExit(0)
          secret=_secret()
          key=hashlib.sha256(("browser-vault-enc:"+secret).encode()).digest()
          nonce=os.urandom(12)
          ciphertext=_b64url(nonce+AESGCM(key).encrypt(nonce,raw,AAD))
          body=json.dumps({"schema":SCHEMA,"ciphertext":ciphertext,"sha256":hashlib.sha256(ciphertext.encode()).hexdigest()},separators=(",",":"))
          try:
           r=requests.post(VAULT_URL,headers={**_signed_headers(secret,body),"Content-Type":"application/json","Accept":"application/json"},data=body,timeout=24)
           print("VAULT_WRITE_HTTP="+str(r.status_code),flush=True)
           if r.headers.get("Content-Type","").startswith("application/json"):
            result=r.json()
            err=str(result.get("error",""))[:100]
            print("VAULT_WRITE_ERROR_CODE="+err,flush=True)
            print("VAULT_WRITE_STORED="+str(bool(result.get("stored"))),flush=True)
           else:
            print("VAULT_WRITE_NON_JSON=1",flush=True)
          except Exception as e:print("VAULT_WRITE_NETWORK_CLASS="+type(e).__name__,flush=True)
          after=load_runtime_state(timeout=12)
          print("VAULT_AFTER_COOKIE_COUNT="+str(len(after.get("cookies",[])) if isinstance(after,dict) else 0),flush=True)
          `;
          const result=await cli.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',script]});
          console.log('CONTAINER_INSPECTION_EXIT='+String(result.commandResult?.exitCode));
          console.log('CONTAINER_INSPECTION_OUTPUT='+String(result.stdOut||'').slice(0,4000).replace(/[\r\n]+/g,' | '));
          console.log('CONTAINER_INSPECTION_STDERR_CLASS='+String(result.stdErr||'').slice(0,150).replace(/[\r\n]+/g,' | '));
          if(result.commandResult?.exitCode!==0)throw Error('INSPECTION_FAILED');
          NODE
