name: Anthares Codespace Wake
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - 'control_plane/codespace_lifecycle.py'
      - 'control_plane/test_codespace_lifecycle.py'
      - '.github/workflows/anthares-codespace-wake.yml'
permissions:
  contents: read
concurrency:
  group: anthares-codespace-wake
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate lifecycle client
        run: |
          python -m py_compile control_plane/codespace_lifecycle.py
          python -m unittest discover -s control_plane -p 'test_codespace_lifecycle.py' -v
  wake:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 12 &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, 'KWAI_BRIDGE_CMD '))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wake existing Anthares Codespace
        env:
          ANTHARES_CODESPACES_TOKEN: ${{ secrets.ANTHARES_CODESPACES_TOKEN }}
          ANTHARES_CODESPACE_REPOSITORY: UniversoAnthares/anthares-kwai-runner
        run: python control_plane/codespace_lifecycle.py
