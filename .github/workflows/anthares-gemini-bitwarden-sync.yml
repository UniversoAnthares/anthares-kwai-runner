name: Anthares Gemini Bitwarden remote production sync
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 1,13 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/anthares-gemini-bitwarden-sync.yml'
      - 'tools/anthares_gemini_bitwarden_sync.js'
      - 'tools/anthares-gemini-select.php'
      - 'tools/anthares-gemini-canary.php'
      - 'tools/anthares-gemini-activate.sh'
  pull_request:
    paths:
      - '.github/workflows/anthares-gemini-bitwarden-sync.yml'
      - 'tools/anthares_gemini_bitwarden_sync.js'
      - 'tools/anthares-gemini-select.php'
      - 'tools/anthares-gemini-canary.php'
      - 'tools/anthares-gemini-activate.sh'
permissions:
  contents: read
  issues: write
concurrency:
  group: anthares-gemini-bitwarden-production-single-authority
  cancel-in-progress: false
jobs:
  static-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of credential-free scripts
        run: |
          set -euo pipefail
          node --check tools/anthares_gemini_bitwarden_sync.js
          php -l tools/anthares-gemini-select.php
          php -l tools/anthares-gemini-canary.php
          bash -n tools/anthares-gemini-activate.sh
          echo ANTHARES_GEMINI_STATIC_CHECK=PASS
  synchronize:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      ANTHARES_GEMINI_ACTIVATE_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Bitwarden SDK
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/anthares-bws-sdk" --no-audit --no-fund --silent @bitwarden/sdk-napi@1.0.0
      - name: Synchronize with bounded retries and recovery
        id: sync
        shell: bash
        run: |
          set -uo pipefail
          node --check tools/anthares_gemini_bitwarden_sync.js || exit 1
          for attempt in 1 2 3; do
            echo "ANTHARES_SYNC_ATTEMPT=$attempt/3"
            if node tools/anthares_gemini_bitwarden_sync.js; then
              echo 'ANTHARES_GEMINI_SYNC_RECOVERY=PASS'
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo 'ANTHARES_SYNC_RETRY=BOUNDED'
            sleep $((attempt * 17))
          done
          echo 'ANTHARES_GEMINI_SYNC_RECOVERY=FAIL'
          exit 1
      - name: Remove ephemeral local material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/anthares-bws-sdk"
          echo ANTHARES_EPHEMERAL_RUNNER_CLEANUP=PASS
      - name: Open or resolve one operational incident
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        with:
          script: |
            const title = '[Anthares] Gemini / Bitwarden — falha de sincronização remota';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'open', per_page:100});
            const active = issues.find(issue => !issue.pull_request && issue.title === title);
            if (process.env.SYNC_OUTCOME === 'success') {
              if (active) {
                await github.rest.issues.update({owner,repo,issue_number:active.number,state:'closed',state_reason:'completed'});
                core.info('ANTHARES_SYNC_INCIDENT=RESOLVED');
              } else {
                core.info('ANTHARES_SYNC_INCIDENT=NONE');
              }
            } else {
              const url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
              const body = 'O sincronizador Gemini/Bitwarden falhou após até três tentativas. Verifique o run: '+url+'\n\nAtenção: não publicar chaves ou tokens. Não reativar 9Router ou Render. Acredenciais existentes no WordPress foram preservadas.';
              if (active) {
                await github.rest.issues.createComment({owner,repo,issue_number:active.number,body});
                core.warning('ANTHARES_SYNC_INCIDENT=UPDATED');
              } else {
                await github.rest.issues.create({owner,repo,title,body});
                core.warning('ANTHARES_SYNC_INCIDENT=OPENED');
              }
            }
