name: CF-14 Seven Complete UTC Days Acceptance
on:
  schedule:
    # Assess seven closed UTC calendar days from independent GitHub Actions.
    - cron: '27 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: anthares-cf14-final-acceptance
  cancel-in-progress: false
jobs:
  seven_days:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce full-day window, external 1027 samples and live remote continuity
        run: python3 infra/cloudflare/cf14_seven_day_acceptance.py
