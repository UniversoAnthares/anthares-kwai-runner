name: Publisher model QA
on:
  push:
    paths:
      - 'anthares_publisher/media_model.py'
      - 'anthares_publisher/publication_queue.py'
      - 'anthares_publisher/global_dedupe.py'
      - 'tests/test_media_model.py'
      - 'tests/test_publication_queue.py'
      - 'tests/test_global_dedupe.py'
      - '.github/workflows/publisher-model-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publisher-model-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile canonical publisher modules
        run: python -m py_compile anthares_publisher/media_model.py anthares_publisher/publication_queue.py anthares_publisher/global_dedupe.py
      - name: Run Source Clip Publication QA
        run: python -m unittest -v tests.test_media_model tests.test_publication_queue tests.test_global_dedupe
