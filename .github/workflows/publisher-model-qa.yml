name: Publisher model QA
on:
  push:
    paths:
      - 'anthares_publisher/media_model.py'
      - 'tests/test_media_model.py'
      - 'cloudflare-worker/patches/apply-publisher-target-v17.py'
      - 'cloudflare-worker/src/index.js'
      - '.github/workflows/publisher-model-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publisher-model-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile canonical publisher domain
        run: python -m py_compile anthares_publisher/media_model.py cloudflare-worker/patches/apply-publisher-target-v17.py
      - name: Run Source Clip Publication QA
        run: python -m unittest -v tests.test_media_model
      - name: Dry-run central queue migration on exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 cloudflare-worker/patches/apply-publisher-target-v17.py
          node --experimental-default-type=module --check cloudflare-worker/src/index.js
          grep -q '2026-10-15-publisher-target-v17' cloudflare-worker/src/index.js
          grep -q 'idx_jobs_target_status_created' cloudflare-worker/src/index.js
          grep -q 'account_id=? AND dedupe_key=?' cloudflare-worker/src/index.js
          grep -q 'account_id=? AND status' cloudflare-worker/src/index.js
          grep -q 'a.account_id=q.account_id' cloudflare-worker/src/index.js
          grep -q 'status=.uncertain.*publication_started=1' cloudflare-worker/src/index.js
          echo 'PUBLISHER_ITEMS_9_11_STATIC_INVARIANTS_OK=1'
