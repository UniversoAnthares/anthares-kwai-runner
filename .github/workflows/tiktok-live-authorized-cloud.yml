name: TikTok LIVE Authorized Cloud Preflight
on:
  push:
    branches:
      - 'feature/tiktok-live-authorized-cloud-*'
    paths:
      - '.github/workflows/tiktok-live-authorized-cloud.yml'
      - 'tools/tiktok_live_authorized_cloud.py'
  workflow_dispatch:
    inputs:
      transmit:
        description: 'Explicitly transmit an authorized prerecorded-program test'
        type: boolean
        required: true
        default: false
      seconds:
        description: 'Duration in seconds, max 21600'
        type: string
        default: '600'
        required: true
permissions:
  contents: read
concurrency:
  group: anthares-tiktok-live-authorized-cloud
  cancel-in-progress: false
jobs:
  verify-and-optional-transmit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANTHARES_LIVE_HLS_URL: https://anthares.us/wp-content/uploads/anthares-live-static/live.m3u8
      TIKTOK_LIVE_ACCOUNT_AUTHORIZED: ${{ vars.TIKTOK_LIVE_ACCOUNT_AUTHORIZED }}
      TIKTOK_LIVE_PRERECORDED_APPROVED: ${{ vars.TIKTOK_LIVE_PRERECORDED_APPROVED }}
      TIKTOK_LIVE_RTMP_DESTINATION: ${{ secrets.TIKTOK_LIVE_RTMP_DESTINATION }}
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg installed and HLS source available (read-only)
        run: python3 tools/tiktok_live_authorized_cloud.py --preflight
      - name: Validate cloud FFmpeg processing without publishing
        run: python3 tools/tiktok_live_authorized_cloud.py --dry-encode --seconds 8
      - name: Transmit only with explicit authorization and eligible RTMP destination
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.transmit == true }}
        env:
          STREAM_SECONDS: ${{ inputs.seconds }}
        run: |
          python3 - <<'PY'
          import os
          n=int(os.environ['STREAM_SECONDS'])
          if not 15<=n<=21600: raise SystemExit('duration_out_of_range')
          PY
          python3 tools/tiktok_live_authorized_cloud.py --seconds "$STREAM_SECONDS"
