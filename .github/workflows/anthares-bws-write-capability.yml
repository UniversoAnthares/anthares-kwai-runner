name: Anthares Bitwarden modern SDK write probe
on:
  push:
    branches: [test/anthares-bws-write-capability-20261019]
    paths: ['.github/workflows/anthares-bws-write-capability.yml']
permissions:
  contents: read
jobs:
  permission-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Install official Bitwarden SDK 1.0.0
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bws-test --no-audit --no-fund --silent @bitwarden/sdk-napi@1.0.0
          echo 'BWS_MODERN_SDK=INSTALLED'
          echo 'BWS_TYPE_DECLARATIONS_BEGIN'
          grep -n -A 9 -B 3 'create(' /tmp/bws-test/node_modules/@bitwarden/sdk-napi/index.d.ts | head -n 42 || true
          echo 'BWS_TYPE_DECLARATIONS_END'
      - name: Create and delete disposable Bitwarden secret using project scoping
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BWS_ACCESS_TOKEN"
          node <<'NODE'
          const sdk=require('/tmp/bws-test/node_modules/@bitwarden/sdk-napi');
          const testId='6edd06b7-ce2e-4519-905f-b4e800e4fe1a';
          let phase='INIT', created=null, clean=false, client;
          (async()=>{
            client=new sdk.BitwardenClient({apiUrl:'https://api.bitwarden.com',identityUrl:'https://identity.bitwarden.com',userAgent:'anthares-bws-write-canary',deviceType:sdk.DeviceType.SDK});
            phase='LOGIN';
            const auth=await client.auth().loginAccessToken(process.env.BWS_ACCESS_TOKEN.trim(),'/tmp/bws-canary-state');
            if(auth?.success===false)throw Error('AUTH_FAILED');
            console.log('BWS_MODERN_AUTH=PASS');
            phase='READ';
            const response=await client.secrets().get(testId);
            const data=response?.data||response;
            if(response?.success===false||!data?.id||!data.projectId||!data.organizationId)throw Error('READ_FAILED');
            console.log('BWS_MODERN_READ=PASS');
            console.log('BWS_MODERN_CREATE_ARITY='+client.secrets().create.length);
            phase='WRITE';
            const p=await client.secrets().create('ANTHARES_DISPOSABLE_PERMISSION_PROBE_'+process.env.GITHUB_RUN_ID,'Disposable nonproduction test',data.organizationId,'nonsecret-value',[data.projectId]);
            if(p?.success===false||!(p?.data?.id||p?.id))throw Error('WRITE_FAILED');
            created=p.data?.id||p.id;
            console.log('BWS_MODERN_WRITE=PASS');
            phase='DELETE';
            const d=await client.secrets().delete([created]);
            if(d?.success===false)throw Error('DELETE_FAILED');
            clean=true;
            console.log('BWS_MODERN_CLEANUP=PASS');
          })().catch(e=>{
            console.log('BWS_MODERN_FAILURE_STAGE='+phase);
            const m=String(e?.message||'');
            const matches=m.match(/(?:400|401|403|404|409|422|500)/);
            console.log('BWS_MODERN_HTTP='+((matches&&matches[0])||'NOT_EXPOSED'));
            console.log('BWS_MODERN_ERROR_CLASS='+(/permission|forbidden|denied/i.test(m)?'PERMISSION':/invalid|argument|type/i.test(m)?'ARGUMENT':/resource not found/i.test(m)?'NOT_FOUND':'OTHER'));
            process.exitCode=1;
          }).finally(async()=>{
            if(created&&!clean)try{await client.secrets().delete([created]);console.log('BWS_MODERN_CLEANUP_RETRY=ATTEMPTED')}catch{console.log('BWS_MODERN_CLEANUP_RETRY=FAILED')}
            try{require('fs').rmSync('/tmp/bws-canary-state',{force:true})}catch{}
          });
          NODE
