name: Kwai archive universal APK independent signature audit (ONE-OFF)

on:
  push:
    branches:
      - feature/spawndroid-kwai-apk-verified-upload-20261114
    paths:
      - .github/workflows/kwai-apk-archive-oneoff.yml

permissions:
  contents: read

concurrency:
  group: kwai-apk-archive-oneoff
  cancel-in-progress: false

jobs:
  archive-original-signature-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download original APK through public APKMirror links
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/kwai-archive-2024.apk"
          trap 'rm -f -- "$APK"' EXIT
          export ARCHIVED_APK="$APK"
          python3 - <<'PY'
          import hashlib,html,os,urllib.parse,urllib.request
          from html.parser import HTMLParser
          import time
          RELEASE=("https://www.apkmirror.com/apk/"
                   "joyo-technology-pte-ltd-2/kwai-short-video-maker-community/"
                   "kwai-short-video-maker-community-10-6-10-536002-release/"
                   "kwai-watch-cool-videos-10-6-10-536002-2-android-apk-download/")
          EXPECTED="76e6a6208f3979e0e6e69807160d7fe9d3b0ef97c82f6980933eb775616b4b58"
          SIZE=255956802
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      href=dict(attrs).get("href")
                      if href:self.urls.append(html.unescape(href))
          def allow(url):
              u=urllib.parse.urlsplit(url)
              if u.scheme!="https" or not u.hostname or not (
                  u.hostname=="apkmirror.com" or u.hostname.endswith(".apkmirror.com")):
                  raise RuntimeError("SOURCE_NOT_APKMIRROR_HTTPS")
              return url
          def read_html(url):
              req=urllib.request.Request(allow(url),headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  if "text/html" not in r.headers.get("Content-Type","").lower():
                      raise RuntimeError("DOWNLOAD_PAGE_NOT_HTML")
                  return r.read(3000000).decode("utf8","replace")
          links=Links()
          links.feed(read_html(RELEASE))
          first=next((urllib.parse.urljoin(RELEASE,v) for v in links.urls
                      if "/download/?" in v and "key=" in v),None)
          if not first:raise RuntimeError("ARCHIVAL_LINK_UNAVAILABLE")
          links=Links()
          links.feed(read_html(first))
          second=next((urllib.parse.urljoin(first,v) for v in links.urls
                       if "download.php?" in v and "key=" in v),None)
          if not second:raise RuntimeError("ARCHIVAL_BINARY_LINK_UNAVAILABLE")
          time.sleep(16)
          req=urllib.request.Request(allow(second),headers={"User-Agent":"Mozilla/5.0"})
          sha=hashlib.sha256()
          total=0
          with urllib.request.urlopen(req,timeout=60) as r:
              allow(r.geturl())
              if "text/html" in r.headers.get("Content-Type","").lower():
                  raise RuntimeError("BINARY_REPLACED_WITH_HTML")
              with open(os.environ["ARCHIVED_APK"],"wb") as f:
                  while True:
                      b=r.read(1048576)
                      if not b:break
                      total+=len(b)
                      if total>SIZE:raise RuntimeError("BINARY_TOO_LARGE")
                      sha.update(b);f.write(b)
          if total!=SIZE or sha.hexdigest()!=EXPECTED:
              raise RuntimeError("BINARY_SHA256_OR_SIZE_MISMATCH")
          print("KWAI_ARCHIVAL_REAL_BINARY_HASH=PASS")
          print("KWAI_ARCHIVAL_REAL_BINARY_BYTES="+str(total))
          PY
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_DIR="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          export ANDROID_APKSIGNER="$BUILD_DIR/apksigner"
          export ANDROID_AAPT="$BUILD_DIR/aapt"
          test -x "$ANDROID_APKSIGNER" && test -x "$ANDROID_AAPT"
          python3 tools/kwai_spawndroid_apk_guard.py \
            --apk "$APK" --sha256 76e6a6208f3979e0e6e69807160d7fe9d3b0ef97c82f6980933eb775616b4b58 \
            --min-version-code 536002
          echo 'KWAI_ARCHIVAL_APK_CRYPTOGRAPHIC_AUDIT=PASS'
          echo 'SPAWNDROID_UPLOAD_READBACK=NOT_ATTEMPTED'
          echo 'KWAI_PUBLICATION_ATTEMPTED=0'
