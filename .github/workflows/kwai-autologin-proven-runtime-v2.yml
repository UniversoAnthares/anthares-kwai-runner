name: Kwai Proven Runtime Autologin V2
on:
  workflow_dispatch:
  push:
    paths: ['.kwai-autologin-v2-trigger']
permissions: {contents: read}
jobs:
  autologin:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
      KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate credentials presence
        run: |
          test -n "$KWAI_LOGIN"
          test -n "$KWAI_PASSWORD"
          echo CREDENTIAL_SECRETS_PRESENT=1
      - name: Prepare validated runtime
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          export ANDROID_SDK_HOME="$HOME/.android" ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          curl -fL --retry 3 --connect-timeout 10 --max-time 180 -o /tmp/kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  /tmp/kwai-vault.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          zipfile.ZipFile("/tmp/kwai-vault.zip").extractall("/tmp/kwai-vault")
          PY
          "$SDK/cmdline-tools/latest/bin/sdkmanager" platform-tools emulator "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n autologin -k "system-images;android-35;google_apis;x86_64" --device pixel_5 --force
          sudo chmod 666 /dev/kvm
      - name: Boot install and authenticate
        run: |
          set -Eeuo pipefail
          SDK=/usr/local/lib/android/sdk
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          export ANDROID_SDK_HOME="$HOME/.android" ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          "$SDK/emulator/emulator" -avd autologin -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 >/tmp/emulator.log 2>&1 &
          EP=$!
          trap 'kill $EP 2>/dev/null || true' EXIT
          timeout 120 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb install-multiple -r /tmp/kwai-vault/*.apk
          adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS || true
          adb shell monkey -p com.kwai.video 1 >/dev/null
          sleep 8
          python3 kwai_state_driver.py | tee /tmp/fsm.log
          grep -q FSM_MAIN_REACHED /tmp/fsm.log
          python3 kwai_android_autologin.py
          python3 kwai_auth_probe.py
          echo SUCCESS_SIGNAL=KWAI_AUTOLOGIN_AUTHENTICATED
