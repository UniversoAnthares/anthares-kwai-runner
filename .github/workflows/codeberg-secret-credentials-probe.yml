name: CORTES Codeberg mirror credentials permission probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cortes-codeberg-secret-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 6
    env:
      CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check repo secret administration using disposable test value
        shell: pwsh
        run: |
          python -m py_compile tools/codeberg_secret_api_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'PROBE_CODE_INVALID' }
          python -u tools/codeberg_secret_api_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'CODEBERG_TOKEN_PERMISSION_REQUIRED' }
