name: Anthares remote private CI quota rescue
run-name: quota-rescue-${{ inputs.component || 'both' }}-glsha-${{ inputs.gitlab_sha || github.sha }}
on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        description: Validate specified private component
        options: [both, clipper, wordpress]
        default: both
      gitlab_pipeline_id:
        type: string
        required: false
      gitlab_sha:
        type: string
        required: false
  schedule:
    - cron: '53 */12 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-ci-quota-rescue.yml'
permissions:
  contents: read
concurrency:
  group: anthares-private-ci-quota-rescue
  cancel-in-progress: false

# Trusted main only; no PR/fork execution. Never deploy, mirror, publish or upload source/artifacts.
jobs:
  clipper-private-qa:
    if: ${{ inputs.component == '' || inputs.component == 'both' || inputs.component == 'clipper' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve GitLab API credential from Anthares Secrets when configured
        id: bws-auth
        if: ${{ vars.ANTHARES_SECRETS_GITLAB_TOKEN_ID != '' }}
        continue-on-error: true
        uses: bitwarden/sm-action@f1de238fc00c738c56140796018be9084c2b5d21
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            ${{ vars.ANTHARES_SECRETS_GITLAB_TOKEN_ID }} > ANTHARES_GITLAB_TOKEN_FROM_BW
      - name: Clone authorized private Clipper repository read-only
        shell: bash
        env:
          GL_AUTH: ${{ env.ANTHARES_GITLAB_TOKEN_FROM_BW || secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GL_AUTH" || { echo "::error::CLIPPER_READ_CREDENTIAL_NOT_AVAILABLE"; exit 1; }
          auth="$(printf 'oauth2:%s' "$GL_AUTH" | base64 -w0)"
          if ! git -c "http.extraheader=AUTHORIZATION: Basic $auth" clone --quiet --depth 1 --branch main \
            https://gitlab.com/UniversoAnthares/anthares-clipper.git source >/dev/null 2>&1; then
            echo "::error::CLIPPER_SOURCE_READ_DENIED"
            exit 1
          fi
          unset auth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate private Clipper code without exposing test output
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          if ! python -m pip install --quiet requests pillow yt-dlp imageio-ffmpeg tzdata >/dev/null 2>&1; then
            echo "::error::CLIPPER_REQUIREMENTS_FAILED"; exit 1
          fi
          if ! python -m py_compile clipper.py youtube_metadata_policy.py clipper_entrypoint.py tools/gitlab_runtime_publish.py tests/test_youtube_metadata_policy.py tests/test_clipper_e2e_contract.py tests/test_workflow_metadata_entrypoint.py > /tmp/clipper-qa.log 2>&1; then
            echo "::error::CLIPPER_COMPILE_FAILED"; exit 1
          fi
          if ! python -m unittest tests.test_youtube_metadata_policy tests.test_clipper_e2e_contract tests.test_workflow_metadata_entrypoint -v >> /tmp/clipper-qa.log 2>&1; then
            echo "::error::CLIPPER_CONTRACT_FAILED"; exit 1
          fi
          for f in cloudflare-worker/src/index.js cloudflare-worker/src/runtime-secrets.js cloudflare-worker/src/git-provider-router.js; do
            if ! node --check "$f" >> /tmp/clipper-qa.log 2>&1; then
              echo "::error::CLIPPER_WORKER_SYNTAX_FAILED"; exit 1
            fi
          done
          echo "CLIPPER_PRIVATE_GITHUB_RUNNER=PASS"
  wordpress-private-qa:
    if: ${{ inputs.component == '' || inputs.component == 'both' || inputs.component == 'wordpress' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: wordpress-mirror
    steps:
      - name: Clone authorized private WordPress repository read-only
        uses: actions/checkout@v4
        with:
          repository: UniversoAnthares/anthares-wordpress
          ref: main
          token: ${{ secrets.WORDPRESS_MIRROR_GITHUB_READ_TOKEN }}
          persist-credentials: false
          path: source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Run private WordPress QA without exposing internal findings
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p .qa-results
          if ! find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 -P 4 php -l >/tmp/wordpress-qa.log 2>&1; then
            echo "::error::WORDPRESS_SYNTAX_FAILED"; exit 1
          fi
          for qa in qa/anthares-account-contract-qa.php qa/anthares-extreme-static-qa.php qa/anthares-orchestrator-qa.php; do
            if ! php "$qa" >>/tmp/wordpress-qa.log 2>&1; then
              echo "::error::WORDPRESS_CONTRACT_FAILED_FILE=$(basename "$qa")"
              # Only machine-readable issue codes are allowed in the public runner log.
              grep '^CRITICAL |' /tmp/wordpress-qa.log | cut -d'|' -f2 | sort -u | head -20 | sed 's/^/WORDPRESS_QA_CODE=/' || true
              exit 1
            fi
          done
          # Verify that overlapping clips with different WordPress assets remain
          # pending, including the final cleanup/retention safety guard.
          if ! php tests/test-cortes-overlap-identity.php >>/tmp/wordpress-qa.log 2>&1; then
            echo "::error::WORDPRESS_CORTES_OVERLAP_IDENTITY_FAILED"
            exit 1
          fi
          echo "WORDPRESS_CORTES_OVERLAP_IDENTITY=PASS"
          echo "WORDPRESS_PRIVATE_GITHUB_RUNNER=PASS"
