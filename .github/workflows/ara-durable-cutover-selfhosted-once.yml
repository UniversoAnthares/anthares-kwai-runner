name: ARA durable control cutover self-hosted one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ara-durable-cutover-selfhosted-once.yml']
permissions:
  contents: read
jobs:
  cutover:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Point installed agent to durable PostgreSQL control
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='C:\ProgramData\AntharesRemoteAgent'
          $launcher=Join-Path $dir 'run-agent.ps1'
          if(-not(Test-Path $launcher)){throw 'launcher_missing'}
          $target='https://anthares-ara-control.onrender.com'
          $backup=Join-Path $dir 'run-agent.pre-postgres.ps1'
          Copy-Item -Force $launcher $backup
          $lines=Get-Content $launcher
          $found=$false
          $new=@()
          foreach($line in $lines){
            if($line -match '^\$env:ANTHARES_CONTROL_URL='){
              $new += ('$env:ANTHARES_CONTROL_URL='''+$target+'''')
              $found=$true
            } else { $new += $line }
          }
          if(-not $found){throw 'control_url_line_missing'}
          Set-Content -Path $launcher -Value $new -Encoding UTF8
          $verify=(Get-Content $launcher | Where-Object {$_ -match '^\$env:ANTHARES_CONTROL_URL='} | Select-Object -First 1)
          if($verify -ne ('$env:ANTHARES_CONTROL_URL='''+$target+'''')){throw 'launcher_verify_failed'}
          Get-Process 'anthares-remote-agent' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
          $env:RUNNER_TRACKING_ID=''
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$launcher
          Start-Sleep -Seconds 15
          $proc=Get-Process 'anthares-remote-agent' -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $proc){throw 'agent_process_not_running'}
          $health=Invoke-RestMethod -Uri ($target+'/healthz') -Method Get -TimeoutSec 20
          if(-not $health.ok){throw 'durable_control_health_failed'}
          'CUTOVER=PROVEN'
          'CONTROL='+$target
          'PID='+$proc.Id
          'DURABLE_CONTROL_HEALTH=OK'
