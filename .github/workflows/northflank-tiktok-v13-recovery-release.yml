name: TikTok Northflank existing service bounded v16 recovery
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-tiktok-v13-recovery-release.yml']
permissions:
  contents: read
concurrency:
  group: northflank-tiktok-v16-production-existing-service
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Rebuild exclusively the existing Anthares TikTok Northflank git service and verify FFmpeg/Chromium v14
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.error,urllib.parse
          T=os.getenv('NORTHFLANK_API_TOKEN','')
          SHARED=os.getenv('ARA_SHARED','')
          assert len(T)>20 and len(SHARED)>20,'NORTHFLANK_AUTH_NOT_CONFIGURED'
          ROOT='https://api.northflank.com/v1'
          LIVE='https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run'
          EXPECTED='2026-11-12-browser-ffmpeg-session-v16'
          def call(url,token,method='GET',body=None,timeout=25):
              headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'Anthares-Northflank-TikTok-V14-Bounded-Recovery/1.0'}
              if body is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(url,method=method,headers=headers,data=json.dumps(body).encode() if body is not None else None)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as res:
                      data=res.read(100000)
                      return res.status,json.loads(data) if data else {}
              except urllib.error.HTTPError as ex:
                  return ex.code,{}
              except Exception as ex:
                  print('NF_NETWORK='+type(ex).__name__+' host='+str(urllib.parse.urlparse(url).hostname),flush=True)
                  return 0,{}
          c,rev=call(LIVE+'/interactive-browser/revision',SHARED,timeout=13)
          print('NF_CURRENT_REVISION_HTTP='+str(c),flush=True)
          if c==200 and rev.get('revision')==EXPECTED:
              print('NF_V16_RELEASE_ALREADY_ACTIVE=1',flush=True)
          else:
              c,p=call(ROOT+'/projects',T)
              if c!=200:raise SystemExit('NF_ADMIN_INVALID_HTTP_'+str(c))
              projects=(p.get('data') or {}).get('projects') or []
              if isinstance(projects,dict):projects=list(projects.values())
              found=[]
              for project in projects:
                  pid=project.get('id')
                  if not pid:continue
                  status,ss=call(ROOT+'/projects/'+pid+'/services',T)
                  if status!=200:continue
                  services=(ss.get('data') or {}).get('services') or []
                  if isinstance(services,dict):services=list(services.values())
                  for s in services:
                      if s.get('name')=='anthares-tiktok-northflank':
                          found.append((pid,s.get('id') or s.get('name')))
              if len(found)!=1:raise SystemExit('NF_TARGET_SERVICE_AMBIGUOUS_'+str(len(found)))
              pid,sid=found[0]
              endpoint=ROOT+'/projects/'+urllib.parse.quote(pid,safe='')+'/services/'+urllib.parse.quote(sid,safe='')
              c,d=call(endpoint,T)
              data=(d.get('data') or {}) if c==200 else {}
              vcs=data.get('vcsData') or {}
              if c!=200 or data.get('buildSource')!='git' or 'UniversoAnthares/anthares-clipper' not in str(vcs.get('projectUrl') or ''):
                  raise SystemExit('NF_SERVICE_SOURCE_UNVERIFIED_SAFE_STOP')
              print('NF_TARGET_EXISTING_GIT_SOURCE_VERIFIED=1',flush=True)
              c,_=call(endpoint+'/build',T,method='POST',body={},timeout=45)
              print('NF_EXISTING_SERVICE_BUILD_HTTP='+str(c),flush=True)
              if c==409:
                  # Northflank already has the Git-sourced build/deploy in flight.
                  # Do not send a second build; wait for the requested revision.
                  print('NF_EXISTING_BUILD_IN_PROGRESS=1',flush=True)
              elif c not in (200,201,202):
                  raise SystemExit('NF_EXPLICIT_BUILD_REJECTED_'+str(c))
              for attempt in range(50):
                  time.sleep(10)
                  c,rev=call(LIVE+'/interactive-browser/revision',SHARED,timeout=13)
                  if c==200 and rev.get('revision')==EXPECTED:
                      print('NF_V16_DEPLOYMENT_CONFIRMED=1',flush=True)
                      break
                  if attempt%5==0:print('NF_DEPLOY_WAITING_10SEC_STEP='+str(attempt+1)+' http='+str(c),flush=True)
              else:raise SystemExit('NF_V16_DEPLOYMENT_TIMEOUT')
          for i in range(18):
              c,h=call(LIVE+'/health',SHARED,timeout=12)
              if c==200 and h.get('ok') is True and h.get('ffmpeg_ready') is True:
                  print('NF_FFMPEG_REAL_ENCODE_AND_CUT_PASS=1',flush=True)
                  break
              print('NF_FFMPEG_CHECK http='+str(c)+' checked='+str(h.get('ffmpeg_checked'))+' ready='+str(h.get('ffmpeg_ready')),flush=True)
              time.sleep(5)
          else:raise SystemExit('NF_FFMPEG_SELF_TEST_UNVERIFIED')
          c,s=call(LIVE+'/interactive-browser/status',SHARED,timeout=12)
          print('NF_BROWSER_STATUS_HTTP='+str(c),flush=True)
          if c!=200 or s.get('ok') is not True or s.get('backend')!='northflank_chromium_cdp':
              raise SystemExit('NF_BROWSER_STATUS_UNVERIFIED')
          print('NF_BROWSER_STATUS_V14_PASS=1',flush=True)
          c,ss=call(LIVE+'/session-status',SHARED,timeout=12)
          print('NF_TIKTOK_SESSION_HTTP='+str(c),flush=True)
          print('NF_TIKTOK_IDENTITY_VERIFIED='+str(bool(ss.get('identity_verified'))),flush=True)
          print('NF_TIKTOK_SESSION_BOOTSTRAPPED='+str(bool(ss.get('bootstrapped'))),flush=True)
          if c!=200 or ss.get('ok') is not True:
              raise SystemExit('NF_TIKTOK_SESSION_STATUS_UNVERIFIED')
          print('NF_V16_EXISTING_SERVICE_RECOVERY_COMPLETE=1',flush=True)
          PY
