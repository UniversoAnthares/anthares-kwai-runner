name: X Cloud Anthares Browser Identity Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      PYTHONUTF8: '1'
      ANTHARES_X_VIRTUAL_DISPLAY: '1'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated headless Chromium and encrypted vault support
        run: |
          python -m pip install --disable-pip-version-check requests cryptography playwright
          python -m playwright install --with-deps chromium
      - name: Check exact X account on private virtual display without posting
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get install -y -qq xvfb
          fi
          xvfb-run -a python -u tools/x_cloud_browser_identity_probe.py
