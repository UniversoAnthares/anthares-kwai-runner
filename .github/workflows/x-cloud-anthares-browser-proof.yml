name: X Cloud Anthares Browser Identity Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/x-cloud-anthares-browser-proof.yml
      - tools/x_cloud_browser_identity_probe.py

permissions:
  contents: read
  issues: write

concurrency:
  group: anthares-x-readonly-identity-probe
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      PYTHONUTF8: '1'
      ANTHARES_X_VIRTUAL_DISPLAY: '1'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Chromium and encrypted vault support
        run: |
          python -m pip install --disable-pip-version-check requests cryptography playwright
          python -m playwright install --with-deps chromium
      - name: Check exact X account on private virtual display without posting
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get install -y -qq xvfb
          fi
          xvfb-run -a python -u tools/x_cloud_browser_identity_probe.py

      - name: Escalate failed cloud identity verification as QA P0
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/UniversoAnthares/anthares-kwai-runner/issues/380/comments \
            -f "body=X_CLOUD_READONLY_AUTH_P0 workflow=x-cloud-anthares-browser-proof.yml run=${{ github.run_id }} failure=identity_not_proven; keep_windows_primary=true; no_post_attempted=true"
