name: Instagram calculated slot - feature branch tests
on:
  push:
    branches: [fix/instagram-proportional-deadline-pacing-20261112]
permissions:
  contents: read
jobs:
  test-proportional:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate authoritative pacing and no fixed publication interval
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet imageio-ffmpeg pillow
          python -m py_compile tools/cortes_instagram_direct_cloud.py
          python -m unittest discover -s tests -p 'test_instagram_direct_cloud.py' -v
          node --check infra/neon-cortes-queue/index.mjs
          node --test tests/test_instagram_deadline_pacing.mjs
          node --test tests/test_instagram_public_neon.mjs
