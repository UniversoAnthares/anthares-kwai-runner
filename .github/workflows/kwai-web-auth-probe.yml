name: Kwai Web Auth Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kwai-web-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      KWAI_EXPECTED_ACCOUNT: lucasrosalem
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Kwai phone authentication path
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          npm install --no-save playwright-core >/tmp/npm-playwright.log 2>&1
          cat >kwai-probe.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME_BIN, args:['--no-sandbox','--disable-dev-shm-usage']});
          const context = await browser.newContext({viewport:{width:1440,height:1000}, locale:'en-US'});
          const page = await context.newPage();
          await page.goto('https://www.kwai.com/', {waitUntil:'domcontentloaded', timeout:90000});
          await page.waitForTimeout(4000);
          await page.locator('.login-logo').first().click({timeout:10000});
          await page.waitForTimeout(1500);
          const usePhone = page.getByText('Use Phone',{exact:true}).first();
          console.log('KWAI_USE_PHONE_COUNT='+await usePhone.count());
          if (!(await usePhone.count())) throw new Error('KWAI_USE_PHONE_NOT_FOUND');
          await usePhone.click({timeout:10000});
          await page.waitForTimeout(2000);
          const body = await page.locator('body').innerText();
          const lines=[...new Set(body.split('\n').map(x=>x.trim()).filter(Boolean))];
          console.log('KWAI_PHONE_RELEVANT='+JSON.stringify(lines.filter(x=>/phone|mobile|code|password|log|sign|country|sms|verification|email|continue|next|send/i.test(x)).slice(0,120)));
          const inputs=await page.locator('input:visible').evaluateAll(es=>es.map((e,i)=>({i,type:e.type,placeholder:e.placeholder,name:e.name,autocomplete:e.autocomplete,maxLength:e.maxLength,aria:e.getAttribute('aria-label')})));
          console.log('KWAI_PHONE_INPUTS='+JSON.stringify(inputs));
          const controls=await page.locator('button:visible,[role=button]:visible,.ant-btn:visible,.login-btn:visible').evaluateAll(es=>es.map(e=>({text:(e.innerText||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,120),cls:String(e.className||'')})).filter(x=>x.text).slice(0,80));
          console.log('KWAI_PHONE_CONTROLS='+JSON.stringify(controls));
          await page.screenshot({path:'/tmp/kwai-phone-path.png',fullPage:true});
          fs.writeFileSync('/tmp/kwai-phone-path.html',await page.content());
          await browser.close();
          JS
          CHROME_BIN="$CHROME" timeout 150 node ./kwai-probe.mjs

      - name: Upload phone-path diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-web-phone-path
          path: |
            /tmp/kwai-phone-path.html
            /tmp/kwai-phone-path.png
            /tmp/npm-playwright.log
          if-no-files-found: ignore
          retention-days: 1
