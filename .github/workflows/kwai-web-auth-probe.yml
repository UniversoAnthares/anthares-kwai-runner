name: Kwai Web Auth Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kwai-web-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      KWAI_EXPECTED_ACCOUNT: lucasrosalem
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Google-linked Kwai authentication path
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          npm install --no-save playwright-core >/tmp/npm-playwright.log 2>&1
          cat >kwai-probe.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1440,height:1000},locale:'en-US'});
          const page=await context.newPage();
          await page.goto('https://www.kwai.com/',{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForTimeout(4000);
          await page.locator('.login-logo').first().click({timeout:10000});
          await page.waitForTimeout(1800);
          const frame=page.frameLocator('iframe[title="Sign in with Google Button"]');
          const gbtn=frame.locator('div[role=button],button').first();
          console.log('KWAI_GOOGLE_IFRAME_COUNT='+await page.locator('iframe[title="Sign in with Google Button"]').count());
          console.log('KWAI_GOOGLE_FRAME_BUTTON_COUNT='+await gbtn.count());
          const popupPromise=page.waitForEvent('popup',{timeout:15000}).catch(()=>null);
          if(await gbtn.count()) await gbtn.click({timeout:12000});
          else await page.locator('#login-popup-google-button').click({force:true,timeout:12000});
          const popup=await popupPromise;
          const target=popup||context.pages().at(-1)||page;
          await target.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{});
          await target.waitForTimeout(2500);
          const safeUrl=()=>{try{const u=new URL(target.url());return u.origin+u.pathname}catch{return 'unknown'}};
          console.log('KWAI_GOOGLE_TARGET='+safeUrl());
          const body=(await target.locator('body').innerText().catch(()=>''));
          const lines=[...new Set(body.split('\n').map(x=>x.trim()).filter(Boolean))];
          console.log('GOOGLE_AUTH_RELEVANT='+JSON.stringify(lines.filter(x=>/sign|email|phone|account|next|google|verify|code|security|browser|continue|choose/i.test(x)).slice(0,100)));
          const inputs=await target.locator('input:visible').evaluateAll(es=>es.map(e=>({type:e.type,name:e.name,placeholder:e.placeholder,autocomplete:e.autocomplete,aria:e.getAttribute('aria-label')}))).catch(()=>[]);
          console.log('GOOGLE_AUTH_INPUTS='+JSON.stringify(inputs));
          await target.screenshot({path:'/tmp/kwai-google-path.png',fullPage:true}).catch(()=>{});
          fs.writeFileSync('/tmp/kwai-google-path.html',await target.content().catch(()=>''));
          await browser.close();
          JS
          CHROME_BIN="$CHROME" timeout 180 node ./kwai-probe.mjs

      - name: Upload Google-path diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-web-google-path
          path: |
            /tmp/kwai-google-path.html
            /tmp/kwai-google-path.png
            /tmp/npm-playwright.log
          if-no-files-found: ignore
          retention-days: 1
