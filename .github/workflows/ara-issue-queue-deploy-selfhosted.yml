name: ARA issue queue cloud validation

on:
  push:
    branches: [main]
    paths:
      - 'anthares-remote-agent/**'
      - '.github/workflows/ara-issue-queue-deploy-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: read

# The user's Windows PC is never a GitHub Actions runner. This workflow only
# validates/builds recovery code on GitHub-hosted infrastructure; installation
# onto the PC is performed through the authenticated Anthares Remote admin path.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Test agent
        working-directory: anthares-remote-agent
        run: go test ./... -count=1

      - name: Build Windows queue-aware agent without executing it
        working-directory: anthares-remote-agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/anthares-remote-agent-v4.exe ./cmd/agent
          sha256sum dist/anthares-remote-agent-v4.exe

      - name: Parse Windows recovery scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'anthares-remote-agent/windows/run-agent-system-supervisor.ps1',
            'anthares-remote-agent/windows/load-issue-queue-auth.ps1',
            'anthares-remote-agent/windows/set-issue-queue-credentials.ps1',
            'anthares-remote-agent/windows/ara-recovery.ps1',
            'anthares-remote-agent/windows/github-queue-bridge.ps1'
          )
          foreach ($path in $files) {
            if (-not (Test-Path $path)) { throw "missing recovery file: $path" }
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell parse failed for $path`: $($errors[0].Message)" }
          }
          'ARA_QUEUE_RECOVERY_PARSE_OK=1'

      - name: Enforce no self-hosted/Render dependency in recovery supervisor
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qi 'onrender.com' anthares-remote-agent/windows/run-agent-system-supervisor.ps1
          grep -q 'ANTHARES_GITHUB_QUEUE' anthares-remote-agent/windows/run-agent-system-supervisor.ps1
          grep -q 'ANTHARES_GITLAB_QUEUE' anthares-remote-agent/windows/run-agent-system-supervisor.ps1
          echo 'ARA_QUEUE_CLOUD_VALIDATION_OK=1'

      - uses: actions/upload-artifact@v4
        with:
          name: anthares-remote-agent-v4-windows-amd64
          path: anthares-remote-agent/dist/anthares-remote-agent-v4.exe
          if-no-files-found: error
