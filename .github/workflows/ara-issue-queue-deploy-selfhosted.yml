name: ARA issue queue deploy self-hosted

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ara-issue-queue-deploy-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Test and build current agent
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:GITHUB_WORKSPACE\anthares-remote-agent"
          & go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
          & go build -trimpath -ldflags '-s -w' -o 'dist\anthares-remote-agent.exe' ./cmd/agent
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          Get-FileHash 'dist\anthares-remote-agent.exe' -Algorithm SHA256 | Select-Object Algorithm,Hash,Path

      - name: Discover existing local queue credentials without printing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_TERMINAL_PROMPT = '0'
          $secretRoot = 'C:\ProgramData\AntharesRemoteAgent\secrets'
          New-Item -ItemType Directory -Force -Path $secretRoot | Out-Null
          $handoff = Join-Path $secretRoot 'deployment-auth.json'
          $result = [ordered]@{ github='missing'; gitlab='missing' }

          $ghToken = $null
          if (Get-Command gh.exe -ErrorAction SilentlyContinue) {
            try { $ghToken = (& gh.exe auth token --hostname github.com 2>$null | Select-Object -First 1).Trim() } catch {}
          }
          if (-not $ghToken -and (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            try {
              $raw = "protocol=https`nhost=github.com`n`n" | & git.exe credential fill 2>$null
              $line = $raw | Where-Object { $_ -like 'password=*' } | Select-Object -First 1
              if ($line) { $ghToken = $line.Substring(9) }
            } catch {}
          }
          if ($ghToken) {
            try {
              $h = @{Authorization="Bearer $ghToken";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
              $m = Invoke-RestMethod -Headers $h -Uri 'https://api.github.com/repos/UniversoAnthares/anthares-ara-queue' -TimeoutSec 15
              if ($m.private) { $result.github='available' } else { $ghToken=$null }
            } catch { $ghToken=$null }
          }

          $glToken = $null
          if (Get-Command glab.exe -ErrorAction SilentlyContinue) {
            try { $glToken = (& glab.exe auth token --hostname gitlab.com 2>$null | Select-Object -First 1).Trim() } catch {}
          }
          if (-not $glToken -and (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            try {
              $raw = "protocol=https`nhost=gitlab.com`n`n" | & git.exe credential fill 2>$null
              $line = $raw | Where-Object { $_ -like 'password=*' } | Select-Object -First 1
              if ($line) { $glToken = $line.Substring(9) }
            } catch {}
          }
          if ($glToken) {
            try {
              $h = @{'PRIVATE-TOKEN'=$glToken}
              $m = Invoke-RestMethod -Headers $h -Uri 'https://gitlab.com/api/v4/projects/87307279' -TimeoutSec 15
              if ($m.visibility -ne 'public') { $result.gitlab='available' } else { $glToken=$null }
            } catch { $glToken=$null }
          }

          # Never write plaintext tokens. Protect the temporary handoff itself
          # with DPAPI LocalMachine, then delete it after permanent provisioning.
          function Protect([string]$value) {
            if (-not $value) { return $null }
            $entropy=[Text.Encoding]::UTF8.GetBytes('AntharesRemoteAgentDeployAuthV1')
            $plain=[Text.Encoding]::UTF8.GetBytes($value)
            try { return [Convert]::ToBase64String([Security.Cryptography.ProtectedData]::Protect($plain,$entropy,[Security.Cryptography.DataProtectionScope]::LocalMachine)) }
            finally { [Array]::Clear($plain,0,$plain.Length) }
          }
          @{github=(Protect $ghToken);gitlab=(Protect $glToken)} | ConvertTo-Json | Set-Content -LiteralPath $handoff -Encoding UTF8
          & icacls.exe $handoff /inheritance:r /grant:r '*S-1-5-18:F' '*S-1-5-32-544:F' "$env:USERNAME`:F" | Out-Null
          $result | ConvertTo-Json -Compress
          if (-not $ghToken -and -not $glToken) { throw 'No existing local GitHub/GitLab credential can access a private queue.' }

      - name: Install queue-aware agent and SYSTEM supervisor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "$env:GITHUB_WORKSPACE\anthares-remote-agent"
          $install = 'C:\ProgramData\AntharesRemoteAgent'
          $secretRoot = Join-Path $install 'secrets'
          $handoff = Join-Path $secretRoot 'deployment-auth.json'
          New-Item -ItemType Directory -Force -Path $install | Out-Null

          foreach ($name in @('run-agent-system-supervisor.ps1','load-issue-queue-auth.ps1','set-issue-queue-credentials.ps1','ara-recovery.ps1')) {
            Copy-Item -Force (Join-Path "$src\windows" $name) (Join-Path $install $name)
          }

          function Unprotect([string]$value) {
            if (-not $value) { return $null }
            $entropy=[Text.Encoding]::UTF8.GetBytes('AntharesRemoteAgentDeployAuthV1')
            $plain=[Security.Cryptography.ProtectedData]::Unprotect([Convert]::FromBase64String($value),$entropy,[Security.Cryptography.DataProtectionScope]::LocalMachine)
            try { return [Text.Encoding]::UTF8.GetString($plain) }
            finally { [Array]::Clear($plain,0,$plain.Length) }
          }
          $auth = Get-Content -LiteralPath $handoff -Raw -Encoding UTF8 | ConvertFrom-Json
          $gh = Unprotect ([string]$auth.github)
          $gl = Unprotect ([string]$auth.gitlab)
          try {
            $ghSecure = if ($gh) { ConvertTo-SecureString $gh -AsPlainText -Force } else { $null }
            $glSecure = if ($gl) { ConvertTo-SecureString $gl -AsPlainText -Force } else { $null }
            & (Join-Path $install 'set-issue-queue-credentials.ps1') -GithubToken $ghSecure -GitlabToken $glSecure -GithubRepository 'UniversoAnthares/anthares-ara-queue' -GithubAuthor 'UniversoAnthares' -GitlabProject 'universo-anthares-group/anthares-kwai-runner' -GitlabAuthor 'UniversoAnthares' -IntervalSeconds 20
          } finally {
            $gh=$null; $gl=$null; $ghSecure=$null; $glSecure=$null
            Remove-Item -LiteralPath $handoff -Force -ErrorAction SilentlyContinue
          }

          $newExe = Join-Path $src 'dist\anthares-remote-agent.exe'
          $stagedExe = Join-Path $install 'anthares-remote-agent.v4.new.exe'
          Copy-Item -Force $newExe $stagedExe
          $hash = (Get-FileHash $stagedExe -Algorithm SHA256).Hash.ToLowerInvariant()

          $taskName = 'Anthares Remote Agent SYSTEM'
          Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          Get-Process 'anthares-remote-agent','anthares-remote-agent-standard' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 800
          Move-Item -Force $stagedExe (Join-Path $install 'anthares-remote-agent.exe')

          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ProgramData\AntharesRemoteAgent\run-agent-system-supervisor.ps1"'
          $trigger = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -MultipleInstances IgnoreNew -RestartCount 20 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero)
          Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force | Out-Null
          Start-ScheduledTask -TaskName $taskName
          Start-Sleep -Seconds 15

          $proc = Get-Process 'anthares-remote-agent' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proc) { throw 'queue-aware agent did not stay running' }
          $statePath = Join-Path $install 'system-supervisor-state.json'
          if (-not (Test-Path $statePath)) { throw 'supervisor state file missing' }
          $state = Get-Content $statePath -Raw | ConvertFrom-Json
          if (-not $state.queue_failover) { throw 'issue queue transport not active' }

          [ordered]@{
            install='PROVEN'
            exe_sha256=$hash
            pid=$proc.Id
            supervisor_mode=$state.mode
            github_queue=$state.github_queue
            gitlab_queue=$state.gitlab_queue
            cloudflare_required=$state.cloudflare_required
            render_required=$state.render_required
          } | ConvertTo-Json | Set-Content (Join-Path $install 'issue-queue-install-report.json') -Encoding UTF8

      - name: Show non-secret deployment proof
        shell: powershell
        run: Get-Content 'C:\ProgramData\AntharesRemoteAgent\issue-queue-install-report.json'
