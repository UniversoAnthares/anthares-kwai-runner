name: Anthares Secrets - one-time GitLab token migration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/migrate_gitlab_token_to_bws.py'
      - '.github/workflows/anthares-secrets-gitlab-migrate.yml'
permissions:
  contents: read
concurrency:
  group: anthares-secrets-privileged-one-time-migration
  cancel-in-progress: false
jobs:
  migration-prerequisites:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check code and presence of temporary writer access only
        env:
          BWS_WRITER: ${{ secrets.BWS_MIGRATION_WRITE_TOKEN }}
          GL_SOURCE: ${{ secrets.GITLAB_TOKEN }}
        run: |
          python3 -m py_compile tools/migrate_gitlab_token_to_bws.py
          if [ -n "$BWS_WRITER" ]; then echo "MIGRATION_WRITER_AVAILABLE=YES"; else echo "MIGRATION_WRITER_AVAILABLE=NO"; fi
          if [ -n "$GL_SOURCE" ]; then echo "GITLAB_SOURCE_AVAILABLE=YES"; else echo "GITLAB_SOURCE_AVAILABLE=NO"; fi
  migration:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check required credentials without exposing values
        env:
          BWS_WRITER: ${{ secrets.BWS_MIGRATION_WRITE_TOKEN }}
          GL_SOURCE: ${{ secrets.GITLAB_TOKEN }}
          BWS_READER: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BWS_WRITER" || { echo "::error::BWS_MIGRATION_WRITE_TOKEN_MISSING"; exit 2; }
          test -n "$GL_SOURCE" || { echo "::error::GITLAB_SOURCE_TOKEN_MISSING"; exit 2; }
          test -n "$BWS_READER" || { echo "::error::BWS_READ_TOKEN_MISSING"; exit 2; }
      - name: Install official Bitwarden CLI with pinned SHA256
        run: |
          set -euo pipefail
          version=2.1.0
          archive="bws-x86_64-unknown-linux-gnu-${version}.zip"
          curl -fsSL --retry 2 "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${version}/${archive}" -o "/tmp/${archive}"
          echo "ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  /tmp/${archive}" | sha256sum -c - >/dev/null
          mkdir -p /tmp/anthares-bws
          unzip -q "/tmp/${archive}" -d /tmp/anthares-bws
          chmod 700 /tmp/anthares-bws/bws
      - name: Create if absent and verify copied token inside Anthares Automation
        env:
          BWS_MIGRATION_WRITE_TOKEN: ${{ secrets.BWS_MIGRATION_WRITE_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python3 tools/migrate_gitlab_token_to_bws.py
      - name: Verify new secret with independent read-only machine account
        uses: bitwarden/sm-action@f1de238fc00c738c56140796018be9084c2b5d21
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            ${{ env.ANTHARES_MIGRATED_SECRET_ID }} > ANTHARES_IMPORTED_GITLAB_TOKEN
      - name: Confirm round trip without logging the token
        env:
          ORIGINAL: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ANTHARES_IMPORTED_GITLAB_TOKEN:-}"
          test "$ANTHARES_IMPORTED_GITLAB_TOKEN" = "$ORIGINAL" || { echo "::error::BWS_READBACK_MISMATCH"; exit 1; }
          echo "ANTHARES_GITLAB_TOKEN_STORED_AND_READABLE=PASS"
# The source GitHub secret stays intact. Revoke the temporary writer token after
# success. Do not schedule this workflow or run it from an untrusted pull request.
