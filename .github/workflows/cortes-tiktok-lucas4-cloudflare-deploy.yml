name: CORTES TikTok lucasrosalem4 Cloudflare Neon edge deploy
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact reviewed Git SHA (40 lowercase hex characters)'
        required: true
        type: string
      mode:
        description: 'Approved release or incident recovery'
        required: true
        default: release
        type: choice
        options:
          - release
          - emergency
      incident_ref:
        description: 'Mandatory incident reference for emergency recovery'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cortes-tiktok-lucas4-edge-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require approved SHA and incident-scoped emergency recovery
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'RELEASE_SHA_INVALID'; exit 1; }
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA" || { echo 'RELEASE_SHA_MISMATCH'; exit 1; }
          main_sha="$(curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$RELEASE_MODE" == release ]]; then
            test "$APPROVED_SHA" = "$main_sha" || { echo 'RELEASE_MAIN_MOVED'; exit 1; }
          elif [[ "$RELEASE_MODE" == emergency ]]; then
            test -n "$INCIDENT_REF" || { echo 'EMERGENCY_INCIDENT_REQUIRED'; exit 1; }
            git merge-base --is-ancestor "$APPROVED_SHA" "$main_sha" || { echo 'EMERGENCY_SHA_OUTSIDE_MAIN'; exit 1; }
          else
            echo 'RELEASE_MODE_INVALID'; exit 1
          fi
          echo "RELEASE_APPROVED_SHA=$APPROVED_SHA mode=$RELEASE_MODE"
      - name: Verify secondary edge isolation and exact backend
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --check infra/cloudflare-cortes-tiktok-lucas4-ha/src/index.js
          node --check infra/neon-cortes-lucasrosalem4/index.mjs
          grep -q 'cortestiktok4.compute' infra/cloudflare-cortes-tiktok-lucas4-ha/src/index.js
          ! grep -q 'vercel.app' infra/cloudflare-cortes-tiktok-lucas4-ha/src/index.js
      - name: Deploy isolated Cloudflare queue ingress
        run: npx --yes wrangler@4.43.0 deploy --config infra/cloudflare-cortes-tiktok-lucas4-ha/wrangler.toml
      - name: Prove health and block unauthenticated queue writes
        run: |
          set -euo pipefail
          url=https://anthares-cortes-tiktok-lucas4-ha.anthares1.workers.dev
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 12 "$url/?action=health" -o /tmp/secondary-ha.json; then
              if node -e 'let d=require("/tmp/secondary-ha.json");process.exit(d.ok&&d.service==="cortes-tiktok-lucas4-neon"&&d.account==="lucasrosalem4"&&d.fencing?0:1)'; then break; fi
            fi
            sleep 5
          done
          node -e 'let d=require("/tmp/secondary-ha.json");if(!d.ok||d.account!=="lucasrosalem4"||!d.fencing)process.exit(1)'
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$url/?action=start")
          test "$status" = "401"
          echo SECONDARY_EDGE_QUEUE_HA_PROVEN=1
