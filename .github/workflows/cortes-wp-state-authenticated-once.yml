name: CORTES WordPress authenticated QA - isolated one-time
on:
  push:
    branches:
      - qa/wp-state-auth-restoration-20261027-chatgpt
    paths:
      - .github/workflows/cortes-wp-state-authenticated-once.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: wp-state-auth-isolated-once
  cancel-in-progress: false
jobs:
  wordpress-readonly:
    runs-on: qa-p0-independent
    timeout-minutes: 4
    env:
      WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      PYTHONUTF8: "1"
    steps:
      - name: Authenticated GET of canonical state only; sanitized status
        id: rest
        continue-on-error: true
        shell: powershell
        run: |
          $script = @'
          import os, sys, base64, json, urllib.request, urllib.error
          site=os.getenv("WP_SITE_URL","").strip().rstrip("/")
          user=os.getenv("WP_USERNAME","").strip()
          password="".join(os.getenv("WP_APP_PASSWORD","").split())
          missing=[key for key, val in (("WP_SITE_URL",site),("WP_USERNAME",user),("WP_APP_PASSWORD",password)) if not val]
          def done(status):
              print("WP_QA_AUTH_RESULT="+status,flush=True)
              sys.exit(0 if status=="PASS_HTTP_200_VALID_JSON" else 3)
          if missing:
              print("WP_QA_MISSING_REFERENCE="+",".join(missing),flush=True)
              done("AUTH_MISSING")
          if site not in ("https://anthares.us", "https://www.anthares.us"):
              done("INVALID_SITE")
          authorization=base64.b64encode((user+":"+password).encode("utf-8")).decode("ascii")
          request=urllib.request.Request(site+"/wp-json/anthares/v1/cortes/state",
              headers={"Accept":"application/json","Authorization":"Basic "+authorization,
                       "User-Agent":"AntharesCortesAuthQA/1"},method="GET")
          try:
              with urllib.request.urlopen(request,timeout=18) as response:
                  if response.status!=200:
                      done("HTTP_"+str(response.status))
                  raw=response.read(1024*1024)
                  data=json.loads(raw.decode("utf-8"))
                  if not isinstance(data,dict) or not ("items" in data or "blocker" in data):
                      done("INVALID_RESPONSE")
                  done("PASS_HTTP_200_VALID_JSON")
          except urllib.error.HTTPError as exc:
              done("HTTP_"+str(exc.code))
          except (urllib.error.URLError, TimeoutError, OSError):
              done("NETWORK_UNAVAILABLE")
          except (UnicodeError, ValueError, TypeError):
              done("INVALID_RESPONSE")
          '@
          $script | & 'C:\Users\Lucas\AppData\Local\Programs\Python\Python311\python.exe' -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authorized hosting SSH / WP-CLI read-only contingency
        if: steps.rest.outcome == 'failure'
        shell: powershell
        run: |
          $cmd = "cd domains/anthares.us/public_html && /opt/alt/php83/usr/bin/php /usr/local/bin/wp eval 'echo count(anthares_cortes_registry_get());'"
          $result = & 'C:\Program Files\OpenSSH\ssh.exe' -oBatchMode=yes -oStrictHostKeyChecking=yes -oConnectTimeout=8 anthares-hostinger $cmd 2>$null
          $code = $LASTEXITCODE
          if ($code -eq 0 -and (($result -join '') -match '^\s*[0-9]+\s*$')) {
            Write-Output "WP_QA_AUTH_RESULT=PASS_SSH_WPCLI_READONLY"
            exit 0
          }
          Write-Output "WP_QA_AUTH_RESULT=AUTH_MISSING_AND_SSH_UNAVAILABLE"
          exit 3
