name: One-time bounded vault code hotpatch Northflank
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-vault-bounded-hotpatch-once.yml']
permissions:
  contents: read
jobs:
  hotpatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Patch same container after checking durable vault and protected cookies
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN,shared=process.env.ARA_SHARED;
          if(!token||token.length<20||!shared||shared.length<20)throw Error('AUTH_MISSING');
          const get=async(path)=>{const r=await fetch('https://api.northflank.com/v1'+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('NF_HTTP_'+r.status);return r.json();};
          const found=[];for(const p of (await get('/projects')).data?.projects||[])for(const s of (await get('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[])if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);
          if(found.length!==1)throw Error('SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0],ctx=new ApiClientInMemoryContextProvider();await ctx.addContext({name:'safe',token});
          const cli=new ApiClient(ctx),root='https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run';
          async function command(script,label){
           const res=await cli.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',script]});
           console.log(label+'_EXIT='+String(res.commandResult?.exitCode));
           console.log(label+'_RESULT='+String(res.stdOut||'').trim().slice(0,1000).replace(/[\r\n]+/g,' | '));
           if(res.commandResult?.exitCode!==0)throw Error(label+'_FAILED');
           return String(res.stdOut||'');
          }
          async function api(method,path,body){
           const headers={Authorization:'Bearer '+shared,Accept:'application/json'};
           if(body!==undefined)headers['Content-Type']='application/json';
           const res=await fetch(root+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(25000)});
           const data=await res.json().catch(()=>({}));
           return {code:res.status,data};
          }
          const preflight=String.raw`
          import sys,os
          sys.path.insert(0,"/app/render-tiktok-worker")
          from browser_state_vault import load_runtime_state
          import browser_executor as b
          saved=load_runtime_state(timeout=12)
          cookies=saved.get("cookies",[]) if isinstance(saved,dict) else []
          if len(cookies)<20:raise SystemExit("NO_SAFE_ENCRYPTED_VAULT")
          print("VAULT_COOKIES_PRESENT="+str(len(cookies)),flush=True)
          if b._quick_running():
           current=b._export_state()
           auth={"sessionid","sessionid_ss","sid_tt","sid_guard","uid_tt","uid_tt_ss"}
           def keys(s):
            return {(c.get("name"),c.get("domain"),c.get("value")) for c in s if isinstance(c,dict) and str(c.get("name","")).lower() in auth}
           x=keys(cookies)
           y=keys(current.get("cookies") or [])
           if not x or not x.issubset(y):raise SystemExit("AUTH_MISMATCH_SAFE_STOP")
           print("SAFE_TO_RELEASE_CURRENT_CHROMIUM=1",flush=True)
          else:print("CHROMIUM_ALREADY_INACTIVE=1",flush=True)
          `;
          const result=await command(preflight,'PREFLIGHT');
          const state=await api('GET','/interactive-browser/status');
          if(state.code!==200||!state.data.ok)throw Error('BROWSER_STATUS_ERROR');
          if(state.data.active){
           if(!result.includes('SAFE_TO_RELEASE_CURRENT_CHROMIUM=1'))throw Error('BACKUP_VERIFICATION_REQUIRED');
           const close=await api('POST','/interactive-browser/close',{});
           console.log('CHROMIUM_CLOSE_HTTP='+close.code);
           if(close.code!==200||!close.data.ok)throw Error('CHROMIUM_CLOSE_FAILED');
           await new Promise(r=>setTimeout(r,1000));
           const after=await api('GET','/interactive-browser/status');
           console.log('CHROMIUM_INACTIVE_AFTER_CLOSE='+(!after.data.active));
           if(after.data.active)throw Error('BROWSER_STILL_ACTIVE_SAFE_STOP');
          }
          const patch=String.raw`
          import os,sys,hashlib,base64,stat,subprocess,time,signal
          from pathlib import Path
          root=Path("/app/render-tiktok-worker")
          vault=root/"browser_state_vault.py"
          limit=root/"browser_state_limit.py"
          v=base64.b64decode("")
          l=base64.b64decode("")
          def gitblob(x):return hashlib.sha1(b"blob "+str(len(x)).encode()+b"\0"+x).hexdigest()
          if not vault.exists():raise SystemExit("VAULT_SOURCE_MISSING")
          old=vault.read_bytes()
          if gitblob(old)!="078acf0b412c1bc8e8a3f12daaa660eb2a20b702" and gitblob(old)!="7cc9a90711c5da6807d8d6d236867cd13822613d":raise SystemExit("VAULT_SOURCE_DRIFT")
          if limit.exists() and gitblob(limit.read_bytes())!="6191416c1de945a8d75e4e7e9d900fea5c448a39":raise SystemExit("LIMIT_SOURCE_DRIFT")
          for data,path in [(v,vault),(l,limit)]:
           compile(data.decode("utf-8"),str(path),"exec")
          if gitblob(old)!="7cc9a90711c5da6807d8d6d236867cd13822613d":
           bak=Path("/tmp/anthares-browser_state_vault.pre-bounded.py")
           if not bak.exists():bak.write_bytes(old);os.chmod(bak,0o600)
           if bak.read_bytes()!=old:raise SystemExit("BACKUP_DRIFT")
          for dest,data in [(limit,l),(vault,v)]:
           tmp=dest.with_suffix(dest.suffix+".next")
           tmp.write_bytes(data)
           os.chmod(tmp,0o644)
           os.replace(tmp,dest)
          proc=subprocess.check_output(["ps","-eo","pid,ppid,comm,args"],text=True)
          items=[]
          for line in proc.splitlines()[1:]:
           parts=line.strip().split(None,3)
           if len(parts)!=4:continue
           pid,ppid,comm,cmd=parts
           if pid.isdigit() and ppid.isdigit() and "gunicorn" in comm.lower() and "service_with_browser" in cmd:items.append((int(pid),int(ppid)))
          ids={pid for pid,_ in items}
          masters=[pid for pid,parent in items if parent not in ids]
          if len(masters)!=1:raise SystemExit("MASTER_AMBIGUOUS")
          os.kill(masters[0],signal.SIGHUP)
          time.sleep(4)
          print("CODE_NEW_VAULT_INSTALLED="+str(gitblob(vault.read_bytes())=="7cc9a90711c5da6807d8d6d236867cd13822613d"),flush=True)
          print("CODE_NEW_LIMIT_INSTALLED="+str(gitblob(limit.read_bytes())=="6191416c1de945a8d75e4e7e9d900fea5c448a39"),flush=True)
          print("GUNICORN_RELOADED=1",flush=True)
          `;
          await command(patch,'PATCH');
          const health=await api('GET','/health');
          console.log('POST_HOTPATCH_HEALTH_HTTP='+health.code);
          if(health.code!==200||!health.data.ok)throw Error('HEALTH_FAILED');
          NODE
