name: CORTES Phase 4 live state once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-phase4-state-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Validate secrets
        shell: bash
        run: |
          test -n "$WP_SITE_URL"
          test -n "$WP_USERNAME"
          test -n "$WP_APP_PASSWORD"
      - name: Read protected CORTES state
        shell: python
        run: |
          import json, os, requests
          base=os.environ['WP_SITE_URL'].rstrip('/')+'/wp-json/anthares/v1'
          auth=(os.environ['WP_USERNAME'], ''.join(os.environ['WP_APP_PASSWORD'].split()))
          paths=['/cortes/source-cycle','/cortes/state','/cortes/regular-sources','/clipper-live/registry']
          out={}
          for p in paths:
              r=requests.get(base+p,auth=auth,timeout=45)
              print(f'{p} HTTP={r.status_code}')
              r.raise_for_status()
              out[p]=r.json()
          print('PHASE4_STATE_JSON='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
