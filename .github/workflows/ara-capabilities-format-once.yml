name: One-shot ARA Go formatting repair
on:
  push:
    branches: [feature/ara-capabilities]
    paths:
      - '.github/workflows/ara-capabilities-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ara-capabilities
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Format Go sources
        working-directory: anthares-remote-agent
        run: gofmt -w cmd/agent/*.go
      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anthares-remote-agent/cmd/agent/*.go
          git rm .github/workflows/ara-capabilities-format-once.yml
          if git diff --cached --quiet; then
            echo 'No formatting changes detected.'
            exit 0
          fi
          git commit -m 'style(agent): format ARA Go sources'
          git push origin HEAD:feature/ara-capabilities
      - name: Dispatch full QA for formatted commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ara-capabilities-30.yml --ref feature/ara-capabilities
