name: X Piped Source Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.x-piped-probe-trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe multiple Piped stream APIs
        env:
          VIDEO_ID: xcRGdBfHX0E
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          vid=os.environ['VIDEO_ID']
          bases=[
            'https://pipedapi.tokhmi.xyz',
            'https://pipedapi.moomoo.me',
            'https://pipedapi.syncpundit.io',
            'https://api-piped.mha.fi',
            'https://piped-api.garudalinux.org',
            'https://pipedapi.rivo.lol',
            'https://pipedapi.frontendfriendly.xyz',
            'https://api.piped.yt',
            'https://pipedapi.astartes.nl',
            'https://pipedapi.simpleprivacy.fr',
            'https://pipedapi.drgns.space',
            'https://api.piped.minionflo.net',
            'https://piped-api.game.yt',
          ]
          success=[]
          for base in bases:
            url=f'{base}/streams/{vid}'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=12) as r:
                raw=r.read(5_000_000); status=r.status
              data=json.loads(raw)
              vs=[x for x in (data.get('videoStreams') or []) if isinstance(x,dict) and x.get('url')]
              aus=[x for x in (data.get('audioStreams') or []) if isinstance(x,dict) and x.get('url')]
              print('PIPED_PROBE',base,'HTTP',status,'video',len(vs),'audio',len(aus),'title',str(data.get('title') or '')[:80])
              if vs and aus:
                success.append({'base':base,'video':vs[0]['url'],'audio':aus[0]['url'],'title':data.get('title')})
            except Exception as e:
              print('PIPED_FAIL',base,type(e).__name__,str(e)[:180])
          print('PIPED_SUCCESS_COUNT='+str(len(success)))
          if success:
            print('PIPED_SUCCESS_BASE='+success[0]['base'])
            print('PIPED_VIDEO_URL='+success[0]['video'])
            print('PIPED_AUDIO_URL='+success[0]['audio'])
          assert success, 'no Piped instance produced usable streams'
          PY
