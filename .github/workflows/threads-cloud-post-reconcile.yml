name: CORTES Threads read-only cloud post reconciliation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/threads-cloud-post-reconcile.yml']
permissions:
  contents: read
jobs:
  verify_recent:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            4ef756b1-f948-4780-af26-b4ea014637bf > THREADS_ACCESS_TOKEN
      - name: Find remotely published post using official Threads API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.THREADS_ACCESS_TOKEN||'';
          if(token.length<20)throw Error('BITWARDEN_TOKEN_UNAVAILABLE');
          const host='https://graph.threads.net/v1.0';
          async function get(path){
            const r=await fetch(host+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
            const data=await r.json().catch(()=>({}));
            if(!r.ok)throw Error('GRAPH_'+r.status+'_'+String(data?.error?.code||''));
            return data;
          }
          const me=await get('/me?fields=id,username');
          if(me.username!=='universoanthares'||!me.id)throw Error('OWNER_IDENTITY_FAILED');
          const cutoff=Date.parse('2026-10-21T11:52:40Z');
          const end=Date.parse('2026-10-21T15:52:40Z');
          let cursor='/'+encodeURIComponent(me.id)+'/threads?fields=id,permalink,timestamp,text,media_type&limit=100';
          const recent=[];let pages=0,oldest=Infinity;
          while(cursor&&pages<30){
            const page=await get(cursor);pages++;
            for(const p of page.data||[]){
              const stamp=Date.parse(p.timestamp);
              if(Number.isFinite(stamp)){oldest=Math.min(oldest,stamp);if(stamp>=cutoff&&stamp<=end)recent.push(p)}
            }
            const next=page.paging?.next||'';
            if(oldest<cutoff||!next)break;
            const u=new URL(next);
            if(u.origin!==new URL(host).origin||!u.pathname.startsWith('/v1.0/'))throw Error('PAGINATION_ORIGIN_REJECTED');
            cursor=u.pathname.slice('/v1.0'.length)+u.search;
          }
          console.log('GRAPH_PAGES_CHECKED='+pages);
          console.log('GRAPH_REACHED_TARGET_WINDOW='+(oldest<cutoff));
          if(!(oldest<cutoff))throw Error('GRAPH_WINDOW_INCOMPLETE');
          console.log('GRAPH_OWNER_VERIFIED='+me.username);
          console.log('GRAPH_RECENT_POST_COUNT='+recent.length);
          let matches=0;
          for(const p of recent){
            const u=String(p.permalink||'');
            if(!/^https:\/\/(www\.)?threads\.com\/@universoanthares\/post\/[A-Za-z0-9_-]+\/?$/.test(u))continue;
            const candidate=/Trecho\s+160\s*[:h]\s*00/i.test(String(p.text||''));
            if(candidate)matches++;
            console.log('GRAPH_WINDOW_POST='+JSON.stringify({id:p.id,permalink:u,timestamp:p.timestamp,media_type:p.media_type,text_prefix:String(p.text||'').slice(0,160),candidate}));
          }
          console.log('GRAPH_160_CANDIDATES='+matches);
          NODE
