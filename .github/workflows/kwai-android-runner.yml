name: Anthares Kwai Android Runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anthares-kwai-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4
      - name: Check required secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
        run: |
          test -n "$PRIVATE_REPO_TOKEN" || { echo "PRIVATE_REPO_TOKEN missing"; exit 41; }
          test -n "$KWAI_LOGIN" || { echo "KWAI_LOGIN missing"; exit 42; }
          test -n "$KWAI_PASSWORD" || { echo "KWAI_PASSWORD missing"; exit 43; }
          echo "required secrets present"
      - name: Download validated Kwai vault from private repository
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          rm -rf kwai-vault kwai-vault.zip
          if ! gh release download kwai-package-vault --repo UniversoAnthares/anthares-clipper --pattern kwai-vault.zip --output kwai-vault.zip; then
            echo "PRIVATE_REPO_TOKEN cannot read the private Kwai vault release"
            exit 44
          fi
          unzip -q kwai-vault.zip -d kwai-vault
          test -s kwai-vault/MANIFEST.tsv || { echo "validated vault manifest missing"; exit 45; }
          echo "validated Kwai vault acquired"
      - name: Download Cloudflare tunnel client
        run: |
          curl -fL --retry 2 --connect-timeout 5 --max-time 30 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
      - name: Boot Android and expose Kwai
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REMOTE_ANDROID_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-anthares
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 120
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: timeout 900s bash kwai_remote_android_login.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-runner-diagnostics-${{ github.run_id }}
          path: |
            kwai-remote-status.txt
            kwai-remote-ready.png
          if-no-files-found: warn
          retention-days: 1
