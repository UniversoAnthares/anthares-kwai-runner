name: Anthares Kwai Android Runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.android-validation-trigger'

permissions:
  contents: read

concurrency:
  group: anthares-kwai-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4
      - name: Check required secrets
        env:
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
        run: |
          test -n "$KWAI_LOGIN" || { echo "KWAI_LOGIN missing"; exit 42; }
          test -n "$KWAI_PASSWORD" || { echo "KWAI_PASSWORD missing"; exit 43; }
          echo "KWAI_SECRETS_PRESENT=1"
      - name: Download validated public Kwai vault
        run: |
          set -euo pipefail
          rm -rf kwai-vault kwai-vault.zip
          curl -fL --retry 3 --connect-timeout 10 --max-time 180 -o kwai-vault.zip \
            https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip" | sha256sum -c -
          unzip -q kwai-vault.zip -d kwai-vault
          test -s kwai-vault/MANIFEST.tsv || { echo "validated vault manifest missing"; exit 45; }
          echo "PUBLIC_VALIDATED_VAULT_OK=1"
      - name: Download Cloudflare tunnel client
        run: |
          curl -fL --retry 2 --connect-timeout 5 --max-time 30 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
      - name: Boot Android and expose Kwai
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REMOTE_ANDROID_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-anthares
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 300
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            set -o pipefail
            if timeout 240s bash kwai_headless_login.sh; then
              echo "HEADLESS_KWAI_ACCEPTANCE=OK"
            else
              echo "HEADLESS_KWAI_ACCEPTANCE=FALLBACK"
              timeout 240s bash kwai_remote_android_login.sh
            fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-runner-diagnostics-${{ github.run_id }}
          path: |
            kwai-headless-status.txt
            kwai-headless-ready.png
            kwai-remote-status.txt
            kwai-remote-ready.png
          if-no-files-found: warn
          retention-days: 1
