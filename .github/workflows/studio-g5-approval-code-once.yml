name: Anthares Studio G5 Approval Code Two Line Release
on:
  push:
    branches: [coord/studio-g4-g5-20261116]
    paths:
      - .github/workflows/studio-g5-approval-code-once.yml
permissions:
  contents: read
concurrency:
  group: studio-g5-approval-two-line-release-20261117
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'UniversoAnthares/anthares-kwai-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax check before release
        run: |
          python3 - <<'PY'
          import ast,pathlib,re
          s=pathlib.Path('tools/studio-g5-approval-code-once.py').read_text(encoding='utf8')
          ast.parse(s)
          m=re.search(r'REMOTE=r"""(.*?)"""',s,re.S)
          assert m
          compile(m.group(1),'approval_remote.py','exec')
          print('G5_APPROVAL_SYNTAX=PASS')
          PY
      - name: Release only approved two-line approval gate, with backup and rollback
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python3 tools/studio-g5-approval-code-once.py
      - name: Verify ACF read path with memory-only activation
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python3 tools/studio-g5-runtime-canary.py
