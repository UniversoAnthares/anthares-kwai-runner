name: CORTES Queue - independent Cloudflare HA deploy
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact reviewed Git SHA (40 lowercase hex characters)'
        required: true
        type: string
      mode:
        description: 'Approved release or incident recovery'
        required: true
        default: release
        type: choice
        options:
          - release
          - emergency
      incident_ref:
        description: 'Mandatory incident reference for emergency recovery'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cortes-queue-cloudflare-ha
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require approved SHA and incident-scoped emergency recovery
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'RELEASE_SHA_INVALID'; exit 1; }
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA" || { echo 'RELEASE_SHA_MISMATCH'; exit 1; }
          main_sha="$(curl -fsS --retry 0 --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$RELEASE_MODE" == release ]]; then
            test "$APPROVED_SHA" = "$main_sha" || { echo 'RELEASE_MAIN_MOVED'; exit 1; }
          elif [[ "$RELEASE_MODE" == emergency ]]; then
            test -n "$INCIDENT_REF" || { echo 'EMERGENCY_INCIDENT_REQUIRED'; exit 1; }
            git merge-base --is-ancestor "$APPROVED_SHA" "$main_sha" || { echo 'EMERGENCY_SHA_OUTSIDE_MAIN'; exit 1; }
          else
            echo 'RELEASE_MODE_INVALID'; exit 1
          fi
          echo "RELEASE_APPROVED_SHA=$APPROVED_SHA mode=$RELEASE_MODE"
      - name: Verify no external input can select backend
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-cortes-queue-ha/src/index.mjs
          grep -q 'cortesbackup.compute.c-14.us-east-1.aws.neon.tech' cloudflare-cortes-queue-ha/src/index.mjs
          grep -q 'cortesqueue.compute.c-14.us-east-1.aws.neon.tech' cloudflare-cortes-queue-ha/src/index.mjs
          ! grep -q 'vercel.app' cloudflare-cortes-queue-ha/src/index.mjs
      - name: Publish independent Worker using existing Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cd cloudflare-cortes-queue-ha
          npx --yes wrangler@4.43.0 deploy
      - name: Confirm production Neon-backed queue and rejected anonymous write
        shell: bash
        run: |
          set -euo pipefail
          u='https://anthares-cortes-queue-ha.anthares1.workers.dev'
          for i in $(seq 1 12); do
            if curl -fsS --max-time 15 "$u/?action=health" -o /tmp/cortes-ha-health.json &&
               node -e 'const r=require("/tmp/cortes-ha-health.json");process.exit(r.ok&&r.database_ok&&r.backend==="neon-cortes-linkedin"?0:1)'; then
              break
            fi
            sleep 2
          done
          node -e 'const r=require("/tmp/cortes-ha-health.json");if(!r.ok||!r.database_ok)process.exit(2);console.log("CORTES_CLOUDFLARE_NEON_DB=PASS")'
          code="$(curl -sS -o /tmp/cortes-ha-anonymous.json -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' -d '{}' "$u/?action=enqueue")"
          test "$code" = '401'
          echo 'CORTES_CLOUDFLARE_ANONYMOUS_WRITE_REJECTED=PASS'
