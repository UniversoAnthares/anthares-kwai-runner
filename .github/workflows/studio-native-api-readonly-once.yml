name: One-time read-only TikTok Studio native creator list API probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/studio-native-api-readonly-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Check authorized creator list API without launching browser
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN;if(!token||token.length<20)throw Error('NF_TOKEN_MISSING');
          const req=async path=>{const r=await fetch('https://api.northflank.com/v1'+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('NF_API_'+r.status);return r.json();};
          const found=[];for(const p of (await req('/projects')).data?.projects||[])for(const s of (await req('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[])if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);if(found.length!==1)throw Error('SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0],cp=new ApiClientInMemoryContextProvider();await cp.addContext({name:'readonly',token});const cli=new ApiClient(cp);
          const code=String.raw`
          import sys,json,requests
          sys.path.insert(0,'/app/render-tiktok-worker')
          from browser_state_vault import load_runtime_state
          s=load_runtime_state(timeout=15)
          if not s or len(s.get('cookies') or [])<20:raise SystemExit("MISSING_ENCRYPTED_SESSION")
          print("VAULT_SESSION_AVAILABLE=1",flush=True)
          sess=requests.Session()
          names=set()
          for c in s.get('cookies') or []:
           try:
            name=str(c.get('name') or '')
            if not name:continue
            sess.cookies.set(name,str(c.get('value') or ''),domain=str(c.get('domain') or '.tiktok.com'),path=str(c.get('path') or '/'))
            names.add(name.lower())
           except Exception:pass
          print("STUDIO_COOKIE_COUNT="+str(len(names)),flush=True)
          print("CSRF_COOKIE_PRESENT="+str(bool(names&{'tt_csrf_token','tt-csrf-token','csrf_token'})),flush=True)
          csrf=next((c.get('value') for c in s.get('cookies') or [] if c.get('name','').lower() in ('tt_csrf_token','tt-csrf-token','csrf_token')),'')
          device=next((c.get('value') for c in s.get('cookies') or [] if c.get('name','').lower() in ('tt_webid','tt_webid_v2','web_id')),'')
          params=[('locale','pt-BR'),('aid','1988'),('priority_region','BR'),('region','BR'),('tz_name','America/Campo_Grande'),('app_name','tiktok_creator_center'),('app_language','pt-BR'),('device_platform','web_pc'),('channel','tiktok_web'),('device_id',str(device or '')),('os','win'),('screen_width','1280'),('screen_height','800'),('browser_language','pt-BR'),('browser_platform','Win32'),('browser_name','Mozilla'),('browser_version','5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/157.0.0.0 Safari/537.36')]
          body={'cursor':0,'size':50,'query':{'sort_orders':[{'field_name':'post_time','order':2}],'conditions':[],'is_recent_posts':False}}
          headers={'Referer':'https://www.tiktok.com/tiktokstudio/content','Origin':'https://www.tiktok.com','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36','Accept':'application/json, text/plain, */*','Content-Type':'application/json','agw-js-conv':'str','tt-csrf-token':str(csrf or '')}
          try:
           r=sess.post('https://www.tiktok.com/tiktok/creator/manage/item_list/v1/',params=params,headers=headers,data=json.dumps(body,separators=(',',':')),timeout=25)
           print('CREATOR_LIST_HTTP='+str(r.status_code),flush=True)
           print('CREATOR_LIST_CONTENT_TYPE='+str(r.headers.get('Content-Type',''))[:90],flush=True)
           try:
            d=r.json()
            print('CREATOR_LIST_ROOT_FIELDS='+','.join(str(k) for k in list(d.keys())[:16]),flush=True)
            print('CREATOR_LIST_STATUS_CODE='+str(d.get('status_code',d.get('code','missing')))[:60],flush=True)
            data=d.get('data') or d.get('body') or {}
            print('CREATOR_LIST_DATA_FIELDS='+','.join(str(k) for k in list(data.keys())[:16]) if isinstance(data,dict) else 'CREATOR_LIST_DATA_NONOBJECT=1',flush=True)
            print('CREATOR_LIST_LIST_COUNTS='+str({k:len(v) for k,v in data.items() if isinstance(v,list)})[:300] if isinstance(data,dict) else 'none',flush=True)
            print('CREATOR_LIST_ERROR_CLASS='+str(d.get('status_msg') or d.get('message') or d.get('error') or '')[:180],flush=True)
           except ValueError:
            print('CREATOR_LIST_NOT_JSON=1',flush=True)
          except Exception as e:print('CREATOR_LIST_NETWORK_CLASS='+type(e).__name__,flush=True)
          `;
          const result=await cli.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',code]});
          console.log('LIST_API_INSPECTION_EXIT='+String(result.commandResult?.exitCode));
          console.log('LIST_API_INSPECTION_RESULT='+String(result.stdOut||'').replace(/[\r\n]+/g,' | ').slice(0,2300));
          if(result.commandResult?.exitCode!==0)throw Error('CREATOR_LIST_INSPECTION_FAILED');
          NODE
