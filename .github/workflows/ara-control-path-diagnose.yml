name: ARA Control Path Diagnose
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ara-control-path-diagnose.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Compare Vercel and Cloudflare control endpoints
        shell: bash
        run: |
          set -u
          probe(){
            name="$1"; url="$2";
            echo "=== $name $url ==="
            code="$(curl -sS -D /tmp/h -o /tmp/b -w '%{http_code}' --max-time 20 "$url" || true)"
            echo "HTTP=$code"
            grep -Ei '^(x-ara-transport|x-ara-quota-guard|server|content-type):' /tmp/h || true
            cat /tmp/b || true
            echo
          }
          probe vercel-healthz 'https://anthares-ara-vercel-reserve.vercel.app/healthz'
          probe cf-healthz 'https://anthares-ara-backup.anthares1.workers.dev/healthz'
          probe mcp-health 'https://anthares-ara-mcp.anthares1.workers.dev/health'
