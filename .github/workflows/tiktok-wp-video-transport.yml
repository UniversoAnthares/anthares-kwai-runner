name: TikTok WP Video Transport 5-Way
on:
  push:
    paths: ['.github/workflows/tiktok-wp-video-transport.yml']
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [plain_get, browser_get, referer_get, range_get, head_then_get]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe direct owned clip transport
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          mode=os.environ['MODE']; api='https://anthares.us/wp-json/wp/v2/media?media_type=video&per_page=10&orderby=date&order=desc'
          baseh={'User-Agent':'Mozilla/5.0'}
          with urllib.request.urlopen(urllib.request.Request(api,headers=baseh),timeout=25) as r: rows=json.load(r)
          urls=[x.get('source_url') for x in rows if x.get('source_url')]
          if not urls: print('TEST_VALIDITY=INVALID_NO_VIDEO'); raise SystemExit(3)
          u=urls[0]; h={}
          method='GET'
          if mode=='plain_get': h={'User-Agent':'Python-urllib/3'}
          elif mode=='browser_get': h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Accept':'video/mp4,video/*;q=0.9,*/*;q=0.5'}
          elif mode=='referer_get': h={'User-Agent':'Mozilla/5.0','Referer':'https://anthares.us/','Accept':'video/mp4,*/*'}
          elif mode=='range_get': h={'User-Agent':'Mozilla/5.0','Range':'bytes=0-65535'}
          elif mode=='head_then_get':
            q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://anthares.us/'},method='HEAD')
            try:
              with urllib.request.urlopen(q,timeout=20) as r: print('HEAD',r.status,r.headers.get('Content-Type'),r.headers.get('Content-Length'))
            except urllib.error.HTTPError as e: print('HEAD_HTTP',e.code)
            h={'User-Agent':'Mozilla/5.0','Referer':'https://anthares.us/'}
          try:
            with urllib.request.urlopen(urllib.request.Request(u,headers=h,method=method),timeout=30) as r:
              b=r.read(131072); ct=r.headers.get('Content-Type','')
              print('MODE',mode,'HTTP',r.status,'CT',ct,'BYTES',len(b),'MAGIC',b[:16].hex())
              if r.status not in (200,206) or len(b)<1024: raise SystemExit(2)
              print('WP_VIDEO_TRANSPORT=PROVEN',mode)
          except urllib.error.HTTPError as e:
            print('MODE',mode,'HTTP_ERROR',e.code,'CT',e.headers.get('Content-Type')); raise
          PY
