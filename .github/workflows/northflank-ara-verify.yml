name: Verify durable ARA Northflank controller

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/northflank-ara-verify.yml

permissions:
  contents: read

concurrency:
  group: northflank-ara-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Verify Northflank service, durable health, and restart proof
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          token = os.getenv("NORTHFLANK_API_TOKEN", "")
          if not token:
              sys.exit("NORTHFLANK_API_TOKEN secret is absent")
          base = "https://api.northflank.com/v1"
          headers = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}

          def api(path):
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode("utf-8", errors="replace")
                  return json.loads(raw) if raw else {}

          projects = api("/projects").get("data", {}).get("projects", [])
          if isinstance(projects, dict): projects = list(projects.values())
          matches = [p for p in projects if p.get("name") == "Default"]
          if len(matches) != 1:
              sys.exit(f"Expected one Default project, found {len(matches)}")
          project = matches[0]["id"]

          services = api(f"/projects/{project}/services").get("data", {}).get("services", [])
          if isinstance(services, dict): services = list(services.values())
          matches = [s for s in services if s.get("name") == "anthares-ara-northflank"]
          if len(matches) != 1:
              sys.exit(f"Expected one anthares-ara-northflank service, found {len(matches)}")
          service = matches[0]
          service_id = service.get("id") or "anthares-ara-northflank"

          ports = api(f"/projects/{project}/services/{service_id}/ports").get("data", {}).get("ports", [])
          http_ports = [p for p in ports if p.get("public") and p.get("protocol") in ("HTTP", "HTTP/2") and p.get("dns")]
          if not http_ports:
              sys.exit("Northflank service has no public HTTP DNS")
          public_base = "https://" + http_ports[0]["dns"]

          last = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(public_base + "/healthz", timeout=20) as r:
                      payload = json.loads(r.read().decode("utf-8", errors="replace"))
                      last = {"status": r.status, "payload": payload}
                      if (r.status == 200 and payload.get("ok") is True and
                          payload.get("backend") == "postgres" and
                          payload.get("persistence_cycle") is True and
                          payload.get("restart_recovered") is True):
                          break
              except urllib.error.HTTPError as e:
                  try: body = json.loads(e.read().decode("utf-8", errors="replace"))
                  except Exception: body = {}
                  last = {"status": e.code, "payload": body}
              except Exception as exc:
                  last = {"error": type(exc).__name__}
              time.sleep(10)
          else:
              sys.exit("Durable /healthz verification failed: " + json.dumps(last, sort_keys=True))

          with urllib.request.urlopen(public_base + "/_canary/persistence-proof", timeout=20) as r:
              proof = json.loads(r.read().decode("utf-8", errors="replace"))
          checks = ((proof.get("route_cycle") or {}).get("checks") or {})
          required = [
              "created_via_control_route", "idempotency_via_control_route",
              "lease_via_device_route", "completion_via_device_route",
              "retrieval_via_control_route", "recovery_with_fresh_store", "result_recovered"
          ]
          missing = [k for k in required if checks.get(k) is not True]
          if r.status != 200 or proof.get("ok") is not True or missing:
              sys.exit("Persistence proof failed; missing=" + ",".join(missing))

          print(json.dumps({
              "ok": True,
              "backend": "postgres",
              "public_url": public_base,
              "persistence_cycle": True,
              "restart_recovered": True,
              "production_failover_modified": False
          }, sort_keys=True))
          PY
