name: Anthares Stage 3 - Fast 20 Targeted Diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - 'independent_session/remote_android_bridge.py'
      - 'independent_session/remote_android_console.html'
      - 'independent_session/remote_console_acceptance.py'
      - '.github/workflows/anthares-stage3-fast-20-diagnostics.yml'
      - '.anthares-stage3-fast20-trigger'
concurrency:
  group: anthares-stage3-fast-diagnostics
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run 20 different checks concurrently on one runner
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/stage3-checks
          python3 -m py_compile independent_session/remote_android_bridge.py independent_session/remote_console_acceptance.py
          cat > /tmp/stage3-checks/run.py <<'PY'
          import ast, pathlib, sys
          root=pathlib.Path(".")
          bridge=(root/"independent_session/remote_android_bridge.py").read_text()
          html=(root/"independent_session/remote_android_console.html").read_text()
          accept=(root/"independent_session/remote_console_acceptance.py").read_text()
          workflow=(root/".github/workflows/anthares-stage3-console-acceptance.yml").read_text()
          checks=[
            ("bridge_python_syntax",lambda: ast.parse(bridge) is not None),
            ("console_html_present",lambda: "<html" in html.lower()),
            ("health_route",lambda: 'route=="/health"' in bridge),
            ("screen_route",lambda: 'route=="/screen"' in bridge),
            ("input_route",lambda: 'path!="/input"' in bridge),
            ("bearer_auth",lambda: 'Authorization' in html and 'Bearer ' in html),
            ("constant_time_token_compare",lambda: "compare_digest" in bridge),
            ("localhost_default_bind",lambda: '127.0.0.1' in bridge),
            ("screenshot_png_endpoint",lambda: 'screencap' in bridge and 'image/png' in bridge),
            ("tap_command_allowlisted",lambda: '"tap"' in bridge and '"input","tap"' in bridge),
            ("swipe_command_allowlisted",lambda: '"swipe"' in bridge and '"input","swipe"' in bridge),
            ("restricted_keyevents",lambda: "KEY_NOT_ALLOWED" in bridge),
            ("bounded_body_size",lambda: "MAX_BODY" in bridge),
            ("no_store_cache_policy",lambda: "no-store" in bridge),
            ("https_required_for_remote_ui",lambda: "https://" in html),
            ("click_to_tap_handler",lambda: 'addEventListener("click"' in html),
            ("screen_refresh_control",lambda: 'id="refresh"' in html),
            ("health_probe_in_acceptance",lambda: '"/health"' in accept),
            ("workflow_adb_resolution_fix",lambda: 'ADB_BIN=' in workflow and 'ADB_BINARY_NOT_FOUND' in workflow),
            ("external_tunnel_present",lambda: any(x in workflow.lower() for x in ("cloudflared","tunnel","tailscale","wireguard","frp","ngrok"))),
          ]
          i=int(sys.argv[1])-1
          try: ok=bool(checks[i][1]())
          except Exception: ok=False
          print(f"CHECK_{i+1:02d}={'PASS' if ok else 'FAIL'} name={checks[i][0]}",flush=True)
          sys.exit(0 if ok else 1)
          PY
          pids=()
          for i in $(seq 1 20); do
            python3 /tmp/stage3-checks/run.py "$i" >"/tmp/stage3-checks/$i.log" 2>&1 &
            pids+=("$!")
          done
          fail=0
          for pid in "${pids[@]}"; do wait "$pid" || fail=1; done
          cat /tmp/stage3-checks/*.log
          test "$fail" -eq 0
