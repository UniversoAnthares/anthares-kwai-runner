name: Anthares Remote Agent legacy installer retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse legacy installation path
        shell: bash
        run: |
          echo 'RETIRED: this workflow installed the pre-Phase-4 user-session/HTTP agent.' >&2
          echo 'Use anthares-remote-agent/windows/install-system-v8.ps1 via an authorized administrative channel.' >&2
          echo 'Canonical runtime: C:\ProgramData\AntharesRemoteAgent, SYSTEM/session 0, private issue queues.' >&2
          exit 1
