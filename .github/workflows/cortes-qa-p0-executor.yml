name: CORTES QA P0 executor - incident diagnostics
run-name: 'QA-P0 #${{ inputs.issue_number }}'
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Number of an existing labeled QA-P0 issue'
        required: true
        type: string
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: cortes-qa-p0-executor-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: qa-p0-independent
    timeout-minutes: 12
    steps:
      - name: Checkout repository for recovery playbook
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate trusted P0 and acknowledge execution
        id: preflight
        uses: actions/github-script@v7
        env:
          QA_ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issue_number = Number(process.env.QA_ISSUE_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) {
              core.setFailed('INVALID_QA_ISSUE_NUMBER'); return;
            }
            const {owner,repo} = context.repo;
            const {data: issue} = await github.rest.issues.get({owner,repo,issue_number});
            const labels = issue.labels.map(x => typeof x === 'string' ? x : x.name);
            if (issue.state !== 'open' || !labels.includes('QA-P0') || !/^\[QA[ -]P0\]/i.test(issue.title) || issue.pull_request) {
              core.setFailed('NOT_AN_AUTHORIZED_OPEN_P0_INCIDENT'); return;
            }
            const m = issue.title.match(/^\[QA[ -]P0\]\[([a-z-]+)\]/i);
            const network = m && /^(pinterest|threads|tiktok|kwai|linkedin|facebook|youtube|instagram|x|cortes-general)$/.test(m[1].toLowerCase()) ? m[1].toLowerCase() : 'cortes-general';
            core.setOutput('network',network);
            await github.rest.issues.createComment({
              owner,repo,issue_number,
              body:'[QA-P0-EXECUTOR] STARTED run=https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId+' network='+network+'; checking code and regression contracts.'
            });
            core.notice('QA_P0_STARTED issue='+issue_number+' network='+network);

      - name: Classify Pinterest P0 incident and enforce safe repair gate
        if: steps.preflight.outcome == 'success'
        id: pinterest_gate
        uses: actions/github-script@v7
        env:
          QA_ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = Number(process.env.QA_ISSUE_NUMBER);
            const {data: issue} = await github.rest.issues.get({owner,repo,issue_number});
            const body = String(issue.body || '');
            const title = String(issue.title || '');
            let gate = 'GENERAL_DIAGNOSTIC_ONLY';
            if (issue_number === 460 && /Mídia 404/.test(title) && /HTTP 404/.test(body)) {
              gate = 'PINTEREST_MEDIA_404_SOURCE_REPAIR_REQUIRED';
            } else if (issue_number === 492 && /PIN_PUBLISH_BUTTON_NOT_READY/.test(body)) {
              gate = 'PINTEREST_PUBLISH_DISABLED_REMOTE_UI_DIAGNOSIS_REQUIRED';
            } else if (issue_number === 528 && /PINTEREST_DRAFT_CAPACITY_EXHAUSTED/.test(body)) {
              gate = 'PINTEREST_DRAFT_CAPACITY_RECONCILIATION_REQUIRED';
            }
            // Read-only classification. The executor must never retry, delete
            // drafts, mark as published, or bypass Neon CAS from an issue body.
            core.setOutput('gate', gate);
            core.notice('QA_P0_REPAIR_GATE=' + gate);
      - name: Inventory Pinterest existing drafts without changing browser state
        if: steps.preflight.outcome == 'success' && inputs.issue_number == '528'
        id: draft_audit
        continue-on-error: true
        shell: powershell
        run: |
          $value='AUDIT_UNAVAILABLE_RECONCILIATION_REQUIRED'
          try {
            $raw=& node .\tools\cortes_pinterest_draft_audit.mjs
            if ($LASTEXITCODE -eq 0) {
              $result=($raw | Select-Object -Last 1 | ConvertFrom-Json -ErrorAction Stop)
              if ($result.status -eq 'READ_ONLY_RECONCILIATION_REQUIRED' -and
                  $result.can_autodelete -eq $false -and
                  $result.can_autopublish -eq $false) {
                $value='count='+$result.draft_count+
                  ';titled='+$result.titled_drafts+
                  ';unique_thumbnails='+$result.unique_thumbnails+
                  ';matching_display_groups='+$result.matching_display_groups+
                  ';inventory_sha256='+$result.inventory_sha256+
                  ';action=READ_ONLY_RECONCILIATION_REQUIRED'
              }
            }
          } catch { Write-Warning 'PINTEREST_DRAFT_AUDIT_UNAVAILABLE' }
          if ($env:GITHUB_OUTPUT) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('result='+$value) -Encoding UTF8
          }
          Write-Output ('PINTEREST_DRAFT_AUDIT='+$value)
      - name: Validate QA contract suites from current GitHub SHA (no Codeberg)
        if: steps.preflight.outcome == 'success'
        id: github_contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python='C:\Users\Lucas\AppData\Local\Programs\Python\Python311\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw 'QA_PYTHON_UNAVAILABLE' }
          $suites=@('test_cortes_qa_p0_router.py','test_cortes_qa_daily_round.py','test_cortes_qa_p0_autoheal.py','test_cortes_tiktok_lucas4_cloud.py')
          foreach($suite in $suites) {
            & $python -B -m unittest discover -s tests -p $suite
            if($LASTEXITCODE -ne 0){ throw 'GITHUB_SHA_QA_CONTRACTS_FAILED' }
          }
          $checked=(& git rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $checked -ne $env:GITHUB_SHA){ throw 'GITHUB_QA_SOURCE_SHA_MISMATCH' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8 -Value 'state=PASS_CURRENT_COMMIT'
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8 -Value ('url=https://github.com/'+$env:GITHUB_REPOSITORY+'/actions/runs/'+$env:GITHUB_RUN_ID)
          Write-Output ('GITHUB_QA_CONTRACTS=PASS_CURRENT_COMMIT sha='+$checked)
      - name: Test QA recovery policy offline before taking action
        if: steps.preflight.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\test_cortes_qa_p0_policy.ps1
      - name: Execute approved P0 recovery playbook
        id: recovery
        if: steps.preflight.outcome == 'success'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          $ErrorActionPreference='Stop'
          & .\\tools\\cortes_qa_p0_recovery.ps1 -IssueNumber ([int]$env:QA_ISSUE_NUMBER)
          # Native exit codes are not meaningful for a PowerShell-only script;
          # terminating errors propagate through ErrorActionPreference=Stop.
      - name: Report actual execution and evidence to incident
        if: always() && steps.preflight.outcome == 'success'
        uses: actions/github-script@v7
        env:
          QA_ISSUE_NUMBER: ${{ inputs.issue_number }}
          QA_NETWORK: ${{ steps.preflight.outputs.network }}
          QA_GITHUB: ${{ steps.github_contracts.outputs.state }}
          QA_GITHUB_URL: ${{ steps.github_contracts.outputs.url }}
          QA_REPAIR_GATE: ${{ steps.pinterest_gate.outputs.gate }}
          QA_AUTOHEAL: ${{ steps.recovery.outputs.action }}
          QA_DRAFT_AUDIT: ${{ steps.draft_audit.outputs.result }}
          QA_DIAGNOSTIC: ${{ steps.recovery.outputs.diagnostic }}
        with:
          script: |
            const {owner,repo} = context.repo;
            const issue_number = Number(process.env.QA_ISSUE_NUMBER);
            const state=String(process.env.QA_GITHUB || 'UNKNOWN');
            const outcome = state === 'PASS_CURRENT_COMMIT'
              ? 'GITHUB_QA_CONTRACTS_VERIFIED_REPAIR_UNCONFIRMED'
              : 'GITHUB_QA_CONTRACTS_PENDING_REPAIR_UNCONFIRMED';
            const run = 'https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const next = process.env.QA_NETWORK === 'pinterest'
              ? 'Reconcile Pinterest 404/media, disabled Publish button, and draft capacity. Never retry started/uncertain media without remote evidence.'
              : 'Investigate failing publisher logs and reconcile uncertain publication receipts.';
            await github.rest.issues.createComment({
              owner,repo,issue_number,
              body:'[QA-P0-EXECUTOR] '+outcome+'\nControl run: '+run+
                '\nGitHub SHA contract result: '+state+
                '\nGitHub QA evidence: '+(process.env.QA_GITHUB_URL || 'unavailable')+
                '\nRepair gate: '+String(process.env.QA_REPAIR_GATE || 'UNCLASSIFIED')+
                '\nRecovery action (ACK only): '+String(process.env.QA_AUTOHEAL || 'NO_REPAIR_ACTION')+
                '\nDraft audit: '+String(process.env.QA_DRAFT_AUDIT || 'not-applicable').slice(0,300)+
                '\nRecovery diagnostic: '+String(process.env.QA_DIAGNOSTIC || 'UNAVAILABLE').slice(0,300)+'\n'+next+
                '\nOffline QA contract suites and policy tested from checked-out GitHub SHA on dedicated QA runner. QA remains open until verified source fix and remote publication.'
            });
            if (state !== 'PASS_CURRENT_COMMIT') core.setFailed('GITHUB_QA_CONTRACTS_CURRENT_SHA_UNVERIFIED');
