name: CORTES QA P0 executor - incident diagnostics
run-name: 'QA-P0 #${{ inputs.issue_number }}'
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Number of an existing labeled QA-P0 issue'
        required: true
        type: string
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: cortes-qa-p0-executor-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: qa-p0-independent
    timeout-minutes: 12
    steps:
      - name: Validate trusted P0 and acknowledge execution
        id: preflight
        uses: actions/github-script@v7
        env:
          QA_ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issue_number = Number(process.env.QA_ISSUE_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) {
              core.setFailed('INVALID_QA_ISSUE_NUMBER'); return;
            }
            const {owner,repo} = context.repo;
            const {data: issue} = await github.rest.issues.get({owner,repo,issue_number});
            const labels = issue.labels.map(x => typeof x === 'string' ? x : x.name);
            if (issue.state !== 'open' || !labels.includes('QA-P0') || !/^\[QA[ -]P0\]/i.test(issue.title) || issue.pull_request) {
              core.setFailed('NOT_AN_AUTHORIZED_OPEN_P0_INCIDENT'); return;
            }
            const m = issue.title.match(/^\[QA[ -]P0\]\[([a-z-]+)\]/i);
            const network = m && /^(pinterest|threads|tiktok|kwai|linkedin|facebook|youtube|instagram|x|cortes-general)$/.test(m[1].toLowerCase()) ? m[1].toLowerCase() : 'cortes-general';
            core.setOutput('network',network);
            await github.rest.issues.createComment({
              owner,repo,issue_number,
              body:'[QA-P0-EXECUTOR] STARTED run=https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId+' network='+network+'; checking code and regression contracts.'
            });
            core.notice('QA_P0_STARTED issue='+issue_number+' network='+network);

      - name: Read Codeberg QA test evidence (no GitHub tests)
        if: steps.preflight.outcome == 'success'
        id: codeberg
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint = 'https://codeberg.org/api/v1/repos/UniversoAnthares/anthares-kwai-runner/actions/runs?limit=100';
            let state = 'CODEBERG_RESULT_UNAVAILABLE', link = 'https://codeberg.org/UniversoAnthares/anthares-kwai-runner/actions';
            try {
              const response = await fetch(endpoint, {signal: AbortSignal.timeout(18000), headers:{'Accept':'application/json'}});
              if (!response.ok) throw Error('HTTP_'+response.status);
              const payload = await response.json();
              const candidates = (payload.workflow_runs || [])
                .filter(x => x.workflow_id === 'anthares-tests-codeberg.yml');
              const exact = candidates.find(x => x.commit_sha === context.sha && x.status === 'success');
              if (exact) {state = 'PASS_CURRENT_COMMIT'; link = exact.html_url || link;}
              else if (candidates.some(x => x.status === 'success')) {
                state = 'PASS_PREVIOUS_COMMIT_RECHECK_REQUIRED';
                link = candidates.find(x=>x.status==='success')?.html_url || link;
              } else {
                state = 'PENDING_OR_FAILED';
                link = candidates[0]?.html_url || link;
              }
            } catch(err) {core.warning('CODEBERG_TEST_RESULT_UNAVAILABLE '+String(err.message).slice(0,50));}
            core.setOutput('state',state);
            core.setOutput('url',link);
            core.notice('QA_P0_CODEBERG_TEST_RESULT='+state);
      - name: Execute approved P0 recovery playbook
        id: recovery
        if: steps.preflight.outcome == 'success'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          $ErrorActionPreference='Stop'
          & .\\tools\\cortes_qa_p0_recovery.ps1 -IssueNumber ([int]$env:QA_ISSUE_NUMBER)
          # Native exit codes are not meaningful for a PowerShell-only script;
          # terminating errors propagate through ErrorActionPreference=Stop.
      - name: Report actual execution and evidence to incident
        if: always() && steps.preflight.outcome == 'success'
        uses: actions/github-script@v7
        env:
          QA_ISSUE_NUMBER: ${{ inputs.issue_number }}
          QA_NETWORK: ${{ steps.preflight.outputs.network }}
          QA_CODEBERG: ${{ steps.codeberg.outputs.state }}
          QA_CODEBERG_URL: ${{ steps.codeberg.outputs.url }}
          QA_AUTOHEAL: ${{ steps.recovery.outputs.action }}
        with:
          script: |
            const {owner,repo} = context.repo;
            const issue_number = Number(process.env.QA_ISSUE_NUMBER);
            const state=String(process.env.QA_CODEBERG || 'UNKNOWN');
            const outcome = state === 'PASS_CURRENT_COMMIT'
              ? 'CODEBERG_TESTS_VERIFIED_REPAIR_UNCONFIRMED'
              : 'CODEBERG_TESTS_PENDING_REPAIR_UNCONFIRMED';
            const run = 'https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const next = process.env.QA_NETWORK === 'pinterest'
              ? 'Reconcile Pinterest 404/media, disabled Publish button, and draft capacity. Never retry started/uncertain media without remote evidence.'
              : 'Investigate failing publisher logs and reconcile uncertain publication receipts.';
            await github.rest.issues.createComment({
              owner,repo,issue_number,
              body:'[QA-P0-EXECUTOR] '+outcome+'\nControl run: '+run+
                '\nCodeberg test result: '+state+
                '\nCodeberg evidence: '+(process.env.QA_CODEBERG_URL || 'unavailable')+
                '\nRecovery action (ACK only): '+String(process.env.QA_AUTOHEAL || 'NO_REPAIR_ACTION')+'\n'+next+
                '\nNo unit tests run in GitHub Actions. QA remains open until verified source fix and remote publication.'
            });
            if (state !== 'PASS_CURRENT_COMMIT') core.setFailed('CODEBERG_TESTS_CURRENT_COMMIT_UNVERIFIED');
