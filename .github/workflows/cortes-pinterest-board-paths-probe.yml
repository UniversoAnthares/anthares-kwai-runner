name: CORTES Pinterest - Buffer board resolver probe
on:
  push:
    branches: [main]
    paths:
      - tools/cortes_pinterest_board_paths_probe.py
      - .github/workflows/cortes-pinterest-board-paths-probe.yml
  workflow_dispatch: {}
  # Independent read-only heartbeat; success also activates the canonical
  # OIDC-authorized publisher through workflow_run.
  schedule:
    - cron: '11,26,41,56 * * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read authorized Buffer secret
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            0ec34434-3b81-4cc6-93af-b4ea00d11733 > BUFFER_API_KEY
      - name: Inspect Buffer board resolvers without posting
        run: |
          set -euo pipefail
          python -u tools/cortes_pinterest_board_paths_probe.py
