name: Anthares Studio G5 ACF Runtime Controlled Activation
on:
  push:
    branches: [coord/studio-g4-g5-20261116]
    paths:
      - .github/workflows/studio-g5-activate-once.yml
permissions:
  contents: read
concurrency:
  group: anthares-studio-g5-acf-runtime-activate-20261117
  cancel-in-progress: false
jobs:
  activate:
    if: github.repository == 'UniversoAnthares/anthares-kwai-runner' && github.ref == 'refs/heads/coord/studio-g4-g5-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate activation source and remote Python
        run: |
          python3 - <<'PY'
          import ast,pathlib,re
          src=pathlib.Path('tools/studio-g5-activate-runtime-once.py').read_text(encoding='utf8')
          ast.parse(src)
          m=re.search(r'REMOTE=r"""(.*?)"""',src,re.S)
          assert m
          compile(m.group(1),'g5_activation_remote.py','exec')
          print('G5_RUNTIME_ACTIVATION_SYNTAX=PASS')
          PY
      - name: Activate ACF only after preflight backup, fingerprint, 414 fields, two owners and auto rollback
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python3 tools/studio-g5-activate-runtime-once.py
