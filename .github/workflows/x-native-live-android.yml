name: X OAuth1 40 authenticated read probes

on:
  push:
    branches: [feature/x-native-live-android-bridge]
    paths:
      - .github/workflows/x-native-live-android.yml
      - scripts/x_oauth1_read_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-read-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        probe:
          - { id: 01, path: "/1.1/account/verify_credentials.json?skip_status=true&include_entities=false" }
          - { id: 02, path: "/1.1/account/verify_credentials.json?skip_status=false&include_entities=false" }
          - { id: 03, path: "/1.1/account/settings.json" }
          - { id: 04, path: "/1.1/application/rate_limit_status.json?resources=account" }
          - { id: 05, path: "/1.1/application/rate_limit_status.json?resources=users" }
          - { id: 06, path: "/1.1/users/show.json?screen_name=lucasrosalem&include_entities=false" }
          - { id: 07, path: "/2/users/me" }
          - { id: 08, path: "/2/users/me?user.fields=id,name,username" }
          - { id: 09, path: "/2/users/by/username/lucasrosalem" }
          - { id: 10, path: "/2/users/by/username/lucasrosalem?user.fields=id,name,username" }
        host: [api.twitter.com, api.x.com]
        oauth_version: ["1", "0"]

    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      PROBE_ID: ${{ matrix.probe.id }}
      PROBE_PATH_QUERY: ${{ matrix.probe.path }}
      PROBE_HOST: ${{ matrix.host }}
      PROBE_OAUTH_VERSION: ${{ matrix.oauth_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate OAuth probe implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/x_oauth1_read_probe.py
          mkdir -p evidence
          printf 'probe=%s\nhost=%s\noauth_version=%s\npath=%s\n' \
            "$PROBE_ID" "$PROBE_HOST" "$PROBE_OAUTH_VERSION" "$PROBE_PATH_QUERY" \
            > evidence/context.txt

      - name: Make authenticated read-only X API request
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/x_oauth1_read_probe.py 2>&1 | tee evidence/result.txt

      - name: Save sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-oauth-read-${{ matrix.probe.id }}-${{ matrix.host }}-v${{ matrix.oauth_version }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
