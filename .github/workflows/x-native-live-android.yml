name: X authenticated native-live preview fast

on:
  push:
    branches: [feature/x-native-live-android-bridge]
    paths:
      - .github/workflows/x-native-live-android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x-auth-preview-fast
  cancel-in-progress: true

jobs:
  auth-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi

      - name: Acquire and verify official X Android splits
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/prep /tmp/apkeep-out /tmp/xout
          timeout 150 docker run --rm -v /tmp/apkeep-out:/output ghcr.io/efforg/apkeep:stable \
            -a com.twitter.android -d apk-pure \
            -o 'acknowledge_dangers=true,arch=x86_64' /output \
            > evidence/prep/apkeep.txt 2>&1
          find /tmp/apkeep-out -type f -name '*.apk' -exec cp '{}' /tmp/xout/ \;
          while IFS= read -r -d '' b; do unzip -qo "$b" -d /tmp/xout; done < <(find /tmp/apkeep-out -type f \( -name '*.xapk' -o -name '*.apkm' \) -print0)
          mapfile -t APKS < <(find /tmp/xout -type f -name '*.apk' -print | sort)
          ((${#APKS[@]} > 0)) || { echo NO_APK_DOWNLOADED | tee evidence/prep/verdict.txt; exit 70; }
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BT="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BT/aapt"; APKSIGNER="$BT/apksigner"
          OFFICIAL_SHA256=0fd9a0cfb07b65950997b4eaebdc53931392391aa406538a3b04073bc2ce2fe9
          for apk in "${APKS[@]}"; do
            base="$(basename "$apk")"
            "$AAPT" dump badging "$apk" > "evidence/prep/badging-$base.txt" 2>&1
            pkg="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "evidence/prep/badging-$base.txt" | head -1)"
            [[ "$pkg" == com.twitter.android ]] || { echo WRONG_PACKAGE; exit 71; }
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "evidence/prep/apksigner-$base.txt" 2>&1
            grep -Eqi "certificate SHA-256 digest:[[:space:]]*$OFFICIAL_SHA256([[:space:]]|$)" "evidence/prep/apksigner-$base.txt" || { echo OFFICIAL_CERT_NOT_CONFIRMED; exit 73; }
          done
          printf '%s\n' "${APKS[@]}" > evidence/prep/apks.txt
          echo VERIFIED_OFFICIAL_X_APK | tee evidence/prep/verdict.txt

      - name: Install X, authenticate, and reach native Live preview
        uses: reactivecircus/android-emulator-runner@v2
        env:
          X_ANDROID_USERNAME: ${{ secrets.X_ANDROID_USERNAME }}
          X_ANDROID_PASSWORD: ${{ secrets.X_ANDROID_PASSWORD }}
          X_ANDROID_CHALLENGE_ID: ${{ secrets.X_ANDROID_CHALLENGE_ID }}
          X_ANDROID_OTP: ${{ secrets.X_ANDROID_OTP }}
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          cores: 2
          emulator-boot-timeout: 240
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            bash -s <<'BASH'
            set -Eeuo pipefail
            mkdir -p evidence/runtime evidence/login evidence/live
            adb wait-for-device
            adb shell pm uninstall com.twitter.android >/dev/null 2>&1 || true
            mapfile -t APKS < <(find /tmp/xout -type f -name '*.apk' -print | sort)
            ((${#APKS[@]} > 0)) || { echo NO_APKS_AT_INSTALL | tee evidence/runtime/verdict.txt; exit 79; }

            set +e
            adb install-multiple --no-streaming -r "${APKS[@]}" > evidence/runtime/install.txt 2>&1
            irc=$?
            if [[ "$irc" -ne 0 ]]; then
              adb install-multiple -r -d "${APKS[@]}" >> evidence/runtime/install.txt 2>&1
              irc=$?
            fi
            set -e
            [[ "$irc" -eq 0 ]] || { echo INSTALL_FAILED | tee evidence/runtime/verdict.txt; exit 80; }

            adb shell pm path com.twitter.android | tee evidence/runtime/pm-path.txt
            activity="$(adb shell cmd package resolve-activity --brief com.twitter.android 2>/dev/null | tr -d '\r' | tail -1 || true)"
            echo "$activity" > evidence/runtime/activity.txt
            if [[ "$activity" == */* ]]; then adb shell am start -W -n "$activity" > evidence/runtime/launch.txt 2>&1 || true; else adb shell monkey -p com.twitter.android 1 > evidence/runtime/launch.txt 2>&1 || true; fi
            sleep 5
            pid="$(adb shell pidof com.twitter.android 2>/dev/null | tr -d '\r' || true)"
            echo "$pid" > evidence/runtime/pid.txt
            [[ -n "$pid" ]] || { echo X_DID_NOT_LAUNCH | tee evidence/runtime/verdict.txt; exit 81; }
            echo X_INSTALL_AND_LAUNCH_OK | tee evidence/runtime/verdict.txt

            timeout 10 adb shell uiautomator dump /sdcard/x-preauth.xml >/dev/null 2>&1 || true
            adb pull /sdcard/x-preauth.xml evidence/runtime/preauth.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > evidence/runtime/preauth.png 2>/dev/null || true

            if [[ -z "${X_ANDROID_USERNAME:-}" || -z "${X_ANDROID_PASSWORD:-}" ]]; then
              echo X_AUTH_CREDENTIALS_ABSENT | tee evidence/runtime/auth-verdict.txt
              exit 90
            fi

            set +e
            EVIDENCE_DIR=evidence/login python3 scripts/x_android_login_ui.py > evidence/runtime/login-driver.txt 2>&1
            lrc=$?
            set -e
            cat evidence/runtime/login-driver.txt
            [[ "$lrc" -eq 0 ]] || { echo X_AUTHENTICATION_NOT_CONFIRMED | tee evidence/runtime/auth-verdict.txt; exit "$lrc"; }
            echo X_AUTHENTICATION_CONFIRMED | tee evidence/runtime/auth-verdict.txt

            EVIDENCE_DIR=evidence/live MATRIX_VARIANT=1 ALLOW_PUBLIC_LIVE=0 python3 scripts/x_android_live_ui.py x-preview | tee evidence/runtime/live-preview.txt
            echo X_NATIVE_LIVE_PREVIEW_CONFIRMED | tee evidence/runtime/final.txt
            BASH

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-auth-preview-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 3
