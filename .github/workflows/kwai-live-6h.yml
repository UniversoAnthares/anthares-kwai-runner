name: Kwai LIVE Cloud Executor

on:
  schedule:
    - cron: '0 */6 * * *'   # renovacao automatica da live a cada 6 horas
  workflow_dispatch:
    inputs:
      activate:
        description: 'Criar e iniciar ao vivo real (rede, pull do HLS da Hostinger)'
        required: true
        default: 'false'
        type: boolean
      seconds:
        description: 'Duracao da sessao em segundos (max 21000 = ~5h50m)'
        required: true
        default: '21000'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: kwai-live-cloud-executor
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANTHARES_PUBLIC_HLS_URL: https://anthares.us/wp-content/uploads/anthares-live-static/live.m3u8
      ATD_ARTIFACT_DIR: live-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser runtime
        run: |
          python -m pip install -q playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
      - name: Grava estado de autenticacao em arquivo temporario (sem expor o conteudo)
        id: write-state
        run: |
          STATE_FILE="$RUNNER_TEMP/kwai-storage-state.json"
          printf '%s' "$KWAI_STORAGE_STATE" > "$STATE_FILE"
          chmod 600 "$STATE_FILE"
          echo "state_file=$STATE_FILE" >> "$GITHUB_OUTPUT"
        env:
          KWAI_STORAGE_STATE: ${{ secrets.KWAI_STORAGE_STATE }}
      - name: Prove HLS e autenticacao remota sem iniciar LIVE
        run: python -u kwai_live_cloud_network.py --state '${{ steps.write-state.outputs.state_file }}'
      - name: Executa sessao ao vivo (rede, pull do HLS da Hostinger) com limpeza obrigatoria
        if: ${{ inputs.activate == 'true' || github.event_name == 'schedule' }}
        env:
          KWAI_STORAGE_STATE_FILE: ${{ steps.write-state.outputs.state_file }}
        run: |
          SECONDS="${LIVE_SECONDS:-21000}"
          [ "$SECONDS" -gt 21000 ] 2>/dev/null && SECONDS=21000
          python -u kwai_live_cloud_network.py --activate --seconds "$SECONDS" --state "$KWAI_STORAGE_STATE_FILE"
      - name: Remove arquivo temporario de estado
        if: always()
        run: |
          rm -f "${{ steps.write-state.outputs.state_file }}"
      - name: Exige marcador de limpeza da sala
        if: always()
        run: grep -q 'KWAI_LIVE_CLEANUP_CONFIRMED' kwai_live_cloud_network.py
