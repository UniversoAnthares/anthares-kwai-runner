name: Kwai LIVE Cloud Executor
on:
  schedule:
    # Off-peak minutes: GitHub may drop workflows scheduled at :00/:30.
    # A 20-minute window allows the active room to be checked frequently and
    # renews soon after the six-hour deadline; room state prevents duplicates.
    - cron: '3,23,43 * * * *'
  # GitHub schedule events have been absent for this workflow despite its
  # enabled flag. The existing Kwai publisher is already dispatched remotely;
  # use its completion as an independent wake-up, without creating a runner.
  workflow_run:
    workflows:
      - 'Kwai Canonical Neon Cloud Publisher'
    types:
      - completed
  workflow_dispatch:
    inputs:
      probe_studio_profile:
        description: 'Check existing encrypted cloud Studio session without starting a live'
        required: false
        default: false
        type: boolean
      six_hour_cycle:
        description: 'Renew six-hour Kwai RTMP LIVE using the existing Hostinger cron'
        required: true
        default: false
        type: boolean
      test_cycle_minutes:
        description: 'Use exactly two successive 10-minute test lives, then resume six-hour cycles'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '10'
      activate:
        description: 'Create and start a short real LIVE canary'
        required: true
        default: false
        type: boolean
      seconds:
        description: 'Canary duration, 15-120 seconds'
        required: true
        default: '60'
        type: string
permissions:
  contents: read
  issues: write
  id-token: write
concurrency:
  group: kwai-live-cloud-executor
  cancel-in-progress: false
jobs:
  profile_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_studio_profile == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.ANTHARES_BROWSER_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore existing encrypted browser profile, without changing source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STATE_KEY"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=anthares-browser-profile-encrypted&per_page=50" --jq '.artifacts | map(select(.expired==false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$id"
          mkdir -p "$RUNNER_TEMP/kw12-artifact" "$RUNNER_TEMP/kw12-browser"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$RUNNER_TEMP/kw12-artifact.zip"
          unzip -q "$RUNNER_TEMP/kw12-artifact.zip" -d "$RUNNER_TEMP/kw12-artifact"
          openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -in "$RUNNER_TEMP/kw12-artifact/profile.tgz.enc" -out "$RUNNER_TEMP/kw12-profile.tgz"
          tar -xzf "$RUNNER_TEMP/kw12-profile.tgz" -C "$RUNNER_TEMP/kw12-browser"
          test -d "$RUNNER_TEMP/kw12-browser/chrome-profile"
          rm -f "$RUNNER_TEMP/kw12-artifact.zip" "$RUNNER_TEMP/kw12-profile.tgz"
          echo 'KW12_EXISTING_PROFILE_RESTORED=1'
      - name: Probe Studio owner through existing Chromium profile
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import os,re
          profile=os.path.join(os.environ['RUNNER_TEMP'],'kw12-browser','chrome-profile')
          with sync_playwright() as p:
              ctx=p.chromium.launch_persistent_context(profile,headless=True,args=['--no-sandbox','--disable-dev-shm-usage'],locale='pt-BR')
              try:
                  page=ctx.new_page()
                  page.goto('https://studio.kwai.com/live/list?source=',wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_timeout(4500)
                  result=page.evaluate('''async()=>{try{const r=await fetch('/rest/o/w/live/supplier/cloudLive/checkPermission',{credentials:'include'});const d=await r.json();const u=d.userInfo||d.data?.userInfo||{};const name=(document.body?.innerText||'').includes('Lucas Rosalem');return {status:r.status,allowed:d.result===1,owner:!!(u.ksId||u.userId),name}}catch(e){return {status:0,allowed:false,owner:false,name:false}}}''')
                  good=result['status']==200 and (result['allowed'] or result['owner']) and result['name']
                  if not good:
                      # Try only the legitimate Google SSO button; do not enter credentials,
                      # select an ambiguous identity or bypass challenges.
                      try:
                          entry=page.get_by_role('button',name=re.compile(r'entrar|login|sign in|log in',re.I))
                          if entry.count()==1 and entry.first.is_visible():
                              entry.first.click(timeout=3500)
                              page.wait_for_timeout(1300)
                          google=page.get_by_text(re.compile(r'continuar com google|continue with google|sign in with google|entrar com google',re.I))
                          if google.count()==1 and google.first.is_visible():
                              google.first.click(timeout=5000)
                              print('KW12_GOOGLE_SSO_BUTTON_USED=1',flush=True)
                              page.wait_for_timeout(4500)
                          else:
                              print('KW12_GOOGLE_SSO_BUTTON_AVAILABLE=0',flush=True)
                      except Exception:
                          print('KW12_GOOGLE_SSO_REQUIRES_INTERACTIVE_OWNER=1',flush=True)
                      try:
                          page.goto('https://studio.kwai.com/live/list?source=',wait_until='domcontentloaded',timeout=25000)
                          page.wait_for_timeout(2200)
                          result=page.evaluate('''async()=>{try{const r=await fetch('/rest/o/w/live/supplier/cloudLive/checkPermission',{credentials:'include'});const d=await r.json();const u=d.userInfo||d.data?.userInfo||{};const name=(document.body?.innerText||'').includes('Lucas Rosalem');return {status:r.status,allowed:d.result===1,owner:!!(u.ksId||u.userId),name}}catch(e){return {status:0,allowed:false,owner:false,name:false}}}''')
                          good=result['status']==200 and (result['allowed'] or result['owner']) and result['name']
                      except Exception:
                          good=False
                  if good:
                      with open(os.environ['RUNNER_TEMP']+'/kw12-auth-success.flag','w') as mark:mark.write('1')
                  with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('authorized='+str(good).lower()+'\\n')
                  print('KW12_REMOTE_STUDIO_SESSION='+('AUTHORIZED' if good else 'NOT_AUTHORIZED'),flush=True)
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Kwai Studio cloud session: '+('authorized' if good else 'not authorized')+' (no secrets exported).\n')
                  if not good:
                      raise SystemExit('KW12_REMOTE_STUDIO_REQUIRES_AUTHENTICATION')
              finally:
                  ctx.close()
          PY
      - name: Re-seal authorized cloud profile only if owner proven
        if: steps.probe.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/kw12-auth-success.flag"
          tar -czf "$RUNNER_TEMP/kw12-profile.tgz" -C "$RUNNER_TEMP/kw12-browser" chrome-profile
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -in "$RUNNER_TEMP/kw12-profile.tgz" -out "$RUNNER_TEMP/kw12-profile.tgz.enc"
          rm -f "$RUNNER_TEMP/kw12-profile.tgz"
      - name: Store authorized encrypted cloud profile for future six-hour sessions
        if: steps.probe.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: anthares-browser-profile-encrypted
          path: ${{ runner.temp }}/kw12-profile.tgz.enc
          retention-days: 30
          if-no-files-found: error
      - name: Remove temporary browser profile
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/kw12-browser" "$RUNNER_TEMP/kw12-artifact" "$RUNNER_TEMP/kw12-profile.tgz" "$RUNNER_TEMP/kw12-artifact.zip"
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.six_hour_cycle != true && inputs.probe_studio_profile != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
      KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
      ANTHARES_PUBLIC_HLS_URL: https://anthares.us/wp-content/uploads/anthares-live-static/live.m3u8
      ATD_ARTIFACT_DIR: live-artifacts-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser runtime
        run: |
          python -m pip install -q playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
      - name: Prove HLS and authenticated Studio without starting LIVE
        run: python -u kwai_live_cloud_network.py
      - name: Upload non-secret diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-live-preflight-diagnostics
          path: |
            live-artifacts-preflight/page.png
          if-no-files-found: ignore
          retention-days: 2
  canary:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate == true && inputs.six_hour_cycle != true }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
      KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
      ANTHARES_PUBLIC_HLS_URL: https://anthares.us/wp-content/uploads/anthares-live-static/live.m3u8
      ATD_ARTIFACT_DIR: live-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser runtime
        run: |
          python -m pip install -q playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
      - name: Run one finite network-pull LIVE canary with mandatory cleanup
        run: python -u kwai_live_cloud_network.py --activate --seconds '${{ inputs.seconds }}'
      - name: Require cleanup marker in controller semantics
        if: always()
        run: grep -q 'KWAI_LIVE_CLEANUP_CONFIRMED' kwai_live_cloud_network.py

  six_hour_cycle:
    # All runs share the workflow concurrency group, including manual dispatch.
    if: ${{ ((github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository)) && vars.KWAI_LIVE_6H_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.six_hour_cycle == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
      KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
      KWAI_LIVE_STORAGE_STATE_B64: ${{ secrets.KWAI_LIVE_STORAGE_STATE_B64 }}
      KW12_SYSTEM_CHROME: '1'
      KW12_TEST_CYCLE_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.test_cycle_minutes || '0' }}
      GH_TOKEN: ${{ github.token }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      ANTHARES_PUBLIC_HLS_URL: https://anthares.us/wp-content/uploads/anthares-live-static/live.m3u8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore encrypted Anthares Browser Hub profile
        # The verified Studio state secret is preferred by open_context();
        # restore the heavier legacy profile only as a fallback.
        if: ${{ env.KWAI_LIVE_STORAGE_STATE_B64 == '' }}
        shell: bash
        env:
          STATE_KEY: ${{ secrets.ANTHARES_BROWSER_STATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$STATE_KEY"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=anthares-browser-profile-encrypted&per_page=50" --jq '.artifacts | map(select(.expired==false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$id"
          mkdir -p "$RUNNER_TEMP/kw12-artifact" "$RUNNER_TEMP/kw12-browser"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$RUNNER_TEMP/kw12-artifact.zip"
          unzip -q "$RUNNER_TEMP/kw12-artifact.zip" -d "$RUNNER_TEMP/kw12-artifact"
          openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -in "$RUNNER_TEMP/kw12-artifact/profile.tgz.enc" -out "$RUNNER_TEMP/kw12-profile.tgz"
          tar -xzf "$RUNNER_TEMP/kw12-profile.tgz" -C "$RUNNER_TEMP/kw12-browser"
          test -d "$RUNNER_TEMP/kw12-browser/chrome-profile"
          rm -f "$RUNNER_TEMP/kw12-artifact.zip" "$RUNNER_TEMP/kw12-profile.tgz"
          echo 'KW12_LIVE_HUB_PROFILE_RESTORED=1'
      - name: Use Chrome already installed on ubuntu-24.04
        run: |
          python -m pip install -q playwright pillow
          command -v google-chrome >/dev/null
          google-chrome --version
          echo KW12_SYSTEM_CHROME_READY=1
      - name: Load existing protected Hostinger SSH bridge
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITLAB_TOKEN:-}"
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          req=urllib.request.Request(
              'https://gitlab.com/api/v4/projects/87361776/variables?per_page=100',
              headers={'PRIVATE-TOKEN':os.environ['GITLAB_TOKEN'],
                       'User-Agent':'anthares-kw12-existing-hostinger-bridge'})
          with urllib.request.urlopen(req,timeout=30) as response:
              rows=json.load(response)
          values={str(v.get('key')):str(v.get('value') or '') for v in rows}
          keys=['ANTHARES_QA_SSH_KEY','ANTHARES_QA_SSH_HOST','ANTHARES_QA_SSH_USER']
          if any(not values.get(k) for k in keys):
              raise SystemExit('KW12_EXISTING_HOSTINGER_SSH_BRIDGE_UNAVAILABLE')
          home=pathlib.Path(os.environ['RUNNER_TEMP'])/'kw12-ssh'
          home.mkdir(mode=0o700)
          key=home/'id_hostinger'
          key.write_text(values['ANTHARES_QA_SSH_KEY'])
          key.chmod(0o600)
          host=values['ANTHARES_QA_SSH_HOST']
          user=values['ANTHARES_QA_SSH_USER']
          port=values.get('ANTHARES_QA_SSH_PORT') or '65002'
          for value in (host,user,values['ANTHARES_QA_SSH_KEY']):
              print('::add-mask::'+value.replace('\n','%0A'))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('KW12_SSH_HOST='+host+'\n')
              f.write('KW12_SSH_USER='+user+'\n')
              f.write('KW12_SSH_PORT='+port+'\n')
              f.write('KW12_SSH_KEY_FILE='+str(key)+'\n')
          import subprocess
          sshdir=pathlib.Path.home()/'.ssh'
          sshdir.mkdir(mode=0o700,exist_ok=True)
          keyscan=subprocess.run(['ssh-keyscan','-p',port,host],
                                 capture_output=True,text=True,timeout=18)
          if keyscan.returncode!=0 or not keyscan.stdout.strip():
              raise SystemExit('KW12_HOSTINGER_HOSTKEY_UNAVAILABLE')
          with (sshdir/'known_hosts').open('a') as trusted:
              trusted.write(keyscan.stdout)
          print('KW12_EXISTING_HOSTINGER_SSH_BRIDGE_LOADED=1')
          PY
      - name: Create or renew six-hour Kwai RTMP LIVE
        env:
          KW12_STUDIO_PROFILE_DIR: ${{ runner.temp }}/kw12-browser/chrome-profile
        run: python -u kwai_live_rtmp_cycle.py
      - name: Remove temporary browser profile
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/kw12-browser" "$RUNNER_TEMP/kw12-artifact" "$RUNNER_TEMP/kw12-profile.tgz" "$RUNNER_TEMP/kw12-artifact.zip" "$RUNNER_TEMP/kw12-ssh"
