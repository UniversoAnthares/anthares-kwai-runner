name: Kwai interactive remote login
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.kwai-interactive-login-trigger'
      - '.github/workflows/kwai-interactive-remote-login.yml'
permissions:
  contents: read
  id-token: write
jobs:
  remote-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KWAI_SESSION_FILE: kwai-session.enc
      ANTHARES_CONTROL_URL: https://anthares-control.anthares1.workers.dev
      KWAI_EXPECTED_ACCOUNT: ${{ vars.KWAI_EXPECTED_ACCOUNT || 'anthares' }}
      KWAI_LEASE_TTL_SECONDS: "600"
      KWAI_LEASE_RENEW_INTERVAL_SECONDS: "120"
      KWAI_LEASE_RENEW_TTL_SECONDS: "600"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -1)"
          AVDMANAGER="$(find "$SDK_ROOT" -type f -name avdmanager 2>/dev/null | head -1)"
          [ -x "$SDKMANAGER" ] || { echo "FAILURE_SIGNAL=SDKMANAGER_NOT_FOUND"; exit 2; }
          [ -x "$AVDMANAGER" ] || { echo "FAILURE_SIGNAL=AVDMANAGER_NOT_FOUND"; exit 2; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          EMULATOR="$(find "$SDK_ROOT" -type f -name emulator -perm -111 2>/dev/null | head -1)"
          ADB="$(find "$SDK_ROOT" -type f -name adb -perm -111 2>/dev/null | head -1)"
          [ -x "$EMULATOR" ] || { echo "FAILURE_SIGNAL=EMULATOR_NOT_FOUND_AFTER_INSTALL"; exit 2; }
          [ -x "$ADB" ] || { echo "FAILURE_SIGNAL=ADB_NOT_FOUND_AFTER_INSTALL"; exit 2; }
          echo "$(dirname "$EMULATOR")" >> "$GITHUB_PATH"
          echo "$(dirname "$ADB")" >> "$GITHUB_PATH"
          echo no | "$AVDMANAGER" create avd -n anthares-remote -k "system-images;android-35;google_apis;x86_64" --device "pixel_5"
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Boot Android
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          EMULATOR="$(command -v emulator)"
          nohup "$EMULATOR" -avd anthares-remote -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 >/tmp/emulator.log 2>&1 &
          if ! timeout 120 adb wait-for-device; then
            echo EMULATOR_WAIT_FOR_DEVICE_FAILED
            cat /tmp/emulator.log || true
            ls -l /dev/kvm || true
            "$EMULATOR" -version || true
            exit 124
          fi
          if ! timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'; then
            echo EMULATOR_BOOT_COMPLETION_FAILED
            cat /tmp/emulator.log || true
            exit 1
          fi
          echo TEST_VALIDITY=EMULATOR_BOOTED
      - name: Download validated Kwai vault
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  /tmp/kwai-vault.zip" | sha256sum -c -
          mkdir -p kwai-vault
          unzip -q /tmp/kwai-vault.zip -d kwai-vault
          if [ ! -s kwai-vault/MANIFEST.tsv ]; then
            d=$(find kwai-vault -mindepth 1 -maxdepth 1 -type d | head -1 || true)
            [ -n "$d" ] && cp -a "$d"/. kwai-vault/
          fi
      - name: Prepare private browser tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
                - name: Restore encrypted session cache
        uses: actions/cache/restore@v4
        with:
          path: kwai-session.enc
          key: kwai-session-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kwai-session-${{ runner.os }}-
      - name: Interactive owner login
        env:
          REMOTE_ANDROID_TOKEN: ${{ secrets.REMOTE_ANDROID_TOKEN }}
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
          KWAI_ACCOUNT_ID: primary
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$REMOTE_ANDROID_TOKEN" ] || { echo "REMOTE_ANDROID_TOKEN secret missing"; exit 2; }
          bash kwai_remote_android_login.sh
      - name: Save encrypted session cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: kwai-session.enc
          key: kwai-session-${{ runner.os }}-${{ github.run_id }}
      - name: Publish one queued item in authenticated session
        env:
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          bash kwai_queue_publish_runtime.sh
      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-interactive-login-diagnostics
          path: |
            kwai-remote-status.txt
            kwai-remote-ready.png
            kwai-publication.log
            kwai-publish-status.txt
            kwai-reconcile-status.txt
            kwai-headless-status.txt
          if-no-files-found: ignore
          retention-days: 1
