name: Kwai interactive remote login
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.kwai-interactive-login-trigger'
      - '.github/workflows/kwai-interactive-remote-login.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: kwai-interactive-remote-login-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  remote-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KWAI_SESSION_FILE: kwai-session.enc
      ANTHARES_CONTROL_URL: https://anthares-control.anthares1.workers.dev
      KWAI_EXPECTED_ACCOUNT: ${{ vars.KWAI_EXPECTED_ACCOUNT || 'anthares' }}
      KWAI_LEASE_TTL_SECONDS: "600"
      KWAI_LEASE_RENEW_INTERVAL_SECONDS: "120"
      KWAI_LEASE_RENEW_TTL_SECONDS: "600"
    steps:
      - uses: actions/checkout@v4
      - name: Start interaction clock
        shell: bash
        run: |
          date +%s > /tmp/kwai-interaction-start
          echo 'INTERACTION_BUDGET_SECONDS=120' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare remote channel silently
        env:
          REMOTE_ANDROID_TOKEN: ${{ secrets.REMOTE_ANDROID_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$REMOTE_ANDROID_TOKEN" ] || { echo "REMOTE_ANDROID_TOKEN secret missing"; exit 2; }
          curl -fL --retry 3 --retry-delay 1 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          python3 kwai_remote_android_ui.py >/tmp/android-ui.log 2>&1 &
          UI_PID=$!
          echo "$UI_PID" > /tmp/android-ui.pid
          for _ in $(seq 1 8); do curl -fsS "http://127.0.0.1:8765/?t=$REMOTE_ANDROID_TOKEN" >/dev/null 2>&1 && break; sleep 1; done
          kill -0 "$UI_PID" 2>/dev/null || { echo "FAILURE_SIGNAL=REMOTE_UI_START_FAILED"; cat /tmp/android-ui.log || true; exit 22; }
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8765 >/tmp/tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "$TUNNEL_PID" > /tmp/cloudflared.pid
          URL=""
          for _ in $(seq 1 20); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | head -1 || true)
            [ -n "$URL" ] && break
            kill -0 "$TUNNEL_PID" 2>/dev/null || break
            sleep 1
          done
          [ -n "$URL" ] || { echo "FAILURE_SIGNAL=REMOTE_TUNNEL_START_FAILED"; cat /tmp/tunnel.log || true; exit 23; }
          echo "REMOTE_BASE_URL=$URL" >> "$GITHUB_ENV"
          echo "REMOTE_CHANNEL_READY_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "REMOTE_CHANNEL_PREPARED_NOT_YET_PUBLISHED"
      - name: Restore Android system image cache
        id: android-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/system-images
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/emulator
          key: android35-api-x86_64-${{ runner.os }}
          restore-keys: |
            android35-api-x86_64-${{ runner.os }}-
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          START=$(cat /tmp/kwai-interaction-start)
          NOW=$(date +%s)
          if [ $((NOW-START)) -ge 110 ]; then echo "FAILURE_SIGNAL=INTERACTION_BUDGET_EXCEEDED_BEFORE_ANDROID"; exit 124; fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          [ -x "$SDKMANAGER" ] || { echo "FAILURE_SIGNAL=SDKMANAGER_NOT_FOUND"; exit 2; }
          [ -x "$AVDMANAGER" ] || { echo "FAILURE_SIGNAL=AVDMANAGER_NOT_FOUND"; exit 2; }
          if [ ! -f "$SDK_ROOT/system-images/android-35/google_apis/x86_64/system.img" ]; then
            echo "ANDROID_CACHE_MISS_INSTALLING_WITH_90S_LIMIT"
            timeout 90 "$SDKMANAGER" --install "system-images;android-35;google_apis;x86_64" || { echo "FAILURE_SIGNAL=ANDROID_IMAGE_INSTALL_TIMEOUT"; exit 124; }
          else
            echo "ANDROID_CACHE_HIT_SKIP_DOWNLOAD"
          fi
          EMULATOR="$SDK_ROOT/emulator/emulator"
          ADB="$SDK_ROOT/platform-tools/adb"
          [ -x "$EMULATOR" ] || { echo "FAILURE_SIGNAL=EMULATOR_NOT_FOUND_AFTER_INSTALL"; exit 2; }
          [ -x "$ADB" ] || { echo "FAILURE_SIGNAL=ADB_NOT_FOUND_AFTER_INSTALL"; exit 2; }
          echo "$(dirname "$EMULATOR")" >> "$GITHUB_PATH"
          echo "$(dirname "$ADB")" >> "$GITHUB_PATH"
          rm -rf "$ANDROID_AVD_HOME/anthares-remote.avd" "$ANDROID_AVD_HOME/anthares-remote.ini"
          echo no | "$AVDMANAGER" create avd -n anthares-remote -k "system-images;android-35;google_apis;x86_64" --device "pixel_5"
      - name: Save Android system image cache
        if: steps.android-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/system-images
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/emulator
          key: android35-api-x86_64-${{ runner.os }}
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Boot Android
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          EMULATOR="$(command -v emulator)"
          nohup "$EMULATOR" -avd anthares-remote -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 >/tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid
          if ! timeout 90 adb wait-for-device; then
            echo EMULATOR_WAIT_FOR_DEVICE_FAILED
            cat /tmp/emulator.log || true
            exit 124
          fi
          if ! timeout 60 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            echo EMULATOR_BOOT_COMPLETION_FAILED
            cat /tmp/emulator.log || true
            exit 1
          fi
          adb shell input keyevent 82 || true
          echo TEST_VALIDITY=EMULATOR_BOOTED
      - name: Check interaction budget before remote access
        shell: bash
        run: |
          set -euo pipefail
          START=$(cat /tmp/kwai-interaction-start); NOW=$(date +%s)
          ELAPSED=$((NOW-START)); echo "INTERACTION_ELAPSED_SECONDS=$ELAPSED" >> "$GITHUB_STEP_SUMMARY"
          [ "$ELAPSED" -lt 120 ] || { echo "FAILURE_SIGNAL=INTERACTION_BUDGET_EXCEEDED"; exit 124; }
      - name: Publish ready remote access
        shell: bash
        run: |
          set -euo pipefail
          UI_PID=$(cat /tmp/android-ui.pid 2>/dev/null || true)
          TUNNEL_PID=$(cat /tmp/cloudflared.pid 2>/dev/null || true)
          [ -n "$UI_PID" ] && kill -0 "$UI_PID" 2>/dev/null || { echo "FAILURE_SIGNAL=REMOTE_UI_NOT_ALIVE_AT_PUBLISH"; exit 25; }
          [ -n "$TUNNEL_PID" ] && kill -0 "$TUNNEL_PID" 2>/dev/null || { echo "FAILURE_SIGNAL=REMOTE_TUNNEL_NOT_ALIVE_AT_PUBLISH"; cat /tmp/tunnel.log || true; exit 26; }
          adb exec-out screencap -p >/tmp/publish-ready.png
          test -s /tmp/publish-ready.png || { echo "FAILURE_SIGNAL=ANDROID_SCREEN_NOT_READY"; exit 27; }
          echo "KWAI_REMOTE_ACCESS_READY"
          printf '### Kwai Android remoto — PRONTO\n\n%s\n' "$REMOTE_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Download validated Kwai vault
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 -o /tmp/kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  /tmp/kwai-vault.zip" | sha256sum -c -
          mkdir -p kwai-vault
          unzip -q /tmp/kwai-vault.zip -d kwai-vault
          if [ ! -s kwai-vault/MANIFEST.tsv ]; then
            d=$(find kwai-vault -mindepth 1 -maxdepth 1 -type d | head -1 || true)
            [ -n "$d" ] && cp -a "$d"/. kwai-vault/
          fi
      - name: Verify private browser tunnel
        shell: bash
        run: |
          set -euo pipefail
          [ -x /tmp/cloudflared ] || { echo "FAILURE_SIGNAL=CLOUDFLARED_MISSING"; exit 24; }
          UI_PID=$(cat /tmp/android-ui.pid 2>/dev/null || true)
          TUNNEL_PID=$(cat /tmp/cloudflared.pid 2>/dev/null || true)
          [ -n "$UI_PID" ] && kill -0 "$UI_PID" 2>/dev/null || { echo "FAILURE_SIGNAL=REMOTE_UI_NOT_ALIVE"; cat /tmp/android-ui.log || true; exit 25; }
          [ -n "$TUNNEL_PID" ] && kill -0 "$TUNNEL_PID" 2>/dev/null || { echo "FAILURE_SIGNAL=REMOTE_TUNNEL_NOT_ALIVE"; cat /tmp/tunnel.log || true; exit 26; }
          echo "REMOTE_CHANNEL_STILL_ALIVE"
      - name: Restore encrypted session cache
        uses: actions/cache/restore@v4
        with:
          path: kwai-session.enc
          key: kwai-session-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kwai-session-${{ runner.os }}-
      - name: Interactive owner login
        env:
          REMOTE_ANDROID_TOKEN: ${{ secrets.REMOTE_ANDROID_TOKEN }}
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
          KWAI_ACCOUNT_ID: primary
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$REMOTE_ANDROID_TOKEN" ] || { echo "REMOTE_ANDROID_TOKEN secret missing"; exit 2; }
          export UI_PID="$(cat /tmp/android-ui.pid)"
          export TUNNEL_PID="$(cat /tmp/cloudflared.pid)"
          kill -0 "$UI_PID" 2>/dev/null || { echo "FAILURE_SIGNAL=REMOTE_UI_NOT_ALIVE_BEFORE_LOGIN"; exit 25; }
          kill -0 "$TUNNEL_PID" 2>/dev/null || { echo "FAILURE_SIGNAL=REMOTE_TUNNEL_NOT_ALIVE_BEFORE_LOGIN"; exit 26; }
          bash kwai_remote_android_login.sh
      - name: Save encrypted session cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: kwai-session.enc
          key: kwai-session-${{ runner.os }}-${{ github.run_id }}
      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-interactive-login-diagnostics
          path: |
            kwai-remote-status.txt
            kwai-remote-ready.png
            kwai-publication.log
            kwai-publish-status.txt
            kwai-reconcile-status.txt
            kwai-headless-status.txt
            /tmp/android-ui.log
            /tmp/tunnel.log
            /tmp/emulator.log
          if-no-files-found: ignore
          retention-days: 1
