name: Kwai interactive remote login
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kwai-interactive-remote-login.yml']
permissions:
  contents: read
jobs:
  remote-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          AVDMANAGER="$(find "$ANDROID_HOME" -type f -name avdmanager 2>/dev/null | head -1)"
          [ -x "$SDKMANAGER" ] || { echo "FAILURE_SIGNAL=SDKMANAGER_NOT_FOUND"; exit 2; }
          [ -x "$AVDMANAGER" ] || { echo "FAILURE_SIGNAL=AVDMANAGER_NOT_FOUND"; exit 2; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd -n anthares-remote -k "system-images;android-35;google_apis;x86_64" --device "pixel_5"
      - name: Boot Android
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          /usr/local/lib/android/sdk/emulator/emulator -avd anthares-remote -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -accel on >/tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && { echo TEST_VALIDITY=EMULATOR_BOOTED; exit 0; }
            sleep 2
          done
          tail -100 /tmp/emulator.log
          exit 1
      - name: Download validated Kwai vault
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  /tmp/kwai-vault.zip" | sha256sum -c -
          mkdir -p kwai-vault
          unzip -q /tmp/kwai-vault.zip -d kwai-vault
          if [ ! -s kwai-vault/MANIFEST.tsv ]; then
            d=$(find kwai-vault -mindepth 1 -maxdepth 1 -type d | head -1 || true)
            [ -n "$d" ] && cp -a "$d"/. kwai-vault/
          fi
      - name: Prepare private browser tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
      - name: Interactive owner login
        env:
          REMOTE_ANDROID_TOKEN: ${{ secrets.REMOTE_ANDROID_TOKEN }}
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
          KWAI_ACCOUNT_ID: primary
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$REMOTE_ANDROID_TOKEN" ] || { echo "REMOTE_ANDROID_TOKEN secret missing"; exit 2; }
          bash kwai_remote_android_login.sh
      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-interactive-login-diagnostics
          path: |
            kwai-remote-status.txt
            kwai-remote-ready.png
          if-no-files-found: ignore
          retention-days: 1
