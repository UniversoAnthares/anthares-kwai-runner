name: AI runners contract tests

on:
  push:
    paths:
      - 'ai-runners/**'
      - '.github/workflows/ai-runners-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile runners
        run: |
          python -m py_compile ai-runners/anthares_ai.py
          python -m py_compile ai-runners/hidden_chat_runner.py
          python -m py_compile ai-runners/claude_hidden_runner.py
      - name: Unit tests
        working-directory: ai-runners
        run: python -m unittest -v test_anthares_ai.py
