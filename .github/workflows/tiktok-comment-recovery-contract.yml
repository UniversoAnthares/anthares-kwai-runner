name: TikTok comment recovery contract
on:
  pull_request:
    paths:
      - 'infra/neon-tiktok-comment-recovery/**'
      - 'tools/cortes_tiktok_deferred_comments.py'
      - 'tests/test_tiktok_comment_recovery_contract.mjs'
      - '.github/workflows/tiktok-comment-recovery-contract.yml'
  push:
    branches: [main]
    paths:
      - 'infra/neon-tiktok-comment-recovery/**'
      - 'tools/cortes_tiktok_deferred_comments.py'
      - 'tests/test_tiktok_comment_recovery_contract.mjs'
      - '.github/workflows/tiktok-comment-recovery-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check infra/neon-tiktok-comment-recovery/index.mjs
      - run: node --test tests/test_tiktok_comment_recovery_contract.mjs
      - run: python3 -m py_compile tools/cortes_tiktok_deferred_comments.py
