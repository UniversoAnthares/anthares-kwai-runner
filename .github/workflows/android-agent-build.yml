name: Anthares Android Agent Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-agent/**', '.github/workflows/android-agent-build.yml']
permissions: { contents: read }
concurrency:
  group: android-agent-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build release agent
        working-directory: android-agent
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: anthares-android-agent-apks
          path: |
            android-agent/app/build/outputs/apk/release/app-release-unsigned.apk
            android-agent/app/build/outputs/apk/debug/app-debug.apk
