name: Anthares Android Agent Build
on:
  push:
    branches: [main]
    paths: ['android-agent/**', '.github/workflows/android-agent-build.yml']
permissions: { contents: write }
concurrency:
  group: android-agent-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build release agent
        working-directory: android-agent
        run: gradle --no-daemon :app:assembleRelease
      - name: Publish unsigned release APK branch
        shell: bash
        run: |
          set -euo pipefail
          src="android-agent/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$src"
          cp "$src" /tmp/ANTHARES-AGENT-RELEASE-UNSIGNED.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -rf .
          mkdir -p dist
          cp /tmp/ANTHARES-AGENT-RELEASE-UNSIGNED.apk dist/ANTHARES-AGENT-RELEASE-UNSIGNED.apk
          sha256sum dist/ANTHARES-AGENT-RELEASE-UNSIGNED.apk > dist/ANTHARES-AGENT-RELEASE-UNSIGNED.sha256
          git add dist
          git commit -m "chore(android-agent): publish unsigned release APK"
          git push --force origin apk-dist
      - uses: actions/upload-artifact@v4
        with:
          name: anthares-android-agent-release-unsigned
          path: android-agent/app/build/outputs/apk/release/app-release-unsigned.apk
