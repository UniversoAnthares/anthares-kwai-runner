name: Anthares Runtime Mesh QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'infra/anthares_runtime_mesh.py'
      - 'infra/sitecustomize.py'
      - 'tools/test_anthares_runtime_mesh.py'
      - 'anthares-brouser/**'
      - '.github/workflows/anthares-runtime-mesh-qa.yml'
  push:
    branches: [main, feature/runtime-mesh-remote-browser]
    paths:
      - 'infra/anthares_runtime_mesh.py'
      - 'infra/sitecustomize.py'
      - 'tools/test_anthares_runtime_mesh.py'
      - 'anthares-brouser/**'
      - '.github/workflows/anthares-runtime-mesh-qa.yml'

permissions:
  contents: read

jobs:
  mesh-contract:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated test environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --quiet flask requests
      - name: Run runtime mesh contract tests
        run: |
          . .venv/bin/activate
          python tools/test_anthares_runtime_mesh.py
      - name: Compile integration modules
        run: |
          . .venv/bin/activate
          python -m py_compile infra/anthares_runtime_mesh.py infra/sitecustomize.py

  browser-container-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Anthares-browser
        run: docker build -t anthares-browser ./anthares-brouser
      - name: Start and verify isolated browser
        shell: bash
        run: |
          set -euo pipefail
          vnc="$(openssl rand -hex 12)"
          control="$(openssl rand -hex 32)"
          docker run -d --name anthares-browser \
            -e VNC_PASSWORD="$vnc" \
            -e CONTROL_TOKEN="$control" \
            -p 127.0.0.1:18080:8080 \
            anthares-browser
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health | grep -q '"cdp_ready":true'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health | tee /tmp/browser-health.json
          grep -q '"cdp_ready":true' /tmp/browser-health.json
          ! docker port anthares-browser | grep -q '9222'
          auth_header="Authorization: Bearer ${control}"
          curl -fsS -H "$auth_header" http://127.0.0.1:18080/status | tee /tmp/status.json
          grep -q '"cdp_bind":"127.0.0.1"' /tmp/status.json
      - if: always()
        run: docker logs anthares-browser || true
