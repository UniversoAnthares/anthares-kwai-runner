name: Render retirement guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cloudflare-x-vault/**
      - cloudflare-tiktok-router/**
      - anthares-remote-agent/windows/**
      - anthares-remote-mcp/**
      - infra/ara_device_auth_failover.py
      - infra/ara_canary_mcp_bridge.py
      - .github/workflows/tiktok*.yml
      - .github/workflows/render-retirement-guard.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce zero operational Render dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def text(path): return Path(path).read_text(encoding='utf-8-sig')
          errors=[]
          zero_render=[
            'cloudflare-x-vault/src/index.js',
            'cloudflare-tiktok-router/src/index.js',
            'anthares-remote-mcp/extended-preload.mjs',
            'anthares-remote-mcp/server.mjs',
            'anthares-remote-mcp/remote-server.mjs',
            'anthares-remote-mcp/gateway.mjs',
            'anthares-remote-mcp/gateway-v2.mjs',
            'infra/ara_device_auth_failover.py',
            'infra/ara_canary_mcp_bridge.py',
            'anthares-remote-agent/windows/watchdog-dual-supervisor.ps1',
            'anthares-remote-agent/windows/run-agent-supervisor.ps1',
            'anthares-remote-agent/windows/run-agent-standard.ps1',
          ]
          for p in zero_render:
            if Path(p).exists() and 'onrender.com' in text(p):
              errors.append(f'{p}: Render runtime reference remains')

          for p in Path('.github/workflows').glob('tiktok*.yml'):
            if re.search(r'https?://[A-Za-z0-9.-]+\.onrender\.com', text(p)):
              errors.append(f'{p}: TikTok workflow still targets Render')

          for p in ['anthares-remote-agent/windows/run-agent-supervisor.ps1','anthares-remote-agent/windows/run-agent-standard.ps1']:
            s=text(p)
            primary=next((ln for ln in s.splitlines() if ln.strip().startswith('$primary =')), '')
            secondary=next((ln for ln in s.splitlines() if ln.strip().startswith('$secondary =')), '')
            if 'anthares-ara-backup.anthares1.workers.dev' not in primary:
              errors.append(f'{p}: Cloudflare is not primary')
            if 'code.run' not in secondary:
              errors.append(f'{p}: Northflank is not secondary')

          router=text('cloudflare-tiktok-router/src/index.js')
          if 'onrender.com' in router or 'ALLOW_RENDER_FALLBACK' in router:
            errors.append('TikTok router: retired Render fallback remains')
          if "primary_provider:'northflank'" not in router:
            errors.append('TikTok router: Northflank upstream not declared')

          if errors:
            raise SystemExit('\n'.join(errors))
          print('RENDER_OPERATIONAL_DEPENDENCY_ZERO=1')
          PY
