name: CORTES Threads - Cloud API Auth Gate
on:
  workflow_dispatch:
  push:
    branches: [feature/threads-cloud-primary-20261021]
    paths:
      - tools/cortes_threads_auth_gate.mjs
      - .github/workflows/cortes-threads-auth-gate.yml
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing Bitwarden integration and Threads secret identifier
        env:
          BWS_BOOTSTRAP: ${{ secrets.BWS_ACCESS_TOKEN }}
          THREADS_SECRET_ID: ${{ vars.BWS_THREADS_SECRET_ID }}
        run: |
          test -n "$BWS_BOOTSTRAP" || { echo "::error::BWS_BOOTSTRAP_MISSING"; exit 2; }
          test -n "$THREADS_SECRET_ID" || { echo "::error::BWS_THREADS_SECRET_ID_MISSING"; exit 2; }
          [[ "$THREADS_SECRET_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::BWS_THREADS_SECRET_ID_INVALID"; exit 2; }
      - name: Retrieve Threads token directly from existing Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            ${{ vars.BWS_THREADS_SECRET_ID }} > THREADS_ACCESS_TOKEN
      - name: Verify cloud Threads account without publishing
        run: node tools/cortes_threads_auth_gate.mjs
