name: Kwai Autologin Real Acceptance

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Kwai account namespace'
        required: true
        default: 'primary'
        type: choice
        options:
          - primary
          - secondary
  push:
    paths:
      - '.autologin-trigger'

permissions:
  contents: read

jobs:
  autologin-real:
    name: "REAL STATE-DRIVEN AUTOLOGIN + AUTH PROBE"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated Kwai vault
        run: |
          set -eu
          curl -fL --retry 3 --connect-timeout 10 --max-time 180 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip" | sha256sum -c -
          rm -rf kwai-vault && mkdir kwai-vault
          unzip -q kwai-vault.zip -d kwai-vault
      - name: Select account credentials without cross-account fallback
        env:
          ACCOUNT_ID: ${{ inputs.account_id || 'primary' }}
          PRIMARY_LOGIN: ${{ secrets.KWAI_LOGIN }}
          PRIMARY_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
          SECONDARY_LOGIN: ${{ secrets.KWAI_SECONDARY_LOGIN }}
          SECONDARY_PASSWORD: ${{ secrets.KWAI_SECONDARY_PASSWORD }}
        run: |
          set -eu
          case "$ACCOUNT_ID" in
            primary) L="$PRIMARY_LOGIN"; P="$PRIMARY_PASSWORD" ;;
            secondary) L="$SECONDARY_LOGIN"; P="$SECONDARY_PASSWORD" ;;
            *) echo "invalid account_id"; exit 2 ;;
          esac
          test -n "$L" && test -n "$P"
          echo "KWAI_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "KWAI_LOGIN=$L" >> "$GITHUB_ENV"
          echo "KWAI_PASSWORD=$P" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Real disposable Android acceptance
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KWAI_ACCOUNT_ID: ${{ env.KWAI_ACCOUNT_ID }}
          KWAI_LOGIN: ${{ env.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ env.KWAI_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 300
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 4096
          script: bash kwai_acceptance.sh
      - name: Non-sensitive acceptance evidence
        if: always()
        run: |
          test -f kwai-vault-install-status.txt && cat kwai-vault-install-status.txt || true
