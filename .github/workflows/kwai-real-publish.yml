name: Kwai Real Publication
on:
  push:
    branches: [main]
    paths: ['.kwai-queue-self-test-trigger']
  workflow_dispatch:
    inputs:
      enable_real_publish:
        description: Type YES only after kwai-login reports READY
        required: true
        default: "NO"
        type: string
      queue_self_test:
        description: Run isolated production queue self-test only; never publishes media
        required: true
        default: "NO"
        type: string
      queue_media_stage:
        description: "YES to deliver an eligible real queued CORTES cut to remote Android only"
        required: false
        default: "NO"
        type: string
      queue_job_id:
        description: Canonical queue job id for fenced promotion validation
        required: false
        default: ""
        type: string
      lease_generation:
        description: Canonical lease generation for fenced promotion validation
        required: false
        default: ""
        type: string
      source_id:
        description: Canonical source id used by the dedupe ledger
        required: false
        default: ""
        type: string
      source_start:
        description: Canonical source interval start in seconds
        required: false
        default: ""
        type: string
      source_end:
        description: Canonical source interval end in seconds; must satisfy end > start
        required: false
        default: ""
        type: string
      canonical_video_url:
        description: "Public MP4 URL taken from the canonical Neon CORTES job"
        required: false
        default: ""
        type: string
      canonical_media_sha256:
        description: "Optional actual MP4 byte digest; leave blank for dispatch_identity"
        required: false
        default: ""
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: anthares-kwai-publish
  cancel-in-progress: false
jobs:
  queue-self-test:
    if: ${{ github.event_name == 'push' || inputs.queue_self_test == 'YES' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify production version and queue lifecycle through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          CONTROL='https://anthares-control.anthares1.workers.dev'
          health="$(curl -fsS "$CONTROL/health")"
          echo "$health"
          python3 - "$health" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get('version') in {'2026-10-05-queue-fencing-v16','2026-10-15-publisher-target-v17'}, d
          assert d.get('pc_fallback') is False, d
          assert d.get('queue_bound') is True, d
          PY
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          sep='&'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] || sep='?'
          aud='https%3A%2F%2Fanthares-control.anthares1.workers.dev'
          jwt="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${aud}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$jwt"
          echo "::add-mask::$jwt"
          status="$(curl -sS -o /tmp/queue-selftest.json -w '%{http_code}' -X POST -H "Authorization: Bearer $jwt" "$CONTROL/queue-self-test")"
          out="$(cat /tmp/queue-selftest.json)"
          echo "QUEUE_SELFTEST_HTTP=$status"
          echo "$out"
          if [ "$status" != "200" ]; then
            python3 - "$out" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          print('QUEUE_SELFTEST_SERVER_ERROR='+str(d.get('error','missing-error')))
          PY
            exit 45
          fi
          python3 - "$out" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          required=[
            'ok','dedupe','timeline_overlap_dedupe','premature_complete_rejected',
            'reconcile_without_evidence_rejected','complete_without_evidence_rejected',
            'concurrent_unique','single_job_double_claim','lease_renew_owner_only',
            'lease_renew_extended','lease_renew_repeated','lease_renew_invalid_state_rejected','lease_renew_expired_rejected',
            'lease_generation_incremented','stale_generation_start_rejected','stale_generation_complete_rejected','stale_generation_fail_rejected',
            'expired_unstarted_recovered','started_expiry_protected',
            'failure_requeued','failed_job_recovered','confirmation_recorded',
            'uncertain_reconciled','reconciled_job_recovered',
            'consecutive_failure_threshold','failure_counter_reset'
          ]
          bad=[k for k in required if d.get(k) is not True]
          assert not bad, (bad,d)
          PY
          echo 'KWAI_PRODUCTION_QUEUE_OIDC_SELFTEST_OK'
  queued-publication-contract:
    if: ${{ github.event_name != 'push' && inputs.queue_self_test != 'YES' && inputs.enable_real_publish == 'YES' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate fenced canonical promotion contract
        shell: bash
        env:
          KWAI_QUEUE_JOB_ID: ${{ inputs.queue_job_id }}
          KWAI_LEASE_GENERATION: ${{ inputs.lease_generation }}
          KWAI_SOURCE_ID: ${{ inputs.source_id }}
          KWAI_SOURCE_START: ${{ inputs.source_start }}
          KWAI_SOURCE_END: ${{ inputs.source_end }}
        run: |
          set -euo pipefail
          python3 kwai_real_publish_promotion_gate.py
          echo KWAI_CANONICAL_INTERVAL_GATE_OK
  guard:
    if: ${{ github.event_name != 'push' && inputs.queue_self_test != 'YES' && inputs.queue_media_stage != 'YES' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Publication safety gate
        shell: bash
        run: |
          if [ "${{ inputs.enable_real_publish }}" != "YES" ]; then
            echo "KWAI_REAL_PUBLISH_DISABLED_UNTIL_SESSION_READY"
            exit 0
          fi
          echo "Real publication remains gated until the kwai-publish acceptance workflow is promoted."
          exit 1

  kw04-actual-queue-media-stage:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.queue_media_stage == 'YES' && inputs.enable_real_publish == 'NO' && inputs.queue_self_test == 'NO' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Bind canonical Neon CORTES job without changing its publication state
        shell: bash
        env:
          NEON_JOB_ID: ${{ inputs.queue_job_id }}
          NEON_SOURCE_ID: ${{ inputs.source_id }}
          NEON_START: ${{ inputs.source_start }}
          NEON_END: ${{ inputs.source_end }}
          NEON_VIDEO_URL: ${{ inputs.canonical_video_url }}
          NEON_CONTENT_SHA256: ${{ inputs.canonical_media_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          from urllib.parse import urlsplit
          from pathlib import PurePosixPath
          jid=os.environ["NEON_JOB_ID"].strip()
          source=os.environ["NEON_SOURCE_ID"].strip()
          start=os.environ["NEON_START"].strip()
          end=os.environ["NEON_END"].strip()
          url=os.environ["NEON_VIDEO_URL"].strip()
          digest=os.environ["NEON_CONTENT_SHA256"].strip().lower()
          assert re.fullmatch(r"kwai-cortes-[A-Za-z0-9._:-]{3,145}",jid), "NEON_JOB_ID_INVALID"
          assert source and len(source)<200 and "\n" not in source
          assert float(end)>float(start)>=0
          assert source in jid and jid.endswith("-"+start+"-"+end), "NEON_SOURCE_INTERVAL_JOB_MISMATCH"
          loc=urlsplit(url)
          assert loc.scheme=="https" and loc.hostname in {"anthares.us","www.anthares.us"} and not loc.username and not loc.password, "NEON_MEDIA_URL_INVALID"
          filename=PurePosixPath(loc.path).name
          assert filename.endswith(".mp4") and source in filename and filename.endswith("_"+start+"_"+end+".mp4"), "NEON_MEDIA_SOURCE_INTERVAL_MISMATCH"
          if digest: assert re.fullmatch(r"[0-9a-f]{64}",digest), "NEON_CONTENT_SHA256_INVALID"
          vals={"KWAI_QUEUE_JOB_ID":jid,"KWAI_EXPECTED_ACCOUNT":"lucasrosalem",
                "KWAI_VIDEO_URL":url,"KWAI_SOURCE_ID":source,
                "KWAI_SOURCE_START":start,"KWAI_SOURCE_END":end}
          if digest: vals["KWAI_EXPECTED_MEDIA_SHA256"]=digest
          assert all("\n" not in v and "\r" not in v for v in vals.values())
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              for k,v in vals.items(): f.write(f"{k}={v}\n")
          print("KW04_CANONICAL_NEON_QUEUE_ENVELOPE=PASS")
          print("KW04_CANONICAL_JOB_ID="+jid)
          PY
      - name: Enable KVM for hosted Android
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Deliver actual queued cut into Android MediaStore without publication
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 420
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            python3 tools/kwai_media_stage.py
            python3 -c 'import json,os; d=json.load(open("kwai-media-ready.json",encoding="utf-8")); assert d["schema"]=="anthares.kwai.media-ready.v1"; assert d["job_id"]==os.environ["KWAI_QUEUE_JOB_ID"]; assert d["account"]==os.environ["KWAI_EXPECTED_ACCOUNT"]; assert d["source_id"]==os.environ["KWAI_SOURCE_ID"]; assert d["source_start"]==os.environ["KWAI_SOURCE_START"]; assert d["source_end"]==os.environ["KWAI_SOURCE_END"]; assert d["media_uri"].startswith("content://media/external/video/media/"); print("KW04_REAL_QUEUE_MEDIA_DELIVERY=PASS"); print("KW04_PUBLICATION_ATTEMPTED=0")'
      - name: Remove ephemeral queue snapshot and local staging receipt
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/kw04-job.json" kwai-media-ready.json
