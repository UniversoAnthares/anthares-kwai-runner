name: Kwai Real Publication
on:
  push:
    branches: [main]
    paths: ['.kwai-queue-self-test-trigger']
  workflow_dispatch:
    inputs:
      enable_real_publish:
        description: Type YES only after kwai-login reports READY
        required: true
        default: "NO"
        type: string
      queue_self_test:
        description: Run isolated production queue self-test only; never publishes media
        required: true
        default: "NO"
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: anthares-kwai-publish
  cancel-in-progress: false
jobs:
  queue-self-test:
    if: ${{ github.event_name == 'push' || inputs.queue_self_test == 'YES' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify production version and queue lifecycle through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          CONTROL='https://anthares-control.anthares1.workers.dev'
          health="$(curl -fsS "$CONTROL/health")"
          echo "$health"
          python3 - "$health" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get('version')=='2026-10-05-queue-fencing-v16', d
          assert d.get('pc_fallback') is False, d
          assert d.get('queue_bound') is True, d
          PY
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          sep='&'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] || sep='?'
          aud='https%3A%2F%2Fanthares-control.anthares1.workers.dev'
          jwt="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${aud}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$jwt"
          echo "::add-mask::$jwt"
          status="$(curl -sS -o /tmp/queue-selftest.json -w '%{http_code}' -X POST -H "Authorization: Bearer $jwt" "$CONTROL/queue-self-test")"
          out="$(cat /tmp/queue-selftest.json)"
          echo "QUEUE_SELFTEST_HTTP=$status"
          echo "$out"
          if [ "$status" != "200" ]; then
            python3 - "$out" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          print('QUEUE_SELFTEST_SERVER_ERROR='+str(d.get('error','missing-error')))
          PY
            exit 45
          fi
          python3 - "$out" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          required=[
            'ok','dedupe','timeline_overlap_dedupe','premature_complete_rejected',
            'reconcile_without_evidence_rejected','complete_without_evidence_rejected',
            'concurrent_unique','single_job_double_claim','lease_renew_owner_only',
            'lease_renew_extended','lease_renew_repeated','lease_renew_invalid_state_rejected','lease_renew_expired_rejected',
            'lease_generation_incremented','stale_generation_start_rejected','stale_generation_complete_rejected','stale_generation_fail_rejected',
            'expired_unstarted_recovered','started_expiry_protected',
            'failure_requeued','failed_job_recovered','confirmation_recorded',
            'uncertain_reconciled','reconciled_job_recovered',
            'consecutive_failure_threshold','failure_counter_reset'
          ]
          bad=[k for k in required if d.get(k) is not True]
          assert not bad, (bad,d)
          PY
          echo 'KWAI_PRODUCTION_QUEUE_OIDC_SELFTEST_OK'
  guard:
    if: ${{ github.event_name != 'push' && inputs.queue_self_test != 'YES' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Publication safety gate
        shell: bash
        run: |
          if [ "${{ inputs.enable_real_publish }}" != "YES" ]; then
            echo "KWAI_REAL_PUBLISH_DISABLED_UNTIL_SESSION_READY"
            exit 0
          fi
          echo "Real publication remains gated until the kwai-publish acceptance workflow is promoted."
          exit 1
