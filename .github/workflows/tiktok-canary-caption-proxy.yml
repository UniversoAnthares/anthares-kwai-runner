name: TikTok Canary Caption Proxy Probe

on:
  push:
    branches: [main]
    paths:
      - '.tiktok-canary-caption-proxy-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captions:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch captions through public Invidious instances only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/canary-subs
          mkdir -p /tmp/canary-subs
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          video='a4w8KAOxANc'
          instances=[
              'https://inv.nadeko.net',
              'https://invidious.nerdvpn.de',
              'https://yt.chocolatemoo53.com',
              'https://invidious.tiekoetter.com',
          ]
          headers={'User-Agent':'Mozilla/5.0 AntharesCaptionProbe/1.0','Accept':'application/json,text/vtt;q=0.9,*/*;q=0.5'}
          out=Path('/tmp/canary-subs/proxy.pt.vtt')

          def get(url,timeout=20):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return int(getattr(r,'status',200)), r.headers.get('content-type',''), r.read()

          for base in instances:
              host=urllib.parse.urlparse(base).netloc
              try:
                  code,ct,body=get(f'{base}/api/v1/captions/{video}')
                  print(json.dumps({'instance':host,'stage':'list','http':code,'bytes':len(body),'content_type':ct},sort_keys=True))
                  tracks=json.loads(body.decode('utf-8','replace')) if body else {}
                  captions=tracks.get('captions') if isinstance(tracks,dict) else None
                  if not isinstance(captions,list):
                      continue
                  preferred=[]
                  for item in captions:
                      if not isinstance(item,dict): continue
                      lang=str(item.get('languageCode') or '')
                      label=str(item.get('label') or '')
                      rank=0 if lang.lower() in ('pt-br','pt') else 1 if lang.lower().startswith('pt') else 2
                      preferred.append((rank,lang,label))
                  preferred.sort()
                  for _,lang,label in preferred[:8]:
                      queries=[]
                      if lang: queries.append({'lang':lang})
                      if label: queries.append({'label':label})
                      for q in queries:
                          try:
                              url=f'{base}/api/v1/captions/{video}?'+urllib.parse.urlencode(q)
                              c2,ct2,b2=get(url)
                              text=b2.decode('utf-8','replace')
                              ok=text.startswith('WEBVTT') and len(text)>200
                              print(json.dumps({'instance':host,'stage':'track','selector':q,'http':c2,'bytes':len(b2),'vtt':ok},sort_keys=True,ensure_ascii=False))
                              if ok:
                                  out.write_text(text,encoding='utf-8')
                                  print('INVIDIOUS_CAPTION_SUCCESS='+host)
                                  raise SystemExit(0)
                          except Exception as exc:
                              print(json.dumps({'instance':host,'stage':'track_error','type':type(exc).__name__},sort_keys=True))
              except Exception as exc:
                  print(json.dumps({'instance':host,'stage':'list_error','type':type(exc).__name__},sort_keys=True))
          raise SystemExit('NO_INVIDIOUS_CAPTION_PATH')
          PY
      - name: Rank continuous candidates
        run: python3 tools/tiktok_rank_vtt.py /tmp/canary-subs
