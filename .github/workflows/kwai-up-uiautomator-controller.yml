name: Kwai-up UIAutomator controller

on:
  workflow_dispatch:
  push:
    branches: [kwai-up]
    paths:
      - 'kwai-up/uiautomator-controller/src/**'
      - 'kwai-up/uiautomator-controller/stubs/**'
      - '.github/workflows/kwai-up-uiautomator-controller.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kwai-up
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build dex jar
        shell: bash
        run: |
          set -euo pipefail
          ROOT='kwai-up/uiautomator-controller'
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -mindepth 2 -maxdepth 2 -name android.jar | sort -V | tail -1)"
          D8="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name d8 | sort -V | tail -1)"
          test -f "$ANDROID_JAR"
          test -x "$D8"
          rm -rf /tmp/kwaiup-ui
          mkdir -p /tmp/kwaiup-ui/stub-classes /tmp/kwaiup-ui/classes /tmp/kwaiup-ui/dex
          find "$ROOT/stubs" -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/kwaiup-ui/stub-classes
          jar cf /tmp/kwaiup-ui/stubs.jar -C /tmp/kwaiup-ui/stub-classes .
          find "$ROOT/src" -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 -cp "$ANDROID_JAR:/tmp/kwaiup-ui/stubs.jar" -d /tmp/kwaiup-ui/classes
          "$D8" --min-api 18 --lib "$ANDROID_JAR" --lib /tmp/kwaiup-ui/stubs.jar --output /tmp/kwaiup-ui/dex /tmp/kwaiup-ui/classes/com/anthares/kwaiup/KwaiUpUiTest.class
          jar cf "$ROOT/kwaiup-uiauto.jar" -C /tmp/kwaiup-ui/dex classes.dex
          unzip -l "$ROOT/kwaiup-uiauto.jar"

      - name: Commit generated controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kwai-up/uiautomator-controller/kwaiup-uiauto.jar
          if git diff --cached --quiet; then
            echo 'No controller binary change'
            exit 0
          fi
          git commit -m 'Build Kwai-up UIAutomator controller'
          git push origin HEAD:kwai-up
