name: X deterministic full flow E2E

on:
  push:
    branches:
      - fix/microcut-semantic-x-e2e-20261011
    paths:
      - scripts/anthares_microcut_v2.py
      - scripts/generate_microcut_fixture.py
      - .github/workflows/x-full-flow-fixture-e2e.yml
      - .x-fixture-flow-trigger
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: x-deterministic-full-flow-e2e
  cancel-in-progress: false

env:
  RELEASE_TAG: x-full-flow-test-cache
  ANTHARES_WHISPER_MODEL: small
  ANTHARES_PAUSE_SECONDS: "0.58"
  ANTHARES_PAUSE_KEEP_SECONDS: "0.14"
  ANTHARES_FILLER_MIN_SECONDS: "0.30"
  ANTHARES_MAX_REMOVAL_RATIO: "0.32"
  ANTHARES_MIN_FINAL_SECONDS: "25"
  ANTHARES_MIN_REMOVED_SECONDS: "0.18"

jobs:
  prepare-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/microcut-semantic-x-e2e-20261011
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: anthares-microcut-v2-whisper-small

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          python -m pip install --disable-pip-version-check "faster-whisper==1.2.1"
          python -m py_compile scripts/anthares_microcut_v2.py scripts/generate_microcut_fixture.py

      - name: Generate controlled raw source
        run: |
          mkdir -p x-e2e
          python scripts/generate_microcut_fixture.py x-e2e/raw.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 x-e2e/raw.mp4

      - name: Apply semantic microcuts and verify evidence
        id: cut
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/anthares_microcut_v2.py x-e2e/raw.mp4 x-e2e/microcut.mp4 --report x-e2e/report.json
          python - <<'PY'
          import json
          r=json.load(open('x-e2e/report.json',encoding='utf-8'))
          assert float(r['removed_seconds']) >= 0.18, r
          assert int(r['intervals']) >= 1, r
          reasons=r.get('reasons') or {}
          assert reasons.get('silence',0) >= 1, reasons
          assert sum(reasons.get(k,0) for k in ('immediate_repetition','fuzzy_restart','stutter','filler')) >= 1, reasons
          print('MICROCUT_EVIDENCE='+json.dumps({k:v for k,v in r.items() if k!='transcript'},ensure_ascii=False,separators=(',',':')))
          PY
          ffmpeg -y -hide_banner -loglevel error -i x-e2e/microcut.mp4 \
            -vf 'scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,format=yuv420p' \
            -c:v libx264 -preset veryfast -crf 19 -c:a aac -b:a 160k -movflags +faststart x-e2e/final.mp4
          test -s x-e2e/final.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 x-e2e/final.mp4

      - name: Host prepared media
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="anthares-x-e2e-${GITHUB_RUN_ID}.mp4"
          cp x-e2e/final.mp4 "x-e2e/$ASSET"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Anthares X E2E transient media" \
              --notes "Temporary media for Anthares end-to-end X publisher validation." --target "$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" "x-e2e/$ASSET" --clobber
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET}"
          curl -fL --retry 4 --retry-delay 2 --range 0-65535 -o /tmp/probe.bin "$URL"
          test -s /tmp/probe.bin
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_MEDIA_URL=$URL"

      - name: Queue through production X publication contract
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_URL: ${{ steps.host.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/x-issue-body.md
          import json, os
          report=json.load(open('x-e2e/report.json',encoding='utf-8'))
          body={
            'platform':'x',
            'account':'lucasyahn',
            'caption':'Teste do fluxo completo Anthares — microcortes IA validados.',
            'media_url':os.environ['MEDIA_URL'],
            'source_id':'x-e2e-fixture-'+os.environ['GITHUB_RUN_ID'],
            'test_fixture':True,
            'microcut_report':{k:v for k,v in report.items() if k!='transcript'},
          }
          print('```json')
          print(json.dumps(body,ensure_ascii=False,indent=2))
          print('```')
          PY
          url=$(gh issue create --title "[X-PUBLISH] full-flow-microcut-fixture-${GITHUB_RUN_ID}" --body-file /tmp/x-issue-body.md)
          echo "issue_url=$url" >> "$GITHUB_OUTPUT"
          echo "X_QUEUE_ISSUE=$url"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-full-flow-fixture-${{ github.run_id }}
          path: |
            x-e2e/report.json
            x-e2e/final.mp4
          if-no-files-found: ignore
          retention-days: 3
