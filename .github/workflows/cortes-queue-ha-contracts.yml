name: CORTES queue HA - isolated contracts
on:
  pull_request:
    paths:
      - infra/neon-cortes-queue/**
      - infra/cloudflare-cortes-queue-ha/**
      - tests/test_cortes_queue_ha.mjs
      - .github/workflows/cortes-queue-ha-contracts.yml
  push:
    branches: [main]
    paths:
      - infra/neon-cortes-queue/**
      - infra/cloudflare-cortes-queue-ha/**
      - tests/test_cortes_queue_ha.mjs
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate source and six isolated authorization/failover tests
        shell: bash
        run: |
          set -euo pipefail
          node --check infra/neon-cortes-queue/index.mjs
          node --check infra/cloudflare-cortes-queue-ha/src/index.js
          node --test tests/test_cortes_queue_ha.mjs
