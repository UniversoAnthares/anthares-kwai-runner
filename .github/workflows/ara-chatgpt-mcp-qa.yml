name: ARA ChatGPT MCP QA

on:
  push:
    branches:
      - feature/ara-chatgpt-mcp
  pull_request:
    paths:
      - 'anthares-remote-mcp/**'
      - '.github/workflows/ara-chatgpt-mcp-qa.yml'
  workflow_dispatch:

jobs:
  protocol-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: anthares-remote-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: anthares-remote-mcp/package-lock.json
      - run: npm install
      - run: node qa.mjs
