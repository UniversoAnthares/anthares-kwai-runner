name: CORTES Bitwarden Google OAuth metadata inventory
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-bws-google-oauth-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bitwarden SDK
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/anthares-bws-sdk" --no-audit --no-fund --silent @bitwarden/sdk-napi@1.0.0
      - name: Read only Google OAuth secret names, never values
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/cortes_bws_google_oauth_inventory.js
          node tools/cortes_bws_google_oauth_inventory.js
      - name: Remove SDK and ephemeral state
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/anthares-bws-sdk" "$RUNNER_TEMP/cortes-bws-state"
          echo CORTES_BWS_EPHEMERAL_CLEANUP=PASS
