name: CORTES LinkedIn organization - direct REST publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-linkedin-company-direct-cloud.yml'
      - 'tools/cortes_linkedin_company_cloud.py'
      - 'tests/test_cortes_linkedin_company_admin_preflight.py'
  workflow_dispatch: {}
  schedule:
    - cron: '1 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-linkedin-company-direct-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  publish-company-direct:
    if: ${{ vars.CORTES_LINKEDIN_COMPANY_DIRECT_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve existing consenting LinkedIn member OAuth
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            bd261e5e-11bf-49fb-9baf-b4ea014ec5b7 > LINKEDIN_PERSONAL_ACCESS_TOKEN
      - name: Use organization OAuth or verified administrator's existing OAuth
        env:
          LINKEDIN_COMPANY_SECRET: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${LINKEDIN_COMPANY_SECRET:-}" ]]; then
            token="$LINKEDIN_COMPANY_SECRET"
            echo LINKEDIN_COMPANY_CREDENTIAL_SOURCE=DEDICATED_OAUTH
          elif [[ -n "${LINKEDIN_PERSONAL_ACCESS_TOKEN:-}" ]]; then
            token="$LINKEDIN_PERSONAL_ACCESS_TOKEN"
            echo LINKEDIN_COMPANY_CREDENTIAL_SOURCE=MEMBER_OAUTH_PENDING_ADMIN_VERIFICATION
          else
            echo LINKEDIN_COMPANY_OAUTH_SETUP_REQUIRED=1
            exit 2
          fi
          if [[ "$token" == *$'\n'* || "$token" == *$'\r'* ]]; then
            echo LINKEDIN_COMPANY_CREDENTIAL_FORMAT_INVALID=1
            exit 2
          fi
          echo "::add-mask::$token"
          printf 'LINKEDIN_ACCESS_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Verify administrator role and safe queue contracts
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_cortes_linkedin_company_admin_preflight.py -q
          python -m py_compile tools/cortes_linkedin_company_cloud.py
      - name: Post directly to official LinkedIn organization account with Neon fence
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          LINKEDIN_AUTHOR_URN: urn:li:organization:145345334
        run: |
          set -euo pipefail
          python3 -u -m tools.cortes_linkedin_company_cloud
