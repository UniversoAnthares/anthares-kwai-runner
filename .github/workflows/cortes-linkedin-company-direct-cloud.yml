name: CORTES LinkedIn organization - direct REST publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-linkedin-company-direct-cloud.yml'
      - 'tools/cortes_queue_ha.py'
  workflow_dispatch: {}
  schedule:
    - cron: '1,16,31,46 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-linkedin-company-direct-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  publish-company-direct:
    if: ${{ vars.CORTES_LINKEDIN_COMPANY_DIRECT_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve organization-specific OAuth from protected existing secrets
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          LINKEDIN_COMPANY_SECRET: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${LINKEDIN_COMPANY_SECRET:-}" ]; then
            printf 'LINKEDIN_ACCESS_TOKEN=%s\n' "$LINKEDIN_COMPANY_SECRET" >> "$GITHUB_ENV"
            echo LINKEDIN_COMPANY_OAUTH_SOURCE=DEDICATED_GITHUB
          else
            test -n "${BWS_ACCESS_TOKEN:-}"
            docker run --rm -e BWS_ACCESS_TOKEN ghcr.io/bitwarden/bws secret list |
              python3 -c '
          import json,sys,os
          rows=json.load(sys.stdin)
          names={"LINKEDIN_ACCESS_TOKEN","LINKEDIN_ORGANIZATION_ACCESS_TOKEN","LINKEDIN_COMPANY_ACCESS_TOKEN"}
          found=[str(x.get("value") or "").strip() for x in rows if str(x.get("key") or "").upper() in names and str(x.get("value") or "").strip()]
          if len(found)!=1:
              print("LINKEDIN_COMPANY_OAUTH_NOT_CONFIGURED",flush=True)
              sys.exit(3)
          token=found[0]
          if any(ch in token for ch in "\\r\\n\\x00"):
              sys.exit(3)
          print("::add-mask::"+token,flush=True)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fp:
              fp.write("LINKEDIN_ACCESS_TOKEN="+token+"\\n")
          print("LINKEDIN_COMPANY_OAUTH_SOURCE=DEDICATED_BWS",flush=True)
          '
          fi
      - name: Post directly to official LinkedIn organization account with Neon fence
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          LINKEDIN_AUTHOR_URN: urn:li:organization:145345334
        run: |
          set -euo pipefail
          python3 -u -m tools.cortes_linkedin_company_cloud
