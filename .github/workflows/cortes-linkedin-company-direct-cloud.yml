name: CORTES LinkedIn organization - direct REST publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-linkedin-company-direct-cloud.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '1,16,31,46 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-linkedin-company-direct-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  publish-company-direct:
    if: ${{ vars.CORTES_LINKEDIN_COMPANY_DIRECT_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load existing Anthares admin OAuth from protected Bitwarden if company secret is absent
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            bd261e5e-11bf-49fb-9baf-b4ea014ec5b7 > LINKEDIN_PERSONAL_ACCESS_TOKEN
      - name: Post directly to official LinkedIn organization account with Neon fence
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: urn:li:organization:145345334
        run: |
          set -euo pipefail
          if [ -z "${LINKEDIN_ACCESS_TOKEN:-}" ]; then
            export LINKEDIN_ACCESS_TOKEN="${LINKEDIN_PERSONAL_ACCESS_TOKEN:-}"
          fi
          python3 -u -m tools.cortes_linkedin_company_cloud
