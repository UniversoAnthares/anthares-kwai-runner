name: CORTES LinkedIn organization - direct REST publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-linkedin-company-direct-cloud.yml'
      - 'tools/cortes_queue_ha.py'
  workflow_dispatch: {}
  schedule:
    - cron: '1 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-linkedin-company-direct-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  publish-company-direct:
    if: ${{ vars.CORTES_LINKEDIN_COMPANY_DIRECT_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require dedicated LinkedIn organization OAuth
        env:
          LINKEDIN_COMPANY_SECRET: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LINKEDIN_COMPANY_SECRET:-}" ]; then
            echo LINKEDIN_COMPANY_OAUTH_SETUP_REQUIRED=1
            exit 2
          fi
          printf 'LINKEDIN_ACCESS_TOKEN=%s\n' "$LINKEDIN_COMPANY_SECRET" >> "$GITHUB_ENV"
      - name: Post directly to official LinkedIn organization account with Neon fence
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          LINKEDIN_AUTHOR_URN: urn:li:organization:145345334
        run: |
          set -euo pipefail
          python3 -u -m tools.cortes_linkedin_company_cloud
