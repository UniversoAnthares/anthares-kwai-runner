name: Anthares UIAutomator Kwai caption bridge
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'tools/android-uiautomator/KwaiUiDriver.java'
      - '.github/workflows/anthares-uiautomator-kwai-text.yml'

permissions:
  contents: write

concurrency:
  group: anthares-uiautomator-kwai-caption
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android 25 UIAutomator test jar
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-18' 'build-tools;35.0.0'
          platform="$ANDROID_HOME/platforms/android-18"
          test -s "$platform/android.jar"
          test -s "$platform/uiautomator.jar"
          d8="$ANDROID_HOME/build-tools/35.0.0/d8"
          test -x "$d8"
          mkdir -p build/classes build/dex tools/android-uiautomator/dist
          javac -source 8 -target 8 -cp "$platform/android.jar:$platform/uiautomator.jar" -d build/classes tools/android-uiautomator/KwaiUiDriver.java tools/android-uiautomator/android/test/RepetitiveTest.java
          test -s build/classes/us/anthares/tools/KwaiUiDriver.class
          "$d8" --min-api 18 --lib "$platform/android.jar" --classpath "$platform/uiautomator.jar" --output build/dex build/classes/us/anthares/tools/KwaiUiDriver.class build/classes/android/test/RepetitiveTest.class
          test -s build/dex/classes.dex
          jar cf tools/android-uiautomator/dist/kwai-ui-driver.jar -C build/dex classes.dex
          sha256sum tools/android-uiautomator/dist/kwai-ui-driver.jar > tools/android-uiautomator/dist/kwai-ui-driver.sha256
          unzip -l tools/android-uiautomator/dist/kwai-ui-driver.jar | grep classes.dex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anthares-kwai-uiautomator-caption-jar
          path: tools/android-uiautomator/dist/kwai-ui-driver.*
          retention-days: 5
          if-no-files-found: warn
      - name: Publish verified jar in canonical GitHub source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name anthares-actions
          git config user.email actions@users.noreply.github.com
          git add tools/android-uiautomator/dist/kwai-ui-driver.jar tools/android-uiautomator/dist/kwai-ui-driver.sha256
          if git diff --cached --quiet; then echo "JAR_UNCHANGED"; exit 0; fi
          git commit -m "build(android): publish Unicode-safe Kwai UIAutomator bridge"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "KWAICAPTION_JAR_PUBLISHED=1"
              exit 0
            fi
            sleep 2
          done
          exit 1
