name: CORTES queue Cloudflare edge HA deploy
on:
  push:
    branches: [main]
    paths:
      - infra/cloudflare-cortes-queue-ha/**
      - .github/workflows/cortes-queue-cloudflare-ha.yml
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-queue-cloudflare-edge-ha-deploy
  cancel-in-progress: false
jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5c24be052e5144391f73a8e03491e88e
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent Cloudflare edge ingress
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          node --check infra/cloudflare-cortes-queue-ha/src/index.js
          grep -Fq 'br-crimson-unit-b89nau08-cortesqueue' infra/cloudflare-cortes-queue-ha/src/index.js
      - name: Deploy dedicated queue HA edge, not the primary Remote worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.43.0 deploy --config infra/cloudflare-cortes-queue-ha/wrangler.toml
      - name: Verify health and deny anonymous queue mutations
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://anthares-cortes-neon-edge-ha.anthares1.workers.dev'
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 12 "$BASE/healthz" -o /tmp/queue-ha-health.json &&
               python3 - <<'PY'
          import json
          data=json.load(open('/tmp/queue-ha-health.json'))
          assert data.get('ok') is True
          assert data.get('database_ok') is True
          # HA health checks connectivity, never attests SQL RLS or per-network roles.
          assert data.get('database_ok') is True
          PY
            then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/queue-ha-health.json'))
          assert data.get('ok') is True and data.get('database_ok') is True
          print('CORTES_CLOUDFLARE_NEON_HEALTH=PASS_CONNECTIVITY_ONLY')
          PY
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 -X POST             -H 'Content-Type: application/json' -d '{"target_key":"linkedin:primary"}'             "$BASE/?action=buffer-lease")"
          test "$code" = 401
          echo 'CORTES_CLOUDFLARE_UNAUTHORIZED_POST=DENIED'
      - name: Prove signed OIDC writes are isolated, read back and cleaned
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          audience='https://anthares-remote-primary.vercel.app/api/cortes-queue'
          token_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          token_url+=('&' if '?' in token_url else '?')+urllib.parse.urlencode({'audience':audience})
          token_req=urllib.request.Request(token_url,headers={
              'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(token_req,timeout=12) as r:
              token=json.load(r)['value']
          assert len(token)>60
          backends={
              'NEON':'https://br-crimson-unit-b89nau08-cortesqueue.compute.c-14.us-east-1.aws.neon.tech/',
              'CLOUDFLARE':'https://anthares-cortes-neon-edge-ha.anthares1.workers.dev/'
          }
          nonce='cortes-ha-'+str(os.environ['GITHUB_RUN_ID'])+'-'+str(os.environ['GITHUB_RUN_ATTEMPT'])
          for name,base in backends.items():
              headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
              def call(action,payload):
                  req=urllib.request.Request(base+'?action='+action,method='POST',
                      data=json.dumps(payload).encode(),headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:
                          return r.status,json.load(r)
                  except urllib.error.HTTPError as exc:
                      try:
                          data=json.loads(exc.read(600).decode('utf-8'))
                          reason=str(data.get('error') or 'NO_ERROR_FIELD')[:100]
                      except (ValueError,UnicodeError):
                          reason='NON_JSON_RESPONSE'
                      return exc.code,{'reason':reason,
                          'via_worker':exc.headers.get('X-Anthares-Queue-Route','ABSENT')}
              status,body=call('probe',{'nonce':nonce+'-'+name})
              if status!=200:
                  print('CORTES_'+name+'_PROBE_HTTP='+str(status)
                        +' ERROR='+str(body.get('reason','UNKNOWN'))
                        +' WORKER_ROUTE='+str(body.get('via_worker','ABSENT')))
              assert status==200 and body.get('ok') and body.get('database_ok'),(name,status)
              assert body.get('probe')=='SIGNED_OIDC_NEON_WRITE_READ_DELETE',name
              denied,_=call('enqueue',{'platform':'linkedin'})
              assert denied==403,(name,denied)
              print('CORTES_'+name+'_OIDC_WRITE_READ_DELETE=PASS')
              print('CORTES_'+name+'_ROLE_ISOLATION=UNVERIFIED_SQL_RLS')
          PY
