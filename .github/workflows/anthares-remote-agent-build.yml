name: Anthares Remote Agent build

on:
  push:
    branches:
      - main
      - feature/anthares-remote-agent
      - feature/ara-chatgpt-mcp
    paths:
      - 'anthares-remote-agent/**'
      - '.github/workflows/anthares-remote-agent-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anthares-remote-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test
        run: go test ./...
      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -trimpath -ldflags='-s -w' -o dist/anthares-remote-agent.exe ./cmd/agent
          sha256sum dist/anthares-remote-agent.exe > dist/anthares-remote-agent.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: anthares-remote-agent-windows-amd64
          path: |
            anthares-remote-agent/dist/anthares-remote-agent.exe
            anthares-remote-agent/dist/anthares-remote-agent.exe.sha256
          if-no-files-found: error
      - name: Publish stable agent asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='ara-agent-latest'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/anthares-remote-agent.exe dist/anthares-remote-agent.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/anthares-remote-agent.exe dist/anthares-remote-agent.exe.sha256 --target "$GITHUB_SHA" --title 'Anthares Remote Agent — latest' --notes 'Automatically published from the tested main branch.' --repo "$GITHUB_REPOSITORY"
          fi
