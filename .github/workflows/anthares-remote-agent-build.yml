name: Anthares Remote Agent build

on:
  push:
    branches:
      - feature/anthares-remote-agent
      - feature/ara-chatgpt-mcp
    paths:
      - 'anthares-remote-agent/**'
      - '.github/workflows/anthares-remote-agent-build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anthares-remote-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test
        run: go test ./...
      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o dist/anthares-remote-agent.exe ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: anthares-remote-agent-windows-amd64
          path: anthares-remote-agent/dist/anthares-remote-agent.exe
          if-no-files-found: error
