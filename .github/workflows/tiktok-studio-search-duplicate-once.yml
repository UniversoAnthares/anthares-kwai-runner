name: One-time authenticated TikTok Studio search for candidate duplicate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tiktok-studio-search-duplicate-once.yml']
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Search current Studio Posts list for approved title without publishing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN;if(!token||token.length<20)throw Error('MISSING_NF_TOKEN');
          const get=async p=>{const r=await fetch('https://api.northflank.com/v1'+p,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('NF_HTTP_'+r.status);return r.json()};
          const found=[];for(const p of (await get('/projects')).data?.projects||[])for(const s of (await get('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[])if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);
          if(found.length!==1)throw Error('TARGET_SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0],ctx=new ApiClientInMemoryContextProvider();await ctx.addContext({name:'read',token});const cli=new ApiClient(ctx);
          const code=String.raw`import sys,time,json
          sys.path.insert(0,"/app/render-tiktok-worker")
          from browser_executor import _cdp
          focus=r"""(()=>{const x=document.querySelector('input[placeholder*="Search for post description"]');if(!x)return {found:false};x.focus();x.select();return {found:true,placeholder:x.placeholder,href:location.pathname};})()"""
          a=_cdp("Runtime.evaluate",{"expression":focus,"returnByValue":True})
          f=(a.get("result") or {}).get("value") or {}
          print("SEARCH_FIELD_FOUND="+str(bool(f.get("found"))),flush=True)
          if not f.get("found"):raise SystemExit("SEARCH_FIELD_MISSING")
          text="Conceito de Comédia para Aristóteles"
          _cdp("Input.insertText",{"text":text})
          time.sleep(7)
          check=r"""(()=>({value:document.querySelector('input[placeholder*="Search for post description"]')?.value||'',text:(document.body?.innerText||'').slice(0,2600),links:[...document.querySelectorAll('a[href*="/video/"]')].map(a=>({url:a.href,desc:(a.innerText||'').trim().slice(0,230)})).slice(0,15),loader:!!document.querySelector('[aria-busy="true"]')}))()"""
          r=_cdp("Runtime.evaluate",{"expression":check,"returnByValue":True})
          v=(r.get("result") or {}).get("value") or {}
          print("SEARCH_QUERY_CONFIRMED="+str(bool(v.get("value")==text)),flush=True)
          print("SEARCH_RESULT_1="+json.dumps(v,ensure_ascii=False)[:5500],flush=True)
          _cdp("Input.dispatchKeyEvent",{"type":"keyDown","key":"Enter","code":"Enter","windowsVirtualKeyCode":13})
          _cdp("Input.dispatchKeyEvent",{"type":"keyUp","key":"Enter","code":"Enter","windowsVirtualKeyCode":13})
          time.sleep(6)
          r=_cdp("Runtime.evaluate",{"expression":check,"returnByValue":True})
          v=(r.get("result") or {}).get("value") or {}
          print("SEARCH_RESULT_AFTER_ENTER="+json.dumps(v,ensure_ascii=False)[:5500],flush=True)
          `;
          const r=await cli.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',code]});
          console.log('DUPLICATE_SEARCH_EXIT='+String(r.commandResult?.exitCode));
          console.log('DUPLICATE_SEARCH_RESULT='+String(r.stdOut||'').replace(/[\r\n]+/g,' | ').slice(0,11500));
          if(r.commandResult?.exitCode!==0)throw Error('DUPLICATE_SEARCH_FAILED');
          NODE
