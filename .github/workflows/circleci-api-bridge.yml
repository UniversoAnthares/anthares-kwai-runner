name: CircleCI API bridge
on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only CircleCI API operation
        required: true
        type: choice
        options: [recent, pipeline]
      pipeline_id:
        description: CircleCI pipeline UUID (only for pipeline action)
        required: false
        type: string
permissions:
  contents: read
jobs:
  circleci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query CircleCI without exposing credentials
        env:
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
          ACTION: ${{ inputs.action }}
          PIPELINE_ID: ${{ inputs.pipeline_id }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, uuid
          token=os.environ.get("CIRCLECI_API_TOKEN","")
          if not token:
              raise SystemExit("CIRCLECI_API_TOKEN missing")
          print("::add-mask::"+token)
          action=os.environ["ACTION"]
          if action=="recent":
              url="https://circleci.com/api/v2/project/circleci/AD1ogrgZSksHHasJt5oQWS/EzY5SP7UfkgqSdih1JT1sh/pipeline"
          elif action=="pipeline":
              pid=os.environ["PIPELINE_ID"]
              uuid.UUID(pid)
              url=f"https://circleci.com/api/v2/pipeline/{pid}"
          else:
              raise SystemExit("Unsupported action")
          req=urllib.request.Request(url,headers={"Circle-Token":token,"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=json.load(response)
          except urllib.error.HTTPError as e:
              print("CIRCLECI_HTTP_STATUS="+str(e.code))
              raise SystemExit(1)
          if action=="recent":
              for p in data.get("items",[])[:3]:
                  print(json.dumps({k:p.get(k) for k in ("id","number","state","created_at","updated_at","trigger")},ensure_ascii=False))
          else:
              print(json.dumps({k:data.get(k) for k in ("id","number","state","created_at","updated_at")},ensure_ascii=False))
          PY