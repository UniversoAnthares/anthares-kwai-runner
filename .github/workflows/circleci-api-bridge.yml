name: CircleCI API bridge
on:
  push:
    paths:
      - '.github/workflows/circleci-api-bridge.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Read-only CircleCI API operation
        required: true
        type: choice
        options: [diagnose, recent, pipeline, workflow_status]
      pipeline_id:
        description: CircleCI pipeline UUID (only for pipeline action)
        required: false
        type: string
permissions:
  contents: read
jobs:
  circleci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query CircleCI without exposing credentials
        env:
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
          ACTION: ${{ inputs.action || 'workflow_status' }}
          PIPELINE_ID: ${{ inputs.pipeline_id }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, uuid
          token=os.environ.get("CIRCLECI_API_TOKEN","")
          if not token:
              raise SystemExit("CIRCLECI_API_TOKEN missing")
          print("::add-mask::"+token)
          action=os.environ["ACTION"]
          if action=="diagnose":
              urls={
                "identity":"https://circleci.com/api/v2/me",
                "project_github_app":"https://circleci.com/api/v2/project/circleci/AD1ogrgZSksHHasJt5oQWS/EzY5SP7UfkgqSdih1JT1sh",
                "project_legacy":"https://circleci.com/api/v2/project/gh/UniversoAnthares/anthares-kwai-runner",
              }
              for label,endpoint in urls.items():
                  request=urllib.request.Request(endpoint,headers={"Circle-Token":token,"Accept":"application/json"})
                  try:
                      with urllib.request.urlopen(request,timeout=20) as response:
                          data=json.load(response)
                          print("PROBE",label,"HTTP",response.status,"keys",sorted(data.keys()) if isinstance(data,dict) else "non-object")
                  except urllib.error.HTTPError as e:
                      print("PROBE",label,"HTTP",e.code)
                  except Exception as e:
                      print("PROBE",label,"ERROR",type(e).__name__)
              raise SystemExit(0)
          if action=="recent":
              url="https://circleci.com/api/v2/project/gh/UniversoAnthares/anthares-kwai-runner/pipeline"
          elif action=="workflow_status":
              url="https://circleci.com/api/v2/project/gh/UniversoAnthares/anthares-kwai-runner/pipeline"
          elif action=="pipeline":
              pid=os.environ["PIPELINE_ID"]
              uuid.UUID(pid)
              url=f"https://circleci.com/api/v2/pipeline/{pid}"
          else:
              raise SystemExit("Unsupported action")
          req=urllib.request.Request(url,headers={"Circle-Token":token,"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=json.load(response)
          except urllib.error.HTTPError as e:
              print("CIRCLECI_HTTP_STATUS="+str(e.code))
              raise SystemExit(1)
          if action=="recent":
              for p in data.get("items",[])[:3]:
                  print(json.dumps({k:p.get(k) for k in ("id","number","state","created_at","updated_at","trigger")},ensure_ascii=False))
          elif action=="workflow_status":
              for p in data.get("items",[])[:3]:
                  pid=p["id"]
                  req2=urllib.request.Request(f"https://circleci.com/api/v2/pipeline/{pid}/workflow",headers={"Circle-Token":token,"Accept":"application/json"})
                  with urllib.request.urlopen(req2,timeout=20) as response2:
                      workflows=json.load(response2).get("items",[])
                  print("PIPELINE",p.get("number"),pid,"WORKFLOWS",len(workflows))
                  for w in workflows:
                      print(json.dumps({k:w.get(k) for k in ("id","name","status","created_at","stopped_at","pipeline_id")},ensure_ascii=False))
                      wid=w.get("id")
                      if wid:
                          jobreq=urllib.request.Request(f"https://circleci.com/api/v2/workflow/{wid}/job",headers={"Circle-Token":token,"Accept":"application/json"})
                          with urllib.request.urlopen(jobreq,timeout=20) as jr:
                              jobs=json.load(jr).get("items",[])
                          print("WORKFLOW_JOBS",wid,len(jobs))
                          for job in jobs:
                              print("JOB",json.dumps({k:job.get(k) for k in ("name","status","job_number","started_at","stopped_at","type")},ensure_ascii=False))
          else:
              print(json.dumps({k:data.get(k) for k in ("id","number","state","created_at","updated_at")},ensure_ascii=False))
          PY