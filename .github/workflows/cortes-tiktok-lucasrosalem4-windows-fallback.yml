name: CORTES TikTok lucasrosalem4 Windows last-resort
on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        type: boolean
        default: true
      proof_publish_one:
        description: Owner-approved manual recovery only after source frozen, terminal check and Neon fencing
        type: boolean
        default: false
# No automatic failover on failed cloud runs: a remote upload might have succeeded.
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-tiktok-lucas4-windows-last-resort
  cancel-in-progress: false
jobs:
  windows_backup:
    # An explicit per-account owner-approved handoff must follow Neon reconciliation.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.diagnostic_only == false && inputs.proof_publish_one == true && vars.TIKTOK_LUCAS4_WINDOWS_TAKEOVER_APPROVED == 'true' && vars.TIKTOK_FORGEJO_PRIMARY != 'true' && vars.TIKTOK_CODEBERG_PRIMARY != 'true' }}
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      TIKTOK_LUCASROSALEM4_STORAGE_STATE: ${{ secrets.TIKTOK_LUCASROSALEM4_STORAGE_STATE }}
      TIKTOK_LUCASROSALEM4_CLOUD_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_publish_one == true && inputs.diagnostic_only == false && vars.TIKTOK_LUCAS4_WINDOWS_TAKEOVER_APPROVED == 'true' && vars.TIKTOK_LUCASROSALEM4_CLOUD_ENABLED == 'false' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          python -m pip install -q playwright requests
          python -m playwright install chromium
          python -u tools/cortes_tiktok_lucasrosalem4_cloud_publish.py
