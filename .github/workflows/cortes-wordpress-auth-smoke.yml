name: CORTES WordPress authenticated QA smoke
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/cortes-wordpress-auth-smoke.yml
permissions:
  contents: read
concurrency:
  group: cortes-wordpress-auth-smoke
  cancel-in-progress: false
jobs:
  read-only-auth-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check WordPress API identity and JSON shape without writing
        shell: bash
        run: |
          python -u tools/cortes_wp_auth_smoke.py
