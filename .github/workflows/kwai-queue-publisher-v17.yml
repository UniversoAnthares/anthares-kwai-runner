name: Anthares Kwai Queue Publisher v17

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kwai-queue-publisher-v17.yml"
      - ".kwai-v17-trigger"

permissions:
  contents: read
  id-token: write

concurrency:
  group: anthares-kwai-queue-publisher-v17
  cancel-in-progress: false

env:
  ANTHARES_CONTROL_URL: https://anthares-control.anthares1.workers.dev
  KWAI_EXPECTED_ACCOUNT: lucasrosalem
  KWAI_LEASE_TTL_SECONDS: "600"
  KWAI_LEASE_RENEW_INTERVAL_SECONDS: "120"
  KWAI_LEASE_RENEW_TTL_SECONDS: "600"
  KWAI_SESSION_FILE: kwai-session.enc
  KWAI_AUTH_STRATEGY: mobile_only

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate current provider backend and publisher contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 8 --max-time 20 "$ANTHARES_CONTROL_URL/health")"
          HEALTH_BODY="$body" python3 - <<'PY'
          import json, os
          d=json.loads(os.environ['HEALTH_BODY'])
          assert d.get('version') == '2026-10-15-publisher-target-v17', d
          assert d.get('pc_fallback') is False, d
          assert d.get('persistent_state') is True, d
          assert d.get('queue_bound') is True, d
          print('KWAI_CONTROL_TARGET_V17_READY=1')
          PY
          bash -n kwai_publish.sh kwai_claim_job.sh kwai_queue_heartbeat.sh kwai_queue_state.sh kwai_queue_publish_runtime.sh android_executor_api30_runtime.sh kwai_run_next_job.sh kwai_headless_login.sh kwai_session_state.sh
          python3 -m py_compile kwai_publish_video.py kwai_verify_publication.py kwai_auth_probe.py kwai_auth_ready_gate.py kwai_real_publish_promotion_gate.py tools/kwai_login_surface_recovery.py tools/kwai_android_login_entry.py tools/kwai_session_vault_client.py

      - name: Require encrypted-session key
        env:
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
        run: |
          test -n "$KWAI_PASSWORD" || { echo KWAI_PASSWORD_MISSING=1; exit 42; }

      - name: Download validated Kwai package vault
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 10 --max-time 180 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip" | sha256sum -c -
          rm -rf kwai-vault
          unzip -q kwai-vault.zip -d kwai-vault
          test -s kwai-vault/MANIFEST.tsv

      - name: Restore authenticated Kwai session from protected vault
        run: |
          set -euo pipefail
          python3 tools/kwai_session_vault_client.py pull --path kwai-session.enc
          test -s kwai-session.enc

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run canonical remote Android publisher
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
          KWAI_AUTH_STRATEGY: mobile_only
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 300
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048 -cores 2
          script: |
            bash kwai_vault_install.sh
            adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            bash kwai_session_state.sh restore >/tmp/kwai-session-restore.log 2>&1 || true
            bash kwai_queue_publish_runtime.sh

      - name: Persist only positively authenticated session
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s kwai-session.enc ] && [ -s kwai-headless-status.txt ] && grep -Eq '^KWAI_SESSION_AUTHENTICATED(_RESTORED)?$' kwai-headless-status.txt && grep -qx 'KWAI_IDENTITY_PROFILE_MATCH=1' kwai-headless-status.txt; then
            python3 tools/kwai_session_vault_client.py push --path kwai-session.enc
          else
            echo KWAI_VAULT_SAVE_SKIPPED_NO_IDENTITY_PROOF=1
          fi

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-v17-${{ github.run_id }}
          path: |
            kwai-publication.log
            kwai-publish-status.txt
            kwai-reconcile-status.txt
            kwai-headless-status.txt
          if-no-files-found: warn
          retention-days: 3
