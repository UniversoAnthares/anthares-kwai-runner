name: Anthares-browser live protected-surface smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/anthares-browser-live-smoke-once.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public liveness, readiness and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          base='https://anthares-browser-qa-render.onrender.com'
          health="$(curl -fsS --retry 8 --retry-delay 5 --max-time 20 "$base/health")"
          ready="$(curl -fsS --retry 8 --retry-delay 5 --max-time 20 "$base/ready")"
          python3 - "$health" "$ready" <<'PY'
          import json, sys
          h=json.loads(sys.argv[1]); r=json.loads(sys.argv[2])
          assert h.get('ok') is True and h.get('service')=='anthares-browser', h
          for k in ('ok','profile_dir_exists','profile_dir_writable','chromium_running','cdp_ready'):
              assert r.get(k) is True, (k,r)
          print('BROWSER_HEALTH_READY=PASS')
          PY
          login_code="$(curl -sS -o /tmp/login.html -w '%{http_code}' --max-time 20 "$base/novnc/login")"
          test "$login_code" = 200
          grep -q 'Anthares Browser' /tmp/login.html
          status_code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 20 "$base/status")"
          test "$status_code" = 401
          novnc_code="$(curl -sS -o /tmp/novnc.json -w '%{http_code}' --max-time 20 "$base/novnc")"
          test "$novnc_code" = 401
          echo 'NOVNC_PROTECTED_SURFACE=PASS'
