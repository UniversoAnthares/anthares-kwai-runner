name: Anthares-browser runtime readiness repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/anthares-browser-runtime-ready-fix-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair readiness probes on main and production control branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          patch_file() {
            python3 - <<'PY'
from pathlib import Path
p = Path('infra/anthares_runtime_mesh.py')
s = p.read_text()
old = 'requests.get(url + "/health", timeout=8)'
new = 'requests.get(url + "/ready", timeout=8)'
if old not in s:
    print('readiness probe already repaired or source changed')
else:
    p.write_text(s.replace(old, new))
    print('readiness probe repaired')
PY
          }

          git fetch origin main anthares-remote-control-v1
          git checkout -B main origin/main
          patch_file
          if ! git diff --quiet -- infra/anthares_runtime_mesh.py; then
            git add infra/anthares_runtime_mesh.py
            git commit -m 'fix(browser): use readiness endpoint in runtime mesh'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          git fetch origin anthares-remote-control-v1
          git checkout -B anthares-remote-control-v1 origin/anthares-remote-control-v1
          patch_file
          if ! git diff --quiet -- infra/anthares_runtime_mesh.py; then
            git add infra/anthares_runtime_mesh.py
            git commit -m 'fix(browser): use readiness endpoint in production runtime mesh'
            git push origin HEAD:anthares-remote-control-v1
          fi

          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/anthares-browser-runtime-ready-fix-once.yml
          git commit -m 'ci(browser): remove completed one-shot readiness repair'
          git pull --rebase origin main
          git push origin HEAD:main
