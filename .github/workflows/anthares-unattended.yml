name: Anthares Unattended Readiness
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate unattended readiness
        id: readiness
        shell: bash
        env:
          ANTHARES_SESSION_B64: ${{ secrets.ANTHARES_SESSION_B64 }}
          ANTHARES_EXECUTOR_NAME: github-hosted
          ANTHARES_EXECUTOR_HEALTHY: '1'
        run: |
          set +e
          python control_plane/unattended.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anthares-unattended-readiness
          path: anthares-readiness.json
          if-no-files-found: error
