name: CORTES Buffer priority-20 distribution contracts
on:
  pull_request:
    paths:
      - 'anthares_publisher/buffer_distribution.py'
      - 'tools/cortes_buffer_three_fanout.py'
      - 'tools/cortes_linkedin_neon_fanout.py'
      - 'tests/test_cortes_buffer_distribution.py'
      - 'vercel-ara-primary/api/cortes-queue.mjs'
      - '.github/workflows/cortes-buffer-priority-contract.yml'
  push:
    branches: [main]
    paths:
      - 'anthares_publisher/buffer_distribution.py'
      - 'tools/cortes_buffer_three_fanout.py'
      - 'tools/cortes_linkedin_neon_fanout.py'
      - 'tests/test_cortes_buffer_distribution.py'
      - 'vercel-ara-primary/api/cortes-queue.mjs'
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check code and test distribution without network writes
        run: |
          set -euo pipefail
          node --check vercel-ara-primary/api/cortes-queue.mjs
          python3 -m py_compile anthares_publisher/buffer_distribution.py tools/cortes_buffer_three_fanout.py tools/cortes_buffer_instagram_cloud.py tools/cortes_buffer_pinterest_cloud.py
          python3 -m unittest discover -s tests -p 'test_cortes_buffer_distribution.py' -v
          python3 -m unittest discover -s tests -p 'test_cortes_buffer_pinterest_cloud.py' -v
