name: Anthares GitLab quota event failover
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - "Sync GitHub main to GitLab"
      - "Anthares Core Supervisor"
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only inspect without dispatch
        type: boolean
        required: false
        default: true
  push:
    branches: [main]
    paths:
      - 'tools/gitlab_quota_watcher.py'
      - 'tools/test_gitlab_quota_watcher.py'
      - '.github/workflows/gitlab-quota-watcher.yml'
permissions:
  actions: write
  contents: read
concurrency:
  group: anthares-gitlab-quota-watcher
  cancel-in-progress: false
jobs:
  watch:
    # Independent scheduled parent events recover the watcher when its own
    # cron is delayed. Do not react to untrusted PR/push parent completions.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify three-system failover dispatch and deduplication offline
        run: python3 tools/test_gitlab_quota_watcher.py
      - name: Detect actual GitLab runner quota failures and dispatch only new work
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python tools/gitlab_quota_watcher.py
