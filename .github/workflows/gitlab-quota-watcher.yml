name: Anthares GitLab quota event failover
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - "Sync GitHub main to GitLab"
      - "Anthares Core Supervisor"
      - "GitLab CI quota fallback - CORTES contracts"
      - "Anthares remote private CI quota rescue"
    types: [completed]
  workflow_dispatch:
    inputs:
      historical_aoi8_once:
        description: Admit one already-terminal GitLab quota incident with exact tuple
        type: boolean
        required: false
        default: false
      reconcile_only:
        description: Confirm an existing exact successful CI receipt; no dispatch
        type: boolean
        required: false
        default: false
      reconcile_component:
        description: Fixed project component
        type: choice
        options: [cortes, clipper, wordpress]
        required: false
      reconcile_project_id:
        description: Original numeric GitLab project ID
        type: string
        required: false
      reconcile_pipeline_id:
        description: Original numeric GitLab pipeline ID
        type: string
        required: false
      reconcile_sha:
        description: Exact 40-character original GitLab SHA
        type: string
        required: false
      reconcile_github_run_id:
        description: Already completed/successful GitHub rescue run ID
        type: string
        required: false
      dry_run:
        description: Read-only inspect without dispatch
        type: boolean
        required: false
        default: true
permissions:
  actions: write
  contents: read
  id-token: write
jobs:
  watch:
    # Admit trusted scheduled parent checks and successful dispatch-based quota rescues.
    # Other parent events stay blocked to prevent redundant watcher launches.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && ((github.event.workflow_run.event == 'schedule' && (github.event.workflow_run.name == 'Sync GitHub main to GitLab' || github.event.workflow_run.name == 'Anthares Core Supervisor')) || (github.event.workflow_run.event == 'workflow_dispatch' && (github.event.workflow_run.name == 'GitLab CI quota fallback - CORTES contracts' || github.event.workflow_run.name == 'Anthares remote private CI quota rescue') && startsWith(github.event.workflow_run.display_title, 'quota-rescue-')))) }}
    runs-on: ubuntu-latest
    # Evaluate the job eligibility before acquiring the mutex; discarded
    # workflow_run push events must not replace legitimate pending work.
    concurrency:
      group: anthares-gitlab-quota-watcher
      cancel-in-progress: false
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve GitLab API credential from Anthares Secrets when configured
        id: bws-auth
        if: ${{ vars.ANTHARES_SECRETS_GITLAB_TOKEN_ID != '' && !(github.event_name == 'workflow_dispatch' && inputs.reconcile_only) }}
        continue-on-error: true
        uses: bitwarden/sm-action@f1de238fc00c738c56140796018be9084c2b5d21
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            ${{ vars.ANTHARES_SECRETS_GITLAB_TOKEN_ID }} > ANTHARES_GITLAB_TOKEN_FROM_BW
      - name: Confirm selected credential source without printing its value
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reconcile_only) }}
        env:
          FROM_BW: ${{ env.ANTHARES_GITLAB_TOKEN_FROM_BW }}
          LEGACY: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$FROM_BW" ]; then
            echo "ANTHARES_GITLAB_CREDENTIAL_SOURCE=BITWARDEN"
          elif [ -n "$LEGACY" ]; then
            echo "ANTHARES_GITLAB_CREDENTIAL_SOURCE=GITHUB_FALLBACK"
          else
            echo "::error::GITLAB_CREDENTIAL_UNAVAILABLE"
            exit 1
          fi
      - name: Detect actual GitLab runner quota failures and dispatch only new work
        env:
          GITLAB_TOKEN: ${{ env.ANTHARES_GITLAB_TOKEN_FROM_BW || secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ANTHARES_CI_QUOTA_LEDGER_URL: https://br-crimson-unit-b89nau08-cquotarec.compute.c-14.us-east-1.aws.neon.tech/api/gitlab-reserve
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ANTHARES_HISTORICAL_AOI8_ONCE: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_aoi8_once }}
          ANTHARES_RECONCILE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile_only }}
          ANTHARES_RECONCILE_COMPONENT: ${{ inputs.reconcile_component }}
          ANTHARES_RECONCILE_PROJECT_ID: ${{ inputs.reconcile_project_id }}
          ANTHARES_RECONCILE_PIPELINE_ID: ${{ inputs.reconcile_pipeline_id }}
          ANTHARES_RECONCILE_SHA: ${{ inputs.reconcile_sha }}
          ANTHARES_RECONCILE_GITHUB_RUN_ID: ${{ inputs.reconcile_github_run_id }}
        run: python tools/gitlab_quota_watcher.py
