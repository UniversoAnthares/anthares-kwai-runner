name: Anthares GitLab quota event failover
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - "Sync GitHub main to GitLab"
      - "Anthares Core Supervisor"
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only inspect without dispatch
        type: boolean
        required: false
        default: true
  push:
    branches: [main]
    paths:
      - 'tools/gitlab_quota_watcher.py'
      - 'tools/test_gitlab_quota_watcher.py'
      - '.github/workflows/gitlab-quota-watcher.yml'
permissions:
  actions: write
  contents: read
jobs:
  watch:
    # Use only trusted scheduled parent completions as secondary triggers.
    # Every mirror push previously caused excess runs and pending cancellations.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule') }}
    runs-on: ubuntu-latest
    # Evaluate the job eligibility before acquiring the mutex; discarded
    # workflow_run push events must not replace legitimate pending work.
    concurrency:
      group: anthares-gitlab-quota-watcher
      cancel-in-progress: false
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify three-system failover dispatch and deduplication offline
        run: python3 tools/test_gitlab_quota_watcher.py
      - name: Retrieve GitLab API credential from Anthares Secrets when configured
        id: bws-auth
        if: ${{ vars.ANTHARES_SECRETS_GITLAB_TOKEN_ID != '' }}
        continue-on-error: true
        uses: bitwarden/sm-action@f1de238fc00c738c56140796018be9084c2b5d21
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            ${{ vars.ANTHARES_SECRETS_GITLAB_TOKEN_ID }} > ANTHARES_GITLAB_TOKEN_FROM_BW
      - name: Detect actual GitLab runner quota failures and dispatch only new work
        env:
          GITLAB_TOKEN: ${{ env.ANTHARES_GITLAB_TOKEN_FROM_BW || secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python tools/gitlab_quota_watcher.py

# Bitwarden secret read remains opt-in until its ID is configured.
