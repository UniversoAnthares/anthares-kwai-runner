name: CORTES HA - Signed OIDC end-to-end read-only proof
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-neon-ha-oidc-proof.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only signed OIDC proof on Neon and independent Cloudflare edge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse
          audience='https://anthares-remote-primary.vercel.app/api/cortes-queue'
          endpoint=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          sep='&' if '?' in endpoint else '?'
          request=urllib.request.Request(endpoint+sep+urllib.parse.urlencode({'audience':audience}),
                  headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request,timeout=15) as resp:
              token=json.load(resp)['value']
          if len(token)<60:raise SystemExit('GITHUB_OIDC_MISSING')
          hosts={
              'NEON':'https://br-crimson-unit-b89nau08-cortesqueue.compute.c-14.us-east-1.aws.neon.tech/',
              'CLOUDFLARE_EDGE':'https://anthares-cortes-neon-edge-ha.anthares1.workers.dev/api/cortes-queue',
          }
          for name,base in hosts.items():
              req=urllib.request.Request(base+'?action=buffer-pending',
                  data=b'{}',method='POST',
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=22) as resp:
                  result=json.load(resp)
              if not result.get('ok') or not isinstance(result.get('jobs'),list):
                  raise SystemExit(name+'_SIGNED_READ_REJECTED')
              print('CORTES_'+name+'_OIDC_READ=PASS')
              # This identity is deliberately never allowed to lease or publish.
              req=urllib.request.Request(base+'?action=buffer-lease',
                 data=b'{"target_key":"linkedin:primary"}',method='POST',
                 headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              try:
                  urllib.request.urlopen(req,timeout=16)
                  raise SystemExit(name+'_WRITE_WAS_NOT_BLOCKED')
              except urllib.error.HTTPError as err:
                  if err.code!=403:raise SystemExit(name+'_WRITE_BLOCK_UNEXPECTED_'+str(err.code))
              print('CORTES_'+name+'_PROBE_WRITE_DENIED=PASS')
          PY
