name: Anthares free Claude Code - cloud runner and model fallback
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = technical plan; edit = one safe file and draft PR'
        type: choice
        required: true
        default: plan
        options: [plan, edit]
      task:
        description: 'Coding request. Do not include passwords or tokens.'
        type: string
        required: true
      scope:
        description: 'Only for edit: exact file under tools/, docs/ or ai-runners/'
        type: string
        required: false
  pull_request:
    paths:
      - '.github/workflows/anthares-free-claude.yml'
      - 'tools/anthares_free_claude_*.js'
      - 'tools/test_anthares_free_claude.js'
permissions:
  contents: read
concurrency:
  group: anthares-free-claude-${{ github.event_name == 'workflow_dispatch' && 'mutation' || github.run_id }}
  cancel-in-progress: false
jobs:
  static-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify free model routing and security gates
        run: |
          set -euo pipefail
          node --check tools/anthares_free_claude_bootstrap.js
          node --check tools/anthares_free_claude_task.js
          node --test tools/test_anthares_free_claude.js
          echo ANTHARES_CLAUDE_STATIC=PASS
  execute:
    if: github.event_name == 'workflow_dispatch'
    needs: static-check
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    env:
      ANTHARES_TASK_MODE: ${{ inputs.mode }}
      ANTHARES_TASK_PROMPT: ${{ inputs.task }}
      ANTHARES_TASK_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Permit only authorized owner, and isolate any write in its own branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_ACTOR" != 'UniversoAnthares' ]]; then
            echo 'AUTHORIZED_OWNER_REQUIRED'; exit 1
          fi
          if [[ "$ANTHARES_TASK_MODE" == 'edit' ]]; then
            git switch -c "claude-free/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
      - name: Install pinned free router, Claude Code and existing Bitwarden SDK
        run: |
          set -euo pipefail
          npm install -g --no-audit --no-fund --silent 9router@0.5.104 @anthropic-ai/claude-code@2.1.290
          npm install --prefix "$RUNNER_TEMP/anthares-bws-sdk" --no-audit --no-fund --silent @bitwarden/sdk-napi@1.0.0
          echo ANTHARES_FREE_DEPENDENCIES=PASS
      - name: Start local-only gateway and use existing Gemini secret, never a paid provider
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node tools/anthares_free_claude_bootstrap.js
      - name: Run bounded Claude Code task with two free model choices
        run: |
          set -euo pipefail
          node tools/anthares_free_claude_task.js
      - name: Check generated edit and syntax
        if: inputs.mode == 'edit'
        run: |
          set -euo pipefail
          git diff --check
          case "$ANTHARES_TASK_SCOPE" in
            *.js) node --check "$ANTHARES_TASK_SCOPE" ;;
            *.php) php -l "$ANTHARES_TASK_SCOPE" ;;
            *.json) node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"))' "$ANTHARES_TASK_SCOPE" ;;
          esac
          echo ANTHARES_CLAUDE_SCOPED_SYNTAX=PASS
      - name: Open draft PR, never merge automatically
        if: inputs.mode == 'edit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -- "$ANTHARES_TASK_SCOPE"
          git diff --cached --quiet && { echo 'NO_PROPOSED_CHANGES'; exit 1; }
          git commit -m 'chore: isolated free Claude Code proposal'
          branch="claude-free/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --draft --title 'Anthares: Claude Code gratuito - proposta isolada' --body 'Execucao remota gratuita via Gemini e 9Router. Escopo limitado, sem merge automatico, exige revisao e testes.'
          echo ANTHARES_CLAUDE_DRAFT_PR=PASS
      - name: Retain short-lived private task result for review
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: anthares-free-claude-result-${{ github.run_id }}
          path: ${{ runner.temp }}/anthares-claude-result.txt
          if-no-files-found: ignore
          retention-days: 2
      - name: Destroy runner secrets and temporary state
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          rm -rf "$RUNNER_TEMP"/anthares-free-claude-* "$RUNNER_TEMP"/anthares-bws-* "$RUNNER_TEMP"/anthares-claude-*.txt
          echo ANTHARES_CLAUDE_EPHEMERAL_CLEANUP=PASS
