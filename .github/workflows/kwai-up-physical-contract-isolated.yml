name: Kwai-up physical contract isolated QA
on:
  push:
    branches:
      - fix/kwai-up-physical-contract-focus-20261013
    paths:
      - 'kwai-up/**'
      - '.github/workflows/kwai-up-physical-contract-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-contract-30:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply native-focus, overlay and exact-media patches
        run: |
          python kwai-up/patch_physical_post_variants.py
          python kwai-up/patch_exact_media_selection.py
      - name: Validate syntax and 30 isolated contract cases
        run: |
          python -m py_compile kwai-up/kwai_up_physical.py
          python kwai-up/run_30_physical_contracts.py
      - name: Prove safe publication boundary remains guarded
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('kwai-up/kwai_up_physical.py').read_text()
          commit=src.split('    def commit(self) -> int:',1)[1].split('    def verify(self) -> int:',1)[0]
          assert 'trusted_focused_final_post(nodes)' in commit
          assert 'hid-focus-target-timeout:trusted-final-post' in commit
          assert commit.index('trusted_focused_final_post(nodes)') < commit.index('keyboard.enter()')
          assert 'PUBLISH_REQUESTED' in commit and 'UNCERTAIN' in commit
          print('KWAI_UP_NATIVE_FOCUS_CONTRACT=PASS')
          PY
