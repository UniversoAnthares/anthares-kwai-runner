name: Provision Render-independent X worker on Northflank

on:
  workflow_dispatch:
  push:
    paths:
      - infra/northflank-x/**
      - infra/x_render_worker_v3.py
      - infra/sitecustomize.py
      - .github/workflows/northflank-x-worker.yml

permissions:
  contents: read

concurrency:
  group: northflank-x-worker
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      X_WORKER_TOKEN: ${{ secrets.X_WORKER_TOKEN }}
    steps:
      - name: Require existing credentials
        shell: bash
        run: |
          test -n "$NORTHFLANK_API_TOKEN" || { echo 'NORTHFLANK_API_TOKEN missing'; exit 1; }
          test -n "$X_WORKER_TOKEN" || { echo 'X_WORKER_TOKEN missing'; exit 1; }

      - name: Provision/update Northflank X worker
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token=os.environ['NORTHFLANK_API_TOKEN']
          worker_token=os.environ['X_WORKER_TOKEN']
          base='https://api.northflank.com/v1'
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}

          def api(method,path,data=None,allow=()):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(base+path,data=body,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:
                      raw=r.read().decode('utf-8','replace')
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  if e.code in allow: return {'_status':e.code,'_body':raw}
                  print('Northflank HTTP',e.code,path,raw[:1200]); raise

          projects=api('GET','/projects').get('data',{}).get('projects',[])
          if isinstance(projects,dict): projects=list(projects.values())
          project=next((p.get('id') for p in projects if p.get('name')=='Default'),None)
          if not project: sys.exit('Northflank Default project not found')

          services=api('GET',f'/projects/{project}/services').get('data',{}).get('services',[])
          if isinstance(services,dict): services=list(services.values())
          name='anthares-x-northflank'
          target=next((s for s in services if s.get('name')==name),None)
          runtime={
            'PORT':'10000',
            'EXPECTED_X_HANDLE':'lucasyahn',
            'X_WORKER_TOKEN':worker_token,
            'X_VAULT_URL':'https://anthares-x-vault.anthares1.workers.dev/state',
            'ANTHARES_REQUIRE_RUNTIME_MESH':'1'
          }
          if not target:
              payload={
                'name':name,
                'description':'Canonical Render-independent X/browser worker',
                'billing':{'deploymentPlan':'nf-compute-10'},
                'deployment':{'instances':1,'docker':{'configType':'default'}},
                'ports':[{'name':'http','internalPort':10000,'public':True,'protocol':'HTTP'}],
                'buildSource':'git',
                'vcsData':{
                  'projectUrl':'https://github.com/UniversoAnthares/anthares-kwai-runner',
                  'projectType':'github','projectBranch':'main'
                },
                'buildSettings':{'dockerfile':{
                  'buildEngine':'buildkit','dockerFilePath':'/infra/northflank-x/Dockerfile','dockerWorkDir':'/'
                }},
                'runtimeEnvironment':runtime,
                'disabledCI':True
              }
              created=api('POST',f'/projects/{project}/services/combined',payload)
              service_id=(created.get('data') or {}).get('id') or name
          else:
              service_id=target.get('id') or name
              # Runtime values are reconciled without exposing their contents in logs.
              api('PATCH',f'/projects/{project}/services/{service_id}',{'runtimeEnvironment':runtime},allow=(400,404,405))

          started=api('POST',f'/projects/{project}/services/{service_id}/build',{},allow=(409,))
          print('NORTHFLANK_X_SERVICE='+service_id)
          print('BUILD_ACCEPTED='+str(started.get('_status') in (None,409)).lower())
          PY
