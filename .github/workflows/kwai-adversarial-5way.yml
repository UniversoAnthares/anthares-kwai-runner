name: Kwai Adversarial 5-Way
on:
  push:
    paths:
      - '.github/workflows/kwai-adversarial-5way.yml'
      - 'tests/test_kwai_adversarial-5way.sh'
      - '.kwai-adversarial-5way-trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case:
          - ready-proof-tamper
          - complete-ack-loss
          - verifier-evidence-loss
          - heartbeat-renew-loss
          - reconcile-no-republish
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/test_kwai_adversarial_5way.sh "${{ matrix.case }}"
