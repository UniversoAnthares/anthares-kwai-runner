name: Kwai Android Rescue Single Runner
on:
  workflow_dispatch:
  push:
    paths:
      - '.android-rescue-trigger'
permissions:
  contents: read
jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated Kwai vault
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 10 --max-time 180 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip" | sha256sum -c -
          rm -rf kwai-vault && mkdir kwai-vault && unzip -q kwai-vault.zip -d kwai-vault
      - name: Fetch agent APK
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          mkdir -p /tmp/agent
          gh api repos/UniversoAnthares/anthares-kwai-runner/actions/artifacts/11384550256/zip > /tmp/agent.zip
          unzip -q /tmp/agent.zip -d /tmp/agent
          test -s /tmp/agent/app-debug.apk
      - name: Real Android rescue acceptance
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KWAI_LOGIN: ${{ secrets.KWAI_LOGIN }}
          KWAI_PASSWORD: ${{ secrets.KWAI_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 240
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            set -Eeuo pipefail
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            V="$(find "$GITHUB_WORKSPACE/kwai-vault" -name kwai_vault_install.sh -print -quit)"
            test -n "$V"
            bash "$V"
            adb install -r /tmp/agent/app-debug.apk
            adb shell pm list packages | grep -q 'package:com.kwai.video'
            adb shell pm list packages | grep -q 'package:us.anthares.agent'
            adb shell settings put secure enabled_accessibility_services 'us.anthares.agent/us.anthares.agent.AntharesAccessibilityService'
            adb shell settings put secure accessibility_enabled 1
            adb shell monkey -p com.kwai.video 1 >/dev/null
            sleep 8
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null || true
            adb pull /sdcard/ui.xml executor-ui.xml >/dev/null || true
            python3 kwai_android_autologin.py
            python3 kwai_auth_probe.py
            echo SUCCESS_SIGNAL=KWAI_AUTH_RESCUE_COMPLETED
