name: Anthares Claude Free MCP to remote Claude Code - contract checks
on:
  pull_request:
    paths:
      - 'cloudflare-ara-mcp/src/claude-code-bridge.mjs'
      - 'cloudflare-ara-mcp/src/claude-code-bridge.test.mjs'
      - 'cloudflare-ara-mcp/src/github-bridge.mjs'
      - '.github/workflows/anthares-free-claude.yml'
      - '.github/workflows/anthares-claude-mcp-code-bridge-ci.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare bridge security and Claude Code workflow configuration
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-ara-mcp/src/claude-code-bridge.mjs
          node --check cloudflare-ara-mcp/src/github-bridge.mjs
          node --check cloudflare-ara-mcp/src/index.js
          node --test cloudflare-ara-mcp/src/claude-code-bridge.test.mjs cloudflare-ara-mcp/src/github-bridge.test.mjs cloudflare-ara-mcp/src/claude-client-policy.test.mjs
          node --test tools/test_anthares_free_claude.js
          grep -Fq 'run-name: Anthares Claude Code' .github/workflows/anthares-free-claude.yml
          grep -Fq 'compression-level: 0' .github/workflows/anthares-free-claude.yml
          echo ANTHARES_CLAUDE_MCP_DISPATCH_CONTRACT=PASS
