name: Anthares Own Android Runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'independent_android/**'
      - '.github/workflows/anthares-own-android.yml'
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Boot Android with Anthares-owned script
        run: bash independent_android/boot.sh
