name: Anthares-browser Cloud Fallback

on:
  workflow_dispatch:
    inputs:
      mode:
        description: qa or login
        required: true
        default: qa
        type: choice
        options: [qa, login]
      keep_minutes:
        description: Interactive login window, max 45
        required: false
        default: '20'
      probe_studio:
        description: 'Check whether the existing encrypted cloud browser profile is authorized in Kwai Studio (read only)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read

concurrency:
  group: anthares-browser-cloud-fallback
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PROFILE_DIR: /tmp/anthares-browser-data
      PROFILE_ARTIFACT: anthares-browser-profile-encrypted
      STATE_KEY: ${{ secrets.ANTHARES_BROWSER_STATE_KEY }}
      VNC_SECRET: ${{ secrets.ANTHARES_BROWSER_VNC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated profile directory
        shell: bash
        run: mkdir -p "$PROFILE_DIR/chrome-profile"

      - name: Restore latest encrypted profile when configured
        if: ${{ env.STATE_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PROFILE_ARTIFACT}&per_page=20" --jq '.artifacts | map(select(.expired==false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > /tmp/profile.zip
            unzip -q /tmp/profile.zip -d /tmp/profile-artifact
            if [ -s /tmp/profile-artifact/profile.tgz.enc ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -in /tmp/profile-artifact/profile.tgz.enc -out /tmp/profile.tgz
              tar -xzf /tmp/profile.tgz -C "$PROFILE_DIR"
              echo PROFILE_RESTORED=1
            fi
          fi

      - name: Generate per-run control credentials
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          control="$(openssl rand -hex 32)"
          if [ "${{ inputs.mode }}" = "login" ]; then
            vnc="$(openssl rand -hex 12)"
            manual="$(openssl rand -hex 24)"
            expires="$(date -u -d '+45 minutes' +%s)"
            echo "manual=$manual" >> "$GITHUB_OUTPUT"
            echo "manual_expires=$expires" >> "$GITHUB_OUTPUT"
          elif [ -n "$VNC_SECRET" ]; then
            vnc="$VNC_SECRET"
          else
            vnc="$(openssl rand -hex 12)"
          fi
          echo "control=$control" >> "$GITHUB_OUTPUT"
          echo "vnc=$vnc" >> "$GITHUB_OUTPUT"

      - name: Build Anthares-browser
        run: |
          set -euo pipefail
          # Keep ephemeral GitHub logs readable while Debian installs Chromium.
          docker build --quiet -t anthares-browser ./anthares-brouser

      - name: Start isolated Anthares-browser
        env:
          CONTROL: ${{ steps.creds.outputs.control }}
          VNC: ${{ steps.creds.outputs.vnc }}
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name anthares-browser \
            -e CONTROL_TOKEN="$CONTROL" \
            -e VNC_PASSWORD="$VNC" \
            -e START_URL="https://studio.kwai.com/live/list?source=" \
            -e NOVNC_MANUAL_TOKEN="${{ steps.creds.outputs.manual }}" \
            -e NOVNC_MANUAL_EXPIRES="${{ steps.creds.outputs.manual_expires }}" \
            -v "$PROFILE_DIR:/data" \
            -p 127.0.0.1:18080:8080 \
            -p 127.0.0.1:16080:6080 \
            anthares-browser
          for i in $(seq 1 150); do
            curl -fsS http://127.0.0.1:18080/ready | grep -q '"cdp_ready":true' && exit 0
            sleep 1
          done
          docker logs anthares-browser
          exit 1

      - name: Prove browser API and isolation
        env:
          CONTROL: ${{ steps.creds.outputs.control }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:18080/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:18080/ready | tee /tmp/ready.json
          grep -q '"cdp_ready":true' /tmp/ready.json
          curl -fsS -H "Authorization: Bearer $CONTROL" http://127.0.0.1:18080/status | tee /tmp/status.json
          grep -q '"cdp_ready":true' /tmp/status.json
          grep -q '"cdp_bind":"127.0.0.1"' /tmp/status.json
          ! docker port anthares-browser | grep -q 9222
          echo HOST_DESKTOP_FALLBACK=FALSE

      - name: Check existing Kwai Studio cloud-session availability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_studio == true }}
        env:
          CONTROL: ${{ steps.creds.outputs.control }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          BASE='http://127.0.0.1:18080'
          HEADERS={'Authorization':'Bearer '+os.environ['CONTROL'],'Content-Type':'application/json'}
          def post(path,payload):
              req=urllib.request.Request(BASE+path,data=json.dumps(payload).encode(),headers=HEADERS,method='POST')
              with urllib.request.urlopen(req,timeout=28) as response:return json.load(response)
          expression='''(async()=>{
            try {
              const r=await fetch('/rest/o/w/live/supplier/cloudLive/checkPermission',{credentials:'include'});
              const data=await r.json();
              const u=data.userInfo||data.data?.userInfo||{};
              const label=(document.body?.innerText||'').includes('Lucas Rosalem');
              return {http:r.status,allow:data.result===1,identity:!!(u.ksId||u.userId),ownerLabel:label};
            } catch(e){return {http:0,allow:false,identity:false,ownerLabel:false}}
          })()'''
          try:
              post('/navigate',{'url':'https://studio.kwai.com/live/list?source=','wait_ms':3000})
              answer=post('/evaluate',{'expression':expression,'return_by_value':True})
              v=(answer.get('result') or {}).get('value') or {}
              ready=v.get('http')==200 and bool(v.get('allow') or v.get('identity')) and bool(v.get('ownerLabel'))
              print('KW12_CLOUD_STUDIO_AUTH='+('CONFIRMED' if ready else 'NOT_AVAILABLE'))
          except (urllib.error.URLError,OSError,ValueError,KeyError) as err:
              print('KW12_CLOUD_STUDIO_AUTH=UNVERIFIED_'+type(err).__name__)
          PY
      - name: Open temporary noVNC tunnel for legitimate manual login
        if: ${{ inputs.mode == 'login' }}
        env:
          KEEP: ${{ inputs.keep_minutes }}
          CONTROL: ${{ steps.creds.outputs.control }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VNC_SECRET" ]; then
            echo 'ANTHARES_BROWSER_VNC_PASSWORD secret is required for login mode' >&2
            exit 2
          fi
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:18080 > /tmp/tunnel.log 2>&1 &
          url=""
          for i in $(seq 1 60); do
            url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/tunnel.log | tail -1 || true)"
            [ -n "$url" ] && break
            sleep 1
          done
          test -n "$url" || { echo "KW12_CLOUDFLARE_TUNNEL_UNAVAILABLE"; exit 1; }
          printf '%s\n' "$url" > "$PROFILE_DIR/novnc_public_origin"
          # Cloudflare Quick Tunnel may announce a URL before the edge route is live.
          # Wait for the authenticated gateway; do not discard a working tunnel on initial 502.
          gateway_ready=0
          for attempt in $(seq 1 90); do
            code="$(curl --connect-timeout 5 --max-time 8 -s -o /dev/null -w '%{http_code}' "$url/novnc/login" || true)"
            if [ "$code" = "200" ]; then
              gateway_ready=1
              echo "KW12_AUTHENTICATED_BROWSER_GATEWAY_READY=1"
              break
            fi
            sleep 2
          done
          if [ "$gateway_ready" != "1" ]; then
            echo "KW12_AUTHENTICATED_BROWSER_GATEWAY_UNAVAILABLE"
            tail -n 20 /tmp/tunnel.log | sed -E 's/https?:\/\/[^ ]+/[REDACTED_URL]/g'
            exit 1
          fi
          echo "KW12_SECURE_NOVNC_URL=${url}/novnc/once/${{ steps.creds.outputs.manual }}"
          echo "::notice title=KW12 Navegador Remoto::${url}/novnc/once/${{ steps.creds.outputs.manual }}"
          {
            echo "### KW-12: acesso remoto do Kwai Studio"
            echo "Abra o [navegador autenticado](${url}/novnc/once/${{ steps.creds.outputs.manual }}) para concluir o login oficial."
            echo "O endereço é temporário e permite uma única utilização."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "KW12_BROWSER_GATEWAY_READY=1"
          minutes="$KEEP"; [ "$minutes" -gt 45 ] && minutes=45; [ "$minutes" -lt 1 ] && minutes=1
          # Only owner authentication can complete this once; login/captcha remain user-operated.
          for (( i=0; i<minutes*10; i++ )); do
            if CONTROL_TOKEN="$CONTROL" python3 - <<'PY'
          import json,os,urllib.request
          expr="""(async()=>{try{
            if(location.hostname!=='studio.kwai.com')return false;
            const r=await fetch('/rest/o/w/live/supplier/cloudLive/checkPermission',{credentials:'include'});
            const d=await r.json();
            const u=d.userInfo||d.data?.userInfo||{};
            return r.status===200&&(d.result===1||!!(u.ksId||u.userId))
                   &&(document.body?.innerText||'').includes('Lucas Rosalem');
          }catch(e){return false}})()"""
          payload=json.dumps({'expression':expr,'return_by_value':True}).encode()
          try:
            req=urllib.request.Request('http://127.0.0.1:18080/evaluate',
              data=payload,headers={'Content-Type':'application/json',
                'Authorization':'Bearer '+os.environ['CONTROL_TOKEN']},method='POST')
            with urllib.request.urlopen(req,timeout=10) as r: data=json.load(r)
            if (data.get('result') or {}).get('value') is True:raise SystemExit(0)
          except Exception:pass
          raise SystemExit(1)
          PY
            then
              echo "KW12_REMOTE_STUDIO_LOGIN_COMPLETED=1"
              break
            fi
            sleep 6
          done

      - name: Seal profile snapshot
        if: ${{ always() && env.STATE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          docker stop anthares-browser >/dev/null 2>&1 || true
          sudo chown -R "$(id -u):$(id -g)" "$PROFILE_DIR"
          tar -czf /tmp/profile.tgz -C "$PROFILE_DIR" chrome-profile
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -in /tmp/profile.tgz -out /tmp/profile.tgz.enc
          rm -f /tmp/profile.tgz

      - name: Persist encrypted browser profile
        if: ${{ always() && env.STATE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: anthares-browser-profile-encrypted
          path: /tmp/profile.tgz.enc
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          docker rm -f anthares-browser >/dev/null 2>&1 || true
          sudo rm -rf /tmp/profile.tgz /tmp/profile.zip /tmp/profile-artifact "$PROFILE_DIR"
