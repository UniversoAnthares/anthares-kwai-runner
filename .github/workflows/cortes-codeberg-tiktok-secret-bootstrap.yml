name: Bootstrap TikTok Codeberg session secrets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-codeberg-tiktok-secret-bootstrap.yml'
      - 'tools/cortes_codeberg_tiktok_bootstrap.py'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: codeberg-tiktok-secret-bootstrap
  cancel-in-progress: false
jobs:
  transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      EXPECTED_TIKTOK_USERNAME: universo.anthares
      TIKTOK_LUCASROSALEM4_STORAGE_STATE: ${{ secrets.TIKTOK_LUCASROSALEM4_STORAGE_STATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify both TikTok identities and provision dedicated Codeberg session secrets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check requests cryptography playwright
          python -m playwright install --with-deps chromium
          python -m py_compile tools/cortes_codeberg_tiktok_bootstrap.py
          python -u tools/cortes_codeberg_tiktok_bootstrap.py
