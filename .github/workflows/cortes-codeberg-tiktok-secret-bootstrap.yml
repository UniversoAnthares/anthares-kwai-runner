name: Bootstrap TikTok Codeberg session secrets
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: codeberg-tiktok-secret-bootstrap
  cancel-in-progress: false
jobs:
  transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      EXPECTED_TIKTOK_USERNAME: universo.anthares
      TIKTOK_LUCASROSALEM4_STORAGE_STATE: ${{ secrets.TIKTOK_LUCASROSALEM4_STORAGE_STATE }}
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          python -m pip install -q requests cryptography playwright
          python -m playwright install chromium
          python -u tools/cortes_codeberg_tiktok_bootstrap.py
