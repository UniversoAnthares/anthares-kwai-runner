name: X actual installation and authentication proof
on:
  workflow_dispatch:
    inputs:
      x_apkm_url:
        description: 'Direct HTTPS URL to X APKM bundle (not an HTML page)'
        required: false
        type: string
      check_auth:
        description: 'Check existing encrypted authenticated session (never publish)'
        type: boolean
        default: false
  push:
    branches: [feature/x-native-live-android-bridge]
    paths: [.github/workflows/x-actual-proof.yml]
permissions:
  contents: read
jobs:
  proof:
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        include:
          - variant: 1
            api: 30
            arch: x86_64
            target: google_apis
            gpu: swiftshader_indirect
          - variant: 2
            api: 30
            arch: x86_64
            target: google_apis
            gpu: off
          - variant: 3
            api: 30
            arch: x86_64
            target: default
            gpu: swiftshader_indirect
          - variant: 4
            api: 30
            arch: x86_64
            target: default
            gpu: off
          - variant: 5
            api: 30
            arch: x86
            target: google_apis
            gpu: swiftshader_indirect
          - variant: 6
            api: 30
            arch: x86
            target: google_apis
            gpu: off
          - variant: 7
            api: 30
            arch: x86
            target: default
            gpu: swiftshader_indirect
          - variant: 8
            api: 30
            arch: x86
            target: default
            gpu: off
          - variant: 9
            api: 31
            arch: x86_64
            target: google_apis
            gpu: swiftshader_indirect
          - variant: 10
            api: 31
            arch: x86_64
            target: google_apis
            gpu: off
          - variant: 11
            api: 31
            arch: x86_64
            target: default
            gpu: swiftshader_indirect
          - variant: 12
            api: 31
            arch: x86_64
            target: default
            gpu: off
          - variant: 13
            api: 31
            arch: x86
            target: google_apis
            gpu: swiftshader_indirect
          - variant: 14
            api: 31
            arch: x86
            target: google_apis
            gpu: off
          - variant: 15
            api: 31
            arch: x86
            target: default
            gpu: swiftshader_indirect
          - variant: 16
            api: 31
            arch: x86
            target: default
            gpu: off
          - variant: 17
            api: 32
            arch: x86_64
            target: google_apis
            gpu: swiftshader_indirect
          - variant: 18
            api: 32
            arch: x86_64
            target: google_apis
            gpu: off
          - variant: 19
            api: 32
            arch: x86_64
            target: default
            gpu: swiftshader_indirect
          - variant: 20
            api: 32
            arch: x86_64
            target: default
            gpu: off
          - variant: 21
            api: 32
            arch: x86
            target: google_apis
            gpu: swiftshader_indirect
          - variant: 22
            api: 32
            arch: x86
            target: google_apis
            gpu: off
          - variant: 23
            api: 32
            arch: x86
            target: default
            gpu: swiftshader_indirect
          - variant: 24
            api: 32
            arch: x86
            target: default
            gpu: off
          - variant: 25
            api: 33
            arch: x86_64
            target: google_apis
            gpu: swiftshader_indirect
          - variant: 26
            api: 33
            arch: x86_64
            target: google_apis
            gpu: off
          - variant: 27
            api: 33
            arch: x86_64
            target: default
            gpu: swiftshader_indirect
          - variant: 28
            api: 33
            arch: x86_64
            target: default
            gpu: off
          - variant: 29
            api: 33
            arch: x86
            target: google_apis
            gpu: swiftshader_indirect
          - variant: 30
            api: 33
            arch: x86
            target: google_apis
            gpu: off
          - variant: 31
            api: 33
            arch: x86
            target: default
            gpu: swiftshader_indirect
