name: Threads local continuity and Neon sync contract
on:
  workflow_dispatch:
  push:
    branches:
      - fix/threads-continuity-guard-20261021
    paths:
      - 'tools/cortes_threads_continuity_guard.mjs'
      - 'tools/threads_primary_gate.mjs'
      - 'tests/threads_primary_gate.test.mjs'
      - 'tests/threads_continuity_guard.test.mjs'
      - 'infra/neon-cortes-threads-sync/**'
      - '.github/workflows/threads-continuity-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check tools/cortes_threads_continuity_guard.mjs
      - run: node --check infra/neon-cortes-threads-sync/index.mjs
      - run: node --test tests/threads_primary_gate.test.mjs tests/threads_continuity_guard.test.mjs tests/threads_neon_sync.test.mjs
