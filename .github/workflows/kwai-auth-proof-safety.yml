name: Kwai identity proof and credential safety
on:
  push:
    paths:
      - "kwai_auth_probe.py"
      - ".github/workflows/kwai-queue-publisher.yml"
      - "tests/test_kwai_auth_probe_syntax.py"
      - ".github/workflows/kwai-auth-proof-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_kwai_auth_probe_syntax.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_kwai_credential_safety.py' -v
      - run: python3 -m py_compile kwai_auth_probe.py tools/kwai_credential_login.py kwai_android_autologin.py
