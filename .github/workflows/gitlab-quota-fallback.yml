name: GitLab CI quota fallback - CORTES contracts
run-name: quota-rescue-cortes-glsha-${{ inputs.gitlab_sha || github.sha }} 
on:
  workflow_dispatch:
    inputs:
      gitlab_pipeline_id:
        type: string
        required: false
      gitlab_sha:
        type: string
        required: false
  schedule:
    - cron: '17 */12 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/gitlab-quota-fallback.yml']
permissions:
  contents: read
concurrency:
  group: gitlab-quota-fallback-kwai
  cancel-in-progress: false
jobs:
  gitlab-contract-tests:
    name: Validate GitLab CORTES code on independent GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download public GitLab canonical tests without GitLab runners
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --single-branch --branch main \
            https://gitlab.com/UniversoAnthares/anthares-kwai-runner.git source
          expected="${{ inputs.gitlab_sha }}"
          if [ -n "$expected" ]; then
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::INVALID_GITLAB_SHA"; exit 1; }
            if [ "$(git -C source rev-parse HEAD)" != "$expected" ]; then
              git -C source fetch --quiet --depth 1 origin "$expected"
              git -C source checkout --quiet --detach FETCH_HEAD
            fi
            test "$(git -C source rev-parse HEAD)" = "$expected" || { echo "::error::GITLAB_SOURCE_MISMATCH"; exit 1; }
          fi
          echo "GITLAB_SOURCE_SHA=$(git -C source rev-parse HEAD)"
      - name: Nonmutating Test Hub preflight
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 tools/test_hub_preflight.py
      - name: Validate lease only if an active lock exists
        shell: bash
        working-directory: source
        env:
          CI_PROJECT_PATH: UniversoAnthares/anthares-kwai-runner
          CI_COMMIT_REF_NAME: main
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, datetime, urllib.request
          url='https://gitlab.com/api/v4/projects/UniversoAnthares%2Fanthares-kwai-runner/repository/files/test-hub%2Flocks%2FUniversoAnthares--anthares-kwai-runner.json/raw?ref=main'
          try:
              with urllib.request.urlopen(url,timeout=12) as r:
                  lock=json.load(r)
          except Exception as exc:
              print('GITLAB_HUB_LOCK=UNVERIFIED_UNAVAILABLE',type(exc).__name__)
              raise SystemExit(0)
          expiry=datetime.datetime.fromisoformat(lock.get('lock_expires_utc','1970-01-01T00:00:00+00:00').replace('Z','+00:00'))
          if lock.get('status')=='RUNNING' and expiry>datetime.datetime.now(datetime.timezone.utc):
              import subprocess
              subprocess.run(['python3','tools/test_hub_lock.py'],check=True)
          else:
              print('GITLAB_HUB_LOCK=INACTIVE_NONMUTATING_CI')
          PY
      - name: Publisher safety and failover contracts
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 tools/test_provider_router.py
          python3 tools/test_kwai_publisher_infra_contract.py
          echo "CORTES_GITLAB_CI_GITHUB_BACKUP=PASS"
# Independent CI evidence only; does not acquire publishing authority or start posting.
