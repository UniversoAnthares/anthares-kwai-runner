name: Kwai Stabilization Probe
on:
  workflow_dispatch:
  push:
    paths: ['.stabilize-probe-trigger']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [wait10, wait30, wait60, wifi-reset, airplane-cycle, restart-after-nav, network-check, resource-wait, profile-after-wait, profile-after-restart]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STABILIZE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL --retry 3 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          mkdir -p kwai-vault && unzip -q kwai-vault.zip -d kwai-vault
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 300
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            bash kwai_vault_install.sh
            adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            sleep 8
            python3 kwai_stabilize_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilize-${{ matrix.mode }}-${{ github.run_id }}
          path: |
            advance-*.xml
            advance-*.png
            final-*.xml
            final-*.png
            kwai-vault-install-status.txt
          if-no-files-found: warn
          retention-days: 1
