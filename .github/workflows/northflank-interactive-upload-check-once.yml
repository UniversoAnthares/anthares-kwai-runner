name: One-time TikTok Studio SPA upload navigation from authenticated Posts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-interactive-upload-check-once.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Reach upload from authenticated Studio SPA without selecting file
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN,auth=process.env.ARA_SHARED;
          if(!token||token.length<20||!auth||auth.length<20)throw Error('AUTH_MISSING');
          const root='https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run';
          async function api(method,path,body){
           const headers={Authorization:'Bearer '+auth,Accept:'application/json'};
           if(body!==undefined)headers['Content-Type']='application/json';
           const r=await fetch(root+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(32000)});
           return {code:r.status,data:await r.json().catch(()=>({}))};
          }
          const health=await api('GET','/health');
          console.log('OWNER_VERIFIED='+Boolean(health.data.identity_verified));
          if(health.code!==200||!health.data.identity_verified||!health.data.ready_for_tiktok)throw Error('AUTH_NOT_READY');
          let status=await api('GET','/interactive-browser/status');
          console.log('BROWSER_ACTIVE_INITIAL='+Boolean(status.data.active));
          if(!status.data.active||!status.data.responsive){
           const start=await api('POST','/interactive-browser/start-async',{});
           console.log('START_BROWSER_HTTP='+start.code);
           if(start.code>=400||!start.data.ok)throw Error('START_REJECTED');
           for(let n=0;n<15;n++){
            await new Promise(r=>setTimeout(r,4500));
            status=await api('GET','/interactive-browser/status');
            if(status.code===200&&status.data.active&&status.data.responsive)break;
           }
          }
          console.log('BROWSER_RESPONSIVE='+Boolean(status.data.responsive));
          if(!status.data.active||!status.data.responsive)throw Error('BROWSER_UNRESPONSIVE');
          const nav=await api('POST','/interactive-browser/navigate',{url:'https://www.tiktok.com/tiktokstudio/content'});
          console.log('STUDIO_CONTENT_NAV_HTTP='+nav.code);
          if(nav.code!==200||!nav.data.ok)throw Error('STUDIO_CONTENT_NAV_FAILED');
          await new Promise(r=>setTimeout(r,13000));
          const get=async path=>{const r=await fetch('https://api.northflank.com/v1'+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('NF_'+r.status);return r.json()};
          const found=[];for(const p of (await get('/projects')).data?.projects||[])for(const s of (await get('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[])if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);
          if(found.length!==1)throw Error('SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0],ctx=new ApiClientInMemoryContextProvider();await ctx.addContext({name:'spa',token});const cli=new ApiClient(ctx);
          const script=String.raw`
          import sys,time,json
          sys.path.insert(0,'/app/render-tiktok-worker')
          from browser_executor import _cdp
          def read(expr):
           r=_cdp('Runtime.evaluate',{'expression':expr,'returnByValue':True},timeout=13)
           if 'exceptionDetails' in r:raise RuntimeError('CDP_EVALUATION_EXCEPTION')
           return (r.get('result') or {}).get('value') or {}
          before=read(r"""(()=>{const b=document.body?.innerText||'';return {path:location.pathname,ready:document.readyState,body:b.length,anchors:[...document.querySelectorAll('a')].filter(e=>/upload|carregar|enviar v/i.test((e.innerText||'')+' '+(e.getAttribute('href')||''))).slice(0,6).map(e=>({label:(e.innerText||'').trim().slice(0,55),href:(e.getAttribute('href')||'').slice(0,120)}))}})()""")
          print('STUDIO_BEFORE='+json.dumps(before,ensure_ascii=False)[:1500],flush=True)
          if before.get('path')!='/tiktokstudio/content':raise SystemExit('NOT_ON_STUDIO_CONTENT')
          click=read(r"""(()=>{const all=[...document.querySelectorAll('a,button,[role=button]')];const eligible=all.filter(e=>/upload|carregar v[ií]deo|enviar v[ií]deo/i.test((e.innerText||'').trim()+' '+(e.getAttribute('aria-label')||'')+' '+(e.getAttribute('href')||'')));const el=eligible.find(e=>(e.getAttribute('href')||'').includes('/upload'))||eligible[0];if(!el)return {clicked:false,options:eligible.length};const name=(el.innerText||el.getAttribute('aria-label')||'').trim().slice(0,45);const href=(el.getAttribute('href')||'').slice(0,120);el.click();return {clicked:true,name,href,count:eligible.length}})()""")
          print('STUDIO_UPLOAD_CLICK='+json.dumps(click,ensure_ascii=False)[:1000],flush=True)
          if not click.get('clicked'):raise SystemExit('NO_UPLOAD_NAV_LINK')
          time.sleep(15)
          after=read(r"""(()=>{const b=document.body?.innerText||'';const el=document.documentElement;const root=document.querySelector('#root,#app,[id*=root]');const style=getComputedStyle(document.body);return {path:location.pathname,ready:document.readyState,html:el.outerHTML.length,text:b.length,textContent:document.body?.textContent?.length||0,uploadInputs:document.querySelectorAll('input[type=file]').length,buttons:document.querySelectorAll('button').length,scripts:document.scripts.length,visibility:style.visibility,display:style.display,root:root?.innerHTML.length||0,captcha:/captcha|verify to continue|security check/i.test(b),login:/log in|sign in|fazer login/i.test(b)}})()""")
          print('STUDIO_AFTER_SPA_CLICK='+json.dumps(after,ensure_ascii=False)[:1300],flush=True)
          print('NO_VIDEO_SELECTED_OR_POSTED=1',flush=True)
          `;
          const r=await cli.exec.execServiceCommand({projectId,serviceId},{command:['timeout','65s','python3','-c',script]});
          console.log('SPA_UPLOAD_EXIT='+String(r.commandResult?.exitCode));
          console.log('SPA_UPLOAD_OUTPUT='+String(r.stdOut||'').slice(0,4800).replace(/[\r\n]+/g,' | '));
          if(r.commandResult?.exitCode!==0)throw Error('SPA_UPLOAD_PROBE_UNCONFIRMED');
          console.log('NO_VIDEO_SELECTED_OR_POSTED=1');
          
          NODE
