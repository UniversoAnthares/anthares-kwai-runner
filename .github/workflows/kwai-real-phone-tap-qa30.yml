name: Kwai Phone Transition Forensics QA30
on:
  workflow_dispatch:
  push:
    paths: ['.kwai-phone-transition-forensics30-trigger']
permissions: {contents: read}
jobs:
  phone30:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch vault
        run: |
          curl -fL --retry 3 -o /tmp/v.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  /tmp/v.zip" | sha256sum -c -
          mkdir -p /tmp/v && python3 -c "import zipfile;zipfile.ZipFile('/tmp/v.zip').extractall('/tmp/v')"
      - name: Android Phone 30-way
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 300
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 4096
          script: |
            adb install-multiple -r /tmp/v/*.apk
            adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p com.kwai.video 1 >/dev/null
            sleep 10
            python3 kwai_state_driver.py
            python3 - <<'PY'
            import subprocess,time,re,xml.etree.ElementTree as ET
            def a(*x):return subprocess.run(["adb",*x],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True).stdout
            def d():
              a("shell","uiautomator","dump","/sdcard/q.xml");x=a("shell","cat","/sdcard/q.xml")
              try:return ET.fromstring(x)
              except:return None
            def lab(n):return (n.attrib.get("text","")+" "+n.attrib.get("content-desc","")).strip().lower()
            def c(n):
              z=[int(x) for x in re.findall(r"\d+",n.attrib.get("bounds",""))]
              return ((z[0]+z[2])//2,(z[1]+z[3])//2) if len(z)==4 else None
            r=d();ns=list(r.iter("node"));login=next((n for n in ns if lab(n) in ("log in","login","sign in","entrar")),None)
            if login and c(login):x,y=c(login);a("shell","input","tap",str(x),str(y));time.sleep(3)
            r=d();ns=list(r.iter("node"));phone=next((n for n in ns if any(k in lab(n) for k in ("phone","telefone","mobile"))),None)
            if phone is None:raise SystemExit("PHONE30_REAL_NODE_MISSING")
            x,y=c(phone); print("PHONE30_REAL_CENTER",x,y)
            # 30 reversible transition probes: semantic click + node ancestry + bounded coordinates + waits.
            # No credentials or OTP are entered.
            def nodes():
              q=d(); return (q,list(q.iter("node"))) if q is not None else (None,[])
            def snap(tag):
              q,nn=nodes(); txt=" ".join(lab(n) for n in nn)
              act=a("shell","dumpsys","activity","activities")
              win=a("shell","dumpsys","window","windows")
              print(tag+"_ACT="+ " | ".join([z.strip() for z in act.splitlines() if "mResumedActivity" in z or "topResumedActivity" in z])[-700:])
              print(tag+"_WIN="+ " | ".join([z.strip() for z in win.splitlines() if "mCurrentFocus" in z or "mFocusedApp" in z])[-700:])
              print(tag+"_WEBVIEW="+str(any("webview" in n.attrib.get("class","").lower() for n in nn)))
              print(tag+"_EDITS="+str(sum(n.attrib.get("editable")=="true" or n.attrib.get("class","").endswith("EditText") for n in nn)))
              print(tag+"_UI="+txt[-700:])
              return txt,nn
            strategies=[]
            # Semantic selectors first.
            strategies += [("text_phone",["shell","input","tap",str(x),str(y)])]
            # Geometry around exact node, with different settle times.
            for wait in (1,2,3,5,8):
              for dx,dy in ((0,0),(-90,0),(90,0),(0,-45),(0,45)):
                strategies.append((f"geo_{dx}_{dy}_w{wait}",["shell","input","tap",str(x+dx),str(y+dy),wait]))
            # Long press variants can expose a distinct clickable parent without submitting anything.
            for ms in (100,300,600,900):
              strategies.append((f"swipe_hold_{ms}",["shell","input","swipe",str(x),str(y),str(x),str(y),str(ms)]))
            for i,(name,cmd) in enumerate(strategies[:30],1):
              # Re-open auth surface fresh for every probe.
              q,nn=nodes(); qt=" ".join(lab(n) for n in nn)
              if "welcome to kwai" not in qt:
                for _ in range(3):
                  a("shell","input","keyevent","4");time.sleep(1)
                  q,nn=nodes();qt=" ".join(lab(n) for n in nn)
                  if "welcome to kwai" in qt: break
              if "welcome to kwai" not in qt:
                lg=next((n for n in nn if lab(n) in ("log in","login","sign in","entrar")),None)
                if lg and c(lg): lx,ly=c(lg);a("shell","input","tap",str(lx),str(ly));time.sleep(2)
              q,nn=nodes(); ph=next((n for n in nn if any(k in lab(n) for k in ("phone","telefone","mobile"))),None)
              if ph and c(ph): x,y=c(ph)
              realcmd=cmd[:-1] if name.startswith("geo_") else cmd
              wait=int(cmd[-1]) if name.startswith("geo_") else 3
              a(*realcmd);time.sleep(wait)
              txt,nn=snap(f"TRANS30_{i:02d}_{name}")
              edits=sum(n.attrib.get("editable")=="true" or n.attrib.get("class","").endswith("EditText") for n in nn)
              if edits or any(k in txt for k in ("phone number","verification code","get code","send code","country code")):
                print("TRANS30_WINNER="+str(i));print("SUCCESS_SIGNAL=PHONE_TRANSITION_REACHED");raise SystemExit(0)
            print("FAILURE_SIGNAL=PHONE_TRANSITION30_EXHAUSTED");raise SystemExit(46)
            PY
