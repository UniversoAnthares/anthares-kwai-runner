name: TikTok Canary Caption Piped Probe

on:
  push:
    branches: [main]
    paths:
      - '.tiktok-canary-caption-piped-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captions:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch subtitle metadata and payload through Piped APIs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/canary-subs
          mkdir -p /tmp/canary-subs
          python3 - <<'PY'
          import html, json, re, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path

          video='a4w8KAOxANc'
          apis=[
              'https://pipedapi.kavin.rocks',
              'https://pipedapi.leptons.xyz',
              'https://pipedapi.nosebs.ru',
              'https://api-piped.mha.fi',
              'https://piped-api.garudalinux.org',
          ]
          headers={'User-Agent':'Mozilla/5.0 AntharesCaptionPiped/1.0','Accept':'application/json,text/vtt,application/ttml+xml,*/*'}
          root=Path('/tmp/canary-subs')
          out=root/'piped.pt.vtt'

          def get(url,timeout=25):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return int(getattr(r,'status',200)), r.headers.get('content-type',''), r.read()

          def clock(v):
              s=str(v or '').strip()
              if not s: return 0.0
              if s.endswith('ms'):
                  return float(s[:-2])/1000
              if s.endswith('s'):
                  return float(s[:-1])
              parts=s.replace(',','.').split(':')
              if len(parts)==3:
                  return int(parts[0])*3600+int(parts[1])*60+float(parts[2])
              return float(s)

          def ttml_to_vtt(text):
              tree=ET.fromstring(text)
              rows=[]
              for el in tree.iter():
                  if el.tag.rsplit('}',1)[-1] != 'p': continue
                  begin=el.attrib.get('begin')
                  end=el.attrib.get('end')
                  dur=el.attrib.get('dur')
                  try: a=clock(begin)
                  except Exception: continue
                  try: b=clock(end) if end else a+clock(dur or '2s')
                  except Exception: b=a+2
                  txt=re.sub(r'\s+',' ',html.unescape(''.join(el.itertext()))).strip()
                  if txt: rows.append((a,max(a+.2,b),txt))
              if not rows: return None
              def hms(x):
                  ms=int(round(x*1000)); h=ms//3600000; ms%=3600000; m=ms//60000; ms%=60000; s=ms//1000; ms%=1000
                  return f'{h:02d}:{m:02d}:{s:02d}.{ms:03d}'
              v=['WEBVTT','']
              for i,(a,b,t) in enumerate(rows,1):
                  v += [str(i),f'{hms(a)} --> {hms(b)}',t,'']
              return '\n'.join(v)

          for api in apis:
              host=urllib.parse.urlparse(api).netloc
              try:
                  code,ct,body=get(f'{api}/streams/{video}')
                  print(json.dumps({'api':host,'stage':'streams','http':code,'bytes':len(body),'content_type':ct},sort_keys=True))
                  data=json.loads(body.decode('utf-8','replace')) if body else {}
                  subs=data.get('subtitles') if isinstance(data,dict) else None
                  if not isinstance(subs,list):
                      print(json.dumps({'api':host,'stage':'subtitle_metadata','count':0},sort_keys=True)); continue
                  safe=[]
                  for s in subs:
                      if not isinstance(s,dict): continue
                      safe.append({'code':s.get('code'),'name':s.get('name'),'autoGenerated':s.get('autoGenerated'),'mimeType':s.get('mimeType'),'has_url':bool(s.get('url'))})
                  print(json.dumps({'api':host,'stage':'subtitle_metadata','count':len(safe),'tracks':safe[:12]},sort_keys=True,ensure_ascii=False))
                  ranked=[]
                  for s in subs:
                      if not isinstance(s,dict) or not s.get('url'): continue
                      lang=str(s.get('code') or '').lower()
                      rank=0 if lang in ('pt','pt-br') else 1 if lang.startswith('pt') else 2
                      ranked.append((rank,0 if s.get('autoGenerated') else 1,s))
                  ranked.sort(key=lambda x:(x[0],x[1]))
                  for _,__,s in ranked[:10]:
                      url=str(s.get('url'))
                      if url.startswith('/'):
                          url=api+url
                      try:
                          c2,ct2,b2=get(url,30)
                          tx=b2.decode('utf-8','replace')
                          is_vtt=tx.lstrip().startswith('WEBVTT')
                          print(json.dumps({'api':host,'stage':'subtitle_payload','code':s.get('code'),'name':s.get('name'),'mime':s.get('mimeType'),'http':c2,'bytes':len(b2),'vtt':is_vtt},sort_keys=True,ensure_ascii=False))
                          if is_vtt and len(tx)>200:
                              out.write_text(tx,encoding='utf-8')
                              print('PIPED_CAPTION_SUCCESS='+host)
                              raise SystemExit(0)
                          if len(tx)>200 and ('<tt' in tx or '<p' in tx):
                              try: converted=ttml_to_vtt(tx)
                              except Exception: converted=None
                              if converted and len(converted)>200:
                                  out.write_text(converted,encoding='utf-8')
                                  print('PIPED_TTML_CONVERTED='+host)
                                  raise SystemExit(0)
                      except Exception as exc:
                          print(json.dumps({'api':host,'stage':'subtitle_payload_error','type':type(exc).__name__},sort_keys=True))
              except Exception as exc:
                  print(json.dumps({'api':host,'stage':'streams_error','type':type(exc).__name__},sort_keys=True))
          raise SystemExit('NO_PIPED_CAPTION_PATH')
          PY
      - name: Rank continuous candidates
        run: python3 tools/tiktok_rank_vtt.py /tmp/canary-subs
