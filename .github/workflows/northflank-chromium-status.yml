name: Northflank Chromium rollout status
on:
  push:
    paths:
      - .github/workflows/northflank-chromium-status.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Inspect service and revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ['NORTHFLANK_API_TOKEN']; shared=os.environ['ARA_SHARED']
          api='https://api.northflank.com/v1'; h={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def get(path):
            with urllib.request.urlopen(urllib.request.Request(api+path,headers=h),timeout=30) as r:return json.loads(r.read().decode() or '{}')
          ps=(get('/projects').get('data') or {}).get('projects') or []
          if isinstance(ps,dict):ps=list(ps.values())
          pid=next(p.get('id') for p in ps if p.get('name')=='Default')
          ss=(get(f'/projects/{pid}/services').get('data') or {}).get('services') or []
          if isinstance(ss,dict):ss=list(ss.values())
          s=next(x for x in ss if x.get('name')=='anthares-tiktok-northflank')
          sid=s.get('id') or 'anthares-tiktok-northflank'
          d=(get(f'/projects/{pid}/services/{sid}').get('data') or {})
          status=d.get('status') or s.get('status') or {}
          ports=(get(f'/projects/{pid}/services/{sid}/ports').get('data') or {}).get('ports') or []
          public=next((p for p in ports if p.get('public') and p.get('dns')),None)
          print(json.dumps({'service_id':sid,'build':status.get('build'),'deployment':status.get('deployment'),'billing':d.get('billing'),'instances':d.get('deployment',{}).get('instances')},default=str,sort_keys=True))
          if public:
            url='https://'+public['dns']+'/interactive-browser/revision'
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+shared})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:print('REVISION_HTTP='+str(r.status));print(r.read().decode())
            except urllib.error.HTTPError as e:print('REVISION_HTTP='+str(e.code));print(e.read().decode()[:500])
          PY
