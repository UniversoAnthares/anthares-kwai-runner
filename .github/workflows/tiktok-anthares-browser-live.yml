name: TikTok Anthares Browser Live Recovery
# Generate owner-only Cloudflare live view for correct account authentication.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tiktok-anthares-browser-live.yml'

permissions:
  contents: read

concurrency:
  group: tiktok-anthares-browser-live
  cancel-in-progress: true

jobs:
  mint-live-view:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Derive reserve API token without exposing it
        env:
          ANTHARES_RESERVA_TOKEN: ${{ secrets.ANTHARES_RESERVA_TOKEN }}
          ARA_SHARED: ${{ secrets.ARA_SHARED }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHARES_RESERVA_TOKEN:-}" ]; then
            token="$ANTHARES_RESERVA_TOKEN"
          else
            test -n "${ARA_SHARED:-}"
            token="$(python3 - <<'PY'
          import hashlib, os
          print(hashlib.sha256(('anthares-reserva-browser-v1:'+os.environ['ARA_SHARED']).encode()).hexdigest())
          PY
          )"
          fi
          echo "::add-mask::$token"
          printf 'RESERVE_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Mint TikTok Live View
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 40 -o /tmp/live.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RESERVE_TOKEN" \
            https://anthares-reserva-browser.anthares1.workers.dev/tiktok/session/live \
            )"
          echo "LIVE_HTTP=$code"
          python3 - <<'PY'
          import json
          raw=open('/tmp/live.json', encoding='utf-8',errors='replace').read()
          try: d=json.loads(raw)
          except json.JSONDecodeError:
              print('LIVE_RESPONSE_PREFIX='+raw[:260].replace('\\n',' '))
              raise SystemExit('ANTHARES_BROWSER_NON_JSON_UPSTREAM')
          if d.get('ok') is not True:
              print('LIVE_ERROR='+str(d.get('error') or '')[:120])
              print('LIVE_DETAIL='+str(d.get('detail') or '')[:180])
              raise SystemExit('ANTHARES_BROWSER_LIVE_UNAVAILABLE')
          url=d.get('live_view_url') or ''
          assert url.startswith('https://'), d
          open('/tmp/anthares-tiktok-live-url.txt','w',encoding='utf-8').write(url+'\n')
          print('ANTHARES_TIKTOK_SESSION_REUSED='+str(bool(d.get('reused'))).lower())
          print('ANTHARES_TIKTOK_LIVE_ARTIFACT_READY=1')
          PY
      - name: Upload private live URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: anthares-tiktok-live-url
          path: /tmp/anthares-tiktok-live-url.txt
          retention-days: 1
          if-no-files-found: error
