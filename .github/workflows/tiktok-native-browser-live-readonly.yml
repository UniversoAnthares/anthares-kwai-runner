name: TikTok Native LIVE Browser Surface (read-only)
on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/tiktok-live-authorized-cloud-*'
    paths:
      - '.github/workflows/tiktok-native-browser-live-readonly.yml'
      - 'tools/tiktok_native_browser_readonly_probe.py'
permissions:
  contents: read
concurrency:
  group: tiktok-native-browser-live-surface-readonly
  cancel-in-progress: false
jobs:
  test-native-browser-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      TIKTOK_LUCASROSALEM4_STORAGE_STATE: ${{ secrets.TIKTOK_LUCASROSALEM4_STORAGE_STATE }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private read-only browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q playwright requests cryptography
          command -v google-chrome >/dev/null
          echo NATIVE_TIKTOK_BROWSER_RUNTIME_READY=1
      - name: Check native TikTok LIVE without initiating or ending any stream
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tiktok_native_browser_readonly_probe.py
      - name: Test virtual video/audio camera locally in cloud Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,threading
          from http.server import HTTPServer,BaseHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type','text/html')
                  self.end_headers()
                  self.wfile.write(b'<!doctype html><title>Cloud AV camera diagnostic</title><video autoplay muted playsinline></video>')
              def log_message(self,*args):pass
          server=HTTPServer(('127.0.0.1',0),Handler)
          thread=threading.Thread(target=server.serve_forever,daemon=True);thread.start()
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(channel='chrome',headless=True,args=[
                      '--no-sandbox','--use-fake-device-for-media-stream',
                      '--use-fake-ui-for-media-stream'])
                  try:
                      ctx=browser.new_context(permissions=['camera','microphone'])
                      page=ctx.new_page()
                      page.goto('http://127.0.0.1:'+str(server.server_port))
                      result=page.evaluate('''async () => {
                        try {
                          const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
                          const el=document.querySelector('video');el.srcObject=s;
                          await new Promise(r=>setTimeout(r,1500));
                          const out={video:s.getVideoTracks().length,
                                     audio:s.getAudioTracks().length,
                                     width:el.videoWidth,
                                     height:el.videoHeight};
                          s.getTracks().forEach(x=>x.stop());
                          return out;
                        } catch(e) {return {error:e.name}}
                      }''')
                      good=result.get('video')==1 and result.get('audio')==1 and result.get('width',0)>0
                      print('NATIVE_TIKTOK_BROWSER_CLOUD_CAMERA_AUDIO='+('PROVEN' if good else 'UNAVAILABLE'),flush=True)
                      print('NATIVE_TIKTOK_BROWSER_CAMERA_DETAIL='+json.dumps(result,separators=(',',':')),flush=True)
                      if not good:raise SystemExit(2)
                  finally:browser.close()
          finally:server.shutdown()
          PY
