name: One-time TikTok fast owner identity validator Northflank hotpatch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-owner-fast-validator-once.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Update isolated TikTok session verifier without restarting Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN;if(!token||token.length<20)throw Error('NF_TOKEN_MISSING');
          const get=async(p)=>{const r=await fetch('https://api.northflank.com/v1'+p,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('NF_HTTP_'+r.status);return r.json();};
          const found=[];for(const p of (await get('/projects')).data?.projects||[])for(const s of (await get('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[])if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);
          if(found.length!==1)throw Error('SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0],cp=new ApiClientInMemoryContextProvider();await cp.addContext({name:'patch',token});
          const api=new ApiClient(cp);
          const script=String.raw`
          import os,base64,hashlib
          from pathlib import Path
          p=Path("/app/tiktok_worker.py")
          v=base64.b64decode("")
          def gitblob(x):return hashlib.sha1(b"blob "+str(len(x)).encode()+b"\0"+x).hexdigest()
          if not p.exists():raise SystemExit("TIKTOK_WORKER_MISSING")
          existing=p.read_bytes()
          current=gitblob(existing)
          if current not in ("45763d952c50deb2317c8365bfa5a20117ec93fb","669c500151c46f51a4f13c06667b588a6cf66f8f"):raise SystemExit("TIKTOK_WORKER_SOURCE_DRIFT_SAFE_STOP")
          compile(v.decode("utf-8"),str(p),"exec")
          if current!="669c500151c46f51a4f13c06667b588a6cf66f8f":
           b=Path("/tmp/anthares-tiktok-worker-before-owner-http.py")
           if not b.exists():b.write_bytes(existing);os.chmod(b,0o600)
           if b.read_bytes()!=existing:raise SystemExit("WORKER_BACKUP_CONFLICT")
           temp=p.with_suffix(".owner-http.tmp")
           temp.write_bytes(v);os.chmod(temp,0o644);os.replace(temp,p)
          print("FAST_OWNER_HTTP_VERIFIER_INSTALLED="+str(gitblob(p.read_bytes())=="669c500151c46f51a4f13c06667b588a6cf66f8f"),flush=True)
          print("GUNICORN_RELOAD_NOT_NEEDED=1",flush=True)
          `;
          const result=await api.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',script]});
          console.log('PATCH_EXIT='+String(result.commandResult?.exitCode));
          console.log('PATCH_OUTPUT='+String(result.stdOut||'').trim().slice(0,700).replace(/[\r\n]+/g,' | '));
          if(result.commandResult?.exitCode!==0)throw Error('SAFE_PATCH_FAILED');
          NODE
