name: CORTES Buffer LinkedIn adapter contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "social_adapters/buffer_linkedin.py"
      - "tests/test_buffer_linkedin.py"
      - "anthares_publisher/editorial.py"
      - ".github/workflows/cortes-buffer-linkedin-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static compile
        run: python -m py_compile social_adapters/buffer_linkedin.py tests/test_buffer_linkedin.py
      - name: Network-free Buffer adapter checks
        run: python -m unittest discover -s tests -p test_buffer_linkedin.py -v
      - name: Existing universal editorial contract
        run: python -m unittest discover -s tests -p test_media_model.py -v
