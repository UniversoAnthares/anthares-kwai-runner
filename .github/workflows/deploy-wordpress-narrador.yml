name: Deploy WordPress Narrador

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-wordpress-narrador.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.ANTHARES_QA_SSH_KEY }}
      SSH_HOST: ${{ secrets.ANTHARES_QA_SSH_HOST }}
      SSH_USER: ${{ secrets.ANTHARES_QA_SSH_USER }}
      SSH_PORT: ${{ secrets.ANTHARES_QA_SSH_PORT }}
    steps:
      - name: Deploy narrador from private repository checkout on server
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/anthares_deploy
          chmod 600 ~/.ssh/anthares_deploy
          ssh-keyscan -p "${SSH_PORT:-65002}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "${SSH_PORT:-65002}" -i ~/.ssh/anthares_deploy "$SSH_USER@$SSH_HOST" '
            set -e
            cd ~/anthares-wordpress-bootstrap
            git fetch origin main
            git reset --hard origin/main
            php -l anthares-post-narrador/anthares-post-narrador.php
            rsync -a --delete --exclude="*.log" --exclude="*.tmp" anthares-post-narrador/ ~/domains/anthares.us/public_html/wp-content/plugins/anthares-post-narrador/
            grep -n "Version:" ~/domains/anthares.us/public_html/wp-content/plugins/anthares-post-narrador/anthares-post-narrador.php | head -1
            grep -n "cleanSpeechText" ~/domains/anthares.us/public_html/wp-content/plugins/anthares-post-narrador/assets/js/narrador.js | head -1
          '
