name: CORTES TikTok @lucasrosalem4 daily source manifest
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'tools/cortes_tiktok_lucasrosalem4_manifest.py'
      - 'tests/test_cortes_tiktok_lucasrosalem4_manifest.py'
      - '.github/workflows/cortes-tiktok-lucasrosalem4-manifest.yml'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: cortes-tiktok-lucasrosalem4-source-manifest
  cancel-in-progress: false
jobs:
  manifest:
    # Branch dispatch validates the isolated code. Neon OIDC only accepts main.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated read-only Neon manifest contract
        shell: bash
        run: |
          python -B -m unittest discover -s tests -p test_cortes_tiktok_lucasrosalem4_manifest.py -v
      - name: Read and validate canonical Neon source without local persistence
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python -B -u tools/cortes_tiktok_lucasrosalem4_manifest.py
