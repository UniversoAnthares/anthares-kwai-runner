name: Anthares Reserva Public Executor

on:
  workflow_dispatch:
  push:
    branches: [feature/anthares-reserva-ci]
    paths:
      - '.github/workflows/anthares-reserva-public-executor.yml'
      - 'anthares-reserva-browser/**'

permissions:
  contents: read

concurrency:
  group: anthares-reserva-public-executor
  cancel-in-progress: true

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONTROL: ${{ secrets.ANTHARES_CONTROL_TOKEN }}
      GLKEY: ${{ secrets.GITLAB_STATE_KEY }}
      GLTOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Prove hosted capacity without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          echo GITHUB_PUBLIC_HOSTED_RUNNER=READY
          awk '/MemTotal/{print "MEM_KB=" $2}' /proc/meminfo
          echo HAS_CLOUDFLARE_API_TOKEN=$([ -n "$CLOUDFLARE_API_TOKEN" ] && echo 1 || echo 0)
          echo HAS_ANTHARES_CONTROL_TOKEN=$([ -n "$CONTROL" ] && echo 1 || echo 0)
          echo HAS_GITLAB_STATE_KEY=$([ -n "$GLKEY" ] && echo 1 || echo 0)
          echo HAS_GITLAB_TOKEN=$([ -n "$GLTOKEN" ] && echo 1 || echo 0)
          curl -fsSI --max-time 20 https://www.kwai.com/ >/dev/null
          echo KWAI_NETWORK=READY
      - name: Deploy Cloudflare fallback
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cd anthares-reserva-browser
          npm install --no-audit --no-fund
          npx wrangler deploy
      - name: Prove API and migrated Kwai authentication
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://anthares-reserva-browser.anthares1.workers.dev'
          sleep 25
          curl -fsS --max-time 30 "$BASE/health" -o /tmp/reserva-health.json
          python -c 'import json; d=json.load(open("/tmp/reserva-health.json")); assert d.get("ok") is True, d; print("RESERVA_HEALTH=PASS")'
          code=$(curl -sS --max-time 70 -o /tmp/reserva-auth.json -w '%{http_code}' "$BASE/_auth_selftest" || true)
          python - "$code" <<'PY'
          import json,sys
          code=sys.argv[1]
          d=json.load(open('/tmp/reserva-auth.json'))
          safe={k:d.get(k) for k in ('ok','capsule_decrypted','cookie_count','identity_verified','upload_surface_verified','session_state','evidence','studio','error') if k in d}
          print('RESERVA_AUTH_HTTP='+code)
          print('RESERVA_AUTH_DIAGNOSTIC='+json.dumps(safe,separators=(',',':')))
          assert d.get('capsule_decrypted') is True or d.get('error')
          PY
          rm -f /tmp/reserva-health.json /tmp/reserva-auth.json
