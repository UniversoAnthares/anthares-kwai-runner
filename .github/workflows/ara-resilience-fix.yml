name: ARA transient-outage resilience patch

on:
  push:
    branches:
      - feature/anthares-remote-agent
    paths:
      - '.github/workflows/ara-resilience-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Patch the agent and validate it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('anthares-remote-agent/cmd/agent/main.go')
          s = p.read_text()
          old = "\tgo heartbeatLoop(cfg)\n\t// Replay previously persisted results before leasing new work.\n\tif err := replayEncryptedResults(cfg); err != nil {\n\t\tfmt.Fprintln(os.Stderr, \"pending result replay error:\", err)\n\t\tos.Exit(1)\n\t}\n"
          new = "\tgo heartbeatLoop(cfg)\n\t// A transient control-plane outage must not terminate the agent. Keep any\n\t// encrypted pending results on disk and retry them while the process stays up.\n\tif err := replayEncryptedResults(cfg); err != nil {\n\t\tfmt.Fprintln(os.Stderr, \"pending result replay deferred:\", err)\n\t}\n\tgo resultReplayLoop(cfg)\n"
          if old not in s:
              raise SystemExit('startup replay block not found')
          s = s.replace(old, new, 1)
          old = "\t\t\tif err := postResultRetry(cfg, result); err != nil {\n\t\t\t\t// Keep the encrypted pending file for replay on next start.\n\t\t\t\tfmt.Fprintf(os.Stderr, \"fatal result upload error job=%s: %v\\n\", result.ID, err)\n\t\t\t\tos.Exit(1)\n\t\t\t}\n\t\t\tif err := os.Remove(filepath.Join(resultSpoolDir(cfg), result.ID+\".pending\")); err != nil {\n\t\t\t\tfmt.Fprintf(os.Stderr, \"fatal result cleanup error job=%s: %v\\n\", result.ID, err)\n\t\t\t\tos.Exit(1)\n\t\t\t}\n"
          new = "\t\t\tif err := postResultRetry(cfg, result); err != nil {\n\t\t\t\t// Keep the encrypted pending file and retry it in the background.\n\t\t\t\tfmt.Fprintf(os.Stderr, \"result upload deferred job=%s: %v\\n\", result.ID, err)\n\t\t\t\treturn\n\t\t\t}\n\t\t\tif err := os.Remove(filepath.Join(resultSpoolDir(cfg), result.ID+\".pending\")); err != nil {\n\t\t\t\t// Replaying an acknowledged result is idempotent at the control plane.\n\t\t\t\tfmt.Fprintf(os.Stderr, \"result cleanup deferred job=%s: %v\\n\", result.ID, err)\n\t\t\t}\n"
          if old not in s:
              raise SystemExit('result delivery block not found')
          s = s.replace(old, new, 1)
          marker = "func heartbeat(cfg Config) error {"
          insert = "func resultReplayLoop(cfg Config) {\n\tticker := time.NewTicker(15 * time.Second)\n\tdefer ticker.Stop()\n\tfor range ticker.C {\n\t\tif err := replayEncryptedResults(cfg); err != nil {\n\t\t\tfmt.Fprintln(os.Stderr, \"pending result replay deferred:\", err)\n\t\t}\n\t}\n}\n\n"
          if marker not in s:
              raise SystemExit('heartbeat marker not found')
          s = s.replace(marker, insert + marker, 1)
          s = s.replace('AntharesRemoteAgent/0.3"', 'AntharesRemoteAgent/0.3.1"', 1)
          s = s.replace('"version": "0.3.0"', '"version": "0.3.1"', 1)
          p.write_text(s)
          PY
          cd anthares-remote-agent
          gofmt -w cmd/agent/main.go
          go test ./... -count=1
          go vet ./...
      - name: Commit resilient agent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anthares-remote-agent/cmd/agent/main.go
          git commit -m 'fix(ara): keep agent online across transient result upload failures'
          git push origin HEAD:feature/anthares-remote-agent
