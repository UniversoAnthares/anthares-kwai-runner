name: CORTES LinkedIn personal - one-shot approved readback dispatch
on:
  push:
    branches: [main]
    paths:
      - test-hub/requests/20261024-linkedin-personal-reconcile-only.trigger
permissions:
  contents: read
  actions: write
concurrency:
  group: cortes-linkedin-personal-reconcile-dispatch-20261024
  cancel-in-progress: false
jobs:
  dispatch-readback-only:
    if: github.repository == 'UniversoAnthares/anthares-kwai-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Dispatch canonical readback-only workflow (never upload)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cortes-linkedin-personal-cloud.yml \
            -R "${GITHUB_REPOSITORY}" --ref main \
            --raw-field reconcile_only=true
          echo "CORTES_LINKEDIN_RECONCILE_ONLY_DISPATCHED=1"
