name: Kwai Canonical Neon Cloud Publisher
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cortes-kwai-cloud-publisher.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Read queue status, stage a safe cut, or explicitly publish after KW-06 authorization"
        type: choice
        options:
          - status
          - lease_cycle
          - stage
          - publish
          - android_stage
        default: status
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: anthares-kwai-cloud-neon-exclusive
  cancel-in-progress: false
jobs:
  kw09-phone-stage-probe:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[KW09_PHONE_PROBE]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      KW09_MACRODROID_STAGE_WEBHOOK: ${{ secrets.KW09_MACRODROID_STAGE_WEBHOOK }}
    steps:
      - name: Send verified, already-public MP4 to staging-only Android macro
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlencode, urlsplit
          from urllib.request import Request, urlopen
          secret=os.getenv("KW09_MACRODROID_STAGE_WEBHOOK","")
          u=urlsplit(secret)
          assert u.scheme=="https" and u.hostname=="trigger.macrodroid.com"
          assert u.path.endswith("/kw09_stage_only") and not (u.username or u.password or u.query or u.fragment)
          values={
            "kw09_mode":"stage_only",
            "kw09_job_id":"kwai-cortes-kw09probe-gh-20261109-verified",
            "kw09_generation":"1",
            "kw09_expected_account":"lucasrosalem",
            "kw09_expected_sha256":"7355d6c5358fdd81a53c93bff17275259bb57f15e44cbe639f95639f0b5cef96",
            "kw09_video_url":"https://anthares.us/wp-content/uploads/anthares-clips/2026/10/short_fOmihuHUT1M_g1_7868_7908.mp4",
          }
          args={**values,**{"kw09_stage_q("+k+")":v for k,v in values.items()}}
          with urlopen(Request(secret+"?"+urlencode(args),method="GET"),timeout=20) as result:
            assert result.status==200
          print("KW09_GITHUB_PHONE_STAGING_WEBHOOK=ACCEPTED")
          print("KW09_GITHUB_TEST_PUBLICATION=DISABLED")
          PY

  canonical-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical Neon Kwai queue
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/cortes_kwai_neon_cloud.py status | tee "$RUNNER_TEMP/kwai-neon-status.txt"
          if grep -Eq '^KWAI_NEON_ELIGIBLE=[1-9][0-9]*$' "$RUNNER_TEMP/kwai-neon-status.txt"; then
            echo eligible=true >> "$GITHUB_OUTPUT"
          else
            echo eligible=false >> "$GITHUB_OUTPUT"
            echo KWAI_NEON_NO_ELIGIBLE_DISTINCT_SOURCE=1
          fi
  android-stage:
    needs: canonical-state
    if: ${{ (inputs.mode == 'stage' || inputs.mode == 'publish') && needs.canonical-state.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      KWAI_CLOUD_MODE: ${{ inputs.mode }}
      KWAI_EXPECTED_ACCOUNT: lucasrosalem
      KWAI_SESSION_ENCRYPTION_KEY: ${{ secrets.KWAI_SESSION_KEY }}
      KWAI_CLOUD_PUBLISH_ENABLED: ${{ vars.CORTES_KWAI_CLOUD_PUBLISH_ENABLED }}
      KWAI_INDEPENDENT_VERIFIER_ENABLED: ${{ vars.CORTES_KWAI_INDEPENDENT_VERIFIER_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtain authenticated encrypted session for hosted Android
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KWAI_SESSION_ENCRYPTION_KEY"
          if [ "$KWAI_CLOUD_MODE" = publish ]; then
            test "$KWAI_CLOUD_PUBLISH_ENABLED" = 1
            test "$KWAI_INDEPENDENT_VERIFIER_ENABLED" = 1
          fi
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 180 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo '96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip' | sha256sum -c -
          unzip -q kwai-vault.zip -d kwai-vault
          python3 tools/kwai_session_vault_client.py pull --path kwai-session.enc
          test -s kwai-session.enc
      - name: Enable hosted Android KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Execute Neon-fenced Android consumer without Cloudflare queue fallback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 420
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            bash tools/cortes_kwai_cloud_stage.sh
      - name: Remove ephemeral session and job receipt
        if: always()
        shell: bash
        run: |
          rm -f kwai-neon-lease.json kwai-media-ready.json kwai-session.enc

  kw09-android-neon-stage:
    needs: canonical-state
    if: ${{ inputs.mode == 'android_stage' && needs.canonical-state.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      KW09_MACRODROID_STAGE_WEBHOOK: ${{ secrets.KW09_MACRODROID_STAGE_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage canonical Neon Kwai media on independent Android (no publishing)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/kw09_android_stage.py

  kw05-fenced-queue-cycle:
    needs: canonical-state
    if: ${{ inputs.mode == 'lease_cycle' && needs.canonical-state.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Acquire, renew and release real Neon job without publishing
        shell: bash
        run: |
          set -euo pipefail
          export KWAI_NEON_LEASE_FILE="$RUNNER_TEMP/kw05-lease.json"
          trap 'if [ -s "$RUNNER_TEMP/kw05-current.json" ]; then python3 tools/cortes_kwai_neon_cloud.py fail --json @"$RUNNER_TEMP/kw05-current.json" >/dev/null 2>&1 || true; fi; rm -f "$RUNNER_TEMP"/kw05-{lease,current,first,old-attempt}.json "$RUNNER_TEMP/kw05-old-attempt.log"' EXIT
          python3 tools/cortes_kwai_neon_cloud.py lease --json '{"lease_seconds":600}' | grep -qx 'KWAI_NEON_LEASE=ACQUIRED'
          python3 - "$RUNNER_TEMP/kw05-lease.json" "$RUNNER_TEMP/kw05-first.json" <<'PY'
          import json,sys,re
          d=json.load(open(sys.argv[1],encoding='utf8'))
          p=d.get('payload') or {}
          assert d.get('target_key')=='kwai:lucasrosalem'
          assert re.fullmatch(r'kwai-cortes-[A-Za-z0-9._:-]{3,145}',d['id'])
          assert p.get('expected_account')=='lucasrosalem'
          assert p.get('executor')=='github_hosted_android'
          assert int(d.get('lease_generation',0))>=1
          with open(sys.argv[2],'w',encoding='utf8') as f:
            json.dump({'id':d['id'],'lease_generation':int(d['lease_generation'])},f)
          print('KW05_CANONICAL_QUEUE_IDENTITY=PASS')
          PY
          cp "$RUNNER_TEMP/kw05-first.json" "$RUNNER_TEMP/kw05-current.json"
          python3 - "$RUNNER_TEMP/kw05-first.json" "$RUNNER_TEMP/kw05-current.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf8'))
          d['lease_seconds']=600
          json.dump(d,open(sys.argv[2],'w',encoding='utf8'))
          PY
          python3 tools/cortes_kwai_neon_cloud.py renew --json @"$RUNNER_TEMP/kw05-current.json" | grep -qx 'KWAI_NEON_RENEW=ACK'
          python3 tools/cortes_kwai_neon_cloud.py fail --json @"$RUNNER_TEMP/kw05-first.json" | grep -qx 'KWAI_NEON_FAIL=ACK'
          rm -f "$RUNNER_TEMP/kw05-lease.json" "$RUNNER_TEMP/kw05-current.json"
          python3 tools/cortes_kwai_neon_cloud.py lease --json '{"lease_seconds":600}' | grep -qx 'KWAI_NEON_LEASE=ACQUIRED'
          python3 - "$RUNNER_TEMP/kw05-lease.json" "$RUNNER_TEMP/kw05-first.json" "$RUNNER_TEMP/kw05-current.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf8'))
          a=json.load(open(sys.argv[2],encoding='utf8'))
          assert d['id']==a['id'], 'queue-order-changed'
          assert int(d['lease_generation'])==a['lease_generation']+1, 'lease-generation-not-incremented'
          json.dump({'id':d['id'],'lease_generation':int(d['lease_generation'])},open(sys.argv[3],'w',encoding='utf8'))
          print('KW05_LEASE_GENERATION_INCREMENT=PASS')
          PY
          if python3 tools/cortes_kwai_neon_cloud.py renew --json @"$RUNNER_TEMP/kw05-first.json" > "$RUNNER_TEMP/kw05-old-attempt.log" 2>&1; then
            echo KW05_STALE_FENCE_ERRONEOUSLY_ACCEPTED=1
            exit 91
          fi
          grep -qx 'KWAI_NEON_HTTP_409' "$RUNNER_TEMP/kw05-old-attempt.log"
          python3 tools/cortes_kwai_neon_cloud.py fail --json @"$RUNNER_TEMP/kw05-current.json" | grep -qx 'KWAI_NEON_FAIL=ACK'
          rm -f "$RUNNER_TEMP/kw05-current.json"
          echo KW05_REAL_NEON_LEASE_RENEW_RELEASE=PASS
          echo KW05_STALE_FENCE_REJECTED=PASS
          echo KW05_MEDIA_PUBLICATION_ATTEMPTED=0
