name: Instagram public reconciliation safe contract QA (feature branch)
on:
  push:
    branches:
      - feat/instagram-public-reconcile-daily-layout-20261112
permissions:
  contents: read
jobs:
  test-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile, test public/Neon contracts and layouts without media upload
        run: |
          set -euo pipefail
          python -m pip install --quiet imageio-ffmpeg pillow
          python -m py_compile tools/cortes_instagram_direct_cloud.py tools/cortes_instagram_public_reconcile.py tools/cortes_instagram_vertical_asset.py tools/cortes_instagram_layout_standard.py
          python -m unittest discover -s tests -p 'test_instagram_direct_cloud.py' -v
          python -m unittest discover -s tests -p 'test_instagram_vertical_asset.py' -v
          python -m unittest discover -s tests -p 'test_instagram_layout_standard.py' -v
          python -m unittest discover -s tests -p 'test_instagram_public_reconcile.py' -v
          node --check infra/neon-cortes-queue/index.mjs
          node --test tests/test_instagram_public_neon.mjs
