name: CF02 Cloudflare receipt CAS — nondeploying QA
on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-central-deploy.yml'
      - '.github/workflows/anthares-cf02-receipt-qa.yml'
      - 'tests/test_cloudflare_receipt_cas.py'
permissions:
  contents: read
jobs:
  receipt-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub receipt compare-and-swap under HTTP 409
        run: python3 -m unittest -v tests/test_cloudflare_receipt_cas.py
# QA only: no Cloudflare auth, no deploy, no posting, no main write.
