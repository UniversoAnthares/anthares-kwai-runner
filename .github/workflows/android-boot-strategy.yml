name: Android Boot Strategy Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.boot-strategy-trigger'

permissions:
  contents: read

jobs:
  boot:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 34]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            /opt/hostedtoolcache/android
          key: android-sdk-${{ runner.os }}-${{ hashFiles('.github/workflows/android-boot-strategy.yml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-
      - name: Enable KVM acceleration
        run: |
          test -e /dev/kvm || { echo "KVM_DEVICE_MISSING"; exit 70; }
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
          echo "KVM_ACCELERATION_READY=1"
      - name: Boot API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            set -euo pipefail
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            echo "ANDROID_BOOT_OK_API=${{ matrix.api }}"
