name: Anthares one-time Actions reduction
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Exact owner approved action'
        required: true
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: anthares-reduce-actions
  cancel-in-progress: false
jobs:
  reduce:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'KWAI_AVS_ONLY_20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Disable unrelated workflows and verify
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='UniversoAnthares/anthares-kwai-runner'
          token=os.environ['GITHUB_TOKEN']
          base='https://api.github.com/repos/'+repo+'/actions/workflows'
          keep=set('.github/workflows/'+x for x in ["kwai-queue-publisher.yml","kwai-real-publish.yml","kwai-android-runner.yml","kwai-interactive-remote-login.yml","kwai-android-interactive-login.yml","kwai-mobile-auth-acceptance.yml","kwai-private-vault-probe.yml","kwai-checkpoint-roundtrip.yml","kwai-publish-safety-validation.yml","kwai-heartbeat-contract.yml","kwai-session-restore-safety-qa.yml","kwai-identity-gated-session-qa.yml","kwai-independent-session-engine.yml","kwai-live-6h.yml","security-purge-kwai-artifacts.yml"])
          own='.github/workflows/anthares-actions-reduction-20261031.yml'
          keep.add(own)
          def request(url,method='GET'):
              q=urllib.request.Request(url,method=method,headers={
                'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28',
                'User-Agent':'anthares-approved-actions-reduction'})
              with urllib.request.urlopen(q,timeout=25) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else None
          def workflows():
              rows=[]
              for page in range(1,11):
                  result=request(base+'?per_page=100&page='+str(page))
                  items=result.get('workflows',[])
                  rows+=items
                  if len(items)<100:return rows
              raise RuntimeError('PAGINATION_INCOMPLETE')
          all_items=workflows()
          paths={x['path'] for x in all_items}
          if not 100<=len(all_items)<=900 or own not in paths:
              raise RuntimeError('INVENTORY_INVALID')
          if not {'.github/workflows/kwai-real-publish.yml',
                  '.github/workflows/kwai-queue-publisher.yml'} <= paths:
              raise RuntimeError('KWAI_PROTECTION_INCOMPLETE')
          active=[x for x in all_items if x['state']=='active']
          targets=[x for x in active if x['path'] not in keep]
          print('INVENTORY='+str(len(all_items))+';EXCESS='+str(len(targets)),flush=True)
          done=0
          for x in targets:
              request(base+'/'+str(x['id'])+'/disable','PUT')
              done+=1
              if done%25==0:print('DISABLED='+str(done),flush=True)
              time.sleep(0.48)
          left=[x for x in workflows() if x['state']=='active' and x['path'] not in keep]
          if left:raise RuntimeError('EXCESS_REMAINING='+str(len(left)))
          print('SUCCESS_DISABLED='+str(done)+';EXCESS_REMAINING=0',flush=True)
          PY
