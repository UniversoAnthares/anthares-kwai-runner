name: ARA Render secrets sync

on:
  push:
    branches:
      - feature/ara-chatgpt-mcp
    paths:
      - '.github/workflows/ara-render-secrets-sync.yml'
  pull_request:
    branches:
      - feature/anthares-remote-agent
    paths:
      - '.github/workflows/ara-render-secrets-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTROL_SERVICE: srv-db6mj8navr4c73cqvgo0
      MCP_SERVICE: srv-db6naljbc2fs739og1s0
    steps:
      - name: Verify Render API credential exists
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set +x
          if [ -z "$RENDER_API_KEY" ]; then
            echo 'RENDER_API_KEY_MISSING'
            exit 2
          fi
          echo 'RENDER_API_KEY_PRESENT'

      - name: Generate and install matching service credentials
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set +x
          ARA_SHARED="$(openssl rand -base64 48 | tr -d '\n' | tr '+/' '-_')"
          OAUTH_PASSWORD="$(openssl rand -base64 36 | tr -d '\n' | tr '+/' '-_')"

          put_env() {
            service="$1"
            key="$2"
            value="$3"
            payload="$(python3 -c 'import json,sys; print(json.dumps({"value":sys.argv[1]}))' "$value")"
            curl --fail --silent --show-error --output /dev/null \
              --request PUT \
              --url "https://api.render.com/v1/services/${service}/env-vars/${key}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data "$payload"
          }

          put_env "$CONTROL_SERVICE" ARA_SHARED "$ARA_SHARED"
          put_env "$MCP_SERVICE" ARA_SHARED "$ARA_SHARED"
          put_env "$MCP_SERVICE" ARA_OAUTH_ADMIN_PASSWORD "$OAUTH_PASSWORD"
          put_env "$CONTROL_SERVICE" ARA_BOOTSTRAP_ACTIVE '0'
          echo 'RENDER_ENV_SYNC_OK'

      - name: Trigger both Render deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set +x
          deploy() {
            curl --fail --silent --show-error --output /dev/null \
              --request POST \
              --url "https://api.render.com/v1/services/$1/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data '{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}'
          }
          deploy "$CONTROL_SERVICE"
          deploy "$MCP_SERVICE"
          echo 'RENDER_DEPLOYS_TRIGGERED'
