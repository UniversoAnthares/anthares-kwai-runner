name: ARA Render secrets sync

on:
  push:
    branches:
      - feature/ara-chatgpt-mcp
    paths:
      - '.github/workflows/ara-render-secrets-sync.yml'
  pull_request:
    branches:
      - feature/anthares-remote-agent
    paths:
      - '.github/workflows/ara-render-secrets-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      CONTROL_SERVICE: srv-db6mj8navr4c73cqvgo0
      MCP_SERVICE: srv-db6naljbc2fs739og1s0
    steps:
      - name: Provision Render secrets and deploy
        shell: powershell
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $token = @($env:RENDER_API_KEY,$env:RENDER_API_TOKEN,$env:RENDER_TOKEN) | Where-Object { $_ } | Select-Object -First 1
          if (-not $token) { Write-Host 'RENDER_API_CREDENTIAL_MISSING'; exit 2 }
          Write-Host 'RENDER_API_CREDENTIAL_PRESENT'

          function New-Secret([int]$Bytes) {
            $buffer = New-Object byte[] $Bytes
            [System.Security.Cryptography.RandomNumberGenerator]::Fill($buffer)
            return [Convert]::ToBase64String($buffer).TrimEnd('=').Replace('+','-').Replace('/','_')
          }
          $shared = New-Secret 48
          $oauth = New-Secret 36
          Write-Output "::add-mask::$shared"
          Write-Output "::add-mask::$oauth"
          $headers = @{ Authorization = "Bearer $token"; Accept='application/json' }

          function Put-Env([string]$Service,[string]$Key,[string]$Value) {
            $body = @{ value=$Value } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Put -Uri "https://api.render.com/v1/services/$Service/env-vars/$Key" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          }
          function Deploy([string]$Service) {
            $body = @{ clearCache='do_not_clear'; deployMode='build_and_deploy' } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri "https://api.render.com/v1/services/$Service/deploys" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          }

          Put-Env $env:CONTROL_SERVICE 'ARA_SHARED' $shared
          Put-Env $env:MCP_SERVICE 'ARA_SHARED' $shared
          Put-Env $env:MCP_SERVICE 'ARA_OAUTH_ADMIN_PASSWORD' $oauth
          Put-Env $env:CONTROL_SERVICE 'ARA_BOOTSTRAP_ACTIVE' '0'
          Write-Host 'RENDER_ENV_SYNC_OK'
          Deploy $env:CONTROL_SERVICE
          Deploy $env:MCP_SERVICE
          Write-Host 'RENDER_DEPLOYS_TRIGGERED'
