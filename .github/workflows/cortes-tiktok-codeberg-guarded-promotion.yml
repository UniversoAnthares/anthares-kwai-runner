name: Promote Codeberg TikTok after GitHub primary toggle
# Codeberg account suspended: archive only. No automatic or manual provider action.
on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
concurrency:
  group: tiktok-codeberg-safe-primary-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ false }} # Disabled: Codeberg account suspended
    # Account suspended: preserve existing GitHub publishers and Neon fencing.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CODEBERG_PUSH_URL: ${{ secrets.CODEBERG_PUSH_URL }}
      GH_ACTIONS_TOKEN: ${{ github.token }}
    steps:
      - name: Drain existing GitHub publishers and enable Codeberg primary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='UniversoAnthares/anthares-kwai-runner'
          $hgh=@{
            Authorization='Bearer '+$env:GH_ACTIONS_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          foreach($wf in @('cortes-tiktok-publisher.yml','cortes-tiktok-lucasrosalem4-cloud-publisher.yml')){
            foreach($state in @('in_progress','queued','waiting')){
              $url="https://api.github.com/repos/$repo/actions/workflows/$wf/runs?status=$state&per_page=25"
              $runs=Invoke-RestMethod -Uri $url -Headers $hgh -TimeoutSec 20
              if(@($runs.workflow_runs).Count -gt 0){
                Write-Output "CODEBERG_PRIMARY_DEFER_ACTIVE_GITHUB_WORKFLOW=$wf state=$state"
                exit 0
              }
            }
          }
          # Disable GitHub publishers before opening the Codeberg gate.
          # Existing jobs have already drained above; disabling prevents
          # a new scheduled job from starting during the handoff.
          foreach($wf in @('cortes-tiktok-publisher.yml','cortes-tiktok-lucasrosalem4-cloud-publisher.yml')){
            $disableUrl="https://api.github.com/repos/$repo/actions/workflows/$wf/disable"
            Invoke-WebRequest -Uri $disableUrl -Headers $hgh -Method Put -TimeoutSec 18 -UseBasicParsing | Out-Null
            Write-Output "GITHUB_TIKTOK_WORKFLOW_DISABLED=$wf"
          }
          try {
          $u=[uri]$env:CODEBERG_PUSH_URL
          if($u.Scheme -ne 'https' -or $u.Host -ne 'codeberg.org'){throw 'CODEBERG_AUTH_INVALID_ORIGIN'}
          $pair=$u.UserInfo.Split(':',2)
          if($pair.Count -ne 2){throw 'CODEBERG_AUTH_MISSING'}
          $basic=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(
            ([uri]::UnescapeDataString($pair[0]))+':'+([uri]::UnescapeDataString($pair[1]))))
          $h=@{Authorization='Basic '+$basic;Accept='application/json'}
          $url="https://codeberg.org/api/v1/repos/$repo/actions/variables/TIKTOK_CODEBERG_PRIMARY"
          $exists=$false
          try{
            $old=Invoke-RestMethod -Uri $url -Headers $h -TimeoutSec 18
            $exists=$true
          }catch{
            if([int]$_.Exception.Response.StatusCode -ne 404){throw}
          }
          if(!$exists -or $old.data -ne 'true'){
            $data=@{value='true'} |ConvertTo-Json -Compress
            $method=if($exists){'Put'}else{'Post'}
            Invoke-WebRequest -Uri $url -Headers $h -Method $method -ContentType 'application/json' -Body $data -TimeoutSec 24 -UseBasicParsing |Out-Null
          }
          $verified=Invoke-RestMethod -Uri $url -Headers $h -TimeoutSec 18
          if($verified.data -ne 'true'){throw 'CODEBERG_PRIMARY_FLAG_NOT_VERIFIED'}
          Write-Output 'CODEBERG_TIKTOK_PRIMARY_ENABLED_AND_GITHUB_DRAINED=1'
          } catch {
            Write-Output ('CODEBERG_PROMOTION_FAILED=' + $_.Exception.Message)
            foreach($wf in @('cortes-tiktok-publisher.yml','cortes-tiktok-lucasrosalem4-cloud-publisher.yml')){
              try {
                Invoke-WebRequest -Uri "https://api.github.com/repos/$repo/actions/workflows/$wf/enable" -Headers $hgh -Method Put -TimeoutSec 18 -UseBasicParsing | Out-Null
                Write-Output "GITHUB_TIKTOK_WORKFLOW_RESTORED=$wf"
              } catch { Write-Output "GITHUB_TIKTOK_WORKFLOW_RESTORE_FAILED=$wf" }
            }
            throw
          }
          try{
            $self='cortes-tiktok-codeberg-guarded-promotion.yml'
            Invoke-WebRequest -Uri "https://api.github.com/repos/$repo/actions/workflows/$self/disable" -Headers $hgh -Method Put -TimeoutSec 16 -UseBasicParsing |Out-Null
            Write-Output 'CODEBERG_TIKTOK_PROMOTION_SCHEDULER_SELF_DISABLED=1'
          }catch{
            Write-Output 'CODEBERG_TIKTOK_PROMOTION_SCHEDULER_DISABLE_RETRY_REQUIRED=1'
          }
