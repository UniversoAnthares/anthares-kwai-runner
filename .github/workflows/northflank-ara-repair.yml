name: Repair Northflank ARA deployment
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/northflank-ara-repair.yml
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Trigger corrected build and wait for deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          token=os.environ.get('NORTHFLANK_API_TOKEN','')
          if not token: raise SystemExit('missing NORTHFLANK_API_TOKEN')
          base='https://api.northflank.com/v1'; h={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def api(method,path,data=None,allow=()):
              req=urllib.request.Request(base+path,data=(json.dumps(data).encode() if data is not None else None),method=method,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:
                      raw=r.read().decode(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  if e.code in allow: return {'_http':e.code}
                  raise
          projects=(api('GET','/projects').get('data') or {}).get('projects') or []
          if isinstance(projects,dict): projects=list(projects.values())
          p=next(x for x in projects if x.get('name')=='Default'); pid=p['id']
          services=(api('GET',f'/projects/{pid}/services').get('data') or {}).get('services') or []
          if isinstance(services,dict): services=list(services.values())
          s=next(x for x in services if x.get('name')=='anthares-ara-northflank'); sid=s.get('id') or 'anthares-ara-northflank'
          r=api('POST',f'/projects/{pid}/services/{sid}/build',{},allow=(409,))
          print('build trigger:', 'already-running' if r.get('_http')==409 else 'accepted')
          dns=((api('GET',f'/projects/{pid}/services/{sid}/ports').get('data') or {}).get('ports') or [])[0].get('dns')
          if not dns: raise SystemExit('public DNS missing')
          url='https://'+dns+'/_canary/persistence-proof'
          for i in range(42):
              try:
                  with urllib.request.urlopen(url,timeout=12) as resp:
                      body=json.loads(resp.read().decode())
                      if resp.status==200 and body.get('ok') is True:
                          print(json.dumps({'ok':True,'backend':body.get('backend'),'public_url':'https://'+dns},sort_keys=True)); sys.exit(0)
              except Exception: pass
              time.sleep(10)
          raise SystemExit('corrected build did not become healthy before timeout')
          PY
