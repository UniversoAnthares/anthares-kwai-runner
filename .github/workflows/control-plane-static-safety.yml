name: Control Plane Static Safety Validation
on:
  push:
    branches: [main]
    paths:
      - '.control-plane-safety-trigger'
      - 'cloudflare-worker/src/index.js'
      - 'direct-tiktok-publisher/publisher_common.py'
      - 'direct-tiktok-publisher/tiktok_cloud_publish.py'
      - '.github/workflows/tiktok-github-direct-publisher.yml'
      - 'tests/test_cloud_only_runtime.py'
      - '.github/workflows/control-plane-static-safety.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate central safety invariants
        shell: bash
        run: |
          set -euo pipefail
          F=cloudflare-worker/src/index.js
          test -s "$F"
          grep -q 'class AntharesQueue extends DurableObject' "$F"
          grep -q 'async enqueue(' "$F"
          grep -q 'async lease(' "$F"
          grep -q 'async started(' "$F"
          grep -q 'async complete(' "$F"
          grep -q 'async fail(' "$F"
          grep -q 'async reconcile(' "$F"
          grep -q 'timeline_overlap' "$F"
          grep -q 'status=.uncertain' "$F"
          grep -q 'tiktok-central-session-read.yml' "$F"
          grep -q 'publication_not_started' "$F"
          grep -q 'confirmation_evidence_required' "$F"
          grep -q 'premature_complete_not_rejected' "$F"
          grep -q 'reconcile_without_evidence_not_rejected' "$F"
          grep -q 'missing_confirmation_proof_accepted' "$F"
          grep -q 'const RETIRED_EXECUTORS' "$F"
          grep -q 'if(retiredExecutor(id)) return false' "$F"
          ! grep -q 'LOCAL_EXECUTOR' "$F"
          ! grep -q 'ANTHARES_LOCAL_HEALTH_URL' "$F"
          ! grep -q 'GOOGLE_HEALTH_URL' "$F"
          python - <<'PY'
          import re
          p=open('cloudflare-worker/src/index.js',encoding='utf-8-sig').read()
          m=re.search(r'function priorities\(\)\{return (\{.*?\});\}',p)
          assert m, 'priorities missing'
          x=m.group(1)
          assert '"local"' not in x, x
          assert '"google"' not in x, x
          assert 'cuts:["render","github"]' in x
          assert 'tiktok:["render","github"]' in x
          assert 'kwai:["github"]' in x
          assert 'kwai_live:["hls_origin","github"]' in x
          assert 'render_offline_github' in p and 'recovery_returns_render' in p
          assert 'retired_injected_never_selected' in p
          assert 'const today=localDay()' in p
          assert 'anthares.us/wp-content' not in p
          assert 'complete_without_evidence_rejected:true' in p
          print('CONTROL_STATIC_SAFETY=OK')
          PY
          python tests/test_cloud_only_runtime.py
      - name: Probe deployed controller read-only
        run: |
          set -euo pipefail
          BASE=https://anthares-control.anthares1.workers.dev
          curl --fail-with-body -sS "$BASE/health" > /tmp/health.json
          curl --fail-with-body -sS "$BASE/strategy" > /tmp/strategy.json
          curl --fail-with-body -sS "$BASE/failover-self-test" > /tmp/failover.json
          cat /tmp/health.json; echo
          cat /tmp/strategy.json; echo
          cat /tmp/failover.json; echo
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json')); s=json.load(open('/tmp/strategy.json')); f=json.load(open('/tmp/failover.json'))
          assert h.get('pc_fallback') is False, h
          assert h.get('routing_revision')=='2026-10-06-cloud-only-failover-r1', h
          assert s.get('oracle') is False and s.get('google_compute') is False, s
          retired={'local','pc','windows','oracle','google','google_compute'}
          routes={x for values in s.get('execution_priority',{}).values() for x in values}
          assert routes.isdisjoint(retired), (routes,retired)
          assert retired.issubset(set(s.get('retired_executors',[]))), s
          assert f.get('ok') is True, f
          assert f.get('primary')=='render' and f.get('after_render_failure')=='github' and f.get('after_github_failure') is None, f
          assert f.get('recovered_primary')=='render', f
          assert f.get('checks') and all(f['checks'].values()), f
          print('DEPLOYED_CLOUD_ONLY_FAILOVER=PROVEN')
          PY
