name: Android UIAutomator Driver Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/android-uiautomator/**'
      - '.github/workflows/android-uiautomator-driver.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 18 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-18' 'build-tools;35.0.0'
          test -s "$ANDROID_HOME/platforms/android-18/android.jar"
          test -s "$ANDROID_HOME/platforms/android-18/uiautomator.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
      - name: Compile legacy UIAutomator driver
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          rm -rf build/uiauto
          mkdir -p build/uiauto/classes build/uiauto/dex
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-18/android.jar:$ANDROID_HOME/platforms/android-18/uiautomator.jar" \
            -d build/uiauto/classes \
            tools/android-uiautomator/KwaiUiDriver.java \
            tools/android-uiautomator/android/test/RepetitiveTest.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 18 \
            --output build/uiauto/dex \
            build/uiauto/classes
          (cd build/uiauto/dex && zip -q ../kwai-uiautomator-driver.jar classes.dex)
          sha256sum build/uiauto/kwai-uiautomator-driver.jar
      - uses: actions/upload-artifact@v4
        with:
          name: kwai-uiautomator-driver
          path: build/uiauto/kwai-uiautomator-driver.jar
          if-no-files-found: error
