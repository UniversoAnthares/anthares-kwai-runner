name: CORTES QA P0 immediate event controller
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cortes-qa-p0-controller.yml
      - .github/workflows/cortes-qa-p0-executor.yml
      - tools/cortes_qa_p0_router.py
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific existing P0 incident; empty means scan open incidents'
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'
  pull_request:
    paths:
      - .github/workflows/cortes-qa-p0-controller.yml
      - .github/workflows/cortes-qa-p0-executor.yml
      - .github/workflows/cortes-qa-p0-publication-watchdog.yml
      - tools/cortes_qa_p0_router.py
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  # Distinct incident events must not cancel queued controllers.
  # Scheduled scans share a single group to prevent overlap.
  group: cortes-qa-p0-controller-${{ github.event_name == 'issues' && github.event.issue.number || github.event_name == 'schedule' && 'scan' || github.run_id }}
  cancel-in-progress: false
jobs:
  route-p0:
    runs-on: qa-p0-independent
    timeout-minutes: 8
    steps:
      - name: Dispatch bounded P0 executor with cross-run reconciliation
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          QA_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const executor = 'cortes-qa-p0-executor.yml';
            const maxDispatchPerRun = 2, maxAttemptsPerWindow = 3;
            const cooldownMs = 5*60*1000, attemptsWindowMs = 6*60*60*1000;
            const now = Date.now();
            const marker = '[QA-P0-CONTROLLER] DISPATCH_ATTEMPT=';
            function eligible(issue) {
              return issue && issue.state === 'open' && !issue.pull_request &&
                issue.labels?.some(x => (typeof x === 'string' ? x : x.name) === 'QA-P0') &&
                /^\[QA[ -]P0\]/i.test(issue.title || '');
            }
            async function issueByNumber(number) {
              const {data} = await github.rest.issues.get({owner,repo,issue_number:number});
              return data;
            }
            async function candidates() {
              const raw = String(process.env.QA_ISSUE_NUMBER || '').trim();
              if (raw) {
                if (!/^\d{1,8}$/.test(raw)) throw Error('INVALID_QA_ISSUE_NUMBER');
                return [await issueByNumber(Number(raw))];
              }
              if (context.eventName === 'issues') {
                const obj = context.payload.issue;
                return obj ? [await issueByNumber(obj.number)] : [];
              }
              const all = [];
              for (let page = 1; page <= 8; page++) {
                const {data} = await github.rest.issues.listForRepo({
                  owner,repo,state:'open',labels:'QA-P0',
                  sort:'created',direction:'desc',per_page:100,page
                });
                all.push(...data.filter(x => eligible(x)));
                if (data.length < 100) break;
              }
              // One-time recovery of the three documented P0 incidents from the
              // outage investigation. Idempotent run checks still apply.
              const urgent = new Set([460,492,528]);
              return all.sort((a,b) => {
                const ap=urgent.has(a.number)?0:1, bp=urgent.has(b.number)?0:1;
                return ap-bp || Date.parse(a.created_at)-Date.parse(b.created_at);
              });
            }
            const priorRuns = [];
            for (let page = 1; page <= 4; page++) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id:executor,event:'workflow_dispatch',per_page:100,page
              });
              priorRuns.push(...data.workflow_runs);
              if (data.workflow_runs.length < 100) break;
            }
            // Prior queued runs belong to a superseded publishing runner. They must
            // not deadlock the new dedicated QA runner. In-progress jobs still
            // consume capacity; pending jobs count only within the recent window.
            const currentPending = priorRuns.filter(x =>
              x.status === 'in_progress' ||
              (x.status !== 'completed' && now-Date.parse(x.created_at) < 10*60*1000));
            const activeCount = currentPending.length;
            const explicitUrgent = /^\d{1,8}$/.test(String(process.env.QA_ISSUE_NUMBER || '').trim());
            // Explicitly requested P0 issues may bypass global backpressure,
            // while existing same-issue dedupe and three-attempt checks remain.
            if (activeCount >= 3 && !explicitUrgent) {
              core.warning('QA_P0_EXECUTOR_BACKPRESSURE active='+activeCount+
                '; outstanding incidents remain open and will be retried next scan.');
              return;
            }
            const events = await candidates();
            let dispatched = 0, skipped = 0, failures = 0;
            for (const issue of events) {
              if (!eligible(issue)) {skipped++;continue;}
              if (dispatched >= maxDispatchPerRun) {
                core.warning('QA_P0_BACKLOG_INCOMPLETE: rerun scheduled in five minutes');
                break;
              }
              const runTitle = 'QA-P0 #' + issue.number;
              const found = priorRuns.filter(x => x.display_title === runTitle)
                .sort((a,b) => Date.parse(b.created_at)-Date.parse(a.created_at));
              const active = found.find(x => x.status !== 'completed');
              // Successful diagnostics do not prove the P0 has been fixed.
              // Open issues remain eligible for bounded further reconciliation.
              if (active) {
                skipped++;continue;
              }
              const {data:comments} = await github.rest.issues.listComments({
                owner,repo,issue_number:issue.number,per_page:100
              });
              const attempts = comments.filter(x =>
                (x.body || '').includes(marker) &&
                now-Date.parse(x.created_at) < attemptsWindowMs);
              const latest = attempts.at(-1);
              if (latest && now - Date.parse(latest.created_at) < cooldownMs) {
                skipped++;continue;
              }
              const recentRuns=found.filter(x => now-Date.parse(x.created_at) < attemptsWindowMs);
              if (Math.max(attempts.length,recentRuns.length) >= maxAttemptsPerWindow) {
                core.warning('QA_P0_BOUNDED_COOLDOWN issue='+issue.number+
                  ' max_attempts_per_window='+maxAttemptsPerWindow+'; incident remains open.');
                skipped++;continue;
              }
              const attempt = Math.max(attempts.length,recentRuns.length) + 1;
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,repo,workflow_id:executor,ref:'main',
                  inputs:{issue_number:String(issue.number)}
                });
                await github.rest.issues.createComment({
                  owner,repo,issue_number:issue.number,
                  body:marker+attempt+' accepted at '+new Date().toISOString()+
                    '. Executor: https://github.com/'+owner+'/'+repo+
                    '/actions/workflows/'+executor+
                    '. Dispatch acknowledgement is not execution proof.'
                });
                dispatched++;
                core.notice('QA_P0_EXECUTOR_DISPATCH_ACCEPTED issue='+issue.number+' attempt='+attempt);
              } catch (e) {
                failures++;
                core.error('QA_P0_DISPATCH_FAILED issue='+issue.number+' code='+e.status);
              }
            }
            core.summary.addHeading('CORTES QA P0 event controller')
              .addRaw('Candidates='+events.length+', dispatches='+dispatched+
                ', skipped='+skipped+', failures='+failures+'.',true);
            await core.summary.write();
            if (failures) core.setFailed('QA_P0_CONTROLLER_DISPATCH_FAILURES='+failures);
      - name: Validate control-plane YAML on pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo QA_P0_CONTROLLER_PR_VALIDATION=EVENT_REGISTERED
