name: TikTok WP Filename Reconstruction 5-Way
on:
  push:
    paths: ['.github/workflows/tiktok-wp-filename-reconstruction.yml']
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [metadata_file, basename_ascii, basename_dash, basename_no_suffix, uploads_root]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reconstruct physical clip path
        env:
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,unicodedata,re
          h={'User-Agent':'Mozilla/5.0 AntharesReconstruct/1'}
          with urllib.request.urlopen(urllib.request.Request('https://anthares.us/wp-json/wp/v2/media?media_type=video&per_page=1&orderby=date&order=desc',headers=h),timeout=25) as r:x=json.load(r)[0]
          src=x.get('source_url',''); mf=(x.get('media_details') or {}).get('file',''); mode=os.environ['MODE']
          if not src or not mf: print('TEST_VALIDITY=INVALID'); raise SystemExit(3)
          z=urllib.parse.urlsplit(src); base=z.path.rsplit('/',1)[-1]; root='https://anthares.us/wp-content/uploads/'
          if mode=='metadata_file': target=root+mf
          elif mode=='basename_ascii':
            b=unicodedata.normalize('NFKD',urllib.parse.unquote(base)).encode('ascii','ignore').decode(); target=z.scheme+'://'+z.netloc+z.path.rsplit('/',1)[0]+'/'+urllib.parse.quote(b)
          elif mode=='basename_dash':
            b=re.sub(r'[^A-Za-z0-9._-]+','-',urllib.parse.unquote(base)); target=z.scheme+'://'+z.netloc+z.path.rsplit('/',1)[0]+'/'+b
          elif mode=='basename_no_suffix':
            b=re.sub(r'-\d+x\d+(?=\.[^.]+$)','',urllib.parse.unquote(base)); target=z.scheme+'://'+z.netloc+z.path.rsplit('/',1)[0]+'/'+urllib.parse.quote(b)
          else: target=root+urllib.parse.quote(urllib.parse.unquote(base))
          print('MODE',mode,'TARGET',target)
          try:
            with urllib.request.urlopen(urllib.request.Request(target,headers=h),timeout=30) as r:
              b=r.read(131072); print('HTTP',r.status,'CT',r.headers.get('Content-Type'),'BYTES',len(b))
              if r.status in (200,206) and len(b)>=1024: print('RECONSTRUCTED_MEDIA=PROVEN',mode)
              else: raise SystemExit(2)
          except Exception as e: print('ERROR',type(e).__name__,getattr(e,'code','')); raise
          PY
