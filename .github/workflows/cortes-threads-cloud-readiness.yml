name: CORTES Threads — Anthares Browser cloud auth probe
on:
  push:
    branches:
      - feature/threads-cloud-primary-20261021
    paths:
      - .github/workflows/cortes-threads-cloud-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cortes-threads-cloud-readiness
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      ANTHARES_BROWSER_STATE_AUTHORITY: runtime
      ANTHARES_BROWSER_STATE_VAULT_URL: https://anthares-x-vault.anthares1.workers.dev/browser-state/runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install Anthares Browser headless Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright requests cryptography
          python3 -m playwright install chromium
      - name: Check signed, encrypted cloud browser state and Threads identity (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          from infra.anthares_runtime_browser_local import _vault_pull
          if not os.environ.get('ARA_SHARED'):
              print('CLOUD_AUTH_GATE=ARA_SHARED_UNAVAILABLE')
              raise SystemExit(0)
          try:
              state = _vault_pull()
          except Exception as exc:
              print('CLOUD_AUTH_GATE=VAULT_READ_FAILED')
              print('VAULT_ERROR_CLASS='+type(exc).__name__)
              raise SystemExit(0)
          if not state:
              print('CLOUD_AUTH_GATE=VAULT_EMPTY')
              raise SystemExit(0)
          cookies=state.get('cookies') or []
          threads_cookies=sum(1 for c in cookies if c.get('domain','').lstrip('.') in ('threads.com','threads.net') or c.get('domain','').endswith('.threads.com'))
          print('CLOUD_VAULT_RESTORED=1')
          print('THREADS_COOKIE_PRESENT='+str(threads_cookies>0).lower())
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--mute-audio'])
              context=browser.new_context(storage_state=state,locale='pt-BR',viewport={'width':1365,'height':960})
              page=context.new_page()
              try:
                  page.goto('https://www.threads.com/',wait_until='domcontentloaded',timeout=45000)
                  page.wait_for_timeout(3000)
                  result=page.evaluate("""() => ({
                    host: location.hostname,
                    hasComposer: !!document.querySelector('[contenteditable=true],[aria-label^="Campo de texto vazio"]'),
                    ownerLink: [...document.querySelectorAll('a[href]')].some(a => /^\/@universoanthares\/?$/.test(a.getAttribute('href')||'')),
                    loginForm: !!document.querySelector('input[type=password]'),
                    visibleLogin: /entrar no threads|log in to threads|fazer login no threads/i.test(document.body.innerText.slice(0,1200))
                  })""")
                  print('THREADS_HOST_OK='+str(result['host'] in ('www.threads.com','threads.com')).lower())
                  print('THREADS_COMPOSER_VISIBLE='+str(result['hasComposer']).lower())
                  print('THREADS_OWNER_LINK_VISIBLE='+str(result['ownerLink']).lower())
                  print('THREADS_LOGIN_PROMPT='+str(result['loginForm'] or result['visibleLogin']).lower())
                  if result['hasComposer'] and result['ownerLink'] and not (result['loginForm'] or result['visibleLogin']):
                      print('CLOUD_AUTH_GATE=READY_FOR_INDEPENDENT_IDENTITY_PROOF')
                  else:
                      print('CLOUD_AUTH_GATE=OWNER_LOGIN_OR_FURTHER_PROOF_REQUIRED')
              except Exception as exc:
                  print('CLOUD_AUTH_GATE=NAVIGATION_FAILED')
                  print('BROWSER_ERROR_CLASS='+type(exc).__name__)
              finally:
                  context.close()
                  browser.close()
          PY
