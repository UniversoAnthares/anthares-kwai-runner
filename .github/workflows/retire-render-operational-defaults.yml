name: Verify Render operational defaults remain retired

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-render-operational-defaults.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical replacements
        shell: bash
        run: |
          set -euo pipefail
          grep -q "anthares-ara-backup.anthares1.workers.dev" anthares-remote-mcp/server.mjs
          grep -q "anthares-ara-mcp.anthares1.workers.dev" anthares-remote-mcp/gateway.mjs
          ! grep -q "onrender\.com" anthares-remote-mcp/server.mjs
          ! grep -q "onrender\.com" anthares-remote-mcp/remote-server.mjs
          ! grep -q "onrender\.com" anthares-remote-mcp/gateway.mjs
          ! grep -q "onrender\.com" anthares-remote-mcp/gateway-v2.mjs
          ! grep -q "onrender\.com" infra/ara_canary_mcp_bridge.py
          echo RENDER_OPERATIONAL_DEFAULTS_RETIRED=1
