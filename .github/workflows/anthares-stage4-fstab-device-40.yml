name: Kwai Android ARM64 Fstab Device Matrix 40
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/anthares-stage4-fstab-device-40.yml'
permissions:
  contents: read
jobs:
  matrix40:
    name: "case-${{ strategy.job-index }} data=${{ matrix.data_dev }} meta=${{ matrix.meta_dev }} bus=${{ matrix.bus }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        data_dev: [vda, vdb, vdc, vdd]
        meta_dev: [vda1, vdb1, vdc1, vdd1, byname]
        bus: [mmio, pci]
    steps:
      - name: Install QEMU and Android ARM64 image
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm unzip curl default-jre-headless gdisk e2fsprogs util-linux cpio gzip >/dev/null
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          curl -fLsS --retry 2 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/android-tools
          cp -a /tmp/android-tools/cmdline-tools/. "$HOME/android-sdk/cmdline-tools/latest/"
          export ANDROID_HOME="$HOME/android-sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-30;default;arm64-v8a" >/dev/null
          DIR="$ANDROID_HOME/system-images/android-30/default/arm64-v8a"
          gzip -dc "$DIR/kernel-ranchu" > /tmp/android-Image
          echo "ANDROID_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build deterministic metadata and userdata
        run: |
          set -euo pipefail
          truncate -s 192M /tmp/meta.img
          sgdisk -o /tmp/meta.img >/dev/null
          sgdisk -n 1:2048:0 -c 1:metadata /tmp/meta.img >/dev/null
          LOOP=$(sudo losetup --find --show --partscan /tmp/meta.img)
          sleep 1
          sudo mkfs.ext4 -F -L metadata -O ^64bit,^metadata_csum "${LOOP}p1" >/dev/null
          sudo losetup -d "$LOOP"

          truncate -s 4G /tmp/userdata.raw
          mkfs.ext4 -F -L data -O ^64bit,^metadata_csum -E lazy_itable_init=0,lazy_journal_init=0 /tmp/userdata.raw >/dev/null
          mkdir -p /tmp/data-mnt
          sudo mount -o loop /tmp/userdata.raw /tmp/data-mnt
          sudo mkdir -p /tmp/data-mnt/dalvik-cache/arm64 /tmp/data-mnt/misc_de /tmp/data-mnt/misc_ce /tmp/data-mnt/system /tmp/data-mnt/system_ce /tmp/data-mnt/system_de
          sudo chmod 771 /tmp/data-mnt/dalvik-cache /tmp/data-mnt/dalvik-cache/arm64 || true
          sync
          sudo umount /tmp/data-mnt
          dumpe2fs -h /tmp/userdata.raw 2>/dev/null | grep -E 'Filesystem magic|Filesystem features|Filesystem volume name'

      - name: Patch ramdisk fstab to explicit devices
        run: |
          set -euo pipefail
          DATA_SRC="/dev/block/${{ matrix.data_dev }}"
          if [ '${{ matrix.meta_dev }}' = byname ]; then
            if [ '${{ matrix.bus }}' = mmio ]; then
              META_SRC='/dev/block/platform/a003c00.virtio_mmio/by-name/metadata'
            else
              META_SRC='/dev/block/by-name/metadata'
            fi
          else
            META_SRC="/dev/block/${{ matrix.meta_dev }}"
          fi
          rm -rf /tmp/rd && mkdir -p /tmp/rd
          cd /tmp/rd
          if gzip -t "$ANDROID_DIR/ramdisk.img" 2>/dev/null; then
            gzip -dc "$ANDROID_DIR/ramdisk.img" | cpio -idmu --no-absolute-filenames 2>/dev/null
            PACK=gzip
          else
            cpio -idmu --no-absolute-filenames < "$ANDROID_DIR/ramdisk.img" 2>/dev/null
            PACK=raw
          fi
          find . -type f -name 'fstab*' -print -exec grep -HnE '[[:space:]]/(data|metadata)[[:space:]]' {} \; | tee /tmp/fstab-before.txt || true
          DATA_PATCH=0
          META_PATCH=0
          while IFS= read -r -d '' f; do
            if awk -v d="$DATA_SRC" -v m="$META_SRC" '
              BEGIN { OFS="\t" }
              /^[[:space:]]*#/ || NF < 2 { print; next }
              $2=="/data" { $1=d; dc++ }
              $2=="/metadata" { $1=m; mc++ }
              { print }
              END { if (dc>0) print dc > "/tmp/data-patch-count.part"; if (mc>0) print mc > "/tmp/meta-patch-count.part" }
            ' "$f" > "$f.new"; then mv "$f.new" "$f"; fi
            if [ -f /tmp/data-patch-count.part ]; then DATA_PATCH=$((DATA_PATCH+$(cat /tmp/data-patch-count.part))); rm -f /tmp/data-patch-count.part; fi
            if [ -f /tmp/meta-patch-count.part ]; then META_PATCH=$((META_PATCH+$(cat /tmp/meta-patch-count.part))); rm -f /tmp/meta-patch-count.part; fi
          done < <(find . -type f -name 'fstab*' -print0)
          echo "DATA_PATCH_COUNT=$DATA_PATCH"
          echo "META_PATCH_COUNT=$META_PATCH"
          find . -type f -name 'fstab*' -exec grep -HnE '[[:space:]]/(data|metadata)[[:space:]]' {} \; | tee /tmp/fstab-after.txt || true
          test "$DATA_PATCH" -gt 0
          test "$META_PATCH" -gt 0
          if [ "$PACK" = gzip ]; then
            find . -print0 | cpio --null -o -H newc 2>/dev/null | gzip -1 > /tmp/ramdisk-patched.img
          else
            find . -print0 | cpio --null -o -H newc 2>/dev/null > /tmp/ramdisk-patched.img
          fi
          test -s /tmp/ramdisk-patched.img

      - name: Boot patched Android and classify next gate
        run: |
          set +e
          if [ '${{ matrix.bus }}' = mmio ]; then
            BLK='virtio-blk-device'
            D1="-device $BLK,drive=metadata"
            D2="-device $BLK,drive=system"
            D3="-device $BLK,drive=userdata"
            D4="-device $BLK,drive=vendor"
            GPU='-device virtio-gpu-device'
          else
            D1='-device virtio-blk-pci,drive=metadata,addr=0x5'
            D2='-device virtio-blk-pci,drive=system,addr=0x6'
            D3='-device virtio-blk-pci,drive=userdata,addr=0x7'
            D4='-device virtio-blk-pci,drive=vendor,addr=0x8'
            GPU='-device virtio-gpu-pci'
          fi
          timeout 170 qemu-system-aarch64 -machine virt -cpu cortex-a72 -m 4096 -smp 4 -accel tcg -nographic -no-reboot \
            -kernel /tmp/android-Image -initrd /tmp/ramdisk-patched.img \
            -drive if=none,file=/tmp/meta.img,format=raw,id=metadata $D1 \
            -drive if=none,file="$ANDROID_DIR/system.img",format=raw,readonly=on,id=system $D2 \
            -drive if=none,file=/tmp/userdata.raw,format=raw,id=userdata $D3 \
            -drive if=none,file="$ANDROID_DIR/vendor.img",format=raw,readonly=on,id=vendor $D4 \
            $GPU -netdev user,id=n0 -device virtio-net-device,netdev=n0 \
            -append 'console=ttyAMA0 androidboot.console=ttyAMA0 androidboot.hardware=ranchu androidboot.selinux=permissive root=/dev/ram0 rw qemu=1 androidboot.qemu=1 androidboot.serialno=EMULATOR40' \
            > /tmp/android-qemu.log 2>&1
          RC=$?
          grep -E 'fstab|metadata|/data|Invalid ext4|EXT4-fs|dalvik-cache|misc_de|init second stage|zygote|system_server|SystemServer|ActivityManager|PackageManager|surfaceflinger|SurfaceFlinger|BOOT_COMPLETED|boot_completed|Fatal signal|received signal' /tmp/android-qemu.log | tail -360 || true
          echo "QEMU_RC=$RC DATA=${{ matrix.data_dev }} META=${{ matrix.meta_dev }} BUS=${{ matrix.bus }}"
          if grep -Eq 'BOOT_COMPLETED|sys.boot_completed.*1|SystemServer.*Start|ActivityManager.*system_server|PackageManagerService' /tmp/android-qemu.log; then echo RESULT=FRAMEWORK_READY; exit 0; fi
          if ! grep -q 'Error creating cache dir /data/dalvik-cache' /tmp/android-qemu.log && ! grep -q "Can't open /data/misc_de" /tmp/android-qemu.log && grep -q "starting service 'zygote'" /tmp/android-qemu.log; then echo RESULT=DATA_FIXED_NEXT_GATE; exit 0; fi
          if grep -q 'Error creating cache dir /data/dalvik-cache' /tmp/android-qemu.log; then echo RESULT=DATA_NOT_MOUNTED; exit 1; fi
          if grep -q "Can't open /data/misc_de" /tmp/android-qemu.log; then echo RESULT=DATA_PARTIAL; exit 1; fi
          if grep -Eq "metadata.*No such file|Failed to open.*metadata" /tmp/android-qemu.log; then echo RESULT=METADATA_NOT_MOUNTED; exit 1; fi
          if grep -q 'Invalid ext4 superblock' /tmp/android-qemu.log; then echo RESULT=DEVICE_MAPPING_WRONG; exit 1; fi
          if grep -q 'init second stage started' /tmp/android-qemu.log; then echo RESULT=SECOND_STAGE_OTHER; exit 1; fi
          echo RESULT=EARLY_FAIL
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fstab-device-${{ matrix.data_dev }}-${{ matrix.meta_dev }}-${{ matrix.bus }}
          path: |
            /tmp/android-qemu.log
            /tmp/fstab-before.txt
            /tmp/fstab-after.txt
            /tmp/ramdisk-patched.img
          if-no-files-found: warn
          retention-days: 3
