name: Kwai emulator prune probe isolated
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kwai-emulator-prune-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Restore proven slim AVD v4
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/kwai-speed.avd
            ~/.android/avd/kwai-speed.ini
          key: kwai-speed-avd-direct-slim-android35-v4
      - name: Restore Android image
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: kwai-speed-android35-google-apis-x86_64-v1
      - name: Restore emulator
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/lib/android/sdk/emulator
          key: kwai-speed-emulator-ubuntu24-v1
      - name: Inventory and probe headless-safe pruning
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          EMUROOT="$SDK/emulator"
          ADB="$SDK/platform-tools/adb"
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "EMU_RAW_BYTES=$(du -sb "$EMUROOT" | awk '{print $1}')"
          echo '=== EMU TOP LEVEL ==='
          du -sb "$EMUROOT"/* 2>/dev/null | sort -nr | head -30 || true
          echo '=== EMU TOP FILES ==='
          find "$EMUROOT" -type f -printf '%s\t%p\n' | sort -nr | head -40 || true
          rm -rf /tmp/emulator-baseline
          cp -a "$EMUROOT" /tmp/emulator-baseline
          sudo chmod 666 /dev/kvm
          test_variant() {
            name="$1"; target="$2"
            "$ADB" kill-server >/dev/null 2>&1 || true
            rm -rf "$EMUROOT"
            cp -a /tmp/emulator-baseline "$EMUROOT"
            removed=0
            if [ -e "$EMUROOT/$target" ]; then removed=$(du -sb "$EMUROOT/$target" | awk '{print $1}'); rm -rf "$EMUROOT/$target"; fi
            echo "${name}_REMOVED_BYTES=$removed"
            echo "${name}_RAW_BYTES=$(du -sb "$EMUROOT" | awk '{print $1}')"
            log="/tmp/${name}.log"
            t=$(date +%s)
            nohup "$EMUROOT/emulator" -avd kwai-speed -snapshot kwai-ready -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 >"$log" 2>&1 &
            ok=0
            if timeout 45 "$ADB" wait-for-device && timeout 45 bash -c 'until [ "$("$1" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 1; done' _ "$ADB"; then ok=1; fi
            secs=$(($(date +%s)-t))
            actual=false
            if grep -q "Successfully loaded snapshot 'kwai-ready'" "$log" && ! grep -Eq "Failed to load snapshot 'kwai-ready'|performing a cold boot" "$log"; then actual=true; fi
            echo "${name}_BOOTED=$ok"
            echo "${name}_BOOT_SECONDS=$secs"
            echo "${name}_ACTUAL_LOAD=$actual"
            grep -Ei "Successfully loaded snapshot|Failed to load snapshot|cold boot|error while loading|No such file|ERROR" "$log" | tail -40 || true
            "$ADB" emu kill >/dev/null 2>&1 || true
            timeout 20 bash -c 'while pgrep -f "[q]emu-system.*kwai-speed" >/dev/null; do sleep 1; done' || true
          }
          test_variant NO_QT lib64/qt
          test_variant NO_RESOURCES resources
