name: One-time Northflank vault save and Studio search control verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-save-and-search-once.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Save encrypted state and inspect Studio search without publishing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN,shared=process.env.ARA_SHARED;
          if(!token||token.length<20||!shared||shared.length<20)throw Error('AUTH_MISSING');
          const root='https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run';
          async function web(method,path,data){const h={Authorization:'Bearer '+shared,Accept:'application/json'};if(data!==undefined)h['Content-Type']='application/json';const r=await fetch(root+path,{method,headers:h,body:data===undefined?undefined:JSON.stringify(data),signal:AbortSignal.timeout(52000)});return {status:r.status,data:await r.json().catch(()=>({}))};}
          const status=await web('GET','/interactive-browser/status');
          console.log('CURRENT_BROWSER_HTTP='+status.status);
          console.log('CURRENT_BROWSER_ACTIVE='+Boolean(status.data.active));
          console.log('CURRENT_BROWSER_RESPONSIVE='+Boolean(status.data.responsive));
          if(status.status!==200||!status.data.active||!status.data.responsive)throw Error('BROWSER_UNAVAILABLE_PRESERVING_VAULT');
          const saved=await web('POST','/interactive-browser/save-vault',{});
          console.log('SAVE_VAULT_HTTP='+saved.status);
          console.log('SAVE_VAULT_PERSISTED='+Boolean(saved.data.persisted));
          console.log('SAVE_VAULT_COOKIE_COUNT='+String(saved.data.cookie_count||0));
          console.log('SAVE_VAULT_ERROR='+String(saved.data.error||'none'));
          console.log('SAVE_VAULT_DETAIL_CLASS='+String(saved.data.detail||'none'));
          const projects=await fetch('https://api.northflank.com/v1/projects',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json());
          const found=[];
          for(const p of projects.data?.projects||[]){
           const q=await fetch('https://api.northflank.com/v1/projects/'+encodeURIComponent(p.id)+'/services',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json());
           for(const s of q.data?.services||[])if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);
          }
          if(found.length!==1)throw Error('SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0],cp=new ApiClientInMemoryContextProvider();await cp.addContext({name:'read',token});const cli=new ApiClient(cp);
          const python=String.raw`
          import sys,json,time
          sys.path.insert(0,'/app/render-tiktok-worker')
          from browser_executor import _cdp
          field="input[placeholder*='Search for post description']"
          expr="""(()=>{const e=document.querySelector("input[placeholder*='Search for post description']");return e?{found:true,outer:e.parentElement?.parentElement?.outerHTML.slice(0,3500),value:e.value,posts:document.querySelectorAll('a[href*="/video/"]').length,path:location.pathname}:{found:false,path:location.pathname}})()"""
          v=_cdp('Runtime.evaluate',{'expression':expr,'returnByValue':True})
          data=(v.get('result') or {}).get('value') or {}
          print('SEARCH_CONTROL='+json.dumps(data,ensure_ascii=False)[:3800],flush=True)
          if not data.get('found') or data.get('path')!='/tiktokstudio/content':raise SystemExit('SEARCH_NOT_AVAILABLE')
          expr2="""(()=>{const el=document.querySelector("input[placeholder*='Search for post description']");el.focus();const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;setter.call(el,'Aristóteles');el.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:'Aristóteles'}));el.dispatchEvent(new Event('change',{bubbles:true}));return {value:el.value,focused:document.activeElement===el}})()"""
          v=_cdp('Runtime.evaluate',{'expression':expr2,'returnByValue':True})
          print('NATIVE_INPUT_EVENT='+json.dumps((v.get('result') or {}).get('value') or {},ensure_ascii=False),flush=True)
          def inspect(step):
           q="""(()=>{const body=(document.body?.innerText||'');return {value:document.querySelector("input[placeholder*='Search for post description']")?.value||'',allPostsHeader:body.slice(0,110),posts:document.querySelectorAll('a[href*="/video/"]').length,first:[...document.querySelectorAll('a[href*="/video/"]')].slice(0,8).map(e=>(e.innerText||'').trim().slice(0,100)),empty:/no posts|no results|nenhum resultado|no matching|couldn't find|no data/i.test(body),termInResults:body.toLowerCase().includes('aristóteles')}})()"""
           d=_cdp('Runtime.evaluate',{'expression':q,'returnByValue':True})
           print('SEARCH_'+step+'='+json.dumps((d.get('result') or {}).get('value') or {},ensure_ascii=False)[:1800],flush=True)
          time.sleep(7);inspect('BEFORE_ENTER')
          _cdp('Input.dispatchKeyEvent',{'type':'keyDown','key':'Enter','code':'Enter','windowsVirtualKeyCode':13})
          _cdp('Input.dispatchKeyEvent',{'type':'keyUp','key':'Enter','code':'Enter','windowsVirtualKeyCode':13})
          time.sleep(12);inspect('AFTER_ENTER')
          `;
          const result=await cli.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',python]});
          console.log('SEARCH_INSPECTION_EXIT='+String(result.commandResult?.exitCode));
          console.log('SEARCH_INSPECTION_RESULT='+String(result.stdOut||'').slice(0,9000).replace(/[\r\n]+/g,' | '));
          if(result.commandResult?.exitCode!==0)throw Error('SEARCH_INSPECTION_FAILED');
          if(saved.status!==200||!saved.data.persisted)throw Error('VAULT_SAVE_UNCONFIRMED');
          NODE
