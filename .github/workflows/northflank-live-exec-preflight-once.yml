name: Northflank browser live-patch safety preflight once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-live-exec-preflight-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Install official Northflank JavaScript client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Inspect live container without changing it
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN;
          if(!token||token.length<20)throw Error('NF_TOKEN_MISSING');
          const get=async(path)=>{
            const r=await fetch('https://api.northflank.com/v1'+path,{headers:{Authorization:'Bearer '+token}});
            if(!r.ok)throw Error('NF_API_HTTP_'+r.status);
            return r.json();
          };
          const root=(await get('/projects')).data?.projects||[];
          const found=[];
          for(const project of root){
            const services=(await get('/projects/'+encodeURIComponent(project.id)+'/services')).data?.services||[];
            for(const s of services)if(s.name==='anthares-tiktok-northflank')found.push([project.id,s.id||s.name]);
          }
          if(found.length!==1)throw Error('TARGET_NOT_UNIQUE_'+found.length);
          const [projectId,serviceId]=found[0];
          const cp=new ApiClientInMemoryContextProvider();
          await cp.addContext({name:'session',token});
          const client=new ApiClient(cp);
          const cmd=['/bin/sh','-c','printf "PROFILE_PATH="; readlink -f /tmp/anthares-interactive-profile; printf "PROFILE_PRESENT="; test -d /tmp/anthares-interactive-profile && echo yes || echo no; printf "CHROME_PID="; pgrep -f "remote-debugging-port=9223" | head -n 1; printf "GUNICORN_PROCESSES="; pgrep -fa "gunicorn.*service_with_browser" | wc -l; printf "MOUNT="; df -P /tmp/anthares-interactive-profile | tail -n 1 | awk "{print \\$1}"'];
          const result=await client.exec.execServiceCommand({projectId,serviceId},{command:cmd});
          console.log('NF_LIVE_EXEC_STATUS='+String(result.commandResult?.status));
          console.log('NF_LIVE_EXEC_EXIT_CODE='+String(result.commandResult?.exitCode));
          console.log('NF_LIVE_EXEC_OUTPUT='+String(result.stdOut||'').slice(0,800).replace(/[\r\n]+/g,' | '));
          console.log('NF_LIVE_EXEC_ERROR_CLASS='+String(result.stdErr||'').slice(0,130).replace(/[\r\n]+/g,' '));
          if(result.commandResult?.exitCode!==0)process.exit(2);
          NODE
