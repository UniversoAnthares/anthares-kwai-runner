name: Anthares Resilience Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'anthares-brouser/**'
      - 'anthares-reserva-browser/**'
      - 'cloudflare-ara-backup/**'
      - 'tools/anthares_resilience.py'
      - '.github/workflows/anthares-resilience-watchdog.yml'

permissions:
  contents: read

concurrency:
  group: anthares-resilience-watchdog
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHARES_BROWSER_PRIMARY_URL: ''
      ANTHARES_BROWSER_RESERVE_URL: https://anthares-reserva-browser.anthares1.workers.dev
      ANTHARES_RESERVA_CONTROL_URL: https://anthares-ara-backup.anthares1.workers.dev
      ANTHARES_CONTROL_URL: https://anthares-control.anthares1.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Validate resilience code
        run: |
          python -m py_compile tools/anthares_resilience.py
          node --check anthares-reserva-browser/src/index.js
      - name: Check AUTOCURA and CONTINUIDADE
        id: resilience
        run: |
          set -euo pipefail
          python tools/anthares_resilience.py | tee /tmp/anthares-resilience.json
          cat /tmp/anthares-resilience.json >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm independent emergency executor
        run: |
          echo 'GitHub-hosted runner is alive and independent of Render.'
          echo 'Persistent control and browser reserve use Cloudflare; Actions remains the finite-job emergency executor.'
