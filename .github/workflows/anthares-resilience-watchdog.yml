name: Anthares Resilience Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'anthares-brouser/**'
      - 'tools/anthares_resilience.py'
      - 'tools/execution_policy.py'
      - 'ci-hub/executor-routing.json'
      - 'ci-hub/provider-status.json'
      - 'ci-hub/CONTINUITY.md'
      - '.github/workflows/anthares-resilience-watchdog.yml'

permissions:
  contents: read

concurrency:
  group: anthares-resilience-watchdog
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHARES_BROWSER_PRIMARY_URL: ${{ vars.ANTHARES_BROWSER_PRIMARY_URL }}
      ANTHARES_BROWSER_PERSISTENT_RESERVE_URL: ${{ vars.ANTHARES_BROWSER_PERSISTENT_RESERVE_URL }}
      ANTHARES_RESILIENCE_REPORT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate resilience and execution policy
        run: |
          python -m py_compile tools/anthares_resilience.py tools/execution_policy.py
      - name: Enforce routing policy
        run: |
          python - <<'PY'
          import json
          routing=json.load(open('ci-hub/executor-routing.json',encoding='utf-8'))
          status=json.load(open('ci-hub/provider-status.json',encoding='utf-8'))
          assert routing['remote_control']['primary']=='anthares_remote'
          assert routing['remote_control']['surface']=='anthares_remote'
          assert routing['remote_control']['backend_priority']
          assert routing['remote_control']['current_selected_backend'] in routing['remote_control']['backend_priority']
          assert routing['remote_control']['allow_other_remote_surfaces'] is False
          browser=routing['browser_execution']
          assert browser.get('primary_surface', browser.get('primary'))=='anthares_browser'
          assert browser.get('exclusive_surface', True) is True
          assert browser['allow_direct_external_browser_fallbacks'] is False
          selected=browser.get('current_selected_backend')
          if selected:
              assert selected in browser.get('backend_priority',[])
              provider=routing.get('providers',{}).get(selected,{})
              assert provider.get('browser_backend_eligible') is True
          retired=('render','tinyfish','circleci','browserless','winremote','meshcentral','codespaces')
          for name in retired:
              assert routing['retired'][name]['active'] is False
              assert routing['providers'][name]['active'] is False
              assert status['providers'][name]['eligible'] is False
          assert all(name not in browser.get('backend_priority',[]) for name in retired)
          assert selected not in retired
          assert status['rules']['regression_check_required_each_round'] is True
          assert set(retired).issubset(set(status['rules']['retired_never_route']))
          print('ANTHARES_ROUTING_POLICY=PROVEN selected_browser_backend='+str(selected))
          PY
      - name: Report runtime continuity evidence available to this runner
        run: |
          set -euo pipefail
          python tools/anthares_resilience.py | tee /tmp/anthares-resilience.json
          cat /tmp/anthares-resilience.json >> "$GITHUB_STEP_SUMMARY"
      - name: Record architecture
        if: always()
        run: |
          echo 'Anthares Remote is the only remote-control surface. Anthares Browser is the only browser-automation surface.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Provider Chromium executors are backends behind Anthares Browser and are selected only after current readiness/quota proof.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Render, TinyFish, Browserless, WinRemote, MeshCentral, CircleCI and Codespaces are retired and must never be selected as operational fallbacks.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Missing live runtime evidence is reported rather than fabricated.' >> "$GITHUB_STEP_SUMMARY"
