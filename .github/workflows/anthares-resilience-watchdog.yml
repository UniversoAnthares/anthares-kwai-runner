name: Anthares Resilience Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'anthares-brouser/**'
      - 'tools/anthares_resilience.py'
      - '.github/workflows/anthares-resilience-watchdog.yml'

permissions:
  contents: read

concurrency:
  group: anthares-resilience-watchdog
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHARES_BROWSER_PRIMARY_URL: https://anthares-browser-qa-render.onrender.com
      ANTHARES_BROWSER_PERSISTENT_RESERVE_URL: ${{ vars.ANTHARES_BROWSER_PERSISTENT_RESERVE_URL }}
      ANTHARES_REMOTE_QUEUE_PROVIDER: github-private-issues
      ANTHARES_REMOTE_QUEUE_E2E_PROVEN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate resilience code
        run: python -m py_compile tools/anthares_resilience.py
      - name: Check AUTOCURA and CONTINUIDADE
        run: |
          set -euo pipefail
          python tools/anthares_resilience.py | tee /tmp/anthares-resilience.json
          cat /tmp/anthares-resilience.json >> "$GITHUB_STEP_SUMMARY"
      - name: Record architecture
        if: always()
        run: |
          echo 'Anthares Remote uses the proven private GitHub issue queue; Render and Cloudflare are not Remote runtime dependencies.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub-hosted Actions is a finite-job watchdog only. A persistent browser reserve must expose /health and /ready before it counts as equivalent browser continuity.' >> "$GITHUB_STEP_SUMMARY"
