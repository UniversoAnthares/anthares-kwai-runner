name: Anthares Resilience Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'anthares-brouser/**'
      - 'tools/anthares_resilience.py'
      - 'ci-hub/executor-routing.json'
      - 'ci-hub/provider-status.json'
      - 'ci-hub/CONTINUITY.md'
      - '.github/workflows/anthares-resilience-watchdog.yml'

permissions:
  contents: read

concurrency:
  group: anthares-resilience-watchdog
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHARES_BROWSER_PRIMARY_URL: ${{ vars.ANTHARES_BROWSER_PRIMARY_URL }}
      ANTHARES_BROWSER_PERSISTENT_RESERVE_URL: ${{ vars.ANTHARES_BROWSER_PERSISTENT_RESERVE_URL }}
      ANTHARES_RESILIENCE_REPORT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate resilience code
        run: python -m py_compile tools/anthares_resilience.py
      - name: Enforce routing policy
        run: |
          python - <<'PY'
          import json
          routing=json.load(open('ci-hub/executor-routing.json',encoding='utf-8'))
          status=json.load(open('ci-hub/provider-status.json',encoding='utf-8'))
          assert routing['remote_control']['primary']=='anthares_remote'
          assert routing['remote_control']['priority']==['anthares_remote']
          assert routing['remote_control']['allow_other_remotes'] is False
          assert routing['browser_execution']['primary']=='anthares_browser'
          assert routing['browser_execution']['priority']==['anthares_browser']
          assert routing['browser_execution']['allow_direct_external_browser_fallbacks'] is False
          for name in ('render','tinyfish','circleci','browserless'):
              assert routing['retired'][name]['active'] is False
              assert status['providers'][name]['eligible'] is False
          assert status['rules']['regression_check_required_each_round'] is True
          print('ANTHARES_ROUTING_POLICY=PROVEN')
          PY
      - name: Report runtime continuity evidence available to this runner
        run: |
          set -euo pipefail
          python tools/anthares_resilience.py | tee /tmp/anthares-resilience.json
          cat /tmp/anthares-resilience.json >> "$GITHUB_STEP_SUMMARY"
      - name: Record architecture
        if: always()
        run: |
          echo 'Anthares Remote is the only remote-control surface. Anthares Browser is the only browser-automation surface.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Browserless, TinyFish, Render and CircleCI are retired/superseded and must never be selected as fallbacks.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This finite GitHub job cannot prove a live Anthares Remote heartbeat unless external evidence is injected. Missing runtime evidence is reported, not fabricated.' >> "$GITHUB_STEP_SUMMARY"
