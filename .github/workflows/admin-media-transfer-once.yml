name: Admin media transfer once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-media-transfer-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    # GitHub-hosted: no PC runner, Windows path or persistent local media.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download and validate prebuilt clip on the hosted runner
        shell: bash
        env:
          MEDIA_URL: https://raw.githubusercontent.com/UniversoAnthares/anthares-kwai-runner/media-transfer-tiktok-9CIk-I_3VhM-8-98/transfer-media/tiktok_9CIk-I_3VhM_8_98.mp4
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/tiktok_9CIk-I_3VhM_8_98.mp4"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 --output "$FILE" "$MEDIA_URL"
          test "$(stat -c%s "$FILE")" -eq 11398993
          printf '%s  %s\n' '5a43c90508464c016e3f26f4cf17c04ca9bfa3e9ec9afb7bd160e7a740b395e9' "$FILE" | sha256sum --check --status
          echo 'MEDIA_TRANSFER_SHA256=VERIFIED'
          echo 'MEDIA_TRANSFER_BYTES=11398993'
      - name: Upload immutable clip artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-9CIk-I_3VhM-8-98-validated
          path: ${{ runner.temp }}/tiktok_9CIk-I_3VhM_8_98.mp4
          if-no-files-found: error
          retention-days: 7
