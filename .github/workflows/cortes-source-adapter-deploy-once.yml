name: CORTES source adapter deploy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-source-adapter-deploy-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_PROJECT_ID: '87361776'
      EXPECTED_WP_COMMIT: 'aa662d87792466983c62d383fac5f8a992ae5e3f'
    steps:
      - name: Fetch protected deployment credentials from GitLab
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITLAB_TOKEN:-}" || { echo '::error::GITLAB_TOKEN is not configured'; exit 2; }
          python3 - <<'PY'
          import json, os, sys, urllib.request
          token=os.environ['GITLAB_TOKEN']; project=os.environ['GITLAB_PROJECT_ID']
          req=urllib.request.Request(f'https://gitlab.com/api/v4/projects/{project}/variables?per_page=100',headers={'PRIVATE-TOKEN':token,'User-Agent':'anthares-cortes-source-adapter-deploy'})
          with urllib.request.urlopen(req,timeout=30) as r: rows=json.load(r)
          vals={str(x.get('key')):str(x.get('value') or '') for x in rows}
          required=['ANTHARES_QA_SSH_KEY','ANTHARES_QA_SSH_HOST','ANTHARES_QA_SSH_USER','GITHUB_MIRROR_TOKEN']
          missing=[k for k in required if not vals.get(k)]
          if missing: print('::error::Missing GitLab deployment variables: '+','.join(missing)); sys.exit(3)
          selected={k:vals[k] for k in required}; selected['ANTHARES_QA_SSH_PORT']=vals.get('ANTHARES_QA_SSH_PORT') or '65002'
          for value in selected.values():
              if value: print('::add-mask::'+value.replace('\r','').replace('\n','%0A'))
          json.dump(selected,open('/tmp/cortes-vars.json','w',encoding='utf-8'))
          PY
      - name: Prepare exact private WordPress source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/cortes-vars.json')); open('/tmp/github-token','w').write(v['GITHUB_MIRROR_TOKEN'])
          PY
          chmod 600 /tmp/github-token
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$(cat /tmp/github-token)" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git clone --quiet --no-checkout https://github.com/UniversoAnthares/anthares-wordpress.git /tmp/anthares-wordpress
          cd /tmp/anthares-wordpress
          git checkout --quiet "$EXPECTED_WP_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_WP_COMMIT"
          test -f anthares-clipper/cortes-source-adapter.php
          grep -q "cortes-source-adapter.php" anthares-clipper/anthares-clipper.php
          rm -f ~/.git-credentials /tmp/github-token
      - name: Deploy atomically and validate adapter on live WordPress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/cortes-vars.json'))
          open('/tmp/anthares_qa','w').write(v['ANTHARES_QA_SSH_KEY']); open('/tmp/ssh_host','w').write(v['ANTHARES_QA_SSH_HOST']); open('/tmp/ssh_user','w').write(v['ANTHARES_QA_SSH_USER']); open('/tmp/ssh_port','w').write(v['ANTHARES_QA_SSH_PORT'])
          PY
          chmod 600 /tmp/anthares_qa
          host="$(cat /tmp/ssh_host)"; user="$(cat /tmp/ssh_user)"; port="$(cat /tmp/ssh_port)"
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "$port" "$host" >> ~/.ssh/known_hosts 2>/dev/null
          remote_tmp="/tmp/anthares-clipper-source-adapter-${GITHUB_RUN_ID}"
          ssh -p "$port" -i /tmp/anthares_qa -o IdentitiesOnly=yes "$user@$host" "rm -rf '$remote_tmp'"
          scp -r -P "$port" -i /tmp/anthares_qa -o IdentitiesOnly=yes /tmp/anthares-wordpress/anthares-clipper "$user@$host:$remote_tmp"
          ssh -p "$port" -i /tmp/anthares_qa -o IdentitiesOnly=yes "$user@$host" "REMOTE_SRC='$remote_tmp' bash -se" <<'REMOTE'
          set -euo pipefail
          SITE="$HOME/domains/anthares.us/public_html"; LIVE="$SITE/wp-content/plugins/anthares-clipper"; SRC="$REMOTE_SRC"; PHP=/opt/alt/php85/usr/bin/php; WP=/usr/local/bin/wp
          test -d "$SITE"; test -f "$SRC/cortes-source-adapter.php"
          find "$SRC" -type f -name '*.php' -print0 | xargs -0 -n1 "$PHP" -l >/tmp/cortes-source-adapter-php-lint.txt
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"; staged="$SITE/wp-content/plugins/anthares-clipper.deploying-$stamp"; backup="$SITE/wp-content/plugins/anthares-clipper.backup-$stamp"
          mv "$SRC" "$staged"; if [ -d "$LIVE" ]; then mv "$LIVE" "$backup"; fi; mv "$staged" "$LIVE"
          cd "$SITE"; "$PHP" "$WP" plugin activate anthares-clipper --quiet || true
          "$PHP" "$WP" eval '
            $r=rest_get_server()->get_routes();
            $o=[
              "plugin_version"=>defined("ANTHARES_CLIPPER_VERSION")?ANTHARES_CLIPPER_VERSION:"missing",
              "adapter_fn"=>function_exists("anthares_cortes_source_cycle_active"),
              "route_cycle"=>isset($r["/anthares/v1/cortes/source-cycle"]),
              "route_regular"=>isset($r["/anthares/v1/cortes/regular-sources"]),
              "route_state"=>isset($r["/anthares/v1/cortes/state"]),
              "route_registry"=>isset($r["/anthares/v1/clipper-live/registry"])
            ];
            if ($o["plugin_version"]!=="2.7.3" || !$o["adapter_fn"] || !$o["route_cycle"] || !$o["route_regular"] || !$o["route_state"] || !$o["route_registry"]) { fwrite(STDERR,"CORTES_SOURCE_ADAPTER_VALIDATION_FAILED ".wp_json_encode($o)."\n"); exit(7); }
            echo "CORTES_SOURCE_ADAPTER_STATE=".wp_json_encode($o,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          '
          echo -n 'CORTES_SOURCE_ADAPTER_SHA='; sha256sum "$LIVE/cortes-source-adapter.php" | awk '{print $1}'
          echo 'CORTES_SOURCE_ADAPTER_DEPLOY=PROVEN'
          REMOTE
          rm -f /tmp/anthares_qa /tmp/ssh_host /tmp/ssh_user /tmp/ssh_port /tmp/cortes-vars.json
      - name: Public smoke
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cortes.html -w '%{http_code}' https://anthares.us/cortes/)
          echo "CORTES_PUBLIC_HTTP=$code"; test "$code" = 200
