name: GitLab sync auth probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gitlab-sync-auth-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GL_AUTH: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - name: Check configured credential exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GL_AUTH:-}"
          echo 'GITLAB_SYNC_CREDENTIAL_PRESENT=PASS'
