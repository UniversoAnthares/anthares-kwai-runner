name: Anthares Executor - Contract Validation
on:
  push:
    branches:
      - feature/anthares-reserva-ci
    paths:
      - 'anthares-executor/**'
      - '.github/workflows/anthares-executor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: anthares-executor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_executor
      - run: python -m compileall -q executor.py controller_client.py
