name: Kwai proporcional até 23h - invariantes
on:
  push:
    paths:
      - 'infra/neon-cortes-queue/index.mjs'
      - 'infra/neon-cortes-queue/kwai-*.mjs'
      - 'tools/kwai_unproven_reconcile_policy.py'
      - 'tools/kwai_native_cortes.py'
      - 'tools/kwai_canonical_runtime_regression.py'
      - 'tools/cortes_neon_queue_client.py'
      - 'tools/kwai_phone_share_clipboard.py'
      - 'tools/kwai_physical_public_proof.py'
      - 'tools/kwai_physical_queue_daemon.py'
      - 'tools/kwai_notification_overlay_regression.py'
      - 'tools/kwai_native_stage_regression.py'
      - 'tools/kwai_device_failover_worker.py'
      - 'tools/kwai_timeout_precommit_regression.py'
      - '.github/workflows/kwai-proportional-pacing.yml'
  pull_request:
    paths:
      - 'infra/neon-cortes-queue/index.mjs'
      - 'tools/kwai_native_cortes.py'
      - 'tools/kwai_canonical_runtime_regression.py'
      - 'tools/cortes_neon_queue_client.py'
      - 'tools/kwai_phone_share_clipboard.py'
      - 'tools/kwai_physical_public_proof.py'
      - 'tools/kwai_physical_queue_daemon.py'
      - 'tools/kwai_notification_overlay_regression.py'
      - 'tools/kwai_device_failover_worker.py'
      - 'tools/kwai_timeout_precommit_regression.py'
      - 'infra/neon-cortes-queue/kwai-pacing-*.mjs'
      - '.github/workflows/kwai-proportional-pacing.yml'
permissions:
  contents: read
jobs:
  verify_kwai_2300_rule:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployed entrypoint syntax
        run: node --check infra/neon-cortes-queue/index.mjs
      - name: Verify two account gates and proportional intervals
        run: node --test infra/neon-cortes-queue/kwai-pacing-policy.test.mjs infra/neon-cortes-queue/kwai-pacing-integration.test.mjs infra/neon-cortes-queue/kwai-oneoff-public-reconcile.test.mjs infra/neon-cortes-queue/kwai-unproven-discard.test.mjs infra/neon-cortes-queue/kwai-captionless-proof.test.mjs infra/neon-cortes-queue/kwai-wp-reconciled-callback.test.mjs infra/neon-cortes-queue/kwai-rls-scope.test.mjs
      - name: Check bounded-reconcile Python helper syntax
        run: python3 -c "import ast,pathlib;ast.parse(pathlib.Path('tools/kwai_unproven_reconcile_policy.py').read_text())"
      - name: Verify MediaStore fallback without Android or media files
        run: python3 -B tools/kwai_native_stage_regression.py
      - name: Verify Android editor timeout safety and device failover classifier
        run: python3 -B tools/kwai_timeout_precommit_regression.py
      - name: Check both Kwai app notification overlays and exact account profile
        run: python3 -B tools/kwai_notification_overlay_regression.py
      - name: Verify canonical Windows daemon and share/public two-stage proof
        run: python3 -B tools/kwai_canonical_runtime_regression.py
