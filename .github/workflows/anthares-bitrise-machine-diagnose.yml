name: Anthares Bitrise machine diagnosis (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/anthares-bitrise-machine-diagnose.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect authenticated Bitrise repository config and machine metadata
        env:
          BITRISE_API_TOKEN: ${{ secrets.BITRISE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error,sys
          key=os.getenv("BITRISE_API_TOKEN","").strip()
          if not key:
              print("BITRISE_MACHINE_DIAG=SECRET_MISSING")
              sys.exit(1)
          base="https://api.bitrise.io/v0.1/apps/ef06f940-ffc7-4e37-b935-93ad06d8faeb"
          def get(path):
              q=urllib.request.Request(base+path,headers={"Authorization":key,"Accept":"application/json"})
              with urllib.request.urlopen(q,timeout=18) as response:return json.load(response)
          try:
              app=get("")
              data=app.get("data") or {}
              expected="ef06f940-ffc7-4e37-b935-93ad06d8faeb"
              if data.get("slug")!=expected:
                  print("BITRISE_MACHINE_DIAG=APP_MISMATCH");sys.exit(1)
              y=get("/bitrise.yml")
              print("BITRISE_YAML_API_STATUS=AUTHENTICATED")
              for k,v in y.items():
                  if "yaml" not in k.lower() and "config" not in k.lower():continue
                  if isinstance(v,str):
                      machines=re.findall(r"(?m)^\s*machine_type_id:\s*['\"]?([a-zA-Z0-9.\-_]+)",v)
                      print("BITRISE_YAML_MACHINE_IDS="+(",".join(sorted(set(machines))) if machines else "NO_MACHINE_ID"))
                  elif isinstance(v,dict):
                      print("BITRISE_YAML_CONFIG_SHAPE=OBJECT")
              print("BITRISE_APP_STACK_PRESENT="+str(bool(data.get("stack_identifier"))))
              print("BITRISE_APP_MACHINE_FIELD_PRESENT="+str(bool(data.get("machine_type_id"))))
              print("BITRISE_APP_MACHINE_FIELD="+str(data.get("machine_type_id") or "NOT_EXPOSED")[:70])
          except urllib.error.HTTPError as e:
              print("BITRISE_MACHINE_DIAG_HTTP="+str(e.code));sys.exit(1)
          except (ValueError,TypeError,KeyError,urllib.error.URLError):
              print("BITRISE_MACHINE_DIAG=READ_FAILED");sys.exit(1)
          PY
