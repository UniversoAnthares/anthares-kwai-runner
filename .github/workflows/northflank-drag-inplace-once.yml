name: One-time in-place Northflank mouse drag upgrade without Chromium restart
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-drag-inplace-once.yml']
permissions:
  contents: read
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Install official Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Patch only matching live browser executor, reload Gunicorn, preserve Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const token=process.env.NF_TOKEN,shared=process.env.ARA_SHARED;
          if(!token||token.length<20||!shared||shared.length<20)throw Error('AUTH_NOT_CONFIGURED');
          const get=async(path)=>{
           const response=await fetch('https://api.northflank.com/v1'+path,{headers:{Authorization:'Bearer '+token}});
           if(!response.ok)throw Error('NF_LIST_HTTP_'+response.status);
           return response.json();
          };
          const root=(await get('/projects')).data?.projects||[];
          const found=[];
          for(const project of root){
           const services=(await get('/projects/'+encodeURIComponent(project.id)+'/services')).data?.services||[];
           for(const svc of services)if(svc.name==='anthares-tiktok-northflank')found.push([project.id,svc.id||svc.name]);
          }
          if(found.length!==1)throw Error('NF_SERVICE_NOT_UNIQUE_'+found.length);
          const endpoint='https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run';
          const state=await fetch(endpoint+'/interactive-browser/status',{headers:{Authorization:'Bearer '+shared}}).then(r=>r.json());
          if(!(state.ok&&state.active&&state.responsive))throw Error('ACTIVE_BROWSER_NOT_READY_ABORT');
          const context=new ApiClientInMemoryContextProvider();
          await context.addContext({name:'live',token});
          const client=new ApiClient(context);
          const [projectId,serviceId]=found[0];
          const script=String.raw`import os,sys,time,base64,hashlib,signal,subprocess
          from pathlib import Path
          src=Path('/app/render-tiktok-worker/browser_executor.py')
          backup=Path('/tmp/anthares-browser-executor.before-single-cdp.py')
          new=base64.b64decode('')
          expected='ad7630e73528217aa4f16f6c7beb5d30e61d082c'
          if not src.is_file():raise SystemExit('SOURCE_FILE_MISSING')
          old=src.read_bytes()
          before_sha=hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()
          if before_sha!=expected:raise SystemExit('SOURCE_VERSION_DRIFT_SAFE_STOP')
          compile(new.decode('utf-8'),str(src),'exec')
          if b'def _cdp_drag_single_session(' not in new:raise SystemExit('PATCH_MISSING')
          if b'drag_backend="single_cdp_websocket_v2"' not in new:raise SystemExit('STATUS_VERSION_MISSING')
          procs=subprocess.check_output(['ps','-eo','pid,ppid,comm,args'],text=True)
          candidates=[]
          for line in procs.splitlines()[1:]:
              parts=line.strip().split(None,3)
              if len(parts)!=4:continue
              pid,ppid,comm,args=parts
              if not pid.isdigit() or not ppid.isdigit():continue
              if 'gunicorn' in comm.lower() and 'service_with_browser' in args:
                  candidates.append((int(pid),int(ppid),args))
          ids={p for p,_,_ in candidates}
          masters=[(p,ppid) for p,ppid,_ in candidates if ppid not in ids]
          if len(masters)!=1:raise SystemExit('GUNICORN_MASTER_AMBIGUOUS_'+str(len(masters)))
          master=masters[0][0]
          def chrome_pids():
              out=[]
              for proc in Path('/proc').iterdir():
                  if not proc.name.isdigit():continue
                  try:
                      args=(proc/'cmdline').read_bytes()
                      if b'--remote-debugging-port=9223' in args and b'--user-data-dir=/tmp/anthares-interactive-profile' in args:
                          out.append(int(proc.name))
                  except Exception:pass
              return sorted(out)
          cp_before=chrome_pids()
          if not cp_before:raise SystemExit('CHROMIUM_NOT_RUNNING_SAFE_STOP')
          if not backup.exists():
              backup.write_bytes(old)
              os.chmod(backup,0o600)
          if backup.read_bytes()!=old:raise SystemExit('BACKUP_MISMATCH_SAFE_STOP')
          tmp=src.with_suffix('.drag-hotfix.tmp')
          tmp.write_bytes(new)
          os.chmod(tmp,src.stat().st_mode&0o777)
          os.replace(tmp,src)
          os.kill(master,signal.SIGHUP)
          time.sleep(5)
          cp_after=chrome_pids()
          print('CHROMIUM_SAME_PID='+str(bool(set(cp_before)&set(cp_after))))
          print('GUNICORN_HUP_SENT=1')
          print('CODE_PATCHED=1')
          if not(set(cp_before)&set(cp_after)):raise SystemExit('CHROMIUM_PID_CHANGED')
          `;
          const result=await client.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',script]});
          console.log('NF_HOTFIX_COMMAND_STATUS='+String(result.commandResult?.status));
          console.log('NF_HOTFIX_EXIT='+String(result.commandResult?.exitCode));
          console.log('NF_HOTFIX_SUMMARY='+String(result.stdOut||'').slice(0,1000).replace(/[\r\n]+/g,' | '));
          console.log('NF_HOTFIX_ERROR='+String(result.stdErr||'').slice(0,250).replace(/[\r\n]+/g,' '));
          if(result.commandResult?.exitCode!==0)throw Error('NF_HOTFIX_REJECTED');
          let verified=false;
          for(let i=0;i<8;i++){
           await new Promise(done=>setTimeout(done,1500));
           try {
            const r=await fetch(endpoint+'/interactive-browser/status',{headers:{Authorization:'Bearer '+shared},signal:AbortSignal.timeout(9000)});
            if(!r.ok)continue;
            const v=await r.json();
            if(v.drag_backend==='single_cdp_websocket_v2'&&v.active&&v.responsive){verified=true;break;}
           }catch{}
          }
          console.log('NF_NEW_BACKEND_VERIFIED='+String(verified));
          if(!verified)throw Error('NF_CODE_RELOADED_BUT_STATUS_UNVERIFIED');
          
          NODE
