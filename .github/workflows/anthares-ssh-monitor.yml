name: Anthares SSH Recovery Monitor
on:
  schedule:
    - cron: '2-57/5 * * * *'
  # Safety net: a proved scheduled workflow can wake this monitor when
  # GitHub delays/drops the monitor's own schedule event.
  workflow_run:
    workflows: ['Anthares Core Supervisor']
    types: [completed]
    branches: [main]
  # A one-time verification of automatic startup after monitor revisions.
  push:
    branches: [main]
    paths:
      - '.github/workflows/anthares-ssh-monitor.yml'
      - 'anthares-remote-agent/ssh-admission.py'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect trigger without dispatching recovery
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  # Do not block the separate SSH recovery workflow while monitor sleeps
  # through its grace interval.
  group: anthares-ssh-monitor-desktop-ftdk0hp
  cancel-in-progress: false
jobs:
  monitor:
    if: >-
      github.repository == 'UniversoAnthares/anthares-kwai-runner' &&
      vars.ANTHARES_SSH_AUTORECOVERY_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'schedule' &&
         github.event.workflow_run.head_repository.full_name == 'UniversoAnthares/anthares-kwai-runner'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Trigger independent SSH only when public heartbeat is absent
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run && 'true' || 'false' }}
        run: python3 anthares-remote-agent/ssh-admission.py monitor
