name: Anthares Browser restore TikTok session in Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/anthares-browser-cloudflare-tiktok-restore.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: anthares-browser-cloudflare-tiktok-restore
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ANTHARES_RESERVA_TOKEN: ${{ secrets.ANTHARES_RESERVA_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Restore central session to first-party Cloudflare Browser and check identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse,hashlib,subprocess,tempfile
          base='https://anthares-reserva-browser.anthares1.workers.dev'
          sep='&' if '?' in os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] else '?'
          u=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+sep+urllib.parse.urlencode({'audience':'https://anthares-control.anthares1.workers.dev'})
          with urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}),timeout=20) as r:
              jwt=json.load(r)['value']
          with urllib.request.urlopen(urllib.request.Request('https://anthares-control.anthares1.workers.dev/tiktok/session-state',headers={'Authorization':'Bearer '+jwt}),timeout=25) as r:
              state=json.load(r)
          cookies=(state.get('state') or {}).get('cookies') or []
          if not state.get('available') or not cookies: raise SystemExit('CENTRAL_TIKTOK_SESSION_ABSENT')
          token=os.environ.get('ANTHARES_RESERVA_TOKEN','')
          if not token and os.environ.get('ARA_SHARED'):
              token=hashlib.sha256(('anthares-reserva-browser-v1:'+os.environ['ARA_SHARED']).encode()).hexdigest()
          if not token: raise SystemExit('RESERVE_AUTH_MISSING')
          def call(path,method='GET',payload=None,timeout=100):
              args=['curl','-sS','--max-time',str(timeout),'-A','AntharesBrowserRecovery/1.0','-o','/tmp/anthares-recovery-response.json','-w','%{http_code}','-H','Authorization: Bearer '+token]
              if method!='GET':args+=['-X',method]
              if payload is not None:
                  with open('/tmp/anthares-recovery-request.json','w') as f:json.dump(payload,f)
                  args+=['-H','Content-Type: application/json','--data-binary','@/tmp/anthares-recovery-request.json']
              p=subprocess.run(args+[base+path],capture_output=True,text=True)
              code=int(p.stdout) if p.stdout.isdigit() else 0
              try: response=json.load(open('/tmp/anthares-recovery-response.json'))
              except: response={}
              return code,response
          code,health=call('/health')
          if code!=200 or not health.get('browser_binding'): raise SystemExit('CLOUDFLARE_BROWSER_NOT_READY')
          print('CLOUDFLARE_BROWSER_HEALTH=OK')
          code,imported=call('/tiktok/import','POST',{'state':state['state']},60)
          print('SESSION_IMPORT_HTTP='+str(code))
          print('SESSION_IMPORT_STORED='+str(imported.get('stored')))
          if code!=200 or not imported.get('stored'): raise SystemExit('SESSION_IMPORT_FAILED')
          code,verified=call('/tiktok/session/verify','POST',{},150)
          print('SESSION_VERIFY_HTTP='+str(code))
          for field in ('ok','persisted_state','identity_verified','studio_verified','session_state','restore_status','error'):
              print('SESSION_'+field.upper()+'='+str(verified.get(field)))
          if code!=200 or verified.get('identity_verified') is not True or verified.get('studio_verified') is not True:
              raise SystemExit('TIKTOK_CLOUDFLARE_IDENTITY_NOT_PROVEN')
          print('ANTHARES_BROWSER_CLOUDFLARE_TIKTOK_RECOVERY=PROVEN')
          PY
