name: One-time Northflank sandbox free memory budget check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/northflank-free-memory-check-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Read service compute plans and free credit balance without mutations
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const key=process.env.NF_TOKEN;if(!key||key.length<20)throw Error('NF_AUTH_MISSING');
          const host='https://api.northflank.com/v1';
          async function get(path){let r=await fetch(host+path,{headers:{Authorization:'Bearer '+key},signal:AbortSignal.timeout(20000)});let data=await r.json().catch(()=>({}));return {http:r.status,body:data.data||{},raw:data};}
          const projects=await get('/projects');if(projects.http!==200)throw Error('NF_PROJECTS_'+projects.http);
          let total=0,plans=[],target=null;
          for(const project of projects.body.projects||[]){
           const res=await get('/projects/'+encodeURIComponent(project.id)+'/services');
           if(res.http!==200)continue;
           for(const item of res.body.services||[]){
            const d=await get('/projects/'+encodeURIComponent(project.id)+'/services/'+encodeURIComponent(item.id||item.name));
            if(d.http!==200){console.log('SERVICE_READ_HTTP='+d.http);continue;}
            const obj=d.body,plan=obj.billing?.deploymentPlan||'unknown',instances=Number(obj.deployment?.instances||obj.instances||1);
            console.log('SERVICE_RESOURCE_PLAN='+String(item.name||obj.name).slice(0,55)+' plan='+plan+' instances='+instances);
            plans.push({name:item.name||obj.name,plan,instances,projectId:project.id,serviceId:item.id||item.name});
            if(item.name==='anthares-tiktok-northflank')target={plan,instances,projectId:project.id,serviceId:item.id||item.name};
            total++;
           }
          }
          console.log('SERVICE_COUNT='+total);
          console.log('TARGET_PLAN='+String(target?.plan||'unknown'));
          if(!target)throw Error('TARGET_NOT_FOUND');
          for(const path of ['/billing/credit-balance','/billing/usage']){
           const d=await get(path);console.log('BILLING_'+path.split('/').pop()+'_HTTP='+d.http);
           if(d.http===200){
            const o=d.body;
            const numeric={};for(const [k,v] of Object.entries(o))if(/credit|balance|total|cost|usage|remaining|amount/i.test(k)&&typeof v!=='object')numeric[k]=v;
            console.log('BILLING_'+path.split('/').pop()+'_FIELDS='+Object.keys(o).slice(0,18).join(','));
            console.log('BILLING_'+path.split('/').pop()+'_NUMERIC='+JSON.stringify(numeric).slice(0,700));
           }
          }
          console.log('READ_ONLY=1');
          NODE
