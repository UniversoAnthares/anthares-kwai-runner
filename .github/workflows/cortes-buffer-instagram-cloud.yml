name: CORTES Instagram - automatic Buffer cloud publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-buffer-instagram-cloud.yml'
      - 'tools/cortes_buffer_instagram_cloud.py'
      - 'tools/cortes_queue_ha.py'
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: cortes-instagram-buffer-cloud-producer
  cancel-in-progress: false
jobs:
  publish-and-reconcile:
    # Enable only after the cloud worker and canonical account are authenticated.
    if: ${{ vars.CORTES_INSTAGRAM_BUFFER_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Buffer key from Anthares Secrets without logging it
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            0ec34434-3b81-4cc6-93af-b4ea00d11733 > BUFFER_API_KEY
      - name: Publish one eligible Instagram Reel with Neon fencing
        shell: bash
        env:
          ANTHARES_SOCIAL_COMMIT: '1'
          CORTES_QUEUE_PRIMARY: neon
          CORTES_IG_IMMEDIATE_UNTIL_UTC: '2026-10-22T09:00:00Z'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u tools/cortes_buffer_instagram_cloud.py
          test $? -eq 0
