name: CORTES Instagram - automatic Buffer cloud publisher
on:
  schedule:
    # Twice per hour during weekdays, 11:00-22:30 America/Campo_Grande.
    # The existing Neon shared Buffer quota caps actual sends at 20 per weekday.
    - cron: '0,30 15-23 * * 1-5'
    - cron: '0,30 0-2 * * 2-6'
  workflow_dispatch:
    inputs:
      reconcile_only:
        description: 'Only reconcile previously scheduled posts; never create a new post'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  # Readback-only can safely run while the publisher queue is busy; Neon CAS
  # keeps confirmation idempotent. Frequent schedules must not cancel QA proof.
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true) && 'cortes-instagram-buffer-readback-only' || 'cortes-instagram-buffer-cloud-producer' }}
  cancel-in-progress: false
jobs:
  publish-and-reconcile:
    # Manual readback is allowed under pause; routine publication requires explicit enablement.
    # Missing or true pause variable fails closed for schedule and ordinary dispatch.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true) || vars.CORTES_INSTAGRAM_BUFFER_PAUSED == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Buffer key from Anthares Secrets without logging it
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            0ec34434-3b81-4cc6-93af-b4ea00d11733 > BUFFER_API_KEY
      - name: Reconcile Instagram receipts or publish one eligible Reel with Neon fencing
        shell: bash
        env:
          ANTHARES_SOCIAL_COMMIT: ${{ (github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true) && '0' || '1' }}
          CORTES_RECONCILE_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true) && '1' || '0' }}
          CORTES_QUEUE_PRIMARY: neon
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u tools/cortes_buffer_instagram_cloud.py
          test $? -eq 0
