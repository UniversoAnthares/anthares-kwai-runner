name: CORTES Instagram - automatic Buffer cloud publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-buffer-instagram-cloud.yml'
      - 'tools/cortes_buffer_instagram_cloud.py'
      - 'tools/cortes_queue_ha.py'
  schedule:
    - cron: '8 */3 * * *'
  workflow_dispatch:
    inputs:
      reconcile_only:
        description: 'Only reconcile previously scheduled posts; never create a new post'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  # Readback-only can safely run while the publisher queue is busy; Neon CAS
  # keeps confirmation idempotent. Frequent schedules must not cancel QA proof.
  group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'AOI16_BUFFER_ERROR_CAUSE_ONCE'))) && 'cortes-instagram-buffer-readback-only' || 'cortes-instagram-buffer-cloud-producer' }}
  cancel-in-progress: false
jobs:
  publish-and-reconcile:
    # Allow manual reconcile or one uniquely marked readback push under the pause.
    # Scheduled and ordinary dispatches require an explicit unpause; missing variable fails closed.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'AOI16_BUFFER_ERROR_CAUSE_ONCE')) || vars.CORTES_INSTAGRAM_BUFFER_PAUSED == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Buffer key from Anthares Secrets without logging it
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: us
          secrets: |
            0ec34434-3b81-4cc6-93af-b4ea00d11733 > BUFFER_API_KEY
      - name: Reconcile Instagram receipts or publish one eligible Reel with Neon fencing
        shell: bash
        env:
          ANTHARES_SOCIAL_COMMIT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'AOI16_BUFFER_ERROR_CAUSE_ONCE'))) && '0' || '1' }}
          CORTES_RECONCILE_ONLY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.reconcile_only == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'AOI16_BUFFER_ERROR_CAUSE_ONCE'))) && '1' || '0' }}
          CORTES_QUEUE_PRIMARY: neon
          CORTES_IG_IMMEDIATE_UNTIL_UTC: '2026-10-22T09:00:00Z'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u tools/cortes_buffer_instagram_cloud.py
          test $? -eq 0
