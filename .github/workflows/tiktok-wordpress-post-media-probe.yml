name: TikTok WordPress Post Media Probe

on:
  push:
    branches: [main]
    paths:
      - '.tiktok-wordpress-post-media-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect public WordPress search and rendered page media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,json,re,urllib.parse,urllib.request,urllib.error
          base='https://anthares.us'
          headers={'User-Agent':'Mozilla/5.0 AntharesCanaryPostProbe/2','Accept':'application/json,text/html;q=0.9,*/*;q=0.5'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return int(getattr(r,'status',200)),r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e: return int(e.code),e.read().decode('utf-8','replace')

          q=urllib.parse.urlencode({'search':'O Último Pedido de um Homem Morto','per_page':100,'type':'post','subtype':'any'})
          code,raw=get(base+'/wp-json/wp/v2/search?'+q)
          print(json.dumps({'WP_SEARCH_HTTP':code,'bytes':len(raw)},sort_keys=True))
          if code==200:
              try: rows=json.loads(raw)
              except Exception: rows=[]
              safe=[]
              for r in rows if isinstance(rows,list) else []:
                  if isinstance(r,dict): safe.append({k:r.get(k) for k in ('id','title','url','type','subtype')})
              print(json.dumps({'WP_SEARCH_RESULTS':safe},ensure_ascii=False,sort_keys=True))

          pages=[base+'/ultimo-pedido-homem-morto/',base+'/analise-conto-siga-as-lagartixas/']
          all_media=[]
          for page in pages:
              c,body=get(page)
              decoded=html.unescape(body).replace('\\/','/')
              urls=re.findall(r'https?://[^\s"\'<>]+',decoded)
              uploads=[]
              for u in urls:
                  u=u.rstrip(').,;')
                  if '/wp-content/uploads/' in u and u not in uploads: uploads.append(u)
              media=[u for u in uploads if re.search(r'\.(?:mp4|webm|m4v|mov|mp3|m4a|wav)(?:\?|$)',u,re.I)]
              ids=sorted(set(re.findall(r'(?:youtube\.com/(?:watch\?v=|embed/)|youtu\.be/)([\w-]{6,})',decoded,re.I)))
              print(json.dumps({'PAGE':page,'http':c,'bytes':len(body),'upload_count':len(uploads),'media_count':len(media),'youtube_ids':ids,'has_uoh_id':'uohL105_5bg' in decoded,'media_urls':media[:30]},ensure_ascii=False,sort_keys=True))
              all_media.extend(media)
          seen=[]
          for u in all_media:
              if u in seen: continue
              seen.append(u)
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AntharesCanaryPostProbe/2'},method='HEAD')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      print(json.dumps({'MEDIA_HEAD':{'url':u,'http':int(getattr(r,'status',200)),'content_type':r.headers.get('content-type'),'content_length':r.headers.get('content-length')}},sort_keys=True))
              except Exception as e: print(json.dumps({'MEDIA_HEAD':{'url':u,'error':type(e).__name__}},sort_keys=True))
          if seen: print('WORDPRESS_PAGE_MEDIA=FOUND')
          else: print('WORDPRESS_PAGE_MEDIA=ABSENT')
          PY
