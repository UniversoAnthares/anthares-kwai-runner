name: X Publication Reliability Tests
on:
  pull_request:
    paths:
      - 'tools/x_publication_safety.py'
      - 'tools/x_cloud_issue_consumer.py'
      - 'tools/x_issue_publisher.py'
      - 'tools/x_auto_plan.py'
      - 'tools/x_restore_youtube_cookies.py'
      - 'tools/x_notify_qa.py'
      - 'infra/x_durable_ledger.py'
      - 'tests/test_x_publication_safety.py'
      - 'tests/test_x_cloud_issue_consumer.py'
      - 'tests/test_x_issue_publisher.py'
      - 'tests/test_x_auto_plan.py'
      - 'x_cloud_prepare.py'
      - 'x_cloud_render.py'
      - 'x_real_fullflow_once.py'
      - 'infra/x_runtime_worker.py'
      - 'infra/x_render_worker_v3.py'
      - '.github/workflows/x-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax without posting
        run: python -m compileall -q tools tests x_cloud_prepare.py x_cloud_render.py x_real_fullflow_once.py infra/x_runtime_worker.py infra/x_render_worker_v3.py infra/x_durable_ledger.py
      - name: Unit tests without credentials or network
        run: python -m unittest discover -s tests -p 'test_x_*.py' -v
