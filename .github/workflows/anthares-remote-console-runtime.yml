name: Anthares Remote Console Runtime
on:
  workflow_dispatch:
  push:
    paths:
      - '.anthares-remote-console-trigger'
      - '.github/workflows/anthares-remote-console-runtime.yml'
permissions:
  contents: read
jobs:
  android-console-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Boot Android
        env:
          ANTHARES_BOOT_VARIANT: 25
        run: |
          set -Eeuo pipefail
          bash anthares-android/scripts/provision.sh 2>&1 | tee /tmp/anthares-boot.log
          grep -Fx 'ANTHARES_ANDROID_BOOT=PASS' /tmp/anthares-boot.log
      - name: Verify device and app
        run: |
          set -Eeuo pipefail
          export ANDROID_HOME="$HOME/android-sdk" ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_HOME="$HOME/android-sdk" ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          adb wait-for-device
          adb shell getprop sys.boot_completed | tr -d '\r' | grep -qx 1
          adb shell pm path com.kwai.video | grep -q '^package:'
          adb shell monkey -p com.kwai.video 1
          sleep 8
          adb shell screencap -p /sdcard/anthares-screen.png
          adb pull /sdcard/anthares-screen.png /tmp/anthares-screen.png
          file /tmp/anthares-screen.png | grep -q PNG
          echo ANTHARES_ANDROID_KWAI_SCREEN_CAPTURE_PASS
      - name: Validate and start private bridge
        run: |
          set -Eeuo pipefail
          python3 -m py_compile independent_session/remote_android_bridge.py
          export ANTHARES_BRIDGE_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          test "${#ANTHARES_BRIDGE_TOKEN}" -ge 32
          export PATH="$HOME/android-sdk/platform-tools:$PATH"
          python3 independent_session/remote_android_bridge.py >/tmp/anthares-bridge.log 2>&1 &
          BP=$!
          trap 'kill "$BP" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS -H "Authorization: Bearer $ANTHARES_BRIDGE_TOKEN" http://127.0.0.1:8765/health >/tmp/bridge-health.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/bridge-health.json'))
          assert d.get('service')=='anthares-bridge' and d.get('adb_online') is True, d
          print('ANTHARES_REMOTE_BRIDGE_HEALTH_PASS')
          PY
          curl -fsS -H "Authorization: Bearer $ANTHARES_BRIDGE_TOKEN" http://127.0.0.1:8765/screen -o /tmp/bridge-screen.png
          file /tmp/bridge-screen.png | grep -q PNG
          echo ANTHARES_REMOTE_SCREEN_ENDPOINT_PASS
      - name: Expose real Android bridge through temporary HTTPS tunnel
        run: |
          set -Eeuo pipefail
          curl -fLsS --retry 2 --connect-timeout 8 --max-time 35 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8765 >/tmp/anthares-tunnel.log 2>&1 &
          TP=$!
          trap 'kill "$TP" 2>/dev/null || true' EXIT
          URL=""
          for i in $(seq 1 40); do
            URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/anthares-tunnel.log | head -1 || true)"
            if [ -n "$URL" ] && curl -fsS --max-time 4 -H "Authorization: Bearer $ANTHARES_BRIDGE_TOKEN" "$URL/health" >/tmp/public-bridge-health.json; then break; fi
            sleep 1
          done
          test -n "$URL" || { cat /tmp/anthares-tunnel.log; exit 1; }
          python3 - "$URL" <<'PY'
          import json,sys,urllib.request
          url=sys.argv[1]; token=__import__('os').environ['ANTHARES_BRIDGE_TOKEN']
          def req(path,method='GET',data=None):
              headers={'Authorization':'Bearer '+token}
              if data is not None: headers['Content-Type']='application/json'
              with urllib.request.urlopen(urllib.request.Request(url+path,data=data,headers=headers,method=method),timeout=12) as r:
                  return r.status,r.headers,r.read()
          status,_,body=req('/health')
          health=json.loads(body)
          assert status==200 and health.get('adb_online') is True,health
          status,hdr,png=req('/screen')
          assert status==200 and hdr.get_content_type()=='image/png' and png.startswith(b'\\x89PNG\\r\\n\\x1a\\n')
          status,_,body=req('/input','POST',b'{"action":"key","key":"HOME"}')
          assert status==200 and json.loads(body).get('ok') is True
          try: req('/health',method='GET')
          except Exception: pass
          else: raise AssertionError('authenticated route test unexpectedly failed')
          print('ANTHARES_REAL_ANDROID_PUBLIC_HTTPS_SCREEN_CONTROL_PASS')
          print('ANTHARES_PUBLIC_TUNNEL_URL='+url)
          PY

