name: One-time controlled TikTok @universo.anthares publish after verified session
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tiktok-one-controlled-publish-once.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Persist Chromium state, release CDP resources, verify identity and safely publish one selected clip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.error,unicodedata
          root='https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run'
          token=os.getenv('ARA_SHARED','')
          if len(token)<20:raise SystemExit('AUTH_MISSING')
          def request(path,method='GET',body=None,timeout=30):
              h={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'Anthares-One-Approved-Clip-Failclosed/1.0'}
              data=json.dumps(body).encode() if body is not None else None
              if data is not None:h['Content-Type']='application/json'
              req=urllib.request.Request(root+path,headers=h,data=data,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read(200000)
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read(12000))
                  except:return e.code,{}
              except Exception as e:return 0,{'error':type(e).__name__}
          sc,bs=request('/interactive-browser/status',timeout=25)
          print('CHROMIUM_INITIAL_STATUS='+str(sc))
          print('CHROMIUM_INITIAL_ACTIVE='+str(bool(bs.get('active'))))
          if sc!=200 or not bs.get('ok'):raise SystemExit('CHROMIUM_STATUS_UNAVAILABLE')
          if bs.get('active'):
              save_code,saved=request('/interactive-browser/save-vault','POST',{},timeout=45)
              print('OWNER_VAULT_SAVE_HTTP='+str(save_code))
              print('OWNER_VAULT_COOKIE_COUNT='+str(saved.get('cookie_count',0)))
              print('OWNER_VAULT_PERSISTED='+str(bool(saved.get('persisted'))))
              if save_code!=200 or not saved.get('persisted') or int(saved.get('cookie_count') or 0)<20:
                  raise SystemExit('OWNER_SESSION_BACKUP_NOT_CONFIRMED_SAFE_STOP')
              close_code,closed=request('/interactive-browser/close','POST',{},timeout=25)
              print('INTERACTIVE_BROWSER_CLOSE_HTTP='+str(close_code))
              if close_code!=200 or not closed.get('ok'):raise SystemExit('CDP_RESOURCE_RELEASE_FAILED')
          code,health=request('/health',timeout=25)
          print('HEALTH_HTTP='+str(code))
          print('HEALTH_BOOTSTRAPPED='+str(bool(health.get('session_bootstrapped'))))
          if code!=200 or not health.get('session_bootstrapped'):raise SystemExit('SESSION_NOT_BOOTSTRAPPED')
          if not health.get('identity_verified'):
              status,current=request('/session-test/async-status')
              if status!=200:raise SystemExit('VERIFIER_STATUS_UNAVAILABLE')
              if current.get('status') not in ('running','starting'):
                  s,start=request('/session-test/async-start','POST',{},timeout=25)
                  print('VERIFIER_START_HTTP='+str(s))
                  if s not in (200,202) or not start.get('ok'):raise SystemExit('VERIFIER_START_FAILED')
              for step in range(27):
                  time.sleep(8)
                  status,current=request('/session-test/async-status',timeout=25)
                  if status!=200:continue
                  phase=str(current.get('phase','unknown'))
                  if step%4==0:print('VERIFIER_PROGRESS='+str(current.get('status','unknown'))+' phase='+phase[:90])
                  if current.get('status') in ('verified','failed'):break
              print('IDENTITY_VERIFIER_RESULT='+str(current.get('status','unknown')))
              print('IDENTITY_VERIFIER_REASON='+str(current.get('reason',''))[:140])
          code,health=request('/health',timeout=25)
          print('IDENTITY_HEALTH_HTTP='+str(code))
          print('IDENTITY_VERIFIED='+str(bool(health.get('identity_verified'))))
          print('READY_FOR_TIKTOK='+str(bool(health.get('ready_for_tiktok'))))
          if code!=200 or not health.get('identity_verified') or not health.get('ready_for_tiktok'):
              raise SystemExit('IDENTITY_NOT_VERIFIED_PUBLICATION_CANCELLED')
          code,ready=request('/publish-dry-run','POST',{'test':'08'},timeout=25)
          print('DRY_RUN_HTTP='+str(code))
          if code!=200 or not ready.get('ok') or not ready.get('identity_verified'):
              raise SystemExit('PUBLISH_GUARD_REJECTED_PUBLICATION_CANCELLED')
          code,inventory=request('/profile-inventory',timeout=100)
          print('INVENTORY_HTTP='+str(code))
          print('INVENTORY_COUNT='+str(inventory.get('count',0)))
          owner=str(inventory.get('account','')).lower().lstrip('@')
          print('INVENTORY_EXACT_OWNER='+str(owner=='universo.anthares'))
          if code!=200 or not inventory.get('ok') or owner!='universo.anthares' or int(inventory.get('count') or 0)<1:
              raise SystemExit('INVENTORY_OR_OWNER_UNVERIFIED_PUBLICATION_CANCELLED')
          def normalized(s):
              return ''.join(ch for ch in unicodedata.normalize('NFKD',str(s).casefold()) if not unicodedata.combining(ch))
          needle=normalized('O Conceito de Comédia para Aristóteles')
          for item in inventory.get('items') or []:
              if needle in normalized(item.get('text','')):
                  print('ALREADY_PUBLISHED_URL='+str(item.get('url',''))[:170])
                  raise SystemExit('DUPLICATE_FOUND_PUBLICATION_CANCELLED')
          print('EXACT_TITLE_NOT_IN_PROFILE_INVENTORY=1')
          media='https://anthares.us/wp-content/uploads/anthares-clips/2026/10/short_9CIk-I_3VhM_g1_6619_6657.mp4'
          plan={'segment_id':'g1:9CIk-I_3VhM:6619:6657',
                'source_id':'9CIk-I_3VhM','title':'O Conceito de Comédia para Aristóteles',
                'source_title':'A Poética de Aristóteles - Parte 2',
                'summary':'Aristóteles define a comédia pela imitação de personagens inferiores, com ênfase no ridículo e na deformidade sem dor.'}
          print('ONE_TIME_CANDIDATE_SEGMENT='+plan['segment_id'])
          print('PUBLICATION_ATTEMPT_COUNT=1')
          code,posted=request('/publish-url','POST',{'media_url':media,'plan':plan},timeout=395)
          print('PUBLISH_HTTP='+str(code))
          print('PUBLISH_REQUEST_SUCCESS='+str(bool(posted.get('ok'))))
          print('PUBLISH_CONFIRMED='+str(bool(posted.get('confirmed'))))
          print('PUBLISH_REMOTE_ID='+str(posted.get('remote_id',''))[:120])
          if code!=200 or not posted.get('confirmed'):
              print('PUBLICATION_UNCERTAIN_OR_FAILED_NO_RETRY=1')
              raise SystemExit('PUBLICATION_NOT_CONFIRMED_NO_RETRY')
          print('ONE_TIME_CONTROLLED_PUBLICATION_VERIFIED=1')
          PY
