name: X Android auth secret preflight

on:
  push:
    branches: [feature/x-native-live-android-bridge]
    paths:
      - .github/workflows/x-auth-secret-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    env:
      X_ANDROID_PASSWORD: ${{ secrets.X_ANDROID_PASSWORD }}
    steps:
      - name: Confirm required secret exists without exposing it
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$X_ANDROID_PASSWORD" ]]; then
            echo BLOCKED_MISSING_X_ANDROID_PASSWORD
            exit 90
          fi
          echo X_ANDROID_PASSWORD_PRESENT
