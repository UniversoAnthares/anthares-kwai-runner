# RETIRED 2026-11-13 at owner's explicit request: stop all Oracle capacity checks.
# Archived implementation stays in tools/oci_a1_capacity_watch.py for history.
# No cron, no push trigger, no Oracle SDK or secret reads, no API request,
# and no instance launch. Manual dispatch is an inert acknowledgment only.
name: Retired Oracle A1 monitor — disabled
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm Oracle monitoring disabled
        run: |
          echo 'OCI_A1_MONITOR=DISABLED_BY_OWNER'
          echo 'OCI_A1_API_CALLS=0'
          echo 'OCI_A1_INSTANCE_LAUNCH=DISABLED'
