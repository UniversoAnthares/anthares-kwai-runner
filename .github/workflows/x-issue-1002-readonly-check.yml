name: X issue 1002 read-only publication readiness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/x-issue-1002-readonly-check.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Check Northflank public health and service metadata read-only
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          base='https://http--anthares-ara-northflank--6f6pbqmvhpv6.code.run'
          def call(url,headers=None,timeout=18):
              req=urllib.request.Request(url,headers=headers or {'User-Agent':'anthares-x-diagnostic-readonly'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      body=r.read(120000).decode('utf-8','replace')
                      try:return r.status,json.loads(body)
                      except ValueError:return r.status,{}
              except urllib.error.HTTPError as e:return e.code,{}
              except Exception as e:return 'ERR_'+type(e).__name__,{}
          for name,path in [('ARA','/healthz'),('X','/x/health')]:
              http,d=call(base+path)
              print('X_NORTHFLANK_'+name+'_HEALTH_HTTP='+str(http))
              for k in ('ok','backend','vault_ready','browser_ready','browser_preflight_required','restore_status','render_dependency'):
                  if k in d: print('X_NORTHFLANK_'+name+'_'+k.upper()+'='+str(d[k])[:110])
          token=os.getenv('NORTHFLANK_API_TOKEN','')
          print('X_NORTHFLANK_API_SECRET_BOUND='+str(bool(token)))
          if token:
              api='https://api.northflank.com/v1'
              headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
              status,d=call(api+'/projects',headers)
              print('X_NORTHFLANK_API_PROJECTS_HTTP='+str(status))
              projects=(d.get('data') or {}).get('projects') or []
              if isinstance(projects,dict):projects=list(projects.values())
              project=next((p for p in projects if p.get('name')=='Default'),None)
              if project:
                  pid=project.get('id')
                  status,s=call(api+'/projects/'+str(pid)+'/services',headers)
                  print('X_NORTHFLANK_API_SERVICES_HTTP='+str(status))
                  services=(s.get('data') or {}).get('services') or []
                  if isinstance(services,dict):services=list(services.values())
                  svc=next((x for x in services if x.get('name')=='anthares-ara-northflank'),None)
                  if svc:
                      sid=svc.get('id')
                      status,full=call(api+'/projects/'+str(pid)+'/services/'+str(sid),headers)
                      print('X_NORTHFLANK_SERVICE_DETAIL_HTTP='+str(status))
                      d=full.get('data') or {}
                      for key in ('name','status','paused','running','deploymentStatus','serviceType','type'):
                          if key in d:print('X_NORTHFLANK_SERVICE_'+key.upper()+'='+str(d[key])[:125])
                      for key in ('billing','computePlan','deployment','resources','deploymentConfig'):
                          v=d.get(key)
                          if isinstance(v,dict):
                              safe={k:v[k] for k in ('cpu','memory','replicas','status','state','plan','name','size','instanceType','minInstances','maxInstances') if k in v}
                              if safe:print('X_NORTHFLANK_SERVICE_'+key.upper()+'='+json.dumps(safe,separators=(',',':'))[:400])
                  else: print('X_NORTHFLANK_SERVICE_FOUND=False')
          PY
