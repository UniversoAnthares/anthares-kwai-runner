name: Retired Kwai three verified published posts - OIDC revoked
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Ensure one-time reconciliation cannot be replayed
        run: |
          echo 'KWAI_THREE_ONEOFF_RECONCILER=DISABLED_AFTER_3_CONFIRMED'
          echo 'GITHUB_OIDC_TOKEN_ACCESS=DISABLED'
          echo 'NEON_MUTATIONS=0'
          echo 'KWAI_POSTS_SUBMITTED=0'
