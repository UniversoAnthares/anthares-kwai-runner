name: Verify WordPress CORTES GitLab runner surfaces
on:
  push:
    paths:
      - '.github/workflows/wake-wordpress-cortes-runners.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify GitLab SaaS control surfaces without Render keepalive
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 https://gitlab.com/api/v4/version >/dev/null
          curl -fsSL --max-time 20 'https://gitlab.com/api/v4/projects/87361776/repository/branches/main' >/dev/null
          curl -fsSL --max-time 20 'https://gitlab.com/api/v4/projects/87307279' >/dev/null
          echo 'GITLAB_SAAS_SURFACES_REACHABLE=1'
          echo 'RENDER_KEEPALIVE_RETIRED=1'
