name: Threads Blob media delivery contract
on:
  pull_request:
    paths:
      - 'config/threads-media-delivery-mirrors.json'
      - 'tools/cortes_threads_cloud_media_delivery.mjs'
      - 'tools/cortes_threads_cloud_handoff.mjs'
      - 'tests/threads_cloud_handoff.test.mjs'
      - '.github/workflows/threads-blob-media-delivery-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate isolated Blob delivery contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/cortes_threads_cloud_media_delivery.mjs
          node --check tools/cortes_threads_cloud_handoff.mjs
          node --test tests/threads_cloud_handoff.test.mjs
