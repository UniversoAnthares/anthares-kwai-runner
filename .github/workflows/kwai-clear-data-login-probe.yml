name: Kwai Clear-Data Login Surface Probe
on:
  workflow_dispatch:
  push:
    paths: ['.kwai-clear-data-login-trigger']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated vault
        run: |
          curl -fL --retry 3 --connect-timeout 10 --max-time 180 -o kwai-vault.zip \
            https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip" | sha256sum -c -
          rm -rf kwai-vault && mkdir kwai-vault && unzip -q kwai-vault.zip -d kwai-vault
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 240
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory 2048
          script: |
            bash kwai_vault_install.sh
            sleep 6
            python3 kwai_clear_data_login_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwai-clear-data-probe-${{ github.run_id }}
          path: |
            kwai-clear-data-probe-log.json
            kwai-vault-install-status.txt
          if-no-files-found: warn
          retention-days: 2
