name: One-time native Studio inventory and guarded direct-media lean TikTok publish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tiktok-native-inventory-publish-once.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
    steps:
      - name: Download approved WordPress MP4 using verified range request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error
          from pathlib import Path
          source='https://anthares.us/wp-content/uploads/anthares-clips/2026/10/short_9CIk-I_3VhM_g1_6619_6657.mp4'
          profiles=[
           {'Range':'bytes=0-','User-Agent':'Anthares-Media-ReadOnly/1.0'},
           {'Range':'bytes=0-','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/157.0.0.0 Safari/537.36','Referer':'https://anthares.us/'},
           {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/157.0.0.0 Safari/537.36','Referer':'https://anthares.us/'},
          ]
          done=False
          for index,headers in enumerate(profiles,1):
           try:
            req=urllib.request.Request(source,headers=headers)
            with urllib.request.urlopen(req,timeout=35) as r:
             content=r.read(15000001)
             print('SOURCE_REQUEST_'+str(index)+'_HTTP='+str(r.status),flush=True)
             if not 150000<=len(content)<=15000000 or content[4:8]!=b'ftyp':
              print('SOURCE_REQUEST_'+str(index)+'_INVALID_MP4=1',flush=True)
              continue
             target=Path('/tmp/anthares-approved-clip.mp4')
             target.write_bytes(content)
             print('SOURCE_MP4_VALIDATED_BYTES='+str(target.stat().st_size),flush=True)
             done=True
             break
           except urllib.error.HTTPError as e:
            print('SOURCE_REQUEST_'+str(index)+'_HTTP='+str(e.code),flush=True)
           except Exception as e:
            print('SOURCE_REQUEST_'+str(index)+'_ERROR='+type(e).__name__,flush=True)
          if not done:raise SystemExit('SOURCE_MEDIA_UNAVAILABLE_SAFE_STOP')
          PY
      - name: Install Northflank client
        run: npm install --no-save --no-package-lock --ignore-scripts @northflank/js-client@0.12.0
      - name: Enumerate all 584 owned Studio posts and publish one approved clip only if safely absent
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {ApiClient,ApiClientInMemoryContextProvider} from '@northflank/js-client';
          const nfToken=process.env.NF_TOKEN,secret=process.env.ARA_SHARED;
          if(!nfToken||nfToken.length<20||!secret||secret.length<20)throw Error('AUTH_MISSING');
          const req=async p=>{let r=await fetch('https://api.northflank.com/v1'+p,{headers:{Authorization:'Bearer '+nfToken}});if(!r.ok)throw Error('NF_API_'+r.status);return r.json()};
          const found=[];for(const p of (await req('/projects')).data?.projects||[])for(const s of (await req('/projects/'+encodeURIComponent(p.id)+'/services')).data?.services||[])if(s.name==='anthares-tiktok-northflank')found.push([p.id,s.id||s.name]);
          if(found.length!==1)throw Error('SERVICE_NOT_UNIQUE');
          const [projectId,serviceId]=found[0],cp=new ApiClientInMemoryContextProvider();await cp.addContext({name:'read',token:nfToken});const cli=new ApiClient(cp);
          const script=String.raw`
          import sys,json,re,os,time,requests,unicodedata
          sys.path.insert(0,'/app/render-tiktok-worker')
          from browser_state_vault import load_runtime_state
          assert os.getenv('EXPECTED_TIKTOK_USERNAME','').strip().lower().lstrip('@')=='universo.anthares','WRONG_TARGET_ACCOUNT_SAFE_STOP'
          session=load_runtime_state(timeout=18)
          if not session or len(session.get('cookies') or [])<20:raise SystemExit('MISSING_DURABLE_SESSION')
          s=requests.Session()
          for cookie in session.get('cookies') or []:
           try:s.cookies.set(str(cookie['name']),str(cookie.get('value') or ''),domain=str(cookie.get('domain') or '.tiktok.com'),path=str(cookie.get('path') or '/'))
           except Exception:pass
          names={str(x.get('name') or '').lower() for x in session.get('cookies') or []}
          auth_names={'sessionid','sessionid_ss','sid_tt','sid_guard','uid_tt','uid_tt_ss'}
          if not names.intersection(auth_names):raise SystemExit('MISSING_AUTH_COOKIE')
          csrf=next((x.get('value') for x in session.get('cookies') or [] if str(x.get('name') or '').lower() in ('tt_csrf_token','tt-csrf-token','csrf_token')),'')
          if not csrf:raise SystemExit('MISSING_CREATOR_CSRF')
          device=next((x.get('value') for x in session.get('cookies') or [] if str(x.get('name') or '').lower() in ('tt_webid','tt_webid_v2','web_id')),'')
          params=[('locale','pt-BR'),('aid','1988'),('priority_region','BR'),('region','BR'),('tz_name','America/Campo_Grande'),('app_name','tiktok_creator_center'),('app_language','pt-BR'),('device_platform','web_pc'),('channel','tiktok_web'),('device_id',str(device or '')),('os','win'),('screen_width','1280'),('screen_height','800'),('browser_language','pt-BR'),('browser_platform','Win32'),('browser_name','Mozilla'),('browser_version','5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/157.0.0.0 Safari/537.36')]
          headers={'Referer':'https://www.tiktok.com/tiktokstudio/content','Origin':'https://www.tiktok.com','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36','Accept':'application/json, text/plain, */*','Content-Type':'application/json','agw-js-conv':'str','tt-csrf-token':str(csrf)}
          def normal(s):return ''.join(ch for ch in unicodedata.normalize('NFKD',str(s).lower()) if not unicodedata.combining(ch))
          labelkeys={'desc','description','caption','title','text','video_description','video_title','post_title','item_desc'}
          def captions(v,depth=0):
           if depth>7:return []
           if isinstance(v,str):return [v]
           if isinstance(v,list):
            result=[]
            for x in v[:100]:result+=captions(x,depth+1)
            return result
           if isinstance(v,dict):
            result=[]
            for key,val in v.items():
             if str(key).lower() in labelkeys and isinstance(val,str):result.append(val)
             elif isinstance(val,(dict,list)):result+=captions(val,depth+1)
            return result
           return []
          def id_from(v,depth=0):
           if depth>3 or not isinstance(v,dict):return None
           for key in ('id','item_id','video_id','aweme_id'):
            value=str(v.get(key) or '')
            if re.fullmatch(r'\d{15,}',value):return value
           for val in v.values():
            if isinstance(val,dict):
             id=id_from(val,depth+1)
             if id:return id
           return None
          mode=sys.argv[1] if len(sys.argv)>1 else 'before'
          cursor=0;seen_cursors=set();seen_ids=set();all_total=0;captions_total=0;positive=False;duplicate=[];complete=False
          for page in range(20):
           if str(cursor) in seen_cursors:raise SystemExit('CURSOR_LOOP_INCOMPLETE')
           seen_cursors.add(str(cursor))
           body={'cursor':int(cursor),'size':50,'query':{'sort_orders':[{'field_name':'post_time','order':2}],'conditions':[],'is_recent_posts':False}}
           response=s.post('https://www.tiktok.com/tiktok/creator/manage/item_list/v1/',params=params,headers=headers,data=json.dumps(body,separators=(',',':')),timeout=32)
           if response.status_code!=200:raise SystemExit('CREATOR_LIST_HTTP_'+str(response.status_code))
           d=response.json()
           if str(d.get('status_code'))!='0':raise SystemExit('CREATOR_LIST_STATUS_INVALID')
           items=d.get('item_list') or []
           if not isinstance(items,list):raise SystemExit('CREATOR_ITEMS_INVALID')
           if page==0 and items:
            print('FIRST_POST_FIELDS='+','.join(str(k) for k in list(items[0].keys())[:18]),flush=True)
           for item in items:
            all_total+=1
            ident=id_from(item)
            if ident:seen_ids.add(ident)
            texts=captions(item)
            if texts:captions_total+=1
            joined=normal(' '.join(texts))
            if 'enganar a si mesmo' in joined:positive=True
            if ('conceito de comedia' in joined and 'aristoteles' in joined) or 'comedia para aristoteles' in joined:
             duplicate.append(ident or 'matching_caption_unknown_id')
           print('PAGE='+str(page+1)+' ITEMS='+str(len(items))+' CUMULATIVE='+str(all_total)+' MORE='+str(bool(d.get('has_more'))),flush=True)
           has_more=d.get('has_more') in (True,1,'1','true')
           if not has_more:
            complete=True
            break
           next_cursor=d.get('cursor')
           if next_cursor is None or str(next_cursor)==str(cursor):raise SystemExit('NEXT_CURSOR_INVALID')
           cursor=next_cursor
           time.sleep(0.35)
          print('OWNED_ACCOUNT_MATCHED=True',flush=True)
          print('FULL_INVENTORY_COMPLETE='+str(complete),flush=True)
          print('FULL_INVENTORY_COUNT='+str(all_total),flush=True)
          print('FULL_INVENTORY_UNIQUE_IDS='+str(len(seen_ids)),flush=True)
          print('FULL_INVENTORY_CAPTION_COUNT='+str(captions_total),flush=True)
          print('KNOWN_POST_WITNESS='+str(positive),flush=True)
          print('CANDIDATE_DUPLICATES='+str(len(duplicate)),flush=True)
          if not complete or all_total<500 or len(seen_ids)<500 or captions_total<int(all_total*0.85) or not positive:
           raise SystemExit('INVENTORY_NOT_PROVEN_SAFE_STOP')
          if duplicate:
           print('DUPLICATE_REMOTE_ID='+str(duplicate[0])[:50],flush=True)
           if mode=='before':raise SystemExit('DUPLICATE_FOUND_SAFE_STOP')
           print('AFTER_PUBLICATION_REMOTE_ID='+str(duplicate[0])[:50],flush=True)
          elif mode=='before':
           print('NATIVE_INVENTORY_SAFE_TO_POST_ONE=1',flush=True)
          else:
           print('AFTER_PUBLICATION_NOT_VISIBLE=1',flush=True)
          `;
          const result=await cli.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',script,'before']});
          const report=String(result.stdOut||'');
          console.log('INVENTORY_EXIT='+String(result.commandResult?.exitCode));
          console.log('INVENTORY_RESULT='+report.replace(/[\r\n]+/g,' | ').slice(0,5500));
          if(result.commandResult?.exitCode!==0||!report.includes('NATIVE_INVENTORY_SAFE_TO_POST_ONE=1'))throw Error('INVENTORY_SAFE_STOP');
          const root='https://http--anthares-tiktok-northflank--6f6pbqmvhpv6.code.run';
          async function call(method,path,body,timeout=30000){
           const h={Authorization:'Bearer '+secret,Accept:'application/json'};if(body!==undefined)h['Content-Type']='application/json';
           const r=await fetch(root+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(timeout)});
           return {code:r.status,data:await r.json().catch(()=>({}))};
          }
          const hour=Number(new Intl.DateTimeFormat('en-US',{timeZone:'America/Campo_Grande',hour:'2-digit',hourCycle:'h23'}).format(new Date()));
          console.log('PUBLISH_WITHIN_06_23='+Boolean(hour>=6&&hour<23));if(hour<6||hour>=23)throw Error('OUTSIDE_PUBLICATION_WINDOW');
          const h=await call('GET','/health');console.log('IDENTITY_VERIFIED='+Boolean(h.data.identity_verified));console.log('READY_FOR_TIKTOK='+Boolean(h.data.ready_for_tiktok));
          if(h.code!==200||!h.data.identity_verified||!h.data.ready_for_tiktok)throw Error('ACCOUNT_IDENTITY_NOT_VERIFIED');
          const media='https://anthares.us/wp-content/uploads/anthares-clips/2026/10/short_9CIk-I_3VhM_g1_6619_6657.mp4';
          const plan={segment_id:'g1:9CIk-I_3VhM:6619:6657',source_id:'9CIk-I_3VhM',title:'O Conceito de Comédia para Aristóteles',source_title:'A Poética de Aristóteles - Parte 2',summary:'Aristóteles define a comédia pela imitação de personagens inferiores, com ênfase no ridículo e na deformidade sem dor.'};
          // Test 10 performs a remote media GET, already confirmed blocked (HTTP 502).
          // Use identity dry-run 08; validate MP4 ftyp and size on the sender before multipart.
          for(const test of ['08']){
           const d=await call('POST','/publish-dry-run',{test,media_url:media,plan},45000);
           console.log('DRY_RUN_'+test+'_HTTP='+d.code);
           if(d.code!==200||!d.data.ok)throw Error('DRY_RUN_'+test+'_FAILED');
          }
          const {readFileSync}=await import('node:fs');
          const video=readFileSync('/tmp/anthares-approved-clip.mp4');
          console.log('SOURCE_MEDIA_BYTES='+video.length);
          if(video.length<150000||video.length>15000000||video.subarray(4,8).toString()!=='ftyp')throw Error('MEDIA_MP4_VALIDATION_FAILED');
          const upload=new FormData();
          upload.set('media',new Blob([video],{type:'video/mp4'}),'publish.mp4');
          upload.set('plan',JSON.stringify(plan));
          console.log('PUBLISH_ATTEMPT_COUNT_MAX=1');
          const postResponse=await fetch(root+'/publish-lean',{method:'POST',headers:{Authorization:'Bearer '+secret},body:upload,signal:AbortSignal.timeout(350000)});
          const post=await postResponse.json().catch(()=>({}));
          console.log('LEAN_PUBLISH_HTTP='+postResponse.status);
          console.log('LEAN_PUBLISH_REQUESTED='+Boolean(post.publication_requested));
          console.log('LEAN_UI_CONFIRMED='+Boolean(post.ui_confirmed));
          console.log('LEAN_REQUIRES_RECONCILIATION='+Boolean(post.requires_profile_reconcile));
          console.log('LEAN_PUBLISH_PROCESS_EXIT='+String(post.code||''));
          console.log('LEAN_PUBLISH_ERROR='+String(post.error||'unknown').slice(0,110));
          const markers=String(post.stdout||'').match(/LEAN_STAGE=[A-Z_]+|TIKTOK_LEAN_PUBLISH_REQUESTED=1/g)||[];
          console.log('LEAN_PUBLISH_STAGE_MARKERS='+markers.slice(-7).join(','));
          let reconciled=false;
          for(let check=0;check<4;check++){
           await new Promise(done=>setTimeout(done,12000));
           try{
            const after=await cli.exec.execServiceCommand({projectId,serviceId},{command:['python3','-c',script,'after']});
            const stdout=String(after.stdOut||'');
            const id=(stdout.match(/AFTER_PUBLICATION_REMOTE_ID=(\d{15,})/)||[])[1]||'';
            console.log('POST_PUBLICATION_SCAN_'+(check+1)+'_EXIT='+String(after.commandResult?.exitCode));
            console.log('POST_PUBLICATION_SCAN_'+(check+1)+'_COUNT='+String((stdout.match(/FULL_INVENTORY_COUNT=(\d+)/)||[])[1]||'unknown'));
            if(id){
             console.log('NEW_TIKTOK_PUBLICATION_URL=https://www.tiktok.com/@universo.anthares/video/'+id);
             reconciled=true;break;
            }
           }catch(e){console.log('POST_PUBLICATION_SCAN_'+(check+1)+'_UNAVAILABLE='+String(e.name||'unknown'));}
          }
          if(!reconciled)throw Error('POST_PUBLICATION_NOT_CONFIRMED_NO_RETRY');
          console.log('ONE_CONTROLLED_POST_INDEPENDENTLY_CONFIRMED=1');

          NODE
