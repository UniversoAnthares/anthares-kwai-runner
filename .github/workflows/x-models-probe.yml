name: X Models Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.x-models-probe-trigger'

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe GitHub Models with repository token
        env:
          GH_MODELS_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          payload={
            "model":"openai/gpt-4.1-mini",
            "messages":[{"role":"user","content":"Responda apenas: X_MODELS_OK"}],
            "temperature":0,
            "max_tokens":20,
          }
          req=urllib.request.Request(
            'https://models.github.ai/inference/chat/completions',
            data=json.dumps(payload).encode(), method='POST',
            headers={'Authorization':'Bearer '+os.environ['GH_MODELS_TOKEN'],'Content-Type':'application/json','Accept':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=45) as r: data=json.load(r)
          except urllib.error.HTTPError as e:
            print('X_MODELS_HTTP='+str(e.code))
            print(e.read().decode('utf-8','replace')[:1000])
            raise
          text=((data.get('choices') or [{}])[0].get('message') or {}).get('content','')
          print('X_MODELS_RESULT='+text.strip())
          assert 'X_MODELS_OK' in text
          PY
