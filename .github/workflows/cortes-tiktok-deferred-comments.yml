name: CORTES TikTok five daily deferred comment windows
# Explicit operator retry 2026-11-22 16:44 America/Campo_Grande; preserve Neon idempotency.

on:
  workflow_dispatch:
    inputs:
      captcha_cleared_primary:
        description: "Human resolved TikTok CAPTCHA for @universo.anthares in this session"
        type: boolean
        required: false
        default: false
      captcha_cleared_secondary:
        description: "Human resolved TikTok CAPTCHA for @lucasrosalem4 in this session"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/cortes-tiktok-deferred-comments.yml'
      - 'tools/cortes_tiktok_deferred_comments.py'
      - 'tools/cortes_tiktok_after_publish_comment.py'
  schedule:
    # America/Campo_Grande (UTC-4): five off-peak minute windows, avoiding GitHub's top-of-hour schedule congestion.
    - cron: '7 12 * * *'   # 08:07 local
    - cron: '13 15 * * *'  # 11:13 local
    - cron: '19 18 * * *'  # 14:19 local
    - cron: '25 21 * * *'  # 17:25 local
    - cron: '31 1 * * *'   # 21:31 local

permissions:
  contents: read
  id-token: write

concurrency:
  group: cortes-tiktok-deferred-comments-five-daily-windows
  cancel-in-progress: false

jobs:
  primary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      TIKTOK_DEFERRED_ACCOUNT: universo.anthares
      TIKTOK_COMMENT_RECOVERY_ENABLED: 'true'
      # Scheduled and push runs inspect pending sources but never retry a CAPTCHA.
      # Only an explicit human-cleared dispatch permits one browser attempt.
      TIKTOK_COMMENT_BROWSER_CLEARED: ${{ github.event_name == 'workflow_dispatch' && inputs.captcha_cleared_primary && 'true' || 'false' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate deferred comment contract
        run: |
          python3 -m py_compile tools/cortes_tiktok_deferred_comments.py tools/cortes_tiktok_after_publish_comment.py
          python3 -m unittest discover -s tests -p 'test_cortes_tiktok_deferred_comments.py' -v
      - name: Install isolated authenticated comment browser
        run: |
          python3 -m pip install -q --disable-pip-version-check playwright requests cryptography
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=120000 python3 -m playwright install chromium
      - name: Process previously confirmed clips with idempotent Neon receipts
        run: python3 -u tools/cortes_tiktok_deferred_comments.py

  secondary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      TIKTOK_LUCASROSALEM4_STORAGE_STATE: ${{ secrets.TIKTOK_LUCASROSALEM4_STORAGE_STATE }}
      TIKTOK_DEFERRED_ACCOUNT: lucasrosalem4
      TIKTOK_COMMENT_RECOVERY_ENABLED: 'true'
      TIKTOK_COMMENT_BROWSER_CLEARED: ${{ github.event_name == 'workflow_dispatch' && inputs.captcha_cleared_secondary && 'true' || 'false' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate deferred comment contract
        run: |
          python3 -m py_compile tools/cortes_tiktok_deferred_comments.py tools/cortes_tiktok_after_publish_comment.py
          python3 -m unittest discover -s tests -p 'test_cortes_tiktok_deferred_comments.py' -v
      - name: Install isolated authenticated comment browser
        run: |
          python3 -m pip install -q --disable-pip-version-check playwright requests
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=120000 python3 -m playwright install chromium
      - name: Process secondary confirmed clips without disturbing Kwai MEmu
        run: python3 -u tools/cortes_tiktok_deferred_comments.py
