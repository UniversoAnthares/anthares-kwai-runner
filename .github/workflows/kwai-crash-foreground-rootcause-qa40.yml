name: Kwai Crash and Foreground Rootcause QA40
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kwai-crash-foreground-rootcause-qa40.yml']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        mode: [wait10, wait30, wait60, wifi-reset, airplane-cycle, restart-after-nav, network-check, resource-wait, profile-after-wait, profile-after-restart]
        ram: [1536, 2048, 3072, 4096]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STABILIZE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL --retry 3 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
          mkdir -p kwai-vault && unzip -q kwai-vault.zip -d kwai-vault
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: ${{ matrix.ram }}M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 300
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -memory ${{ matrix.ram }}
          script: |
            bash kwai_vault_install.sh
            adb shell pm grant com.kwai.video android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            sleep 8
            python3 kwai_stabilize_probe.py
            adb shell dumpsys activity activities > /tmp/final-activities.txt
            adb shell pidof com.kwai.video > /tmp/kwai-pid.txt || true
            echo "KWAI_PID=$(cat /tmp/kwai-pid.txt)"
            adb logcat -b crash -d -v brief | tail -80 > kwai-crash-log.txt || true
            adb shell dumpsys meminfo com.kwai.video > kwai-meminfo.txt || true
            bash -c 'if grep -Eq "com.kwai.video/" /tmp/final-activities.txt && test -s /tmp/kwai-pid.txt; then echo KWAI_FOREGROUND_AUTH_GATE=PASS; else echo KWAI_FOREGROUND_AUTH_GATE=FAIL; exit 31; fi'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.mode }}-ram${{ matrix.ram }}-${{ github.run_id }}
          path: |
            advance-*.xml
            advance-*.png
            final-*.xml
            final-*.png
            kwai-vault-install-status.txt
            kwai-crash-log.txt
            kwai-meminfo.txt
          if-no-files-found: warn
          retention-days: 1
