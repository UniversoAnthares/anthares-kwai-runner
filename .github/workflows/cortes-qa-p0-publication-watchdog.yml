name: CORTES P0 publication incident watchdog
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - tools/cortes_qa_p0_router.py
      - tests/test_cortes_qa_p0_router.py
      - .github/workflows/cortes-qa-p0-publication-watchdog.yml
  push:
    branches: [main]
    paths:
      - tools/cortes_qa_p0_router.py
      - tests/test_cortes_qa_p0_router.py
      - .github/workflows/cortes-qa-p0-publication-watchdog.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "Anthares Publisher QA"
      - "CORTES TikTok Publisher"
      - "Kwai queue publisher"
      - "Social direct adapters contract"
      - "CORTES Pinterest - automatic Buffer cloud publisher"
      - "CORTES LinkedIn personal - primary hosted cloud publisher"
      - "CORTES LinkedIn personal - standby hosted publisher"
      - "CORTES LinkedIn - automatic Buffer cloud publisher"
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: cortes-p0-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.name || 'routine' }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify incident routing contracts
        shell: powershell
        run: |
          & 'C:\Users\Lucas\AppData\Local\Programs\Python\Python311\python.exe' -m py_compile tools/cortes_qa_p0_router.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Users\Lucas\AppData\Local\Programs\Python\Python311\python.exe' -m unittest discover -s tests -p test_cortes_qa_p0_router.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  route:
    permissions:
      contents: read
      issues: write
      actions: write
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success')
    # This route invokes Windows PowerShell and Python311 installed on the local runner.
    # Self-hosted execution also remains available when hosted minutes are exhausted.
    runs-on: [self-hosted, Windows, tiktok-lucas4-fallback]
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Compile P0 incident router
        shell: powershell
        run: |
          & 'C:\Users\Lucas\AppData\Local\Programs\Python\Python311\python.exe' -m py_compile tools/cortes_qa_p0_router.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify P0 incident contracts
        shell: powershell
        run: |
          & 'C:\Users\Lucas\AppData\Local\Programs\Python\Python311\python.exe' -m unittest discover -s tests -p test_cortes_qa_p0_router.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Detect publisher failures and open immediate-priority QA issues
        shell: powershell
        run: |
          & 'C:\Users\Lucas\AppData\Local\Programs\Python\Python311\python.exe' -u tools/cortes_qa_p0_router.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
