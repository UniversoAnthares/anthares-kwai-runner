stages: [validate, workload]
provider_failover_acceptance:
  stage: validate
  image: python:3.12-alpine
  script:
    - python tools/test_provider_router.py
    - apk add --no-cache curl
    - curl --fail --silent --show-error https://anthares-control.anthares1.workers.dev/git-provider-self-test | tee /tmp/control.json
    - grep -q '"ok":true' /tmp/control.json
    - grep -q '"provider":"gitlab"' /tmp/control.json
    - grep -q '"provider":"github"' /tmp/control.json
    - grep -q '"error":"no_ready_provider"' /tmp/control.json
    - grep -q '"error":"checkpoint_diverged"' /tmp/control.json
    - echo "GIT_PROVIDER_FAILOVER=PROVEN"
real_workload_clipper_validation:
  stage: workload
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/UniversoAnthares/anthares-clipper.git" /tmp/anthares-clipper
    - cd /tmp/anthares-clipper
    - python -m pip install --quiet requests pillow yt-dlp imageio-ffmpeg tzdata
  script:
    - cd /tmp/anthares-clipper
    - python -m py_compile clipper.py
    - python -c "import clipper; print('GITLAB_REAL_WORKLOAD_CLIPPER_IMPORT=PROVEN',flush=True)"
    - python -c "import os; r=['WP_SITE_URL','WP_USERNAME','WP_APP_PASSWORD','YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN']; m=[x for x in r if not os.getenv(x)]; print('GITLAB_CLIPPER_RUNTIME_SECRETS=' + ('READY' if not m else 'MISSING:' + ','.join(m)))"
android_kwai_capability_gate:
  stage: validate
  image: alpine:3.20
  script:
    - echo "ANDROID_KWAI_GITLAB_HOSTED_RUNNER=UNSUPPORTED_KVM_DEVICE_GATE"

# ARA primary provider. Requires the GitLab mirror to contain this branch.
ara_go_linux:
  stage: validate
  image: golang:1.22
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/ara-capabilities"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cd anthares-remote-agent
    - go test ./... -count=1
    - go test -race ./...
    - go vet ./...

ara_windows_crossbuild:
  stage: validate
  image: golang:1.22
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/ara-capabilities"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cd anthares-remote-agent
    - GOOS=windows GOARCH=amd64 go build -o /tmp/ara-amd64.exe ./cmd/agent
    - GOOS=windows GOARCH=arm64 go build -o /tmp/ara-arm64.exe ./cmd/agent
    - test -s /tmp/ara-amd64.exe
    - test -s /tmp/ara-arm64.exe
