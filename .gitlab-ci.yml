stages:
  - verify

sha_consistency:
  stage: verify
  image: alpine:3.20
  before_script:
    - apk add --no-cache git
  script:
    - test -n "$GITHUB_MIRROR_URL"
    - github_sha="$(git ls-remote "$GITHUB_MIRROR_URL" refs/heads/main | awk '{print $1}')"
    - gitlab_sha="$(git rev-parse HEAD)"
    - test "$github_sha" = "$gitlab_sha"
    - echo "GITLAB_CROSS_PROVIDER_SHA=PROVEN"
