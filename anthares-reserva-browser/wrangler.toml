name = "anthares-reserva-browser"
account_id = "5c24be052e5144391f73a8e03491e88e"
main = "src/secure-owner-entry.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[browser]
binding = "BROWSER"

[[durable_objects.bindings]]
name = "BROWSER_STATE"
class_name = "BrowserState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrowserState"]

# Required secrets: ANTHARES_RESERVA_TOKEN, NORTHFLANK_BROWSER_TOKEN, OWNER_APPROVAL_HASH.
# Interactive TikTok login runs on the existing Northflank Chromium service.
# Dashboard-managed secrets/vars are preserved across deployments.
# The Cloudflare Browser binding remains only for legacy/non-TikTok recovery paths.
