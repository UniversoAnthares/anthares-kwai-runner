version: 2.1

jobs:
  anthares_browser_qa:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Anthares-browser isolated 40-case runtime proof
          no_output_timeout: 15m
          command: |
            set -Eeuo pipefail
            export CI_PROVIDER=circleci-isolated
            export ANTHARES_BROWSER_QA_CASES=40
            bash ci/shared/anthares-browser-runtime-qa.sh

workflows:
  isolated_browser_proof:
    jobs:
      - anthares_browser_qa
