version: 2.1

jobs:
  provider_smoke:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Provider hub smoke
          command: CI_PROVIDER=circleci bash ci/shared/provider-smoke.sh

  circleci_token_present:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Verify CircleCI API credential
          command: |
            set -Eeuo pipefail
            TOKEN="${CIRCLECI_TOKEN:-${CIRCLE_TOKEN:-}}"
            test -n "$TOKEN"

  activate_wordpress_circleci:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Follow anthares-wordpress on CircleCI
          command: |
            set -Eeuo pipefail
            TOKEN="${CIRCLECI_TOKEN:-${CIRCLE_TOKEN:-}}"
            response="$(curl -fsS -X POST \
              'https://circleci.com/api/v1.1/project/github/UniversoAnthares/anthares-wordpress/follow' \
              -H "Circle-Token: $TOKEN")"
            echo "$response" | grep -q '"followed"[[:space:]]*:[[:space:]]*true'

  cloudflare_token_present:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Verify Cloudflare deploy credential
          command: |
            set -Eeuo pipefail
            TOKEN="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-}}"
            test -n "$TOKEN"

  deploy_anthares_browser:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Deploy generic Anthares Browser
          command: |
            set -Eeuo pipefail
            export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-}}"
            cd anthares-reserva-browser
            npm ci
            npx wrangler deploy

workflows:
  anthares_circleci_recovery:
    jobs:
      - provider_smoke
      - circleci_token_present
      - activate_wordpress_circleci:
          requires: [circleci_token_present]
      - cloudflare_token_present
      - deploy_anthares_browser:
          requires: [cloudflare_token_present]
