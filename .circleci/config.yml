version: 2.1
jobs:
  kwai_live_login_handoff:
    machine:
      image: android:default
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Android 35 + real Kwai chooser-to-form handoff
          no_output_timeout: 12m
          command: |
            set -Eeuo pipefail
            IMG="system-images;android-35;google_apis;x86_64"
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "$IMG"
            echo no | avdmanager create avd --force --name kwai-handoff --package "$IMG" --device pixel_2
            nohup emulator -avd kwai-handoff -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on >/tmp/kwai-handoff-emulator.log 2>&1 &
            adb start-server
            timeout 60 adb wait-for-device
            for i in $(seq 1 120); do
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            echo KWAI_HANDOFF_ANDROID_BOOT=PASS
            curl -fL --retry 3 --connect-timeout 10 --max-time 180 -o kwai-vault.zip https://github.com/UniversoAnthares/anthares-kwai-runner/releases/download/kwai-package-vault/kwai-vault.zip
            echo "96650454576a2cf5cc5e63d90011f0b60a03d2702605756f40cc934cd6ae5543  kwai-vault.zip" | sha256sum -c -
            mkdir -p kwai-vault
            unzip -q kwai-vault.zip -d kwai-vault
            bash kwai_vault_install.sh
            adb shell pm path com.kwai.video >/dev/null
            echo KWAI_HANDOFF_INSTALL=PASS
            timeout 300 env KWAI_ROUTE=me_direct KWAI_NETWORK=baseline KWAI_SETTLE=2 python3 tools/kwai_semantic_login_route_probe.py | tee kwai-handoff-route.txt
            grep -Eq 'SEMANTIC_LOGIN_ROUTE=PASS' kwai-handoff-route.txt
            echo KWAI_HANDOFF_CHOOSER=PASS
            timeout 120 python3 tools/kwai_android_login_entry.py email | tee kwai-handoff-method.txt
            grep -Eq 'KWAI_NATIVE_LOGIN_FORM_(VISIBLE|ALREADY_VISIBLE)' kwai-handoff-method.txt
            echo KWAI_HANDOFF_REAL_FORM=PASS
      - run:
          name: Android diagnostics (no credentials)
          when: always
          command: |
            adb devices || true
            grep -E 'FATAL|ERROR|emulator:|qemu' /tmp/kwai-handoff-emulator.log | tail -40 || true
      - store_artifacts:
          path: kwai-handoff-route.txt
          destination: kwai-handoff-route.txt
      - store_artifacts:
          path: kwai-handoff-method.txt
          destination: kwai-handoff-method.txt
workflows:
  kwai_live_login_handoff:
    jobs:
      - kwai_live_login_handoff
