version: 2.1

jobs:
  provider_smoke:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Provider hub smoke
          command: CI_PROVIDER=circleci bash ci/shared/provider-smoke.sh

  activate_wordpress_circleci:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Follow anthares-wordpress on CircleCI
          command: |
            set -Eeuo pipefail
            TOKEN="${CIRCLECI_TOKEN:-${CIRCLE_TOKEN:-}}"
            if [ -z "$TOKEN" ]; then
              echo "CIRCLECI_ACTIVATION=NO_API_TOKEN"
              exit 0
            fi
            response="$(curl -fsS -X POST \
              'https://circleci.com/api/v1.1/project/github/UniversoAnthares/anthares-wordpress/follow' \
              -H "Circle-Token: $TOKEN")"
            echo "$response" | grep -q '"followed"[[:space:]]*:[[:space:]]*true' || {
              echo "CIRCLECI_ACTIVATION=FOLLOW_RESPONSE_UNEXPECTED"
              echo "$response" | head -c 1200
              exit 1
            }
            echo "CIRCLECI_ACTIVATION=FOLLOWED"

  deploy_anthares_browser:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Deploy generic Anthares Browser when credential is available
          command: |
            set -Eeuo pipefail
            export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-}}"
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "ANTHARES_BROWSER_DEPLOY=NO_CLOUDFLARE_TOKEN"
              exit 0
            fi
            cd anthares-reserva-browser
            npm ci
            npx wrangler deploy
            echo "ANTHARES_BROWSER_DEPLOY=OK"

workflows:
  anthares_circleci_recovery:
    jobs:
      - provider_smoke
      - activate_wordpress_circleci
      - deploy_anthares_browser
