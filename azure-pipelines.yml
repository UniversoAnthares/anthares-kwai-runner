trigger:
  branches:
    include:
      - main
  paths:
    include:
      - anthares-remote-agent/*
      - anthares-remote-agent/**/*
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  GO_VERSION: '1.22.12'

steps:
  - checkout: self
    fetchDepth: 1

  - task: GoTool@0
    displayName: Install Go $(GO_VERSION)
    inputs:
      version: '$(GO_VERSION)'

  - bash: |
      set -euo pipefail
      cd anthares-remote-agent
      bad="$(gofmt -l .)"
      if [ -n "$bad" ]; then
        echo 'Existing files needing gofmt:'
        printf '%s\n' "$bad"
      fi
      go vet ./...
      go test ./... -count=1
      go build -o ../anthares-remote-agent-linux ./cmd/agent
      test -s ../anthares-remote-agent-linux
    displayName: Vet, test and build Anthares Remote Agent

  - publish: anthares-remote-agent-linux
    artifact: anthares-remote-agent-linux
    displayName: Publish Linux artifact
