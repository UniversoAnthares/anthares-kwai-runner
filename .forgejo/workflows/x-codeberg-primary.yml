name: Anthares X - Codeberg Cloud Primary

# Suspended Codeberg provider. Historical workflow retained but not executable.
# Historical suspended Codeberg workflow: opt-in metadata only; every job disabled.
on:
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: anthares-x-codeberg-primary
  cancel-in-progress: false

jobs:
  browser-smoke:
    if: ${{ false }} # Codeberg suspended; workflow retired
    # Proven Codeberg tiny runner is enough for isolated Chromium smoke.
    runs-on: codeberg-tiny
    timeout-minutes: 8
    steps:
      - name: Prove isolated cloud Chromium is executable
        run: |
          set -eu
          python3 -m venv /tmp/anthares-x-smoke-venv
          /tmp/anthares-x-smoke-venv/bin/python -m pip install --disable-pip-version-check playwright
          /tmp/anthares-x-smoke-venv/bin/python -m playwright install --with-deps chromium
          /tmp/anthares-x-smoke-venv/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True,args=["--no-sandbox","--disable-dev-shm-usage"]); t=b.new_page(); t.goto("https://x.com",wait_until="domcontentloaded",timeout=40000); print("CODEBERG_ANTHARES_BROWSER_EXECUTABLE=TRUE");b.close();p.stop()'
  publish:
    if: ${{ false }} # Codeberg suspended; workflow retired
    runs-on: codeberg-medium
    timeout-minutes: 9
    env:
      X_CLOUD_PROVIDER: codeberg
      X_LEDGER_BACKEND: neon-api
      X_LEDGER_API: https://br-crimson-unit-b89nau08-xledger.compute.c-14.us-east-1.aws.neon.tech/
      X_LEDGER_MIGRATION_VERIFIED: ${{ vars.X_LEDGER_MIGRATION_VERIFIED }}
      X_CLOUD_ARM: ${{ vars.X_CODEBERG_PRIMARY_ARM }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      PYTHONUTF8: '1'
      X_CLOUD_MEDIA_WAIT_SECONDS: '300'
      X_CLOUD_PROOF_ATTEMPTS: '5'
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed without Codeberg cloud publishing credentials
        run: |
          set -eu
          if [ -z "${ARA_SHARED:-}" ]; then
            echo "X_CODEBERG_REQUIRED_SECRET_MISSING=ARA_SHARED"
            exit 2
          fi
          if [ "${X_LEDGER_MIGRATION_VERIFIED:-}" != 1 ]; then
            echo "X_CODEBERG_NEON_MIGRATION_NOT_READY"
            exit 2
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "X_CODEBERG_REQUIRED_SECRET_MISSING=GH_TOKEN"
            exit 2
          fi
      - name: Install Anthares Browser video preflight
        run: |
          set -eu
          python3 -m venv /tmp/anthares-x-publisher-venv
          /tmp/anthares-x-publisher-venv/bin/python -m pip install --disable-pip-version-check playwright requests cryptography
          /tmp/anthares-x-publisher-venv/bin/python -m playwright install --with-deps chromium
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Globally fenced cloud X video publisher
        run: /tmp/anthares-x-publisher-venv/bin/python -u -m tools.x_github_anthares_browser_publisher
