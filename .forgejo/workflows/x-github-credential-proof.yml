name: X Codeberg GitHub Credential Proof
on:
  push:
    branches: [main]
    paths:
      - '.forgejo/workflows/x-github-credential-proof.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  token-readonly:
    runs-on: codeberg-tiny
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Verify constrained GitHub credential without disclosure
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get("GH_TOKEN","")
          if not token:raise SystemExit("X_CODEBERG_GITHUB_TOKEN_MISSING")
          req=urllib.request.Request(
             "https://api.github.com/repos/UniversoAnthares/anthares-kwai-runner/issues/1002",
             headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                      "User-Agent":"anthares-codeberg-gh-token-readonly-proof"})
          try:
             with urllib.request.urlopen(req,timeout=18) as response:
                payload=json.load(response)
                if response.status!=200 or payload.get("number")!=1002:
                   raise SystemExit("X_CODEBERG_GITHUB_PERMISSION_DENIED")
          except urllib.error.HTTPError as exc:
             print("X_CODEBERG_GITHUB_PERMISSION_HTTP_"+str(exc.code))
             raise SystemExit(3)
          print("X_CODEBERG_GITHUB_TOKEN_AUTH_READ_ISSUES=PASS")
          # Prove Issues: write without changing any actual field or state.
          body=json.dumps({"title":payload["title"]}).encode("utf-8")
          req=urllib.request.Request(
             "https://api.github.com/repos/UniversoAnthares/anthares-kwai-runner/issues/1002",
             data=body,method="PATCH",headers={
                "Authorization":"Bearer "+token,
                "Accept":"application/vnd.github+json",
                "Content-Type":"application/json",
                "User-Agent":"anthares-codeberg-gh-token-write-proof"})
          try:
             with urllib.request.urlopen(req,timeout=18) as response:
                result=json.load(response)
                if response.status!=200 or result.get("title")!=payload["title"]:
                    raise SystemExit("X_CODEBERG_GITHUB_WRITE_UNVERIFIED")
          except urllib.error.HTTPError as exc:
             print("X_CODEBERG_GITHUB_WRITE_PERMISSION_HTTP_"+str(exc.code))
             raise SystemExit(4)
          print("X_CODEBERG_GITHUB_TOKEN_ISSUES_WRITE=PASS")
          PY
