name: Codeberg autonomous CORTES QA P0 supervisor
# Historical suspended Codeberg workflow: opt-in metadata only; every job disabled.
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: codeberg-cortes-p0-publishing-watch
  # P0 QA must never be cancelled by a new push or concurrent manual trigger.
  cancel-in-progress: false
jobs:
  watchdog:
    if: ${{ false }} # Codeberg suspended; workflow retired
    runs-on: codeberg-tiny
    timeout-minutes: 3
    env:
      FORGEJO_TOKEN: ${{ forgejo.token }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Validate independent P0 scanner
        shell: bash
        run: |
          set -eu
          python3 -m py_compile tools/cortes_qa_codeberg_p0_watch.py
          python3 -m unittest discover -s tests -p test_cortes_qa_codeberg_p0_watch.py -v
      - name: Monitor TikTok and X cloud publishers and create priority incidents
        shell: bash
        run: python3 -u tools/cortes_qa_codeberg_p0_watch.py
      - name: Independently detect missing CORTES daily masters and stalled LinkedIn publishers
        shell: bash
        run: |
          set -eu
          python3 -m unittest discover -s tests -p test_cortes_codeberg_round_qa.py -q
          python3 -u -m tools.cortes_codeberg_round_qa
