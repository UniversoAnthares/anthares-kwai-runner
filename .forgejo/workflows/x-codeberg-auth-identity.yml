name: X Codeberg Authenticated Browser Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anthares-x-codeberg-identity-proof
  cancel-in-progress: false

jobs:
  authenticated-identity:
    # Codeberg tiny stops at 2 min; Chromium dependencies + X login exceed it.
    # Codeberg medium permits up to 10 min for read-only identity preflight.
    runs-on: codeberg-medium
    timeout-minutes: 9
    env:
      ARA_SHARED: ${{ secrets.ARA_SHARED }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only headless browser without modifying system Python
        run: |
          set -eu
          python3 -m venv /tmp/anthares-x-auth-venv
          /tmp/anthares-x-auth-venv/bin/python -m pip install --disable-pip-version-check playwright requests cryptography
          /tmp/anthares-x-auth-venv/bin/python -m playwright install --with-deps chromium
      - name: Verify encrypted vault and authenticated account without publishing
        run: /tmp/anthares-x-auth-venv/bin/python -u tools/x_cloud_browser_identity_probe.py
