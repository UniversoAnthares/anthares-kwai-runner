name: Codeberg independent Forgejo runner smoke
# Historical suspended Codeberg workflow: opt-in metadata only; every job disabled.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  prove:
    if: ${{ false }} # Codeberg suspended; workflow retired
    runs-on: anthares-codeberg-linux
    timeout-minutes: 5
    steps:
      - name: Prove independent Linux container runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test -n "$FORGEJO_REPOSITORY"
          test "$FORGEJO_REPOSITORY" = "UniversoAnthares/anthares-kwai-runner"
          python3 --version
          git --version
          echo "CODEBERG_INDEPENDENT_RUNNER_SMOKE=PASS"
