name: CORTES TikTok Codeberg lucas4 cloud primary
on:
  workflow_dispatch:
    inputs:
      smoke:
        type: boolean
        default: true
        description: "Validate exact account identity and signed OIDC without posting"
      publish:
        type: boolean
        default: false
        description: "Allow one authoritative fenced queue operation"
  schedule:
    - cron: '*/12 * * * *'
enable-openid-connect: true
permissions:
  contents: read
concurrency:
  group: cortes-tiktok-codeberg-lucas4
  cancel-in-progress: false
jobs:
  publisher:
    if: ${{ (forgejo.event_name == 'schedule' && vars.TIKTOK_CODEBERG_PRIMARY == 'true') || (forgejo.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.publish)) }}
    runs-on: codeberg-small
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    timeout-minutes: 5
    enable-openid-connect: true
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FORGEJO_REPOSITORY: ${{ forgejo.repository }}
      GITHUB_REF: ${{ forgejo.ref }}
      GITHUB_EVENT_NAME: ${{ forgejo.event_name }}
      TIKTOK_LUCASROSALEM4_STORAGE_STATE: ${{ secrets.TIKTOK_LUCASROSALEM4_STORAGE_STATE }}
      TIKTOK_CODEBERG_PREFLIGHT_ONLY: ${{ forgejo.event_name == 'workflow_dispatch' && inputs.smoke && !inputs.publish && '1' || '0' }}
      TIKTOK_LUCASROSALEM4_CLOUD_ENABLED: 'true'
    steps:
      - name: Checkout exact mirrored commit without Node dependencies
        shell: bash
        run: |
          set -eu
          git init -q .
          git remote add origin https://codeberg.org/UniversoAnthares/anthares-kwai-runner.git
          git fetch -q --depth 1 origin "${FORGEJO_SHA}" || git fetch -q --depth 200 origin main
          git checkout -q --detach "${FORGEJO_SHA}"
      - name: Install Python libraries; Chromium already pinned in container
        shell: bash
        run: |
          set -eu
          python -m pip install -q --disable-pip-version-check playwright==1.64.1 requests cryptography
      - name: Validate identity, obtain OIDC and execute a fenced queue step
        shell: bash
        run: |
          set -eu
          python -u tools/cortes_tiktok_lucasrosalem4_cloud_publish.py
