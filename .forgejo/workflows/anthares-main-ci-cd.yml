# CI/CD controlado do repositório Forgejo principal.
# Não publica vídeos, não aciona serviços sociais e não promove executores.
name: Anthares Forgejo principal - CI/CD isolado
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: anthares-forgejo-principal-ci-cd
  cancel-in-progress: false
jobs:
  ci:
    if: ${{ forgejo.repository == 'anthares-admin/anthares-kwai-runner' && forgejo.ref == 'refs/heads/main' }}
    runs-on: anthares-ci-main-host
    timeout-minutes: 10
    steps:
      - name: Checkout local imutável do mirror Hostinger
        shell: bash
        run: |
          set -euo pipefail
          test "${FORGEJO_REPOSITORY:-}" = 'anthares-admin/anthares-kwai-runner'
          test "${FORGEJO_REF:-}" = 'refs/heads/main'
          sha="${FORGEJO_SHA:-}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          bare="$HOME/.anthares-forgejo/data/repositories/anthares-admin/anthares-kwai-runner.git"
          test -d "$bare"
          test "$(git --git-dir="$bare" rev-parse refs/heads/main)" = "$sha"
          git --git-dir="$bare" cat-file -e "$sha^{commit}"
          git --git-dir="$bare" archive "$sha" \
            tools/git-provider-sync.sh \
            tools/ci_quota_cancel_first.py \
            tests/test_ci_quota_cancel_first.py | tar -xf -
          test -s tools/git-provider-sync.sh
          test -s tools/ci_quota_cancel_first.py
          test -s tests/test_ci_quota_cancel_first.py
      - name: Confirmar identidade e SHA
        shell: bash
        run: |
          set -euo pipefail
          test "${FORGEJO_REPOSITORY:-}" = 'anthares-admin/anthares-kwai-runner'
          test "${FORGEJO_REF:-}" = 'refs/heads/main'
          bare="$HOME/.anthares-forgejo/data/repositories/anthares-admin/anthares-kwai-runner.git"
          sha="$(git --git-dir="$bare" rev-parse refs/heads/main)"
          test "$sha" = "${FORGEJO_SHA:-}"
          echo "ANTHARES_FORGEJO_MAIN_IDENTITY=PASS sha=$sha"
      - name: Testar sintaxe e cancelamento por cota sem efeitos externos
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/git-provider-sync.sh
          # CloudLinux/Hostinger may provide modern Python outside PATH.
          # Select only an already-installed interpreter with Python >=3.10
          # and sqlite3; fail closed without a paid installer or fake CI PASS.
          py=''
          for candidate in \
            /opt/alt/python311/bin/python3.11 \
            /opt/alt/python312/bin/python3.12 \
            /opt/alt/python310/bin/python3.10 \
            python3.11 python3.12 python3.13 python3.10 python3; do
            if command -v "$candidate" >/dev/null 2>&1 &&
               "$candidate" -c 'import sys,sqlite3; sys.exit(0 if sys.version_info >= (3,10) else 1)' >/dev/null 2>&1; then
              py="$candidate"
              break
            fi
          done
          if [[ -z "$py" ]]; then
            echo 'ANTHARES_FORGEJO_PYTHON310_UNAVAILABLE' >&2
            exit 78
          fi
          echo "ANTHARES_FORGEJO_PYTHON_VERSION=$("$py" -c 'import platform;print(platform.python_version())')"
          "$py" -m py_compile tools/ci_quota_cancel_first.py
          "$py" -m unittest discover -s tests -p 'test_ci_quota_cancel_first.py' -v
          echo 'ANTHARES_FORGEJO_MAIN_CI=PASS'

  cd:
    needs: ci
    if: ${{ forgejo.repository == 'anthares-admin/anthares-kwai-runner' && forgejo.ref == 'refs/heads/main' }}
    runs-on: anthares-ci-main-host
    timeout-minutes: 5
    steps:
      - name: Instalar e ler comprovante privado de implantação
        shell: bash
        run: |
          set -euo pipefail
          test "${FORGEJO_REPOSITORY:-}" = 'anthares-admin/anthares-kwai-runner'
          test "${FORGEJO_REF:-}" = 'refs/heads/main'
          test -d "$HOME/.anthares-forgejo"
          test "$(id -u)" -ne 0
          bare="$HOME/.anthares-forgejo/data/repositories/anthares-admin/anthares-kwai-runner.git"
          test -d "$bare"
          sha="$(git --git-dir="$bare" rev-parse refs/heads/main)"
          test "$sha" = "${FORGEJO_SHA:-}"
          git --git-dir="$bare" cat-file -e "$sha^{commit}"
          export ANTHARES_CI_CD_PROVEN_SHA="$sha"
          py=''
          for candidate in \
            /opt/alt/python311/bin/python3.11 \
            /opt/alt/python312/bin/python3.12 \
            /opt/alt/python310/bin/python3.10 \
            python3.11 python3.12 python3.13 python3.10 python3; do
            if command -v "$candidate" >/dev/null 2>&1 &&
               "$candidate" -c 'import sys,sqlite3; sys.exit(0 if sys.version_info >= (3,10) else 1)' >/dev/null 2>&1; then
              py="$candidate"
              break
            fi
          done
          if [[ -z "$py" ]]; then
            echo 'ANTHARES_FORGEJO_PYTHON310_UNAVAILABLE' >&2
            exit 78
          fi
          "$py" - <<'PY'
          import json
          import os
          import pathlib
          import tempfile
          from datetime import datetime, timezone
          root = pathlib.Path.home() / ".anthares-forgejo" / "ci-main-cd"
          root.mkdir(mode=0o700, parents=True, exist_ok=True)
          os.chmod(str(root), 0o700)
          receipt = {
              "schema": "anthares-main-ci-cd-attestation-v1",
              "repository": "anthares-admin/anthares-kwai-runner",
              "commit_sha": os.environ["ANTHARES_CI_CD_PROVEN_SHA"],
              "ci": "pass",
              "deployment": "private-ci-artifact-only",
              "updated_utc": datetime.now(timezone.utc).isoformat(),
          }
          target = root / "current.json"
          fd, tmp = tempfile.mkstemp(prefix=".current-", suffix=".tmp", dir=str(root))
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as f:
                  json.dump(receipt, f, sort_keys=True)
                  f.write("\n")
                  f.flush()
                  os.fsync(f.fileno())
              os.chmod(tmp, 0o600)
              os.replace(tmp, str(target))
          finally:
              if os.path.exists(tmp):
                  os.unlink(tmp)
          recovered = json.loads(target.read_text(encoding="utf-8"))
          assert recovered == receipt
          assert recovered["commit_sha"] == os.environ["ANTHARES_CI_CD_PROVEN_SHA"]
          print("ANTHARES_FORGEJO_MAIN_CD=PASS sha=" + recovered["commit_sha"])
          PY
