# Isolated OpenClaw Gateway feasibility probe for Hostless free.
# Account-wide pool: 0.5 vCPU / 1024 MB, one replica, no workers/jobs.
# IMPORTANT: this manifest alone DOES NOT provide persistent SQLite storage.
# Do not connect production integrations or use real long-term credentials.
working_directory: infra/openclaw-hostless
build_context_directory: infra/openclaw-hostless
dockerfile_path: Dockerfile

build:
  system: docker

scaling:
  trigger: http_requests
  min_cpu: 0.5
  max_cpu: 0.5
  min_memory: 1024
  max_memory: 1024
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 10

health_check:
  type: http
  http_path: /healthz
  interval_in_seconds: 30
