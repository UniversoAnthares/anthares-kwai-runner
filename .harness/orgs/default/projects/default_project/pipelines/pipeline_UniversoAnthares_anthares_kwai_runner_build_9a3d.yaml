pipeline:
  id: pipeline_UniversoAnthares_anthares_kwai_runner_build_9a3d
  name: pipeline_UniversoAnthares_anthares_kwai_runner_build_9a3d
  stages:
    - name: Build and Test
      platform:
        os: linux
        arch: amd64
      runtime: cloud
      clone:
        enabled: true
      cache:
        enabled: false
      steps:
        - name: Python syntax check
          id: python_syntax
          run:
            shell: bash
            script: |-
              set -euo pipefail
              python3 -m compileall -q tests tools infra independent_session
        - name: Control publisher acceptance
          id: control_publisher_acceptance
          run:
            shell: bash
            script: |-
              set -euo pipefail
              for case in \
                happy \
                renew-then-publish \
                stale-start \
                stale-renew \
                stale-complete \
                crash-before-start \
                uncertain-no-republish \
                confirmed-idempotent \
                generation-rotates \
                duplicate-publisher-boundary
              do
                python3 tests/test_control_publisher_integration_final.py "$case"
              done
              echo HARNESS_CONTROL_PUBLISHER_OK=1
  tags:
    onboarding: "true"
