pipeline:
  id: pipeline_UniversoAnthares_anthares_kwai_runner_build_9a3d
  name: pipeline_UniversoAnthares_anthares_kwai_runner_build_9a3d
  stages:
    - name: Build and Test
      platform:
        os: linux
        arch: amd64
      runtime: cloud
      clone:
        enabled: true
      cache:
        enabled: false
      steps:
        - name: Python syntax check
          id: python_syntax
          run:
            shell: bash
            script: |-
              set -euo pipefail
              python3 -m compileall -q tests tools infra independent_session
        - name: Control publisher acceptance
          id: control_publisher_acceptance
          run:
            shell: bash
            script: |-
              set -euo pipefail
              rm -f .qa-control-publisher.log
              for case in \
                happy \
                renew-then-publish \
                stale-start \
                stale-renew \
                stale-complete \
                crash-before-start \
                uncertain-no-republish \
                confirmed-idempotent \
                generation-rotates \
                duplicate-publisher-boundary
              do
                python3 tests/test_control_publisher_integration_final.py "$case"
              done
              grep -q 'PUBLISH_HAPPY' .qa-control-publisher.log
              grep -q 'RENEW_THEN_PUBLISH_OK' .qa-control-publisher.log
              grep -q 'STALE_START_SUPPRESSED' .qa-control-publisher.log
              grep -q 'STALE_RENEW_SUPPRESSED' .qa-control-publisher.log
              grep -q 'STALE_COMPLETION_SUPPRESSED' .qa-control-publisher.log
              grep -q 'CRASH_BEFORE_START_OBSERVED' .qa-control-publisher.log
              grep -q 'UNCERTAIN_POST_PUBLISH_NO_REPUBLISH' .qa-control-publisher.log
              grep -q 'CONFIRMED_IDEMPOTENT_NO_REPUBLISH' .qa-control-publisher.log
              grep -q 'GENERATION_ROTATION_SEMANTICS_OK' .qa-control-publisher.log
              grep -q 'EXACTLY_ONE_PUBLISHER_PER_GENERATION' .qa-control-publisher.log
              echo HARNESS_CONTROL_PUBLISHER_OK=1
  tags:
    onboarding: "true"
