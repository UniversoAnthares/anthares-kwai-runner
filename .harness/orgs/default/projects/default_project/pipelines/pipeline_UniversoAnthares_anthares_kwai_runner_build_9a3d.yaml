pipeline:
  identifier: pipeline_UniversoAnthares_anthares_kwai_runner_build_9a3d
  name: pipeline_UniversoAnthares_anthares_kwai_runner_build_9a3d
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        type: CI
        spec:
          cache:
            enabled: false
          cloneCodebase: true
          buildIntelligence:
            enabled: false
          # Harness Cloud uses the provider-managed runner, not a Kubernetes
          # connector. KubernetesDirect previously referenced a Docker image
          # connector here and therefore had no valid target Kubernetes cluster.
          # Free Harness Cloud allowances apply; no self-hosted delegate.
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  identifier: Python_syntax_check
                  name: Python syntax check
                  type: Run
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      python3 -m compileall -q tests
              - step:
                  identifier: Control_publisher_acceptance
                  name: Control publisher acceptance
                  type: Run
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      for case in \
                        happy \
                        renew-then-publish \
                        stale-start \
                        stale-renew \
                        stale-complete \
                        crash-before-start \
                        uncertain-no-republish \
                        confirmed-idempotent \
                        generation-rotates \
                        duplicate-publisher-boundary
                      do
                        python3 tests/test_control_publisher_integration_final.py "$case"
                      done
                      echo HARNESS_CONTROL_PUBLISHER_OK=1
  properties:
    ci:
      codebase:
        connectorRef: connector_Github_ab52
        build: <+input>
        repoName: UniversoAnthares/anthares-kwai-runner
