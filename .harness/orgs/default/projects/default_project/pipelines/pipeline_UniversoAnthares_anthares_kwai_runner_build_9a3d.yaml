pipeline:
  identifier: pipeline_UniversoAnthares_anthares_kwai_runner_build_9a3d
  name: pipeline_UniversoAnthares_anthares_kwai_runner_build_9a3d
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        type: CI
        spec:
          cache:
            enabled: false
          cloneCodebase: true
          buildIntelligence:
            enabled: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  identifier: Python_syntax_check
                  name: Python syntax check
                  type: Run
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      python3 -m compileall -q tests
              - step:
                  identifier: Harness_Neon_quota_contract
                  name: Harness and Neon quota contract
                  type: Run
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      python3 --version
                      python3 -m unittest -v \
                        tests.test_ci_quota_cancel_first \
                        tests.test_ci_quota_neon_ledger \
                        tests.test_ci_quota_provider_adapters \
                        tests.test_ci_quota_harness_fenced_integration \
                        tests.test_ci_quota_harness_watcher
                      echo HARNESS_NEON_CANCEL_FIRST_TESTS_PASS=36
                      if command -v node >/dev/null 2>&1; then
                        node tests/test_ci_quota_harness_controller.mjs
                      else
                        echo HARNESS_NEON_CONTROLLER_NODE_TESTS_SKIPPED_RUNTIME_UNAVAILABLE=1
                      fi
              - step:
                  identifier: Control_publisher_acceptance
                  name: Control publisher acceptance
                  type: Run
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      for case in \
                        happy \
                        renew-then-publish \
                        stale-start \
                        stale-renew \
                        stale-complete \
                        crash-before-start \
                        uncertain-no-republish \
                        confirmed-idempotent \
                        generation-rotates \
                        duplicate-publisher-boundary
                      do
                        python3 tests/test_control_publisher_integration_final.py "$case"
                      done
                      echo HARNESS_CONTROL_PUBLISHER_OK=1
  properties:
    ci:
      codebase:
        connectorRef: connector_Github_ab52
        build:
          type: branch
          spec:
            branch: main
        repoName: UniversoAnthares/anthares-kwai-runner
# Git-backed Harness pipeline resync marker (2026-10-27); no runtime changes.
